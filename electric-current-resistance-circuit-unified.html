<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전류·저항·직렬·병렬 회로 통합 실험실</title><style>
:root{color-scheme:dark;--bg:#070d16;--panel:#101c2b;--line:#2b4055;--ink:#e7f1ff;--muted:#a6bed2;--cyan:#6be5e6;--yellow:#ffd18b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px}h1{margin:0;font-size:clamp(17px,2vw,25px)}h2{font-size:17px;margin:0 0 7px}nav{display:flex;gap:5px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:thin}button,select{font:inherit;color:var(--ink);background:#20344a;border:1px solid #41586f;border-radius:7px;padding:7px 10px;cursor:pointer}nav button{white-space:nowrap}button[aria-selected=true],button.on{background:#10576b;border-color:#68d9e7}button:focus-visible,select:focus-visible{outline:2px solid var(--cyan)}button:disabled{opacity:.45}main{display:grid;grid-template-columns:minmax(225px,25%) minmax(0,1fr);gap:9px;padding:0 12px}.panel{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px}.controls{max-height:calc(100dvh - 130px);overflow:auto}.stage{display:flex;flex-direction:column;gap:7px}.scene{height:clamp(260px,calc(100dvh - 252px),670px);border:1px solid var(--line);border-radius:9px;background:#081525;overflow:hidden}canvas{width:100%;height:100%;display:block}.field{margin:6px 0}.field label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.field output{font-weight:bold;color:var(--cyan)}input[type=range]{width:100%;accent-color:var(--cyan);height:18px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:5px}.row label{font-size:13px;color:var(--muted)}input[type=checkbox]{accent-color:var(--cyan)}.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:5px}.meter{min-width:0;background:#172a3c;padding:6px 8px;border-radius:7px}.meter small{display:block;color:var(--muted)}.meter b{color:var(--cyan);font-size:clamp(13px,1.4vw,19px);overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted);margin:3px 0}.status{font-size:13px;color:#ffdb99;min-height:1.4em}.formula{font-size:13px;color:#e7eaf4}.details{max-width:980px;line-height:1.7}.details h3{color:var(--cyan);margin-bottom:3px}.details p{margin-top:0}.tablewrap{overflow:auto;max-height:160px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;white-space:nowrap;padding:5px;border-bottom:1px solid var(--line)}footer{padding:7px;text-align:center;color:#a0b4c8;font-size:11px}a{color:inherit}[hidden]{display:none!important}@media(max-width:680px){header{padding:8px}nav{padding:0 7px 6px}main{display:flex;flex-direction:column;padding:0 7px}.stage{order:0}.controls{max-height:none;order:1}.scene{height:clamp(245px,42dvh,400px)}.meters{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:8px}}
</style></head><body><header><h1>⚡ 전류·저항·직렬·병렬 회로 통합 실험실</h1><button id="full">⛶ 전체화면</button></header><nav id="tabs" role="tablist" aria-label="실험 선택"></nav><main><aside id="controls" class="panel controls"></aside><section class="panel stage"><h2 id="heading"></h2><div id="scene" class="scene"><canvas id="canvas" aria-label="회로와 전류 흐름 시뮬레이션"></canvas></div><div id="meters" class="meters"></div><div id="formula" class="formula"></div><div id="status" class="status" aria-live="polite"></div><p id="hint" class="note"></p><div id="details" class="details" hidden></div></section></main><footer>© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,n=3)=>!Number.isFinite(x)?'—':x!==0&&(Math.abs(x)<.001||Math.abs(x)>=10000)?x.toExponential(2):Number(x.toFixed(n)).toString();
const modes=[['current','전류·전자 이동'],['ohm','옴의 법칙'],['series','직렬 회로'],['parallel','병렬 회로'],['mixed','혼합 회로'],['meter','계측기 연결'],['graphs','그래프·비교'],['concept','개념 설명']];
const defaults=()=>({V:12,R1:6,R2:12,R3:18,count:2,closed:true,b2:true,b3:true,carrier:'electron',Q:6,T:3,sign:1,area:1,base:'parallel',amp:'series',volt:'parallel',target:1,speed:1});
let s=defaults(),mode='current',lastExperiment='current',running=false,t=0,flowTime=0,last=0,ended=false,saved={A:null,B:null},records=[],graphType='current',locked=true,scaleI=36,scaleQ=20,scaleT=20,scaleCurrent=20,notice='준비 · 시작을 누르세요.',dirty=true;
function circuit(a,type){
 const V=a.V,r=[a.R1,a.R2,a.R3],n=type==='ohm'?1:type==='mixed'?3:a.count,enabled=[true,a.b2,a.b3];
 const active=r.slice(0,n).map((_,i)=>enabled[i]);
 let req=Infinity,I=0,branch=[0,0,0],drop=[0,0,0];
 if(type==='ohm'){req=r[0];if(a.closed){I=V/req;branch[0]=I;drop[0]=V}}
 else if(type==='series'){if(active.every(Boolean))req=r.slice(0,n).reduce((x,y)=>x+y,0);if(a.closed&&Number.isFinite(req)){I=V/req;for(let i=0;i<n;i++){branch[i]=I;drop[i]=I*r[i]}}}
 else if(type==='parallel'){const G=r.slice(0,n).reduce((sum,R,i)=>sum+(active[i]?1/R:0),0);req=G?1/G:Infinity;if(a.closed){for(let i=0;i<n;i++)if(active[i]){branch[i]=V/r[i];drop[i]=V}I=branch.reduce((x,y)=>x+y,0)}}
 else if(type==='mixed'){const G=(a.b2?1/r[1]:0)+(a.b3?1/r[2]:0);req=G?r[0]+1/G:Infinity;if(a.closed&&G){I=V/req;branch[0]=I;drop[0]=I*r[0];const vp=V-drop[0];for(let i=1;i<3;i++)if(enabled[i]){branch[i]=vp/r[i];drop[i]=vp}}}
 return {V,r,n,req,I,branch,drop,power:branch.map((i,k)=>i*i*r[k]),active};
}
function actualType(){return mode==='meter'?s.base:mode}
function meterError(){return mode==='meter'?(s.amp==='parallel'?'전류계를 저항 양단에 병렬 연결하면 단락 위험이 있습니다. 가상 전원을 차단했습니다.':s.volt==='series'?'전압계를 직렬 연결하면 이상적인 전압계는 회로를 개방합니다. 가상 전원을 차단했습니다.':''):''}
function data(){const a=meterError()?{...s,closed:false}:s;return circuit(a,actualType())}
function micro(a,time){const I=a.sign*a.Q/a.T,q=I*clamp(time,0,a.T),drift=Math.abs(I)/(8.5e28*1.602176634e-19*a.area*1e-6);return {I,q,drift}}
function snap(){const type=mode==='graphs'?(graphType==='current'?'current':lastExperiment==='current'?'ohm':lastExperiment==='meter'?s.base:lastExperiment):lastExperiment==='meter'?s.base:lastExperiment;const bad=lastExperiment==='meter'&&(s.amp==='parallel'||s.volt==='series');return {type,s:{...s,closed:bad?false:s.closed}}}
function resetRun(msg='조건 변경 · 시작을 누르세요.'){running=false;ended=false;t=0;flowTime=0;notice=msg;dirty=true}
function changeMode(m){if(mode===m)return;mode=m;if(m==='graphs')graphType=lastExperiment==='current'?'current':'iv';else if(m!=='concept')lastExperiment=m;resetRun('준비 · 시작을 누르세요.');build()}
for(const [id,label] of modes){const b=document.createElement('button');b.dataset.mode=id;b.textContent=label;b.setAttribute('role','tab');b.onclick=()=>changeMode(id);$('tabs').append(b)}
$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(z=>z[0]===mode),j=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;changeMode(modes[j][0]);$('tabs').children[j].focus()});
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
const units={V:'V',R1:'Ω',R2:'Ω',R3:'Ω',Q:'C',T:'s',area:'mm²',speed:'×'};
function slider(id,label,min,max,step){return '<div class="field"><label for="'+id+'">'+label+'<output id="'+id+'out">'+fmt(s[id])+' '+units[id]+'</output></label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>'}
function button(id,label){return '<button id="'+id+'">'+label+'</button>'}
function select(id,opts,val){return '<select aria-label="'+id+'" id="'+id+'">'+opts.map(([a,b])=>'<option value="'+a+'" '+(String(a)===String(val)?'selected':'')+'>'+b+'</option>').join('')+'</select>'}
function check(id,label){return '<label><input id="'+id+'" type="checkbox" '+(s[id]?'checked':'')+'>'+label+'</label>'}
function bind(id,fn,event='click'){const el=$(id);if(el)el.addEventListener(event,fn)}
function build(){
 for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}
 const cc=$('controls'),dd=$('details');cc.hidden=mode==='concept';$('scene').hidden=mode==='concept';$('meters').hidden=mode==='concept';dd.hidden=mode!=='concept';let v='<h2>실험 조건</h2>';
 if(mode==='current'){v+=slider('Q','통과 전하량의 크기',0,20,.5)+slider('T','측정 시간',1,20,.5)+slider('area','도선 단면적',.1,5,.1)+'<div class="row">'+select('sign',[[1,'전류 → 오른쪽'],[-1,'전류 ← 왼쪽']],s.sign)+'</div><p class="note">구리의 자유전자 수밀도 8.5×10²⁸ m⁻³ 가정. 표류 운동은 크게 확대하여 표현합니다.</p>'}
 if(['ohm','series','parallel','mixed','meter'].includes(mode)){
  if(mode==='meter')v+='<div class="row">'+select('base',[['ohm','단일 저항'],['series','직렬'],['parallel','병렬']],s.base)+'</div>';
  const type=actualType();v+=slider('V','전원 전압',-24,24,.5)+slider('R1','저항 R₁',2,40,1);
  if(type!=='ohm'){v+=slider('R2','저항 R₂',2,40,1);if(type==='mixed'||s.count===3)v+=slider('R3','저항 R₃',2,40,1);if(type!=='mixed')v+='<div class="row">'+select('count',[[2,'저항 2개'],[3,'저항 3개']],s.count)+'</div>';v+='<div class="row">'+check('b2','R₂ 연결')+(type==='mixed'||s.count===3?check('b3','R₃ 연결'):'')+'</div>'}
  v+='<div class="row">'+check('closed','전원 스위치 닫힘')+button('reverse','극성 반전')+'</div>';
  if(mode==='ohm')v+='<div class="row">'+button('twiceV','전압 ×2')+button('twiceR','저항 ×2')+'</div>';
  if(mode==='meter'){v+='<p class="note">계기 연결을 선택하고 올바른 방법을 찾아보세요.</p><div class="field"><label>전류계 A</label>'+select('amp',[['series','회로에 직렬'],['parallel','저항에 병렬 (오류)']],s.amp)+'</div><div class="field"><label>전압계 V</label>'+select('volt',[['parallel','저항에 병렬'],['series','회로에 직렬 (오류)']],s.volt)+'</div><div class="field"><label>전압 측정 대상</label>'+select('target',[[1,'R₁'],...(type==='ohm'?[]:[[2,'R₂'],...(s.count===3?[[3,'R₃']]:[])])],s.target)+'</div>'}
 }
 if(!['graphs','concept'].includes(mode))v+='<div class="row">'+select('carrier',[['electron','전자 이동'],['current','관습적 전류']],s.carrier)+'</div>'+slider('speed','관찰 배속',.25,3,.25)+'<div class="row">'+button('play','▶ 시작')+button('restart','↺ 처음부터')+'</div>';
 if(mode==='graphs'){v+='<div class="row">'+select('graphType',[['current','Q–t · I–t'],['iv','I–V · P–V']],graphType)+'</div><div class="row">'+button('scale','현재·A/B 범위 맞춤')+button('lock',locked?'축 고정 해제':'축 고정')+button('wide','전체 범위')+'</div><p class="note">축 고정 상태에서 전압 및 저항 조건의 경향을 비교하세요. 범위 초과는 곡선이 끊겨 표시됩니다.</p><div id="records" class="tablewrap"></div>'}
 if(mode!=='concept')v+='<hr style="border:0;border-top:1px solid #2b4055"><div class="row">'+button('saveA','A 저장')+button('saveB','B 저장')+button('record','측정 기록')+button('clear','기록 지우기')+button('reset','전체 초기화')+'</div>';
 cc.innerHTML=v;
 if(mode==='concept'){dd.innerHTML='<h3>1. 전류와 전자의 이동</h3><p>I = ΔQ/Δt. 관습적 전류는 양전하 이동 방향이며 금속 자유전자의 평균 표류 방향과 반대이다. |I| = neAv<sub>d</sub>. 전기 신호의 전달 속력과 전자의 표류 속력은 다르다.</p><h3>2. 옴의 법칙</h3><p>온도가 일정한 옴성 저항에서 V=IR. I–V 그래프의 기울기는 1/R이다. 전압 극성을 뒤집으면 전류의 방향도 반대가 된다.</p><h3>3. 직렬·병렬·혼합</h3><p>직렬: R합=R₁+R₂+… ; 모든 저항의 전류가 같고 전압강하의 합이 전원 전압이다. 병렬: 1/R합=1/R₁+1/R₂+… ; 연결된 가지의 전압이 같고 I합=I₁+I₂+… . 혼합 회로에서는 R₁과 R₂∥R₃가 직렬이다.</p><h3>4. 계측기</h3><p>이상적 전류계의 내부저항은 0, 전압계의 내부저항은 무한대이다. 전류계는 직렬, 전압계는 측정 대상 양단에 병렬 연결한다. 잘못 연결하면 단락 또는 개방이 생긴다. 실제 회로에서는 전원을 끄고 교사가 지도한다.</p><h3>5. 전력</h3><p>저항에서 P=VI=I²R. 전압 일정 시 P=V²/R. 전류 일정 시 P=I²R. 동일 전압의 병렬 회로에서는 저항이 작을수록 전류와 소비 전력이 크다.</p><h3>탐구 질문</h3><p>① 전압을 두 배로 하면 전류는? ② 병렬 가지를 끊으면 다른 가지의 전류는? ③ 혼합 회로에서 가지를 끊으면 R₁의 전류는? ④ 계측기를 잘못 연결하면 왜 문제가 생길까?</p><p class="note">이상적인 전지·도선·옴성 저항 모형이다. 저항기의 색띠는 장식용이며 저항값은 숫자로 읽는다. 애니메이션 점은 실제 전자 수가 아니라 전하 흐름의 시각적 표시이며, 도선 내부 표류 속력의 수치는 가정한 구리 모형을 사용한다.</p>'}
 for(const id of Object.keys(units))bind(id,e=>{s[id]=+e.target.value;$(id+'out').textContent=fmt(s[id])+' '+units[id];if(id!=='speed')resetRun();refresh();dirty=true},'input');
 for(const id of ['sign','carrier','base','count','amp','volt','target'])bind(id,e=>{s[id]=['sign','count','target'].includes(id)?+e.target.value:e.target.value;if(id==='base'||id==='count')s.target=Math.min(s.target,s.base==='ohm'?1:s.count);resetRun();build()},'change');
 for(const id of ['closed','b2','b3'])bind(id,e=>{s[id]=e.target.checked;dirty=true;if(!s.closed){running=false;notice='전원 스위치 열림'}else notice='연결 조건 변경';refresh()},'change');
 bind('reverse',()=>{s.V=-s.V;resetRun();build()});bind('twiceV',()=>{s.V=clamp(s.V*2,-24,24);resetRun();build()});bind('twiceR',()=>{s.R1=Math.min(40,s.R1*2);resetRun();build()});
 bind('play',()=>{const error=meterError();if(error){notice=error;running=false;refresh();return}if(mode!=='current'&&!s.closed){notice='먼저 전원 스위치를 닫으세요.';refresh();return}if(running){running=false;notice='일시정지'}else{if(ended){t=0;flowTime=0;ended=false}running=true;notice='실험 진행 중'}dirty=true;refresh()});
 bind('restart',()=>{resetRun('처음 상태로 돌아갔습니다.');refresh()});
 for(const k of ['A','B'])bind('save'+k,()=>{saved[k]=snap();notice='조건 '+k+' 저장';dirty=true;refresh()});
 bind('record',()=>{const a=snap();records.push(a);if(records.length>30)records.shift();notice='이론 모형 측정값 기록 '+records.length+'개';refresh()});
 bind('clear',()=>{records=[];saved={A:null,B:null};notice='기록을 지웠습니다.';refresh();dirty=true});
 bind('reset',()=>{s=defaults();saved={A:null,B:null};records=[];locked=true;wide();resetRun('전체 초기화 완료');build()});
 bind('graphType',e=>{graphType=e.target.value;dirty=true;build()},'change');bind('lock',()=>{locked=!locked;dirty=true;build()});bind('scale',()=>{fit();locked=true;dirty=true;build()});bind('wide',()=>{wide();locked=true;dirty=true;build()});
 refresh();resize()
}
function refresh(){
 $('heading').textContent=modes.find(z=>z[0]===mode)[1];let a=[],formula='',hint='';
 if(mode==='current'){const d=micro(s,t);a=[['설정 전류',fmt(d.I)+' A'],['순통과 전하량',fmt(d.q)+' C'],['경과 시간',fmt(t,2)+' s'],['평균 표류 속력',fmt(d.drift*1000,5)+' mm/s']];formula='I = ΔQ/Δt = '+fmt(s.sign*s.Q)+' C / '+fmt(s.T)+' s = '+fmt(d.I)+' A';hint='표시용 점이 단면을 통과합니다. 부호는 오른쪽을 양의 방향으로 정한 순전하량의 부호입니다.'}
 else if(['ohm','series','parallel','mixed','meter'].includes(mode)){const d=data();a=[['전원 전압',fmt(d.V)+' V'],['등가저항',Number.isFinite(d.req)?fmt(d.req)+' Ω':'∞ (개방)'],['전체 전류',fmt(d.I)+' A']];for(let i=0;i<d.n;i++)a.push(['R'+(i+1)+' 전류 / 전압',!d.active[i]?'연결 끊김':fmt(d.branch[i])+' A / '+fmt(d.drop[i])+' V']);a.push(['총 소비 전력',fmt(d.power.reduce((x,y)=>x+y,0))+' W']);formula=actualType()==='series'?'직렬: I = I₁ = I₂'+(d.n===3?' = I₃':'')+' · V = ΣVᵢ':actualType()==='parallel'?'병렬: I = ΣIᵢ · 연결된 가지의 전압은 같음':actualType()==='mixed'?'혼합: R₁ + (R₂∥R₃) · I₁ = I₂ + I₃':'I = V/R';hint='민트색 점 = '+(s.carrier==='electron'?'전자 (관습적 전류 반대)':'관습적 전류')+' · 같은 도선 굵기 가정. 점의 유량은 전류 크기에 비례하는 표현 모형입니다.';if(mode==='meter'){a.push(['전류계',meterError()?'측정 중단':fmt(d.I)+' A'],['전압계',meterError()||!d.active[s.target-1]?'—':fmt(d.drop[s.target-1])+' V']);hint=meterError()||'A는 전체 회로에 직렬, V는 선택 저항에 병렬 연결합니다.'}}

function pathLength(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
