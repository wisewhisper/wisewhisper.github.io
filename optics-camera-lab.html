 실험 모형"></canvas><div class="transport"><button id="play" class="primary">▶ 시작</button><button id="pause">일시정지</button><button id="reset">초기화</button><span id="status">준비</span></div><div class="summary"><div><b>핵심 원리</b><p id="principle"></p></div><div><b>관찰 방법</b><p id="observe"></p></div><div><b>모형의 가정</b><p id="assume"></p></div></div></section><aside><h2>실험 조작</h2><div id="controls"></div><h2>실시간 결과</h2><div id="metrics" class="metrics"></div><p class="question" id="question"></p><p class="note" id="info"></p></aside></div><section id="learn" class="learn" role="tabpanel" hidden></section></main><script id="optics-helpers">'use strict';
const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d'),PI=Math.PI,rad=x=>x*PI/180,deg=x=>x*180/PI,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,d=2)=>Number.isFinite(x)?Number(x).toFixed(d):'∞',norm=v=>Math.hypot(...v),dot=(a,b)=>a[0]*b[0]+a[1]*b[1],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],mul=(v,k)=>[v[0]*k,v[1]*k],unit=v=>mul(v,1/(norm(v)||1)),rot=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a)],cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
const GOLD='#ffd37c',MINT='#69e7dc',BLUE='#6fb9fd',MUTED='#b6c9dd',WHITE='#ebf5ff';
function light(w){if(w<440)return '#a477ff';if(w<480)return '#648aff';if(w<500)return '#35caff';if(w<570)return '#51e68b';if(w<590)return '#ffe35e';if(w<620)return '#ff9a4d';return '#ff5656'}
function spectralRGB(w){let r=0,g=0,b=0;if(w<440){r=(440-w)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=(510-w)/20}else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=(645-w)/65}else r=1;let k=w<420?.35+.65*(w-380)/40:w>690?1-.65*(w-690)/70:1;return [r,g,b].map(x=>Math.max(0,x*k))}
function txt(x,y,t,col=WHITE,sz=13,align='left',bold=false){c.fillStyle=col;c.font=(bold?700:500)+' '+sz+'px system-ui,sans-serif';c.textAlign=align;c.textBaseline='middle';c.fillText(String(t),x,y)}
function rect(x,y,w,h,fill,stroke){if(fill){c.fillStyle=fill;c.fillRect(x,y,w,h)}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.strokeRect(x,y,w,h)}}
function line(a,b,col=MUTED,width=1,dash=[]){c.beginPath();c.setLineDash(dash);c.strokeStyle=col;c.lineWidth=width;c.moveTo(...a);c.lineTo(...b);c.stroke();c.setLineDash([])}
function circ(x,y,r,fill,stroke,width=1){c.beginPath();c.arc(x,y,Math.max(0,r),0,2*PI);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function poly(p,col,width=1.6,dash=[]){if(p.length<2)return;c.beginPath();c.setLineDash(dash);c.strokeStyle=col;c.lineWidth=width;p.forEach((a,i)=>i?c.lineTo(...a):c.moveTo(...a));c.stroke();c.setLineDash([])}
function polygon(p,fill,stroke){c.beginPath();p.forEach((a,i)=>i?c.lineTo(...a):c.moveTo(...a));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1.4;c.stroke()}}
function arrow(a,b,col=GOLD,w=2){line(a,b,col,w);const d=unit(sub(b,a));if(norm(sub(b,a))<5)return;polygon([b,add(b,rot(mul(d,-9),.45)),add(b,rot(mul(d,-9),-.45))],col)}
function glow(p,col,r=4){c.save();c.shadowColor=col;c.shadowBlur=10;circ(...p,r,col);c.restore()}
function ray(points,p,col=GOLD,width=2.5){if(points.length<2)return;poly(points,col,1,[4,5]);const len=points.slice(1).map((b,i)=>norm(sub(b,points[i]))),total=len.reduce((a,b)=>a+b,0);let remain=clamp(p,0,1)*total,pos=points[0];for(let i=0;i<len.length;i++){const a=points[i],b=points[i+1],l=len[i];if(l<1e-8)continue;const f=Math.min(1,remain/l);pos=add(a,mul(sub(b,a),f));if(f>0)line(a,pos,col,width);remain-=l;if(remain<0)break}glow(pos,col,3.5)}

function panels(a,b,f,g){if(W<650){const h=(H-6)/2;panel(0,0,W,h,a,f);panel(0,h+6,W,h,b,g)}else{const w=(W-6)/2;panel(0,0,w,H,a,f);panel(w+6,0,w,H,b,g)}}
function plot(fn,xmin,xmax,ymin,ymax,xlabel,ylabel,col=MINT,markers=[]){const x=47,y=52,w=393,h=258;for(let i=0;i<=4;i++){const xx=x+w*i/4,yy=y+h*i/4;line([x,yy],[x+w,yy],'#2b4056',.8);line([xx,y],[xx,y+h],'#2b4056',.8);txt(xx,y+h+15,fmt(xmin+(xmax-xmin)*i/4,Math.abs(xmax-xmin)<10?1:0),MUTED,11,'center');txt(x-5,yy,fmt(ymax-(ymax-ymin)*i/4,ymax-ymin<=2?2:0),MUTED,10,'right')}const X=v=>x+(v-xmin)/(xmax-xmin)*w,Y=v=>y+h-(v-ymin)/(ymax-ymin)*h;line([x,y],[x,y+h],MUTED);line([x,y+h],[x+w,y+h],MUTED);c.save();c.beginPath();c.rect(x,y,w,h);c.clip();let p=[];for(let i=0;i<=600;i++){let v=xmin+(xmax-xmin)*i/600,z=fn(v);if(Number.isFinite(z))p.push([X(v),Y(z)]);else{poly(p,col,2);p=[]}}poly(p,col,2);for(const m of markers)if(m.x>=xmin&&m.x<=xmax&&Number.isFinite(m.y)){line([X(m.x),y],[X(m.x),y+h],m.color||GOLD,1,[4,4]);circ(X(m.x),Y(m.y),4,m.color||GOLD)}c.restore();txt(245,344,xlabel,MUTED,12,'center');txt(7,39,ylabel,MUTED,11)}
function lens(x,y,h,type=1){const p=[[x,y-h],[x+(type>0?12:-8),y-h*.70],[x+(type>0?16:-11),y],[x+(type>0?12:-8),y+h*.70],[x,y+h],[x-(type>0?12:-8),y+h*.70],[x-(type>0?16:-11),y],[x-(type>0?12:-8),y-h*.70]];polygon(p,'#69cffa26','#82c9eb');line([x,y-h],[x,y+h],BLUE,.8,[3,3])}
function interfaceRay(d,n,n1,n2){const u=unit(d),nn=unit(n);const eta=n1/n2,cos=dot(u,nn),t=sub(u,mul(nn,cos)),tt=mul(t,eta),q=1-dot(tt,tt);return q<0?null:unit(add(tt,mul(nn,Math.sqrt(Math.max(0,q)))))}

</script><script id="optics-model">
const blurLimit=.03;
function camera(s){const f=s.f,a=s.a*1000,u=s.focus*1000,b=a*f/(a-f),sensor=u*f/(u-f),D=f/s.N,blur=D*Math.abs(1-sensor/b),H=f*f/(s.N*blurLimit)+f,near=(H-f)*u/(H+u-2*f),far=H>u?(H-f)*u/(H-u):Infinity,rel=(+s.time)/(s.N*s.N)*16/.008;return {b,sensor,D,blur,H,near,far,rel,EV:Math.log2(s.N*s.N/(+s.time)),m:-b/a}}
function cameraDraw(i,s,p){let q=camera(s);panels('렌즈 · 조리개 · 이미지 센서',i===2?'거리별 번짐 지름':'센서 영상의 선명도와 밝기',()=>{const X=154,Y=189,k=225/Math.max(q.b,q.sensor),xb=X+q.b*k,xs=X+q.sensor*k,ap=clamp(q.D*k/2,2,90);rect(X-7,52,293,279,'#172d40','#527390');lens(X,Y,98,1);rect(X+5,80,7,109-ap,'#7890a5');rect(X+5,189+ap,7,109-ap,'#7890a5');line([xs,64],[xs,309],MINT,4);line([xb,64],[xb,309],GOLD,1,[4,4]);line([15,Y],[445,Y],MUTED,1,[4,4]);for(let y of [Y-ap,Y,Y+ap]){let target=Y+20;ray([[18,127],[X,y],[442,y+(target-y)*(442-X)/(xb-X)]],p,GOLD,1.8)}txt(xs,344,'센서',MINT,12,'center');txt(xb,322,'상 초점',GOLD,12,'center');txt(230,367,'물체 거리 축약 · 상과 센서 위치 동일 축척',MUTED,11,'center')},()=>{if(i===2){let lo=Math.max(.2,s.focus*.25),hi=Math.max(lo+.5,s.focus*2.5),fn=x=>camera({...s,a:x}).blur;plot(fn,lo,hi,0,Math.max(.06,fn(lo),fn(hi)),'물체 거리 (m)','번짐 (mm)',MINT,[{x:s.focus,y:0}]);txt(230,367,'허용 착란원 0.03 mm',GOLD,12,'center')}else{rect(65,51,330,255,'#13283d','#5994aa');c.save();c.globalAlpha=clamp(Math.sqrt(q.rel)*.55,.04,1);c.filter='blur('+clamp(q.blur*16,0,18)+'px)';rect(73,59,314,239,'#658bc2');polygon([[73,267],[146,110],[244,266]],'#5c9478');polygon([[180,266],[284,82],[387,266]],'#486a60');circ(338,98,23,'#fff1b0');rect(73,260,314,38,'#386253');c.restore();txt(230,325,'센서 영상 모식도',WHITE,14,'center');txt(230,350,'상대 노출 '+fmt(q.rel,2)+'배 · 번짐 '+fmt(q.blur,3)+' mm',MINT,13,'center',true)}})}
const cs=[R('f','초점 거리',18,100,1,50,'mm'),R('a','물체 거리',.3,20,.1,3,'m'),R('focus','초점 설정 거리',.3,20,.1,3,'m'),R('N','조리개 f값',1.4,16,.2,4),Q('time','셔터 속도','0.008',[['0.001','1/1000 s'],['0.002','1/500 s'],['0.004','1/250 s'],['0.008','1/125 s'],['0.016','1/62.5 s'],['0.0333333333333','1/30 s'],['0.1','1/10 s']])];
const LAB={name:'카메라의 광학 원리',tabs:[{name:'상의 형성',controls:cs,principle:'렌즈 식 1/f=1/a+1/b로 센서 위치를 맞춘다.',observe:'물체 거리와 초점 설정을 변화시켜 번짐을 확인한다.',assume:'얇은 렌즈, 물체 거리 축약.',question:'물체가 가까워지면 상거리는?'},{name:'조리개',controls:cs,principle:'구경 D=f/N, 상대 광량은 1/N²에 비례한다.',observe:'조리개를 조이면 밝기와 번짐이 어떻게 변하는지 확인한다.',assume:'동일 장면 밝기, 회절 생략.',question:'f/4에서 f/8로 바꾸면 광량은?'},{name:'피사계 심도',controls:cs,principle:'허용 착란원보다 작은 번짐을 선명하다고 정한다.',observe:'조리개와 초점 설정을 바꾸어 선명한 거리 범위를 비교한다.',assume:'허용 착란원 0.03 mm.',question:'조리개가 작아지면 피사계 심도는?'},{name:'노출',controls:cs,principle:'노출량 ∝ t/N², EV=log₂(N²/t).',observe:'셔터와 조리개를 바꾸어 영상 밝기를 비교한다.',assume:'ISO 고정, f/4·1/125초를 기준.',question:'셔터 시간이 2배면 노출은?'}],draw:cameraDraw,metrics:(i,s)=>{let q=camera(s);return i===2?[['근거리 한계',fmt(q.near/1000,2)+' m'],['원거리 한계',fmt(q.far/1000,2)+' m'],['과초점 거리',fmt(q.H/1000,2)+' m'],['번짐',fmt(q.blur,3)+' mm']]:i===3?[['노출값 EV',fmt(q.EV)],['상대 노출',fmt(q.rel,3)+'배'],['구경',fmt(q.D)+' mm'],['번짐',fmt(q.blur,3)+' mm']]:[['상거리',fmt(q.b)+' mm'],['센서 거리',fmt(q.sensor)+' mm'],['번짐',fmt(q.blur,3)+' mm'],['횡배율',fmt(q.m,4)]]},detail:'실제 카메라 렌즈군·센서 감마·자동 노출을 단순화했다. 피사계 심도는 물체 공간에서 정의한다.'};
</script><script id="optics-engine">let W=980,H=460,tab=0,running=false,last=null;const states=LAB.tabs.map(t=>Object.fromEntries(t.controls.map(k=>[k.key,k.value]))),progress=LAB.tabs.map(()=>0);

function resize(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);c.setTransform(d,0,0,d,0,0);draw()}
function stop(){running=false;last=null}
function controls(){const root=$('controls');root.replaceChildren();const t=LAB.tabs[tab],s=states[tab];for(const k of t.controls){const row=document.createElement('div');row.className='control';const l=document.createElement('label');l.htmlFor='ctl_'+k.key;l.textContent=k.label;row.append(l);const el=document.createElement(k.options?'select':'input');el.id='ctl_'+k.key;if(k.options){for(const [v,t] of k.options){const o=document.createElement('option');o.value=v;o.textContent=t;el.append(o)}}else{el.type='range';el.min=k.min;el.max=k.max;el.step=k.step;const out=document.createElement('output');out.id='out_'+k.key;l.append(out)}el.value=s[k.key];row.append(el);root.append(row);el.addEventListener(k.options?'change':'input',()=>{s[k.key]=k.options?el.value:+el.value;stop();progress[tab]=0;refresh();draw()})}}
function refresh(){if(tab===LAB.tabs.length)return;const t=LAB.tabs[tab],s=states[tab],p=progress[tab];for(const k of t.controls){const e=$('out_'+k.key);if(e)e.textContent=s[k.key]+(k.unit?' '+k.unit:'')}const data=LAB.metrics(tab,s,p);$('metrics').replaceChildren();for(const [k,v] of data){const b=document.createElement('div');b.className='metric';const small=document.createElement('small'),strong=document.createElement('strong');small.textContent=k;strong.textContent=v;b.append(small);b.append(strong);$('metrics').append(b)}$('status').textContent=running?'진행 중 '+Math.round(p*100)+'%':p===1?'완료 · 결과 유지':p>0?'일시정지':'준비';$('play').textContent=p===1?'▶ 다시 실행':p>0?'▶ 계속':'▶ 시작';$('pause').disabled=!running}
function selectTab(i,focus=false){stop();tab=i;const n=LAB.tabs.length;document.querySelectorAll('#tabs button').forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;if(i===j&&focus)b.focus()});$('experiment').hidden=i===n;$('learn').hidden=i!==n;$(i===n?'learn':'experiment').setAttribute('aria-labelledby','tab_'+i);if(i===n)return;const t=LAB.tabs[i];$('title').textContent=t.name;$('principle').textContent=t.principle;$('observe').textContent=t.observe;$('assume').textContent=t.assume;$('question').textContent='탐구 질문 · '+t.question;$('info').textContent='표시된 수치는 이상적 모형의 계산값입니다. 광선 재생 속도는 교육용이며 실제 빛의 속력이 아닙니다.';controls();refresh();resize()}
function boot(){document.title=LAB.name+' · 빛과 광학';$('labname').textContent=LAB.name;const learn=$('learn');const h=document.createElement('h2');h.textContent='개념 설명 · '+LAB.name;learn.append(h);for(const t of LAB.tabs){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),q=document.createElement('p'),r=document.createElement('p');h.textContent=t.name;p.textContent=t.principle;q.textContent=t.observe;r.textContent='가정 및 한계: '+t.assume;a.append(h);a.append(p);a.append(q);a.append(r);learn.append(a)}const note=document.createElement('p');note.textContent=LAB.detail;learn.append(note);[...LAB.tabs.map(t=>t.name),'개념 설명'].forEach((name,i)=>{const b=document.createElement('button');b.id='tab_'+i;b.textContent=name;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-controls',i===LAB.tabs.length?'learn':'experiment');b.onclick=()=>selectTab(i);b.onkeydown=e=>{const n=LAB.tabs.length+1;if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectTab(e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:n-1))%n,true)}};$('tabs').append(b)});$('play').onclick=()=>{if(tab===LAB.tabs.length)return;if(progress[tab]===1)progress[tab]=0;running=true;last=null;refresh();draw()};$('pause').onclick=()=>{stop();refresh()};$('reset').onclick=()=>{stop();progress[tab]=0;states[tab]=Object.fromEntries(LAB.tabs[tab].controls.map(k=>[k.key,k.value]));controls();refresh();draw()};if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(cv);else window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=null);selectTab(0);requestAnimationFrame(frame)}
let lastUI=0;function frame(now){if(running&&tab!==LAB.tabs.length){const dt=last===null?0:Math.min(.05,Math.max(0,(now-last)/1000));last=now;progress[tab]=Math.min(1,progress[tab]+dt/4);if(progress[tab]===1)stop();draw();if(!running||now-lastUI>120){refresh();lastUI=now}}requestAnimationFrame(frame)}
boot();</script></body></html>
