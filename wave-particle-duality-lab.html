<div class="shell">
  <header class="top"><div class="brand"><div class="mark">⚛</div><div><div class="kicker">INTERACTIVE PHYSICS LAB · 빛과 물질</div><h1>빛과 물질의 이중성</h1><div class="desc">교과서 152~160쪽 연계 · 관찰 → 조건 변경 → 해석</div></div></div><div class="top-right"><span class="tag">오프라인 실행</span><span class="tag">7개 학습 탭</span><span class="tag">이상화된 교육용 모형</span></div></header>
  <nav class="nav" id="tabNav" aria-label="실험 탭"></nav>
  <main id="mainArea"></main>
  <footer class="footer"><span>모든 실험 수치는 교육용 물리 모형이며, 애니메이션 속도·입자 크기는 실제 비율이 아닙니다.</span><span>HTML 단일 파일 · 인터넷 연결 불필요</span></footer>
</div>
<script>
'use strict';
const HC=4.135667696e-15, H=6.62607015e-34, C=299792458, ME=9.1093837139e-31, QE=1.602176634e-19;
const metals={Cs:{name:'세슘 (Cs)',W:2.14},Na:{name:'나트륨 (Na)',W:2.28},Zn:{name:'아연 (Zn)',W:4.30},Cu:{name:'구리 (Cu)',W:4.70}};
const tabs=[['photo','광전 효과'],['photon','광자 에너지'],['compton','콤프턴 산란'],['crystal','전자 회절'],['slit','전자 이중 슬릿'],['apps','기술 활용'],['concepts','개념 설명']];
let active='photo', playing=true, frameT=0, lastFrame=0, lastDraw=0;
const s={photo:{metal:'Na',f:7.0,I:65,U:0.0},photon:{f:6.0,I:55},compton:{E:90,theta:70},crystal:{V:54,d:.11,theta:50,coherent:true},slit:{V:70,d:.55,L:.80,observe:false,hits:[],total:0,auto:false},apps:{mode:'ccd',brightness:65,exposure:1.2,color:'white',lambda:580,solarI:750,kV:100,gap:.30}};
const fmt=(x,n=2)=>Number(x).toFixed(n), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(min,max)=>min+Math.random()*(max-min);
const elecLambda=(V)=>1.22642597/Math.sqrt(V); // nm, nonrelativistic (V in volts)
const relLambda=(kV)=>H/Math.sqrt(2*ME*QE*kV*1000*(1+QE*kV*1000/(2*ME*C*C)))*1e12; // pm
const fE=(f)=>HC*f*1e14;
const esc=(x)=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function line(x1,y1,x2,y2,col='#637f9a',w=2,extra=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" ${extra}/>`}
function txt(x,y,t,size=15,color='#dbeaf7',anchor='start',weight=500){return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" fill="${color}" font-weight="${weight}">${esc(t)}</text>`}
function circle(x,y,r,col,ext=''){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" ${ext}/>`}
function rect(x,y,w,h,color,rad=0,extra=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rad}" fill="${color}" ${extra}/>`}
function path(d,c,w=2,extra=''){return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" ${extra}/>`}
function wave(x1,x2,y,f,phase,col='#65d8ed',amp=10,w=2){let d='';const period=clamp(160/f,9,40);for(let x=x1;x<=x2;x+=3){let yy=y+Math.sin((x-x1)/period*2*Math.PI-phase)*amp;d+=(x===x1?'M':'L')+x.toFixed(1)+' '+yy.toFixed(1)+' ';}return path(d,col,w)}
const defs=`<defs><linearGradient id="vac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a4361" stop-opacity=".6"/><stop offset="1" stop-color="#0d233b" stop-opacity=".13"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ea9c1"/><stop offset=".5" stop-color="#dceaf8"/><stop offset="1" stop-color="#637f99"/></linearGradient><linearGradient id="solar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#397aa1"/><stop offset="1" stop-color="#133c63"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#65d9eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ffbd72"/></marker></defs>`;
function svg(inner){return `<svg class="stage-art" viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="실시간 물리 모형 애니메이션">${defs}${inner}</svg>`}
const field=(id,label,min,max,step,val,fmtFn=String)=>`<div class="field"><div class="field-top"><label for="fld_${id}">${label}</label><span class="readout" data-v="${id}">${fmtFn(val)}</span></div><input id="fld_${id}" data-key="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"/><div class="minmax"><span>${min}</span><span>${max}</span></div></div>`;
const selector=(id,label,choices,value)=>`<div class="field"><div class="field-top"><label for="fld_${id}">${label}</label></div><select id="fld_${id}" data-key="${id}">${choices.map(([k,v])=>`<option value="${k}" ${String(k)===String(value)?'selected':''}>${v}</option>`).join('')}</select></div>`;
const toggle=(id,label,val)=>`<label class="switch-field"><input type="checkbox" data-key="${id}" ${val?'checked':''}/><span>${label}</span></label>`;
function infoMetrics(items){return items.map(([label,value,sub])=>`<div class="metric"><div class="m-label">${label}</div><div class="m-value">${value}</div><div class="m-sub">${sub||'　'}</div></div>`).join('')}
function getModel(){let x=s[active]; switch(active){
case 'photo':{const E=fE(x.f),W=metals[x.metal].W,K=Math.max(0,E-W),yes=x.I>0&&E>=W;const stop=K;const ratio=K>0?clamp((x.U+stop)/Math.max(stop,.30),0,1):0;const collection= x.U>=0?1:Math.pow(ratio,.72);const current=yes?x.I*collection:0;return {title:'광전 효과 실험실',sub:'금속의 문턱 진동수 · 광전자 방출 · 정지 전압',status:yes?'광전자 방출 중':'광전자 방출 없음',metrics:[['광자 1개 에너지',fmt(E,2)+' eV','E = hf'],['금속 일함수',fmt(W,2)+' eV',metals[x.metal].name],['최대 운동 에너지',yes?fmt(K,2)+' eV':'0 eV','Kₘₐₓ = max(hf − W, 0)'],['검출 전류 지표',fmt(current,1)+' %',yes?'정지 전압 ≈ '+fmt(stop,2)+' V':'문턱 조건 불충족']],ctl:selector('metal','금속판 재료',Object.entries(metals).map(([k,v])=>[k,`${v.name} · ${v.W.toFixed(2)} eV`]),x.metal)+field('f','빛의 진동수 (×10¹⁴ Hz)',3,14,.1,x.f,v=>fmt(v,1))+field('I','빛의 세기 (상대값)',0,100,1,x.I,v=>v+' %')+field('U','집전극 전위 (V)',-4.5,3,.1,x.U,v=>fmt(v,1)+' V'),hint:`<strong>예측 질문</strong><p>빛의 세기를 2배로 하면 전자의 <b>수</b>와 <b>최대 운동 에너지</b> 중 무엇이 변할까요? 음(-)전압은 광전자의 수집을 방해합니다.</p>`,note:'전자 방출 기준: hf ≥ W. 전류는 전압에 따른 수집률을 단순화한 상대 지표이며 실제 전류값이 아닙니다.',data:{E,W,K,yes,stop,current,collection}}}
case 'photon':{const E=fE(x.f),lam=C/(x.f*1e14)*1e9;return {title:'광자 에너지와 빛의 세기',sub:'한 광자의 에너지와 광자의 개수는 서로 다른 물리량',status:'광자 모형',metrics:[['진동수',fmt(x.f,1)+' ×10¹⁴','Hz'],['광자 1개 에너지',fmt(E,2)+' eV','E = hf'],['파장',fmt(lam,0)+' nm','λ = c/f'],['단위 시간 광자 수',x.I+' %','동일 광자 에너지에서 상대값']],ctl:field('f','빛의 진동수 (×10¹⁴ Hz)',3,15,.1,x.f,v=>fmt(v,1))+field('I','입사 광자 수 (상대값)',0,100,1,x.I,v=>v+' %'),hint:'<strong>핵심 구분</strong><p>진동수가 증가하면 <b>광자 하나의 에너지</b>가 증가합니다. 광자의 개수가 증가하면 (진동수가 일정할 때) <b>빛의 세기</b>가 증가합니다.</p>',note:'물결은 광자의 파동적 특성을 나타내는 도식이며, 광자 크기·간격·화면 속도는 실제 축척이 아닙니다.',data:{E,lam}}}
case 'compton':{let th=x.theta*Math.PI/180,Eprime=x.E/(1+x.E/511*(1-Math.cos(th))),lam=1.239841984/x.E,dl=2.42631*(1-Math.cos(th));let recoil=x.E-Eprime,pX=x.E-Eprime*Math.cos(th),pY=-Eprime*Math.sin(th),phi=Math.atan2(-pY,pX)*180/Math.PI;return {title:'콤프턴 산란 실험실',sub:'X선 광자와 거의 정지한 자유 전자의 충돌',status:'에너지·운동량 보존',metrics:[['산란 광자 에너지',fmt(Eprime,2)+' keV','산란 전 '+fmt(x.E,0)+' keV'],['전자 운동 에너지',fmt(recoil,2)+' keV','K = E − E′'],['광자 파장 증가',fmt(dl,3)+' pm','Δλ = λC(1 − cosθ)'],['전자 되튐 방향',recoil<1e-6?'—':fmt(phi,1)+'°','입사 방향 아래쪽']],ctl:field('E','입사 X선 광자 에너지',10,150,1,x.E,v=>v+' keV')+field('theta','광자 산란각 θ',0,170,1,x.theta,v=>v+'°'),hint:'<strong>핵심 구분</strong><p>광자가 전자에 에너지를 전달하면 산란 후 광자의 <b>진동수는 작아지고 파장은 길어집니다.</b> 충돌 과정에서는 전체 에너지와 운동량이 보존됩니다.</p>',note:'정지해 있는 자유 전자와 단일 X선 광자의 2체 상대론적 충돌을 가정합니다. 화살표 길이는 시각화용입니다.',data:{Eprime,recoil,dl,phi,lam}}}

function render(){const nav=document.getElementById('tabNav');nav.innerHTML=tabs.map(([k,n])=>`<button class="tab ${k===active?'active':''}" data-tab="${k}" role="tab" aria-selected="${k===active}">${n}</button>`).join('');const main=document.getElementById('mainArea');if(active==='concepts'){main.innerHTML=conceptsHTML();return;}const m=getModel();main.innerHTML=`<div class="work"><section class="stage"><div class="stage-head"><div><h2>${m.title}</h2><p>${m.sub}</p></div><span class="status" id="labStatus">${m.status}</span></div><div class="artwrap" id="artwrap"></div><div class="mobile-note">↔ 그림을 좌우로 밀어 장치 전체를 볼 수 있습니다.</div><div class="graph-note" id="graphNote">${m.note}</div><div class="metrics" id="metricList">${infoMetrics(m.metrics)}</div></section><aside class="controls" id="ctlPanel">${renderControls(m)}</aside></div>`;draw();}

function tick(ms){const delta=lastFrame?Math.min(.06,(ms-lastFrame)/1000):0;lastFrame=ms;if(playing&&active!=='concepts')frameT+=delta;if(active==='slit'&&s.slit.auto&&delta>0){let n=Math.min(12,Math.ceil(delta*110));shoot(n);if(ms-lastDraw>90){document.getElementById('metricList')?.querySelectorAll('.m-value')[2]&&(document.getElementById('metricList').querySelectorAll('.m-value')[2].textContent=s.slit.total.toLocaleString()+' 개');}}if(ms-lastDraw>60&&active!=='concepts'){draw();lastDraw=ms;}requestAnimationFrame(tick)}
function conceptsHTML(){return `<section class="concept-surface"><div class="concept-intro"><div><h2>개념 설명 · 빛과 물질의 이중성</h2><p>교과서 152~160쪽의 핵심을 실험의 관찰 결과 → 해석 → 수식 → 응용 순서로 정리했습니다. 왼쪽 위 각 실험 탭에서 변인을 조절하며 비교할 수 있습니다.</p></div><span class="tag">고등학교 물리 · 개념 정리</span></div><div class="concept-grid">
<article class="concept"><h3>01. 광전 효과: 빛으로 전자가 튀어나오다</h3><p>금속 표면에 빛을 비추어 전자가 방출되는 현상을 <b>광전 효과</b>라고 하며, 방출된 전자를 <b>광전자</b>라고 합니다. 금속마다 광전자를 방출시키기 위한 최소 에너지(일함수 W)가 다릅니다.</p>
<svg viewBox="0 0 420 105" aria-label="금속에 입사한 빛이 광전자를 방출시키는 모습"><path d="M20 77 H399" stroke="#abc3d7" stroke-width="4"/><rect x="20" y="79" width="380" height="22" fill="#58788d"/><path d="M60 12 L118 65 M94 12 L152 65 M128 12 L186 65" stroke="#ffd27b" stroke-width="3"/><circle cx="151" cy="48" r="7" fill="#77d8ff"/><path d="M151 45 L170 18 M191 45 L220 15" stroke="#77d8ff" stroke-width="2.5"/><circle cx="173" cy="15" r="6" fill="#77d8ff"/><circle cx="223" cy="13" r="6" fill="#77d8ff"/><text x="30" y="18" fill="#ffe1a9" font-size="13">빛</text><text x="247" y="19" fill="#ade9f7" font-size="12">방출된 광전자</text><text x="290" y="72" fill="#edf2f9" font-size="13">금속</text></svg>
<p>교과서의 검전기 실험에서, 음(-)전하로 대전한 검전기의 아연판에 충분히 높은 진동수의 빛을 비추면 전자가 빠져나가 검전기의 벌어짐이 줄어들 수 있습니다. 빛의 조건과 검전기 대전 상태가 중요합니다.</p><div class="formula">hf ≥ W <small>일함수보다 광자 에너지가 작으면 방출되지 않음</small></div></article>
<article class="concept"><h3>02. 빛의 세기와 진동수는 역할이 다르다</h3><p><b>빛의 진동수 f</b>는 광자 하나의 에너지를 결정하고, 일정한 진동수에서 <b>빛의 세기</b>를 증가시키면 단위 시간에 입사하는 광자 수가 증가합니다.</p>
<svg viewBox="0 0 420 105" aria-label="빛의 세기는 광자의 개수, 진동수는 광자의 에너지에 영향을 줌"><text x="10" y="23" font-size="12" fill="#d6e9f5">세기 증가</text><circle cx="99" cy="19" r="6" fill="#ffd07c"/><circle cx="124" cy="19" r="6" fill="#ffd07c"/><circle cx="149" cy="19" r="6" fill="#ffd07c"/><circle cx="174" cy="19" r="6" fill="#ffd07c"/><circle cx="199" cy="19" r="6" fill="#ffd07c"/><text x="247" y="23" font-size="12" fill="#9eeecb">입사 광자 수 ↑</text><text x="10" y="77" font-size="12" fill="#d6e9f5">진동수 증가</text><path d="M101 74 q12 -33 24 0 t24 0 t24 0 t24 0" stroke="#7be7f2" stroke-width="3" fill="none"/><text x="247" y="78" font-size="12" fill="#9eeecb">광자 1개 에너지 ↑</text></svg>
<p><span class="accent">문턱 진동수 미만:</span> 아무리 강한 빛을 오래 비추어도 고전적인 단일 광자 광전 효과로는 전자가 방출되지 않습니다. <span class="accent">문턱 이상:</span> 광자 수가 많아지면 일반적으로 방출되는 전자의 수와 포화 광전류가 증가합니다.</p><div class="formula">E<sub>photon</sub> = hf = hc/λ</div><p>h = 6.626 × 10<sup>−34</sup> J·s, c ≈ 3.00 × 10<sup>8</sup> m/s</p></article>
<article class="concept"><h3>03. 아인슈타인의 광전 효과 방정식</h3><p>광자 하나의 에너지 중 일부는 금속에서 전자를 꺼내는 일함수 W에 쓰이고, 나머지가 광전자의 <b>최대 운동 에너지</b>가 됩니다.</p><div class="formula">K<sub>max</sub> = hf − W = eV<sub>stop</sub></div><p><b>정지 전압 V<sub>stop</sub></b>은 가장 빠른 광전자도 집전극에 도달하지 못하게 하는 역전압의 크기입니다. 따라서 광전류를 측정하면 최대 운동 에너지를 추정할 수 있습니다.</p><p>예시: Na의 일함수를 2.28 eV, 광자 에너지를 3.00 eV로 가정하면 <b>K<sub>max</sub> = 0.72 eV, 정지 전압의 크기 ≈ 0.72 V</b>입니다.</p><p class="warning">주의: 모든 광전자의 에너지가 똑같은 것은 아닙니다. 식은 최대 운동 에너지를 나타냅니다.</p></article>
<article class="concept"><h3>04. 콤프턴 효과: 광자도 운동량을 가진다</h3><p>X선 광자가 거의 정지한 전자에 충돌하면 에너지와 운동량의 일부를 전자에 전달하여 산란합니다. 산란 광자는 에너지가 작아지고 파장이 증가합니다.</p><svg viewBox="0 0 420 105" aria-label="X선 광자와 전자의 산란"><path d="M20 53 H192" stroke="#ffce7d" stroke-width="3"/><path d="M195 50 L338 12" stroke="#ffce7d" stroke-width="3"/><path d="M195 53 L317 92" stroke="#76daf1" stroke-width="3"/><circle cx="195" cy="53" r="9" fill="#8dd9fc"/><circle cx="338" cy="12" r="5" fill="#ffd687"/><circle cx="317" cy="92" r="6" fill="#82daff"/><text x="21" y="39" font-size="12" fill="#ffdfac">입사 광자</text><text x="326" y="31" font-size="12" fill="#ffdfac">산란 광자</text><text x="251" y="84" font-size="12" fill="#a6e6ff">전자</text></svg><div class="formula">Δλ = h/(m<sub>e</sub>c) · (1 − cosθ)</div><p>θ가 클수록 파장의 증가량이 커집니다. 산란 후 에너지 보존식은 E = E′ + K<sub>electron</sub>입니다(전자 초기 정지 에너지는 양변에 공통으로 포함되어 상쇄).</p></article>
<article class="concept"><h3>05. 드브로이 물질파: 전자에도 파장이 있다</h3><p>빛이 입자성을 지니는 것처럼, 전자 등 물질 입자도 파동성을 가집니다. 드브로이는 입자의 운동량 p에 대응하는 파장이 있다고 제안했습니다.</p><div class="formula">λ = h/p <small>· 비상대론적 전자: λ = h/√(2m<sub>e</sub>eV)</small></div><p>전자를 전압 V로 가속했을 때 전자의 운동 에너지 eV가 증가하므로 운동량은 커지고, 드브로이 파장은 짧아집니다.</p><p><b>54 V 전자 예시:</b> λ ≈ 0.167 nm. 이 정도 파장은 결정의 원자 간격과 비슷하므로 전자 회절을 관찰할 수 있습니다.</p><p class="warning">전자의 속도가 빛의 속도에 비해 매우 커지면 상대론적 식을 사용해야 합니다. 전자 현미경 탭에는 상대론적 식을 적용합니다.</p></article>
<article class="concept"><h3>06. 전자 회절: 데이비슨과 거머의 실험</h3><p>가속 전자를 니켈 결정에 입사시키면 특정 산란 방향에서 전자 검출 세기가 커집니다. 규칙적인 원자 배열에서 산란된 전자의 물질파가 보강 간섭하기 때문입니다.</p><div class="formula">2d sinθ<sub>B</sub> = nλ</div><p>이 식은 이상적인 평행 결정면에서의 <b>브래그 회절 조건</b>입니다. 실제 데이비슨–거머 실험에서 제시되는 산란각은 입사빔·검출기 기하에 따라 정의되므로 브래그 각 θ<sub>B</sub>와 구별해야 합니다.</p><p>전자 회절 실험의 핵심 증거는 전자가 단순히 알갱이처럼 산란하는 것이 아니라 <b>각도별 보강·상쇄 간섭을 보인다</b>는 사실입니다.</p></article>
<article class="concept"><h3>07. 전자 이중 슬릿: 한 점씩 검출되어도 무늬가 생긴다</h3><p>전자를 하나씩 쏘면 스크린에는 항상 국소적인 검출 점이 생깁니다. 하지만 많은 전자가 누적되면 간섭무늬에 해당하는 확률 분포가 나타납니다. 입자처럼 검출되면서도 파동처럼 간섭하는 것입니다.</p><div class="formula">Δx ≈ λL/d</div><p>λ: 전자의 물질파 파장, L: 슬릿에서 스크린까지 거리, d: 두 슬릿 중심 간격. 따라서 <b>d가 작아지거나 L이 커지면 간섭무늬 간격이 넓어집니다.</b></p><p>어느 슬릿을 지났는지 구별할 수 있는 경로 정보가 생기면 간섭항이 사라지고, 두 슬릿에서 나온 분포가 비간섭적으로 합쳐집니다.</p><p class="warning">이 탭은 전자의 도착 위치를 확률적으로 생성합니다. 개별 전자 궤적을 확정적으로 그린 것이 아닙니다.</p></article>
<article class="concept"><h3>08. 물질파와 전자 현미경</h3><p>광학 현미경은 가시광선의 파장과 광학계의 회절 한계 때문에 매우 미세한 구조를 구분하는 데 한계가 있습니다. 전자는 충분히 가속하면 가시광선보다 훨씬 짧은 물질파 파장을 가집니다.</p><p><b>100 kV 전자의 파장:</b> 약 3.70 pm(0.00370 nm). 이에 비해 대표적인 가시광선은 약 550 nm입니다. 실제 전자 현미경의 분해능은 렌즈 수차, 시료, 진동, 검출 조건 등에 좌우됩니다.</p><div class="formula">전자 가속 전압 ↑ → 운동량 ↑ → 파장 ↓</div><p>모든 작은 대상이 전자 현미경으로 쉽게 관찰되는 것은 아니며, 시료 준비와 장비 조건이 중요합니다.</p></article>
<article class="concept"><h3>09. CCD 이미지 센서 · 태양 전지</h3><p><b>CCD 센서:</b> 반도체에서 입사 빛이 생성한 전하를 픽셀별로 모아 전기 신호로 읽어 이미지 정보를 만듭니다. 색 필터 배열은 빛의 색 성분을 분리하는 데 쓰입니다.</p><p><b>태양 전지:</b> 반도체가 충분한 에너지의 광자를 흡수하면 전자와 양공이 생깁니다. 내장 전기장과 선택적 접촉에 의해 전하가 분리되어 외부 회로에서 전력을 얻을 수 있습니다.</p><p><b>광전 효과와의 차이:</b> 광전관에서는 금속 밖으로 전자가 방출됩니다. CCD와 태양 전지는 주로 반도체 <b>내부의 광전 변환</b>을 활용합니다.</p></article>
<article class="concept concept-wide"><h3>10. 핵심 결과 한눈에 비교하기</h3><table class="concept-table"><thead><tr><th>현상·실험</th><th>핵심 관찰</th><th>알 수 있는 성질</th></tr></thead><tbody><tr><td>광전 효과</td><td>문턱 진동수 존재, 최대 운동 에너지는 진동수에 의존</td><td>빛의 입자성 · 광자의 에너지 hf</td></tr><tr><td>콤프턴 산란</td><td>산란각에 따라 X선 파장 증가</td><td>광자의 에너지·운동량</td></tr><tr><td>결정에 의한 전자 회절</td><td>특정 각도에서 산란 세기가 커짐</td><td>전자의 파동성</td></tr><tr><td>전자 이중 슬릿</td><td>한 점씩 검출되면서 간섭 분포가 누적</td><td>국소 검출과 확률 진폭의 간섭</td></tr><tr><td>전자 현미경</td><td>짧은 물질파로 미세 구조 관찰 가능</td><td>물질파의 활용</td></tr></tbody></table><p class="warning">빛과 물질은 '때로는 작은 공, 때로는 고전적 물결'로 단순히 변신하는 것이 아닙니다. 양자역학적 상태는 확률 진폭으로 기술되며, 실험에서 에너지·운동량 교환의 양자적 성질과 간섭 같은 파동적 성질이 드러납니다.</p></article>
