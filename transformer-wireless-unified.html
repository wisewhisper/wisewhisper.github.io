s:1fr 1fr}.sim{grid-column:1/-1;grid-row:1}.theory{grid-column:1}.controls{grid-column:2}.plotgrid{grid-template-columns:1fr}.plot canvas{height:180px}.probe .questions{grid-template-columns:1fr}}@media(max-width:560px){header{padding:14px;display:block}h1{font-size:22px}.tag{display:inline-block;margin-top:8px}main{display:flex;flex-direction:column;padding:10px}.sim{order:0}.controls{order:1}.theory{order:2}.graphs{order:3}.probe{order:4}.stat b{font-size:17px}.sim canvas{height:245px}}\n\n/* 2026 공통 실험실: 검정 배경, 실험/설명 분리, PC 한 화면 */\n:root{color-scheme:dark;--blue:#66bdff;--green:#58e0b4;--red:#ff8694;--ink:#e4f1fe;--muted:#b0c6db}\nhtml,body{min-height:100%;background:#06111f;color:var(--ink)}\nbody{background:radial-gradient(ellipse at 70% -25%,#13304c 0,transparent 52%),#06111f}\nheader{background:#0a1b2d;border-bottom:1px solid #29455c;color:#eff7ff;min-height:74px;padding:10px 20px;gap:14px}\nheader small{color:#a1c3d8}h1{font-size:21px;line-height:1.32}\n.tag{background:#153d3b;color:#89efd4;border:1px solid #376e67;white-space:nowrap}\n.top-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}\n.top-tab{color:#bad1e5;background:#122a42;border:1px solid #38536e;font-size:13px;font-weight:800;padding:9px 13px}\n.top-tab.active{background:#17514e;border-color:#57d9bd;color:#dcfff4}\n.top-tab:hover,button:not(.primary):hover{filter:brightness(1.17)}\n.lab-page{display:none}\nmain#lab.active{width:100%;max-width:1660px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1.83fr) minmax(300px,.83fr);grid-template-rows:minmax(0,1fr) minmax(183px,.46fr);gap:12px;height:calc(100dvh - 76px);min-height:560px}\n.card{background:#102237;color:#e6f1fc;border:1px solid #2b4a66;border-radius:15px;box-shadow:0 3px 18px #0001;min-width:0}\n.card h2{color:#e7f8ff}.card h3{color:#a3f2dc}\n.sim{grid-column:1;grid-row:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}\n.sim canvas{flex:1 1 auto;min-height:148px;height:100%;background:linear-g questions{grid-template-columns:repeat(3,minmax(0,1fr))}\n@media(max-width:950px){header{flex-wrap:wrap}main#lab.active{height:calc(100dvh - 112px);grid-template-columns:minmax(0,1.6fr) minmax(260px,.9fr);min-height:620px}main#lab .sim,main#lab .controls,main#lab .graphs{grid-column:auto;grid-row:auto}.sim{grid-column:1!important;grid-row:1!important}.controls{grid-column:2!important;grid-row:1 / span 2!important}.graphs{grid-column:1!important;grid-row:2!important}.plotgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.plot canvas{height:100%}}\n@media(max-width:740px){header{padding:12px;gap:7px;display:flex;flex-wrap:wrap}h1{font-size:19px}.tag{display:none}.top-tabs{margin-left:0;width:100%}.top-tab{flex:1;font-size:12px}\nmain#lab.active{height:auto;min-height:0;display:flex;flex-direction:column;padding:10px;gap:10px}\nmain#lab .sim,main#lab .controls,main#lab .graphs{width:100%;flex:auto;overflow:visible}\n.sim canvas{height:245px;flex:none}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:7px 5px}.stat b{font-size:16px}\n.controls{order:2}.graphs{order:3}.plotgrid{grid-template-columns:1fr}.plot canvas{height:150px;min-height:150px}\n#concept.active{padding:10px}.probe .questions,#concept .probe .questions{grid-template-columns:1fr}\n}\n@media(max-height:720px) and (min-width:741px){main#lab.active{grid-template-rows:minmax(0,1fr) 172px;min-height:510px}.sim canvas{min-height:110px}h2{margin-bottom:6px}.sim{padding:10px}.stat b{font-size:17px}.controls{padding:10px}.graphs{padding:8px}.controls .buttons button{padding:7px 9px}}\n\u003c/style>\u003cheader>\u003cdiv>\u003csmall>온라인 물리 개념 실험실 · 전자기 유도\u003c/small>\u003ch1>변압기 원리 실험실\u003c/h1>\u003c/div>\u003cspan class=\"tag\">교류 → 자기 선속 변화 → 유도 전압\u003c/span>\u003cnav class=\"top-tabs\" aria-label=\"실험실 화면\">\u003cbutton type=\"button\" class=\"top-tab active\" data-target=\"lab\" aria-pressed=\"true\">🔬 실험하기\u003c/button>\u003cbutton type=\"button\" class=\"top-tab\" data-target=\"concept\" aria-pressed=\"false\">📘 개념 설명·탐구\u003c/button>\u003c/nav>\u003c/header>\u003cmain id=\"lab\" class=\"lab-page active\">\n\n\u003csection class=\"card sim\">\u003ch2>02 · 철심과 두 코일 관찰\u003c/h2>\u003ccanvas id=\"scene\" aria-label=\"철심 속 자기 선속과 변압기 코일 애니메이션\">\u003c/canvas>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">2차 실효 전압\u003cb id=\"v2\">\u003c/b>\u003c/div>\u003cdiv class=\"stat\">2차 실효 전류\u003cb id=\"i2\">\u003c/b>\u003c/div>\u003cdiv class=\"stat\">전달 평균 전력\u003cb id=\"power\">\u003c/b>\u003c/div>\u003c/div>\u003cdiv class=\"phase\">\u003cspan id=\"time\">\u003c/span>\u003cspan id=\"ratio\">\u003c/span>\u003c/div>\u003cdiv id=\"observation\" aria-live=\"polite\">\u003c/div>\u003c/section>\n\u003csection class=\"card controls\">\u003ch2>03 · 실험 조절\u003c/h2>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\" class=\"primary\">▶ 재생\u003c/button>\u003cbutton id=\"restart\">↺ 다시 시작\u003c/button>\u003cbutton id=\"reset\">조건 초기화\u003c/button>\u003c/div>\u003cdiv id=\"sliders\">\u003c/div>\u003cdiv class=\"control\">\u003clabel>재생 속도\u003cselect id=\"speed\">\u003coption value=\"0.25\">0.25배\u003c/option>\u003coption value=\"1\" selected>1배\u003c/option>\u003coption value=\"2\">2배\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"note\">기본 재생은 실제 시간의 1/100로 느리게 표시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"buttons\">\u003cbutton id=\"step\">¼주기 진행\u003c/button>\u003cbutton id=\"save\">현재 조건 비교 저장\u003c/button>\u003cbutton id=\"clear\">비교 지우기\u003c/button>\u003c/div>\u003cp id=\"saved\" class=\"note\">저장한 파형은 점선으로 고정됩니다.\u003c/p>\u003cdiv class=\"buttons\">\u003cbutton data-preset=\"up\">승압 예시\u003c/button>\u003cbutton data-preset=\"down\">강압 예시\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"card graphs\">\u003clabel>세로축 고정 범위 \u003cselect id=\"scaleChoice\">\u003coption value=\"0\">정밀\u003c/option>\u003coption value=\"1\" selected>넓게\u003c/option>\u003coption value=\"2\">최대\u003c/option>\u003c/select>\u003c/label>\u003ch2>04 · 실시간 그래프 \u003csmall class=\"note\">현재 조건 3주기 · 세로선: 현재 시점 · 점선: 저장 조건\u003c/small>\u003c/h2>\u003cdiv class=\"plotgrid\">\u003cdiv class=\"plot\">\u003cdiv class=\"legend\">\u003cspan class=\"blue\">━ v₁\u003c/span>\u003cspan class=\"red\">━ v₂\u003c/span>전압 (V)\u003c/div>\u003ccanvas id=\"voltage\">\u003c/canvas>\u003c/div>\u003cdiv class=\"plot\">\u003cdiv class=\"legend\">\u003cspan class=\"blue\">━ i₁\u003c/span>\u003cspan class=\"red\">━ i₂\u003c/span>전류 (A)\u003c/div>\u003ccanvas id=\"current\">\u003c/canvas>\u003c/div>\u003cdiv class=\"plot\">\u003cdiv class=\"legend\">\u003cspan class=\"green\">━ Φ\u003c/span>자기 선속 (mWb)\u003c/div>\u003ccanvas id=\"flux\">\u003c/canvas>\u003c/div>\u003c/div>\u003cp class=\"note\" id=\"instant\">\u003c/p>\u003c/section>\n\n\u003c/main>\u003csection id=\"concept\" class=\"lab-page reading\">\u003csection class=\"card theory\">\u003ch2>01 · 원리 읽기\u003c/h2>\u003cp>1차 코일에 \u003cb>교류\u003c/b>를 공급하면 철심을 지나는 자기 선속 Φ가 변합니다. 이 변화가 2차 코일에 전압을 유도합니다. 두 코일은 전선으로 직접 연결되지 않습니다.\u003c/p>\u003cdiv class=\"formula\">V₂ / V₁ = N₂ / N₁ = n\u003c/div>\u003cp>N: 감은 수(회), V: 전압 실효값(V). 같은 선속 변화가 각 코일을 지나므로 감은 수가 많을수록 전압이 큽니다.\u003c/p>\u003cdiv class=\"formula\">I₂ / I₁ = N₁ / N₂ = 1/n\u003c/div>\u003cp>이상적인 경우 평균 전력은 \u003cb>P₁ = P₂ = V₂I₂\u003c/b>입니다. 전압을 올리면 같은 전력을 전달하는 전류는 줄어듭니다.\u003c/p>\u003cdetails>\u003csummary>왜 전압이 생길까요?\u003c/summary>패러데이 법칙: ε = −N dΦ/dt. 마이너스 부호는 유도 효과가 선속 변화를 방해하는 방향임을 뜻합니다. 그래프의 v₁, v₂는 대응 극성(점 표시)에 맞춘 단자 전압이며, v₁ = N₁ dΦ/dt로 정의합니다.\u003c/details>\u003cp class=\"note\">모델: 정현파 교류, 완전 결합, 손실 없는 철심·코일, 저항 부하. 여자 전류·누설 자속·포화는 제외합니다. 실제 변압기에서는 발열과 손실이 발생합니다.\u003c/p>\u003cp class=\"note\">철심의 화살표는 Φ의 방향과 크기입니다. 코일의 움직이는 점은 교류의 방향을 보여주는 개념 표현이며 전자의 실제 이동 속도는 아닙니다. 코일 그림은 실제 감은 수를 축약했습니다.\u003c/p>\u003c/section>\u003csection class=\"card probe\">\u003ch2>05 · 예측하고 확인하기\u003c/h2>\u003cdiv class=\"questions\">\u003cdetails>\u003csummary>① N₂를 두 배로 하면?\u003c/summary>V₂는 두 배입니다. 부하 저항을 그대로 두면 I₂도 두 배, 전력은 네 배가 됩니다. 전류가 반으로 줄어드는 관계는 \u003cb>1차와 2차 사이\u003c/b>의 관계입니다.\u003c/details>\u003cdetails>\u003csummary>② 주파수를 두 배로 하면?\u003c/summary>전압과 감은 수가 같으면 최대 선속은 반으로 줄어듭니다. Φ최대 = √2 V₁/(2πfN₁). 이 이상 모델에서 전압비는 그대로입니다.\u003c/details>\u003cdetails>\u003csummary>③ 직류를 연결하면?\u003c/summary>지속적으로 변하는 선속이 없어 정상 상태에서 2차 전압이 유도되지 않습니다. 연결·차단 순간은 예외입니다. 실제 1차 코일에는 큰 전류가 흘러 과열될 수 있습니다.\u003c/details>\u003c/div>\u003c/section>\u003c/section>\u003cscript>\n'use strict';const $=id=>document.getElementById(id);const defs=[['n1','1차 감은 수 N₁','회',100,1000,50,400],['n2','2차 감은 수 N₂','회',100,1000,50,800],['v','1차 실효 전압 V₁','V',1,24,1,12],['f','교류 주파수 f','Hz',10,100,5,50],['r','부하 저항 R','Ω',10,200,5,60]];let cfg={},t=0,running=false,snapshot=null,last=null;defs.forEach(([id,label,unit,min,max,step,val])=>{cfg[id]=val;$('sliders').insertAdjacentHTML('beforeend',`\u003cdiv class=\"control\">\u003clabel for=\"${id}\">${label}\u003cspan id=\"${id}val\">${val} ${unit}\u003c/span>\u003c/label>\u003cinput id=\"${id}\" type=\"range\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${val}\">\u003c/div>`);$(id).oninput=()=>{cfg[id]=Math.min(max,Math.max(min,Number($(id).value)));$(id+'val').textContent=cfg[id]+' '+unit;t=0;draw()}});\nfunction model(c,time){const n=c.n2/c.n1,V2=c.v*n,I2=V2/c.r,I1=n*I2,w=2*Math.PI*c.f,s=Math.sin(w*time),peak=Math.SQRT2*c.v/(w*c.n1);return{n,V2,I2,I1,P:V2*I2,v1:Math.SQRT2*c.v*s,v2:Math.SQRT2*V2*s,i1:Math.SQRT2*I1*s,i2:Math.SQRT2*I2*s,phi:-peak*Math.cos(w*time),peak}};\nfunction ctx(id){const el=$(id),dpr=window.devicePixelRatio||1,w=el.clientWidth,h=el.clientHeight;el.width=Math.round(w*dpr);el.height=Math.round(h*dpr);const c=el.getContext('2d');c.scale(dpr,dpr);return[c,w,h]}\nfunction arrow(c,x,y,dx,dy,color){c.strokeStyle=color;c.fillStyle=color;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();const a=Math.atan2(dy,dx);c.beginPath();c.moveTo(x+dx,y+dy);c.lineTo(x+dx-9*Math.cos(a-.5),y+dy-9*Math.sin(a-.5));c.lineTo(x+dx-9*Math.cos(a+.5),y+dy-9*Math.sin(a+.5));c.fill()}\nfunction scene(m){const[c,w,h]=ctx('scene');if(w\u003c20||h\u003c20)return;c.save();c.scale(w/760,h/350);\nconst ln=(x,y,X,Y,color,width=2)=>{c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=color;c.lineWidth=width;c.stroke()};\nconst tx=(s,x,y,color='#dfedff',size=14)=>{c.fillStyle=color;c.font='600 '+size+'px system-ui';c.textAlign='center';c.fillText(s,x,y)};\nconst face=(ps,fill,stroke)=>{c.beginPath();ps.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=stroke;c.lineWidth=2;c.stroke()};\nconst g=c.createLinearGradient(155,65,602,275);g.addColorStop(0,'#9ab4c5');g.addColorStop(.5,'#5a7385');g.addColorStop(1,'#263e53');\nc.shadowColor='#000b';c.shadowBlur=20;c.shadowOffsetY=12;c.lineJoin='round';c.strokeStyle='#1e3a50';c.lineWidth=67;c.strokeRect(195,101,356,135);c.shadowBlur=0;c.shadowOffsetY=0;\nc.strokeStyle=g;c.lineWidth=58;c.strokeRect(195,101,356,135);\nface([[166,67],[582,67],[604,87],[185,87]],'#8ea7b9','#b4c5d5');\nface([[582,67],[604,87],[604,263],[582,244]],'#2b4559','#7694a6');\nc.strokeStyle='#9db6c6';c.lineWidth=2;c.strokeRect(168,69,412,194);c.strokeStyle='#2b485e';c.strokeRect(216,118,316,99);\nfor(let i=0;i\u003c10;i++)ln(177+i*40,72,194+i*40,91,'#c1d6e533',1);\nfor(const [x,n,col,s] of [[195,cfg.n1,'#69ccff','1차'],[552,cfg.n2,'#ffad89','2차']]){const k=Math.min(17,Math.max(7,Math.round(n/80)+4));for(let j=0;j\u003ck;j++){const y=94+j*148/(k-1);c.beginPath();c.ellipse(x,y,31,8,-.12,0,Math.PI*2);c.strokeStyle='#513729';c.lineWidth=5;c.stroke();c.strokeStyle=col;c.lineWidth=3;c.stroke()}tx(s+' '+n+'회',x,47,col,17)}\nfor(const [x,edge,col,isRight] of [[195,102,'#69ccff',false],[552,655,'#ffad89',true]]){ln(x+(isRight?34:-34),95,edge,95,col,3);ln(edge,95,edge,259,col,3);ln(edge,259,x+(isRight?34:-34),259,col,3);c.fillStyle='#12283e';c.strokeStyle=col;c.lineWidth=2;if(isRight){c.fillRect(edge-14,155,28,47);c.strokeRect(edge-14,155,28,47);tx('R',edge,185,'#ffe0c8',17)}else{c.beginPath();c.arc(edge,180,25,0,Math.PI*2);c.fill();c.stroke();tx('~',edge,192,'#b5e6ff',31)}}\ntx('교류 전원',102,230,'#afdfff',13);tx('저항 부하',655,230,'#ffd1b7',13);\ntx('적층 철심 · 공통 자기 선속',374,175,'#f1f8ff',17);\nconst q=m.phi/(m.peak||1),color='rgba(110,248,200,'+(.24+.76*Math.abs(q)).toFixed(2)+')';\nif(Math.abs(q)>.025){arrow(c,298,100,90*q,0,color);arrow(c,456,236,-90*q,0,color)}\ntx('Φ = '+(m.phi*1000).toFixed(3)+' mWb',374,202,'#94ffe0',16);\ntx('v₁ = '+m.v1.toFixed(1)+' V',170,314,'#93d8ff',16);tx('v₂ = '+m.v2.toFixed(1)+' V',590,314,'#ffbc9e',16);\ntx('교육용 모형: 감은 수·크기는 축척과 다름',380,338,'#a9c6d9',12);c.restore()}\nfunction plot(id,keys,colors,m){const[c,w,h]=ctx(id),L=49,R=w-12,T=15,B=h-30,duration=3/cfg.f;let max=({voltage:[50,350,500],current:[5,350,3500],flux:[.5,5,6]}[id]||[1,1,1])[+document.getElementById('scaleChoice').value];c.font='10px system-ui';c.textAlign='right';for(let j=0;j\u003c=4;j++){const y=T+(B-T)*j/4,val=max*(1-j/2);c.strokeStyle='#2b465d';c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();c.fillStyle='#b6cadc';c.fillText(val.toFixed(max\u003c1?3:1),L-6,y+3)}c.textAlign='center';for(let j=0;j\u003c=3;j++){const x=L+(R-L)*j/3;c.fillText((duration*1000*j/3).toFixed(0),x,B+15)}c.fillText('시간 (ms)',(L+R)/2,h-1);for(const con of [cfg,...(snapshot?[snapshot]:[])]){c.setLineDash(con===cfg?[]:[4,4]);keys.forEach((key,i)=>{c.strokeStyle=colors[i];c.globalAlpha=con===cfg?1:.4;c.lineWidth=2;c.beginPath();for(let j=0;j\u003c=400;j++){const v=model(con,duration*j/400)[key]*(key==='phi'?1000:1),x=L+(R-L)*j/400,y=(T+B)/2-v/max*(B-T)/2;j?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()})}c.globalAlpha=1;c.setLineDash([]);c.strokeStyle='#dfedfb';c.lineWidth=1;c.beginPath();const x=L+(R-L)*t/duration;c.moveTo(x,T);c.lineTo(x,B);c.stroke()}\ndocument.getElementById('scaleChoice').onchange=()=>draw();function draw(){const m=model(cfg,t);scene(m);$('v2').textContent=m.V2.toFixed(1)+' V';$('i2').textContent=m.I2.toFixed(3)+' A';$('power').textContent=m.P.toFixed(2)+' W';$('time').textContent='실제 시간 '+(t*1000).toFixed(1)+' ms';$('ratio').textContent='감은 수 비 n = '+m.n.toFixed(2);$('observation').textContent=(m.n>1?'승압: 2차 전압은 커지고, 2차 전류는 1차 전류보다 작습니다.':m.n\u003c1?'강압: 2차 전압은 작아지고, 2차 전류는 1차 전류보다 큽니다.':'감은 수가 같아 1차·2차 전압과 전류 크기가 같습니다.')+' 1차 전류 '+m.I1.toFixed(3)+' A (실효값).';$('instant').textContent=`Φ의 극값에서 유도 전압은 0, Φ가 0을 지날 때 전압의 크기는 최대 | 순간값: v₁ = ${m.v1.toFixed(2)} V · v₂ = ${m.v2.toFixed(2)} V · i₁ = ${m.i1.toFixed(3)} A · i₂ = ${m.i2.toFixed(3)} A · Φ = ${(m.phi*1000).toFixed(3)} mWb | Φ최대 = ${(m.peak*1000).toFixed(3)} mWb`;plot('voltage',['v1','v2'],['#6abaff','#ff8190'],m);plot('current',['i1','i2'],['#6abaff','#ff8190'],m);plot('flux',['phi'],['#67e4ba'],m)}\nfunction setRunning(v){running=v;last=null;$('play').textContent=v?'❚❚ 일시정지':'▶ 재생'}$('play').onclick=()=>setRunning(!running);$('restart').onclick=()=>{t=0;last=null;draw()};$('reset').onclick=()=>{defs.forEach(d=>{$(d[0]).value=d[6];$(d[0]).oninput()});snapshot=null;$('saved').textContent='저장한 파형은 점선으로 고정됩니다.';$('speed').value='1';setRunning(false);draw()};$('step').onclick=()=>{setRunning(false);t=(t+1/(4*cfg.f))%(3/cfg.f);draw()};$('save').onclick=()=>{snapshot={...cfg};$('saved').textContent=`점선 저장: N₁ ${cfg.n1}, N₂ ${cfg.n2}, ${cfg.v} V, ${cfg.f} Hz, ${cfg.r} Ω`;draw()};$('clear').onclick=()=>{snapshot=null;$('saved').textContent='비교를 지웠습니다.';draw()};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{$('n1').value=400;$('n1').oninput();$('n2').value=b.dataset.preset==='up'?800:200;$('n2').oninput()});function loop(stamp){if(running){if(last!==null)t=(t+Math.min((stamp-last)/1000,.1)*Number($('speed').value)/100)%(3/cfg.f);last=stamp;draw()}requestAnimationFrame(loop)}document.addEventListener('visibilitychange',()=>{last=null});window.addEventListener('resize',draw);draw();requestAnimationFrame(loop);\n\n/* 화면 탭 전환 시 그래프 크기와 애니메이션 상태 동기화 */\ndocument.querySelectorAll('.top-tab').forEach(b=>b.addEventListener('click',()=>{\nconst target=b.dataset.target;\ndocument.querySelectorAll('.lab-page').forEach(p=>p.classList.toggle('active',p.id===target));\ndocument.querySelectorAll('.top-tab').forEach(x=>{const yes=x===b;x.classList.toggle('active',yes);x.setAttribute('aria-pressed',String(yes))});\nif(target==='lab'){requestAnimationFrame(draw)}else{setRunning(false)}\n}));\n\u003c/script>\u003c/html>\n","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>교류·직류 비교\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e5eef8;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:10px}article,aside{background:#111d2b;border:1px solid #344b63;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(320px,57dvh,600px);background:#081321;border-radius:9px}button,select{font:inherit;background:#1c3247;color:#e4eef8;border:1px solid #49657d;border-radius:7px;padding:8px;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}label{display:block;font-size:13px;min-width:0}output{color:#7de6ce;float:right}input{width:100%;display:block;accent-color:#61dcbf}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metric{background:#0b2735;border:1px solid #2c5266;border-radius:8px;padding:8px;min-width:0;font-size:12px}.metric b{font-size:19px;display:block;color:#84e6fb;overflow-wrap:anywhere}p{line-height:1.5;color:#bed0e1;margin:8px 0}.note{font-size:12px}aside{max-height:calc(100dvh - 25px);overflow:auto}[hidden]{display:none!important}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(320px,48dvh,430px)}} \u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>교류·직류 비교\u003c/h2>\u003ccanvas id=\"cv\" aria-label=\"교류·직류 비교 실험 및 그래프\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"a\">조건 A\u003c/button>\u003cbutton id=\"b\">조건 B\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assume\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const mode=0,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI;\nconst initial=()=>mode===0?{type:0,V:12,n:2,f:20,L:.2,R:4,c:.9,off:.5}:mode===1?{V:12,n:2,R1:.8,R2:.5,RL:30,core:1,closed:1}:mode===2?{P:100,V:1,R:10,high:10}: {V:10,f:85,L:40,R1:2,R2:2,RL:10,d:15,offset:0,angle:0};\nlet s=initial(),t=0,run=false,last=0,saved=[null,null],W=800,H=440;\nconst fmt=(v,n=2)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.01||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString(),end=()=>mode===0?1.5:1;\nfunction calc(p,t=0){\n if(mode===0){let M=p.c*p.n*p.L,tau=p.L/p.R;if(p.type===0){let w=2*PI*p.f,z=Math.hypot(p.R,w*p.L),phase=Math.atan2(w*p.L,p.R),I=Math.SQRT2*p.V/z*Math.sin(w*t-phase),di=Math.SQRT2*p.V/z*w*Math.cos(w*t-phase);return {I,di,phi:p.L*I,emf:M*di,tau,Vin:Math.SQRT2*p.V*Math.sin(w*t)}}let on=t\u003cp.off,iOff=p.V/p.R*(-Math.expm1(-p.off/tau)),I=on?p.V/p.R*(-Math.expm1(-t/tau)):iOff*Math.exp(-(t-p.off)/tau),Vin=on?p.V:0,di=(Vin-p.R*I)/p.L;return{I,di,phi:p.L*I,emf:M*di,tau,Vin}}\n if(mode===1){let r=p.R2+p.n*p.n*p.R1,I2=p.closed?p.n*p.V/(p.RL+r):0,I1=p.n*I2,V2=I2*p.RL,cu=I1*I1*p.R1+I2*I2*p.R2,output=I2*I2*p.RL,pin=output+cu+p.core;return{I1,I2,V2:p.closed?V2:p.n*p.V,cu,output,pin,eta:pin?100*output/pin:null,core:p.core}}\n if(mode===2){let I=p.P*1000/(p.V*1000),loss=I*I*p.R,output=p.P*1000,input=output+loss,Vsend=p.V*1000+I*p.R,Ihigh=I/p.high,lossHigh=Ihigh*Ihigh*p.R;return{I,loss,output,input,Vsend,eta:100*output/input,Ihigh,lossHigh,etaHigh:100*output/(output+lossHigh)}}\n let L=p.L*1e-6,w=2*PI*p.f*1000,k=.8*Math.cos(p.angle*PI/180)/(1+(p.d/30)**2+(p.offset/30)**2)**1.5;if(Math.abs(k)\u003c1e-12)k=0;let M=k*L,X=w*M,sec=p.R2+p.RL,Z=p.R1+X*X/sec,I1=p.V/Z,I2=X*I1/sec,output=I2*I2*p.RL,cu1=I1*I1*p.R1,cu2=I2*I2*p.R2,pin=p.V*I1;return{k,M,I1,I2,output,pin,cu1,cu2,eta:100*output/pin,C:1/(w*w*L)}}\nfunction ln(x,y,X,Y,c='#405c74',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=13,align='center'){g.fillStyle=c;g.font=size+'px system-ui';g.textAlign=align;g.fillText(v,x,y)}\nfunction arrow(x,y,dx,dy,c,len=36){if(Math.hypot(dx,dy)\u003c1e-12||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.5);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.5);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.5)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction coil(x,y,w,h,n=13,rot=0){g.save();g.translate(x,y);g.rotate(rot);for(let i=0;i\u003cn;i++){let u=-w/2+w*(i+.5)/n;g.beginPath();g.ellipse(u,0,Math.max(3,w/n*.72),h/2,0,0,2*PI);g.strokeStyle='#dd9f60';g.lineWidth=2.6;g.stroke()}g.restore()}\nfunction coreScene(m){let cx=W/2,cy=H*.27,w=Math.min(W*.52,360),h=Math.min(H*.25,120),th=18,x=cx-w/2,y=cy-h/2;rect(x,y,w,th,'#8da4b7');rect(x,y+h-th,w,th,'#708699');rect(x,y,th,h,'#a1b5c3');rect(x+w-th,y,th,h,'#7c93a5');coil(x+th/2,cy,h*.83,47,15,PI/2);coil(x+w-th/2,cy,h*.83,47,15,PI/2);let I=mode===0?m.I:m.I1;if(I){arrow(cx-25,y+9,Math.sign(I),0,'#65d7f7',50);arrow(cx+25,y+h-9,-Math.sign(I),0,'#65d7f7',50)}txt('1차 코일',x-16,cy+h*.67,'#e6b57b',13);txt('2차 코일',x+w+16,cy+h*.67,'#e6b57b',13);txt('공통 철심 · 전기적으로 절연된 권선',cx,17,'#c3d7e8',12);txt(mode===0?'2차 개방 · '+(s.type===0?'교류 정상상태':t\u003cs.off?'직류 연결':'직류 차단 후 방전'):'권수비 N₂/N₁ = '+s.n.toFixed(1)+' · '+(s.closed?'저항 부하':'무부하'),cx,H*.48,'#c6d9e9',13)}\nfunction acGraph(m){let l=55,r=W-48,top=H*.57,b=H-30,mid=(top+b)/2,T=s.type===0?.1:1.5,X=v=>l+v/T*(r-l),Y=(v,lim)=>mid-v/lim*(b-top)/2;let vmax=160,imax=24;for(let k=-2;k\u003c=2;k++){let yy=Y(k*vmax/2,vmax);ln(l,yy,r,yy,'#2c455e');txt(k*vmax/2,l-5,yy+4,'#ff9fb9',10,'right');txt(k*imax/2,r+5,yy+4,'#78e5c6',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(j*T/4,3),X(j*T/4),b+15,'#adc3d6',10);for(let [key,col,lim] of [['emf','#ff9fb9',vmax],['I','#78e5c6',imax]]){g.beginPath();for(let j=0;j\u003c=400;j++){let u=T*j/400,q=calc(s,u);j?g.lineTo(X(u),Y(q[key],lim)):g.moveTo(X(u),Y(q[key],lim))}g.strokeStyle=col;g.lineWidth=2;g.stroke()}let tt=s.type===0?t%T:Math.min(t,T);ln(X(tt),top,X(tt),b,'#fbd17b');txt('2차 전압 (V)',l,top-8,'#ff9fb9',11,'left');txt('1차 전류 (A)',r,top-8,'#78e5c6',11,'right');txt('실제 시간 (s) · 고정축',W/2,H-5,'#b6cadd',11)}\nfunction bars(vals,labels,colors,max){let l=48,r=W-16,top=H*.61,b=H-31,dy=b-top,dx=(r-l)/vals.length;for(let j=0;j\u003c=4;j++){let y=b-j*dy/4;ln(l,y,r,y,'#2c455d');txt(fmt(j*max/4,1),l-5,y+3,'#a6bdd3',10,'right')}for(let i=0;i\u003cvals.length;i++){let h=Math.max(0,vals[i]/max*dy);rect(l+i*dx+dx*.19,b-h,dx*.62,h,colors[i]);txt(labels[i],l+(i+.5)*dx,b+16,'#c9dbea',11);if(h>17)txt(fmt(vals[i],1),l+(i+.5)*dx,b-h+13,'#081321',11)}}\nfunction lossScene(m){coreScene(m);txt('전력 수지 · 공급 = 부하 + 구리손 + 철손',W/2,H*.56,'#c6dbec',12);bars([m.output,m.cu,m.core],['부하 W','구리손 W','철손 W'],['#6bdfbb','#f6b876','#ef8fa9'],1200)}\nfunction transmission(m){let cy=H*.26,x1=W*.14,x2=W*.86;for(let [x,label] of [[x1,'송전측'],[x2,'수전측']]){rect(x-24,cy-25,48,50,'#344b60');coil(x,cy,35,45,8);txt(label,x,cy+44)}ln(x1+24,cy-10,x2-24,cy-10,'#a9b9c5',4);ln(x1+24,cy+10,x2-24,cy+10,'#a9b9c5',4);arrow(W*.42,cy-10,1,0,'#ffbd77',46);txt('왕복 선로 R = '+s.R+' Ω',W/2,cy-29);txt('수전 전압 '+s.V+' kV / '+fmt(s.V*s.high)+' kV 비교',W/2,H*.47,'#c4daea',13);let max=1e7;let l=56,r=W-20,top=H*.60,b=H-31;let values=[m.loss,m.lossHigh];for(let j=0;j\u003c=5;j++){let v=10**(j+2),yy=b-j*(b-top)/5;ln(l,yy,r,yy,'#2f465d');txt('10^'+(j+2),l-5,yy+3,'#a9c3d8',10,'right')}for(let i=0;i\u003c2;i++){let z=Math.max(0,Math.min(5,Math.log10(Math.max(values[i],100))-2)),h=z/5*(b-top),x=l+(i+.5)*(r-l)/2;rect(x-30,b-h,60,h,i?'#67dcbc':'#f7b674');txt(i?'고압':'기준',x,b+16);txt(fmt(values[i]/1000)+' kW',x,Math.max(top+12,b-h-6),i?'#8be9ce':'#ffc88d',12)}txt('선로 손실 (W) · 로그축 · 100 W 미만은 하단',l,top-8,'#bdcfe1',11,'left')}\nfunction wireless(m){let cx=W/2,cy=H*.25,xoff=s.offset/100*Math.min(W*.25,110),gap=24+s.d*1.1,r=Math.min(W*.22,125),ry=21;for(let i=0;i\u003c2;i++){let x=cx+(i?xoff:0),y=cy+(i?gap:0);g.save();g.translate(x,y);if(i)g.rotate(s.angle*PI/180*.6);for(let j=0;j\u003c8;j++){g.beginPath();g.ellipse(0,0,r-j*5,ry-j*1.3,0,0,2*PI);g.strokeStyle=i?'#d8a0f0':'#dc9a55';g.lineWidth=2;g.stroke()}g.restore()}if(m.k>0)for(let j=-2;j\u003c=2;j++)arrow(cx+j*22,cy+18,xoff,gap,'#6acbfa',Math.min(gap*.65,55));txt('송신 코일',cx,cy-32,'#f4c98d');txt('수신 코일',cx+xoff,cy+gap+35,'#deb5f1');txt('거리·어긋남·기울기 → 결합계수 k',W/2,17,'#c8dcea',12);txt('전력 수지 · 송신 저항손 + 수신 저항손 + 부하',W/2,H*.56,'#c2d9ec',12);bars([m.cu1,m.cu2,m.output],['송신 손실 W','수신 손실 W','부하 W'],['#f6b876','#ef94b3','#6cdfb7'],200)}\nfunction draw(){let grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#142a40');grad.addColorStop(1,'#081321');g.fillStyle=grad;g.fillRect(0,0,W,H);let m=calc(s,t);if(mode===0){coreScene(m);acGraph(m)}else if(mode===1)lossScene(m);else if(mode===2)transmission(m);else wireless(m)}\nfunction summary(a){let m=calc(a.p,a.t);return mode===0?'2차 전압 '+fmt(m.emf)+' V':mode===1?'효율 '+fmt(m.eta)+'%':mode===2?'선로손 '+fmt(m.loss/1000)+' kW':'k '+fmt(m.k,3)+' / 효율 '+fmt(m.eta)+'%'}\nfunction update(){let m=calc(s,t),rows=mode===0?[['1차 순간 전류',fmt(m.I)+' A'],['1차 쇄교 자속',fmt(m.phi)+' Wb·회'],['2차 개방 전압',fmt(m.emf)+' V'],['시정수',fmt(m.tau)+' s']]:mode===1?[['2차 단자 전압',fmt(m.V2)+' V'],['2차 전류',fmt(m.I2)+' A'],['부하 전력',fmt(m.output)+' W'],['구리손',fmt(m.cu)+' W'],['철손',fmt(m.core)+' W'],['효율',m.eta===null?'—':fmt(m.eta)+'%']]:mode===2?[['기준 선로 전류',fmt(m.I)+' A'],['고압 선로 전류',fmt(m.Ihigh)+' A'],['기준 전력 손실',fmt(m.loss/1000)+' kW'],['고압 전력 손실',fmt(m.lossHigh/1000)+' kW'],['기준 효율',fmt(m.eta)+'%'],['고압 효율',fmt(m.etaHigh)+'%'],['기준 송전단 전압',fmt(m.Vsend/1000)+' kV']]:[['결합 계수 k',fmt(m.k,3)],['상호 인덕턴스',fmt(m.M*1e6,3)+' μH'],['송신 전류',fmt(m.I1)+' A'],['수신 전류',fmt(m.I2)+' A'],['부하 전력',fmt(m.output)+' W'],['전송 효율',fmt(m.eta)+'%'],['공진 축전기',fmt(m.C*1e9)+' nF']];$('metrics').innerHTML=rows.map(([k,v])=>'\u003cdiv class=\"metric\">'+k+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((a,i)=>['A','B'][i]+': '+(a?summary(a):'미저장')).join(' | ');draw()}\nfunction slider(k,label,min,max,step){let el=document.createElement('label');el.innerHTML=label+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];t=0;run=false;update()};$('controls').append(el)}\nfunction choice(k,label,opts){let el=document.createElement('label');el.textContent=label;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;t=0;run=false;build()};el.append(e);$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){choice('type','입력 전원',[[0,'교류 정상상태'],[1,'직류 연결·차단']]);slider('V',s.type===0?'입력 실효 전압 (V)':'직류 전압 (V)',2,24,1);slider('n','권수비',.5,3,.5);slider('L','1차 인덕턴스 (H)',.1,.5,.05);slider('R','1차 저항 (Ω)',1,10,.5);slider('c','결합계수',0,1,.05);if(s.type===0)slider('f','주파수 (Hz)',10,50,5);else slider('off','차단 시각 (s)',.2,1,.1)}else if(mode===1){slider('V','1차 실효 전압 (V)',2,24,1);slider('n','권수비',.5,3,.5);slider('R1','1차 저항 (Ω)',.2,2,.1);slider('R2','2차 저항 (Ω)',.1,2,.1);slider('RL','부하 저항 (Ω)',5,100,5);slider('core','철손 (W)',0,5,.5);choice('closed','2차 회로',[[1,'부하 연결'],[0,'개방']])}else if(mode===2){slider('P','수전 전력 (kW)',10,500,10);slider('V','기준 수전 전압 (kV)',.5,10,.5);slider('R','왕복 선로 저항 (Ω)',1,20,1);slider('high','고압 전압 배수',2,20,1)}else{slider('V','송신 실효 전압 (V)',2,20,1);slider('f','주파수 (kHz)',50,150,5);slider('L','코일 인덕턴스 (μH)',20,100,5);slider('R1','송신 저항 (Ω)',2,8,.5);slider('R2','수신 저항 (Ω)',1,8,.5);slider('RL','부하 저항 (Ω)',2,30,1);slider('d','코일 거리 (mm)',5,80,5);slider('offset','중심 어긋남 (mm)',0,80,5);slider('angle','코일 기울기 (°)',0,90,5)}for(let id of ['play','pause','step'])$(id).hidden=mode!==0;$('formula').textContent=['v₂=M·di₁/dt (대응 단자 극성) · τ=L₁/R₁','P입력=P부하+I₁²R₁+I₂²R₂+P철손 · η=P부하/P입력','I=P수전/V수전 · P손실=I²R · η=P수전/(P수전+P손실)','M=k√(L₁L₂) · Z입력=R₁+(ωM)²/(R₂+R부하)'][mode];$('assume').textContent=['2차 개방, 선형 결합 코일. 교류는 정상상태, 직류 차단 후 1차는 저항을 통한 폐회로 유지. 순간 연결·차단의 전압과 정상상태를 구분합니다. 그래프는 고정축으로 일부 큰 신호는 잘릴 수 있습니다.','이상 변압기와 직렬 권선 저항, 일정 철손을 둔 등가회로. 여자 전류의 무효 성분 및 포화·누설은 제외. 무부하에서도 철손은 발생할 수 있습니다.','역률 1의 등가 저항성 2선로. 같은 수전 전력, 같은 왕복 선로 저항, 수전 전압만 변경. 송전단 전압은 전압 강하만큼 높습니다.','양쪽 동일 인덕턴스, 직렬-직렬 공진, 실효 전압 일정. 주파수 변경 시 축전기를 자동 재조정합니다. 결합계수의 거리·각도 관계는 경험적 교육용 근사이며 실제 제품 효율이나 출력 예측에는 사용하지 않습니다.'][mode];$('hint').textContent=['교류와 직류에서 2차 전압이 언제 발생하는지 비교하세요.','개방 회로와 부하 연결을 비교하고 구리손·철손의 차이를 관찰하세요.','수전 전압을 10배로 하면 같은 수전 전력에서 전류는 1/10, 손실은 1/100입니다.','거리·어긋남·기울기를 바꾸세요. 정전압 공진 모형에서는 부하 전력이 결합계수에 대해 항상 단조 증가하지 않습니다.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(t>=end())t=0;run=true;last=0};$('pause').onclick=()=>run=false;$('step').onclick=()=>{run=false;t=Math.min(end(),t+(s.type===0?1/s.f/4:.01));update()};$('reset').onclick=()=>{s=initial();t=0;run=false;saved=[null,null];build()};['a','b'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={p:{...s},t};update()});function frame(now){if(run){if(last)t=Math.min(end(),t+Math.min(.05,(now-last)/1000)*.12);last=now;if(t>=end())run=false;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>손실·효율·무부하\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e5eef8;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:10px}article,aside{background:#111d2b;border:1px solid #344b63;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(320px,57dvh,600px);background:#081321;border-radius:9px}button,select{font:inherit;background:#1c3247;color:#e4eef8;border:1px solid #49657d;border-radius:7px;padding:8px;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}label{display:block;font-size:13px;min-width:0}output{color:#7de6ce;float:right}input{width:100%;display:block;accent-color:#61dcbf}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metric{background:#0b2735;border:1px solid #2c5266;border-radius:8px;padding:8px;min-width:0;font-size:12px}.metric b{font-size:19px;display:block;color:#84e6fb;overflow-wrap:anywhere}p{line-height:1.5;color:#bed0e1;margin:8px 0}.note{font-size:12px}aside{max-height:calc(100dvh - 25px);overflow:auto}[hidden]{display:none!important}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(320px,48dvh,430px)}} \u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>손실·효율·무부하\u003c/h2>\u003ccanvas id=\"cv\" aria-label=\"손실·효율·무부하 실험 및 그래프\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"a\">조건 A\u003c/button>\u003cbutton id=\"b\">조건 B\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assume\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const mode=1,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI;\nconst initial=()=>mode===0?{type:0,V:12,n:2,f:20,L:.2,R:4,c:.9,off:.5}:mode===1?{V:12,n:2,R1:.8,R2:.5,RL:30,core:1,closed:1}:mode===2?{P:100,V:1,R:10,high:10}: {V:10,f:85,L:40,R1:2,R2:2,RL:10,d:15,offset:0,angle:0};\nlet s=initial(),t=0,run=false,last=0,saved=[null,null],W=800,H=440;\nconst fmt=(v,n=2)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.01||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString(),end=()=>mode===0?1.5:1;\nfunction calc(p,t=0){\n if(mode===0){let M=p.c*p.n*p.L,tau=p.L/p.R;if(p.type===0){let w=2*PI*p.f,z=Math.hypot(p.R,w*p.L),phase=Math.atan2(w*p.L,p.R),I=Math.SQRT2*p.V/z*Math.sin(w*t-phase),di=Math.SQRT2*p.V/z*w*Math.cos(w*t-phase);return {I,di,phi:p.L*I,emf:M*di,tau,Vin:Math.SQRT2*p.V*Math.sin(w*t)}}let on=t\u003cp.off,iOff=p.V/p.R*(-Math.expm1(-p.off/tau)),I=on?p.V/p.R*(-Math.expm1(-t/tau)):iOff*Math.exp(-(t-p.off)/tau),Vin=on?p.V:0,di=(Vin-p.R*I)/p.L;return{I,di,phi:p.L*I,emf:M*di,tau,Vin}}\n if(mode===1){let r=p.R2+p.n*p.n*p.R1,I2=p.closed?p.n*p.V/(p.RL+r):0,I1=p.n*I2,V2=I2*p.RL,cu=I1*I1*p.R1+I2*I2*p.R2,output=I2*I2*p.RL,pin=output+cu+p.core;return{I1,I2,V2:p.closed?V2:p.n*p.V,cu,output,pin,eta:pin?100*output/pin:null,core:p.core}}\n if(mode===2){let I=p.P*1000/(p.V*1000),loss=I*I*p.R,output=p.P*1000,input=output+loss,Vsend=p.V*1000+I*p.R,Ihigh=I/p.high,lossHigh=Ihigh*Ihigh*p.R;return{I,loss,output,input,Vsend,eta:100*output/input,Ihigh,lossHigh,etaHigh:100*output/(output+lossHigh)}}\n let L=p.L*1e-6,w=2*PI*p.f*1000,k=.8*Math.cos(p.angle*PI/180)/(1+(p.d/30)**2+(p.offset/30)**2)**1.5;if(Math.abs(k)\u003c1e-12)k=0;let M=k*L,X=w*M,sec=p.R2+p.RL,Z=p.R1+X*X/sec,I1=p.V/Z,I2=X*I1/sec,output=I2*I2*p.RL,cu1=I1*I1*p.R1,cu2=I2*I2*p.R2,pin=p.V*I1;return{k,M,I1,I2,output,pin,cu1,cu2,eta:100*output/pin,C:1/(w*w*L)}}\nfunction ln(x,y,X,Y,c='#405c74',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=13,align='center'){g.fillStyle=c;g.font=size+'px system-ui';g.textAlign=align;g.fillText(v,x,y)}\nfunction arrow(x,y,dx,dy,c,len=36){if(Math.hypot(dx,dy)\u003c1e-12||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.5);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.5);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.5)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction coil(x,y,w,h,n=13,rot=0){g.save();g.translate(x,y);g.rotate(rot);for(let i=0;i\u003cn;i++){let u=-w/2+w*(i+.5)/n;g.beginPath();g.ellipse(u,0,Math.max(3,w/n*.72),h/2,0,0,2*PI);g.strokeStyle='#dd9f60';g.lineWidth=2.6;g.stroke()}g.restore()}\nfunction coreScene(m){let cx=W/2,cy=H*.27,w=Math.min(W*.52,360),h=Math.min(H*.25,120),th=18,x=cx-w/2,y=cy-h/2;rect(x,y,w,th,'#8da4b7');rect(x,y+h-th,w,th,'#708699');rect(x,y,th,h,'#a1b5c3');rect(x+w-th,y,th,h,'#7c93a5');coil(x+th/2,cy,h*.83,47,15,PI/2);coil(x+w-th/2,cy,h*.83,47,15,PI/2);let I=mode===0?m.I:m.I1;if(I){arrow(cx-25,y+9,Math.sign(I),0,'#65d7f7',50);arrow(cx+25,y+h-9,-Math.sign(I),0,'#65d7f7',50)}txt('1차 코일',x-16,cy+h*.67,'#e6b57b',13);txt('2차 코일',x+w+16,cy+h*.67,'#e6b57b',13);txt('공통 철심 · 전기적으로 절연된 권선',cx,17,'#c3d7e8',12);txt(mode===0?'2차 개방 · '+(s.type===0?'교류 정상상태':t\u003cs.off?'직류 연결':'직류 차단 후 방전'):'권수비 N₂/N₁ = '+s.n.toFixed(1)+' · '+(s.closed?'저항 부하':'무부하'),cx,H*.48,'#c6d9e9',13)}\nfunction acGraph(m){let l=55,r=W-48,top=H*.57,b=H-30,mid=(top+b)/2,T=s.type===0?.1:1.5,X=v=>l+v/T*(r-l),Y=(v,lim)=>mid-v/lim*(b-top)/2;let vmax=160,imax=24;for(let k=-2;k\u003c=2;k++){let yy=Y(k*vmax/2,vmax);ln(l,yy,r,yy,'#2c455e');txt(k*vmax/2,l-5,yy+4,'#ff9fb9',10,'right');txt(k*imax/2,r+5,yy+4,'#78e5c6',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(j*T/4,3),X(j*T/4),b+15,'#adc3d6',10);for(let [key,col,lim] of [['emf','#ff9fb9',vmax],['I','#78e5c6',imax]]){g.beginPath();for(let j=0;j\u003c=400;j++){let u=T*j/400,q=calc(s,u);j?g.lineTo(X(u),Y(q[key],lim)):g.moveTo(X(u),Y(q[key],lim))}g.strokeStyle=col;g.lineWidth=2;g.stroke()}let tt=s.type===0?t%T:Math.min(t,T);ln(X(tt),top,X(tt),b,'#fbd17b');txt('2차 전압 (V)',l,top-8,'#ff9fb9',11,'left');txt('1차 전류 (A)',r,top-8,'#78e5c6',11,'right');txt('실제 시간 (s) · 고정축',W/2,H-5,'#b6cadd',11)}\nfunction bars(vals,labels,colors,max){let l=48,r=W-16,top=H*.61,b=H-31,dy=b-top,dx=(r-l)/vals.length;for(let j=0;j\u003c=4;j++){let y=b-j*dy/4;ln(l,y,r,y,'#2c455d');txt(fmt(j*max/4,1),l-5,y+3,'#a6bdd3',10,'right')}for(let i=0;i\u003cvals.length;i++){let h=Math.max(0,vals[i]/max*dy);rect(l+i*dx+dx*.19,b-h,dx*.62,h,colors[i]);txt(labels[i],l+(i+.5)*dx,b+16,'#c9dbea',11);if(h>17)txt(fmt(vals[i],1),l+(i+.5)*dx,b-h+13,'#081321',11)}}\nfunction lossScene(m){coreScene(m);txt('전력 수지 · 공급 = 부하 + 구리손 + 철손',W/2,H*.56,'#c6dbec',12);bars([m.output,m.cu,m.core],['부하 W','구리손 W','철손 W'],['#6bdfbb','#f6b876','#ef8fa9'],1200)}\nfunction transmission(m){let cy=H*.26,x1=W*.14,x2=W*.86;for(let [x,label] of [[x1,'송전측'],[x2,'수전측']]){rect(x-24,cy-25,48,50,'#344b60');coil(x,cy,35,45,8);txt(label,x,cy+44)}ln(x1+24,cy-10,x2-24,cy-10,'#a9b9c5',4);ln(x1+24,cy+10,x2-24,cy+10,'#a9b9c5',4);arrow(W*.42,cy-10,1,0,'#ffbd77',46);txt('왕복 선로 R = '+s.R+' Ω',W/2,cy-29);txt('수전 전압 '+s.V+' kV / '+fmt(s.V*s.high)+' kV 비교',W/2,H*.47,'#c4daea',13);let max=1e7;let l=56,r=W-20,top=H*.60,b=H-31;let values=[m.loss,m.lossHigh];for(let j=0;j\u003c=5;j++){let v=10**(j+2),yy=b-j*(b-top)/5;ln(l,yy,r,yy,'#2f465d');txt('10^'+(j+2),l-5,yy+3,'#a9c3d8',10,'right')}for(let i=0;i\u003c2;i++){let z=Math.max(0,Math.min(5,Math.log10(Math.max(values[i],100))-2)),h=z/5*(b-top),x=l+(i+.5)*(r-l)/2;rect(x-30,b-h,60,h,i?'#67dcbc':'#f7b674');txt(i?'고압':'기준',x,b+16);txt(fmt(values[i]/1000)+' kW',x,Math.max(top+12,b-h-6),i?'#8be9ce':'#ffc88d',12)}txt('선로 손실 (W) · 로그축 · 100 W 미만은 하단',l,top-8,'#bdcfe1',11,'left')}\nfunction wireless(m){let cx=W/2,cy=H*.25,xoff=s.offset/100*Math.min(W*.25,110),gap=24+s.d*1.1,r=Math.min(W*.22,125),ry=21;for(let i=0;i\u003c2;i++){let x=cx+(i?xoff:0),y=cy+(i?gap:0);g.save();g.translate(x,y);if(i)g.rotate(s.angle*PI/180*.6);for(let j=0;j\u003c8;j++){g.beginPath();g.ellipse(0,0,r-j*5,ry-j*1.3,0,0,2*PI);g.strokeStyle=i?'#d8a0f0':'#dc9a55';g.lineWidth=2;g.stroke()}g.restore()}if(m.k>0)for(let j=-2;j\u003c=2;j++)arrow(cx+j*22,cy+18,xoff,gap,'#6acbfa',Math.min(gap*.65,55));txt('송신 코일',cx,cy-32,'#f4c98d');txt('수신 코일',cx+xoff,cy+gap+35,'#deb5f1');txt('거리·어긋남·기울기 → 결합계수 k',W/2,17,'#c8dcea',12);txt('전력 수지 · 송신 저항손 + 수신 저항손 + 부하',W/2,H*.56,'#c2d9ec',12);bars([m.cu1,m.cu2,m.output],['송신 손실 W','수신 손실 W','부하 W'],['#f6b876','#ef94b3','#6cdfb7'],200)}\nfunction draw(){let grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#142a40');grad.addColorStop(1,'#081321');g.fillStyle=grad;g.fillRect(0,0,W,H);let m=calc(s,t);if(mode===0){coreScene(m);acGraph(m)}else if(mode===1)lossScene(m);else if(mode===2)transmission(m);else wireless(m)}\nfunction summary(a){let m=calc(a.p,a.t);return mode===0?'2차 전압 '+fmt(m.emf)+' V':mode===1?'효율 '+fmt(m.eta)+'%':mode===2?'선로손 '+fmt(m.loss/1000)+' kW':'k '+fmt(m.k,3)+' / 효율 '+fmt(m.eta)+'%'}\nfunction update(){let m=calc(s,t),rows=mode===0?[['1차 순간 전류',fmt(m.I)+' A'],['1차 쇄교 자속',fmt(m.phi)+' Wb·회'],['2차 개방 전압',fmt(m.emf)+' V'],['시정수',fmt(m.tau)+' s']]:mode===1?[['2차 단자 전압',fmt(m.V2)+' V'],['2차 전류',fmt(m.I2)+' A'],['부하 전력',fmt(m.output)+' W'],['구리손',fmt(m.cu)+' W'],['철손',fmt(m.core)+' W'],['효율',m.eta===null?'—':fmt(m.eta)+'%']]:mode===2?[['기준 선로 전류',fmt(m.I)+' A'],['고압 선로 전류',fmt(m.Ihigh)+' A'],['기준 전력 손실',fmt(m.loss/1000)+' kW'],['고압 전력 손실',fmt(m.lossHigh/1000)+' kW'],['기준 효율',fmt(m.eta)+'%'],['고압 효율',fmt(m.etaHigh)+'%'],['기준 송전단 전압',fmt(m.Vsend/1000)+' kV']]:[['결합 계수 k',fmt(m.k,3)],['상호 인덕턴스',fmt(m.M*1e6,3)+' μH'],['송신 전류',fmt(m.I1)+' A'],['수신 전류',fmt(m.I2)+' A'],['부하 전력',fmt(m.output)+' W'],['전송 효율',fmt(m.eta)+'%'],['공진 축전기',fmt(m.C*1e9)+' nF']];$('metrics').innerHTML=rows.map(([k,v])=>'\u003cdiv class=\"metric\">'+k+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((a,i)=>['A','B'][i]+': '+(a?summary(a):'미저장')).join(' | ');draw()}\nfunction slider(k,label,min,max,step){let el=document.createElement('label');el.innerHTML=label+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];t=0;run=false;update()};$('controls').append(el)}\nfunction choice(k,label,opts){let el=document.createElement('label');el.textContent=label;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;t=0;run=false;build()};el.append(e);$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){choice('type','입력 전원',[[0,'교류 정상상태'],[1,'직류 연결·차단']]);slider('V',s.type===0?'입력 실효 전압 (V)':'직류 전압 (V)',2,24,1);slider('n','권수비',.5,3,.5);slider('L','1차 인덕턴스 (H)',.1,.5,.05);slider('R','1차 저항 (Ω)',1,10,.5);slider('c','결합계수',0,1,.05);if(s.type===0)slider('f','주파수 (Hz)',10,50,5);else slider('off','차단 시각 (s)',.2,1,.1)}else if(mode===1){slider('V','1차 실효 전압 (V)',2,24,1);slider('n','권수비',.5,3,.5);slider('R1','1차 저항 (Ω)',.2,2,.1);slider('R2','2차 저항 (Ω)',.1,2,.1);slider('RL','부하 저항 (Ω)',5,100,5);slider('core','철손 (W)',0,5,.5);choice('closed','2차 회로',[[1,'부하 연결'],[0,'개방']])}else if(mode===2){slider('P','수전 전력 (kW)',10,500,10);slider('V','기준 수전 전압 (kV)',.5,10,.5);slider('R','왕복 선로 저항 (Ω)',1,20,1);slider('high','고압 전압 배수',2,20,1)}else{slider('V','송신 실효 전압 (V)',2,20,1);slider('f','주파수 (kHz)',50,150,5);slider('L','코일 인덕턴스 (μH)',20,100,5);slider('R1','송신 저항 (Ω)',2,8,.5);slider('R2','수신 저항 (Ω)',1,8,.5);slider('RL','부하 저항 (Ω)',2,30,1);slider('d','코일 거리 (mm)',5,80,5);slider('offset','중심 어긋남 (mm)',0,80,5);slider('angle','코일 기울기 (°)',0,90,5)}for(let id of ['play','pause','step'])$(id).hidden=mode!==0;$('formula').textContent=['v₂=M·di₁/dt (대응 단자 극성) · τ=L₁/R₁','P입력=P부하+I₁²R₁+I₂²R₂+P철손 · η=P부하/P입력','I=P수전/V수전 · P손실=I²R · η=P수전/(P수전+P손실)','M=k√(L₁L₂) · Z입력=R₁+(ωM)²/(R₂+R부하)'][mode];$('assume').textContent=['2차 개방, 선형 결합 코일. 교류는 정상상태, 직류 차단 후 1차는 저항을 통한 폐회로 유지. 순간 연결·차단의 전압과 정상상태를 구분합니다. 그래프는 고정축으로 일부 큰 신호는 잘릴 수 있습니다.','이상 변압기와 직렬 권선 저항, 일정 철손을 둔 등가회로. 여자 전류의 무효 성분 및 포화·누설은 제외. 무부하에서도 철손은 발생할 수 있습니다.','역률 1의 등가 저항성 2선로. 같은 수전 전력, 같은 왕복 선로 저항, 수전 전압만 변경. 송전단 전압은 전압 강하만큼 높습니다.','양쪽 동일 인덕턴스, 직렬-직렬 공진, 실효 전압 일정. 주파수 변경 시 축전기를 자동 재조정합니다. 결합계수의 거리·각도 관계는 경험적 교육용 근사이며 실제 제품 효율이나 출력 예측에는 사용하지 않습니다.'][mode];$('hint').textContent=['교류와 직류에서 2차 전압이 언제 발생하는지 비교하세요.','개방 회로와 부하 연결을 비교하고 구리손·철손의 차이를 관찰하세요.','수전 전압을 10배로 하면 같은 수전 전력에서 전류는 1/10, 손실은 1/100입니다.','거리·어긋남·기울기를 바꾸세요. 정전압 공진 모형에서는 부하 전력이 결합계수에 대해 항상 단조 증가하지 않습니다.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(t>=end())t=0;run=true;last=0};$('pause').onclick=()=>run=false;$('step').onclick=()=>{run=false;t=Math.min(end(),t+(s.type===0?1/s.f/4:.01));update()};$('reset').onclick=()=>{s=initial();t=0;run=false;saved=[null,null];build()};['a','b'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={p:{...s},t};update()});function frame(now){if(run){if(last)t=Math.min(end(),t+Math.min(.05,(now-last)/1000)*.12);last=now;if(t>=end())run=false;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>고압 송전과 전력 손실\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e5eef8;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:10px}article,aside{background:#111d2b;border:1px solid #344b63;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(320px,57dvh,600px);background:#081321;border-radius:9px}button,select{font:inherit;background:#1c3247;color:#e4eef8;border:1px solid #49657d;border-radius:7px;padding:8px;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}label{display:block;font-size:13px;min-width:0}output{color:#7de6ce;float:right}input{width:100%;display:block;accent-color:#61dcbf}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metric{background:#0b2735;border:1px solid #2c5266;border-radius:8px;padding:8px;min-width:0;font-size:12px}.metric b{font-size:19px;display:block;color:#84e6fb;overflow-wrap:anywhere}p{line-height:1.5;color:#bed0e1;margin:8px 0}.note{font-size:12px}aside{max-height:calc(100dvh - 25px);overflow:auto}[hidden]{display:none!important}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(320px,48dvh,430px)}} \u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>고압 송전과 전력 손실\u003c/h2>\u003ccanvas id=\"cv\" aria-label=\"고압 송전과 전력 손실 실험 및 그래프\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"a\">조건 A\u003c/button>\u003cbutton id=\"b\">조건 B\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assume\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const mode=2,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI;\nconst initial=()=>mode===0?{type:0,V:12,n:2,f:20,L:.2,R:4,c:.9,off:.5}:mode===1?{V:12,n:2,R1:.8,R2:.5,RL:30,core:1,closed:1}:mode===2?{P:100,V:1,R:10,high:10}: {V:10,f:85,L:40,R1:2,R2:2,RL:10,d:15,offset:0,angle:0};\nlet s=initial(),t=0,run=false,last=0,saved=[null,null],W=800,H=440;\nconst fmt=(v,n=2)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.01||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString(),end=()=>mode===0?1.5:1;\nfunction calc(p,t=0){\n if(mode===0){let M=p.c*p.n*p.L,tau=p.L/p.R;if(p.type===0){let w=2*PI*p.f,z=Math.hypot(p.R,w*p.L),phase=Math.atan2(w*p.L,p.R),I=Math.SQRT2*p.V/z*Math.sin(w*t-phase),di=Math.SQRT2*p.V/z*w*Math.cos(w*t-phase);return {I,di,phi:p.L*I,emf:M*di,tau,Vin:Math.SQRT2*p.V*Math.sin(w*t)}}let on=t\u003cp.off,iOff=p.V/p.R*(-Math.expm1(-p.off/tau)),I=on?p.V/p.R*(-Math.expm1(-t/tau)):iOff*Math.exp(-(t-p.off)/tau),Vin=on?p.V:0,di=(Vin-p.R*I)/p.L;return{I,di,phi:p.L*I,emf:M*di,tau,Vin}}\n if(mode===1){let r=p.R2+p.n*p.n*p.R1,I2=p.closed?p.n*p.V/(p.RL+r):0,I1=p.n*I2,V2=I2*p.RL,cu=I1*I1*p.R1+I2*I2*p.R2,output=I2*I2*p.RL,pin=output+cu+p.core;return{I1,I2,V2:p.closed?V2:p.n*p.V,cu,output,pin,eta:pin?100*output/pin:null,core:p.core}}\n if(mode===2){let I=p.P*1000/(p.V*1000),loss=I*I*p.R,output=p.P*1000,input=output+loss,Vsend=p.V*1000+I*p.R,Ihigh=I/p.high,lossHigh=Ihigh*Ihigh*p.R;return{I,loss,output,input,Vsend,eta:100*output/input,Ihigh,lossHigh,etaHigh:100*output/(output+lossHigh)}}\n let L=p.L*1e-6,w=2*PI*p.f*1000,k=.8*Math.cos(p.angle*PI/180)/(1+(p.d/30)**2+(p.offset/30)**2)**1.5;if(Math.abs(k)\u003c1e-12)k=0;let M=k*L,X=w*M,sec=p.R2+p.RL,Z=p.R1+X*X/sec,I1=p.V/Z,I2=X*I1/sec,output=I2*I2*p.RL,cu1=I1*I1*p.R1,cu2=I2*I2*p.R2,pin=p.V*I1;return{k,M,I1,I2,output,pin,cu1,cu2,eta:100*output/pin,C:1/(w*w*L)}}\nfunction ln(x,y,X,Y,c='#405c74',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=13,align='center'){g.fillStyle=c;g.font=size+'px system-ui';g.textAlign=align;g.fillText(v,x,y)}\nfunction arrow(x,y,dx,dy,c,len=36){if(Math.hypot(dx,dy)\u003c1e-12||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.5);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.5);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.5)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction coil(x,y,w,h,n=13,rot=0){g.save();g.translate(x,y);g.rotate(rot);for(let i=0;i\u003cn;i++){let u=-w/2+w*(i+.5)/n;g.beginPath();g.ellipse(u,0,Math.max(3,w/n*.72),h/2,0,0,2*PI);g.strokeStyle='#dd9f60';g.lineWidth=2.6;g.stroke()}g.restore()}\nfunction coreScene(m){let cx=W/2,cy=H*.27,w=Math.min(W*.52,360),h=Math.min(H*.25,120),th=18,x=cx-w/2,y=cy-h/2;rect(x,y,w,th,'#8da4b7');rect(x,y+h-th,w,th,'#708699');rect(x,y,th,h,'#a1b5c3');rect(x+w-th,y,th,h,'#7c93a5');coil(x+th/2,cy,h*.83,47,15,PI/2);coil(x+w-th/2,cy,h*.83,47,15,PI/2);let I=mode===0?m.I:m.I1;if(I){arrow(cx-25,y+9,Math.sign(I),0,'#65d7f7',50);arrow(cx+25,y+h-9,-Math.sign(I),0,'#65d7f7',50)}txt('1차 코일',x-16,cy+h*.67,'#e6b57b',13);txt('2차 코일',x+w+16,cy+h*.67,'#e6b57b',13);txt('공통 철심 · 전기적으로 절연된 권선',cx,17,'#c3d7e8',12);txt(mode===0?'2차 개방 · '+(s.type===0?'교류 정상상태':t\u003cs.off?'직류 연결':'직류 차단 후 방전'):'권수비 N₂/N₁ = '+s.n.toFixed(1)+' · '+(s.closed?'저항 부하':'무부하'),cx,H*.48,'#c6d9e9',13)}\nfunction acGraph(m){let l=55,r=W-48,top=H*.57,b=H-30,mid=(top+b)/2,T=s.type===0?.1:1.5,X=v=>l+v/T*(r-l),Y=(v,lim)=>mid-v/lim*(b-top)/2;let vmax=160,imax=24;for(let k=-2;k\u003c=2;k++){let yy=Y(k*vmax/2,vmax);ln(l,yy,r,yy,'#2c455e');txt(k*vmax/2,l-5,yy+4,'#ff9fb9',10,'right');txt(k*imax/2,r+5,yy+4,'#78e5c6',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(j*T/4,3),X(j*T/4),b+15,'#adc3d6',10);for(let [key,col,lim] of [['emf','#ff9fb9',vmax],['I','#78e5c6',imax]]){g.beginPath();for(let j=0;j\u003c=400;j++){let u=T*j/400,q=calc(s,u);j?g.lineTo(X(u),Y(q[key],lim)):g.moveTo(X(u),Y(q[key],lim))}g.strokeStyle=col;g.lineWidth=2;g.stroke()}let tt=s.type===0?t%T:Math.min(t,T);ln(X(tt),top,X(tt),b,'#fbd17b');txt('2차 전압 (V)',l,top-8,'#ff9fb9',11,'left');txt('1차 전류 (A)',r,top-8,'#78e5c6',11,'right');txt('실제 시간 (s) · 고정축',W/2,H-5,'#b6cadd',11)}\nfunction bars(vals,labels,colors,max){let l=48,r=W-16,top=H*.61,b=H-31,dy=b-top,dx=(r-l)/vals.length;for(let j=0;j\u003c=4;j++){let y=b-j*dy/4;ln(l,y,r,y,'#2c455d');txt(fmt(j*max/4,1),l-5,y+3,'#a6bdd3',10,'right')}for(let i=0;i\u003cvals.length;i++){let h=Math.max(0,vals[i]/max*dy);rect(l+i*dx+dx*.19,b-h,dx*.62,h,colors[i]);txt(labels[i],l+(i+.5)*dx,b+16,'#c9dbea',11);if(h>17)txt(fmt(vals[i],1),l+(i+.5)*dx,b-h+13,'#081321',11)}}\nfunction lossScene(m){coreScene(m);txt('전력 수지 · 공급 = 부하 + 구리손 + 철손',W/2,H*.56,'#c6dbec',12);bars([m.output,m.cu,m.core],['부하 W','구리손 W','철손 W'],['#6bdfbb','#f6b876','#ef8fa9'],1200)}\nfunction transmission(m){let cy=H*.26,x1=W*.14,x2=W*.86;for(let [x,label] of [[x1,'송전측'],[x2,'수전측']]){rect(x-24,cy-25,48,50,'#344b60');coil(x,cy,35,45,8);txt(label,x,cy+44)}ln(x1+24,cy-10,x2-24,cy-10,'#a9b9c5',4);ln(x1+24,cy+10,x2-24,cy+10,'#a9b9c5',4);arrow(W*.42,cy-10,1,0,'#ffbd77',46);txt('왕복 선로 R = '+s.R+' Ω',W/2,cy-29);txt('수전 전압 '+s.V+' kV / '+fmt(s.V*s.high)+' kV 비교',W/2,H*.47,'#c4daea',13);let l=56,r=W-20,top=H*.60,b=H-31;let values=[m.loss,m.lossHigh];for(let j=0;j\u003c=5;j++){let v=10**(-2+j*2),yy=b-j*(b-top)/5;ln(l,yy,r,yy,'#2f465d');txt('10^'+(-2+j*2),l-5,yy+3,'#a9c3d8',10,'right')}for(let i=0;i\u003c2;i++){let z=Math.max(0,Math.min(10,Math.log10(Math.max(values[i],.01))+2)),h=z/10*(b-top),x=l+(i+.5)*(r-l)/2;rect(x-30,b-h,60,h,i?'#67dcbc':'#f7b674');txt(i?'고압':'기준',x,b+16);txt(fmt(values[i]/1000)+' kW',x,Math.max(top+12,b-h-6),i?'#8be9ce':'#ffc88d',12)}txt('선로 손실 (W) · 로그축 · 0.01 W 미만은 하단',l,top-8,'#bdcfe1',11,'left')}\nfunction wireless(m){let cx=W/2,cy=H*.25,xoff=s.offset/100*Math.min(W*.25,110),gap=24+s.d*1.1,r=Math.min(W*.22,125),ry=21;for(let i=0;i\u003c2;i++){let x=cx+(i?xoff:0),y=cy+(i?gap:0);g.save();g.translate(x,y);if(i)g.rotate(s.angle*PI/180*.6);for(let j=0;j\u003c8;j++){g.beginPath();g.ellipse(0,0,r-j*5,ry-j*1.3,0,0,2*PI);g.strokeStyle=i?'#d8a0f0':'#dc9a55';g.lineWidth=2;g.stroke()}g.restore()}if(m.k>0)for(let j=-2;j\u003c=2;j++)arrow(cx+j*22,cy+18,xoff,gap,'#6acbfa',Math.min(gap*.65,55));txt('송신 코일',cx,cy-32,'#f4c98d');txt('수신 코일',cx+xoff,cy+gap+35,'#deb5f1');txt('거리·어긋남·기울기 → 결합계수 k',W/2,17,'#c8dcea',12);txt('전력 수지 · 송신 저항손 + 수신 저항손 + 부하',W/2,H*.56,'#c2d9ec',12);bars([m.cu1,m.cu2,m.output],['송신 손실 W','수신 손실 W','부하 W'],['#f6b876','#ef94b3','#6cdfb7'],200)}\nfunction draw(){let grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#142a40');grad.addColorStop(1,'#081321');g.fillStyle=grad;g.fillRect(0,0,W,H);let m=calc(s,t);if(mode===0){coreScene(m);acGraph(m)}else if(mode===1)lossScene(m);else if(mode===2)transmission(m);else wireless(m)}\nfunction summary(a){let m=calc(a.p,a.t);return mode===0?'2차 전압 '+fmt(m.emf)+' V':mode===1?'효율 '+fmt(m.eta)+'%':mode===2?'선로손 '+fmt(m.loss/1000)+' kW':'k '+fmt(m.k,3)+' / 효율 '+fmt(m.eta)+'%'}\nfunction update(){let m=calc(s,t),rows=mode===0?[['1차 순간 전류',fmt(m.I)+' A'],['1차 쇄교 자속',fmt(m.phi)+' Wb·회'],['2차 개방 전압',fmt(m.emf)+' V'],['시정수',fmt(m.tau)+' s']]:mode===1?[['2차 단자 전압',fmt(m.V2)+' V'],['2차 전류',fmt(m.I2)+' A'],['부하 전력',fmt(m.output)+' W'],['구리손',fmt(m.cu)+' W'],['철손',fmt(m.core)+' W'],['효율',m.eta===null?'—':fmt(m.eta)+'%']]:mode===2?[['기준 선로 전류',fmt(m.I)+' A'],['고압 선로 전류',fmt(m.Ihigh)+' A'],['기준 전력 손실',fmt(m.loss/1000)+' kW'],['고압 전력 손실',fmt(m.lossHigh/1000)+' kW'],['기준 효율',fmt(m.eta)+'%'],['고압 효율',fmt(m.etaHigh)+'%'],['기준 송전단 전압',fmt(m.Vsend/1000)+' kV']]:[['결합 계수 k',fmt(m.k,3)],['상호 인덕턴스',fmt(m.M*1e6,3)+' μH'],['송신 전류',fmt(m.I1)+' A'],['수신 전류',fmt(m.I2)+' A'],['부하 전력',fmt(m.output)+' W'],['전송 효율',fmt(m.eta)+'%'],['공진 축전기',fmt(m.C*1e9)+' nF']];$('metrics').innerHTML=rows.map(([k,v])=>'\u003cdiv class=\"metric\">'+k+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((a,i)=>['A','B'][i]+': '+(a?summary(a):'미저장')).join(' | ');draw()}\nfunction slider(k,label,min,max,step){let el=document.createElement('label');el.innerHTML=label+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];t=0;run=false;update()};$('controls').append(el)}\nfunction choice(k,label,opts){let el=document.createElement('label');el.textContent=label;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;t=0;run=false;build()};el.append(e);$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){choice('type','입력 전원',[[0,'교류 정상상태'],[1,'직류 연결·차단']]);slider('V',s.type===0?'입력 실효 전압 (V)':'직류 전압 (V)',2,24,1);slider('n','권수비',.5,3,.5);slider('L','1차 인덕턴스 (H)',.1,.5,.05);slider('R','1차 저항 (Ω)',1,10,.5);slider('c','결합계수',0,1,.05);if(s.type===0)slider('f','주파수 (Hz)',10,50,5);else slider('off','차단 시각 (s)',.2,1,.1)}else if(mode===1){slider('V','1차 실효 전압 (V)',2,24,1);slider('n','권수비',.5,3,.5);slider('R1','1차 저항 (Ω)',.2,2,.1);slider('R2','2차 저항 (Ω)',.1,2,.1);slider('RL','부하 저항 (Ω)',5,100,5);slider('core','철손 (W)',0,5,.5);choice('closed','2차 회로',[[1,'부하 연결'],[0,'개방']])}else if(mode===2){slider('P','수전 전력 (kW)',10,500,10);slider('V','기준 수전 전압 (kV)',.5,10,.5);slider('R','왕복 선로 저항 (Ω)',1,20,1);slider('high','고압 전압 배수',2,20,1)}else{slider('V','송신 실효 전압 (V)',2,20,1);slider('f','주파수 (kHz)',50,150,5);slider('L','코일 인덕턴스 (μH)',20,100,5);slider('R1','송신 저항 (Ω)',2,8,.5);slider('R2','수신 저항 (Ω)',1,8,.5);slider('RL','부하 저항 (Ω)',2,30,1);slider('d','코일 거리 (mm)',5,80,5);slider('offset','중심 어긋남 (mm)',0,80,5);slider('angle','코일 기울기 (°)',0,90,5)}for(let id of ['play','pause','step'])$(id).hidden=mode!==0;$('formula').textContent=['v₂=M·di₁/dt (대응 단자 극성) · τ=L₁/R₁','P입력=P부하+I₁²R₁+I₂²R₂+P철손 · η=P부하/P입력','I=P수전/V수전 · P손실=I²R · η=P수전/(P수전+P손실)','M=k√(L₁L₂) · Z입력=R₁+(ωM)²/(R₂+R부하)'][mode];$('assume').textContent=['2차 개방, 선형 결합 코일. 교류는 정상상태, 직류 차단 후 1차는 저항을 통한 폐회로 유지. 순간 연결·차단의 전압과 정상상태를 구분합니다. 그래프는 고정축으로 일부 큰 신호는 잘릴 수 있습니다.','이상 변압기와 직렬 권선 저항, 일정 철손을 둔 등가회로. 여자 전류의 무효 성분 및 포화·누설은 제외. 무부하에서도 철손은 발생할 수 있습니다.','역률 1의 등가 저항성 2선로. 같은 수전 전력, 같은 왕복 선로 저항, 수전 전압만 변경. 송전단 전압은 전압 강하만큼 높습니다.','양쪽 동일 인덕턴스, 직렬-직렬 공진, 실효 전압 일정. 주파수 변경 시 축전기를 자동 재조정합니다. 결합계수의 거리·각도 관계는 경험적 교육용 근사이며 실제 제품 효율이나 출력 예측에는 사용하지 않습니다.'][mode];$('hint').textContent=['교류와 직류에서 2차 전압이 언제 발생하는지 비교하세요.','개방 회로와 부하 연결을 비교하고 구리손·철손의 차이를 관찰하세요.','수전 전압을 10배로 하면 같은 수전 전력에서 전류는 1/10, 손실은 1/100입니다.','거리·어긋남·기울기를 바꾸세요. 정전압 공진 모형에서는 부하 전력이 결합계수에 대해 항상 단조 증가하지 않습니다.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(t>=end())t=0;run=true;last=0};$('pause').onclick=()=>run=false;$('step').onclick=()=>{run=false;t=Math.min(end(),t+(s.type===0?1/s.f/4:.01));update()};$('reset').onclick=()=>{s=initial();t=0;run=false;saved=[null,null];build()};['a','b'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={p:{...s},t};update()});function frame(now){if(run){if(last)t=Math.min(end(),t+Math.min(.05,(now-last)/1000)*.12);last=now;if(t>=end())run=false;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>무선 전력 전송\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e5eef8;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:10px}article,aside{background:#111d2b;border:1px solid #344b63;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(320px,57dvh,600px);background:#081321;border-radius:9px}button,select{font:inherit;background:#1c3247;color:#e4eef8;border:1px solid #49657d;border-radius:7px;padding:8px;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}label{display:block;font-size:13px;min-width:0}output{color:#7de6ce;float:right}input{width:100%;display:block;accent-color:#61dcbf}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metric{background:#0b2735;border:1px solid #2c5266;border-radius:8px;padding:8px;min-width:0;font-size:12px}.metric b{font-size:19px;display:block;color:#84e6fb;overflow-wrap:anywhere}p{line-height:1.5;color:#bed0e1;margin:8px 0}.note{font-size:12px}aside{max-height:calc(100dvh - 25px);overflow:auto}[hidden]{display:none!important}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(320px,48dvh,430px)}} \u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>무선 전력 전송\u003c/h2>\u003ccanvas id=\"cv\" aria-label=\"무선 전력 전송 실험 및 그래프\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"a\">조건 A\u003c/button>\u003cbutton id=\"b\">조건 B\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assume\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const mode=3,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI;\nconst initial=()=>mode===0?{type:0,V:12,n:2,f:20,L:.2,R:4,c:.9,off:.5}:mode===1?{V:12,n:2,R1:.8,R2:.5,RL:30,core:1,closed:1}:mode===2?{P:100,V:1,R:10,high:10}: {V:10,f:85,L:40,R1:2,R2:2,RL:10,d:15,offset:0,angle:0};\nlet s=initial(),t=0,run=false,last=0,saved=[null,null],W=800,H=440;\nconst fmt=(v,n=2)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.01||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString(),end=()=>mode===0?1.5:1;\nfunction calc(p,t=0){\n if(mode===0){let M=p.c*p.n*p.L,tau=p.L/p.R;if(p.type===0){let w=2*PI*p.f,z=Math.hypot(p.R,w*p.L),phase=Math.atan2(w*p.L,p.R),I=Math.SQRT2*p.V/z*Math.sin(w*t-phase),di=Math.SQRT2*p.V/z*w*Math.cos(w*t-phase);return {I,di,phi:p.L*I,emf:M*di,tau,Vin:Math.SQRT2*p.V*Math.sin(w*t)}}let on=t\u003cp.off,iOff=p.V/p.R*(-Math.expm1(-p.off/tau)),I=on?p.V/p.R*(-Math.expm1(-t/tau)):iOff*Math.exp(-(t-p.off)/tau),Vin=on?p.V:0,di=(Vin-p.R*I)/p.L;return{I,di,phi:p.L*I,emf:M*di,tau,Vin}}\n if(mode===1){let r=p.R2+p.n*p.n*p.R1,I2=p.closed?p.n*p.V/(p.RL+r):0,I1=p.n*I2,V2=I2*p.RL,cu=I1*I1*p.R1+I2*I2*p.R2,output=I2*I2*p.RL,pin=output+cu+p.core;return{I1,I2,V2:p.closed?V2:p.n*p.V,cu,output,pin,eta:pin?100*output/pin:null,core:p.core}}\n if(mode===2){let I=p.P*1000/(p.V*1000),loss=I*I*p.R,output=p.P*1000,input=output+loss,Vsend=p.V*1000+I*p.R,Ihigh=I/p.high,lossHigh=Ihigh*Ihigh*p.R;return{I,loss,output,input,Vsend,eta:100*output/input,Ihigh,lossHigh,etaHigh:100*output/(output+lossHigh)}}\n let L=p.L*1e-6,w=2*PI*p.f*1000,k=.8*Math.cos(p.angle*PI/180)/(1+(p.d/30)**2+(p.offset/30)**2)**1.5;if(Math.abs(k)\u003c1e-12)k=0;let M=k*L,X=w*M,sec=p.R2+p.RL,Z=p.R1+X*X/sec,I1=p.V/Z,I2=X*I1/sec,output=I2*I2*p.RL,cu1=I1*I1*p.R1,cu2=I2*I2*p.R2,pin=p.V*I1;return{k,M,I1,I2,output,pin,cu1,cu2,eta:100*output/pin,C:1/(w*w*L)}}\nfunction ln(x,y,X,Y,c='#405c74',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=13,align='center'){g.fillStyle=c;g.font=size+'px system-ui';g.textAlign=align;g.fillText(v,x,y)}\nfunction arrow(x,y,dx,dy,c,len=36){if(Math.hypot(dx,dy)\u003c1e-12||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.5);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.5);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.5)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction coil(x,y,w,h,n=13,rot=0){g.save();g.translate(x,y);g.rotate(rot);for(let i=0;i\u003cn;i++){let u=-w/2+w*(i+.5)/n;g.beginPath();g.ellipse(u,0,Math.max(3,w/n*.72),h/2,0,0,2*PI);g.strokeStyle='#dd9f60';g.lineWidth=2.6;g.stroke()}g.restore()}\nfunction coreScene(m){let cx=W/2,cy=H*.27,w=Math.min(W*.52,360),h=Math.min(H*.25,120),th=18,x=cx-w/2,y=cy-h/2;rect(x,y,w,th,'#8da4b7');rect(x,y+h-th,w,th,'#708699');rect(x,y,th,h,'#a1b5c3');rect(x+w-th,y,th,h,'#7c93a5');coil(x+th/2,cy,h*.83,47,15,PI/2);coil(x+w-th/2,cy,h*.83,47,15,PI/2);let I=mode===0?m.I:m.I1;if(I){arrow(cx-25,y+9,Math.sign(I),0,'#65d7f7',50);arrow(cx+25,y+h-9,-Math.sign(I),0,'#65d7f7',50)}txt('1차 코일',x-16,cy+h*.67,'#e6b57b',13);txt('2차 코일',x+w+16,cy+h*.67,'#e6b57b',13);txt('공통 철심 · 전기적으로 절연된 권선',cx,17,'#c3d7e8',12);txt(mode===0?'2차 개방 · '+(s.type===0?'교류 정상상태':t\u003cs.off?'직류 연결':'직류 차단 후 방전'):'권수비 N₂/N₁ = '+s.n.toFixed(1)+' · '+(s.closed?'저항 부하':'무부하'),cx,H*.48,'#c6d9e9',13)}\nfunction acGraph(m){let l=55,r=W-48,top=H*.57,b=H-30,mid=(top+b)/2,T=s.type===0?.1:1.5,X=v=>l+v/T*(r-l),Y=(v,lim)=>mid-v/lim*(b-top)/2;let vmax=160,imax=24;for(let k=-2;k\u003c=2;k++){let yy=Y(k*vmax/2,vmax);ln(l,yy,r,yy,'#2c455e');txt(k*vmax/2,l-5,yy+4,'#ff9fb9',10,'right');txt(k*imax/2,r+5,yy+4,'#78e5c6',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(j*T/4,3),X(j*T/4),b+15,'#adc3d6',10);for(let [key,col,lim] of [['emf','#ff9fb9',vmax],['I','#78e5c6',imax]]){g.beginPath();for(let j=0;j\u003c=400;j++){let u=T*j/400,q=calc(s,u);j?g.lineTo(X(u),Y(q[key],lim)):g.moveTo(X(u),Y(q[key],lim))}g.strokeStyle=col;g.lineWidth=2;g.stroke()}let tt=s.type===0?t%T:Math.min(t,T);ln(X(tt),top,X(tt),b,'#fbd17b');txt('2차 전압 (V)',l,top-8,'#ff9fb9',11,'left');txt('1차 전류 (A)',r,top-8,'#78e5c6',11,'right');txt('실제 시간 (s) · 고정축',W/2,H-5,'#b6cadd',11)}\nfunction bars(vals,labels,colors,max){let l=48,r=W-16,top=H*.61,b=H-31,dy=b-top,dx=(r-l)/vals.length;for(let j=0;j\u003c=4;j++){let y=b-j*dy/4;ln(l,y,r,y,'#2c455d');txt(fmt(j*max/4,1),l-5,y+3,'#a6bdd3',10,'right')}for(let i=0;i\u003cvals.length;i++){let h=Math.max(0,vals[i]/max*dy);rect(l+i*dx+dx*.19,b-h,dx*.62,h,colors[i]);txt(labels[i],l+(i+.5)*dx,b+16,'#c9dbea',11);if(h>17)txt(fmt(vals[i],1),l+(i+.5)*dx,b-h+13,'#081321',11)}}\nfunction lossScene(m){coreScene(m);txt('전력 수지 · 공급 = 부하 + 구리손 + 철손',W/2,H*.56,'#c6dbec',12);bars([m.output,m.cu,m.core],['부하 W','구리손 W','철손 W'],['#6bdfbb','#f6b876','#ef8fa9'],1200)}\nfunction transmission(m){let cy=H*.26,x1=W*.14,x2=W*.86;for(let [x,label] of [[x1,'송전측'],[x2,'수전측']]){rect(x-24,cy-25,48,50,'#344b60');coil(x,cy,35,45,8);txt(label,x,cy+44)}ln(x1+24,cy-10,x2-24,cy-10,'#a9b9c5',4);ln(x1+24,cy+10,x2-24,cy+10,'#a9b9c5',4);arrow(W*.42,cy-10,1,0,'#ffbd77',46);txt('왕복 선로 R = '+s.R+' Ω',W/2,cy-29);txt('수전 전압 '+s.V+' kV / '+fmt(s.V*s.high)+' kV 비교',W/2,H*.47,'#c4daea',13);let max=1e7;let l=56,r=W-20,top=H*.60,b=H-31;let values=[m.loss,m.lossHigh];for(let j=0;j\u003c=5;j++){let v=10**(j+2),yy=b-j*(b-top)/5;ln(l,yy,r,yy,'#2f465d');txt('10^'+(j+2),l-5,yy+3,'#a9c3d8',10,'right')}for(let i=0;i\u003c2;i++){let z=Math.max(0,Math.min(5,Math.log10(Math.max(values[i],100))-2)),h=z/5*(b-top),x=l+(i+.5)*(r-l)/2;rect(x-30,b-h,60,h,i?'#67dcbc':'#f7b674');txt(i?'고압':'기준',x,b+16);txt(fmt(values[i]/1000)+' kW',x,Math.max(top+12,b-h-6),i?'#8be9ce':'#ffc88d',12)}txt('선로 손실 (W) · 로그축 · 100 W 미만은 하단',l,top-8,'#bdcfe1',11,'left')}\nfunction wireless(m){let cx=W/2,cy=H*.18,xoff=s.offset/100*Math.min(W*.25,110),gap=22+s.d/80*H*.23,r=Math.min(W*.22,125),ry=21;for(let i=0;i\u003c2;i++){let x=cx+(i?xoff:0),y=cy+(i?gap:0);g.save();g.translate(x,y);if(i){g.scale(1,Math.max(.045,Math.cos(s.angle*PI/180)));}for(let j=0;j\u003c8;j++){g.beginPath();g.ellipse(0,0,r-j*5,ry-j*1.3,0,0,2*PI);g.strokeStyle=i?'#d8a0f0':'#dc9a55';g.lineWidth=2;g.stroke()}g.restore()}if(m.k>0)for(let j=-2;j\u003c=2;j++)arrow(cx+j*22,cy+18,xoff,gap,'#6acbfa',Math.min(gap*.65,55));txt('송신 코일',cx,cy-32,'#f4c98d');txt('수신 코일',cx+xoff,cy+gap+35,'#deb5f1');txt('거리·어긋남·기울기 → 결합계수 k',W/2,17,'#c8dcea',12);txt('전력 수지 · 송신 저항손 + 수신 저항손 + 부하',W/2,H*.56,'#c2d9ec',12);bars([m.cu1,m.cu2,m.output],['송신 손실 W','수신 손실 W','부하 W'],['#f6b876','#ef94b3','#6cdfb7'],200)}\nfunction draw(){let grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#142a40');grad.addColorStop(1,'#081321');g.fillStyle=grad;g.fillRect(0,0,W,H);let m=calc(s,t);if(mode===0){coreScene(m);acGraph(m)}else if(mode===1)lossScene(m);else if(mode===2)transmission(m);else wireless(m)}\nfunction summary(a){let m=calc(a.p,a.t);return mode===0?'2차 전압 '+fmt(m.emf)+' V':mode===1?'효율 '+fmt(m.eta)+'%':mode===2?'선로손 '+fmt(m.loss/1000)+' kW':'k '+fmt(m.k,3)+' / 효율 '+fmt(m.eta)+'%'}\nfunction update(){let m=calc(s,t),rows=mode===
