;font-size:clamp(13px,1.3vw,18px);color:var(--cyan);overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted);margin:2px 0}.status{color:#ffda9b;min-height:1.4em}.group{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.detail{max-width:1000px;line-height:1.7}.detail h3{color:var(--cyan);margin:12px 0 3px}.detail p{margin:0 0 9px}.tablewrap{overflow:auto;max-height:175px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}footer{font-size:11px;color:#9eb4c9;text-align:center;padding:7px}a{color:inherit}[hidden]{display:none!important}@media(max-width:680px){main{display:flex;flex-direction:column;padding:0 6px}.stage{order:0}.controls{order:1;max-height:none}.scene{height:clamp(190px,29dvh,250px)}.scene.solo{height:clamp(240px,37dvh,400px)}.scope{height:210px}.scope.solo{height:320px}.meters{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:8px}header{padding:8px}nav{padding:0 6px 6px}}
</style></head><body><header><h1>⚡ 다이오드와 정류 회로 통합 실험실</h1><button id="full">⛶ 전체화면</button></header><nav id="tabs" role="tablist" aria-label="실험 선택"></nav><main><aside id="controls" class="panel controls"></aside><section class="panel stage"><h2 id="heading"></h2><div id="scene" class="scene"><canvas id="circuit" aria-label="다이오드와 정류 회로 시뮬레이션"></canvas></div><div id="scope" class="scope"><canvas id="graph" aria-label="입력 및 출력 파형 그래프"></canvas></div><div id="meters" class="meters"></div><div id="status" class="status" aria-live="polite"></div><p id="hint" class="note"></p><div id="detail" class="detail" hidden></div></section></main><footer>© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer><script>
'use strict';
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,n=3)=>!Number.isFinite(x)?'—':Math.abs(x)>0&&Math.abs(x)<.001?x.toExponential(2):Number(x.toFixed(n)).toLocaleString('ko-KR');
const modes=[['pn','PN 접합·바이어스'],['led','LED·전류 제한'],['half','반파 정류'],['bridge','전파 정류'],['smooth','평활 회로'],['graphs','파형·측정 비교'],['concept','개념 설명']];

function dcModel(V,R,Vf){const I=Math.max(0,(V-Vf)/R);return{I,Vd:V-I*R,VR:I*R,PR:I*I*R,PD:(V-I*R)*I}}

function rectModel(a,type,filter,steps=1000){const period=1/a.freq,dt=period/steps,C=filter?a.cap*1e-6:0,R=a.load,decay=C>0?Math.exp(-dt/(R*C)):0;let out=0;const arr=[];for(let i=0;i<=3*steps;i++){const v=a.peak*Math.sin(2*Math.PI*i/steps),raw=rawRect(v,type,a.drop),free=out*decay;const on=raw>0&&raw>=free-1e-12;out=C>0?Math.max(raw,free):raw;if(i>=steps)arr.push({x:(i-steps)/steps,vin:v,raw,out,on: C>0?on:raw>0})}const last=arr.slice(steps,2*steps),min=Math.min(...last.map(p=>p.out)),max=Math.max(...last.map(p=>p.out)),mean=last.reduce((x,p)=>x+p.out,0)/last.length,rms=Math.sqrt(last.reduce((x,p)=>x+p.out*p.out,0)/last.length);return{arr,period,min,max,mean,rms,ripple:max-min,steps,type,filter:C>0}}
function at(d,cycle){const n=((cycle%2)+2)%2,i=Math.min(d.arr.length-1,Math.floor(n*d.steps));return d.arr[i]}
let s=defaults(),mode='pn',running=false,cycle=0,last=0,dirty=true,modelDirty=true,data=null,saved={A:null,B:null},records=[],notice='조건을 조절하고 시작을 누르세요.';
function kind(){return mode==='half'?'half':mode==='bridge'?'bridge':s.rectType}function filtering(){return mode==='smooth'||mode==='graphs'?s.filter:false}
function ensure(){if(modelDirty){data=rectModel(s,kind(),filtering());modelDirty=false}return data}
function resetPhase(msg='조건 변경 · 시작을 누르세요.'){running=false;cycle=0;notice=msg;modelDirty=true;dirty=true}
function changeMode(m){if(mode===m)return;const old=mode;if(old==='half'||old==='bridge'){s.rectType=old;if(m==='graphs')s.filter=false}if(m==='smooth')s.filter=true;mode=m;resetPhase('조건을 조절하고 시작을 누르세요.');build()}
for(const [id,label] of modes){const b=document.createElement('button');b.textContent=label;b.dataset.mode=id;b.setAttribute('role','tab');b.onclick=()=>changeMode(id);$('tabs').append(b)}$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(z=>z[0]===mode),j=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;changeMode(modes[j][0]);$('tabs').children[j].focus()});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
const fields={bias:['접합에 가한 전압',-3,3,.1,'V'],dc:['직류 전원',-6,12,.5,'V'],seriesR:['직렬 저항',100,1000,10,'Ω'],peak:['교류 최대 전압',2,12,.5,'V'],freq:['교류 진동수',10,100,5,'Hz'],load:['부하 저항',100,5000,100,'Ω'],cap:['평활 축전기',0,2200,10,'μF'],drop:['다이오드 순방향 강하',0,1,.1,'V'],speed:['관찰 속도',.25,3,.25,'×']};
function slider(id){const [name,min,max,step,unit]=fields[id];return '<div class="field"><label for="'+id+'">'+name+'<output id="'+id+'out">'+fmt(s[id])+' '+unit+'</output></label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>'}
function btn(id,label){return '<button id="'+id+'">'+label+'</button>'}function select(id,opts,val){return '<select id="'+id+'" aria-label="'+id+'">'+opts.map(([k,v])=>'<option value="'+k+'" '+(k===val?'selected':'')+'>'+v+'</option>').join('')+'</select>'}function bind(id,fn,event='click'){if($(id))$(id).addEventListener(event,fn)}
function snapshot(){return{a:{...s},type:kind(),filter:filtering()}}
function build(){for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}const cc=$('controls'),dd=$('detail');cc.hidden=mode==='concept';$('scene').hidden=['graphs','concept'].includes(mode);$('scene').classList.toggle('solo',mode==='pn');$('scope').hidden=['pn','concept'].includes(mode);$('scope').classList.toggle('solo',mode==='graphs');$('meters').hidden=mode==='concept';dd.hidden=!['graphs','concept'].includes(mode);let h='<h2>실험 조건</h2>';
if(mode==='pn')h+=slider('bias')+'<div class="row">'+btn('forward','순방향')+btn('zero','무바이어스')+btn('reverse','역방향')+'</div><p class="note">공핍층 폭·운반자 이동은 정성적 확대 모형입니다. 실제 폭과 전압의 비례 관계를 나타내지 않습니다.</p>';
if(mode==='led')h+=slider('dc')+slider('seriesR')+select('ledType',[['red','빨강 LED'],['green','초록 LED'],['blue','파랑 LED']],s.ledType)+'<p class="note">일정한 순방향 강하 모형. 실제 LED는 정격 전류와 역전압 제한이 있습니다.</p>';
if(['half','bridge','smooth','graphs'].includes(mode)){if(['smooth','graphs'].includes(mode))h+=select('rectType',[['half','반파 정류'],['bridge','브리지 전파 정류']],s.rectType)+'<div class="row">'+btn('filterOn','축전기 연결')+btn('filterOff','축전기 제거')+'</div>';h+=slider('peak')+slider('freq')+slider('load')+slider('drop');if(['smooth','graphs'].includes(mode))h+=slider('cap');if(mode==='graphs')h+=select('axis',[['cycles','2주기 기준'],['seconds','0~200 ms 고정축']],s.axis)+'<p class="note">파형 비교는 주기 또는 공통 시간축을 선택할 수 있습니다.</p>'}
if(mode!=='concept'){h+='<div class="group">'+slider('speed')+'<div class="row">'+btn('play','▶ 시작')+btn('restart','↺ 처음부터')+'</div></div>';if(['half','bridge','smooth','graphs'].includes(mode))h+='<div class="group"><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('record','측정 기록')+btn('clear','기록 삭제')+'</div></div>';h+='<div class="group">'+btn('reset','전체 초기화')+'</div>'}cc.innerHTML=h;
if(mode==='concept')dd.innerHTML='<h3>1. PN 접합과 바이어스</h3><p>P형의 다수 운반자는 정공, N형은 전자이다. 접합부에서 확산과 재결합으로 공핍층이 생기며 고정된 이온이 내부 전기장을 만든다. 순방향 전압(P에 +)은 장벽을 낮추고 공핍층을 좁힌다. 역방향은 장벽을 높이고 공핍층을 넓힌다. 실제 순방향 전류는 지수적으로 증가하며 역방향에는 작은 누설전류와 항복이 존재한다.</p><h3>2. 다이오드와 LED</h3><p>이 실험에서는 순방향 전압강하 Vf를 일정하게, 역방향 전류를 0으로 근사한다. 직렬 저항 R을 연결하면 I=max(0,(Vs−Vf)/R). LED의 발광은 전자와 정공의 재결합에 따른 에너지 방출이다. 색에 따른 Vf는 예시이며 실제 값은 제품과 전류에 따라 달라진다.</p><h3>3. 반파·전파 정류</h3><p>반파는 양의 반주기만 전달하고 음의 반주기는 차단한다. 브리지 전파는 교류의 두 반주기를 모두 이용하며 매 반주기마다 서로 다른 두 다이오드가 도통한다. 부하 전류 방향은 일정하다. 일정 강하 모형에서 반파 출력=max(0,Vin−Vf), 브리지 출력=max(0,|Vin|−2Vf).</p><h3>4. 평활 축전기</h3><p>축전기를 부하에 병렬 연결하면 정류 전압의 봉우리 근처에서 충전되고, 다이오드가 차단되는 동안 부하로 방전한다. 방전 구간 Vc(t)=V₀e<sup>−t/(RC)</sup>. 리플은 최대 출력 전압과 최소 출력 전압의 차이다. C와 R이 클수록 방전이 느려진다. 작은 리플에서 ΔV≈I부하/(f리플 C); 반파 f리플=f, 전파 f리플=2f.</p><h3>5. 모형과 안전</h3><p>정류 파형은 이상적인 교류 전원, 일정 다이오드 강하, 이상적인 축전기 및 저항 부하의 반복 정상상태를 수치 근사한다. 전원 내부저항, 실제 다이오드의 역회복과 역전압 항복, 충전 돌입 전류는 계산하지 않는다. 따라서 도통 표시를 실제 다이오드 최대 전류로 해석하면 안 된다. 실제 상용 전원에 직접 연결하지 않는다.</p><h3>탐구 질문</h3><p>① 순방향과 역방향에서 공핍층은? ② LED에 저항을 직렬로 연결하는 까닭은? ③ 반파와 전파의 리플 진동수는? ④ 같은 부하에서 C가 증가하면 리플은? ⑤ 브리지에서 다이오드 두 개의 전압강하를 고려하는 이유는?</p>';
for(const id of Object.keys(fields))bind(id,e=>{s[id]=+e.target.value;$(id+'out').textContent=fmt(s[id])+' '+fields[id][4];if(id!=='speed'){modelDirty=true;dirty=true;notice='조건 변경 · 즉시 반영'}refresh()},'input');for(const id of ['ledType','rectType','axis'])bind(id,e=>{s[id]=e.target.value;modelDirty=true;dirty=true;refresh()},'change');
for(const [k,v] of [['forward',1.5],['zero',0],['reverse',-2]])bind(k,()=>{s.bias=v;dirty=true;build()});bind('filterOn',()=>{s.filter=true;modelDirty=true;dirty=true;build()});bind('filterOff',()=>{s.filter=false;modelDirty=true;dirty=true;build()});bind('play',()=>{running=!running;notice=running?'진행 중 · 정류 파형은 느린 관찰 모형':'일시정지 · 현재 위상 유지';dirty=true;refresh()});bind('restart',()=>{resetPhase('처음 위상으로 초기화');refresh()});for(const k of ['A','B'])bind('save'+k,()=>{saved[k]=snapshot();notice='조건 '+k+' 저장';dirty=true;refresh()});bind('record',()=>{const z=snapshot(),d=ensure();records.push({...z,mean:d.mean,ripple:d.ripple,max:d.max,min:d.min});if(records.length>30)records.shift();notice='가상 측정값 기록';dirty=true;refresh()});bind('clear',()=>{records=[];saved={A:null,B:null};notice='기록 삭제';dirty=true;refresh()});bind('reset',()=>{s=defaults();saved={A:null,B:null};records=[];resetPhase('전체 초기화 완료');build()});refresh();resize()}
function refresh(){let a=[],hint='';if(mode==='pn'){const v=s.bias;a=[['바이어스',v>0?'순방향':v<0?'역방향':'무바이어스'],['가한 전압',fmt(v)+' V'],['공핍층',v>0?'좁아짐':v<0?'넓어짐':'평형'],['다수 운반자',v>0?'접합 방향 이동':v<0?'접합에서 멀어짐':'평형']];hint='고정 이온: P쪽 −, N쪽 +. 내부 전기장은 N쪽에서 P쪽으로 향합니다. 정성적 모형입니다.'}else if(mode==='led'){const d=dcModel(s.dc,s.seriesR,LED[s.ledType][0]);a=[['전원 전압',fmt(s.dc)+' V'],['LED 전압',fmt(d.Vd)+' V'],['전류',fmt(d.I*1000)+' mA'],['저항 소비 전력',fmt(d.PR*1000)+' mW'],['LED 상태',d.I>0?'점등':'꺼짐']];hint='일정 전압강하 모형입니다. 20 mA 초과 또는 역방향은 실제 소자 정격 확인이 필요합니다. 역항복은 생략했습니다.'}else if(mode!=='concept'){const d=ensure(),p=at(d,cycle);a=[['입력 순간 전압',fmt(p.vin)+' V'],['출력 순간 전압',fmt(p.out)+' V'],['부하 전류',fmt(p.out/s.load*1000)+' mA'],['평균 출력',fmt(d.mean)+' V'],['리플 ΔV',fmt(d.ripple)+' V'],['리플 진동수',s.freq*(kind()==='bridge'?2:1)+' Hz']];hint='교류 입력(하늘색), 부하 출력(민트색), 정류 원파형(회색). 2주기 정상상태 관찰을 느리게 재생합니다. 입력 설정은 최대 전압이며 실효값이 아닙니다.';if(mode==='smooth')hint+=' 축전기 충전 시 전원 도통, 그 외에는 부하로 방전.'}
$('heading').textContent=modes.find(z=>z[0]===mode)[1];$('meters').innerHTML=a.map(z=>'<div class="meter"><small>'+z[0]+'</small><b>'+z[1]+'</b></div>').join('');$('status').textContent=mode==='concept'?'':mode==='led'&&dcModel(s.dc,s.seriesR,LED[s.ledType][0]).I>.02?'주의: 20 mA 초과 · 예시 정격을 넘는 전류':notice;$('hint').textContent=hint;if($('play'))$('play').textContent=running?'Ⅱ 일시정지':'▶ 시작 / 재개';if($('filterOn'))$('filterOn').classList.toggle('on',s.filter);if($('filterOff'))$('filterOff').classList.toggle('on',!s.filter);
if(mode==='graphs')$('detail').innerHTML='<div class="tablewrap"><table><thead><tr><th>조건</th><th>정류</th><th>f (Hz)</th><th>C (μF)</th><th>R (Ω)</th><th>평균 (V)</th><th>리플 (V)</th></tr></thead><tbody>'+records.map((z,i)=>'<tr>'+[i+1,z.type==='half'?'반파':'전파',z.a.freq,z.filter?z.a.cap:0,z.a.load,fmt(z.mean),fmt(z.ripple)].map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
const c=$('circuit'),g=c.getContext('2d'),cg=$('graph'),gg=cg.getContext('2d');let w=1,h=1,gw=1,gh=1,dpr=1,S=1,ox=0,oy=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);const r=c.getBoundingClientRect(),q=cg.getBoundingClientRect();if(r.width&&r.height){w=r.width;h=r.height;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);S=Math.min(w/820,h/310);ox=(w-820*S)/2;oy=(h-310*S)/2}if(q.width&&q.height){gw=q.width;gh=q.height;cg.width=Math.round(gw*dpr);cg.height=Math.round(gh*dpr)}dirty=true}new ResizeObserver(resize).observe($('scene'));new ResizeObserver(resize).observe($('scope'));
function text(ctx,t,x,y,col='#d7e9f7',size=15,align='center'){ctx.fillStyle=col;ctx.font='600 '+size+'px system-ui';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function line(ctx,p,col='#9bb7cb',width=3){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.stroke()}
function dot(x,y,r=4,col='#a8c6d8'){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function rect(x,y,W,H,r,fill,stroke='#6b8da3'){g.fillStyle=fill;g.strokeStyle=stroke;g.lineWidth=1.4;g.beginPath();g.roundRect(x,y,W,H,r);g.fill();g.stroke()}
function arrow(x,y,X,Y,col='#72e7df'){const a=Math.atan2(Y-y,X-x);line(g,[[x,y],[X,Y]],col,2.3);line(g,[[X-9*Math.cos(a-.45),Y-9*Math.sin(a-.45)],[X,Y],[X-9*Math.cos(a+.45),Y-9*Math.sin(a+.45)]],col,2.3)}
function diode(a,b,on,label='',led=false){const [x,y]=[(a[0]+b[0])/2,(a[1]+b[1])/2],ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=Math.hypot(b[0]-a[0],b[1]-a[1]),col=on?'#72e7df':'#9db4c8';g.save();g.translate(x,y);g.rotate(ang);line(g,[[-L/2,0],[-15,0]],col,3);line(g,[[15,0],[L/2,0]],col,3);g.beginPath();g.moveTo(-15,-13);g.lineTo(-15,13);g.lineTo(12,0);g.closePath();g.strokeStyle=col;g.lineWidth=2.6;g.stroke();line(g,[[15,-15],[15,15]],col,3);if(led){arrow(-5,-19,12,-38,col);arrow(10,-19,27,-38,col)}g.restore();if(label)text(g,label,x,y-25,on?'#72e7df':'#c4d8e8',13)}
function resistor(x,y,R,vertical=false,on=false){g.save();g.translate(x,y);if(vertical)g.rotate(Math.PI/2);const a=g.createLinearGradient(0,-14,0,14);a.addColorStop(0,'#e5bf97');a.addColorStop(.5,'#a57949');a.addColorStop(1,'#62442d');rect(-35,-14,70,28,6,a,on?'#ffd18b':'#a88767');text(g,fmt(R)+' Ω',0,0,'#fff0d7',12);g.restore()}
function ac(x,y,V){dot(x,y,26,'#20374e');g.strokeStyle='#a4c7dc';g.lineWidth=2;g.beginPath();g.arc(x,y,26,0,Math.PI*2);g.stroke();line(g,Array.from({length:33},(_,i)=>[x-15+i*30/32,y-9*Math.sin(i/32*Math.PI*2)]),'#a7dbff',2);text(g,fmt(V)+' V',x,y+40,'#a6d9ff',14)}
function capacitor(x,top,bot,V,on){const y=(top+bot)/2;line(g,[[x,top],[x,y-9]],on?'#72e7df':'#9bb7cb');line(g,[[x,y+9],[x,bot]],on?'#72e7df':'#9bb7cb');line(g,[[x-20,y-9],[x+20,y-9]],'#df9a84',4);line(g,[[x-20,y+9],[x+20,y+9]],'#8fbfec',4);text(g,fmt(s.cap)+' μF',x+5,y+37,'#b5d1e2',12);if(V>0){text(g,'+',x-25,y-12,'#f4ab9e',13);text(g,'−',x-25,y+13,'#8fbfec',13)}}
function pnScene(){const v=s.bias,d=clamp(66-v*14,22,115),L=100,R=720,mid=410,top=55,bot=248;rect(L,top,mid-L,bot-top,8,'#573743','#bd7d8e');rect(mid,top,R-mid,bot-top,8,'#233e62','#699fcf');g.fillStyle='#c6d4e333';g.fillRect(mid-d,top,2*d,bot-top);line(g,[[mid-d,top],[mid-d,bot]],'#d7c2cb',1.5);line(g,[[mid+d,top],[mid+d,bot]],'#c6daed',1.5);text(g,'P형 (정공)',215,32,'#ffb1b5',19);text(g,'N형 (전자)',605,32,'#a5d1ff',19);text(g,'공핍층',mid,32,'#dce7f3',16);
for(let i=0;i<7;i++)for(let j=0;j<3;j++){const x=L+23+i*(mid-d-L-40)/6,y=88+j*60,xx=mid+d+20+i*(R-mid-d-40)/6;dot(x,y,10,'#e1939d');text(g,'+',x,y,'#562934',14);dot(xx,y,9,'#7fb7ed');text(g,'−',xx,y,'#193c65',14)}
for(let i=0;i<3;i++)for(let j=0;j<3;j++){const x=mid-d+(i+.5)*d/3,y=90+j*60;rect(x-7,y-7,14,14,2,'#b37787');text(g,'−',x,y,'#fff',11);rect(2*mid-x-7,y-7,14,14,2,'#6f9fcc');text(g,'+',2*mid-x,y,'#fff',11)}arrow(mid+d-7,bot+20,mid-d+7,bot+20,'#ffd18b');text(g,'내부 전기장',mid,bot+37,'#ffd18b',13);

function ledScene(){const [vf,color,label]=LED[s.ledType],d=dcModel(s.dc,s.seriesR,vf),on=d.I>0,top=62,bot=248;line(g,[[100,122],[100,top],[335,top]]);line(g,[[405,top],[660,top],[660,bot],[100,bot],[100,182]]);resistor(370,top,s.seriesR,false,on);rect(55,122,90,60,9,'#57768a');text(g,fmt(s.dc)+' V',100,152,'#edf4ff',20);text(g,s.dc>=0?'+':'−',100,114,'#ffd18b',15);text(g,s.dc>=0?'−':'+',100,192,'#a8c6d8',15);g.fillStyle='#081624';g.fillRect(625,top+60,70,80);if(on){const gr=g.createRadialGradient(660,155,5,660,155,90);gr.addColorStop(0,color+'cc');gr.addColorStop(1,color+'00');dot(660,155,90,gr)}diode([660,top],[660,bot],on,'',true);if(on){arrow(460,top,520,top);arrow(550,bot,490,bot)}text(g,label+' LED · Vf ≈ '+vf+' V',660,285,color,15);text(g,'전류 '+fmt(d.I*1000)+' mA',370,155,'#72e7df',22);text(g,'저항 전압 '+fmt(d.VR)+' V',370,183,'#c0d8e8',15);text(g,on?'전자·정공 재결합 → 발광':'순방향 전류 없음',370,210,'#ffd18b',15)}
function halfScene(d,p){const on=p.on,top=62,bot=249,capOn=d.filter;line(g,[[105,top],[105,129]]);line(g,[[105,181],[105,bot],[capOn?695:550,bot]]);ac(105,155,p.vin);diode([105,top],[360,top],on,'D');line(g,[[360,top],[capOn?695:550,top]]);line(g,[[550,top],[550,120]],'#9bb7cb');resistor(550,155,s.load,true,p.out>0);line(g,[[550,190],[550,bot]]);if(capOn){capacitor(695,top,bot,p.out,on);dot(550,top);dot(550,bot)}if(on){arrow(390,top,460,top);arrow(480,bot,410,bot)}if(p.out>0)arrow(550,194,550,231);text(g,'부하',610,155,'#d7e9f7',15);text(g,'반파 정류 · '+(on?'다이오드 도통':'다이오드 차단'),410,286,'#ffd18b',17)}
function bridgeScene(d,p){const L=[115,155],R=[455,155],P=[285,38],N=[285,272],pos=p.vin>=0,on=p.on,capOn=d.filter;diode(L,P,on&&pos,'D1');diode(R,P,on&&!pos,'D2');diode(N,L,on&&!pos,'D3');diode(N,R,on&&pos,'D4');line(g,[[L[0],L[1]],[259,155]]);line(g,[[311,155],[R[0],R[1]]]);ac(285,155,p.vin);[L,R,P,N].forEach(z=>dot(...z));const x=615,top=P[1],bot=N[1];line(g,[P,[capOn?750:x,top]]);line(g,[N,[capOn?750:x,bot]]);line(g,[[x,top],[x,120]]);resistor(x,155,s.load,true,p.out>0);line(g,[[x,190],[x,bot]]);if(capOn){capacitor(750,top,bot,p.out,on);dot(x,top);dot(x,bot)}if(p.out>0)arrow(x,195,x,245);if(on){arrow(365,top,430,top);arrow(430,bot,365,bot)}text(g,'+',P[0]+20,top-15,'#ffb09c',17);text(g,'−',N[0]+20,bot+15,'#a1cdff',17);text(g,'부하',660,155,'#d7e9f7',14);text(g,on?(pos?'D1 · D4 도통':'D2 · D3 도통'):'다이오드 차단',110,294,'#ffd18b',15,'left');text(g,'부하 방향 일정',615,295,'#72e7df',15)}
function drawCircuit(){g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#081624';g.fillRect(0,0,w,h);g.setTransform(dpr*S,0,0,dpr*S,dpr*ox,dpr*oy);for(let x=0;x<820;x+=40)line(g,[[x,0],[x,310]],'#172b3d',1);for(let y=0;y<310;y+=40)line(g,[[0,y],[820,y]],'#172b3d',1);if(mode==='pn')pnScene();else if(mode==='led')ledScene();else{const d=ensure(),p=at(d,cycle);if(kind()==='half')halfScene(d,p);else bridgeScene(d,p)}}
function graphPlot(){gg.setTransform(dpr,0,0,dpr,0,0);gg.fillStyle='#081624';gg.fillRect(0,0,gw,gh);const L=46,R=gw-12,T=27,B=gh-29;let xmin=0,xmax=2,ymin=-12,ymax=12,xunit='주기',yunit='V',series=[],cursor=null;
if(mode==='led'){xmin=-6;xmax=12;ymin=0;ymax=120;xunit='전원 전압 (V)';yunit='mA';const vf=LED[s.ledType][0];series=[{color:'#72e7df',pts:Array.from({length:181},(_,i)=>{const v=-6+i*.1;return[v,dcModel(v,s.seriesR,vf).I*1000]})}];cursor=[s.dc,dcModel(s.dc,s.seriesR,vf).I*1000]}
else{const d=ensure(),seconds=mode==='graphs'&&s.axis==='seconds';xmax=seconds?200:2;xunit=seconds?'시간 (ms)':'입력 주기 (t/T) · T='+fmt(1000/s.freq,1)+' ms';const make=(d,key)=>Array.from({length:1001},(_,i)=>{const x=xmax*i/1000,cy=seconds?x/(d.period*1000):x;return[x,at(d,cy)[key]]});series=[{color:'#8dc7ff',pts:make(d,'vin')},{color:'#72e7df',pts:make(d,'out')}];if(d.filter)series.splice(1,0,{color:'#7f93a9',dash:[4,4],pts:make(d,'raw')});if(mode==='graphs')for(const k of ['A','B'])if(saved[k]){const z=saved[k],v=rectModel(z.a,z.type,z.filter);series.push({color:k==='A'?'#ffd18b':'#c7a5ff',dash:k==='A'?[7,4]:[2,4],pts:make(v,'out')})}const p=at(d,cycle);cursor=[seconds?(cycle*d.period*1000):cycle%2,p.out]}
const X=x=>L+(x-xmin)/(xmax-xmin)*(R-L),Y=y=>B-(y-ymin)/(ymax-ymin)*(B-T);for(let i=0;i<=4;i++){const x=xmin+(xmax-xmin)*i/4,y=ymin+(ymax-ymin)*i/4;line(gg,[[X(x),T],[X(x),B]],'#294257',1);line(gg,[[L,Y(y)],[R,Y(y)]],'#294257',1);text(gg,fmt(x,1),X(x),B+11,'#a6c0d4',10);text(gg,fmt(y,1),L-6,Y(y),'#a6c0d4',10,'right')}text(gg,yunit,11,12,'#b8d4e5',11,'left');text(gg,xunit,gw/2,gh-7,'#b8d4e5',10);text(gg,mode==='led'?'LED 회로의 전원 전압–전류':'입력 / 출력 · '+(mode==='graphs'?'A·B 저장 조건 비교':'순간 파형'),gw/2,12,'#e0eef8',12);
gg.save();gg.beginPath();gg.rect(L,T,R-L,B-T);gg.clip();for(const z of series){gg.setLineDash(z.dash||[]);line(gg,z.pts.map(p=>[X(p[0]),Y(p[1])]),z.color,2);gg.setLineDash([])}if(cursor){line(gg,[[X(cursor[0]),T],[X(cursor[0]),B]],'#e6cf9e',1);gg.fillStyle='#ffd18b';gg.beginPath();gg.arc(X(cursor[0]),Y(cursor[1]),4,0,Math.PI*2);gg.fill()}gg.restore()}
function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(running&&!document.hidden){const span=mode==='graphs'&&s.axis==='seconds'?s.freq*.2:2;cycle=(cycle+dt*.6*s.speed)%span;dirty=true}if(dirty&&mode!=='concept'){if(!$('scene').hidden&&w>1)drawCircuit();if(!$('scope').hidden&&gw>1)graphPlot();refresh();dirty=false}requestAnimationFrame(frame)}build();requestAnimationFrame(frame);
