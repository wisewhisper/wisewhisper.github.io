'use strict';
const CARD_RATIO=167.0869141/242.6669922;

let state,history=[],selected=null,hintMove=null,stats={wins:0,daily:[],best:null},theme='garden',saved=true,autoEmpty=true,mobileView='fit',lastMoveCards=[];

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function hash(s){return Array.from(s).reduce((a,c)=>(Math.imul(a,31)+c.charCodeAt(0))|0,0)>>>0}
const LEVELS={easy:{name:'쉬움',cells:4},normal:{name:'보통',cells:4},hard:{name:'어려움',cells:3},expert:{name:'최고급',cells:2}};
function deal(seed,mode='free',level=0,difficulty='normal'){if(mode==='practice')difficulty='easy';if(!LEVELS[difficulty])difficulty='normal';let r=rng(seed),cols=Array.from({length:8},()=>[]);if(mode==='practice'){let left=[13,13,13,13];while(left.some(Boolean)){let options=left.map((n,i)=>n?i:-1).filter(i=>i>=0),s=options[Math.floor(r()*options.length)];cols[Math.floor(r()*8)].push(s*13+left[s]-1);left[s]--}}else{let deck=Array.from({length:52},(_,i)=>i);for(let i=51;i>0;i--){let j=Math.floor(r()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}deck.forEach((c,i)=>cols[i%8].push(c))}return{cols,free:Array(LEVELS[difficulty].cells).fill(null),found:[0,0,0,0],seed,mode,level,difficulty,moves:0,hints:0,elapsed:0,won:false,date:mode==='daily'?day():null}}
function pile(loc){return loc.t==='col'?state.cols[loc.i]:loc.t==='free'?(state.free[loc.i]===null?[]:[state.free[loc.i]]):[]}
function chain(cards){return cards.every((c,i)=>!i||(rank(cards[i-1])===rank(c)+1&&red(cards[i-1])!==red(c)))}
function cardsAt(src){return pile(src).slice(src.t==='col'?src.p:0)}
function capacity(dst){let f=state.free.filter(c=>c===null).length,e=state.cols.filter((a,i)=>!a.length&&!(dst.t==='col'&&i===dst.i)).length;return(f+1)*2**e}
function legal(src,dst){if(src.t===dst.t&&src.i===dst.i)return false;let a=cardsAt(src);if(!a.length||!chain(a))return false;let c=a[0];if(dst.t==='found')return a.length===1&&suit(c)===dst.i&&rank(c)===state.found[dst.i]+1;if(dst.t==='free')return a.length===1&&state.free[dst.i]===null;if(dst.t==='col'){let p=state.cols[dst.i],last=p.at(-1);return a.length<=capacity(dst)&&(!p.length||(rank(last)===rank(c)+1&&red(last)!==red(c)))}return false}
function sources(){let a=[];state.cols.forEach((p,i)=>p.forEach((_,j)=>{if(chain(p.slice(j)))a.push({t:'col',i,p:j})}));state.free.forEach((c,i)=>{if(c!==null)a.push({t:'free',i})});return a}
function destinations(){return [...Array.from({length:4},(_,i)=>({t:'found',i})),...Array.from({length:8},(_,i)=>({t:'col',i})),...Array.from({length:4},(_,i)=>({t:'free',i}))]}
function safe(c){let n=rank(c);return n<=2||state.found.every((v,i)=>i%2===suit(c)%2||v>=n-1)}
function execute(src,dst,remember=true){if(state.won||!legal(src,dst))return false;if(remember){history.push(clone(state));if(history.length>300)history.shift()}let a=cardsAt(src);lastMoveCards=a.slice();if(src.t==='col')state.cols[src.i].splice(src.p);else state.free[src.i]=null;if(dst.t==='col')state.cols[dst.i].push(...a);else if(dst.t==='free')state.free[dst.i]=a[0];else state.found[dst.i]++;state.moves++;selected=null;hintMove=null;checkWin();save();render();revealMove(dst);return true}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,history,stats,theme,autoEmpty,mobileView,controlVersion:12}));saved=true}catch{saved=false}document.getElementById('saveLabel').textContent=saved?'기기에 자동 저장':'저장 불가 · 브라우저 설정을 확인하세요'}
function checkWin(){if(state.found.every(x=>x===13)&&!state.won){state.won=true;stats.wins++;stats.best=stats.best===null?state.moves:Math.min(stats.best,state.moves);if(state.mode==='daily'&&!stats.daily.includes(state.date))stats.daily.push(state.date);setTimeout(win,200)}}

const PHONE_SUITS=[
'M0 -12C-4 -7 -12 -2 -12 4C-12 11 -4 12 -1 6C-1 10 -3 12 -5 14H5C3 12 1 10 1 6C4 12 12 11 12 4C12 -2 4 -7 0 -12Z',

'M-4 -1C-12 -10 -2 -17 3 -11C7 -7 4 -3 2 -1C12 -8 19 4 10 9C6 11 2 8 1 5C1 10 3 12 5 14H-5C-3 12 -1 10 -1 5C-4 12 -14 10 -14 3C-14 -3 -8 -5 -4 -1Z',

function phoneFace(c){let label=face(c),p=PHONE_SUITS[suit(c)];return `<svg class="mobile-face" viewBox="0 0 100 145" aria-hidden="true" focusable="false"><text x="5" y="36" fill="currentColor" font-family="Arial,Helvetica,sans-serif" font-size="${label==='10'?36:43}" font-weight="700" letter-spacing="-2">${label}</text><path d="${p}" transform="translate(81 22) scale(.92)" fill="currentColor"/><path d="${p}" transform="translate(50 94) scale(2.85)" fill="currentColor"/></svg>`}
function phoneStep(cardHeight){let columnTop=document.getElementById('columns').getBoundingClientRect().top,maxRows=Math.max(1,...state.cols.map(p=>p.length));let available=Math.max(185,innerHeight-columnTop-108);let preferred=Math.min(28,Math.max(21,cardHeight*.34));return Math.max(23,Math.min(preferred,(available-cardHeight)/Math.max(1,maxRows-1)))}

function card(c,src,j=0){let b=document.createElement('button');b.className='card';b.style.setProperty('--ink',INKS[suit(c)]);b.style.setProperty('--tint',TINTS[suit(c)]);b.style.setProperty('--phone-ink',red(c)?'#b81e31':'#17201c');if(lastMoveCards.includes(c))b.classList.add('just-moved');b.style.top=j+'px';b.setAttribute('aria-label',name(c));b.innerHTML=cardArt(c)+phoneFace(c);if(src){b.dataset.loc=JSON.stringify(src);if(selected&&src.t===selected.t&&src.i===selected.i&&(src.t!=='col'||src.p>=selected.p))b.classList.add('sel');if(hintMove&&src.t===hintMove.src.t&&src.i===hintMove.src.i&&src.p===hintMove.src.p)b.classList.add('hintcard');b.onclick=e=>{e.stopPropagation();click(src)};b.ondblclick=e=>{e.preventDefault();e.stopPropagation();if(!autoEmpty)quick(src)}}else{b.tabIndex=-1;b.style.cursor='default'}return b}
function tryEmpty(src){let a=cardsAt(src);if(!a.length)return false;let c=a[0];if(a.length===1&&execute(src,{t:'found',i:suit(c)})){say(name(c)+' → 오른쪽 완성 칸에 모았습니다.');return true}for(let i=0;i<8;i++){if(state.cols[i].length&&execute(src,{t:'col',i})){say(name(c)+(a.length>1?' 묶음':'')+' → 아래쪽 '+(i+1)+'열에 옮겼습니다.');return true}}for(let i=0;i<8;i++){if(!state.cols[i].length&&execute(src,{t:'col',i})){say(name(c)+(a.length>1?' 묶음':'')+' → 아래쪽 빈 열에 옮겼습니다.');return true}}if(src.t==='col'&&a.length===1){let i=state.free.findIndex(c=>c===null);if(i>=0&&execute(src,{t:'free',i})){say(name(c)+' → 아래쪽에 맞는 자리가 없어 왼쪽 위 빈 프리셀에 보관했습니다.');return true}}return false}
function click(loc){if(state.won)return;
// In automatic mode, a card tap always acts on that card, even after an earlier selection.
if(autoEmpty&&!selected&&cardsAt(loc).length){let a=cardsAt(loc);selected=null;hintMove=null;if(!chain(a)){render();say('노출된 한 장 또는 색이 번갈아 내려가는 묶음을 눌러 주세요.');return}if(tryEmpty(loc))return;selected=null;render();say(name(a[0])+' — 지금은 옮길 수 있는 자리가 없습니다. 다른 카드를 움직이거나 되돌리기를 사용해 주세요.');return}
if(selected){let dst={t:loc.t,i:loc.i};if(execute(selected,dst)){say('원하는 칸으로 옮겼습니다.');return}if(loc.t===selected.t&&loc.i===selected.i&&(loc.t!=='col'||loc.p===selected.p)){selected=null;render();return}}
if(loc.t==='found'){say('완성 칸에는 같은 무늬를 A부터 순서대로 모읍니다.');return}let a=cardsAt(loc);if(!a.length||!chain(a)){selected=null;render();say('옮길 수 있는 카드 또는 묶음을 선택해 주세요.');return}selected=loc;hintMove=null;render();say(name(a[0])+' 선택 · 원하는 목적지를 눌러 주세요.')}

function quick(src){if(cardsAt(src).length!==1)return;let c=cardsAt(src)[0];execute(src,{t:'found',i:suit(c)})}
function render(){let qm=document.getElementById('quickMode');qm.textContent=autoEmpty?'자동 이동':'☝ 직접 이동';qm.setAttribute('aria-pressed',String(autoEmpty));let tap=document.getElementById('tapMode');tap.textContent='조작: '+(autoEmpty?'자동 이동':'직접 이동');tap.setAttribute('aria-pressed',String(autoEmpty));document.body.className='theme-'+theme+' mobile-'+mobileView;document.getElementById('viewLarge').setAttribute('aria-pressed',String(mobileView==='large'));document.getElementById('viewFit').setAttribute('aria-pressed',String(mobileView==='fit'));document.getElementById('phoneNote').textContent=mobileView==='large'?'카드판을 좌우로 밀어 주세요':'8개 열 전체를 보고 있습니다';const top=document.getElementById('top');top.replaceChildren();Array.from({length:4},(_,i)=>state.free[i]).forEach((c,i)=>{let b=document.createElement('div');b.className='slot';if(i>=state.free.length){b.classList.add('locked');b.textContent='×';b.setAttribute('aria-label','사용하지 않는 프리셀');top.append(b);return}b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-label',`프리셀 ${i+1}`);b.onclick=()=>click({t:'free',i});b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}};if(c!==null)b.append(card(c,{t:'free',i}));if(selected&&legal(selected,{t:'free',i}))b.classList.add('target');top.append(b)});let gap=document.createElement('div');gap.className='gap';gap.textContent='완성 칸 · A → K';top.append(gap);state.found.forEach((n,i)=>{let b=document.createElement('div');b.className='slot foundation';b.textContent=SUITS[i];b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-label',SUITS[i]+' 완성 칸');b.onclick=()=>{if(selected&&!execute(selected,{t:'found',i}))say('같은 무늬의 다음 숫자 한 장만 놓을 수 있습니다.')};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}};if(n)b.append(card(i*13+n-1,null));if(selected&&legal(selected,{t:'found',i}))b.classList.add('target');top.append(b)});const columns=document.getElementById('columns');columns.replaceChildren();let small=phoneLayout(),step=small?24:29;let gutter=parseFloat(getComputedStyle(columns).columnGap)||0;let cardHeight=Math.max(45,((columns.clientWidth-7*gutter)/8)/CARD_RATIO);if(small)step=phoneStep(cardHeight);else step=Math.max(28,Math.min(42,cardHeight*.25));state.cols.forEach((p,i)=>{let el=document.createElement('div');el.className='column';el.tabIndex=0;el.setAttribute('role','group');el.setAttribute('aria-label',`${i+1}열, ${p.length}장`);el.style.height=Math.max(cardHeight,(p.length-1)*step+cardHeight)+'px';el.onclick=()=>{if(selected&&!execute(selected,{t:'col',i}))say('다른 색의 한 숫자 큰 카드 위에 놓아 주세요. 빈 프리셀과 빈 열도 확인하세요.')};el.onkeydown=e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click()}};p.forEach((c,j)=>el.append(card(c,{t:'col',i,p:j},j*step)));if(selected&&legal(selected,{t:'col',i}))el.classList.add('target');columns.append(el)});let n=state.found.reduce((a,b)=>a+b,0);document.getElementById('done').textContent=n+' / 52';document.getElementById('moves').textContent=state.moves;document.getElementById('clock').textContent=time(state.elapsed);document.getElementById('bar').style.width=n/52*100+'%';document.getElementById('undo').disabled=!history.length||state.won;document.getElementById('modeLabel').innerHTML='<b>'+({free:'자유 플레이',daily:'오늘의 퍼즐 · '+state.date,challenge:'도전 '+state.level,practice:'연습 · 풀 수 있는 배치'}[state.mode])+' · '+LEVELS[state.difficulty||'normal'].name+'</b>　#'+state.seed;}
function say(t){document.getElementById('message').textContent=t}
function findHint(){let best=null,score=-Infinity;for(let src of sources())for(let dst of destinations()){if(!legal(src,dst))continue;let a=cardsAt(src),p=pile(src);if(src.t==='col'&&dst.t==='col'&&!state.cols[dst.i].length&&src.p===0)continue;let s=dst.t==='found'?(safe(a[0])?100:8):dst.t==='col'?30:0;if(src.t==='free')s+=8;if(src.t==='col'&&src.p===0)s+=20;if(dst.t==='col'&&!state.cols[dst.i].length)s-=12;if(dst.t==='free')s-=15;if(s>score){score=s;best={src,dst}}}return best}
function showHint(){if(state.won)return;selected=null;hintMove=findHint();if(!hintMove){say('현재 가능한 유용한 이동을 찾지 못했습니다. 되돌리기로 다른 길을 살펴보세요.');return}state.hints++;let {src,dst}=hintMove,c=cardsAt(src)[0];selected=src;render();say(`힌트: ${name(c)}${cardsAt(src).length>1?' 묶음':''} → ${dst.t==='found'?'완성 칸':dst.t==='free'?'빈 프리셀':(dst.i+1)+'열'}. ${dst.t==='found'?'완성 칸을 한 단계 채울 수 있습니다.':src.t==='col'&&src.p===0?'열 하나를 비워 이동 공간을 확보할 수 있습니다.':dst.t==='col'?'카드를 정렬하고 임시 보관 공간을 확보해 보세요.':'가려진 다음 카드를 사용할 수 있습니다.'} (다음 목적지를 눌러 이동)`);save()}
function auto(){if(state.won)return;let snapshot=clone(state),count=0;while(true){let src=sources().find(s=>{let a=cardsAt(s);return a.length===1&&legal(s,{t:'found',i:suit(a[0])})&&safe(a[0])});if(!src)break;let a=cardsAt(src);execute(src,{t:'found',i:suit(a[0])},false);count++}if(count){history.push(snapshot);save();render();say(`${count}장을 안전한 순서로 정리했습니다. 되돌리기로 한 번에 취소할 수 있습니다.`)}else say('지금은 안전하게 자동 정리할 카드가 없습니다. 먼저 카드를 옮겨 보세요.')}
function start(mode='free',level=0,difficulty='normal'){state=deal(mode==='daily'?hash(day()):mode==='challenge'?10000+level:Math.floor(Math.random()*1e9),mode,level,difficulty);history=[];selected=null;hintMove=null;lastMoveCards=[];closeModal();save();render();say(mode==='practice'?'연습 배치는 반드시 풀 수 있습니다. A부터 찾아 완성 칸으로 옮겨 보세요.':'새로운 정원입니다. 빈 프리셀을 모두 채우기 전에 다음 길을 생각해 보세요.')}
function restartDeal(){openModal('<h2>같은 배치 다시 하기</h2><p>현재 배치를 처음부터 다시 시작합니다.</p><div class="choice"><button onclick="restartConfirmed()">처음부터 시작</button><button onclick="closeModal()">계속하기</button></div>')}
function restartConfirmed(){let old=state;state=deal(old.seed,old.mode,old.level,old.difficulty);state.date=old.date;history=[];selected=null;hintMove=null;lastMoveCards=[];closeModal();save();render();say('같은 카드 배치로 다시 시작했습니다.')}
function startNew(){openModal(`<h2>새 게임 · 난이도 선택</h2><p>현재 게임을 교체합니다. 난이도에 따라 임시 보관 칸 수가 달라집니다.</p><div class="level-list"><button onclick="start('practice',0,'easy')"><b>🌱 쉬움</b><span>프리셀 4칸 · A부터 차근차근 풀 수 있는 연습 배치</span></button><button onclick="start('free',0,'normal')"><b>🍀 보통</b><span>프리셀 4칸 · 기본 규칙의 무작위 배치</span></button><button onclick="start('free',0,'hard')"><b>🌲 어려움</b><span>프리셀 3칸 · 임시 보관과 묶음 이동에 제약</span></button><button onclick="start('free',0,'expert')"><b>🏔 최고급</b><span>프리셀 2칸 · 빈 열을 확보하는 치밀한 전략</span></button></div><p class="level-note">보통 이상은 무작위 배치이며 해결 가능성을 보장하지 않습니다. 오늘의 퍼즐·번호 도전은 보통 규칙을 사용합니다.</p><button onclick="closeModal()">현재 게임 계속하기</button>`)}
function openModal(html){let m=document.getElementById('modal');m.innerHTML='<button class="close" aria-label="닫기" onclick="closeModal()">×</button>'+html;if(!m.open)m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function challenges(){openModal('<h2>한 수씩, 새로운 도전</h2><p>각 번호는 고정된 배치입니다. 별 3개에 도전해 보세요.<br>★ 완성　★ 힌트 없이　★ 120수 이내<br>일반 무작위 배치의 해결 가능성은 보장하지 않습니다. 쉬운 연습은 해결 가능한 배치입니다.</p><div class="choice">'+Array.from({length:12},(_,i)=>`<button onclick="start('challenge',${i+1})">도전 ${String(i+1).padStart(2,'0')}</button>`).join('')+'</div>')}
function settings(){openModal(`<h2>나만의 카드 정원</h2><p>누적 승리 <b>${stats.wins}회</b> · 최소 이동 <b>${stats.best??'—'}</b><br>오늘의 퍼즐 완료 <b>${stats.daily.length}일</b><br>최근 완료일: ${stats.daily.slice(-7).join(' · ')||'아직 없습니다'}</p><p>배경을 바꿔 보세요. 모든 테마를 자유롭게 사용할 수 있습니다.</p><div class="choice"><button onclick="setTheme('garden')">🌿 정원</button><button onclick="setTheme('night')">🌙 밤하늘</button><button onclick="setTheme('plum')">🌸 자두빛</button></div>`)}
function setTheme(t){theme=t;save();render()}
document.getElementById('quickMode').onclick=()=>document.getElementById('tapMode').click();document.getElementById('mobileMenu').onclick=mobileMenu;document.getElementById('viewLarge').onclick=()=>setMobileView('large');document.getElementById('viewFit').onclick=()=>setMobileView('fit');document.getElementById('tapMode').onclick=()=>{autoEmpty=!autoEmpty;selected=null;hintMove=null;save();render();say(autoEmpty?'자동 이동: 오른쪽 완성 칸 → 아래쪽 맞는 카드 → 빈 열 → 왼쪽 위 빈 프리셀 순서입니다.':'직접 이동: 카드를 선택한 뒤 원하는 목적지를 눌러 주세요.')};document.getElementById('new').onclick=startNew;document.getElementById('daily').onclick=()=>openModal('<h2>오늘의 퍼즐</h2><p>한국 시간 기준으로 하루에 하나의 배치가 준비됩니다. 현재 게임을 교체하여 시작합니다.</p><button class="primary" onclick="start(\'daily\')">오늘의 퍼즐 시작</button>');document.getElementById('challenge').onclick=challenges;document.getElementById('hint').onclick=showHint;document.getElementById('auto').onclick=auto;document.getElementById('settings').onclick=settings;document.getElementById('undo').onclick=()=>{if(!history.length||state.won)return;let elapsed=state.elapsed,hints=state.hints;state=history.pop();state.elapsed=elapsed;state.hints=hints;selected=null;hintMove=null;save();render();say('이전 위치로 돌아왔습니다. 다른 길을 찾아보세요.')};document.getElementById('help').onclick=()=>openModal('<h2>프리셀, 이렇게 즐기세요</h2><p>카드 그림: Byron Knoll의 공개 도메인 Vector Playing Cards 원화.</p><ol><li><b>자동 이동:</b> 누른 카드를 오른쪽 완성 칸에 먼저 놓고, 불가능하면 아래쪽에서 규칙에 맞는 카드 위 → 빈 열 → 왼쪽 위 빈 프리셀 순서로 찾습니다. 아래쪽에 갈 곳이 있으면 프리셀을 거치지 않고 바로 옮깁니다. 에이스는 오른쪽 완성 칸으로 갑니다. 정렬된 묶음도 허용되는 범위에서 아래쪽으로 이동합니다. 후보가 여러 개면 왼쪽 열부터 찾습니다.</li><li><b>직접 이동:</b> 위쪽 조작 버튼을 누르면 전환됩니다. 카드를 선택하고 원하는 목적지를 누르세요. 묶음 이동과 완성 칸 이동에도 사용할 수 있습니다. 힌트가 선택한 카드도 목적지를 눌러 옮깁니다.</li><li>아래 8개 열은 <b>빨강(♥♦)과 검정(♠♣)</b>을 번갈아, 숫자가 하나씩 작아지도록 쌓습니다. 하트·다이아는 빨강, 스페이드·클로버는 검정입니다.</li><li>왼쪽 프리셀은 한 칸에 한 장, 빈 열은 어떤 카드든 놓을 수 있습니다.</li><li>정렬된 묶음은 빈 프리셀과 빈 열로 한 장씩 옮길 수 있는 범위에서 이동합니다.</li><li>오른쪽은 같은 무늬를 A → K로 모읍니다. 52장을 모두 모으면 승리합니다.</li><li>자동 정리는 반대 색의 진행도를 고려해 안전한 카드만 옮깁니다. 힌트는 현재 가능한 이동을 제안하며 전체 해답을 계산하지 않습니다.</li></ol><p>난이도는 새 게임에서 고릅니다. 쉬움·보통은 프리셀 4칸, 어려움은 3칸, 최고급은 2칸입니다. 어려움 이상은 임시 보관 칸을 줄인 변형 규칙입니다.<br>진행은 이 브라우저에 저장됩니다. 사이트 데이터 삭제 시 기록도 지워집니다. 시간은 플레이 화면이 열려 있고 도움말이 닫혀 있을 때만 흐릅니다.</p>');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;render()}if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!document.getElementById('modal').open){e.preventDefault();document.getElementById('undo').click()}});window.addEventListener('resize',()=>render());
try{let data=JSON.parse(localStorage.getItem(KEY));if(data&&data.state&&data.state.cols?.length===8){state=data.state;history=data.history||[];stats=data.stats||stats;theme=data.theme||theme;autoEmpty=data.controlVersion>=4?data.autoEmpty!==false:true;mobileView=data.mobileView==='fit'?'fit':'large'}}catch{}if(!state)state=deal(735219,'free');render();setInterval(()=>{if(!document.hidden&&!document.getElementById('modal').open&&!state.won){state.elapsed++;document.getElementById('clock').textContent=time(state.elapsed);if(state.elapsed%5===0)save()}},1000);window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){let r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
