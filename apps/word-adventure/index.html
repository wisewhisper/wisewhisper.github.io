e:12px;color:#785d3d}.story p{font-size:11px;color:#9c8a70;margin:3px 0 0;line-height:1.5}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:67px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:#fffdf8ee;border-top:1px solid #eee9dd;z-index:4;backdrop-filter:blur(10px)}.nav button{background:none;color:#a5aaa3;font-size:10px;font-weight:700;display:grid;gap:3px;justify-items:center}.nav button b{font-size:19px}.nav button.on{color:#587a60}.overlay{position:fixed;inset:0;background:#111c2bd9;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{max-height:90dvh;overflow-y:auto;width:min(360px,100%);background:#fffdf7;border-radius:24px;padding:26px;text-align:center;box-shadow:0 20px 80px #0005}.modal .big{font-size:50px}.modal h3{font-size:22px;margin:8px}.modal p{font-size:14px;color:#777f7b;line-height:1.7}.primary{background:#547a61;color:white;border-radius:12px;padding:13px 20px;font-weight:800;width:100%;margin-top:10px}.secondary{background:transparent;color:#718075;font-size:12px;margin-top:15px}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#263c38;color:white;padding:10px 18px;border-radius:20px;font-size:12px;z-index:15;display:none;white-space:nowrap}@media(max-height:730px){.hero{height:190px}.hero-copy{margin-top:15px}.content{padding-top:13px}.board{grid-template-columns:repeat(3,45px);grid-template-rows:repeat(3,45px);margin:10px auto}.actions{margin:12px 0}.story{margin-top:8px}}

</style></head><body><main class="app"><header class="hero"><div class="mountain"></div><div class="mountain two"></div><div class="top"><div class="brand"><span>✦</span> 낱말 탐험대</div><div class="coin">✦ <span id="coins">30</span></div></div><div class="hero-copy"><div class="eyebrow">CHAPTER 01 · MOONLIGHT STATION</div><h1>달빛 기차역</h1><p>낱말을 따라 떠나는 작은 여행</p></div><div class="station" aria-hidden="true">🚂</div></header><section class="content"><div class="chapter"><button class="tag" id="difficulty">🌱 새싹 · 난이도 변경</button><button id="modeSelect" style="background:#f3eadb;color:#745d3e;border-radius:15px;padding:6px 9px;font-size:11px;font-weight:800">⚔️ 1인전 / 2인전</button><span class="step" id="stageLabel">STAGE 01 / 09</span></div><h2 id="stageTitle">첫 번째 낱말을 찾아서</h2><p class="sub">빈칸을 선택하고 아래 글자를 눌러 낱말을 완성해요.</p><div class="progress"><i id="progress" style="width:20%"></i></div><div class="clue"><div class="clueicon">🔎</div><div><strong id="direction">가로 ①</strong><p id="cluetext">넓고 푸른 짠물이 가득한 곳</p></div></div><div class="board" id="board" aria-label="낱말 퍼즐"></div><p class="hintline" id="message">반짝이는 칸에 들어갈 글자를 골라 주세요</p><div class="tiles" id="tiles"></div><div class="actions"><button class="action" id="hint">💡 한 글자 힌트 <span>−5</span></button><button class="action" id="reset">↺ 다시 풀기</button></div><div class="story"><div class="storyicon">✉️</div><div><strong id="storyTitle">기차역의 작은 사건</strong><p id="storyText">퍼즐을 완성하면 사라진 기관사 모자의 단서를 얻어요.</p></div></div></section><section id="advanced" class="advanced-panel"></section><nav class="nav"><button class="on" data-nav="탐험"><b>⌂</b>탐험</button><button data-nav="지도"><b>♧</b>지도</button><button data-nav="보관함"><b>▣</b>보관함</button><button data-nav="설정"><b>⚙</b>설정</button></nav></main><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script>
const puzzles=[
 {level:'새싹',a:'바다',b:'바람',ac:'넓고 푸른 짠물이 가득한 곳',bc:'공기가 움직이며 불어오는 것',story:'벤치 아래에서 반짝이는 모자 장식을 찾았어요.'},
 {level:'새싹',a:'사과',b:'사자',ac:'빨갛거나 초록빛인 둥근 과일',bc:'갈기가 멋진 고양잇과 동물',story:'매표소 앞에서 작은 발자국을 발견했어요.'},
 {level:'새싹',a:'기차',b:'기린',ac:'철길 위를 달리며 사람을 태우는 탈것',bc:'목이 아주 긴 동물',story:'역무원은 고양이가 반짝이는 것을 좋아한다고 알려 주었어요.'},
 {level:'잎새',a:'나무',b:'나비',ac:'줄기와 가지가 자라는 여러해살이 식물',bc:'알록달록한 날개로 꽃 사이를 나는 곤충',story:'발자국이 오래된 시계탑 쪽으로 이어져요.'},
 {level:'잎새',a:'구름',b:'구두',ac:'하늘에 떠 있는 작은 물방울이나 얼음 알갱이의 모임',bc:'발을 보호하기 위해 신는 신발의 한 종류',story:'시계탑 아래에서 금빛 실 한 가닥을 찾았어요.'},
 {level:'잎새',a:'열쇠',b:'열차',ac:'자물쇠를 열거나 잠글 때 쓰는 물건',bc:'철도 위를 다니는 차량을 이어 놓은 것',story:'문틈 너머로 작은 방울 소리가 들려요.'},
 {level:'꽃봉오리',a:'도서관',b:'도토리',ac:'책을 모아 두고 읽거나 빌릴 수 있는 곳',bc:'참나무 종류의 나무에 열리는 작은 열매',story:'시계탑 안에서 고양이의 포근한 잠자리를 발견했어요.'},
 {level:'꽃봉오리',a:'손수건',b:'손전등',ac:'손이나 얼굴의 물기를 닦을 때 쓰는 작은 천',bc:'손에 들고 어두운 곳을 비추는 도구',story:'모자에 달린 것과 같은 금빛 장식이 보여요.'},
 {level:'꽃봉오리',a:'별자리',b:'별똥별',ac:'밤하늘의 별들을 이어 이름을 붙인 모양',bc:'우주에서 온 작은 물체가 대기에서 빛나며 떨어지는 현상',story:'범인은 장난꾸러기 고양이! 모자는 시계탑의 잠자리에서 찾았어요.'}
];
const KEY='wordexpedition-v2';let state={stage:0,coins:30,cleared:[],values:{}};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isInteger(saved.stage)&&saved.stage>=0&&saved.stage<puzzles.length)state={...state,...saved}}catch(e){}let selected='0,1',mode='a',locked=false;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function p(){return puzzles[state.stage]}function solution(){let o={};[...p().a].forEach((x,i)=>o['0,'+i]=x);[...p().b].forEach((x,i)=>o[i+',0']=x);return o}function vals(){if(!state.values[state.stage])state.values[state.stage]={'0,0':p().a[0]};return state.values[state.stage]}function resetSelection(){selected='0,1';mode='a'}function label(){return state.stage<3?'🌱 새싹':state.stage<6?'🌿 잎새':'🌼 꽃봉오리'}function render(){let sol=solution(),v=vals();$('difficulty').textContent=label()+' · 난이도 변경';$('stageLabel').textContent='STAGE '+String(state.stage+1).padStart(2,'0')+' / 09';$('stageTitle').textContent=['첫 번째 낱말을 찾아서','작은 발자국','수상한 목격담','시계탑으로','금빛 실의 비밀','문틈 너머의 소리','비밀스러운 잠자리','반짝이는 단서','사라진 모자를 찾아서'][state.stage];$('direction').textContent=mode==='a'?'가로 ①':'세로 ①';$('cluetext').textContent=mode==='a'?p().ac:p().bc;$('coins').textContent=state.coins;$('storyText').textContent=state.cleared.length?'모은 단서 '+state.cleared.length+' / 9개 · 보관함에서 확인해요':'퍼즐을 완성하면 사라진 기관사 모자의 단서를 얻어요.';$('progress').style.width=(Object.keys(v).length/Object.keys(sol).length*100)+'%';let board=$('board');board.innerHTML='';for(let r=0;r<3;r++)for(let c=0;c<3;c++){let key=r+','+c,b=document.createElement('button');if(!sol[key]){b.className='cell empty';b.tabIndex=-1}else{b.className='cell '+(key===selected?'active ':'')+(v[key]?'filled':'');b.innerHTML=(key==='0,0'?'<small>①</small>':'')+(v[key]||'');b.setAttribute('aria-label',`${r+1}행 ${c+1}열 ${v[key]||'빈칸'}`);b.onclick=()=>{selected=key;if(key==='0,0')mode=mode==='a'?'b':'a';else mode=r===0?'a':'b';render()}}board.appendChild(b)}let needed=Object.entries(sol).filter(([k])=>k!=='0,0').map(([,x])=>x), options=[...new Set([...needed,'별','길','꽃'])].sort((a,b)=>a.localeCompare(b,'ko'));$('tiles').innerHTML='';options.forEach(x=>{let b=document.createElement('button');b.className='tile';b.textContent=x;b.onclick=()=>put(x);$('tiles').appendChild(b)})}function put(x){if(locked)return;let sol=solution(),v=vals();if(selected==='0,0'||v[selected]){toast('빈칸을 먼저 선택해 주세요');return}if(x!==sol[selected]){$('message').textContent='아쉽지만 다른 글자를 골라 볼까요?';return}v[selected]=x;$('message').textContent='좋아요! 다음 빈칸을 찾아볼까요?';let next=Object.keys(sol).find(k=>!v[k]);if(next){selected=next;mode=next.startsWith('0,')?'a':'b'}else{locked=true;let first=!state.cleared.includes(state.stage);if(first){state.cleared.push(state.stage);state.coins+=10}save();setTimeout(()=>win(first),250)}save();render()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function popup(html){$('modal').innerHTML=html;$('overlay').classList.add('show')}function closeModal(){$('overlay').classList.remove('show')}function win(first){popup(`<div class="big">${state.stage===8?'🎩':'✉️'}</div><h3>${state.stage===8?'사건 해결!':'새로운 단서 발견!'}</h3><p>${p().story}<br>${first?'탐험 코인 10개를 받았어요.':'이미 받은 보상이에요.'}</p><button class="primary" onclick="nextStage()">${state.stage===8?'처음부터 살펴보기':'다음 퍼즐로'}</button><button class="secondary" onclick="closeModal()">여기서 머무르기</button>`)}function nextStage(){state.stage=(state.stage+1)%puzzles.length;resetSelection();locked=false;closeModal();save();render()}function restart(){state.values[state.stage]={'0,0':p().a[0]};resetSelection();locked=false;$('message').textContent='반짝이는 칸에 들어갈 글자를 골라 주세요';save();render();closeModal()}function selectStage(n){state.stage=n;resetSelection();locked=Object.keys(vals()).length===Object.keys(solution()).length;closeModal();save();render();if(locked)toast('완료한 퍼즐이에요. 다시 풀기를 눌러 보세요.')}function showMap(){let button t options=gridData()[k].words;if(k===ak&&options.length>1)aw=options[(options.indexOf(aw)+1)%options.length];else if(!options.includes(aw))aw=options[0];ak=k;advRender()}function advRender(){let q=ADV[ai],g=gridData(),v=advValues(),word=q.words[aw],total=Object.keys(g).length,filled=Object.keys(v).length;let cells='';for(let r=0;r<q.rows;r++)for(let c=0;c<q.cols;c++){let k=r+','+c,x=g[k];if(!x){cells+='<div class="adv-cell blank"></div>';continue}let starts=q.words.filter(w=>w.r===r&&w.c===c).map(w=>w.n),num=starts.length?`<small>${starts[0]}</small>`:'';cells+=`<button class="adv-cell ${x.words.includes(aw)?'word':''} ${k===ak?'sel':''} ${v[k]?'has':''}" onclick="advClick('${k}')" aria-label="${r+1}행 ${c+1}열 ${v[k]||'빈칸'}">${num}${v[k]||''}</button>`}let opts=[...new Set([...Object.values(g).map(x=>x.ch),'별','달','나','물'])].sort((a,b)=>a.localeCompare(b,'ko'));area.innerHTML=`<div class="adv-top"><button onclick="advClose()">‹ 기본 탐험</button><button onclick="stageHome()">퍼즐 고르기</button></div><h2 class="adv-title">${q.level} · ${q.title}</h2><p class="adv-desc">낱말 버튼이나 칸을 눌러 선택해요. 교차 칸을 다시 누르면 방향이 바뀝니다.</p><div class="progress"><i style="width:${filled/total*100}%"></i></div><div class="adv-pills">${q.words.map((w,i)=>`<button class="${i===aw?'chosen':''}" onclick="advSelectWord(${i})">${w.d} ${w.n}</button>`).join('')}</div><div class="clue"><div class="clueicon">🔎</div><div><strong>${word.d} ${word.n} · ${word.w.length}글자</strong><p>${word.clue}</p></div></div><div class="adv-grid" style="grid-template-columns:repeat(${q.cols},1fr);max-width:${Math.min(370,q.cols*60)}px">${cells}</div><p class="adv-notice" id="advNotice">${filled===total?'퍼즐 완성!':'빈칸을 선택하고 글자를 눌러 주세요'}</p><div class="adv-tiles">${opts.map(x=>`<button onclick="advPut('${x}')">${x}</button>`).join('')}</div><div class="adv-buttons" style="margin-top:15px"><button onclick="advHint()">💡 한 글자 힌트 −5</button><button onclick="advReset()">↺ 다시 풀기</button></div><div class="story"><div class="storyicon">🗝️</div><div><strong>탐험의 다음 단서</strong><p>퍼즐을 완성하면 새로운 단서를 발견해요.</p></div></div>`}function advPut(x){let g=gridData(),v=advValues();if(v[ak]){toast('먼저 빈칸을 선택해 주세요');return}if(x!==g[ak].ch){$('advNotice').textContent='다른 글자를 골라 볼까요?';return}v[ak]=x;let next=Object.keys(g).find(k=>!v[k]&&g[k].words.includes(aw))||Object.keys(g).find(k=>!v[k]);if(next){ak=next;if(!g[next].words.includes(aw))aw=g[next].words[0]}else{let first=!advState.cleared.includes(ai);if(first){advState.cleared.push(ai);state.coins+=15;save()}advSave();advRender();setTimeout(()=>popup(`<div class="big">🗝️</div><h3>교차 퍼즐 완성!</h3><p>${ADV[ai].story}<br>${first?'탐험 코인 15개를 받았어요.':'이미 받은 보상이에요.'}</p><button class="primary" onclick="stageHome()">다른 퍼즐 고르기</button><button class="secondary" onclick="closeModal()">계속 살펴보기</button>`),250);return}advSave();advRender()}function advHint(){if(advValues()[ak]){toast('빈칸을 먼저 선택해 주세요');return}if(state.coins<5){toast('코인이 부족해요');return}state.coins-=5;save();advPut(gridData()[ak].ch);$('coins').textContent=state.coins}function advReset(){if(!confirm('현재 퍼즐을 처음부터 다시 풀까요? 획득한 보상은 유지됩니다.'))return;delete advState.boards[ai];advValues();aw=0;ak='0,1';advSave();advRender()}document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(area.classList.contains('visible')){if(b.dataset.nav==='탐험')advClose();else if(b.dataset.nav==='지도'){advClose();showMap()}}}));
</script>

<script>

{name:'고급',icon:'🌳',desc:'성인용 9×9 교차 퍼즐',entries:[{type:'adv',id:2},{type:'adv',id:4},{type:'adv',id:5},{type:'adv',id:6},{type:'adv',id:7}]},
{name:'최고급',icon:'👑',desc:'더 많은 낱말에 도전',entries:[{type:'adv',id:3},{type:'adv',id:8},{type:'adv',id:9},{type:'adv',id:10},{type:'adv',id:11}]}
];

LEVELS[2].desc='상식·시사·영화·문화·과학·예술';
LEVELS.forEach(l=>{l.slots=Array.from({length:10},(_,i)=>l.entries[i]?[l.entries[i]]:[])});
for(let i=0;i<60;i++)LEVELS[i%4+1].slots[(Math.floor(i/4)+5)%10].push({type:'adv',id:155+i});
for(let i=0;i<75;i++)LEVELS[i%5].slots[Math.floor(i/5)%10].push({type:'adv',id:80+i});
for(let i=0;i<18;i++)LEVELS[2].slots[i%10].push({type:'adv',id:62+i});
for(let i=0;i<10;i++){LEVELS[0].slots[i].push({type:'adv',id:32+i});LEVELS[1].slots[i].push({type:'adv',id:42+i});LEVELS[2].slots[i].push({type:'adv',id:52+i})}
for(let i=0;i<10;i++){LEVELS[3].slots[i].push({type:'adv',id:12+i});LEVELS[4].slots[i].push({type:'adv',id:22+i})}
for(let i=0;i<60;i++){let level=[0,1,2,3][i%4],slots=LEVELS[level].slots;let stage=slots.reduce((best,v,k)=>v.length<slots[best].length?k:best,0);slots[stage].push({type:'adv',id:215+i})}
for(let i=0;i<15;i++){let level=ADV[275+i].level.startsWith('중급')?2:3,slots=LEVELS[level].slots;let stage=slots.reduce((best,v,k)=>v.length<slots[best].length?k:best,0);slots[stage].push({type:'adv',id:275+i})}
{let slots=LEVELS[3].slots;let stage=slots.reduce((best,v,k)=>v.length<slots[best].length?k:best,0);slots[stage].push({type:'adv',id:290})}
for(let i=0;i<200;i++){let level=ADV[341+i].levelIndex,slots=LEVELS[level].slots;let stage=slots.reduce((best,v,k)=>v.length<slots[best].length?k:best,0);slots[stage].push({type:'adv',id:341+i})}
function clearedEntry(e){return e.type==='basic'?state.cleared.includes(e.id):advState.cleared.includes(e.id)}
function stageHome(){let count=LEVELS.reduce((n,l)=>n+l.slots.reduce((a,v)=>a+v.length,0),0);popup(`<h3>🗺️ 전체 탐험 지도</h3><p>난이도와 스테이지를 자유롭게 골라요.<br><b>플레이 가능 ${count} / 500 퍼즐</b></p><button class="stage-level" onclick="schoolHome()" style="background:#e9f0f9;color:#405e84;margin-top:14px"><span>🎓 교과별 낱말 학습<br><small>중·고등학교 교과와 주제 선택</small></span><small>교과 선택 ›</small></button><button class="stage-level" onclick="duelMenu()" style="background:#eeeaf7;color:#61527f;margin-top:14px"><span>⚔️ 2인전 대결<br><small>한 휴대폰으로 번갈아 플레이</small></span><small>시작하기 ›</small></button><button class="stage-level" onclick="genreHome()" style="background:#f8efdd;color:#785e38;margin-top:14px"><span>🧭 분야별로 풀기<br><small>관심 있는 주제를 골라요</small></span><small>분야 선택 ›</small></button><div class="stage-levels">${LEVELS.map((l,i)=>`<button class="stage-level" onclick="stageLevel(${i})"><span>${l.icon} ${l.name}<br><small>${l.desc}</small></span><small>${l.slots.reduce((a,v)=>a+v.length,0)} / 100 퍼즐 ›</small></button>`).join('')}</div><button class="secondary" onclick="closeModal()">돌아가기</button>`)}
function stageLevel(level){let l=LEVELS[level];popup(`<button class="stage-back" onclick="stageHome()">‹ 전체 난이도</button><h3>${l.icon} ${l.name}</h3><p>10개 스테이지 중 원하는 곳을 선택하세요.<br>준비 중인 스테이지도 미리 볼 수 있어요.</p><div class="stage-grid">${l.slots.map((items,i)=>{let done=items.filter(clearedEntry).length;return `<button class="stage-card ${items.length?'':'pending'}" onclick="stageDetail(${level},${i})">${String(i+1).padStart(2,'0')} 스테이지<small>${items.length?(done?'✓ '+done+'개 완료 · ':'')+items.length+' / 10 퍼즐':'준비 중 · 0 / 10'}</small></button>`}).join('')}</div><button class="secondary" onclick="closeModal()">닫기</button>`)}
function stageDetail(level,stage){let l=LEVELS[level],entries=l.slots[stage];let slots=Array.from({length:10},(_,i)=>{let e=entries[i];if(e){let title=e.type==='basic'?puzzles[e.id].a+' · '+puzzles[e.id].b:ADV[e.id].title;return `<button class="slot active" onclick="launchStage(${level},${stage},${i})"><span>퍼즐 ${String(i+1).padStart(2,'0')} · ${title}</span><small>${clearedEntry(e)?'완료 ✓':'시작하기 ›'}</small></button>`}return `<div class="slot"><span>퍼즐 ${String(i+1).padStart(2,'0')}</span><small>준비 중</small></div>`}).join('');popup(`<button class="stage-back" onclick="stageLevel(${level})">‹ ${l.name} 스테이지</button><h3>${l.icon} ${l.name} ${stage+1}단계</h3><p>${entries.length?'현재 '+entries.length+'개 퍼즐을 플레이할 수 있어요.':'이 스테이지의 퍼즐은 아직 준비 중이에요.'}</p><div class="slot-list">${slots}</div><button class="secondary" onclick="closeModal()">닫기</button>`)}
function launchStage(level,stage,slot=0){let e=LEVELS[level].slots[stage][slot];if(!e)return;if(e.type==='basic'){if(area.classList.contains('visible'))advClose();selectStage(e.id)}else advPick(e.id)}

const GENRES=[{name:'시사·경제',icon:'📰',ids:[62,63,64]},{name:'일반 상식',icon:'💡',ids:[65,66,67]},{name:'영화',icon:'🎬',ids:[68,69,70]},{name:'문화',icon:'🏮',ids:[71,72,73]},{name:'과학',icon:'🔬',ids:[74,75,76]},{name:'예술',icon:'🎨',ids:[77,78,79]},{name:'사자성어',icon:'📜',ids:Array.from({length:30},(_,i)=>i+2)},{name:'속담·관용어',icon:'💬',ids:[]},{name:'역사',icon:'🏛️',ids:[]},{name:'지리·여행',icon:'🌏',ids:[]},{name:'음식',icon:'🍜',ids:[]},{name:'스포츠',icon:'⚽',ids:[]},{name:'문학',icon:'📚',ids:[]},{name:'음악',icon:'🎵',ids:[]},{name:'자연·동물',icon:'🐾',ids:[]}];
for(let i=0;i<75;i++)GENRES[Math.floor(i/5)].ids.push(80+i);

for(let i=0;i<60;i++)GENRES[Math.floor(i/4)].ids.push(215+i);
for(let i=0;i<15;i++){let gi=GENRES.findIndex(g=>ADV[275+i].title.startsWith(g.name+' ·'));if(gi>=0)GENRES[gi].ids.push(275+i)}

function genreDetail(i,level='전체'){let g=GENRES[i],classify=id=>ADV[id].level.includes('최고급')?'최고급':ADV[id].level.includes('고급')?'고급':ADV[id].level.includes('중급')?'중급':ADV[id].level.includes('초급')?'초급':'입문';let shown=g.ids.filter(id=>level==='전체'||classify(id)===level),choices=['전체','입문','초급','중급','고급','최고급'];popup(`<button class="stage-back" onclick="genreHome()">‹ 분야 선택</button><h3>${g.icon} ${g.name}</h3><p>분야 안에서 난이도를 선택하세요.<br>문제가 없는 난이도는 준비 중입니다.</p><div class="adv-pills">${choices.map(x=>`<button class="${x===level?'chosen':''}" onclick="genreDetail(${i},'${x}')">${x} ${x==='전체'?g.ids.length:g.ids.filter(id=>classify(id)===x).length}</button>`).join('')}</div><div class="slot-list">${shown.map((id,k)=>`<button class="slot active" onclick="advPick(${id})"><span>${ADV[id].title}</span><small>${classify(id)} · ${advState.cleared.includes(id)?'완료 ✓':'시작 ›'}</small></button>`).join('')||'<p>해당 분야와 난이도의 문제는 아직 준비 중이에요.</p>'}</div><button class="secondary" onclick="closeModal()">닫기</button>`)}
$('difficulty').onclick=stageHome;
document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav==='지도')b.addEventListener('click',e=>{e.stopImmediatePropagation();stageHome()},true)});

<script>
let duel=null,openingDuel=false;
const originalAdvValues=advValues,originalAdvRender=advRender,originalAdvPick=advPick,originalAdvClose=advClose,originalAdvPut=advPut,originalAdvHint=advHint,originalAdvReset=advReset;
advValues=function(){if(!duel)return originalAdvValues();if(!duel.values){duel.values={};let g=gridData();for(const [r,c] of ADV[ai].seed){let k=r+','+c;duel.values[k]=g[k].ch}}return duel.values};
advPick=function(i){if(!openingDuel)duel=null;originalAdvPick(i)};
advClose=function(){duel=null;originalAdvClose()};
advRender=function(){originalAdvRender();if(!duel)return;let panel=document.createElement('div');panel.setAttribute('style','display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0;padding:10px 12px;background:#eeeaf7;border-radius:12px;color:#584a77;font-size:12px;font-weight:800');panel.innerHTML=`<span>⚔️ ${duel.turn===0?'▶ ':''}1P ${duel.scores[0]}점</span><span>${duel.turn===1?'▶ ':''}2P ${duel.scores[1]}점</span><button onclick="endDuel()" style="background:#fff;border-radius:10px;padding:6px 8px;color:#6a5d78;font-size:11px">대결 나가기</button>`;area.insertBefore(panel,area.querySelector('.adv-title'));let desc=area.querySelector('.adv-desc');if(desc)desc.textContent='두 사람이 글자를 한 번씩 번갈아 골라요. 정답 +10점, 오답 0점.';let hint=area.querySelector('.adv-buttons');if(hint)hint.style.display='none'};
advHint=function(){if(duel){toast('2인 대결에서는 힌트를 사용하지 않아요');return}originalAdvHint()};
advReset=function(){if(duel){toast('대결을 다시 시작하려면 나가기를 눌러 주세요');return}originalAdvReset()};
advPut=function(x){if(!duel){originalAdvPut(x);return}let g=gridData(),v=advValues();if(v[ak]){toast('빈칸을 먼저 선택해 주세요');return}let who=duel.turn,correct=x===g[ak].ch;duel.turn=1-duel.turn;if(correct){v[ak]=x;duel.scores[who]+=10;let next=Object.keys(g).find(k=>!v[k]&&g[k].words.includes(aw))||Object.keys(g).find(k=>!v[k]);if(next){ak=next;if(!g[next].words.includes(aw))aw=g[next].words[0]}else{let points=duel.scores.slice();let winner=points[0]===points[1]?'무승부!':(points[0]>points[1]?'1P 승리!':'2P 승리!');advRender();popup(`<div class="big">🏆</div><h3>${winner}</h3><p>1P <b>${points[0]}점</b> · 2P <b>${points[1]}점</b><br>함께 낱말 퍼즐을 완성했어요!</p><button class="primary" onclick="duelMenu()">다른 퍼즐로 대결</button><button class="secondary" onclick="endDuel()">1인전으로 돌아가기</button>`);return}}advRender();$('advNotice').textContent=correct?`${who+1}P 정답! 다음은 ${duel.turn+1}P 차례예요.`:`${who+1}P 아쉽네요. ${duel.turn+1}P 차례예요.`};
function duelMenu(){popup(`<div class="big">⚔️</div><h3>둘이서 낱말 대결</h3><p>한 기기를 번갈아 사용해요.<br>글자 하나씩 선택하며 정답은 10점!<br>먼저 입력할 사람은 1P입니다.</p><div class="adv-select"><button onclick="startDuel(0)">🌿 가볍게 · 달빛의 온실</button><button onclick="startDuel(2)">🌳 도전 · 사자성어의 숲</button><button onclick="startDuel(3)">👑 도전 · 지혜의 서재</button></div><button class="secondary" onclick="endDuel()">1인전으로 돌아가기</button>`)}
function startDuel(i){duel={turn:0,scores:[0,0],values:null};openingDuel=true;originalAdvPick(i);openingDuel=false;closeModal()}
function endDuel(){duel=null;closeModal();if(area.classList.contains('visible'))originalAdvClose();else render()}
function modeMenu(){popup(`<div class="big">🧩</div><h3>어떻게 즐길까요?</h3><p>혼자 여행하거나 둘이 함께 대결해요.</p><button class="primary" onclick="endDuel()">🌙 1인전 · 낱말 탐험</button><button class="primary" onclick="duelMenu()">⚔️ 2인전 · 번갈아 대결</button>`)}
$('modeSelect').onclick=modeMenu;
try{if(!sessionStorage.getItem('wordmode-intro')){sessionStorage.setItem('wordmode-intro','1');setTimeout(modeMenu,100)}}catch(e){}
</script>

<script>

const SCHOOLMAP={중학교:[['국어','📖'],['수학','📐'],['영어','🔤'],['사회','🌏'],['역사','🏛️'],['과학','🔬']],고등학교:[['국어','📖'],['수학','📐'],['영어','🔤'],['사회','🌏'],['한국사','🏛️'],['과학','🔬']]};
function schoolIds(s,course){return ADV.map((q,id)=>({q,id})).filter(x=>x.q.school===s&&x.q.course===course).map(x=>x.id)}
function schoolHome(){popup(`<button class="stage-back" onclick="stageHome()">‹ 탐험 지도</button><h3>🎓 교과별 낱말 학습</h3><p>학교급과 교과를 고르세요.<br>주제명은 학습 편의를 위한 분류이며 학교별 교과서 구성은 다를 수 있어요.</p><div class="adv-select"><button onclick="schoolSubjects('중학교')">🏫 중학교 주요 교과 ›</button><button onclick="schoolSubjects('고등학교')">🏛️ 고등학교 주요 교과 ›</button></div><button class="secondary" onclick="closeModal()">닫기</button>`)}
function schoolSubjects(s){popup(`<button class="stage-back" onclick="schoolHome()">‹ 학교급 선택</button><h3>${s} 주요 교과</h3><p>영어는 문법 용어를 한글로 푸는 문제예요.</p><div class="stage-grid">${SCHOOLMAP[s].map(([name,icon])=>{let count=s==='고등학교'&&name==='과학'?['통합과학','물리학','화학','생명과학','지구과학'].reduce((n,c)=>n+schoolIds(s,c).length,0):schoolIds(s,name).length;return `<button class="stage-card ${count?'':'pending'}" onclick="schoolSubject('${s}','${name}')">${icon} ${name}<small>${count?count+'개 퍼즐 ›':'준비 중'}</small></button>`}).join('')}</div><button class="secondary" onclick="closeModal()">닫기</button>`)}
function schoolSubject(s,name){if(name==='과학'&&s==='고등학교'){popup(`<button class="stage-back" onclick="schoolSubjects('고등학교')">‹ 교과 선택</button><h3>🔬 고등학교 과학</h3><p>과목을 선택하세요.</p><div class="stage-grid">${['통합과학','물리학','화학','생명과학','지구과학'].map(x=>`<button class="stage-card" onclick="schoolTopics('고등학교','${x}')">${x}<small>${schoolIds('고등학교',x).length}개 퍼즐 ›</small></button>`).join('')}</div>`);return}if(schoolIds(s,name).length){schoolTopics(s,name);return}popup(`<button class="stage-back" onclick="schoolSubjects('${s}')">‹ 교과 선택</button><h3>${s} ${name}</h3><p>이 교과의 문제는 아직 준비 중입니다.</p><button class="primary" onclick="schoolSubjects('${s}')">교과 선택으로</button>`)}
function schoolWaiting(name){popup(`<button class="stage-back" onclick="schoolSubject('고등학교','과학')">‹ 과학 과목</button><h3>${name}</h3><p>이 과목의 문제는 아직 준비 중입니다.</p><button class="primary" onclick="schoolSubject('고등학교','과학')">과목 선택으로</button>`)}
function schoolTopics(s,course){course=course||(s==='중학교'?'과학':'물리학');let ids=schoolIds(s,course),topics=[...new Set(ids.map(id=>ADV[id].topic))];popup(`<button class="stage-back" onclick="${s==='고등학교'&&['통합과학','물리학','화학','생명과학','지구과학'].includes(course)?"schoolSubject('고등학교','과학')":`schoolSubjects('${s}')`}">‹ 돌아가기</button><h3>${s} ${course}</h3><p>학습 주제를 고르세요. 총 ${ids.length}개 퍼즐${course==='영어'?'<br>영어 단어 철자 문제가 아닌 문법 용어 퀴즈입니다.':''}</p><div class="stage-levels">${topics.map((x,i)=>`<button class="stage-level" onclick="schoolTopic('${s}','${course}',${i})"><span>${x}</span><small>${ids.filter(id=>ADV[id].topic===x).length}개 ›</small></button>`).join('')}</div><button class="secondary" onclick="closeModal()">닫기</button>`)}
function schoolTopic(s,course,index,level='전체'){let ids=schoolIds(s,course),topics=[...new Set(ids.map(id=>ADV[id].topic))],topic=topics[index],choices=['전체','입문','초급','중급','고급','최고급'],all=ids.filter(id=>ADV[id].topic===topic),shown=all.filter(id=>level==='전체'||ADV[id].level.startsWith(level));popup(`<button class="stage-back" onclick="schoolTopics('${s}','${course}')">‹ 주제 선택</button><h3>${topic}</h3><p>난이도와 문제를 선택하세요.</p><div class="adv-pills">${choices.map(x=>`<button class="${x===level?'chosen':''}" onclick="schoolTopic('${s}','${course}',${index},'${x}')">${x} ${x==='전체'?all.length:all.filter(id=>ADV[id].level.startsWith(x)).length}</button>`).join('')}</div><div class="slot-list">${shown.map(id=>`<button class="slot active" onclick="advPick(${id})"><span>${ADV[id].level.split(' · ')[0]} · ${ADV[id].words[0].w.length}글자</span><small>${advState.cleared.includes(id)?'완료 ✓':'시작 ›'}</small></button>`).join('')||'<p>해당 난이도의 문제는 아직 준비 중이에요.</p>'}</div>`)}
const beforeCourseRender=advRender;
advRender=function(){beforeCourseRender();if(!ADV[ai].course||duel)return;let g=gridData(),v=advValues();if(Object.keys(v).length!==Object.keys(g).length)return;let button=document.createElement('button');button.textContent='📘 완성한 낱말의 개념 보기';button.setAttribute('style','display:block;margin:12px auto;padding:10px 14px;border-radius:14px;background:#e8eef8;color:#425e85;font-weight:800;font-size:12px');button.onclick=showCourseConcepts;area.appendChild(button)};
function showCourseConcepts(){let q=ADV[ai];popup(`<div class="big">📘</div><h3>완성한 낱말의 개념</h3><div style="text-align:left">${q.words.map(w=>`<p><b>${w.w}</b><br>${w.clue}</p>`).join('')}</div><button class="primary" onclick="closeModal()">돌아가기</button>`)}
</script>
</body></html>
