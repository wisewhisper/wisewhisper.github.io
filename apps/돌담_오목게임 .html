<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#141513">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="컴퓨터 또는 친구와 즐기는 15×15 오목 게임">
  <title>돌담 오목</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d6a85f'/%3E%3Cpath d='M5 10h22M5 16h22M5 22h22M10 5v22M16 5v22M22 5v22' stroke='%23704b25' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23141615'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#171915;--muted:#707467;--paper:#f3f0e8;--panel:#fffdf6;--wood:#d8a65c;--wood-dark:#a16d32;--accent:#d44b35;--green:#344b3a;--shadow:0 18px 55px rgba(18,20,16,.16)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;overscroll-behavior:none}
    body{font-family:ui-rounded,"Pretendard","Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#fffdf5 0,transparent 28%),linear-gradient(145deg,#eee9dc,#d9ddcf);color:var(--ink);display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));min-height:100dvh}
    .app{width:min(1100px,100%);display:grid;grid-template-columns:minmax(300px,700px) minmax(250px,330px);gap:22px;align-items:center}
    .board-shell{position:relative;background:linear-gradient(135deg,#e9bd73,#c98e43);border:1px solid rgba(93,54,17,.5);border-radius:28px;padding:clamp(13px,2vw,24px);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.55),inset 0 -4px 10px rgba(91,52,15,.16)}
    .board-shell:before{content:"";position:absolute;inset:8px;border:1px solid rgba(82,51,19,.22);border-radius:22px;pointer-events:none}
    canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;min-height:260px;touch-action:none;-webkit-touch-callout:none;user-select:none;cursor:crosshair;border-radius:10px;background-color:#d8a45a;background-image:linear-gradient(rgba(75,43,17,.48) 1px,transparent 1px),linear-gradient(90deg,rgba(75,43,17,.48) 1px,transparent 1px);background-size:6.36% 6.36%;background-position:5.5% 5.5%}
    .side{background:rgba(255,253,246,.88);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75);border-radius:28px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-family:Georgia,"Noto Serif KR",serif;margin:0;font-size:clamp(1.65rem,3vw,2.25rem);letter-spacing:-.07em}.badge{font-size:.78rem;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--green);padding:6px 9px;border-radius:999px}
    .status{background:#20231f;color:#fff;border-radius:20px;padding:15px 16px;display:flex;align-items:center;gap:12px;min-height:70px}.turn-stone{width:34px;height:34px;border-radius:50%;flex:0 0 auto;box-shadow:inset -5px -6px 10px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.25)}.turn-stone.black{background:radial-gradient(circle at 35% 28%,#59605a,#141614 57%,#050605)}.turn-stone.white{background:radial-gradient(circle at 35% 28%,#fff,#eee 58%,#aaa)}.status strong{display:block;font-size:1.05rem}.status span{display:block;color:#bfc5b8;font-size:.82rem;margin-top:2px}
    .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.player{text-align:center;padding:12px 7px;border-radius:16px;background:#eeece4;border:2px solid transparent;transition:.2s}.player.active{background:#fff;border-color:#d9a354;transform:translateY(-2px)}.player b{font-size:.86rem;display:block}.player .wins{font-family:Georgia,serif;font-weight:800;font-size:1.45rem;margin-top:2px}.versus{font-size:.72rem;color:var(--muted);font-weight:900}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{font:inherit;border:0;cursor:pointer;border-radius:14px;min-height:48px;padding:10px 12px;font-weight:800;color:var(--ink);background:#e7e6df;transition:transform .12s,filter .12s,box-shadow .12s}button:active{transform:scale(.96)}button.primary{background:var(--accent);color:#fff;box-shadow:0 7px 15px rgba(212,75,53,.24)}button.full{grid-column:1/-1}button:disabled{opacity:.4;cursor:not-allowed}.hint{font-size:.82rem;line-height:1.55;color:var(--muted);margin:0}.settings{display:flex;gap:8px}.settings label{flex:1;font-size:.72rem;color:var(--muted);font-weight:800}.settings select{display:block;width:100%;margin-top:5px;border:1px solid #d7d4ca;background:#fff;border-radius:10px;padding:9px 7px;font:inherit;font-size:.84rem;color:var(--ink)}
    .thinking{position:absolute;inset:0;border-radius:28px;background:rgba(27,29,25,.16);display:none;place-items:center;pointer-events:none}.thinking.show{display:grid}.thinking span{background:#20231f;color:#fff;padding:10px 15px;border-radius:99px;font-size:.85rem;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    dialog{border:0;border-radius:24px;padding:0;max-width:min(410px,calc(100% - 30px));width:100%;color:var(--ink);box-shadow:0 24px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(18,20,16,.6);backdrop-filter:blur(4px)}.modal{padding:26px;text-align:center;background:var(--panel)}.modal .big-stone{font-size:3.5rem;line-height:1;margin-bottom:8px}.modal h2{margin:0 0 8px;font-size:1.55rem}.modal p{margin:0 0 20px;color:var(--muted);line-height:1.55}.modal button{width:100%}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:790px){body{align-items:start;padding:10px 10px max(12px,env(safe-area-inset-bottom))}.app{grid-template-columns:minmax(0,1fr);gap:10px;max-width:620px}.board-shell{width:100%;min-width:0;border-radius:20px;padding:11px}.board-shell:before{inset:5px;border-radius:16px}.side{border-radius:20px;padding:14px;gap:11px}.brand h1{font-size:1.45rem}.status{min-height:58px;padding:10px 13px}.turn-stone{width:29px;height:29px}.score{display:none}.hint{display:none}.controls button{min-height:44px}.settings{order:5}}
    @media(max-width:390px){.side{padding:12px}.brand .badge{display:none}.controls{gap:7px}.settings select{padding:7px 5px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="board-shell" aria-label="15줄 오목판">
      <canvas id="board" width="800" height="800" role="img" aria-label="오목판. 빈 교차점을 눌러 돌을 놓으세요."></canvas>
      <div class="thinking" id="thinking"><span>컴퓨터가 수를 읽는 중…</span></div>
    </section>
    <aside class="side">
      <header class="brand"><h1>돌담 오목</h1><span class="badge">15 × 15</span></header>
      <div class="status" aria-live="polite"><i class="turn-stone black" id="turnStone"></i><div><strong id="statusTitle">흑돌 차례</strong><span id="statusSub">바둑판을 눌러 첫 수를 두세요</span></div></div>
      <div class="score">
        <div class="player active" id="blackCard"><b id="blackName">나 · 흑</b><div class="wins" id="blackWins">0</div></div><span class="versus">승리</span><div class="player" id="whiteCard"><b id="whiteName">컴퓨터 · 백</b><div class="wins" id="whiteWins">0</div></div>
      </div>
      <div class="settings">
        <label>대전 방식<select id="mode"><option value="ai">컴퓨터 대전</option><option value="pvp">2인 대전</option></select></label>
        <label>난이도<select id="difficulty"><option value="easy">초급</option><option value="normal" selected>중급</option><option value="hard">고급</option></select></label>
      </div>
      <div class="controls">
        <button class="primary" id="newGame">새 대국</button><button id="undo">한 수 무르기</button><button class="full" id="sound">소리 켜짐</button>
      </div>
      <p class="hint">가로·세로·대각선으로 돌 다섯 개를 먼저 이으면 승리합니다. 마지막 수에는 붉은 점이 표시됩니다.</p>
    </aside>
  </main>
  <dialog id="result"><div class="modal"><div class="big-stone" id="resultStone">●</div><h2 id="resultTitle">흑돌 승리!</h2><p id="resultText">다섯 개의 돌이 한 줄로 이어졌습니다.</p><button class="primary" id="playAgain">다시 한 판</button></div></dialog>
  <div class="sr" id="announce" aria-live="assertive"></div>
<script>
(()=>{
  'use strict';
  const N=15, EMPTY=0, BLACK=1, WHITE=2, dirs=[[1,0],[0,1],[1,1],[1,-1]];
  const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
  const $=id=>document.getElementById(id); let board,turn,history,over,thinking=false,last=null,winLine=null;
  let audioOn=true,scores={black:0,white:0};
  try{scores=JSON.parse(window.localStorage.getItem('doldamScores')||'{"black":0,"white":0}')||scores}catch(e){scores={black:0,white:0}}
  function saveScores(){try{window.localStorage.setItem('doldamScores',JSON.stringify(scores))}catch(e){}}
  function reset(){board=Array.from({length:N},()=>Array(N).fill(0));turn=BLACK;history=[];over=false;thinking=false;last=null;winLine=null;if($('result').open&&$('result').close)$('result').close();updateUI();draw();}
  let resizeRetry=0;
  function resize(){
    const rect=canvas.getBoundingClientRect();
    const cssSize=Math.round(rect.width||canvas.clientWidth||canvas.parentElement.clientWidth||Math.min(window.innerWidth-42,800));
    if(cssSize<100){if(resizeRetry++<12)requestAnimationFrame(resize);return}
    resizeRetry=0;
    const dpr=Math.min(window.devicePixelRatio||1,2),size=Math.max(300,Math.round(cssSize*dpr));
    if(canvas.width!==size||canvas.height!==size){canvas.width=size;canvas.height=size}
    draw();
  }
  function metrics(){const p=canvas.width*.055;return{p,g:(canvas.width-2*p)/(N-1)}}
  function draw(){const {p,g}=metrics(),w=canvas.width;ctx.clearRect(0,0,w,w);const grad=ctx.createLinearGradient(0,0,w,w);grad.addColorStop(0,'#e8bc72');grad.addColorStop(.52,'#d8a45a');grad.addColorStop(1,'#c58a41');ctx.fillStyle=grad;ctx.fillRect(0,0,w,w);
    ctx.save();ctx.strokeStyle='rgba(75,43,17,.68)';ctx.lineWidth=Math.max(1,w/650);for(let i=0;i<N;i++){const q=p+i*g;ctx.beginPath();ctx.moveTo(p,q);ctx.lineTo(w-p,q);ctx.stroke();ctx.beginPath();ctx.moveTo(q,p);ctx.lineTo(q,w-p);ctx.stroke()}[[3,3],[3,11],[7,7],[11,3],[11,11]].forEach(([r,c])=>{ctx.beginPath();ctx.arc(p+c*g,p+r*g,g*.09,0,Math.PI*2);ctx.fillStyle='#5e3d20';ctx.fill()});ctx.restore();
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board?.[r][c])stone(r,c,board[r][c],g,p);
    if(winLine){ctx.strokeStyle='#d94735';ctx.lineWidth=g*.14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p+winLine[0][1]*g,p+winLine[0][0]*g);ctx.lineTo(p+winLine[4][1]*g,p+winLine[4][0]*g);ctx.stroke()}
    if(last&&!winLine){ctx.beginPath();ctx.arc(p+last.c*g,p+last.r*g,g*.09,0,Math.PI*2);ctx.fillStyle='#dc4f38';ctx.fill()}
  }
  function stone(r,c,color,g,p){const x=p+c*g,y=p+r*g,rad=g*.43;ctx.save();ctx.shadowColor='rgba(35,24,12,.35)';ctx.shadowBlur=g*.13;ctx.shadowOffsetY=g*.09;const z=ctx.createRadialGradient(x-rad*.35,y-rad*.4,rad*.08,x,y,rad);if(color===BLACK){z.addColorStop(0,'#59615b');z.addColorStop(.38,'#222522');z.addColorStop(1,'#060706')}else{z.addColorStop(0,'#fff');z.addColorStop(.55,'#f3f0e8');z.addColorStop(1,'#b8b5ad')}ctx.fillStyle=z;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();ctx.restore()}
  function updateUI(){const ai=$('mode').value==='ai';$('difficulty').disabled=!ai;$('blackName').textContent=ai?'나 · 흑':'1번 · 흑';$('whiteName').textContent=ai?'컴퓨터 · 백':'2번 · 백';$('blackWins').textContent=scores.black||0;$('whiteWins').textContent=scores.white||0;$('blackCard').classList.toggle('active',turn===BLACK&&!over);$('whiteCard').classList.toggle('active',turn===WHITE&&!over);$('turnStone').className='turn-stone '+(turn===BLACK?'black':'white');$('statusTitle').textContent=over?'대국 종료':(turn===BLACK?'흑돌 차례':(ai?'컴퓨터 차례':'백돌 차례'));$('statusSub').textContent=over?'새 대국으로 다시 도전하세요':thinking?'좋은 수를 찾고 있습니다':history.length?'마지막 수는 붉은 점으로 표시됩니다':'바둑판을 눌러 첫 수를 두세요';$('undo').disabled=!history.length||thinking;$('thinking').classList.toggle('show',thinking)}
  function place(r,c,color){if(board[r][c]||over)return false;board[r][c]=color;history.push({r,c,color});last={r,c};sound('place');const line=winner(r,c,color);if(line){winLine=line;over=true;const key=color===BLACK?'black':'white';scores[key]=(scores[key]||0)+1;saveScores();draw();updateUI();setTimeout(()=>showResult(color),420);return true}if(history.length===N*N){over=true;setTimeout(()=>showResult(0),300);return true}turn=color===BLACK?WHITE:BLACK;draw();updateUI();return true}
  function winner(r,c,color){for(const [dr,dc] of dirs){const a=[[r,c]];for(let s of [-1,1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===color){s<0?a.unshift([rr,cc]):a.push([rr,cc]);rr+=dr*s;cc+=dc*s}}if(a.length>=5)return a.slice(0,5)}return null}
  function eventCell(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height,{p,g}=metrics(),c=Math.round((x-p)/g),r=Math.round((y-p)/g);if(r<0||r>=N||c<0||c>=N)return null;if(Math.hypot(x-(p+c*g),y-(p+r*g))>g*.58)return null;return{r,c}}
  function handleInput(e){if(e.cancelable)e.preventDefault();if(thinking||over)return;const q=eventCell(e);if(!q)return;if($('mode').value==='ai'&&turn===WHITE)return;if(place(q.r,q.c,turn)&&!over&&$('mode').value==='ai'){thinking=true;updateUI();setTimeout(aiMove,280)}}
  if(window.PointerEvent){canvas.addEventListener('pointerup',handleInput,{passive:false})}else{
    canvas.addEventListener('touchend',e=>{const t=e.changedTouches&&e.changedTouches[0];if(t)handleInput({clientX:t.clientX,clientY:t.clientY,cancelable:true,preventDefault:()=>e.preventDefault()})},{passive:false});
    canvas.addEventListener('click',handleInput);
  }
  function aiMove(){if(over)return;const diff=$('difficulty').value;let move;if(diff==='easy'&&Math.random()<.38)move=randomNear();else move=bestMove(diff);thinking=false;if(move)place(move.r,move.c,WHITE);updateUI()}
  function candidates(){if(!history.length)return[{r:7,c:7}];const set=new Map(),radius=$('difficulty').value==='hard'?2:1;for(const h of history)for(let dr=-radius;dr<=radius;dr++)for(let dc=-radius;dc<=radius;dc++){const r=h.r+dr,c=h.c+dc;if(r>=0&&r<N&&c>=0&&c<N&&!board[r][c])set.set(r+','+c,{r,c})}return [...set.values()]}
  function runScore(r,c,color){let score=0;for(const [dr,dc] of dirs){let count=1,open=0;for(const s of [-1,1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===color){count++;rr+=dr*s;cc+=dc*s}if(rr>=0&&rr<N&&cc>=0&&cc<N&&!board[rr][cc])open++}const table=count>=5?1e7:count===4?(open===2?900000:110000):count===3?(open===2?35000:4500):count===2?(open===2?900:140):25;score+=table}return score}
  function bestMove(diff){let list=candidates(),best=[],top=-1;for(const m of list){const attack=runScore(m.r,m.c,WHITE),defense=runScore(m.r,m.c,BLACK);let s=Math.max(attack,defense*.94)+attack*.24+defense*.16+(14-(Math.abs(m.r-7)+Math.abs(m.c-7)))*2+Math.random()*8;if(defense>=1e7)s=9e6;if(attack>=1e7)s=2e7;if(diff==='hard'){board[m.r][m.c]=WHITE;let danger=0;for(const o of candidates())danger=Math.max(danger,runScore(o.r,o.c,BLACK));board[m.r][m.c]=0;s-=danger*.12}if(s>top+.01){top=s;best=[m]}else if(Math.abs(s-top)<.01)best.push(m)}return best[Math.floor(Math.random()*best.length)]||randomNear()}
  function randomNear(){const a=candidates();return a[Math.floor(Math.random()*a.length)]}
  function undo(){if(!history.length||thinking)return;const count=$('mode').value==='ai'&&history.length>1?2:1;for(let i=0;i<count;i++){const h=history.pop();if(h)board[h.r][h.c]=0}over=false;winLine=null;last=history.length?history[history.length-1]:null;turn=history.length%2?WHITE:BLACK;draw();updateUI();sound('undo')}
  function showResult(color){sound('win');$('resultStone').textContent=color===BLACK?'●':color===WHITE?'○':'◇';$('resultTitle').textContent=color===BLACK?'흑돌 승리!':color===WHITE?'백돌 승리!':'무승부';$('resultText').textContent=color?'다섯 개의 돌이 한 줄로 이어졌습니다.':'바둑판의 모든 자리가 채워졌습니다.';if($('result').showModal)$('result').showModal();else $('result').setAttribute('open','');$('announce').textContent=$('resultTitle').textContent}
  function sound(type){if(!audioOn)return;try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=type==='win'?660:type==='undo'?260:180;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(type==='win'?.1:.055,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(type==='win'?.35:.11));o.start();o.stop(ac.currentTime+(type==='win'?.36:.12))}catch{}}
  $('newGame').onclick=reset;$('playAgain').onclick=reset;$('undo').onclick=undo;$('mode').onchange=()=>{reset();updateUI()};$('difficulty').onchange=reset;$('sound').onclick=()=>{audioOn=!audioOn;$('sound').textContent=audioOn?'소리 켜짐':'소리 꺼짐';if(audioOn)sound('place')};
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,180));window.addEventListener('pageshow',resize);window.addEventListener('load',resize);document.addEventListener('visibilitychange',()=>{if(!document.hidden)resize()});
  if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas.parentElement);
  reset();requestAnimationFrame(()=>requestAnimationFrame(resize));setTimeout(resize,300);
})();
</script>
</body>
</html>
