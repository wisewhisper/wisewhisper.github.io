<dialog id="editor" aria-labelledby="editorTitle"><div class="dialog-inner"><div class="row between"><h2 id="editorTitle">오늘 남기기</h2><button class="close" data-close="editor" aria-label="닫기">✕</button></div><p class="editor-intro">사진, 한마디, 마음 중 하나면 충분해요.</p><form id="entryForm"><div class="photo-pick"><div id="photoPreview"></div><label class="photo-label" for="photo"><b id="photoLabel">＋ 사진 한 장</b><span>사진 없이 글이나 마음만 남겨도 좋아요</span></label><input id="photo" type="file" accept="image/*" aria-label="사진 선택"></div><label for="note">오늘의 한마디 <small>선택</small></label><textarea id="note" maxlength="4000" placeholder="평범했던 일, 마음에 남은 말, 그냥 오늘의 나…" rows="3"></textarea><div class="count"><span id="charCount">0</span> / 4,000</div><label id="moodLabel">어떤 마음이었나요? <small>선택</small></label><div id="emotionChoices" class="row emotions" role="group" aria-labelledby="moodLabel"></div><details id="extras"><summary>조금 더 남기기 · 날짜, 장소, 주제</summary><label for="date">기록 날짜</label><input id="date" type="date" required><label for="tag">이 순간의 주제</label><select id="tag"><option value="">선택하지 않기</option><option>일상</option><option>사람</option><option>산책과 여행</option><option>배움</option><option>휴식</option><option>작은 성취</option><option>음식</option><option>고민</option></select><label for="place">기억하고 싶은 장소</label><input id="place" maxlength="100" placeholder="직접 입력 · 위치를 자동 수집하지 않아요"></details><div class="sticky-save"><button class="secondary" type="button" id="cancelEdit">취소</button><button class="primary" id="saveBtn" type="submit">이 순간 간직하기</button></div></form></div></dialog>
<dialog id="detail" aria-label="기록 자세히 보기"><div class="dialog-inner" id="detailBody"></div></dialog><dialog id="linkDialog" aria-labelledby="linkTitle"><div class="dialog-inner"><div class="row between"><h2 id="linkTitle">그때와 지금 잇기</h2><button class="close" data-close="linkDialog" aria-label="닫기">✕</button></div><p class="muted" id="linkHint"></p><input type="search" id="linkSearch" placeholder="한마디, 날짜, 장소로 찾기" aria-label="연결할 기록 검색"><div id="linkList" class="pick-list"></div><button class="secondary" data-close="linkDialog">돌아가기</button></div></dialog><input type="file" id="importFile" accept="application/json,.json" hidden><div class="toast hidden" id="toast" role="status" aria-live="polite"></div><script>'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moods=[['☀️','기쁨','#f8edcf'],['🌿','평온','#e8eee0'],['💛','감사','#f6e6cc'],['🌱','설렘','#e6edf5'],['☁️','무덤덤','#edebef'],['🫧','지침','#e2eaf0'],['🌧️','속상함','#e8e5f0']];
const tags=['일상','사람','산책과 여행','배움','휴식','작은 성취','음식','고민'];
const colors=['#f1e9dc','#e6edf0','#f2e5df','#e9eadd'];
let db,entries=[],view='today',collectionMode='list',month=new Date(),selectedDate='',query='',filterMood='',reviewMode='week',reviewOffset=0;
let editId=null,chosenMood='',photoData='',photoBusy=false,photoSeq=0,linkSource=null,saving=false,initialSnapshot='';
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const today=()=>localDate(new Date());
const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
const moodInfo=m=>moods.find(x=>x[1]===m);
const cardColor=e=>moodInfo(e.mood)?.[2]||colors[Array.from(e.id).reduce((a,c)=>a+c.charCodeAt(0),0)%colors.length];
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function transact(stores,mode,fn){return new Promise((resolve,reject)=>{if(!db){reject(Error('storage unavailable'));return}const t=db.transaction(stores,mode);let request;try{request=fn(t)}catch(e){t.abort();reject(e);return}t.oncomplete=()=>resolve(request?.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('aborted'))})}
const getAll=()=>transact(['entries'],'readonly',t=>t.objectStore('entries').getAll());
const put=e=>transact(['entries'],'readwrite',t=>t.objectStore('entries').put(e));
async function refresh(){entries=await getAll();entries.sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);render()}
function navigate(v){view=v;selectedDate='';render();window.scrollTo(0,0)}
function nav(){const selected=view==='settings'?'':view;$('.nav').innerHTML=[['today','◒','오늘'],['collection','▦','모아보기'],['review','◑','돌아보기']].map(([v,ic,n])=>`<button data-nav="${v}" class="${selected===v?'active':''}" ${selected===v?'aria-current="page"':''}><i aria-hidden="true">${ic}</i>${n}</button>`).join('')}
function title(e){return e.note|| (e.mood?`${e.mood}의 순간`:'사진으로 남긴 순간')}
function card(e){const type=e.photo?'photo':e.note?'text':'mood';const linked=(e.links||[]).some(id=>entries.some(x=>x.id===id));return `<button class="entry ${type}" data-entry="${e.id}" style="--card:${cardColor(e)}" aria-label="${esc(e.date+' '+title(e).slice(0,70))}">${e.photo?`<img src="${e.photo}" alt="기록 사진" loading="lazy">`:''}<div class="body"><small>${dateLabel(e.date)}</small>${type==='mood'?`<span class="mood-symbol" aria-hidden="true">${moodInfo(e.mood)?.[0]||'◌'}</span><p>${esc(e.mood)}</p>`:`<p class="lines">${esc(e.note||'사진 한 장에 담긴 오늘.')}</p>`}<div class="entry-footer">${e.mood&&type!=='mood'?`<span class="badge">${moodInfo(e.mood)?.[0]} ${esc(e.mood)}</span>`:''}${e.favorite?'<span class="badge">★ 대표 순간</span>':''}${linked?'<span class="badge">↔ 이어진 기억</span>':''}${e.tag?`<span class="badge">${esc(e.tag)}</span>`:''}</div></div></button>`}
function cards(list,emptyText='사진이 없어도 괜찮아요. 한마디나 마음 하나로 시작해 보세요.'){return list.length?list.map(card).join(''):`<div class="empty"><span class="empty-icon">◌</span><b>이곳에 하루가 모일 거예요</b>${emptyText}<p><button class="secondary" data-action="new">첫 순간 남기기</button></p></div>`}
function pairs(list=entries){const allowed=new Set(list.map(e=>e.id)),seen=new Set(),result=[];for(const e of list){for(const id of e.links||[]){const other=entries.find(x=>x.id===id);if(!other||!allowed.has(id))continue;const key=[e.id,id].sort().join(':');if(seen.has(key))continue;seen.add(key);result.push([e,other].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created))}}return result}
function pairCard(pair){const [a,b]=pair;return `<section class="pair"><div class="row between"><small>↔ ${a.date===b.date?'같은 날, 다른 순간':'그때와 지금'}</small><button class="subtle-link" data-unlink="${a.id}" data-other="${b.id}">연결 해제</button></div><div class="pair-grid" style="margin-top:13px">${card(a)}${card(b)}</div><div class="pair-note">${a.date===b.date?'두 순간은 어떤 이야기로 이어지나요?':'이 순간들과 나는, 무엇이 달라졌나요?'} <button class="subtle-link" data-action="reflect">생각 남기기</button></div></section>`}
function renderToday(){const days=new Set(entries.map(e=>e.date)).size,day=entries.filter(e=>e.date===today()),ps=pairs();const past=entries.find(e=>e.date<today());return `<section class="hero"><div class="intro"><div class="eyebrow">${dateLabel(today())} · A PAGE OF YOUR DAY</div><h1>오늘도, 남길 만한<br>순간이 있었나요?</h1><p>사진이 없어도 괜찮아요.<br>한마디나 마음 하나면 충분합니다.</p><button class="primary" data-action="new" style="margin-top:13px">＋ 오늘 남기기</button></div><div class="panel feature-side"><small>${days?'차곡차곡 쌓인 나의 시간':'당신의 첫 페이지'}</small><h2>${days?`${days}일의 기억,<br>${entries.length}개의 작은 순간.`:'특별하지 않은 날도<br>나의 이야기니까.'}</h2><div class="row"><span class="note">${past?'지난날의 내가 기다리고 있어요.':'빈 날은 비워두어도 좋아요.'}</span><button class="secondary" data-action="${past?'past':'new'}">${past?'지난 기억 보기 →':'첫 기록 →'}</button></div><span class="orb" aria-hidden="true">◌</span></div></section><div class="hint"><span>◌ 사진과 글은 이 브라우저에 저장돼요. 기기 변경·데이터 삭제 전에 백업해 주세요.</span><button data-nav="settings">백업</button></div><div class="row between section-head"><h2>오늘의 조각들</h2><small>${day.length}개의 순간</small></div><div class="grid">${cards(day)}</div><div class="row between section-head"><h2>그때와 지금</h2><button class="subtle-link" data-action="link-start">두 기억 잇기 ＋</button></div>${ps.length?pairCard(ps[0]):`<div class="panel"><p>같은 장소의 다른 계절, 예전 고민과 지금의 마음.</p><p class="muted note">두 기록을 직접 연결하면 시간의 흐름이 보여요. 사진과 글도 서로 이을 수 있어요.</p><button class="secondary" data-action="link-start">${entries.length>=2?'연결할 기억 고르기':'기록을 쌓고 연결해 보세요'}</button></div>`}<p class="footer-text">잘 쓴 하루보다, 나다운 하루를.</p>`}
function filtered(){let q=query.trim().toLowerCase();return entries.filter(e=>(!filterMood||e.mood===filterMood)&&(e.note+' '+e.place+' '+e.tag+' '+e.date+' '+e.mood).toLowerCase().includes(q))}
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();const filteredEntries=filtered();return `<div class="row between"><button class="secondary" data-month="-1" aria-label="이전 달">←</button><h2 class="month-heading">${y}년 ${m+1}월</h2><button class="secondary" data-month="1" aria-label="다음 달">→</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(d=>`<div class="week">${d}</div>`).join('')}${'<div></div>'.repeat(first)}${Array.from({length:last},(_,i)=>{const d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,list=filteredEntries.filter(e=>e.date===d),photo=list.find(e=>e.photo)?.photo;return `<button class="day ${selectedDate===d?'selected':''}" data-date="${d}" ${list.length?`style="--card:${cardColor(list[0])}"`:''} aria-label="${d}, 기록 ${list.length}개">${i+1}${d===today()?'<span class="dot"> · 오늘</span>':''}${photo?`<img src="${photo}" alt="그날의 사진">`:list.length?`<div style="font-size:20px">${moodInfo(list[0].mood)?.[0]||'≋'}</div>`:''}${list.length?`<small class="dot">${list.length}개</small>`:''}</button>`}).join('')}</div>${selectedDate?`<div class="row between section-head"><h2>${dateLabel(selectedDate)}</h2>${selectedDate<=today()?`<button class="secondary" data-new-date="${selectedDate}">＋ 이 날 남기기</button>`:''}</div><div class="grid">${cards(filteredEntries.filter(e=>e.date===selectedDate),'이 날은 아직 빈 페이지예요.')}</div>`:'<p class="muted note">날짜를 누르면 그날의 기록을 펼칠 수 있어요.</p>'}`}
function renderCollection(){return `<div class="eyebrow">YOUR MOMENT COLLECTION</div><div class="row between"><h1>모아둔 순간들</h1><button class="primary" data-action="new">＋ 남기기</button></div><p class="muted">사진도, 짧은 말도, 말없이 남긴 마음도.</p><div class="toolbar"><input id="search" type="search" placeholder="한마디 · 날짜 · 장소 · 주제 검색" aria-label="기록 검색" value="${esc(query)}"><div class="seg"><button data-mode="list" class="${collectionMode==='list'?'active':''}">목록</button><button data-mode="calendar" class="${collectionMode==='calendar'?'active':''}">달력</button></div></div><div class="row" style="margin-bottom:18px"><label for="moodFilter" style="margin:0;font-size:12px">마음으로 찾기</label><select id="moodFilter" style="width:auto;padding:6px 10px"><option value="">모든 마음</option>${moods.map(([ic,n])=>`<option value="${n}" ${filterMood===n?'selected':''}>${ic} ${n}</option>`).join('')}</select><small id="resultCount">${filtered().length}개의 순간</small></div><div id="collectionContent">${collectionMode==='calendar'?renderCalendar():`<div class="grid">${cards(filtered(),'검색어나 마음 필터를 바꾸거나, 새로운 순간을 남겨보세요.')}</div>`}</div>`}
function period(){const now=new Date();let start,end;if(reviewMode==='month'){start=new Date(now.getFullYear(),now.getMonth()+reviewOffset,1);end=new Date(start.getFullYear(),start.getMonth()+1,0)}else{let weekday=(now.getDay()+6)%7;start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-weekday+reviewOffset*7);end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6)}return {start:localDate(start),end:localDate(end),label:reviewMode==='month'?`${start.getFullYear()}년 ${start.getMonth()+1}월`:`${dateLabel(localDate(start))} — ${dateLabel(localDate(end))}`}}
function renderReview(){const p=period(),list=entries.filter(e=>e.date>=p.start&&e.date<=p.end),stars=list.filter(e=>e.favorite),ps=pairs();const moodEntries=list.filter(e=>e.mood),topTags={};for(const e of list)if(e.tag)topTags[e.tag]=(topTags[e.tag]||0)+1;return `<div class="eyebrow">LOOK BACK, FIND YOUR THREAD</div><h1>나의 시간을 펼치다</h1><p class="muted">얼마나 많이 남겼는지보다, 무엇이 마음에 남았는지.</p><div class="row between"><div class="seg"><button data-period="week" class="${reviewMode==='week'?'active':''}">한 주</button><button data-period="month" class="${reviewMode==='month'?'active':''}">한 달</button></div><div class="row"><button class="secondary" data-offset="-1" aria-label="이전 기간">←</button><button class="secondary" data-offset="1" aria-label="다음 기간" ${reviewOffset>=0?'disabled':''}>→</button></div></div><h2>${p.label}</h2><div class="review-grid"><div><div class="row between section-head"><h2>이 시간의 장면들</h2><small>${list.length}개의 순간</small></div><div class="grid">${cards(list.slice(0,6),'이 기간에는 기록이 없어요. 빈 날도 나의 시간입니다.')}</div>${list.length>6?'<p class="note muted">최근 6개를 보여드려요. 전체 기록은 모아보기에서 볼 수 있어요.</p>':''}<div class="row between section-head"><h2>내가 고른 대표 순간</h2></div>${stars.length?`<div class="grid">${cards(stars)}</div>`:'<div class="panel"><p class="note muted">기록을 열어 별표를 눌러보세요. 잘한 일보다 다시 보고 싶은 순간을 골라도 좋아요.</p></div>'}</div><aside><div class="panel"><h2>이 기간의 발자국</h2><div class="review-stat"><span>기록한 날</span><strong>${new Set(list.map(e=>e.date)).size}<small> 일</small></strong></div><div class="review-stat"><span>남긴 순간</span><strong>${list.length}<small> 개</small></strong></div>${Object.entries(topTags).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,n])=>`<p class="row between"><span>${esc(t)}</span><small>${n}회</small></p>`).join('')}<details><summary>마음의 색 살펴보기</summary>${moodEntries.length?moods.map(([ic,n])=>{const c=moodEntries.filter(e=>e.mood===n).length;return `<div class="bar"><span class="note">${ic} ${n}</span><div class="bar-track"><div class="bar-fill" style="width:${100*c/moodEntries.length}%;background:${moodInfo(n)[2]}"></div></div><small>${c}</small></div>`}).join(''):'<p class="note muted">마음을 선택한 기록이 아직 없어요.</p>'}<small>감정을 선택한 기록의 횟수입니다. 심리 진단이나 원인 분석은 아닙니다.</small></details></div><div class="panel" style="margin-top:16px;background:#f2e8da"><h2>잠깐의 돌아봄</h2><p>다시 떠올리고 싶은 순간은 무엇인가요?</p><button class="secondary" data-action="reflect">한마디 남기기 →</button></div></aside></div><div class="row between section-head"><h2>이어지는 나의 이야기</h2><button class="subtle-link" data-action="link-start">두 기억 잇기 ＋</button></div>${ps.length?ps.map(pairCard).join(''):'<div class="panel"><p class="muted note">기록 두 개를 연결하면, 그때와 지금을 함께 볼 수 있어요.</p><button class="secondary" data-action="link-start">기억 연결하기</button></div>'}`}
function renderSettings(){return `<div class="eyebrow">YOUR OWN LITTLE ARCHIVE</div><div class="row between"><h1>설정과 보관</h1><button class="secondary" data-nav="today">오늘로 돌아가기</button></div><div class="grid"><section class="panel settings-panel"><h2>◌ 내 기록은 어디에 있나요?</h2><p>사진과 글은 현재 기기·브라우저의 저장소에 보관됩니다. 이 앱은 기록 내용이나 사진을 서버로 전송하지 않습니다.</p><p class="note muted">기기나 브라우저가 바뀌면 자동으로 옮겨지지 않습니다. 같은 기기의 같은 브라우저에 접근할 수 있는 사람은 기록을 볼 수 있습니다. 이 버전에는 앱 비밀번호·기록 암호화·클라우드 동기화가 없습니다.</p><p class="note backup-info">브라우저 데이터 삭제, 비공개 모드 종료, 저장 공간 정리로 기록을 잃을 수 있어요. 중요한 기록은 정기적으로 백업해 주세요.</p><button class="secondary" data-action="persistent">브라우저에 보관 유지 요청</button><p class="note muted" id="storageStatus">브라우저 지원 여부에 따라 허용됩니다. 백업을 대신하지는 않습니다.</p></section><section class="panel settings-panel"><h2>백업과 복원</h2><p>${entries.length}개의 기록과 연결 관계를 파일로 보관할 수 있어요.</p><div class="actions"><button class="primary" data-action="export">백업 내려받기</button><button class="secondary" data-action="import">백업 불러오기</button></div><p class="note muted">${lastBackupText()}</p><p class="note muted">백업 파일에는 사진과 글이 원문으로 포함됩니다. 안전한 곳에 보관해 주세요. 복원할 때 기록을 합치며, 같은 ID는 백업 내용으로 바뀝니다.</p></section><section class="panel settings-panel"><h2>하루결 사용 안내</h2><p class="note">① 사진·한마디·마음 중 하나를 남기세요.<br>② 모아보기에서 기록을 찾아보세요.<br>③ 기록 상세의 ‘다른 기억과 잇기’로 두 순간을 연결하세요.<br>④ 별표를 누르면 돌아보기의 대표 순간에 모입니다.</p><p class="note muted">날짜는 선택한 기록 날짜를 사용합니다. 사진의 촬영일·위치·날씨·이동 경로를 자동 수집하지 않습니다. 상단 설정과 아래 메뉴로 언제든 돌아갈 수 있어요.</p></section><section class="panel settings-panel"><h2>기록 정리</h2><p class="note muted">삭제한 기록은 백업이 없으면 복구할 수 없습니다.</p><button class="secondary danger" data-action="clear">모든 기록 삭제</button></section></div><p class="footer-text">하루결 1.0 · 오늘을 남기고, 시간을 잇다</p>`}
function lastBackupText(){try{const d=localStorage.getItem('harugyeol-last-backup');return d?`최근 백업 내려받기: ${new Date(d).toLocaleString('ko-KR')}`:'아직 백업을 내려받지 않았어요.'}catch{return '정기적으로 백업을 내려받아 주세요.'}}
function render(){nav();$('#app').innerHTML=view==='today'?renderToday():view==='collection'?renderCollection():view==='review'?renderReview():renderSettings();if($('#search'))$('#search').oninput=e=>{query=e.target.value;updateCollection()};if($('#moodFilter'))$('#moodFilter').onchange=e=>{filterMood=e.target.value;updateCollection()}}
function updateCollection(){$('#resultCount').textContent=filtered().length+'개의 순간';$('#collectionContent').innerHTML=collectionMode==='calendar'?renderCalendar():`<div class="grid">${cards(filtered(),'검색어나 마음 필터를 바꾸어 보세요.')}</div>`}
function setMood(m){chosenMood=m;$('#emotionChoices').innerHTML=moods.map(([ic,n])=>`<button type="button" data-mood="${n}" class="${m===n?'selected':''}" aria-pressed="${m===n}">${ic} ${n}</button>`).join('')+`<button type="button" data-mood="" aria-pressed="${!m}" class="${!m?'selected':''}">선택 안 함</button>`}
function previewPhoto(){const box=$('#photoPreview');box.replaceChildren();if(photoData){const img=new Image();img.src=photoData;img.alt='선택한 사진 미리보기';box.append(img);const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='사진 빼기';b.onclick=()=>{photoSeq++;photoData='';$('#photo').value='';previewPhoto()};box.append(b)}$('#photoLabel').textContent=photoData?'사진 바꾸기':'＋ 사진 한 장'}
function snapshot(){return JSON.stringify([$('#note').value,chosenMood,photoData,$('#date').value,$('#tag').value,$('#place').value])}
function openEditor(id=null,d=today(),prompt=''){const e=entries.find(x=>x.id===id);editId=e?.id||null;photoSeq++;$('#entryForm').reset();$('#editorTitle').textContent=e?'기억 다듬기':d===today()?'오늘 남기기':dateLabel(d)+' 남기기';$('#note').value=e?.note||prompt;$('#note').placeholder='평범했던 일, 마음에 남은 말, 그냥 오늘의 나…';$('#charCount').textContent=$('#note').value.length;$('#date').value=e?.date||d;$('#date').max=today();$('#tag').value=e?.tag||'';$('#place').value=e?.place||'';$('#extras').open=!!e?.place||!!e?.tag||d!==today()||!!e&&e.date!==today();photoData=e?.photo||'';setMood(e?.mood||'');previewPhoto();initialSnapshot=snapshot();$('#editor').showModal()}
function closeEditor(){if(saving){toast('저장을 마칠 때까지 잠시 기다려 주세요.');return}if(snapshot()!==initialSnapshot&&!confirm('저장하지 않은 내용이 있어요. 기록 화면을 닫을까요?'))return;photoSeq++;$('#editor').close()}
function handlePhoto(file){if(!file)return;if(photoBusy)return;if(!/^image\//.test(file.type)){toast('이미지 파일을 선택해 주세요.');return}if(file.size>30*1024*1024){toast('30MB 이하의 사진을 선택해 주세요.');return}const seq=++photoSeq;photoBusy=true;$('#saveBtn').disabled=true;const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{if(!img.width||!img.height)throw Error();const k=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*k));canvas.height=Math.max(1,Math.round(img.height*k));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);if(seq===photoSeq){photoData=canvas.toDataURL('image/jpeg',.82);previewPhoto()}}catch{toast('사진을 처리하지 못했어요. 다른 사진을 선택해 주세요.')}finally{done()}};img.onerror=()=>{toast('이 사진 형식을 읽지 못했어요. JPEG·PNG로 다시 선택해 주세요.');done()};function done(){URL.revokeObjectURL(url);photoBusy=false;$('#saveBtn').disabled=false}img.src=url}
function validDate(d){if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const dt=new Date(d+'T12:00:00Z');return !isNaN(dt)&&dt.toISOString().slice(0,10)===d}
function validId(id){return typeof id==='string'&&/^[a-zA-Z0-9-]{1,100}$/.test(id)}
function validateItem(e){return !!e&&validId(e.id)&&validDate(e.date)&&e.date<=today()&&typeof e.note==='string'&&e.note.length<=4000&&typeof e.photo==='string'&&e.photo.length<6500000&&(!e.photo||/^data:image\/(jpeg|png|webp);base64,[a-zA-Z0-9+/=]+$/.test(e.photo))&&typeof e.mood==='string'&&(!e.mood||!!moodInfo(e.mood))&&!!(e.note.trim()||e.photo||e.mood)&&typeof e.place==='string'&&e.place.length<=100&&typeof e.tag==='string'&&(!e.tag||tags.includes(e.tag))&&typeof e.favorite==='boolean'&&Number.isFinite(e.created)&&Array.isArray(e.links)&&e.links.length<=1000&&e.links.every(x=>validId(x)&&x!==e.id)&&new Set(e.links).size===e.links.length}
function normalizeLinks(list){const map=new Map(list.map(e=>[e.id,{...e,links:[]} ]));for(const e of list){for(const id of e.links||[]){if(id===e.id||!map.has(id))continue;const a=map.get(e.id),b=map.get(id);if(!a.links.includes(id))a.links.push(id);if(!b.links.includes(e.id))b.links.push(e.id)}}return Array.from(map.values())}
async function saveEntry(event){event.preventDefault();if(photoBusy){toast('사진을 처리하고 있어요. 잠시 기다려 주세요.');return}if(saving)return;const note=$('#note').value.trim();if(!note&&!photoData&&!chosenMood){toast('사진, 한마디, 마음 중 하나를 남겨주세요.');$('#note').focus();return}if(!validDate($('#date').value)||$('#date').value>today()){toast('오늘 또는 지난 날짜를 선택해 주세요.');$('#extras').open=true;$('#date').focus();return}const prev=entries.find(e=>e.id===editId);const item={id:prev?.id||(globalThis.crypto?.randomUUID?.()||'record-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),date:$('#date').value,note,mood:chosenMood,photo:photoData,place:$('#place').value.trim(),tag:$('#tag').value,created:prev?.created||Date.now(),favorite:prev?.favorite||false,links:prev?.links||[]};if(!validateItem(item)){toast('기록 내용을 다시 확인해 주세요.');return}saving=true;$('#saveBtn').disabled=true;try{await put(item);initialSnapshot=snapshot();$('#editor').close();await refresh();toast('한 순간을 간직했어요.')}catch{toast('저장하지 못했어요. 저장 공간과 브라우저 설정을 확인해 주세요.')}finally{saving=false;$('#saveBtn').disabled=false}}
function openDetail(id){const e=entries.find(x=>x.id===id);if(!e)return;const linked=(e.links||[]).map(id=>entries.find(x=>x.id===id)).filter(Boolean);$('#detailBody').innerHTML=`<div class="row between"><div class="date-top"><small>${dateLabel(e.date)}</small>${e.mood?`<span class="badge">${moodInfo(e.mood)?.[0]} ${esc(e.mood)}</span>`:''}</div><button class="close" data-close="detail" aria-label="닫기">✕</button></div>${e.photo?`<img class="detail-photo" src="${e.photo}" alt="기록 사진">`:''}${e.note?`<p class="pre detail-note">${esc(e.note)}</p>`:`<h2 style="padding:25px 0">${e.mood?moodInfo(e.mood)?.[0]+' '+esc(e.mood):'사진으로 남긴 하루'}</h2>`}<div>${e.tag?`<span class="badge">${esc(e.tag)}</span>`:''}${e.place?`<span class="badge">⌖ ${esc(e.place)}</span>`:''}</div><div class="actions" style="margin-top:22px"><button class="secondary" data-favorite="${id}" aria-pressed="${e.favorite}">${e.favorite?'★ 대표 순간 해제':'☆ 대표 순간으로'}</button><button class="secondary" data-link="${id}">↔ 다른 기억과 잇기</button></div>${linked.length?`<h2 style="margin-top:25px">이어진 기억</h2><div class="pick-list">${linked.map(pickRow).join('')}</div>`:''}<div class="actions" style="border-top:1px solid var(--line);margin-top:22px;padding-top:20px"><button class="primary" data-edit="${id}">수정</button><button class="secondary danger" data-delete="${id}">삭제</button><button class="secondary" data-close="detail">돌아가기</button></div>`;if(!$('#detail').open)$('#detail').showModal()}
function pickRow(e){return `<button class="pick-row" data-entry="${e.id}">${e.photo?`<img src="${e.photo}" alt="기록 사진" loading="lazy">`:`<span class="thumb" aria-hidden="true">${moodInfo(e.mood)?.[0]||'≋'}</span>`}<div><small>${e.date}${e.mood?' · '+esc(e.mood):''}</small><span class="trunc">${esc(title(e).slice(0,100))}</span></div></button>`}
function startLink(id=null){if(entries.length<2){toast('기록이 두 개 이상 모이면 서로 연결할 수 있어요.');return}linkSource=id;$('#linkSearch').value='';renderLinkList();$('#linkDialog').showModal()}
function renderLinkList(){const source=entries.find(e=>e.id===linkSource),q=$('#linkSearch').value.toLowerCase().trim();$('#linkHint').textContent=source?`‘${title(source).slice(0,35)}’와 이어질 다른 기억을 골라주세요.`:'먼저 연결할 첫 번째 기억을 골라주세요.';const candidates=entries.filter(e=>e.id!==linkSource&&!(source?.links||[]).includes(e.id)&&(e.note+' '+e.place+' '+e.date+' '+e.tag).toLowerCase().includes(q));$('#linkList').innerHTML=candidates.length?candidates.map(e=>pickRow(e).replace('data-entry=','data-link-pick=')).join(''):'<p class="empty-inline">연결할 다른 기록이 없어요. 검색어를 바꾸거나 새 기록을 남겨보세요.</p>'}
async function linkRecords(id){if(!linkSource){linkSource=id;renderLinkList();return}const a=entries.find(e=>e.id===linkSource),b=entries.find(e=>e.id===id);if(!a||!b||a.id===b.id)return;try{await transact(['entries'],'readwrite',t=>{const s=t.objectStore('entries');s.put({...a,links:[...new Set([...(a.links||[]),b.id])]});s.put({...b,links:[...new Set([...(b.links||[]),a.id])]});});$('#linkDialog').close();$('#detail').close();await refresh();toast('두 순간이 이어졌어요. 돌아보기에서 함께 볼 수 있어요.')}catch{toast('연결하지 못했어요. 다시 시도해 주세요.')}}
async function unlink(aid,bid){if(!confirm('두 기록의 연결을 해제할까요? 기록은 그대로 남습니다.'))return;try{await transact(['entries'],'readwrite',t=>{const s=t.objectStore('entries');for(const [id,other] of [[aid,bid],[bid,aid]]){const e=entries.find(x=>x.id===id);if(e)s.put({...e,links:(e.links||[]).filter(x=>x!==other)})}});await refresh();toast('연결을 해제했어요.')}catch{toast('연결을 해제하지 못했어요.')}}
async function deleteEntry(id){if(!confirm('이 기록을 삭제할까요? 연결도 함께 해제되며, 백업 없이는 복구할 수 없어요.'))return;try{await transact(['entries'],'readwrite',t=>{const s=t.objectStore('entries');s.delete(id);for(const e of entries)if((e.links||[]).includes(id))s.put({...e,links:e.links.filter(x=>x!==id)})});$('#detail').close();await refresh();toast('기록을 삭제했어요.')}catch{toast('삭제하지 못했어요. 다시 시도해 주세요.')}}
async function toggleFavorite(id){const e=entries.find(x=>x.id===id);if(!e)return;try{await put({...e,favorite:!e.favorite});await refresh();openDetail(id);toast(e.favorite?'대표 순간을 해제했어요.':'대표 순간으로 골랐어요.')}catch{toast('변경하지 못했어요.')}}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'harugyeol',version:2,exportedAt:new Date().toISOString(),entries},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`하루결_백업_${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);try{localStorage.setItem('harugyeol-last-backup',new Date().toISOString())}catch{}if(view==='settings')render();toast('백업 파일 다운로드를 요청했어요. 파일이 저장됐는지 확인해 주세요.')}
function parseBackup(text){const data=JSON.parse(text);if(data.app!=='harugyeol'||data.version!==2||!Array.isArray(data.entries)||data.entries.length>20000||!data.entries.every(validateItem)||new Set(data.entries.map(e=>e.id)).size!==data.entries.length)throw Error('Invalid backup');return data.entries}
async function importBackup(file){if(!file)return;try{if(file.size>100*1024*1024)throw Error('Too large');const incoming=parseBackup(await file.text());const duplicate=incoming.filter(e=>entries.some(x=>x.id===e.id)).length;if(!confirm(`${incoming.length}개의 기록을 합칠까요? 같은 ID ${duplicate}개는 백업 내용으로 바뀝니다. 현재 기록을 먼저 백업하는 것이 좋습니다.`))return;const replaced=new Set(incoming.map(e=>e.id));const combined=normalizeLinks([...entries.filter(e=>!replaced.has(e.id)),...incoming]);if(!combined.every(validateItem))throw Error('Invalid combined data');await transact(['entries'],'readwrite',t=>{const s=t.objectStore('entries');s.clear();combined.forEach(e=>s.put(e))});await refresh();toast(`${incoming.length}개의 기록을 불러왔어요.`)}catch{toast('복원하지 못했어요. 하루결 백업 파일인지, 저장 공간이 충분한지 확인해 주세요.')}finally{$('#importFile').value=''}}
async function clearAll(){if(!confirm('사진·글·감정·연결을 모두 삭제할까요? 먼저 백업해 주세요.'))return;if(!confirm('모든 기록을 영구 삭제합니다. 계속할까요?'))return;try{await transact(['entries'],'readwrite',t=>t.objectStore('entries').clear());await refresh();toast('모든 기록을 삭제했어요.')}catch{toast('삭제하지 못했어요.')}}
async function persistStorage(){const status=$('#storageStatus');try{if(!navigator.storage?.persist){status.textContent='이 브라우저는 보관 유지 요청을 지원하지 않아요. 백업 파일을 내려받아 주세요.';return}const ok=await navigator.storage.persist();status.textContent=ok?'브라우저가 보관 유지 요청을 허용했어요. 직접 데이터 삭제나 기기 분실에 대비해 백업도 해주세요.':'보관 유지가 허용되지 않았어요. 중요한 기록은 백업해 주세요.'}catch{status.textContent='보관 유지 상태를 확인하지 못했어요. 백업을 이용해 주세요.'}}
async function handleClick(event){const t=event.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;if(d.close){if(d.close==='editor')closeEditor();else $('#'+d.close).close();return}if(d.nav){navigate(d.nav);return}if(d.entry){openDetail(d.entry);return}if(d.mood!==undefined){setMood(d.mood);return}if(d.mode){collectionMode=d.mode;render();return}if(d.date){selectedDate=d.date;updateCollection();return}if(d.month){month=new Date(month.getFullYear(),month.getMonth()+Number(d.month),1);selectedDate='';updateCollection();return}if(d.newDate){openEditor(null,d.newDate);return}if(d.period){reviewMode=d.period;reviewOffset=0;render();return}if(d.offset){reviewOffset=Math.min(0,reviewOffset+Number(d.offset));render();return}if(d.edit){$('#detail').close();openEditor(d.edit);return}if(d.delete){await deleteEntry(d.delete);return}if(d.favorite){await toggleFavorite(d.favorite);return}if(d.link){startLink(d.link);return}if(d.linkPick){await linkRecords(d.linkPick);return}if(d.unlink){await unlink(d.unlink,d.other);return}switch(d.action){case'new':openEditor();break;case'past':{const e=entries.find(e=>e.date<today());if(e)openDetail(e.id);break}case'link-start':startLink();break;case'reflect':openEditor(null,today());$('#note').placeholder='두 순간 사이, 무엇이 달라졌나요? 그대로인 것은 무엇인가요?';$('#note').focus();break;case'export':exportBackup();break;case'import':$('#importFile').click();break;case'clear':await clearAll();break;case'persistent':await persistStorage();break}}
document.addEventListener('click',e=>handleClick(e).catch(()=>toast('처리하지 못했어요. 다시 시도해 주세요.')));
$('#settingsBtn').onclick=()=>navigate('settings');$('#cancelEdit').onclick=closeEditor;$('#editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});$('#photo').onchange=e=>handlePhoto(e.target.files[0]);$('#note').oninput=()=>$('#charCount').textContent=$('#note').value.length;$('#entryForm').onsubmit=saveEntry;$('#linkSearch').oninput=renderLinkList;$('#importFile').onchange=e=>importBackup(e.target.files[0]);
window.addEventListener('beforeunload',e=>{if($('#editor').open&&snapshot()!==initialSnapshot){e.preventDefault();e.returnValue=''}});
try{const req=indexedDB.open('harugyeol-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('entries',{keyPath:'id'});req.onsuccess=async()=>{db=req.result;db.onversionchange=()=>{db.close();toast('다른 탭에서 보관함이 바뀌었어요. 페이지를 새로 열어주세요.')};try{await refresh()}catch{storageError()}};req.onerror=storageError;req.onblocked=()=>toast('다른 하루결 탭을 닫고 다시 열어주세요.')}catch{storageError()}
function storageError(){$('#app').innerHTML='<div class="empty"><b>기록 보관함을 열 수 없어요</b>일반 브라우저에서 열고 사이트 저장소를 허용해 주세요. 비공개 모드에서는 기록이 유지되지 않을 수 있습니다.</div>'}
window.addEventListener('focus',()=>{if(db&&!$('#editor').open&&!$('#detail').open&&!$('#linkDialog').open)refresh().catch(()=>{})});
</script></body></html>
