<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전력과 전기 에너지 통합 실험실</title><style>
:root{color-scheme:dark;--bg:#080e17;--panel:#111d2c;--line:#304359;--ink:#eaf3ff;--muted:#a8bfd1;--cyan:#72e7df;--amber:#ffd28c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px}h1{font-size:clamp(17px,2vw,25px);margin:0}h2{font-size:17px;margin:0 0 6px}nav,.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}nav{padding:0 12px 7px;overflow-x:auto;flex-wrap:nowrap}nav button{white-space:nowrap}button,select{font:inherit;color:var(--ink);background:#22344b;border:1px solid #405873;border-radius:7px;padding:7px 10px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan)}button[aria-selected=true],button.on{background:#10566a;border-color:#6ce4e0}button:disabled{opacity:.45;cursor:default}main{display:grid;grid-template-columns:minmax(230px,25%) minmax(0,1fr);gap:9px;padding:0 10px}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}.controls{max-height:calc(100dvh - 128px);overflow:auto}.stage{display:flex;flex-direction:column;gap:6px}.scene{height:clamp(255px,calc(100dvh - 270px),690px);background:#071422;border:1px solid var(--line);border-radius:8px;overflow:hidden}canvas{width:100%;height:100%;display:block}.field{margin:7px 0}.field label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.field output{color:var(--cyan);font-weight:700}input[type=range]{width:100%;accent-color:var(--cyan);height:19px}input[type=checkbox]{accent-color:var(--cyan)}.check{display:flex;gap:6px;align-items:center;margin:4px 0;color:#d4e5f4}.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:5px}.meter{min-width:0;padding:6px 8px;background:#172a3c;border-radius:7px}.meter small{display:block;color:var(--muted)}.meter b{display:block;font-size:clamp(13px,1.3vw,19px);color:var(--cyan);overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted);margin:2px 0}.status{color:#ffda9b;min-height:1.45em}.formula{color:#deecf8;font-size:13px}.group{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.detail{max-width:1000px;line-height:1.8}.detail h3{color:var(--cyan);margin:12px 0 3px}.detail p{margin:0 0 10px}footer{font-size:11px;color:#9eb4c9;text-align:center;padding:7px}a{color:inherit}[hidden]{display:none!important}@media(max-width:680px){main{display:flex;flex-direction:column;padding:0 6px}.stage{order:0}.controls{order:1;max-height:none}.scene{height:clamp(260px,43dvh,400px)}.meters{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:8px}header{padding:8px}nav{padding:0 6px 6px}}
</style></head><body><header><h1>⚡ 전력과 전기 에너지 통합 실험실</h1><button id="full">⛶ 전체화면</button></header><nav id="tabs" role="tablist" aria-label="실험 선택"></nav><main><aside id="controls" class="panel controls"></aside><section class="panel stage"><h2 id="heading"></h2><div id="scene" class="scene"><canvas id="canvas" aria-label="전력과 에너지 실험 장면"></canvas></div><div id="meters" class="meters"></div><div id="formula" class="formula"></div><div id="status" class="status" aria-live="polite"></div><p id="hint" class="note"></p><div id="detail" class="detail" hidden></div></section></main><footer>© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,n=2)=>!Number.isFinite(x)?'—':Math.abs(x)>0&&Math.abs(x)<.001?x.toExponential(2):Number(x.toFixed(n)).toLocaleString('ko-KR');
const APPS=[['light','조명',40],['tv','TV',120],['pc','컴퓨터',350],['kettle','전기주전자',1500],['heater','전열기',2000],['dryer','드라이어',1800]],AMBIENT=20;
const modes=[['power','전력·에너지'],['heat','전열기·발열'],['bulbs','전구 밝기'],['compare','정전압·정전류'],['home','가정 회로·안전'],['graphs','그래프·비교'],['concept','개념 설명']];
const defaults=()=>({V:12,R:12,duration:30,heatV:24,heatR:6,mass:.2,k:1,heatT:120,bulbV:6,R1:6,R2:12,connection:'parallel',bulbT:30,cv:12,ci:1,cr:12,homeT:1,rate:180,limit:16,leak:0,rcd:true,loads:{light:true,tv:true,pc:false,kettle:false,heater:false,dryer:false},speed:1});
let s=defaults(),mode='power',lastExperiment='power',graphType='power',t=0,phase=0,running=false,ended=false,last=0,notice='준비 · 시작을 눌러 관찰하세요.',dirty=true,tripped=false,tripReason='',saved={A:null,B:null};
function powerModel(V,R,t){const I=V/R,P=V*I;return{I,P,E:P*t}}
function heatModel(a,t){const P=a.heatV*a.heatV/a.heatR,C=a.mass*4186,k=a.k;const delta=k===0?P*t/C:P/k*(-Math.expm1(-k*t/C));const stored=C*delta,E=P*t;return{P,I:a.heatV/a.heatR,T:AMBIENT+delta,stored,loss:Math.max(0,E-stored),E}}
function bulbModel(a,t){const v=a.bulbV,r1=a.R1,r2=a.R2,series=a.connection==='series',I=series?v/(r1+r2):v/r1+v/r2,I1=series?I:v/r1,I2=series?I:v/r2,P1=I1*I1*r1,P2=I2*I2*r2;return{I,I1,I2,V1:I1*r1,V2:I2*r2,P1,P2,P:P1+P2,E:(P1+P2)*t,req:v===0?(series?r1+r2:r1*r2/(r1+r2)):v/I}}
function compareModel(a,R=a.cr){return{Pv:a.cv*a.cv/R,Pi:a.ci*a.ci*R,Iv:a.cv/R,Vi:a.ci*R}}
function homeModel(a){const P=APPS.reduce((n,[id,_,p])=>n+(a.loads[id]?p:0),0),I=P/220,over=I>a.limit,leakTrip=a.rcd&&a.leak>=30;return{P,I,over,leakTrip,trip:over||leakTrip}}
function maxTime(){return mode==='heat'?s.heatT:mode==='bulbs'?s.bulbT:mode==='home'?s.homeT*3600:s.duration}
function resetRun(msg='조건 변경 · 시작을 누르세요.'){running=false;ended=false;t=0;phase=0;tripped=false;tripReason='';notice=msg;dirty=true}
function tripCheck(){const d=homeModel(s);if(d.trip){tripped=true;running=false;tripReason=d.over?'과부하: 가상 과전류 차단':'누설전류: 가상 누전차단';notice=tripReason;return true}return false}
function changeMode(m){if(mode===m)return;mode=m;if(m==='graphs'){graphType=['heat','bulbs','compare','home'].includes(lastExperiment)?lastExperiment:'power'}else if(m!=='concept')lastExperiment=m;resetRun('준비 · 시작을 눌러 관찰하세요.');build()}
for(const [id,label] of modes){const b=document.createElement('button');b.dataset.mode=id;b.textContent=label;b.setAttribute('role','tab');b.onclick=()=>changeMode(id);$('tabs').append(b)}
$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(z=>z[0]===mode),n=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;changeMode(modes[n][0]);$('tabs').children[n].focus()});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
const units={V:'V',R:'Ω',duration:'s',heatV:'V',heatR:'Ω',mass:'kg',k:'W/K',heatT:'s',bulbV:'V',R1:'Ω',R2:'Ω',bulbT:'s',cv:'V',ci:'A',cr:'Ω',homeT:'h',rate:'원/kWh',limit:'A',leak:'mA',speed:'×'};
function slider(id,label,min,max,step){return '<div class="field"><label for="'+id+'">'+label+'<output id="'+id+'out">'+fmt(s[id])+' '+units[id]+'</output></label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>'}
function btn(id,label){return '<button id="'+id+'">'+label+'</button>'}
function select(id,arr,val){return '<select id="'+id+'" aria-label="'+id+'">'+arr.map(([k,v])=>'<option value="'+k+'" '+(String(k)===String(val)?'selected':'')+'>'+v+'</option>').join('')+'</select>'}
function bind(id,fn,event='click'){const el=$(id);if(el)el.addEventListener(event,fn)}
function build(){for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}const cc=$('controls'),dd=$('detail');cc.hidden=mode==='concept';$('scene').hidden=mode==='concept';$('meters').hidden=mode==='concept';dd.hidden=mode!=='concept';let h='<h2>실험 조건</h2>';
if(mode==='power')h+=slider('V','전원 전압',0,24,.5)+slider('R','저항',1,100,1)+slider('duration','측정 시간',1,120,1)+'<div class="row">'+btn('doubleV','전압 ×2')+btn('doubleR','저항 ×2')+'</div><p class="note">전력이 일정할 때 에너지는 시간에 비례합니다.</p>';
if(mode==='heat')h+=slider('heatV','전열기 전압',0,24,.5)+slider('heatR','전열기 저항',3,40,1)+slider('mass','물의 질량',.1,.5,.05)+slider('k','열손실 계수',0,3,.25)+slider('heatT','가열 시간',5,120,5)+'<p class="note">초기 온도 20 ℃ · 물의 비열 4,186 J/(kg·K) · 용기 열용량 무시.</p>';
if(mode==='bulbs')h+=slider('bulbV','전원 전압',0,12,.5)+slider('R1','전구 1 저항',2,40,1)+slider('R2','전구 2 저항',2,40,1)+'<div class="row">'+select('connection',[['series','직렬 연결'],['parallel','병렬 연결']],s.connection)+'</div>'+slider('bulbT','측정 시간',1,120,1)+'<p class="note">같은 발광 특성으로 근사한 전구입니다. 밝기는 소비 전력의 단조 증가 함수로 표현합니다.</p>';
if(mode==='compare')h+=slider('cv','정전압 전원',0,24,.5)+slider('ci','정전류 전원',0,3,.1)+slider('cr','같은 저항',1,40,1)+'<p class="note">왼쪽은 전압 일정, 오른쪽은 전류 일정. 두 독립 회로의 저항을 함께 바꿉니다. 이상적 전원 모형입니다.</p>';
if(mode==='home'){h+='<h2>가전제품 (220 V 모형)</h2>'+APPS.map(([id,name,p])=>'<label class="check"><input type="checkbox" data-load="'+id+'" '+(s.loads[id]?'checked':'')+'>'+name+' · '+p+' W</label>').join('')+slider('limit','가상 차단기 한계',10,20,1)+slider('leak','가상 누설전류',0,60,5)+'<label class="check"><input id="rcd" type="checkbox" '+(s.rcd?'checked':'')+'>누전 차단 보호 모형 사용</label>'+slider('homeT','사용 시간',.25,4,.25)+slider('rate','가상 단가',0,400,10)+'<div class="row">'+btn('breaker','차단기 복귀')+'</div><p class="note">220 V 실효값·역률 1의 단순 가상 회로. 실제 차단 특성 및 전기요금과 다릅니다. 가정용 전원을 직접 조작하지 마세요.</p>'}
if(mode==='graphs')h+='<div class="row">'+select('graphType',[['power','전력·에너지'],['heat','발열'],['bulbs','전구'],['compare','전원 조건'],['home','전력량']],graphType)+'</div><p class="note">고정된 물리량 범위의 그래프입니다. 현재·A·B 조건을 같은 축에서 비교합니다. 그래프는 이상 모형의 이론 곡선입니다.</p>';
if(!['compare','graphs','concept'].includes(mode))h+=(mode==='home'?'<p class="note">시간 압축: 화면 1초 = 사용 10분 × 배속</p>':'')+slider('speed','관찰 배속',.25,4,.25)+'<div class="row">'+btn('play','▶ 시작')+btn('restart','↺ 처음부터')+'</div>';
if(mode!=='concept')h+='<div class="group"><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('clear','비교 지우기')+btn('reset','전체 초기화')+'</div></div>';
cc.innerHTML=h;if(mode==='concept')dd.innerHTML='<h3>1. 전력과 에너지</h3><p>전력 P는 단위 시간당 전달되는 에너지이다. P=VI, 일정한 전력에서 E=Pt. 1 W=1 J/s, 1 kWh=3.6×10⁶ J. 전력과 전력량은 서로 다른 물리량이다.</p><h3>2. 줄열과 온도</h3><p>옴성 저항에서 P=I²R=V²/R. 전열기가 공급하는 에너지 Pt 중 일부는 물의 내부에너지 증가 mcΔT, 나머지는 주변으로 전달된 열이다. 열손실이 k(T−20)인 모형에서는 C dT/dt=P−k(T−20), C=mc이다. k=0이면 ΔT=Pt/C.</p><h3>3. 전구의 밝기</h3><p>같은 종류의 전구에서는 전력 차이가 밝기 비교의 출발점이다. 직렬에서는 I가 같아 P=I²R, 병렬에서는 V가 같아 P=V²/R. 실제 필라멘트의 저항은 온도에 따라 달라지며 밝기·색온도는 전력과 단순 비례하지 않는다.</p><h3>4. 정전압과 정전류</h3><p>정전압에서 R 증가 → P 감소. 정전류에서 R 증가 → P 증가. 실제 정전류 전원에는 최대 출력 전압과 전력 제한이 있다.</p><h3>5. 가정의 회로와 안전</h3><p>가전제품은 일반적으로 병렬로 연결된다. 이 가상 실험은 220 V 실효값과 역률 1을 가정한다. 실제 교류 유효전력은 역률을 고려해야 한다. 과전류 차단기는 과부하·단락 보호, 누전차단기는 누설로 인한 전류 불균형 검출을 담당한다. 접지는 보호 도체를 통한 고장전류 경로를 마련하며 차단기와 함께 보호한다. 실제 차단 시간과 보호 성능은 제품·설치 조건에 따라 달라진다. 실험은 가상 화면에서만 한다.</p><h3>탐구 질문</h3><p>① 전압 2배일 때 전력은? ② 같은 전력을 더 오래 사용하면 에너지는? ③ 정전압과 정전류에서 저항 증가의 효과는 왜 반대인가? ④ 같은 전구의 직렬·병렬 밝기는? ⑤ 열손실이 있으면 전기 에너지와 물의 내부에너지 증가는 같은가?</p><p class="note">가상 요금은 사용 전력량×입력 단가의 단순 계산이며 누진제·기본요금·세금 등을 반영하지 않는다.</p>';
for(const id of Object.keys(units))bind(id,e=>{s[id]=+e.target.value;$(id+'out').textContent=fmt(s[id])+' '+units[id];if(id!=='speed'){if(mode==='home'){running=false;ended=false;t=0;phase=0;notice=tripped?tripReason+' · 차단기 복귀 필요':'조건 변경 · 시작을 누르세요.'}else resetRun()}dirty=true;refresh()},'input');
bind('connection',e=>{s.connection=e.target.value;resetRun();build()},'change');cc.querySelectorAll('[data-load]').forEach(e=>e.onchange=()=>{s.loads[e.dataset.load]=e.checked;running=false;ended=false;t=0;phase=0;notice=tripped?tripReason+' · 차단기 복귀 필요':'가전제품 조건 변경 · 시작을 누르세요.';dirty=true;refresh()});bind('rcd',e=>{s.rcd=e.target.checked;running=false;ended=false;t=0;notice=tripped?tripReason+' · 차단기 복귀 필요':'보호 조건 변경 · 시작을 누르세요.';dirty=true;refresh()},'change');
bind('breaker',()=>{if(homeModel(s).trip){notice='고장 조건이 남아 있어 복귀할 수 없습니다.'}else{tripped=false;tripReason='';notice='가상 차단기 복귀 · 시작을 누르세요.'}dirty=true;refresh()});
bind('doubleV',()=>{s.V=clamp(s.V*2,0,24);resetRun();build()});bind('doubleR',()=>{s.R=clamp(s.R*2,1,100);resetRun();build()});
bind('play',()=>{if(running){running=false;notice='일시정지 · 현재 측정값 유지'}else{if(mode==='home'){if(tripped){notice='먼저 고장 조건을 제거하고 차단기를 복귀하세요.';refresh();return}if(tripCheck()){dirty=true;refresh();return}}if(ended){t=0;phase=0;ended=false}running=true;notice='실험 진행 중'}dirty=true;refresh()});
bind('restart',()=>{if(mode==='home'&&tripped){t=0;phase=0;running=false;ended=false;notice=tripReason+' · 차단기 복귀 필요';dirty=true}else resetRun('처음 상태로 돌아갔습니다.');refresh()});
for(const k of ['A','B'])bind('save'+k,()=>{saved[k]={type:mode==='graphs'?graphType:lastExperiment,s:JSON.parse(JSON.stringify(s))};notice='조건 '+k+' 저장';dirty=true;refresh()});
bind('clear',()=>{saved={A:null,B:null};notice='비교 기록 삭제';dirty=true;refresh()});bind('reset',()=>{s=defaults();saved={A:null,B:null};resetRun('전체 초기화 완료');build()});bind('graphType',e=>{graphType=e.target.value;dirty=true;build()},'change');refresh();resize()}
function refresh(){let a=[],f='',hint='';$('heading').textContent=modes.find(z=>z[0]===mode)[1];
if(mode==='power'){const d=powerModel(s.V,s.R,t);a=[['전압',fmt(s.V)+' V'],['전류',fmt(d.I)+' A'],['전력',fmt(d.P)+' W'],['누적 에너지',fmt(d.E)+' J'],['시간',fmt(t)+' s']];f='P = VI = I²R = V²/R · E = Pt';hint='전력은 설정값, 에너지는 실제 경과한 가상 시간에 따른 누적값입니다.'}
if(mode==='heat'){const d=heatModel(s,t);a=[['물의 온도',fmt(d.T)+' ℃'],['가열 전력',fmt(d.P)+' W'],['공급 에너지',fmt(d.E)+' J'],['물의 내부에너지 증가',fmt(d.stored)+' J'],['주변 열손실',fmt(d.loss)+' J'],['시간',fmt(t)+' s']];f='Pt = mcΔT + Q손실';hint='물 전체의 온도가 균일하다고 가정한 열수지 모형입니다. 표시 범위에서는 끓는점에 도달하지 않습니다.'}
