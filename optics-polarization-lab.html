function rect(x,y,w,h,fill,stroke){if(fill){c.fillStyle=fill;c.fillRect(x,y,w,h)}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.strokeRect(x,y,w,h)}}

function plot(fn,xmin,xmax,ymin,ymax,xlabel,ylabel,col=MINT,markers=[]){const x=47,y=52,w=393,h=258;for(let i=0;i<=4;i++){const xx=x+w*i/4,yy=y+h*i/4;line([x,yy],[x+w,yy],'#2b4056',.8);line([xx,y],[xx,y+h],'#2b4056',.8);txt(xx,y+h+15,fmt(xmin+(xmax-xmin)*i/4,Math.abs(xmax-xmin)<10?1:0),MUTED,11,'center');txt(x-5,yy,fmt(ymax-(ymax-ymin)*i/4,ymax-ymin<=2?2:0),MUTED,10,'right')}const X=v=>x+(v-xmin)/(xmax-xmin)*w,Y=v=>y+h-(v-ymin)/(ymax-ymin)*h;line([x,y],[x,y+h],MUTED);line([x,y+h],[x+w,y+h],MUTED);c.save();c.beginPath();c.rect(x,y,w,h);c.clip();let p=[];for(let i=0;i<=600;i++){let v=xmin+(xmax-xmin)*i/600,z=fn(v);if(Number.isFinite(z))p.push([X(v),Y(z)]);else{poly(p,col,2);p=[]}}poly(p,col,2);for(const m of markers)if(m.x>=xmin&&m.x<=xmax&&Number.isFinite(m.y)){line([X(m.x),y],[X(m.x),y+h],m.color||GOLD,1,[4,4]);circ(X(m.x),Y(m.y),4,m.color||GOLD)}c.restore();txt(245,344,xlabel,MUTED,12,'center');txt(7,39,ylabel,MUTED,11)}

function interfaceRay(d,n,n1,n2){const u=unit(d),nn=unit(n);const eta=n1/n2,cos=dot(u,nn),t=sub(u,mul(nn,cos)),tt=mul(t,eta),q=1-dot(tt,tt);return q<0?null:unit(add(tt,mul(nn,Math.sqrt(Math.max(0,q)))))}

const cos2=a=>Math.cos(rad(a))**2;
function polar(i,s){if(i===0)return [.5];if(i===1)return [.5,.5*cos2(s.angle)];if(i===2)return [.5,.5*cos2(s.mid),.5*cos2(s.mid)*cos2(s.last-s.mid)];const q=s.degree/100;return [.5*(1-q)+q*cos2(s.angle)]}
const axisVec=a=>[.60*Math.sin(rad(a)),-Math.cos(rad(a))+.24*Math.sin(rad(a))];
const frontVec=a=>[Math.sin(rad(a)),-Math.cos(rad(a))];
function doubleArrow(a,b,col,w){arrow(a,b,col,w);arrow(b,a,col,w)}
function plate(x,y,a,r){const d=axisVec(a),e=axisVec(a+90),points=Array.from({length:65},(_,j)=>{const t=j/64*2*PI;return add([x,y],mul(add(mul(d,Math.cos(t)),mul(e,Math.sin(t))),r))});
 polygon(points,'#4d97c83b','#8cc5eb');
 for(let k=-.8;k<=.81;k+=.2){const h=Math.sqrt(1-k*k);line(add([x,y],mul(add(mul(e,k),mul(d,-h)),r)),add([x,y],mul(add(mul(e,k),mul(d,h)),r)),'#83b5d07b',1)}

}
function frontPlate(x,y,a,r){circ(x,y,r,'#172c42','#739cbf',1);const d=frontVec(a),e=frontVec(a+90);for(let k=-.65;k<=.66;k+=.325){const h=Math.sqrt(1-k*k);line(add([x,y],mul(add(mul(e,k),mul(d,h)),r)),add([x,y],mul(add(mul(e,k),mul(d,-h)),r)),'#6f95b6',.6)}doubleArrow(add([x,y],mul(d,-r*.85)),add([x,y],mul(d,r*.85)),GOLD,1.7)}

function polarScene(i,s,p,B){const Y=174,source=22,end=B-42,span=end-source,angles=i===0?[s.first]:i===1?[0,s.angle]:i===2?[0,s.mid,s.last]:[90+s.angle],inten=polar(i,s),offset=i===3?90:0;
 const xs=angles.map((a,j)=>source+span*(angles.length===1?.50:.27+j*(.48/(angles.length-1))));
 const phase=p*8*PI,colors=[MINT,BLUE,'#eba1f6'],amp=55,final=inten.at(-1),degree=i===3?s.degree/100:0;
 line([source,Y],[end+22,Y],'#657b91',1,[5,5]);arrow([source,58],[source+70,58],MUTED,1.2);txt(source+80,58,'빛의 진행 방향',MUTED,11);
 if(i===3){if(degree>0)waveE(source,xs[0]-14,Y,90,amp*Math.sqrt(degree),phase,BLUE);if(degree<1)randomField(source,xs[0]-18,Y,phase,amp*Math.sqrt(1-degree)*.75,'#ffe19b');txt((source+xs[0])/2,Y-87,'부분 편광 반사광',WHITE,12,'center')}
 else {randomField(source,xs[0]-18,Y,phase,amp*.88,'#ffd37c');txt((source+xs[0])/2,Y-87,'비편광',GOLD,13,'center',true)}

  if(inten[j]<1e-10){line([left,Y],[right,Y],'#5e6c7f',.8,[3,4]);if(right-left>48)txt((left+right)/2,Y-20,'차단', '#eea6a6',11,'center',true)}
  else waveE(left,right,Y,a,amp*signed,phase,colors[j]);
 }
 for(let j=0;j<angles.length;j++){const x=xs[j],aa=angles[j]-offset,show=aa+'°';plate(x,Y,angles[j],74);txt(x,Y-99,'편광판 '+(j+1),WHITE,12,'center');frontPlate(x,285,angles[j],27);txt(x,324,show,GOLD,14,'center',true)}
 const bright=final<1e-10?0:Math.round(234*Math.pow(final,.48));rect(end,Y-63,17,126,'rgb('+bright+','+bright+','+Math.round(bright*.87)+')','#99adc2');txt(end+6,Y-81,'스크린',MUTED,11,'center');txt(end-2,Y+87,fmt(final*100,1)+'%',MINT,13,'center',true);
 for(let j=0;j<inten.length;j++){const x=(xs[j]+(j+1<xs.length?xs[j+1]:end))/2;txt(x,Y+78,fmt(inten[j]*100,1)+'%',colors[j],12,'center',true);if(B>560)txt(x,Y+93,'E '+fmt(Math.sqrt(inten[j]),2),colors[j],11,'center')}
 if(i===3){const mid=source+(xs[0]-source)*.3;line([source+3,266],[Math.min(xs[0]-35,source+126),266],BLUE,3);arrow([mid-23,240],[mid,266],GOLD,1.5);arrow([mid,266],[mid+24,240],BLUE,1.5);txt(source+5,289,'수면 반사',MUTED,11)}
 txt(B/2,351,'정면 투과축(원) · 진폭 E / E₀ = √(I / I₀)',MUTED,12,'center');txt(B/2,369,'전기장 진동은 횡방향 · 파형과 속도는 교육용',MUTED,11,'center')
}
function polarGraph(i,s,p){const a=polar(i,s),v=a.at(-1);if(i===0){plot(x=>.5,0,180,0,1,'편광판 축 각도 (°)','I/I₀',MINT,[{x:s.first,y:.5}])}else if(i===1){plot(x=>.5*cos2(x),0,180,0,1,'두 편광판 사이 각도 (°)','I/I₀',MINT,[{x:s.angle,y:v}])}else if(i===2){plot(x=>.5*cos2(x)*cos2(s.last-x),0,180,0,.5,'가운데 편광판 각도 (°)','I/I₀',MINT,[{x:s.mid,y:v}])}else{plot(x=>.5*(1-s.degree/100)+s.degree/100*cos2(x),0,180,0,1,'편광판과 반사광 편광축 사이 각도 (°)','I/I₀',MINT,[{x:s.angle,y:v}])}txt(230,369,'전기장 진폭비 '+fmt(Math.sqrt(v),3)+' · 세기 '+fmt(v*100,1)+'%',MUTED,12,'center')}
function polarDraw(i,s,p){if(W<650){panels('전기장의 진동 · 입체 투영','각도와 투과 세기',()=>polarScene(i,s,p,460),()=>polarGraph(i,s,p));return}
 const w=Math.round(W*.65)-3,b=W-w-6;broadPanel(0,0,w,H,680,380,'전기장의 진동 · 입체 투영',()=>polarScene(i,s,p,680));panel(w+6,0,b,H,'각도와 투과 세기',()=>polarGraph(i,s,p))}
const ang=R('angle','편광축 사이 각도',0,180,1,45,'°');
const LAB={name:'빛의 편광',tabs:[
{name:'편광의 원리',controls:[R('first','첫 편광판 투과축',0,180,1,0,'°')],principle:'비편광 빛은 여러 방향의 전기장 진동을 가진다. 이상 선편광판을 지난 빛은 투과축 방향으로 진동하고 평균 세기는 절반이다.',observe:'편광판을 돌리고 출사 전기장의 방향을 관찰한다.',assume:'비편광은 여러 순간·표본의 방향으로 나타낸 통계적 모식도.',question:'편광판 회전에 따라 출사 세기도 변할까?'},
{name:'두 편광판',controls:[ang],principle:'말뤼스 법칙 I=Iₚcos²θ. 전기장 성분의 크기는 |cosθ|에 비례한다.',observe:'0°, 45°, 90°에서 진동 방향·진폭·스크린 밝기를 비교한다.',assume:'최초 비편광 세기 I₀, 이상적 선편광판.',question:'90°에서 전기장 진폭은 얼마인가?'},
{name:'세 편광판',controls:[R('mid','가운데 축 각도',0,180,1,45,'°'),R('last','마지막 축 각도',0,180,1,90,'°')],principle:'연속 편광판은 각 단계에서 직전 전기장을 자신의 축으로 투영한다. 세기비는 cos²의 곱이다.',observe:'가운데 판을 0°, 45°, 90°로 조절해 투과 여부를 비교한다.',assume:'다중 반사와 추가 흡수·산란은 생략.',question:'양끝이 직교할 때 45° 판을 넣으면 왜 빛이 통과하는가?'},
{name:'편광의 활용',controls:[{...ang,label:'반사광 편광축과의 각도',value:90},R('degree','반사광의 선편광 성분',0,100,5,80,'%')],principle:'수면 반사광의 수평 선편광 성분을 수직 투과축의 선글라스로 줄일 수 있다.',observe:'각도와 선편광 성분 비율을 바꾸어 눈부심에 해당하는 투과 세기를 비교한다.',assume:'수평 선편광 성분과 비편광 성분의 비간섭 혼합. 0°는 반사광 편광축에 평행.',question:'어느 각도에서 반사광 투과 세기가 최소인가?'}],
draw:polarDraw,metrics:(i,s)=>{const a=polar(i,s),v=a.at(-1),stage=a.map((v,j)=>(j+1)+'번 '+fmt(v*100,1)+'%').join(' → ');return [['입사 세기','100%'],['최종 투과 세기',fmt(v*100,1)+'%'],['전기장 실효 진폭비',fmt(Math.sqrt(v),3)],['차단 비율',fmt((1-v)*100,1)+'%'],['단계별 상대 세기',stage]]},detail:'전기장의 변화는 세기 I에 대해 실효 진폭 E∝√I로 표시한다. 비편광은 서로 다른 방향의 통계적 표본이며, 물리적으로 서로 위상이 고정된 여러 파동의 합으로 간주하지 않는다. 편광판의 정면 원에서 노란 선은 투과축이다. 90° 차단 상태는 전기장 파형을 표시하지 않는다. 광선 진행 방향과 진동 방향은 서로 수직이며 입체 투영으로 화면상 각도는 달라질 수 있다. 부분 편광 탭은 선글라스의 눈부심 감소 원리를 단순화한 것으로, 실제 반사각과 Fresnel 계수는 포함하지 않는다.'};
</script><script id="optics-engine">let W=980,H=460,tab=0,running=false,last=null;const states=LAB.tabs.map(t=>Object.fromEntries(t.controls.map(k=>[k.key,k.value]))),progress=LAB.tabs.map(()=>0);
function draw(){if(tab===LAB.tabs.length)return;c.clearRect(0,0,W,H);LAB.draw(tab,states[tab],progress[tab])}
function resize(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);c.setTransform(d,0,0,d,0,0);draw()}
function stop(){running=false;last=null}
function controls(){const root=$('controls');root.replaceChildren();const t=LAB.tabs[tab],s=states[tab];for(const k of t.controls){const row=document.createElement('div');row.className='control';const l=document.createElement('label');l.htmlFor='ctl_'+k.key;l.textContent=k.label;row.append(l);const el=document.createElement(k.options?'select':'input');el.id='ctl_'+k.key;if(k.options){for(const [v,t] of k.options){const o=document.createElement('option');o.value=v;o.textContent=t;el.append(o)}}else{el.type='range';el.min=k.min;el.max=k.max;el.step=k.step;const out=document.createElement('output');out.id='out_'+k.key;l.append(out)}el.value=s[k.key];row.append(el);root.append(row);el.addEventListener(k.options?'change':'input',()=>{s[k.key]=k.options?el.value:+el.value;refresh();draw()})}}
function refresh(){if(tab===LAB.tabs.length)return;const t=LAB.tabs[tab],s=states[tab],p=progress[tab];for(const k of t.controls){const e=$('out_'+k.key);if(e)e.textContent=s[k.key]+(k.unit?' '+k.unit:'')}const data=LAB.metrics(tab,s,p);$('metrics').replaceChildren();for(const [k,v] of data){const b=document.createElement('div');b.className='metric';const small=document.createElement('small'),strong=document.createElement('strong');small.textContent=k;strong.textContent=v;b.append(small);b.append(strong);$('metrics').append(b)}$('status').textContent=running?'진행 중 '+Math.round(p*100)+'%':p===1?'완료 · 결과 유지':p>0?'일시정지':'준비';$('play').textContent=p===1?'▶ 다시 실행':p>0?'▶ 계속':'▶ 시작';$('pause').disabled=!running}
function selectTab(i,focus=false){stop();tab=i;const n=LAB.tabs.length;document.querySelectorAll('#tabs button').forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;if(i===j&&focus)b.focus()});$('experiment').hidden=i===n;$('learn').hidden=i!==n;$(i===n?'learn':'experiment').setAttribute('aria-labelledby','tab_'+i);if(i===n)return;const t=LAB.tabs[i];$('title').textContent=t.name;$('principle').textContent=t.principle;$('observe').textContent=t.observe;$('assume').textContent=t.assume;$('question').textContent='탐구 질문 · '+t.question;$('info').textContent='표시된 수치는 이상적 모형의 계산값입니다. 전기장 진동 재생 속도는 교육용이며 실제 빛의 진동수가 아닙니다.';controls();refresh();resize()}
function boot(){document.title=LAB.name+' · 빛과 광학';$('labname').textContent=LAB.name;const learn=$('learn');const h=document.createElement('h2');h.textContent='개념 설명 · '+LAB.name;learn.append(h);for(const t of LAB.tabs){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),q=document.createElement('p'),r=document.createElement('p');h.textContent=t.name;p.textContent=t.principle;q.textContent=t.observe;r.textContent='가정 및 한계: '+t.assume;a.append(h);a.append(p);a.append(q);a.append(r);learn.append(a)}const note=document.createElement('p');note.textContent=LAB.detail;learn.append(note);[...LAB.tabs.map(t=>t.name),'개념 설명'].forEach((name,i)=>{const b=document.createElement('button');b.id='tab_'+i;b.textContent=name;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-controls',i===LAB.tabs.length?'learn':'experiment');b.onclick=()=>selectTab(i);b.onkeydown=e=>{const n=LAB.tabs.length+1;if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectTab(e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:n-1))%n,true)}};$('tabs').append(b)});$('play').onclick=()=>{if(tab===LAB.tabs.length)return;if(progress[tab]===1)progress[tab]=0;running=true;last=null;refresh();draw()};$('pause').onclick=()=>{stop();refresh()};$('reset').onclick=()=>{stop();progress[tab]=0;states[tab]=Object.fromEntries(LAB.tabs[tab].controls.map(k=>[k.key,k.value]));controls();refresh();draw()};if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(cv);else window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=null);selectTab(0);requestAnimationFrame(frame)}
let lastUI=0;function frame(now){if(running&&tab!==LAB.tabs.length){const dt=last===null?0:Math.min(.05,Math.max(0,(now-last)/1000));last=now;progress[tab]=Math.min(1,progress[tab]+dt/4);if(progress[tab]===1)stop();draw();if(!running||now-lastUI>120){refresh();lastUI=now}}requestAnimationFrame(frame)}
boot();</script></body></html>
