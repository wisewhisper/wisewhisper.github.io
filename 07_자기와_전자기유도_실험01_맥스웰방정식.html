<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="네 개의 맥스웰 방정식을 직접 조작하며 전자기장을 탐구하는 고등학교 심화 실험실">
  <title>맥스웰 방정식 실험실</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071325'/%3E%3Cpath d='M10 35c9-20 17 20 26 0s15 9 18-7' fill='none' stroke='%2339d9ff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='15' cy='22' r='5' fill='%23ffcc66'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#050b17;--panel:#0b1729;--panel2:#10233c;--line:#244565;--text:#eef7ff;--muted:#a8bfd5;--cyan:#38d9ff;--blue:#6b8cff;--amber:#ffca63;--red:#ff657a;--green:#63e6be;--shadow:0 16px 50px #0008}
    *{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% -10%,#15385a 0,transparent 34%),radial-gradient(circle at 100% 10%,#25245b 0,transparent 28%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
    button,input,select{font:inherit}button{color:inherit}.shell{width:min(1500px,100%);margin:auto;padding:18px clamp(12px,2vw,28px) 48px}
    header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:16px}.brand{display:flex;gap:13px;align-items:center}.brandmark{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#173d67,#0a1628);border:1px solid #4d7898;display:grid;place-items:center;box-shadow:0 0 28px #38d9ff33}.brandmark svg{width:32px}.brand h1{font-size:clamp(1.2rem,2.5vw,1.85rem);margin:0;letter-spacing:-.04em}.brand p{margin:1px 0 0;color:var(--muted);font-size:.88rem}.equation-pill{border:1px solid #34597a;background:#071322cc;padding:8px 12px;border-radius:12px;color:#c9eaff;font-family:Georgia,serif;white-space:nowrap}
    .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#0a1626;padding:11px 8px;border-radius:12px;cursor:pointer;text-align:left;transition:.2s}.tab span{display:block;color:var(--muted);font-size:.78rem}.tab strong{font-size:.92rem}.tab.active{background:linear-gradient(135deg,#143656,#10284b);border-color:var(--cyan);box-shadow:0 0 0 1px #38d9ff33 inset}.tab:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
    .workspace{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.75fr);gap:12px}.stage-card,.side-card{background:linear-gradient(145deg,#0c192b,#07111f);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stage-card{overflow:hidden}.stage-head{min-height:73px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.stage-title h2{font-size:1.06rem;margin:0}.stage-title p{font-size:.84rem;color:var(--muted);margin:3px 0 0}.formula{font-family:Georgia,"Times New Roman",serif;color:var(--cyan);font-size:clamp(.9rem,2vw,1.15rem);text-align:right}.canvas-wrap{position:relative;min-height:480px;background:radial-gradient(circle at 50% 45%,#0d2541,#050b14 72%);touch-action:pan-y}.canvas-wrap canvas{display:block;width:100%;height:480px}.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;padding:6px 9px;border-radius:10px;background:#030812aa;backdrop-filter:blur(6px);font-size:.76rem;color:#c7d7e5}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.live-badge{position:absolute;right:12px;top:10px;padding:5px 9px;border:1px solid #31577a;border-radius:999px;background:#071322cc;font-size:.75rem;color:var(--muted)}.live-badge.running{color:var(--green);border-color:#318e76}
    .transport{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#07111e}.btn{border:1px solid #315474;background:#10243c;border-radius:10px;padding:9px 12px;min-height:44px;cursor:pointer}.btn:hover{border-color:var(--cyan)}.btn.primary{background:linear-gradient(135deg,#116b8d,#324fba);border-color:#54dfff}.btn.record{margin-left:auto;color:var(--amber)}
    .sidebar{display:flex;flex-direction:column;gap:12px}.side-card{padding:14px}.side-card h3{font-size:.93rem;margin:0 0 10px}.control{margin:0 0 12px}.control:last-child{margin-bottom:0}.control-top{display:flex;justify-content:space-between;gap:8px;font-size:.83rem}.value{color:var(--cyan);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--cyan);min-height:44px}.results{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result{border:1px solid #23445f;background:#071525;border-radius:11px;padding:9px}.result small{display:block;color:var(--muted);font-size:.72rem}.result b{font-size:.94rem;color:#f4fbff;font-variant-numeric:tabular-nums}.result.wide{grid-column:1/-1}.concept{border-left:3px solid var(--amber);background:#211b1022}.concept p{margin:0;color:#dce9f5;font-size:.86rem}.mission{display:flex;gap:9px;align-items:flex-start}.mission-icon{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:#1d3450;color:var(--amber)}.mission p{margin:0;font-size:.84rem;color:#c4d5e4}.mission-status{margin-top:8px;font-size:.8rem;color:var(--muted)}.mission-status.ok{color:var(--green)}
    .lower{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.graph-card,.notes-card{background:#081525;border:1px solid var(--line);border-radius:16px;padding:13px}.graph-card h3,.notes-card h3{font-size:.92rem;margin:0 0 8px}.graph-card canvas{width:100%;height:155px;display:block;background:#050d18;border-radius:10px}.notes-card p{font-size:.84rem;color:var(--muted);margin:0 0 8px}.note-row{display:flex;gap:6px}.note-row input{min-width:0;flex:1;border:1px solid #31506c;background:#07111f;color:var(--text);border-radius:9px;padding:8px}.log{margin-top:9px;max-height:90px;overflow:auto;font-size:.75rem}.log div{padding:5px 2px;border-top:1px solid #1b344d}.empty{color:#6f8ca6}.advanced{margin-top:12px}.advanced summary{cursor:pointer;color:#bdd3e6;font-size:.86rem}.equations{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.eq{padding:8px;background:#07111f;border:1px solid #1e3a55;border-radius:9px;font-family:Georgia,serif;font-size:.85rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1100px){.tabs{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:920px){.workspace{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.canvas-wrap,.canvas-wrap canvas{height:420px;min-height:420px}.lower{grid-template-columns:1fr}.equation-pill{display:none}}
    @media(max-width:640px){.shell{padding:10px 8px 32px}.brand p{display:none}.tabs{grid-template-columns:1fr 1fr}.tab{padding:9px}.stage-head{align-items:flex-start}.formula{font-size:.83rem;max-width:46%}.canvas-wrap,.canvas-wrap canvas{height:360px;min-height:360px}.sidebar{display:flex}.transport{position:sticky;bottom:0;z-index:4}.transport .btn{flex:1 1 calc(50% - 8px)}.btn{padding:10px}.btn.record{margin-left:0}.results{grid-template-columns:1fr 1fr}.lower{margin-top:8px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.brandmark{box-shadow:none}}
  </style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><div class="brandmark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M5 35c10-22 18 22 28 0s17 9 25-8" fill="none" stroke="#38d9ff" stroke-width="5" stroke-linecap="round"/><circle cx="13" cy="19" r="5" fill="#ffca63"/></svg></div><div><h1>맥스웰 방정식 실험실</h1><p>전기와 자기가 하나의 파동이 되는 네 가지 법칙</p></div></div>
    <div class="equation-pill">∇·E &nbsp; ∇·B &nbsp; ∇×E &nbsp; ∇×B</div>
  </header>

  <nav class="tabs" aria-label="실험 선택" role="tablist">
    <button class="tab active" role="tab" aria-selected="true" data-mode="electric"><span>실험 01</span><strong>전기 가우스 법칙</strong></button>
    <button class="tab" role="tab" aria-selected="false" data-mode="magnetic"><span>실험 02</span><strong>자기 가우스 법칙</strong></button>
    <button class="tab" role="tab" aria-selected="false" data-mode="faraday"><span>실험 03</span><strong>패러데이 법칙</strong></button>
    <button class="tab" role="tab" aria-selected="false" data-mode="ampere"><span>실험 04</span><strong>앙페르–맥스웰 법칙</strong></button>
    <button class="tab" role="tab" aria-selected="false" data-mode="wave"><span>통합 실험</span><strong>전자기파</strong></button>
  </nav>

  <section class="workspace" id="labPanel" role="tabpanel">
    <div class="stage-card">
      <div class="stage-head"><div class="stage-title"><h2 id="moduleTitle"></h2><p id="moduleSubtitle"></p></div><div class="formula" id="moduleFormula"></div></div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="fieldCanvas" aria-label="전자기장 시뮬레이션"></canvas>
        <div class="live-badge" id="liveBadge">● 일시정지</div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="transport">
        <button class="btn primary" id="playBtn">▶ 시작</button><button class="btn" id="stepBtn">한 단계</button><button class="btn" id="resetBtn">↺ 초기화</button><button class="btn record" id="recordBtn">＋ 측정 기록</button>
      </div>
    </div>

    <aside class="sidebar">
      <section class="side-card"><h3>실험 변수</h3><div id="controls"></div></section>
      <section class="side-card"><h3>실시간 측정</h3><div class="results" id="results"></div></section>
      <section class="side-card concept"><h3>해석</h3><p id="explanation"></p></section>
      <section class="side-card"><div class="mission"><div class="mission-icon">◆</div><div><h3>탐구 미션</h3><p id="missionText"></p><div class="mission-status" id="missionStatus" aria-live="polite">조건을 바꾸어 확인해 보세요.</div></div></div></section>
    </aside>
  </section>

  <section class="lower">
    <div class="graph-card"><h3 id="graphTitle">시간에 따른 변화</h3><canvas id="graphCanvas" aria-label="측정값 그래프"></canvas></div>
    <div class="notes-card"><h3>관찰 기록</h3><p>현재 측정값과 함께 남길 메모를 입력하세요.</p><div class="note-row"><label class="sr-only" for="noteInput">관찰 메모</label><input id="noteInput" maxlength="80" placeholder="예: 주파수를 높이면 기전력이 커진다"><button class="btn" id="noteBtn">저장</button></div><div class="log" id="log"><div class="empty">아직 기록이 없습니다.</div></div>
      <details class="advanced"><summary>네 방정식을 한눈에 보기</summary><div class="equations"><div class="eq">∮ E·dA = Q<sub>in</sub>/ε₀</div><div class="eq">∮ B·dA = 0</div><div class="eq">∮ E·dl = −dΦ<sub>B</sub>/dt</div><div class="eq">∮ B·dl = μ₀(I+ε₀dΦ<sub>E</sub>/dt)</div></div></details>
    </div>
  </section>
</main>
<script>
(()=>{'use strict';
const EPS0=8.8541878128e-12,MU0=1.25663706212e-6;
const field=document.getElementById('fieldCanvas'),graph=document.getElementById('graphCanvas');
const fctx=field.getContext('2d'),gctx=graph.getContext('2d');
const $=id=>document.getElementById(id);
const ui={title:$('moduleTitle'),subtitle:$('moduleSubtitle'),formula:$('moduleFormula'),legend:$('legend'),controls:$('controls'),results:$('results'),explanation:$('explanation'),mission:$('missionText'),missionStatus:$('missionStatus'),graphTitle:$('graphTitle'),badge:$('liveBadge'),play:$('playBtn'),log:$('log')};
const modules={
 electric:{title:'전기장에 대한 가우스 법칙',subtitle:'가우스 구면의 단면을 움직이는 전하와 전기선속',formula:'∮ E·dA = Qᵢₙ / ε₀',legend:[['#ffca63','전기장'],['#38d9ff','가우스면'],['#ff657a','양전하']],controls:[['charge','전하량 Q','-5','5','0.5','2',' μC'],['radius','가우스면 반지름 R','55','155','1','108',' px'],['offset','전하의 중심 거리 x','-170','170','1','0',' px']],mission:'전하를 가우스면 밖으로 옮겨 전체 전기선속이 0이 되는 순간을 찾으세요.',graph:'전기선속 ΦE',explain:'닫힌 면을 통과하는 전체 전기선속은 면의 크기나 모양이 아니라 내부의 알짜 전하로만 결정됩니다.'},
 magnetic:{title:'자기장에 대한 가우스 법칙',subtitle:'막대자석을 둘러싼 닫힌 면의 들어오는 선속과 나가는 선속',formula:'∮ B·dA = 0',legend:[['#ff657a','N극'],['#6b8cff','S극'],['#63e6be','자기력선']],controls:[['strength','자석 세기','0.3','2','0.1','1',' 배'],['radius','가우스면 반지름','75','165','1','125',' px'],['offset','자석의 중심 거리','-100','100','1','0',' px']],mission:'자석의 위치와 가우스면 크기를 바꾸어도 알짜 자기선속이 0인지 확인하세요.',graph:'들어오는/나가는 자기선속',explain:'자기력선은 N극에서 나와 S극으로 들어가는 닫힌 고리를 이룹니다. 고립된 자기 홀극이 없으므로 닫힌 면의 알짜 자기선속은 0입니다.'},
 faraday:{title:'패러데이 전자기 유도 법칙',subtitle:'변화하는 자기선속이 만드는 유도 기전력과 전류',formula:'ℰ = −N dΦB/dt',legend:[['#38d9ff','자기선속'],['#ffca63','유도전류'],['#ff657a','기전력']],controls:[['b0','자기장 최댓값 B₀','0.1','1.2','0.05','0.6',' T'],['freq','진동수 f','0.2','4','0.1','1',' Hz'],['area','코일 면적 A','0.02','0.2','0.01','0.08',' m²'],['turns','감은 수 N','1','20','1','8',' 회']],mission:'진동수를 3 Hz 이상으로 높여 유도 기전력의 최댓값이 어떻게 달라지는지 확인하세요.',graph:'자기선속과 유도 기전력',explain:'유도 기전력의 방향은 자기선속의 변화를 방해합니다. 이것이 식의 마이너스 부호, 즉 렌츠 법칙의 뜻입니다.'},
 ampere:{title:'앙페르–맥스웰 법칙',subtitle:'충전 중인 축전기 사이에서 이어지는 자기장',formula:'∮ B·dl = μ₀(I + ε₀ dΦE/dt)',legend:[['#38d9ff','전기장'],['#ffca63','자기장'],['#ff657a','전류/변위전류']],controls:[['v0','전압 최댓값 V₀','10','200','5','100',' V'],['freq','진동수 f','0.2','5','0.1','1.5',' Hz'],['plate','극판 반지름 a','0.03','0.12','0.005','0.07',' m'],['gap','극판 간격 d','0.002','0.02','0.001','0.008',' m'],['loop','앙페르 고리 반지름 r','0.01','0.18','0.005','0.10',' m']],mission:'앙페르 고리를 극판 안쪽과 바깥쪽으로 바꾸며 포함된 변위전류를 비교하세요.',graph:'변위전류와 자기장',explain:'이상적 평행판 축전기에서 전하가 틈을 건너지는 않습니다. 변화하는 전기선속의 항이 변위전류 역할을 하여 자기장을 연속적으로 만듭니다.'},
 wave:{title:'전자기파 통합 실험',subtitle:'서로 수직인 전기장과 자기장이 진공을 따라 전파되는 모습',formula:'c = 1/√(μ₀ε₀),  E₀ = cB₀',legend:[['#38d9ff','전기장 E'],['#ffca63','자기장 B'],['#ff657a','진행 방향 E×B']],controls:[['freqMHz','진동수 f','50','500','10','150',' MHz'],['e0','전기장 진폭 E₀','5','100','5','40',' V/m'],['phaseSpeed','화면 재생 속도','0.2','2','0.1','1',' 배']],mission:'진동수를 300 MHz로 맞추어 파장이 약 1 m가 되는지 확인하세요.',graph:'한 지점의 E와 B(각각 정규화)',explain:'진공 평면파에서 E와 B는 서로 수직이고 같은 위상입니다. 화면에서는 두 장을 보기 좋게 각각 정규화했으며 실제 크기는 E₀/B₀=c를 만족합니다.'}
};
let mode='electric',running=false,time=0,last=performance.now(),values={},history=[],records=[],interacted=false,touchedKey='';
function resize(){const dpr=Math.min(devicePixelRatio||1,2);for(const c of [field,graph]){const r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}draw()}
function initMode(name){mode=name;time=0;history=[];values={};interacted=false;touchedKey='';const m=modules[mode];ui.title.textContent=m.title;ui.subtitle.textContent=m.subtitle;ui.formula.textContent=m.formula;ui.explanation.textContent=m.explain;ui.mission.textContent=m.mission;ui.graphTitle.textContent=m.graph+' · 모양과 위상 비교용 자동 정규화';ui.legend.innerHTML=m.legend.map(x=>`<span><i class="dot" style="background:${x[0]}"></i>${x[1]}</span>`).join('');ui.controls.innerHTML='';m.controls.forEach(([key,label,min,max,step,val,unit])=>{values[key]=+val;const wrap=document.createElement('div');wrap.className='control';wrap.innerHTML=`<div class="control-top"><label for="c_${key}">${label}</label><span class="value" id="v_${key}">${format(+val)}${unit}</span></div><input id="c_${key}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-key="${key}" data-unit="${unit}">`;ui.controls.appendChild(wrap)});ui.controls.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{interacted=true;touchedKey=el.dataset.key;values[touchedKey]=+el.value;$('v_'+touchedKey).textContent=format(+el.value)+el.dataset.unit;draw()}));document.querySelectorAll('.tab').forEach(t=>{const a=t.dataset.mode===mode;t.classList.toggle('active',a);t.setAttribute('aria-selected',a);t.setAttribute('aria-controls','labPanel')});draw()}
function format(n,d=3){if(!Number.isFinite(n))return '—';const a=Math.abs(n);if((a>0&&a<.001)||a>=1e4)return n.toExponential(2);return (+n.toFixed(d)).toLocaleString('ko-KR')}
function measure(){let data={};if(mode==='electric'){const delta=Math.abs(values.offset)-values.radius,boundary=Math.abs(delta)<0.5,inside=delta<0,Q=values.charge*1e-6;data={inside,boundary,flux:boundary?NaN:(inside?Q/EPS0:0),qin:boundary?NaN:(inside?Q:0)};}
else if(mode==='magnetic'){const scale=values.strength*(.7+.3*Math.min(1,values.radius/130))*(1-.25*Math.min(1,Math.abs(values.offset)/120));data={out:scale,inward:-scale,net:0};}
else if(mode==='faraday'){const om=2*Math.PI*values.freq,B=values.b0*Math.sin(om*time),single=values.area*B,emf=-values.turns*values.area*values.b0*om*Math.cos(om*time);data={B,flux:single,link:values.turns*single,emf};}
else if(mode==='ampere'){const om=2*Math.PI*values.freq,E=values.v0/values.gap*Math.sin(om*time),dEdt=values.v0/values.gap*om*Math.cos(om*time),A=Math.PI*values.plate**2,Id=EPS0*A*dEdt,r=values.loop,a=values.plate,Ienc=Id*Math.min(1,r*r/(a*a)),B=MU0*Ienc/(2*Math.PI*r);data={E,Id,Ienc,B,inside:r<a};}
else{const c=1/Math.sqrt(EPS0*MU0),f=values.freqMHz*1e6,lambda=c/f,phase=2*Math.PI*f*(time*values.phaseSpeed/1e8),E=values.e0*Math.sin(phase),B=E/c;data={c,f,lambda,E,B,b0:values.e0/c};}return data}
function renderResults(d){let arr=[];if(mode==='electric')arr=[['포함 전하',d.boundary?'정의 보류':format(d.qin*1e6)+' μC'],['전기선속 ΦE',d.boundary?'정의 보류':format(d.flux)+' N·m²/C'],['판정',d.boundary?'점전하가 면 위에 있음—조금 이동하세요':d.inside?'전하가 면 안에 있음':'전하가 면 밖에 있음','wide']];
if(mode==='magnetic')arr=[['나가는 선속',format(d.out)+' 상대값'],['들어오는 선속',format(d.inward)+' 상대값'],['알짜 선속',format(d.net)+' 상대값','wide']];
if(mode==='faraday')arr=[['자기장 B',format(d.B)+' T'],['코일 1회의 선속',format(d.flux)+' Wb'],['선속 결합 NΦ',format(d.link)+' Wb·turn'],['유도 기전력 ℰ',format(d.emf)+' V']];
if(mode==='ampere')arr=[['전기장 E',format(d.E)+' V/m'],['전체 변위전류',format(d.Id)+' A'],['고리 내부 전류',format(d.Ienc)+' A'],['고리 위 자기장',format(d.B)+' T']];
if(mode==='wave')arr=[['빛의 속력 c',format(d.c)+' m/s'],['파장 λ',format(d.lambda)+' m'],['현재 전기장 E',format(d.E)+' V/m'],['자기장 진폭 B₀',format(d.b0*1e9)+' nT']];ui.results.innerHTML=arr.map(x=>`<div class="result ${x[2]||''}"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');let ok=mode==='electric'?touchedKey==='offset'&&!d.inside&&!d.boundary:mode==='magnetic'?interacted&&Math.abs(d.net)<1e-20:mode==='faraday'?touchedKey==='freq'&&values.freq>=3:mode==='ampere'?touchedKey==='loop'&&values.loop>values.plate:touchedKey==='freqMHz'&&Math.abs(d.lambda-1)<.04;ui.missionStatus.textContent=ok?'✓ 미션 조건을 확인했습니다!':d.boundary?'경계에서는 이상적 적분을 적용할 수 없습니다.':'조건을 바꾸어 확인해 보세요.';ui.missionStatus.classList.toggle('ok',ok);field.setAttribute('aria-label',`${modules[mode].title}. ${arr.map(x=>x[0]+' '+x[1]).join(', ')}`)}
function clear(ctx,w,h){ctx.clearRect(0,0,w,h)}function line(ctx,x1,y1,x2,y2,color,width=1,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function arrow(ctx,x,y,dx,dy,color,alpha=.8){const len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,L=Math.min(18,Math.max(6,len));line(ctx,x,y,x+ux*L,y+uy*L,color,1.4,alpha);ctx.save();ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.translate(x+ux*L,y+uy*L);ctx.rotate(Math.atan2(uy,ux));ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-5,-3);ctx.lineTo(-5,3);ctx.fill();ctx.restore()}
function drawGrid(w,h){fctx.save();fctx.strokeStyle='#24415a';fctx.globalAlpha=.25;fctx.lineWidth=1;for(let x=20;x<w;x+=32)line(fctx,x,0,x,h,'#24415a',1,.25);for(let y=20;y<h;y+=32)line(fctx,0,y,w,y,'#24415a',1,.25);fctx.restore()}
function drawElectric(w,h,d){const cx=w/2,cy=h/2,qx=cx+values.offset,R=values.radius,qScale=Math.abs(values.charge)/5;if(qScale>0){for(let y=38;y<h-25;y+=42)for(let x=30;x<w-25;x+=42){const dx=x-qx,dy=y-cy,r2=dx*dx+dy*dy+200,sign=Math.sign(values.charge),mag=Math.min(22,15000/r2)*qScale;arrow(fctx,x,y,sign*dx*mag,sign*dy*mag,'#ffca63',.18+.72*qScale)}fctx.fillStyle=values.charge>0?'#ff657a':'#6b8cff';fctx.shadowColor=fctx.fillStyle;fctx.shadowBlur=22;fctx.beginPath();fctx.arc(qx,cy,13,0,Math.PI*2);fctx.fill();fctx.shadowBlur=0;fctx.fillStyle='#fff';fctx.font='bold 18px system-ui';fctx.textAlign='center';fctx.textBaseline='middle';fctx.fillText(values.charge>0?'+':'−',qx,cy)}else{fctx.strokeStyle='#8ba0b3';fctx.lineWidth=2;fctx.beginPath();fctx.arc(qx,cy,10,0,Math.PI*2);fctx.stroke();label('Q = 0',qx,cy-20,'#b8c6d2')}fctx.strokeStyle=d.boundary?'#ff657a':'#38d9ff';fctx.lineWidth=3;fctx.setLineDash([9,7]);fctx.beginPath();fctx.arc(cx,cy,R,0,Math.PI*2);fctx.stroke();fctx.setLineDash([]);label('3차원 가우스 구면의 단면',cx,cy-R-13,'#75e6ff');label(d.boundary?'경계 상태':d.inside?'Qin = Q':'Qin = 0',cx,cy+R+20,d.boundary?'#ff9aaa':d.inside?'#63e6be':'#ffca63')}
function dipoleField(x,y,cx,cy,s){const dx=(x-cx)/55,dy=(y-cy)/55,r2=dx*dx+dy*dy+.32,r=Math.sqrt(r2),mx=s;return {x:(3*dx*(mx*dx)/r2-mx)/(r2*r),y:3*dy*(mx*dx)/(r2*r)}}
function drawMagnetic(w,h,d){const cx=w/2,cy=h/2,mx=cx+values.offset,R=values.radius;for(let y=35;y<h-25;y+=38)for(let x=28;x<w-20;x+=38){const b=dipoleField(x,y,mx,cy,values.strength),m=15/Math.max(.4,Math.hypot(b.x,b.y));arrow(fctx,x,y,b.x*m,b.y*m,'#63e6be',.6)}fctx.strokeStyle='#38d9ff';fctx.lineWidth=3;fctx.setLineDash([9,7]);fctx.beginPath();fctx.arc(cx,cy,R,0,Math.PI*2);fctx.stroke();fctx.setLineDash([]);const L=94,H=34;fctx.fillStyle='#ff657a';fctx.fillRect(mx-L/2,cy-H/2,L/2,H);fctx.fillStyle='#6b8cff';fctx.fillRect(mx,cy-H/2,L/2,H);fctx.fillStyle='#fff';fctx.font='bold 16px system-ui';fctx.textAlign='center';fctx.fillText('N',mx-L/4,cy+6);fctx.fillText('S',mx+L/4,cy+6);label('나감 + 들어옴 = 0',cx,cy+R+20,'#63e6be')}
function drawFaraday(w,h,d){const cx=w/2,cy=h/2+10,rx=Math.min(150,w*.25),ry=72,phase=Math.sin(2*Math.PI*values.freq*time);fctx.save();fctx.translate(cx,cy);fctx.strokeStyle='#ffca63';fctx.lineWidth=5;for(let i=0;i<Math.min(values.turns,12);i++){fctx.beginPath();fctx.ellipse(0,i*3-18,rx,ry,0,0,Math.PI*2);fctx.stroke()}fctx.restore();const count=Math.round(5+Math.abs(d.B/values.b0)*10);for(let i=0;i<count;i++){const x=cx-rx*.72+(i%(Math.ceil(count/2)))*(rx*1.44/Math.max(1,Math.ceil(count/2)-1));const top=cy-125,bottom=cy+125;line(fctx,x,top,x,bottom,'#38d9ff',2,.35+.5*Math.abs(phase));arrow(fctx,x,phase>=0?cy-10:cy+10,0,phase>=0?18:-18,'#38d9ff',.9)}const dir=d.emf>=0?'↺':'↻';fctx.fillStyle='#ff657a';fctx.font=`bold ${44+Math.abs(d.emf)*.35}px system-ui`;fctx.textAlign='center';fctx.fillText(dir,cx,cy+15);label(`B = ${format(d.B)} T`,cx,48,'#75e6ff');label(`ℰ = ${format(d.emf)} V`,cx,h-28,'#ff9aaa')}
function drawAmpere(w,h,d){const cx=w/2,cy=h/2,gapPx=Math.max(32,values.gap*3300),platePx=values.plate*1500,loopPx=Math.min(180,values.loop*850);fctx.strokeStyle='#c4d5e4';fctx.lineWidth=8;line(fctx,cx-platePx,cy-gapPx/2,cx+platePx,cy-gapPx/2,'#d7e5ef',8);line(fctx,cx-platePx,cy+gapPx/2,cx+platePx,cy+gapPx/2,'#d7e5ef',8);const sign=Math.sin(2*Math.PI*values.freq*time);fctx.fillStyle=sign>=0?'#ff657a':'#6b8cff';for(let i=-4;i<=4;i++)fctx.beginPath(),fctx.arc(cx+i*platePx/5,cy-gapPx/2-14,4,0,7),fctx.fill();fctx.fillStyle=sign>=0?'#6b8cff':'#ff657a';for(let i=-4;i<=4;i++)fctx.beginPath(),fctx.arc(cx+i*platePx/5,cy+gapPx/2+14,4,0,7),fctx.fill();for(let x=cx-platePx*.85;x<=cx+platePx*.85;x+=28)arrow(fctx,x,cy-gapPx/2+8,0,sign>=0?gapPx-16:-(gapPx-16),'#38d9ff',.75);fctx.strokeStyle='#ffca63';fctx.lineWidth=3;fctx.setLineDash([8,6]);fctx.beginPath();fctx.ellipse(cx,cy,loopPx,loopPx*.5,0,0,Math.PI*2);fctx.stroke();fctx.setLineDash([]);const a=time*2*(d.Id>=0?1:-1);const ax=cx+loopPx*Math.cos(a),ay=cy+loopPx*.5*Math.sin(a);arrow(fctx,ax,ay,-Math.sin(a)*20,Math.cos(a)*10,'#ffca63',1);label('변위전류 Id',cx,cy-5,'#ff9aaa');label(d.inside?'고리가 극판 내부':'고리가 극판 전체를 포함',cx,cy+loopPx*.5+30,'#63e6be')}
function drawWave(w,h,d){const mid=h/2,left=42,right=w-28,amp=Math.min(95,h*.25),cycles=Math.max(1.2,Math.min(6,w/d.lambda/150)),phase=2*Math.PI*values.freqMHz*1e6*time*values.phaseSpeed/1e8;line(fctx,left,mid,right,mid,'#6c8295',1,.7);arrow(fctx,right-35,mid,26,0,'#ff657a',1);label('진행 방향 E×B',right-95,mid-22,'#ff9aaa');fctx.strokeStyle='#38d9ff';fctx.lineWidth=3;fctx.beginPath();for(let x=left;x<=right;x+=3){const p=(x-left)/(right-left),y=mid-Math.sin(p*Math.PI*2*cycles-phase)*amp;x===left?fctx.moveTo(x,y):fctx.lineTo(x,y)}fctx.stroke();fctx.strokeStyle='#ffca63';fctx.lineWidth=3;fctx.setLineDash([6,5]);fctx.beginPath();for(let x=left;x<=right;x+=3){const p=(x-left)/(right-left),y=mid-Math.sin(p*Math.PI*2*cycles-phase)*amp*.72;x===left?fctx.moveTo(x,y):fctx.lineTo(x,y)}fctx.stroke();fctx.setLineDash([]);label('E : 화면 위·아래',left+75,mid-amp-22,'#38d9ff');label('B : 화면 앞·뒤(같은 위상·독립 정규화)',left+145,mid+amp+35,'#ffca63');for(let x=left+30;x<right;x+=75){const p=(x-left)/(right-left),s=Math.sin(p*Math.PI*2*cycles-phase);fctx.fillStyle=s>=0?'#ffca63':'#c48cff';fctx.font='bold 18px system-ui';fctx.textAlign='center';fctx.fillText(s>=0?'•':'×',x,mid+Math.abs(s)*amp*.7)}label(`λ = ${format(d.lambda)} m`,w/2,h-27,'#63e6be')}
function label(t,x,y,color){fctx.save();fctx.font='600 14px system-ui';fctx.textAlign='center';fctx.fillStyle='#030812bb';const m=fctx.measureText(t).width;fctx.fillRect(x-m/2-7,y-14,m+14,22);fctx.fillStyle=color;fctx.fillText(t,x,y+2);fctx.restore()}
function drawGraph(d){const w=graph.clientWidth,h=graph.clientHeight;clear(gctx,w,h);gctx.fillStyle='#07111c';gctx.fillRect(0,0,w,h);for(let i=1;i<4;i++)line(gctx,0,h*i/4,w,h*i/4,'#29465f',1,.5);line(gctx,0,h/2,w,h/2,'#58728a',1,.7);let a=0,b=0;if(mode==='electric'){a=d.boundary?0:d.flux;b=d.boundary?0:values.charge/EPS0}else if(mode==='magnetic'){a=d.out;b=d.inward}else if(mode==='faraday'){a=d.link;b=d.emf}else if(mode==='ampere'){a=d.Id;b=d.B*1e6}else{a=d.E/values.e0;b=d.B/d.b0}if(!Number.isFinite(a))a=0;if(!Number.isFinite(b))b=0;history.push([a,b]);if(history.length>180)history.shift();let max=1e-20;history.forEach(p=>max=Math.max(max,Math.abs(p[0]),Math.abs(p[1])));[['#38d9ff',0],['#ff657a',1]].forEach(([c,k])=>{gctx.strokeStyle=c;gctx.lineWidth=2;gctx.beginPath();history.forEach((p,i)=>{const x=i/179*w,y=h/2-p[k]/max*(h*.42);i?gctx.lineTo(x,y):gctx.moveTo(x,y)});gctx.stroke()});gctx.font='12px system-ui';gctx.fillStyle='#38d9ff';gctx.fillText(mode==='faraday'?'선속 결합':mode==='ampere'?'변위전류':mode==='wave'?'E/E₀':'값 1',8,16);gctx.fillStyle='#ff657a';gctx.fillText(mode==='faraday'?'유도 기전력':mode==='ampere'?'자기장(μT)':mode==='wave'?'B/B₀':'값 2',90,16)}
function draw(){const w=field.clientWidth,h=field.clientHeight;clear(fctx,w,h);drawGrid(w,h);const d=measure();if(mode==='electric')drawElectric(w,h,d);if(mode==='magnetic')drawMagnetic(w,h,d);if(mode==='faraday')drawFaraday(w,h,d);if(mode==='ampere')drawAmpere(w,h,d);if(mode==='wave')drawWave(w,h,d);renderResults(d);drawGraph(d)}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running){time+=dt;draw()}requestAnimationFrame(loop)}
function snapshot(note=''){const d=measure(),stamp=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});let summary=mode==='electric'?(d.boundary?'경계 상태':`ΦE ${format(d.flux)} N·m²/C`):mode==='magnetic'?`알짜 선속 ${format(d.net)} 상대값`:mode==='faraday'?`ℰ ${format(d.emf)} V`:mode==='ampere'?`Id ${format(d.Id)} A`:`λ ${format(d.lambda)} m`;records.unshift(`${stamp} · ${modules[mode].title} · ${summary}${note?' · '+note:''}`);records=records.slice(0,8);ui.log.innerHTML=records.map(x=>`<div>${escapeHtml(x)}</div>`).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>initMode(t.dataset.mode)));ui.play.addEventListener('click',()=>{running=!running;ui.play.textContent=running?'❚❚ 일시정지':'▶ 시작';ui.badge.textContent=running?'● 실행 중':'● 일시정지';ui.badge.classList.toggle('running',running)});$('stepBtn').addEventListener('click',()=>{running=false;time+=1/30;ui.play.textContent='▶ 시작';ui.badge.textContent='● 일시정지';ui.badge.classList.remove('running');draw()});$('resetBtn').addEventListener('click',()=>{running=false;ui.play.textContent='▶ 시작';ui.badge.textContent='● 일시정지';ui.badge.classList.remove('running');initMode(mode)});$('recordBtn').addEventListener('click',()=>snapshot());$('noteBtn').addEventListener('click',()=>{const i=$('noteInput');if(i.value.trim()){snapshot(i.value.trim());i.value=''}});$('noteInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('noteBtn').click()});window.addEventListener('resize',resize,{passive:true});initMode(mode);resize();requestAnimationFrame(loop);
})();
</script>
