const $=id=>document.getElementById(id),cv=$('cv'),c=cv.getContext('2d'),PI=Math.PI,rad=x=>x*PI/180,deg=x=>x*180/PI,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,d=2)=>Number.isFinite(x)?Number(x).toFixed(d):'∞',norm=v=>Math.hypot(...v),dot=(a,b)=>a[0]*b[0]+a[1]*b[1],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],mul=(v,k)=>[v[0]*k,v[1]*k],unit=v=>mul(v,1/(norm(v)||1)),rot=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a)],cross=(a,b)=>a[0]*b[1]-a[1]*b[0];

function txt(x,y,t,col=WHITE,sz=13,align='left',bold=false){c.fillStyle=col;c.font=(bold?700:500)+' '+sz+'px system-ui,sans-serif';c.textAlign=align;c.textBaseline='middle';c.fillText(String(t),x,y)}
function rect(x,y,w,h,fill,stroke){if(fill){c.fillStyle=fill;c.fillRect(x,y,w,h)}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.strokeRect(x,y,w,h)}}
function line(a,b,col=MUTED,width=1,dash=[]){c.beginPath();c.setLineDash(dash);c.strokeStyle=col;c.lineWidth=width;c.moveTo(...a);c.lineTo(...b);c.stroke();c.setLineDash([])}
function circ(x,y,r,fill,stroke,width=1){c.beginPath();c.arc(x,y,Math.max(0,r),0,2*PI);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function poly(p,col,width=1.6,dash=[]){if(p.length<2)return;c.beginPath();c.setLineDash(dash);c.strokeStyle=col;c.lineWidth=width;p.forEach((a,i)=>i?c.lineTo(...a):c.moveTo(...a));c.stroke();c.setLineDash([])}

function ray(points,p,col=GOLD,width=2.5){if(points.length<2)return;poly(points,col,1,[4,5]);const len=points.slice(1).map((b,i)=>norm(sub(b,points[i]))),total=len.reduce((a,b)=>a+b,0);let remain=clamp(p,0,1)*total,pos=points[0];for(let i=0;i<len.length;i++){const a=points[i],b=points[i+1],l=len[i];if(l<1e-8)continue;const f=Math.min(1,remain/l);pos=add(a,mul(sub(b,a),f));if(f>0)line(a,pos,col,width);remain-=l;if(remain<0)break}glow(pos,col,3.5)}
function panel(x,y,w,h,title,fn){c.save();c.translate(x,y);let k=Math.min(w/460,h/380);c.translate((w-460*k)/2,(h-380*k)/2);c.scale(k,k);rect(0,0,460,380,'#0a1421','#2c4158');txt(12,18,title,WHITE,16,'left',true);c.save();c.beginPath();c.rect(4,32,452,344);c.clip();fn();c.restore();c.restore()}
function panels(a,b,f,g){if(W<650){const h=(H-6)/2;panel(0,0,W,h,a,f);panel(0,h+6,W,h,b,g)}else{const w=(W-6)/2;panel(0,0,w,H,a,f);panel(w+6,0,w,H,b,g)}}
function plot(fn,xmin,xmax,ymin,ymax,xlabel,ylabel,col=MINT,markers=[]){const x=47,y=52,w=393,h=258;for(let i=0;i<=4;i++){const xx=x+w*i/4,yy=y+h*i/4;line([x,yy],[x+w,yy],'#2b4056',.8);line([xx,y],[xx,y+h],'#2b4056',.8);txt(xx,y+h+15,fmt(xmin+(xmax-xmin)*i/4,Math.abs(xmax-xmin)<10?1:0),MUTED,11,'center');txt(x-5,yy,fmt(ymax-(ymax-ymin)*i/4,ymax-ymin<=2?2:0),MUTED,10,'right')}const X=v=>x+(v-xmin)/(xmax-xmin)*w,Y=v=>y+h-(v-ymin)/(ymax-ymin)*h;line([x,y],[x,y+h],MUTED);line([x,y+h],[x+w,y+h],MUTED);c.save();c.beginPath();c.rect(x,y,w,h);c.clip();let p=[];for(let i=0;i<=600;i++){let v=xmin+(xmax-xmin)*i/600,z=fn(v);if(Number.isFinite(z))p.push([X(v),Y(z)]);else{poly(p,col,2);p=[]}}poly(p,col,2);for(const m of markers)if(m.x>=xmin&&m.x<=xmax&&Number.isFinite(m.y)){line([X(m.x),y],[X(m.x),y+h],m.color||GOLD,1,[4,4]);circ(X(m.x),Y(m.y),4,m.color||GOLD)}c.restore();txt(245,344,xlabel,MUTED,12,'center');txt(7,39,ylabel,MUTED,11)}
function lens(x,y,h,type=1){const p=[[x,y-h],[x+(type>0?12:-8),y-h*.70],[x+(type>0?16:-11),y],[x+(type>0?12:-8),y+h*.70],[x,y+h],[x-(type>0?12:-8),y+h*.70],[x-(type>0?16:-11),y],[x-(type>0?12:-8),y-h*.70]];polygon(p,'#69cffa26','#82c9eb');line([x,y-h],[x,y+h],BLUE,.8,[3,3])}
function interfaceRay(d,n,n1,n2){const u=unit(d),nn=unit(n);const eta=n1/n2,cos=dot(u,nn),t=sub(u,mul(nn,cos)),tt=mul(t,eta),q=1-dot(tt,tt);return q<0?null:unit(add(tt,mul(nn,Math.sqrt(Math.max(0,q)))))}

</script><script id="optics-model">
function water(w){return 1.322+.0031/(w/1000)**2}
function rain(i,w,angle){let n=water(w),a=rad(angle),r=Math.asin(Math.sin(a)/n),k=i+1,D=k*PI+2*a-2*(k+1)*r;return {n,a,r,D,view:deg(Math.abs(PI-D))}}
function rainbowAngle(i,w){let n=water(w),k=i+1,a=Math.acos(Math.sqrt((n*n-1)/((k+1)**2-1)));return rain(i,w,deg(a)).view}
function drop(i,s,w){let q=rain(i,w,s.angle),o=[-Math.cos(q.a),-Math.sin(q.a)],d=interfaceRay([1,0],mul(o,-1),1,q.n),pts=[[-1.9,o[1]],o];for(let j=0;j<=i+1;j++){let x=add(o,mul(d,-2*dot(o,d)));pts.push(x);if(j===i+1){let out=interfaceRay(d,unit(x),q.n,1);if(out)pts.push(add(x,mul(out,1.1)));break}d=reflect(d,unit(x));o=x}return pts}
function mirage(s){const n0=1.00027,g=s.grad*1e-6,C=(n0+g*s.h)*Math.cos(rad(s.angle)),turn=(C-n0)/g,dx=.4;let path=[[0,s.h]],y=s.h,sg=-1,turned=false;for(let x=dx;x<=300;x+=dx){let slope=Math.sqrt(Math.max(0,((n0+g*y)/C)**2-1)),yy=y+sg*slope*dx;if(sg<0&&yy<=turn&&turn>0){sg=1;turned=true;yy=turn}if(yy<=0){path.push([x,0]);break}if(turned&&slope<1e-8)yy+=g*dx*dx/(2*C);y=yy;path.push([x,y]);if(y>5)break}return {path,turned,min:Math.min(...path.map(a=>a[1]))}}
function air(s,w){let t=s.tau*(550/w)**4,m=1/Math.max(.12,Math.sin(rad(s.sun)));return {T:Math.exp(-t*m),S:1-Math.exp(-t)}}
function airColor(s,direct){let z=[0,0,0],tot=[0,0,0];for(let w=400;w<=700;w+=5){let rgb=spectralRGB(w),q=air(s,w),f=direct?q.T:q.S;for(let k=0;k<3;k++){z[k]+=rgb[k]*f;tot[k]+=rgb[k]}}z=z.map((x,k)=>x/tot[k]);let max=Math.max(.001,...z);return 'rgb('+z.map(x=>Math.round(232*Math.sqrt(x/max))).join(',')+')'}
function atmos(i,s,p){if(i<2){panels('물방울 내부 '+(i+1)+'회 반사','입사각과 반태양 방향 관측각',()=>{const P=a=>[230+a[0]*100,191+a[1]*100];circ(230,191,100,'#5ca2d22b','#9acbe7',1.8);for(let w of [700,s.w,400])ray(drop(i,s,w).map(P),p,light(w),2);txt(230,350,'굴절 → 내부 반사 → 출사',GOLD,14,'center');txt(230,368,'파장에 따라 출사 방향이 달라짐',MUTED,11,'center')},()=>{plot(x=>rain(i,s.w,x).view,0,89,0,180,'입사각 (°)','관측각 (°)',MINT,[{x:s.angle,y:rain(i,s.w,s.angle).view}]);txt(230,367,'대표 각: 빨강 '+fmt(rainbowAngle(i,700),1)+'° · 보라 '+fmt(rainbowAngle(i,400),1)+'°',GOLD,11,'center')});return}if(i===2){let q=mirage(s);panels('뜨거운 지표 위 굴절률 층','높이별 굴절률',()=>{for(let j=0;j<12;j++)rect(12,50+j*23,436,23,'rgba(255,130,65,'+(.025+j*.012)+')');rect(12,326,436,21,'#635648');ray(q.path.map(([x,y])=>[22+x/300*420,326-y/5*265]),p,GOLD,2.4);txt(230,336,'뜨거운 지면',WHITE,12,'center');txt(230,365,q.turned?'광선이 위로 휘어짐':'지면 또는 계산 범위에 도달',MINT,12,'center')},()=>{plot(y=>1.00027+s.grad*1e-6*y,0,5,1.00026,1.00028+5*s.grad*1e-6,'높이 (m)','굴절률',MINT)});return}panels('태양빛의 대기 통과','파장별 직접광 투과율',()=>{rect(12,42,436,280,airColor(s,false));rect(12,294,436,29,'#354d50');let sx=230+150*Math.cos(rad(s.sun)),sy=294-205*Math.sin(rad(s.sun)),sun=airColor(s,true);circ(sx,sy,22,sun,'#fff4bb');ray([[sx,sy],[215,293]],p,sun,4);for(let k=1;k<=4;k++){let a=add([sx,sy],mul(sub([215,293],[sx,sy]),k/5));arrow(a,add(a,[(-1)**k*45,-25]),BLUE,1.6)}txt(230,349,'태양 고도 '+s.sun+'°',WHITE,15,'center');txt(230,367,'색상 근사 · 레이리 산란',MUTED,12,'center')},()=>{plot(w=>air(s,w).T,400,700,0,1,'파장 (nm)','투과율',GOLD,[{x:450,y:air(s,450).T,color:BLUE},{x:650,y:air(s,650).T,color:'#ff5555'}])})}
const rc=[R('angle','입사각',0,89,1,59,'°'),R('w','파장',400,700,5,550,'nm')];

const rainbowSamples=Array.from({length:201},(_,j)=>380+j*2).map(w=>({w,angles:[rainbowAngle(0,w),rainbowAngle(1,w)]}));
const edges=[{inner:rainbowAngle(0,380),outer:rainbowAngle(0,780)},{inner:rainbowAngle(1,780),outer:rainbowAngle(1,380)}];
// Keep the actual outer angular edge fixed, widening the visible band inward.
function bandFactor(order,s){const z=clamp(Number(s.band)||3,1,4);return order===0?z:Math.min(1+(z-1)*.5,2,(edges[1].outer-edges[0].outer-2)/(edges[1].outer-edges[1].inner))}
function displayAngle(order,r,s){return edges[order].outer-(edges[order].outer-r)*bandFactor(order,s)}
function displayEdges(order,s){return {inner:displayAngle(order,edges[order].inner,s),outer:edges[order].outer}}
function rainbowColor(w){return 'rgb('+spectralRGB(w).map(v=>Math.round(255*Math.pow(clamp(v,0,1),.42))).join(',')+')'}
function skyPoint(rho,phi,sun){const r=rad(rho),h=rad(sun),x=Math.sin(r)*Math.cos(phi),y=-Math.sin(h)*Math.cos(r)+Math.cos(h)*Math.sin(r)*Math.sin(phi),z=Math.cos(h)*Math.cos(r)+Math.sin(h)*Math.sin(r)*Math.sin(phi);return [deg(Math.atan2(x,z)),deg(Math.asin(clamp(y,-1,1)))]}
function skyArc(r,sun,P){return Array.from({length:97},(_,j)=>P(skyPoint(r,j*PI/96,sun)))}
function skyBand(r1,r2,sun,P,fill){if(sun>=Math.max(r1,r2))return;polygon([...skyArc(r1,sun,P),...skyArc(r2,sun,P).reverse()],fill)}
function skyInner(r,sun,P,fill){if(sun>=r)return;const arc=skyArc(r,sun,P);polygon([...arc,[arc.at(-1)[0],P([0,-90])[1]],[arc[0][0],P([0,-90])[1]]],fill)}
function rainbowSky(s,p,dual,B,H){
 const horizon=H-34,scale=Math.min((B-16)/138,(horizon-16)/59),P=([az,el])=>[B/2+az*scale,horizon-el*scale];
 const grad=c.createLinearGradient(0,0,0,horizon);grad.addColorStop(0,'#345e91');grad.addColorStop(.58,'#638eb5');grad.addColorStop(1,'#b1ccd9');rect(0,0,B,H,'#172f40');rect(0,0,B,horizon,grad);
 // procedural clouds stay behind the optical bands
 c.save();c.globalAlpha=.20;for(const [x,y,ww,hh] of [[.18,.24,.28,.07],[.80,.16,.31,.06],[.83,.63,.32,.05],[.17,.70,.35,.04]]){for(let j=0;j<6;j++){c.beginPath();c.ellipse(B*(x+(j-2.5)*ww/7),horizon*(y+Math.sin(j*2)*.017),B*ww/7,horizon*hh,0,0,2*PI);c.fillStyle='#e5eff5';c.fill()}}c.restore();
 c.save();c.beginPath();c.rect(0,0,B,horizon);c.clip();
 const shown0=displayEdges(0,s),shown1=displayEdges(1,s);
 skyInner(shown0.inner,s.sun,P,'rgba(226,239,249,.13)');
 if(dual)skyBand(shown0.outer,shown1.inner,s.sun,P,'rgba(16,30,49,.25)');
 const modes=dual?[1,0]:[0],fade=s.mode==='rays'?.47:1;
 for(const order of modes){
  const a=(order===0?.98:.62)*fade*(.94+.06*p);
  c.save();c.globalAlpha=a;
  for(let j=0;j<rainbowSamples.length-1;j+=2){const lo=rainbowSamples[j],hi=rainbowSamples[Math.min(j+2,rainbowSamples.length-1)],r1=displayAngle(order,lo.angles[order],s),r2=displayAngle(order,hi.angles[order],s),diff=r2-r1;
   const e=order===0?shown0:shown1;
   skyBand(clamp(r1-diff*.045,e.inner,e.outer),clamp(r2+diff*.045,e.inner,e.outer),s.sun,P,rainbowColor((lo.w+hi.w)/2));
  }c.restore();
 }
 if(s.mode!=='sky'){
  for(const order of modes){const r=rainbowAngle(order,s.w);if(s.sun>=r)continue;const phi0=Math.asin(clamp(Math.tan(rad(s.sun))/Math.tan(rad(r)),0,1));const arc=skyArc(r,s.sun,P);poly(arc,'#fff9dc90',.9,[4,4]);
   for(let j=0;j<7;j++){const phi=phi0+(PI-2*phi0)*(j+.5)/7,pt=P(skyPoint(r,phi,s.sun));circ(...pt,3,'#ffffff99',rainbowColor(s.w),1.1);}
   const apex=P([0,r-s.sun]);circ(...apex,4,'#ffffff',rainbowColor(s.w),1.5);
  }
