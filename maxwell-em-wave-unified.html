esults{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result{border:1px solid #23445f;background:#071525;border-radius:11px;padding:9px}.result small{display:block;color:var(--muted);font-size:.72rem}.result b{font-size:.94rem;color:#f4fbff;font-variant-numeric:tabular-nums}.result.wide{grid-column:1/-1}.concept{border-left:3px solid var(--amber);background:#211b1022}.concept p{margin:0;color:#dce9f5;font-size:.86rem}.mission{display:flex;gap:9px;align-items:flex-start}.mission-icon{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:#1d3450;color:var(--amber)}.mission p{margin:0;font-size:.84rem;color:#c4d5e4}.mission-status{margin-top:8px;font-size:.8rem;color:var(--muted)}.mission-status.ok{color:var(--green)}\n    .lower{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.graph-card,.notes-card{background:#081525;border:1px solid var(--line);border-radius:16px;padding:13px}.graph-card h3,.notes-card h3{font-size:.92rem;margin:0 0 8px}.graph-card canvas{width:100%;height:155px;display:block;background:#050d18;border-radius:10px}.notes-card p{font-size:.84rem;color:var(--muted);margin:0 0 8px}.note-row{display:flex;gap:6px}.note-row input{min-width:0;flex:1;border:1px solid #31506c;background:#07111f;color:var(--text);border-radius:9px;padding:8px}.log{margin-top:9px;max-height:90px;overflow:auto;font-size:.75rem}.log div{padding:5px 2px;border-top:1px solid #1b344d}.empty{color:#6f8ca6}.advanced{margin-top:12px}.advanced summary{cursor:pointer;color:#bdd3e6;font-size:.86rem}.equations{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.eq{padding:8px;background:#07111f;border:1px solid #1e3a55;border-radius:9px;font-family:Georgia,serif;font-size:.85rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\n    @media(max-width:1100px){.tabs{grid-template-columns:repeat(3,1fr)}}\n    @media(max-width:920px){.workspace{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.canvas-wrap,.canvas-wrap canvas{height:420px;min-height:420px}.lower{grid-template-columns:1fr}.equation-pill{display:none}}\n    @media(max-width:640px){.shell{padding:10px 8px 32px}.brand p{display:none}.tabs{grid-template-columns:1fr 1fr}.tab{padding:9px}.stage-head{align-items:flex-start}.formula{font-size:.83rem;max-width:46%}.canvas-wrap,.canvas-wrap canvas{height:360px;min-height:360px}.sidebar{display:flex}.transport{position:sticky;bottom:0;z-index:4}.transport .btn{flex:1 1 calc(50% - 8px)}.btn{padding:10px}.btn.record{margin-left:0}.results{grid-template-columns:1fr 1fr}.lower{margin-top:8px}}\n    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.brandmark{box-shadow:none}}\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain class=\"shell\">\n  \u003cheader>\n    \u003cdiv class=\"brand\">\u003cdiv class=\"brandmark\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 64 64\">\u003cpath d=\"M5 35c10-22 18 22 28 0s17 9 25-8\" fill=\"none\" stroke=\"#38d9ff\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003ccircle cx=\"13\" cy=\"19\" r=\"5\" fill=\"#ffca63\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003ch1>맥스웰 방정식 실험실\u003c/h1>\u003cp>전기와 자기가 하나의 파동이 되는 네 가지 법칙\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"equation-pill\">∇·E &nbsp; ∇·B &nbsp; ∇×E &nbsp; ∇×B\u003c/div>\n  \u003c/header>\n\n  \u003cnav class=\"tabs\" aria-label=\"실험 선택\" role=\"tablist\">\n    \u003cbutton class=\"tab active\" role=\"tab\" aria-selected=\"true\" data-mode=\"electric\">\u003cspan>실험 01\u003c/span>\u003cstrong>전기 가우스 법칙\u003c/strong>\u003c/button>\n    \u003cbutton class=\"tab\" role=\"tab\" aria-selected=\"false\" data-mode=\"magnetic\">\u003cspan>실험 02\u003c/span>\u003cstrong>자기 가우스 법칙\u003c/strong>\u003c/button>\n    \u003cbutton class=\"tab\" role=\"tab\" aria-selected=\"false\" data-mode=\"faraday\">\u003cspan>실험 03\u003c/span>\u003cstrong>패러데이 법칙\u003c/strong>\u003c/button>\n    \u003cbutton class=\"tab\" role=\"tab\" aria-selected=\"false\" data-mode=\"ampere\">\u003cspan>실험 04\u003c/span>\u003cstrong>앙페르–맥스웰 법칙\u003c/strong>\u003c/button>\n    \u003cbutton class=\"tab\" role=\"tab\" aria-selected=\"false\" data-mode=\"wave\">\u003cspan>통합 실험\u003c/span>\u003cstrong>전자기파\u003c/strong>\u003c/button>\n  \u003c/nav>\n\n  \u003csection class=\"workspace\" id=\"labPanel\" role=\"tabpanel\">\n    \u003cdiv class=\"stage-card\">\n      \u003cdiv class=\"stage-head\">\u003cdiv class=\"stage-title\">\u003ch2 id=\"moduleTitle\">\u003c/h2>\u003cp id=\"moduleSubtitle\">\u003c/p>\u003c/div>\u003cdiv class=\"formula\" id=\"moduleFormula\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"canvas-wrap\" id=\"canvasWrap\">\n        \u003ccanvas id=\"fieldCanvas\" aria-label=\"전자기장 시뮬레이션\">\u003c/canvas>\n        \u003cdiv class=\"live-badge\" id=\"liveBadge\">● 일시정지\u003c/div>\n        \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"transport\">\n        \u003cbutton class=\"btn primary\" id=\"playBtn\">▶ 시작\u003c/button>\u003cbutton class=\"btn\" id=\"stepBtn\">한 단계\u003c/button>\u003cbutton class=\"btn\" id=\"resetBtn\">↺ 초기화\u003c/button>\u003cbutton class=\"btn record\" id=\"recordBtn\">＋ 측정 기록\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003caside class=\"sidebar\">\n      \u003csection class=\"side-card\">\u003ch3>실험 변수\u003c/h3>\u003cdiv id=\"controls\">\u003c/div>\u003c/section>\n      \u003csection class=\"side-card\">\u003ch3>실시간 측정\u003c/h3>\u003cdiv class=\"results\" id=\"results\">\u003c/div>\u003c/section>\n      \u003csection class=\"side-card concept\">\u003ch3>해석\u003c/h3>\u003cp id=\"explanation\">\u003c/p>\u003c/section>\n      \u003csection class=\"side-card\">\u003cdiv class=\"mission\">\u003cdiv class=\"mission-icon\">◆\u003c/div>\u003cdiv>\u003ch3>탐구 미션\u003c/h3>\u003cp id=\"missionText\">\u003c/p>\u003cdiv class=\"mission-status\" id=\"missionStatus\" aria-live=\"polite\">조건을 바꾸어 확인해 보세요.\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n    \u003c/aside>\n  \u003c/section>\n\n  \u003csection class=\"lower\">\n    \u003cdiv class=\"graph-card\">\u003ch3 id=\"graphTitle\">시간에 따른 변화\u003c/h3>\u003ccanvas id=\"graphCanvas\" aria-label=\"측정값 그래프\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"notes-card\">\u003ch3>관찰 기록\u003c/h3>\u003cp>현재 측정값과 함께 남길 메모를 입력하세요.\u003c/p>\u003cdiv class=\"note-row\">\u003clabel class=\"sr-only\" for=\"noteInput\">관찰 메모\u003c/label>\u003cinput id=\"noteInput\" maxlength=\"80\" placeholder=\"예: 주파수를 높이면 기전력이 커진다\">\u003cbutton class=\"btn\" id=\"noteBtn\">저장\u003c/button>\u003c/div>\u003cdiv class=\"log\" id=\"log\">\u003cdiv class=\"empty\">아직 기록이 없습니다.\u003c/div>\u003c/div>\n      \u003cdetails class=\"advanced\">\u003csummary>네 방정식을 한눈에 보기\u003c/summary>\u003cdiv class=\"equations\">\u003cdiv class=\"eq\">∮ E·dA = Q\u003csub>in\u003c/sub>/ε₀\u003c/div>\u003cdiv class=\"eq\">∮ B·dA = 0\u003c/div>\u003cdiv class=\"eq\">∮ E·dl = −dΦ\u003csub>B\u003c/sub>/dt\u003c/div>\u003cdiv class=\"eq\">∮ B·dl = μ₀(I+ε₀dΦ\u003csub>E\u003c/sub>/dt)\u003c/div>\u003c/div>\u003c/details>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003cscript>\n(()=>{'use strict';\nconst EPS0=8.8541878128e-12,MU0=1.25663706212e-6;\nconst field=document.getElementById('fieldCanvas'),graph=document.getElementById('graphCanvas');\nconst fctx=field.getContext('2d'),gctx=graph.getContext('2d');\nconst $=id=>document.getElementById(id);\nconst ui={title:$('moduleTitle'),subtitle:$('moduleSubtitle'),formula:$('moduleFormula'),legend:$('legend'),controls:$('controls'),results:$('results'),explanation:$('explanation'),mission:$('missionText'),missionStatus:$('missionStatus'),graphTitle:$('graphTitle'),badge:$('liveBadge'),play:$('playBtn'),log:$('log')};\nconst modules={\n electric:{title:'전기장에 대한 가우스 법칙',subtitle:'가우스 구면의 단면을 움직이는 전하와 전기선속',formula:'∮ E·dA = Qᵢₙ / ε₀',legend:[['#ffca63','전기장'],['#38d9ff','가우스면'],['#ff657a','양전하']],controls:[['charge','전하량 Q','-5','5','0.5','2',' μC'],['radius','가우스면 반지름 R','55','155','1','108',' px'],['offset','전하의 중심 거리 x','-170','170','1','0',' px']],mission:'전하를 가우스면 밖으로 옮겨 전체 전기선속이 0이 되는 순간을 찾으세요.',graph:'전기선속 ΦE',explain:'닫힌 면을 통과하는 전체 전기선속은 면의 크기나 모양이 아니라 내부의 알짜 전하로만 결정됩니다.'},\n magnetic:{title:'자기장에 대한 가우스 법칙',subtitle:'막대자석을 둘러싼 닫힌 면의 들어오는 선속과 나가는 선속',formula:'∮ B·dA = 0',legend:[['#ff657a','N극'],['#6b8cff','S극'],['#63e6be','자기력선']],controls:[['strength','자석 세기','0.3','2','0.1','1',' 배'],['radius','가우스면 반지름','75','165','1','125',' px'],['offset','자석의 중심 거리','-100','100','1','0',' px']],mission:'자석의 위치와 가우스면 크기를 바꾸어도 알짜 자기선속이 0인지 확인하세요.',graph:'들어오는/나가는 자기선속',explain:'자기력선은 N극에서 나와 S극으로 들어가는 닫힌 고리를 이룹니다. 고립된 자기 홀극이 없으므로 닫힌 면의 알짜 자기선속은 0입니다.'},\n faraday:{title:'패러데이 전자기 유도 법칙',subtitle:'변화하는 자기선속이 만드는 유도 기전력과 전류',formula:'ℰ = −N dΦB/dt',legend:[['#38d9ff','자기선속'],['#ffca63','유도전류'],['#ff657a','기전력']],controls:[['b0','자기장 최댓값 B₀','0.1','1.2','0.05','0.6',' T'],['freq','진동수 f','0.2','4','0.1','1',' Hz'],['area','코일 면적 A','0.02','0.2','0.01','0.08',' m²'],['turns','감은 수 N','1','20','1','8',' 회']],mission:'진동수를 3 Hz 이상으로 높여 유도 기전력의 최댓값이 어떻게 달라지는지 확인하세요.',graph:'자기선속과 유도 기전력',explain:'유도 기전력의 방향은 자기선속의 변화를 방해합니다. 이것이 식의 마이너스 부호, 즉 렌츠 법칙의 뜻입니다.'},\n ampere:{title:'앙페르–맥스웰 법칙',subtitle:'충전 중인 축전기 사이에서 이어지는 자기장',formula:'∮ B·dl = μ₀(I + ε₀ dΦE/dt)',legend:[['#38d9ff','전기장'],['#ffca63','자기장'],['#ff657a','전류/변위전류']],controls:[['v0','전압 최댓값 V₀','10','200','5','100',' V'],['freq','진동수 f','0.2','5','0.1','1.5',' Hz'],['plate','극판 반지름 a','0.03','0.12','0.005','0.07',' m'],['gap','극판 간격 d','0.002','0.02','0.001','0.008',' m'],['loop','앙페르 고리 반지름 r','0.01','0.18','0.005','0.10',' m']],mission:'앙페르 고리를 극판 안쪽과 바깥쪽으로 바꾸며 포함된 변위전류를 비교하세요.',graph:'변위전류와 자기장',explain:'이상적 평행판 축전기에서 전하가 틈을 건너지는 않습니다. 변화하는 전기선속의 항이 변위전류 역할을 하여 자기장을 연속적으로 만듭니다.'},\n wave:{title:'전자기파 통합 실험',subtitle:'서로 수직인 전기장과 자기장이 진공을 따라 전파되는 모습',formula:'c = 1/√(μ₀ε₀),  E₀ = cB₀',legend:[['#38d9ff','전기장 E'],['#ffca63','자기장 B'],['#ff657a','진행 방향 E×B']],controls:[['freqMHz','진동수 f','50','500','10','150',' MHz'],['e0','전기장 진폭 E₀','5','100','5','40',' V/m'],['phaseSpeed','화면 재생 속도','0.2','2','0.1','1',' 배']],mission:'진동수를 300 MHz로 맞추어 파장이 약 1 m가 되는지 확인하세요.',graph:'한 지점의 E와 B(각각 정규화)',explain:'진공 평면파에서 E와 B는 서로 수직이고 같은 위상입니다. 화면에서는 두 장을 보기 좋게 각각 정규화했으며 실제 크기는 E₀/B₀=c를 만족합니다.'}\n};\nlet mode='electric',running=false,time=0,last=performance.now(),values={},history=[],records=[],interacted=false,touchedKey='';\nfunction resize(){const dpr=Math.min(devicePixelRatio||1,2);for(const c of [field,graph]){const r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}draw()}\nfunction initMode(name){mode=name;time=0;history=[];values={};interacted=false;touchedKey='';const m=modules[mode];ui.title.textContent=m.title;ui.subtitle.textContent=m.subtitle;ui.formula.textContent=m.formula;ui.explanation.textContent=m.explain;ui.mission.textContent=m.mission;ui.graphTitle.textContent=m.graph+' · 모양과 위상 비교용 자동 정규화';ui.legend.innerHTML=m.legend.map(x=>`\u003cspan>\u003ci class=\"dot\" style=\"background:${x[0]}\">\u003c/i>${x[1]}\u003c/span>`).join('');ui.controls.innerHTML='';m.controls.forEach(([key,label,min,max,step,val,unit])=>{values[key]=+val;const wrap=document.createElement('div');wrap.className='control';wrap.innerHTML=`\u003cdiv class=\"control-top\">\u003clabel for=\"c_${key}\">${label}\u003c/label>\u003cspan class=\"value\" id=\"v_${key}\">${format(+val)}${unit}\u003c/span>\u003c/div>\u003cinput id=\"c_${key}\" type=\"range\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${val}\" data-key=\"${key}\" data-unit=\"${unit}\">`;ui.controls.appendChild(wrap)});ui.controls.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{interacted=true;touchedKey=el.dataset.key;values[touchedKey]=+el.value;$('v_'+touchedKey).textContent=format(+el.value)+el.dataset.unit;draw()}));document.querySelectorAll('.tab').forEach(t=>{const a=t.dataset.mode===mode;t.classList.toggle('active',a);t.setAttribute('aria-selected',a);t.setAttribute('aria-controls','labPanel')});draw()}\nfunction format(n,d=3){if(!Number.isFinite(n))return '—';const a=Math.abs(n);if((a>0&&a\u003c.001)||a>=1e4)return n.toExponential(2);return (+n.toFixed(d)).toLocaleString('ko-KR')}\nfunction measure(){let data={};if(mode==='electric'){const delta=Math.abs(values.offset)-values.radius,boundary=Math.abs(delta)\u003c0.5,inside=delta\u003c0,Q=values.charge*1e-6;data={inside,boundary,flux:boundary?NaN:(inside?Q/EPS0:0),qin:boundary?NaN:(inside?Q:0)};}\nelse if(mode==='magnetic'){const scale=values.strength*(.7+.3*Math.min(1,values.radius/130))*(1-.25*Math.min(1,Math.abs(values.offset)/120));data={out:scale,inward:-scale,net:0};}\nelse if(mode==='faraday'){const om=2*Math.PI*values.freq,B=values.b0*Math.sin(om*time),single=values.area*B,emf=-values.turns*values.area*values.b0*om*Math.cos(om*time);data={B,flux:single,link:values.turns*single,emf};}\nelse if(mode==='ampere'){const om=2*Math.PI*values.freq,E=values.v0/values.gap*Math.sin(om*time),dEdt=values.v0/values.gap*om*Math.cos(om*time),A=Math.PI*values.plate**2,Id=EPS0*A*dEdt,r=values.loop,a=values.plate,Ienc=Id*Math.min(1,r*r/(a*a)),B=MU0*Ienc/(2*Math.PI*r);data={E,Id,Ienc,B,inside:r\u003ca};}\nelse{const c=1/Math.sqrt(EPS0*MU0),f=values.freqMHz*1e6,lambda=c/f,phase=2*Math.PI*f*(time*values.phaseSpeed/1e8),E=values.e0*Math.sin(phase),B=E/c;data={c,f,lambda,E,B,b0:values.e0/c};}return data}\nfunction renderResults(d){let arr=[];if(mode==='electric')arr=[['포함 전하',d.boundary?'정의 보류':format(d.qin*1e6)+' μC'],['전기선속 ΦE',d.boundary?'정의 보류':format(d.flux)+' N·m²/C'],['판정',d.boundary?'점전하가 면 위에 있음—조금 이동하세요':d.inside?'전하가 면 안에 있음':'전하가 면 밖에 있음','wide']];\nif(mode==='magnetic')arr=[['나가는 선속',format(d.out)+' 상대값'],['들어오는 선속',format(d.inward)+' 상대값'],['알짜 선속',format(d.net)+' 상대값','wide']];\nif(mode==='faraday')arr=[['자기장 B',format(d.B)+' T'],['코일 1회의 선속',format(d.flux)+' Wb'],['선속 결합 NΦ',format(d.link)+' Wb·turn'],['유도 기전력 ℰ',format(d.emf)+' V']];\nif(mode==='ampere')arr=[['전기장 E',format(d.E)+' V/m'],['전체 변위전류',format(d.Id)+' A'],['고리 내부 전류',format(d.Ienc)+' A'],['고리 위 자기장',format(d.B)+' T']];\nif(mode==='wave')arr=[['빛의 속력 c',format(d.c)+' m/s'],['파장 λ',format(d.lambda)+' m'],['현재 전기장 E',format(d.E)+' V/m'],['자기장 진폭 B₀',format(d.b0*1e9)+' nT']];ui.results.innerHTML=arr.map(x=>`\u003cdiv class=\"result ${x[2]||''}\">\u003csmall>${x[0]}\u003c/small>\u003cb>${x[1]}\u003c/b>\u003c/div>`).join('');let ok=mode==='electric'?touchedKey==='offset'&&!d.inside&&!d.boundary:mode==='magnetic'?interacted&&Math.abs(d.net)\u003c1e-20:mode==='faraday'?touchedKey==='freq'&&values.freq>=3:mode==='ampere'?touchedKey==='loop'&&values.loop>values.plate:touchedKey==='freqMHz'&&Math.abs(d.lambda-1)\u003c.04;ui.missionStatus.textContent=ok?'✓ 미션 조건을 확인했습니다!':d.boundary?'경계에서는 이상적 적분을 적용할 수 없습니다.':'조건을 바꾸어 확인해 보세요.';ui.missionStatus.classList.toggle('ok',ok);field.setAttribute('aria-label',`${modules[mode].title}. ${arr.map(x=>x[0]+' '+x[1]).join(', ')}`)}\nfunction clear(ctx,w,h){ctx.clearRect(0,0,w,h)}function line(ctx,x1,y1,x2,y2,color,width=1,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}\nfunction arrow(ctx,x,y,dx,dy,color,alpha=.8){const len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,L=Math.min(18,Math.max(6,len));line(ctx,x,y,x+ux*L,y+uy*L,color,1.4,alpha);ctx.save();ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.translate(x+ux*L,y+uy*L);ctx.rotate(Math.atan2(uy,ux));ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-5,-3);ctx.lineTo(-5,3);ctx.fill();ctx.restore()}\nfunction drawGrid(w,h){fctx.save();fctx.strokeStyle='#24415a';fctx.globalAlpha=.25;fctx.lineWidth=1;for(let x=20;x\u003cw;x+=32)line(fctx,x,0,x,h,'#24415a',1,.25);for(let y=20;y\u003ch;y+=32)line(fctx,0,y,w,y,'#24415a',1,.25);fctx.restore()}\nfunction drawElectric(w,h,d){const cx=w/2,cy=h/2,qx=cx+values.offset,R=values.radius,qScale=Math.abs(values.charge)/5;if(qScale>0){for(let y=38;y\u003ch-25;y+=42)for(let x=30;x\u003cw-25;x+=42){const dx=x-qx,dy=y-cy,r2=dx*dx+dy*dy+200,sign=Math.sign(values.charge),mag=Math.min(22,15000/r2)*qScale;arrow(fctx,x,y,sign*dx*mag,sign*dy*mag,'#ffca63',.18+.72*qScale)}fctx.fillStyle=values.charge>0?'#ff657a':'#6b8cff';fctx.shadowColor=fctx.fillStyle;fctx.shadowBlur=22;fctx.beginPath();fctx.arc(qx,cy,13,0,Math.PI*2);fctx.fill();fctx.shadowBlur=0;fctx.fillStyle='#fff';fctx.font='bold 18px system-ui';fctx.textAlign='center';fctx.textBaseline='middle';fctx.fillText(values.charge>0?'+':'−',qx,cy)}else{fctx.strokeStyle='#8ba0b3';fctx.lineWidth=2;fctx.beginPath();fctx.arc(qx,cy,10,0,Math.PI*2);fctx.stroke();label('Q = 0',qx,cy-20,'#b8c6d2')}fctx.strokeStyle=d.boundary?'#ff657a':'#38d9ff';fctx.lineWidth=3;fctx.setLineDash([9,7]);fctx.beginPath();fctx.arc(cx,cy,R,0,Math.PI*2);fctx.stroke();fctx.setLineDash([]);label('3차원 가우스 구면의 단면',cx,cy-R-13,'#75e6ff');label(d.boundary?'경계 상태':d.inside?'Qin = Q':'Qin = 0',cx,cy+R+20,d.boundary?'#ff9aaa':d.inside?'#63e6be':'#ffca63')}\nfunction dipoleField(x,y,cx,cy,s){const dx=(x-cx)/55,dy=(y-cy)/55,r2=dx*dx+dy*dy+.32,r=Math.sqrt(r2),mx=s;return {x:(3*dx*(mx*dx)/r2-mx)/(r2*r),y:3*dy*(mx*dx)/(r2*r)}}\nfunction drawMagnetic(w,h,d){const cx=w/2,cy=h/2,mx=cx+values.offset,R=values.radius;for(let y=35;y\u003ch-25;y+=38)for(let x=28;x\u003cw-20;x+=38){const b=dipoleField(x,y,mx,cy,values.strength),m=15/Math.max(.4,Math.hypot(b.x,b.y));arrow(fctx,x,y,b.x*m,b.y*m,'#63e6be',.6)}fctx.strokeStyle='#38d9ff';fctx.lineWidth=3;fctx.setLineDash([9,7]);fctx.beginPath();fctx.arc(cx,cy,R,0,Math.PI*2);fctx.stroke();fctx.setLineDash([]);const L=94,H=34;fctx.fillStyle='#ff657a';fctx.fillRect(mx-L/2,cy-H/2,L/2,H);fctx.fillStyle='#6b8cff';fctx.fillRect(mx,cy-H/2,L/2,H);fctx.fillStyle='#fff';fctx.font='bold 16px system-ui';fctx.textAlign='center';fctx.fillText('N',mx-L/4,cy+6);fctx.fillText('S',mx+L/4,cy+6);label('나감 + 들어옴 = 0',cx,cy+R+20,'#63e6be')}\nfunction drawFaraday(w,h,d){const cx=w/2,cy=h/2+10,rx=Math.min(150,w*.25),ry=72,phase=Math.sin(2*Math.PI*values.freq*time);fctx.save();fctx.translate(cx,cy);fctx.strokeStyle='#ffca63';fctx.lineWidth=5;for(let i=0;i\u003cMath.min(values.turns,12);i++){fctx.beginPath();fctx.ellipse(0,i*3-18,rx,ry,0,0,Math.PI*2);fctx.stroke()}fctx.restore();const count=Math.abs(d.B)\u003c1e-12?0:Math.round(5+Math.abs(d.B/Math.max(values.b0,1e-12))*10);for(let i=0;i\u003ccount;i++){const x=cx-rx*.72+(i%(Math.ceil(count/2)))*(rx*1.44/Math.max(1,Math.ceil(count/2)-1));const top=cy-125,bottom=cy+125;line(fctx,x,top,x,bottom,'#38d9ff',2,.35+.5*Math.abs(phase));arrow(fctx,x,phase>=0?cy-10:cy+10,0,phase>=0?18:-18,'#38d9ff',.9)}const dir=Math.abs(d.emf)\u003c1e-12?'0':d.emf>0?'↺':'↻';fctx.fillStyle='#ff657a';fctx.font=`bold ${44+Math.abs(d.emf)*.35}px system-ui`;fctx.textAlign='center';fctx.fillText(dir,cx,cy+15);label(`B = ${format(d.B)} T`,cx,48,'#75e6ff');label(`ℰ = ${format(d.emf)} V`,cx,h-28,'#ff9aaa')}\nfunction drawAmpere(w,h,d){const cx=w/2,cy=h/2,gapPx=Math.max(32,values.gap*3300),platePx=values.plate*1500,loopPx=Math.min(180,values.loop*850);fctx.strokeStyle='#c4d5e4';fctx.lineWidth=8;line(fctx,cx-platePx,cy-gapPx/2,cx+platePx,cy-gapPx/2,'#d7e5ef',8);line(fctx,cx-platePx,cy+gapPx/2,cx+platePx,cy+gapPx/2,'#d7e5ef',8);const sign=Math.sin(2*Math.PI*values.freq*time);fctx.fillStyle=sign>=0?'#ff657a':'#6b8cff';for(let i=-4;i\u003c=4;i++)fctx.beginPath(),fctx.arc(cx+i*platePx/5,cy-gapPx/2-14,4,0,7),fctx.fill();fctx.fillStyle=sign>=0?'#6b8cff':'#ff657a';for(let i=-4;i\u003c=4;i++)fctx.beginPath(),fctx.arc(cx+i*platePx/5,cy+gapPx/2+14,4,0,7),fctx.fill();for(let x=cx-platePx*.85;x\u003c=cx+platePx*.85;x+=28)arrow(fctx,x,cy-gapPx/2+8,0,sign>=0?gapPx-16:-(gapPx-16),'#38d9ff',.75);fctx.strokeStyle='#ffca63';fctx.lineWidth=3;fctx.setLineDash([8,6]);fctx.beginPath();fctx.ellipse(cx,cy,loopPx,loopPx th||extracted.length!==(c.extract||[]).length||extra.length!==(c.sceneExtra||[]).length){console.error('Teaching tab layout anchors missing');return;}\nconst el=(tag,cls)=>{const n=document.createElement(tag);n.className=cls;return n};\nconst nav=el('nav','wlab-nav');nav.setAttribute('aria-label','학습 화면 선택');nav.setAttribute('role','tablist');\nconst deck=el('div','wlab-deck'),sim=el('div','wlab-pane wlab-sim'),graph=el('div','wlab-pane wlab-graph'),learn=el('div','wlab-pane wlab-concept');\nconst tabs=[['실험하기',sim],...(graphs.length?[['그래프·비교',graph]]:[]),['개념 설명',learn]];\nconst wrap=(n)=>{if(n.matches('canvas,svg,details')){const card=el('section','wlab-card');card.append(n);return card}return n};\nroot.classList.add('wlab-root');document.body.classList.add('wlab-ready');\nroot.append(nav,deck);\nscene.classList.add('wlab-scene');if(c.wide)scene.classList.add('wlab-wide');\nsim.append(scene);\nif(control){control.classList.add('wlab-control');sim.append(control);}\nlet read=result;\nif(extracted.length){read=read||el('section','wlab-card');if(!result){const h=el('h2','');h.textContent='실시간 결과';read.append(h)}extracted.forEach(n=>read.append(n));}\nif(read){read.classList.add('wlab-result');sim.append(read)}\nif(extra.length){scene.classList.add('wlab-composite');for(const n of extra){n.classList.add('wlab-extra');scene.append(n)}}\nfor(const n of graphs)graph.append(wrap(n));\nfor(const n of concepts)learn.append(wrap(n));\nfor(const n of old){if(!n.contains(scene)&&!n.contains(control)&&!n.contains(read))n.classList.add('wlab-original')}\nfor(const f of [...root.querySelectorAll(':scope>footer'),...document.querySelectorAll('body>footer')])learn.append(f);\nconst buttons=[];\nfunction show(i){tabs.forEach((t,j)=>{const on=i===j;t[1].classList.toggle('wlab-active',on);t[1].inert=!on;t[1].setAttribute('aria-hidden',String(!on));buttons[j].setAttribute('aria-selected',String(on));buttons[j].tabIndex=on?0:-1;});requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')));}\ntabs.forEach((t,i)=>{const b=el('button','');b.type='button';b.id='wlab-tab-'+i;b.textContent=t[0];b.setAttribute('role','tab');b.setAttribute('aria-controls','wlab-panel-'+i);t[1].id='wlab-panel-'+i;t[1].setAttribute('role','tabpanel');t[1].setAttribute('aria-labelledby',b.id);b.addEventListener('click',()=>show(i));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;show(j);buttons[j].focus()});buttons.push(b);nav.append(b);deck.append(t[1]);});\nconst back=el('a','');back.href='index.html';back.textContent='← 실험 목록';nav.append(back);\nshow(0);\n})({\"root\":\"main.shell\",\"scene\":\".workspace\",\"graph\":[\".graph-card\",\".notes-card\"],\"concept\":[\".side-card.concept\",\".sidebar>.side-card:last-child\"],\"old\":[\".lower\"],\"wide\":true});\u003c/script>\u003c/body>\n\u003c/html>\n","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>41번 맥스웰 방정식 | 물리 공식 실험실\u003c/title>\u003cstyle>\n:root{--bg:#0b1324;--card:#14213a;--line:#30435f;--text:#edf4ff;--muted:#b6c7de;--e:#ffc66d;--b:#77d9f5;--accent:#a5e7bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:22px}h1{font-size:clamp(25px,5vw,38px);margin:8px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px}p{margin:8px 0}.tag{color:var(--accent);font-size:13px;letter-spacing:.1em}.lead{color:var(--muted)}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}button{font:inherit;min-height:46px;border-radius:10px;background:#223551;border:1px solid #506780;color:var(--text);padding:9px 13px;cursor:pointer}button:hover{border-color:var(--accent)}button[aria-selected=true]{background:#244b47;border:2px solid var(--accent)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);padding:20px;border-radius:16px;margin-bottom:16px;min-width:0}.formula{font:clamp(16px,3.2vw,23px)/1.7 Georgia,serif;overflow-wrap:anywhere;color:var(--e)}canvas{display:block;width:100%;background:#0c172b;border-radius:10px}#scene{height:330px}#graph{height:260px}.hint{font-size:14px;color:var(--muted)}.control{margin:16px 0}.control label{display:block;margin-bottom:8px}.pair{display:grid;grid-template-columns:1fr 105px;gap:12px;align-items:center}input[type=range]{width:100%;height:38px;accent-color:var(--accent)}input[type=number]{min-width:0;width:100%;height:44px;border-radius:8px;border:1px solid #647b98;background:#0b1729;color:white;font:inherit;padding:6px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.metric{padding:12px;background:#0c172b;border-radius:10px}.metric strong{display:block;font-size:19px;color:var(--accent);overflow-wrap:anywhere}.metric span{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;min-height:44px;padding:9px 0}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;overflow-wrap:anywhere}.scroll{overflow-x:auto}.notice{border-left:3px solid var(--accent);padding:8px 12px;background:#102c30}a{color:var(--b)}.equations{display:grid;grid-template-columns:1fr 1fr;gap:12px}.equations div{background:#0c172b;padding:12px;border-radius:10px}footer{color:var(--muted);font-size:13px} @media(max-width:740px){main{padding:12px}.grid,.equations{grid-template-columns:1fr}nav{grid-template-columns:1fr 1fr}.card{padding:15px}#scene{height:290px}.metrics{gap:7px}.metric strong{font-size:17px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cheader>\u003cspan class=\"tag\">물리 공식 40 · 확장 실험실 41\u003c/span>\u003ch1>맥스웰 방정식\u003c/h1>\u003cp class=\"lead\">전하와 장의 변화율을 바꾸면, 선속과 순환하는 장은 어떻게 달라질까?\u003c/p>\u003cp>전기와 자기를 잇는 네 법칙을 하나씩 조작하며 살펴보세요.\u003c/p>\u003c/header>\u003cnav role=\"tablist\" aria-label=\"네 방정식\">\u003cbutton role=\"tab\" data-tab=\"0\">① 전기 가우스 법칙\u003c/button>\u003cbutton role=\"tab\" data-tab=\"1\">② 자기 가우스 법칙\u003c/button>\u003cbutton role=\"tab\" data-tab=\"2\">③ 패러데이 법칙\u003c/button>\u003cbutton role=\"tab\" data-tab=\"3\">④ 앙페르·맥스웰 법칙\u003c/button>\u003c/nav>\u003cdiv class=\"grid\">\u003csection class=\"card\">\u003ch2 id=\"sceneTitle\">\u003c/h2>\u003ccanvas id=\"scene\" aria-label=\"장과 가상 면의 개념 그림\">\u003c/canvas>\u003cp id=\"sceneCaption\" class=\"hint\">\u003c/p>\u003cp id=\"direction\" class=\"notice\" aria-live=\"polite\">\u003c/p>\u003cp class=\"hint\">정적 순간 상태 모형입니다. 변화율은 현재 순간의 값으로 지정하며 시간 재생은 하지 않습니다. 점·화살표 수는 개념 표현이며 장의 세기에 정확히 비례하지 않습니다.\u003c/p>\u003c/section>\u003csection class=\"card\">\u003ch2>조작 → 실시간 계산\u003c/h2>\u003cdiv id=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cdiv id=\"equation\" class=\"formula\">\u003c/div>\u003cp id=\"substitution\" class=\"hint\">\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"saveA\">조건 A 저장\u003c/button>\u003cbutton id=\"saveB\">조건 B 저장\u003c/button>\u003cbutton id=\"reset\">전체 초기화\u003c/button>\u003c/div>\u003cp id=\"status\" class=\"hint\" aria-live=\"polite\">조건 A와 B는 현재 탭 안에서 비교합니다.\u003c/p>\u003c/section>\u003c/div>\u003csection class=\"card\">\u003ch2>변수 관계 그래프\u003c/h2>\u003cp id=\"graphCaption\" class=\"hint\">\u003c/p>\u003ccanvas id=\"graph\" aria-label=\"입력 변수와 결과의 관계 그래프\">\u003c/canvas>\u003cp class=\"hint\">실선: 이론 관계 · 원: 현재 상태. 시간 변화 그래프가 아닙니다.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>조건\u003c/th>\u003cth>입력\u003c/th>\u003cth>반지름\u003c/th>\u003cth id=\"compareLabel\">결과\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"comparison\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2>예측 → 조작 → 관찰 → 설명\u003c/h2>\u003cp id=\"predict\" class=\"notice\">\u003c/p>\u003cdiv id=\"questions\">\u003c/div>\u003cdetails>\u003csummary>오개념을 조작으로 확인하기\u003c/summary>\u003cdiv id=\"misconception\">\u003c/div>\u003c/details>\u003cdetails>\u003csummary>적용 조건과 모형의 한계\u003c/summary>\u003cdiv id=\"limits\">\u003c/div>\u003c/details>\u003c/section>\u003csection class=\"card\">\u003ch2>네 방정식, 한눈에 연결하기\u003c/h2>\u003cdiv class=\"equations\">\u003cdiv>\u003cb>① 전하가 전기장의 원천\u003c/b>\u003cp class=\"formula\">∯ E · dA = Q\u003csub>안\u003c/sub>/ε₀\u003c/p>\u003cp class=\"hint\">닫힌 면의 바깥쪽을 양의 법선으로 정합니다.\u003c/p>\u003c/div>\u003cdiv>\u003cb>② 순 자기 선속은 0\u003c/b>\u003cp class=\"formula\">∯ B · dA = 0\u003c/p>\u003cp class=\"hint\">닫힌 면에 들어가는 선속과 나오는 선속이 상쇄됩니다.\u003c/p>\u003c/div>\u003cdiv>\u003cb>③ 자기 선속 변화 → 전기장 순환\u003c/b>\u003cp class=\"formula\">∮ E · dl = −dΦ\u003csub>B\u003c/sub>/dt\u003c/p>\u003cp class=\"hint\">고정된 경로에서 정의한 유도 기전력. 부호는 렌츠 법칙을 반영합니다.\u003c/p>\u003c/div>\u003cdiv>\u003cb>④ 전류·전기 선속 변화 → 자기장 순환\u003c/b>\u003cp class=\"formula\">∮ B · dl = μ₀I\u003csub>안\u003c/sub> + μ₀ε₀dΦ\u003csub>E\u003c/sub>/dt\u003c/p>\u003cp class=\"hint\">변위 전류 I\u003csub>d\u003c/sub> = ε₀dΦ\u003csub>E\u003c/sub>/dt. 진공에서의 형태입니다.\u003c/p>\u003c/div>\u003c/div>\u003cdetails>\u003csummary>기호와 전자기파로 이어지는 생각\u003c/summary>\u003cp>E: 전기장(V/m=N/C), B: 자기장(T), Q: 전하(C), I: 전도 전류(A), Φ: 면을 통과하는 선속, dA: 방향을 갖는 면적 요소, dl: 경로 방향의 길이 요소입니다. ∯는 닫힌 면의 합, ∮는 닫힌 경로를 따라 더한 값입니다. 네 실험에서 r은 구 또는 원형 경로의 반지름입니다.\u003c/p>\u003cp>진공 상수 ε₀ = 8.8541878128×10⁻¹² F/m, μ₀ ≈ 1.25663706212×10⁻⁶ H/m를 사용합니다. 두 변화 법칙을 결합하면 진공 전자기파의 속력 c = 1/√(μ₀ε₀) ≈ 3.00×10⁸ m/s를 얻습니다. 이 페이지는 네 대칭 모형을 탐구하며, 전자기파의 전체 전파 과정을 수치적으로 풀지는 않습니다.\u003c/p>\u003c/details>\u003c/section>\u003cfooter>참고: \u003ca href=\"https://openstax.org/books/university-physics-volume-2/pages/16-1-maxwells-equations-and-electromagnetic-waves\" target=\"_blank\" rel=\"noopener\">OpenStax, University Physics Vol. 2, §16.1\u003c/a> · 본 실험실은 인터넷 없이 실행됩니다.\u003c/footer>\u003c/main>\u003cscript>\n'use strict';\nconst EPS=8.8541878128e-12,MU=1.25663706212e-6,PI=Math.PI;\nconst specs=[\n{title:'점전하를 감싼 구면',label:'전하 Q',unit:'nC',min:-10,max:10,step:.1,def:2,rmin:.1,rmax:1,rstep:.01,rdef:.4,output:'전기 선속 ΦE (N·m²/C)',yunit:'N·m²/C',eq:'∯ E · dA = Q/ε₀',caption:'점전하를 중심에 둔 가상의 구면입니다. 그림은 구의 중앙 단면이며 점선은 가우스 면입니다.',predict:'예측: 구면의 반지름을 두 배로 키우면, 전기장과 전체 전기 선속은 각각 어떻게 될까요?',questions:[['기본','전하가 +2 nC에서 +4 nC로 바뀌면 전기 선속은?','선속은 Q/ε₀이므로 두 배입니다. 전기장도 같은 반지름에서 두 배가 됩니다.'],['응용','반지름을 0.4 m에서 0.8 m로 바꾸면?','전기장은 1/r²에 비례하므로 1/4배이고, 구면적은 네 배가 되어 전체 선속은 같습니다.'],['도전','전하가 음수면 전기 선속의 음수 부호는 무엇을 뜻할까요?','바깥쪽 법선을 양으로 정했기 때문에 안으로 향하는 전기장이 음의 선속을 줍니다. 선속은 전기장 크기와 다르게 부호를 가집니다.']],mis:'“면이 커지면 선속이 항상 커진다.” 반지름만 바꾸세요. 점전하의 전기장이 약해지는 효과가 면적 증가를 상쇄합니다.',limit:'진공의 정지 점전하를 중심에 둔 구면, 다른 전하는 없음. Eᵣ = Q/(4πε₀r²)는 방사 방향 성분이고 E의 크기는 |Eᵣ|입니다. 가우스 법칙 자체는 더 일반적이지만 이 계산은 구 대칭을 사용합니다.'},\n{title:'균일 자기장 속의 닫힌 구면',label:'균일 자기장 Bz',unit:'mT',min:-10,max:10,step:.1,def:2,rmin:.1,rmax:1,rstep:.01,rdef:.4,output:'윗반구 선속 Φ위 (Wb)',yunit:'Wb',eq:'∯ B · dA = Φ위 + Φ아래 = 0',caption:'구의 중앙 단면을 그렸습니다. 균일 자기장이 구면을 통과하며, 위·아래 반구의 법선은 각각 바깥쪽입니다.',predict:'예측: 자기장을 두 배로 키우면 닫힌 구면의 순 자기 선속도 두 배가 될까요?',questions:[['기본','Bz = +2 mT일 때 위·아래 반구의 선속 부호는?','위는 +, 아래는 −입니다. 각각 ±Bzπr²이며 합은 0입니다.'],['응용','반지름을 두 배로 키우면 각 반구의 선속은?','투영 면적 πr²이 네 배여서 각 선속의 크기는 네 배, 닫힌 면의 총합은 여전히 0입니다.'],['도전','순 자기 선속이 0이면 자기장도 0인가요?','아닙니다. 자기장 값을 0이 아닌 값으로 바꾸세요. 장이 존재해도 들어오는 선속과 나가는 선속이 상쇄될 수 있습니다.']],mis:'“자기 선속이 0이므로 자기장도 0이다.” Bz를 ±10 mT로 바꾸며 두 반구의 값을 보세요. 순 선속만 0입니다.',limit:'진공에서 공간적으로 균일한 자기장, 닫힌 구면. Φ위 = Bzπr²는 곡면의 실제 면적 2πr²이 아닌 수직 투영 면적을 사용한 적분 결과입니다. 이 법칙은 자기 홀극이 없는 고전 전자기학 모형에 해당합니다.'},\n{title:'변하는 자기장과 원형 전기장',label:'자기장 변화율 dBz/dt',unit:'T/s',min:-5,max:5,step:.1,def:1,rmin:.05,rmax:.5,rstep:.01,rdef:.2,output:'유도 기전력 ℰ (V)',yunit:'V',eq:'∮ E · dl = ℰ = −dΦB/dt',caption:'원판 안의 균일 자기장 변화율을 지정합니다. ⊙는 +z(화면 밖), ⊗는 −z(화면 안) 방향의 “변화”를 뜻하며 현재 B의 방향이 아닙니다.',predict:'예측: 자기장 변화율의 부호를 뒤집으면 순환 전기장의 방향은 어떻게 될까요?',questions:[['기본','dBz/dt = +1 T/s, r = 0.2 m이면 기전력은?','ℰ = −πr²(dBz/dt) = −0.1257 V입니다. +z 법선에 대응하는 반시계 경로가 양의 방향이므로 음수는 시계 방향입니다.'],['응용','반지름이 두 배가 되면 기전력과 접선 전기장은?','기전력은 면적에 비례하여 네 배, Eθ = −r(dBz/dt)/2는 두 배입니다.'],['도전','현재 Bz가 0이어도 유도 전기장이 생길 수 있나요?','가능합니다. 현재 순간 Bz = 0이라도 변화율이 0이 아니면 선속이 변하며 유도 전기장이 존재합니다. 현재 B의 크기만으로 판단할 수 없습니다.']],mis:'“큰 자기장이 있으면 반드시 유도된다.” 이 실험에서 유도를 결정하는 것은 dBz/dt입니다. 변화율을 0으로 두면 기전력이 0이 됩니다. 도선이 없어도 순환 전기장은 존재합니다.',limit:'고정된 원형 경로, 진공, 축 대칭. 반지름 0.5 m의 자기장 영역 내부(r≤0.5 m)만 다룹니다. 현재 순간의 균일한 dBz/dt를 외부에서 지정하는 준정적 모형입니다. +z가 면의 양의 법선, 반시계가 양의 경로. N=1이며 기전력은 고정 경로의 전기장 선적분입니다. 저항을 지정하지 않아 유도 전류는 계산하지 않습니다.'},\n{title:'축전기 틈의 변위 전류',label:'전기장 변화율 dEz/dt',unit:'×10¹² V/(m·s)',min:-10,max:10,step:.1,def:2,rmin:.01,rmax:.1,rstep:.005,rdef:.05,output:'접선 자기장 Bθ (μT)',yunit:'μT',eq:'∮ B · dl = μ₀(I안 + ε₀dΦE/dt)',caption:'원형 평행판 축전기의 틈을 위에서 본 단면입니다. ⊙/⊗는 전기장 “변화율”의 방향입니다. 점선은 자기장 순환을 측정하는 원형 경로입니다.',predict:'예측: 전하가 틈을 가로질러 이동하지 않아도 전기장 변화로 자기장이 생길까요?',questions:[['기본','틈에서 전도 전류가 0일 때 자기장의 원천은?','변하는 전기 선속입니다. I안=0이지만 변위 전류 Id=ε₀πr²(dEz/dt)가 존재하여 자기장이 생깁니다.'],['응용','같은 변화율에서 경로 반지름을 두 배로 키우면?','판 내부에서는 포괄한 변위 전류가 네 배, 경로 길이가 두 배라서 Bθ는 두 배가 됩니다.'],['도전','변위 전류는 전하가 진공 틈을 실제로 가로지르는 전류인가요?','아닙니다. 여기서 Id는 전기 선속 변화에 대응하는 항입니다. 도선의 전도 전류와 축전기 틈의 변위 전류를 함께 고려해야 같은 경계 경로에 대해 일관된 법칙을 얻습니다.']],mis:'“전도 전류가 0이면 자기장도 항상 0이다.” 변화율을 0이 아닌 값으로 바꾸세요. 틈의 전도 전류는 0이어도 Bθ가 생깁니다.',limit:'진공 평행판 축전기, 판 반지름 R=0.10 m, 축 대칭과 균일한 전기장 변화율, 가장자리 효과를 무시하는 준정적 근사. 경로는 판 내부(r≤R). 틈에서는 I안=0, Id는 반지름 r 안의 값입니다. 전체 판의 변위 전류는 ε₀πR²(dEz/dt). +z 법선과 반시계 경로를 양으로 정합니다. 전기장과 자기장의 전체 시간 진화를 동시 계산하지 않습니다.'}\n];\nlet tab=0,states=specs.map(s=>({x:s.def,r:s.rdef})),saved=specs.map(()=>({A:null,B:null}));\nconst $=id=>document.getElementById(id);\nfunction fmt(v){if(Math.abs(v)\u003c1e-16)return '0';return (Math.abs(v)>=1e5||Math.abs(v)\u003c.001)?v.toExponential(4):Number(v.toPrecision(5)).toString();}\nfunction calc(k,x,r){if(k===0){let q=x*1e-9;return {y:q/EPS,second:q/(4*PI*EPS*r*r)};}if(k===1)return {y:x*1e-3*PI*r*r,second:-x*1e-3*PI*r*r};if(k===2)return {y:-PI*r*r*x,second:-r*x/2};let a=x*1e12;return {y:MU*EPS*r*a/2*1e6,second:EPS*PI*r*r*a,total:EPS*PI*.1*.1*a};}\nfunction build(){const s=specs[tab];document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(+b.dataset.tab===tab));b.tabIndex=+b.dataset.tab===tab?0:-1;});$('sceneTitle').textContent=s.title;$('sceneCaption').textContent=s.caption;$('equation').textContent=s.eq;$('predict').textContent=s.predict;$('compareLabel').textContent=s.output;$('controls').innerHTML=`\u003cdiv class=\"control\">\u003clabel for=\"xNumber\">${s.label} (${s.unit})\u003c/label>\u003cdiv class=\"pair\">\u003cinput id=\"xRange\" aria-label=\"${s.label} 슬라이더\" type=\"range\" min=\"${s.min}\" max=\"${s.max}\" step=\"${s.step}\">\u003cinput id=\"xNumber\" type=\"number\" min=\"${s.min}\" max=\"${s.max}\" step=\"${s.step}\">\u003c/div>\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"rNumber\">반지름 r (m)\u003c/label>\u003cdiv class=\"pair\">\u003cinput id=\"rRange\" aria-label=\"반지름 슬라이더\" type=\"range\" min=\"${s.rmin}\" max=\"${s.rmax}\" step=\"${s.rstep}\">\u003cinput id=\"rNumber\" type=\"number\" min=\"${s.rmin}\" max=\"${s.rmax}\" step=\"${s.rstep}\">\u003c/div>\u003c/div>`;\n$('questions').innerHTML=s.questions.map(q=>`\u003cdetails>\u003csummary>${q[0]} 탐구 · ${q[1]}\u003c/summary>\u003cp>${q[2]}\u003c/p>\u003c/details>`).join('');$('misconception').textContent=s.mis;$('limits').textContent=s.limit;\nfor(const key of ['x','r']) for(const kind of ['Range','Number']) $(key+kind).addEventListener('input',e=>{if(e.target.value.trim()===''||!Number.isFinite(e.target.valueAsNumber))return;const lo=key==='x'?s.min:s.rmin,hi=key==='x'?s.max:s.rmax;states[tab][key]=Math.max(lo,Math.min(hi,e.target.valueAsNumber));$(key+(kind==='Range'?'Number':'Range')).value=states[tab][key];if(e.target.valueAsNumber!==states[tab][key])e.target.value=states[tab][key];update();});\nfor(const key of ['x','r']){$(key+'Range').value=states[tab][key];$(key+'Number').value=states[tab][key];$(key+'Number').addEventListener('blur',()=>{$(key+'Number').value=states[tab][key];});}update();}\nfunction update(){const s=specs[tab],{x,r}=states[tab],v=calc(tab,x,r);let m=[],sub='',dir='';if(tab===0){m=[['전기 선속 ΦE',fmt(v.y)+' N·m²/C'],['방사 전기장 Eᵣ',fmt(v.second)+' N/C']];sub=`ΦE = (${fmt(x*1e-9)} C)/ε₀ = ${fmt(v.y)} N·m²/C · Eᵣ = Q/(4πε₀r²)`;dir=x===0?'전하가 0: 이 모형에서는 전기장과 선속 모두 0':x>0?'Q > 0: 전기장은 바깥쪽 →, 전기 선속은 양수':'Q \u003c 0: 전기장은 안쪽 ←, 전기 선속은 음수';}\nelse if(tab===1){m=[['윗반구 선속',fmt(v.y)+' Wb'],['아랫반구 선속',fmt(v.second)+' Wb'],['닫힌 구면 순 선속','0 Wb'],['균일 자기장 Bz',fmt(x)+' mT']];sub=`Φ위 = (${fmt(x*1e-3)} T) × π × (${fmt(r)} m)² = ${fmt(v.y)} Wb; Φ아래 = −Φ위`;dir=x===0?'Bz = 0: 자기장 없음':x>0?'Bz > 0: 위쪽(+z) ↑ · 위로 나가고 아래로 들어옴':'Bz \u003c 0: 아래쪽(−z) ↓ · 아래로 나가고 위로 들어옴';}\nelse if(tab===2){m=[['유도 기전력 ℰ',fmt(v.y)+' V'],['접선 전기장 Eθ',fmt(v.second)+' V/m']];sub=`ℰ = −π × (${fmt(r)} m)² × (${fmt(x)} T/s) = ${fmt(v.y)} V · Eθ = ℰ/(2πr)`;dir=x===0?'변화율 0: 순환 전기장 없음':x>0?'dBz/dt > 0: 순환 E는 시계 방향 ↻ (Eθ \u003c 0)':'dBz/dt \u003c 0: 순환 E는 반시계 방향 ↺ (Eθ > 0)';}\nelse {m=[['접선 자기장 Bθ',fmt(v.y)+' μT'],['r 안의 변위 전류 Id',fmt(v.second)+' A'],['틈의 전도 전류 I안','0 A'],['전체 판 변위 전류',fmt(v.total)+' A']];sub=`Id = ε₀π × (${fmt(r)} m)² × (${fmt(x*1e12)} V/(m·s)) = ${fmt(v.second)} A; Bθ = μ₀Id/(2πr) = ${fmt(v.y)} μT`;dir=x===0?'변화율 0: 이 모형에서는 자기장 없음':x>0?'dEz/dt > 0: +z 방향 변위 전류, B는 반시계 방향 ↺':'dEz/dt \u003c 0: −z 방향 변위 전류, B는 시계 방향 ↻';}\n$('metrics').innerHTML=m.map(a=>`\u003cdiv class=\"metric\">\u003cspan>${a[0]}\u003c/span>\u003cstrong>${a[1]}\u003c/strong>\u003c/div>`).join('');$('substitution').textContent=sub;$('direction').textContent=dir;$('graphCaption').textContent=`가로축: ${s.label} (${s.unit}) · 세로축: ${s.output} · 고정 변수: r = ${fmt(r)} m`;\n$('comparison').innerHTML=['A','B'].map(k=>{const p=saved[tab][k];return `\u003ct ;}\nelse {circle(g,cx,cy,tab===2?116:122,'#30435f');g.fillStyle=tab===2?'#77d9f5':'#ffc66d';g.fillText(sg===0?'변화율 0':sg>0?'⊙ +z 변화':'⊗ −z 변화',cx,cy-15);if(sg){const turn=tab===2?-sg:sg;circle(g,cx,cy,R,tab===2?'#ffc66d':'#77d9f5');for(let i=0;i\u003c4;i++){let a=i*PI/2+PI/4;let xx=cx+R*Math.cos(a),yy=cy-R*Math.sin(a);let dx=-Math.sin(a)*turn,dy=-Math.cos(a)*turn;arrow(g,xx-12*dx,yy-12*dy,xx+12*dx,yy+12*dy,tab===2?'#ffc66d':'#77d9f5');}g.fillStyle='#edf4ff';g.fillText(tab===2?'순환 전기장 E':'순환 자기장 B',cx,h-18);}}}\nfunction drawGraph(){const {g,w,h}=context('graph'),s=specs[tab],{x,r}=states[tab],l=65,t=34,b=h-48,right=w-24,ymax=Math.max(Math.abs(calc(tab,s.max,s.rmax).y),Math.abs(calc(tab,s.min,s.rmax).y),1e-15)*1.15;const px=v=>l+(v-s.min)/(s.max-s.min)*(right-l),py=v=>t+(ymax-v)/(2*ymax)*(b-t);g.fillStyle='#b6c7de';g.textAlign='left';g.fillText(s.yunit,10,18);g.font='12px system-ui';line(g,l,t,l,b,'#506780');line(g,l,py(0),right,py(0),'#506780');for(let i=0;i\u003c3;i++){let y=(1-i)*ymax;g.textAlign='right';g.fillText(fmt(y),l-7,py(y)+4);}for(let v of [s.min,0,s.max]){g.textAlign='center';g.fillText(fmt(v),px(v),b+20);}g.textAlign='center';g.fillText(s.unit,(l+right)/2,h-7);line(g,px(s.min),py(calc(tab,s.min,r).y),px(s.max),py(calc(tab,s.max,r).y),'#a5e7bc');let yy=calc(tab,x,r).y;g.fillStyle='#ffc66d';g.beginPath();g.arc(px(x),py(yy),6,0,2*PI);g.fill();}\ndocument.querySelectorAll('[data-tab]').forEach(b=>{b.addEventListener('click',()=>{tab=+b.dataset.tab;build();$('status').textContent='조건 A와 B는 현재 탭 안에서 비교합니다.';});b.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();tab=e.key==='Home'?0:e.key==='End'?3:(tab+(e.key==='ArrowRight'?1:3))%4;build();document.querySelector(`[data-tab=\"${tab}\"]`).focus();}});});\nfor(const k of ['A','B'])$('save'+k).onclick=()=>{saved[tab][k]={...states[tab]};$('status').textContent='현재 탭의 조건 '+k+'를 저장했습니다. 반지름이 같아야 한 변수의 영향만 비교할 수 있습니다.';update();};\n$('reset').onclick=()=>{s
