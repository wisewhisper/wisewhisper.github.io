ntrol');sim.append(control);}\nlet read=result;\nif(extracted.length){read=read||el('section','wlab-card');if(!result){const h=el('h2','');h.textContent='실시간 결과';read.append(h)}extracted.forEach(n=>read.append(n));}\nif(read){read.classList.add('wlab-result');sim.append(read)}\nif(extra.length){scene.classList.add('wlab-composite');for(const n of extra){n.classList.add('wlab-extra');scene.append(n)}}\nfor(const n of graphs)graph.append(wrap(n));\nfor(const n of concepts)learn.append(wrap(n));\nfor(const n of old){if(!n.contains(scene)&&!n.contains(control)&&!n.contains(read))n.classList.add('wlab-original')}\nfor(const f of [...root.querySelectorAll(':scope>footer'),...document.querySelectorAll('body>footer')])learn.append(f);\nconst buttons=[];\nfunction show(i){tabs.forEach((t,j)=>{const on=i===j;t[1].classList.toggle('wlab-active',on);t[1].inert=!on;t[1].setAttribute('aria-hidden',String(!on));buttons[j].setAttribute('aria-selected',String(on));buttons[j].tabIndex=on?0:-1;});requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')));}\ntabs.forEach((t,i)=>{const b=el('button','');b.type='button';b.id='wlab-tab-'+i;b.textContent=t[0];b.setAttribute('role','tab');b.setAttribute('aria-controls','wlab-panel-'+i);t[1].id='wlab-panel-'+i;t[1].setAttribute('role','tabpanel');t[1].setAttribute('aria-labelledby',b.id);b.addEventListener('click',()=>show(i));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;show(j);buttons[j].focus()});buttons.push(b);nav.append(b);deck.append(t[1]);});\nconst back=el('a','');back.href='index.html';back.textContent='← 실험 목록';nav.append(back);\nshow(0);\n})({\"root\":\"main\",\"scene\":\".grid>section:nth-child(1)\",\"control\":\".grid>section:nth-child(2)\",\"extract\":[\"#metrics\",\"#equation\",\"#substitution\"],\"graph\":[\"main>section:nth-of-type(1)\"],\"concept\":[\"main>section:nth-of-type(2)\",\"main>section:nth-of-type(3)\"],\"old\":[\".grid\"]});\u003c/script>\u003c/body>\u003c/html>\n","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e5eef8;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:10px}article,aside{background:#111e2c;border:1px solid #344c63;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(340px,58dvh,650px);background:#081321;border-radius:8px}button,select{font:inherit;color:#e5eef8;background:#1d3248;border:1px solid #49637d;border-radius:7px;padding:8px;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}label{display:block;min-width:0;font-size:13px}output{float:right;color:#7de8d0}input{width:100%;display:block;accent-color:#64dec4}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.metric{background:#0b2735;border:1px solid #305367;border-radius:8px;padding:8px;font-size:12px;min-width:0}.metric b{display:block;font-size:19px;color:#82e4fa;overflow-wrap:anywhere}p{margin:7px 0;line-height:1.5;color:#bfd2e3}.note{font-size:12px}aside{max-height:calc(100dvh - 24px);overflow:auto}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(340px,51dvh,460px)}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>축전기와 변위 전류\u003c/h2>\u003ccanvas id=\"cv\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"sa\">조건 A\u003c/button>\u003cbutton id=\"sb\">조건 B\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assumption\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const mode=0,$=x=>document.getElementById(x),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI,C=299792458,MU=4*PI*1e-7,EPS=1/(MU*C*C);\nconst base=()=>({a:10,gap:1,I:5,r:5,f:150,E:40,probe:2,dir:1,p:1,dist:8,angle:90,speed:1});\nlet s=base(),t=0,run=false,last=0,W=800,H=440,saved=[null,null];\nconst fmt=(v,n=3)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.001||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString();\nfunction model(p,u){if(mode===0){let a=p.a/100,r=p.r/100,I=p.I*1e-6,A=PI*a*a,cap=EPS*A/(p.gap/1000),Q=I*u*.001,E=Q/(EPS*A),id=I*Math.min(1,r*r/(a*a)),B=MU*id/(2*PI*r);return{cap,Q,E,V:E*p.gap/1000,id,B,I,a,r,flux:E*A,rate:I/(EPS*A)}}let f=p.f*1e6,w=2*PI*f,lambda=C/f,R=p.dist*lambda,alpha=p.angle*PI/180,E0=mode===1?p.E:MU*w*w*p.p*1e-9*Math.abs(Math.sin(alpha))/(4*PI*R),phase=2*PI*(u-(mode===1?p.dir*p.probe/lambda:p.dist)),E=E0*Math.sin(phase),B=E/C,S=E*E/(MU*C);return{lambda,R,E0,B0:E0/C,E,B,S,avg:E0*E0/(2*MU*C),phase,alpha,f}}\nfunction ln(x,y,X,Y,c='#405e76',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=12,align='center'){g.font=size+'px system-ui';g.textAlign=align;g.fillStyle=c;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=30){if(Math.hypot(dx,dy)\u003c1e-15||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.2);ln(X,Y,X-7*Math.cos(a-.5),Y-7*Math.sin(a-.5),c,2.2);ln(X,Y,X-7*Math.cos(a+.5),Y-7*Math.sin(a+.5),c,2.2)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction dot(x,y,r,c){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=c;g.fill()}\nfunction capacitor(m){let x=W*.28,y=H*.29,rx=Math.min(W*.17,H*.18),gap=28+s.gap*3;for(let i of [-1,1]){let yy=y+i*gap/2;g.beginPath();g.ellipse(x,yy,rx,13,0,0,2*PI);g.fillStyle='#7895ab';g.fill();g.strokeStyle='#c6d9e5';g.stroke();for(let j=-3;j\u003c=3;j++)if(m.Q)txt(i===-1?(m.Q>0?'+':'−'):(m.Q>0?'−':'+'),x+j*rx/4,yy+4,'#fff',13)}\nln(x,y-gap/2-13,x,30,'#a9bdcc',4);ln(x,y+gap/2+13,x,y+gap/2+44,'#a9bdcc',4);if(m.I)arr(x,32,0,m.I,'#ffc77a',20);if(m.E)for(let j=-3;j\u003c=3;j++)arr(x+j*rx/4,y-gap*.24,0,m.E,'#6acbfa',gap*.49)txt('도선 전류 I',x,18,'#f5c48c');txt('진공 틈: 전하 통과 없음',x,y+gap/2+62,'#b9d2e5');\nlet cx=W*.73,cy=y,rad=Math.min(W*.18,H*.20),a=rad*s.a/20,r=rad*s.r/20;dot(cx,cy,a,'#344e65');g.beginPath();g.arc(cx,cy,r,0,2*PI);g.strokeStyle='#f4ca7e';g.setLineDash([4,4]);g.lineWidth=2;g.stroke();g.setLineDash([]);if(m.I){for(let j=0;j\u003c8;j++){let q=j*PI/4;arr(cx+r*Math.cos(q),cy+r*Math.sin(q),Math.sin(q)*Math.sign(m.I),-Math.cos(q)*Math.sign(m.I),'#70e3c2',18)}}txt('판을 위에서 본 단면',cx,18);txt('점선 r · 초록 Bθ',cx,cy+rad+20,'#98e9d5');txt('판 반지름 '+s.a+' cm · 경로 '+s.r+' cm',W/2,H*.49);\nlet l=55,right=W-15,top=H*.62,b=H-31,mid=(top+b)/2,lim=.12,X=r=>l+(right-l)*r/20,Y=B=>mid-B/lim*(b-top)/2;for(let j=-2;j\u003c=2;j++){let v=lim*j/2;ln(l,Y(v),right,Y(v),'#2b455e');txt(fmt(v),l-6,Y(v)+4,'#b1c6da',10,'right')}for(let j=0;j\u003c=4;j++)txt(j*5,X(j*5),b+15);for(let [p,col] of [[saved[0],'#f8c27b'],[saved[1],'#df9cc8'],[s,'#69dfc6']]){if(!p)continue;g.beginPath();for(let j=0;j\u003c=200;j++){let r=Math.max(.001,j*.1),v=model({...p,r},t).B*1e9;j?g.lineTo(X(r),Y(v)):g.moveTo(X(r),Y(v))}g.strokeStyle=col;g.lineWidth=2;g.stroke()}dot(X(s.r),Y(m.B*1e9),4,'#ffd17c');txt('Bθ (nT) · 고정축',l,top-8,'#bdd3e4',11,'left');txt('경로 반지름 (cm) · r=0에서 B=0',W/2,H-6)}\nfunction wave(m){let l=37,r=W-20,cy=H*.28,span=r-l,amp=Math.min(62,H*.16),x=d=>l+span*d/6;ln(l,cy,r,cy,'#6a879f');for(let [color,proj] of [['#6acbff',1],['#ffc577',0]]){g.beginPath();for(let j=0;j\u003c=300;j++){let d=6*j/300,v=Math.sin(2*PI*(t-s.dir*d/m.lambda)),q=x(d),yy=cy-v*amp*(proj?1:.38);q+=proj?0:v*amp*.50*s.dir;j?g.lineTo(q,yy):g.moveTo(q,yy)}g.strokeStyle=color;g.lineWidth=2.5;g.stroke()}for(let j=0;j\u003c=12;j++){let d=j*.5,v=Math.sin(2*PI*(t-s.dir*d/m.lambda));if(Math.abs(v)>.02){arr(x(d),cy,0,-v,'#6acbff',Math.abs(v)*amp);arr(x(d),cy,s.dir*v,-v*.76,'#ffc577',Math.abs(v)*amp*.63)}}arr(s.dir>0?r-40:l+40,cy+amp+18,s.dir,0,'#6fe4b7',35);txt('E ⟂ B ⟂ 진행 방향 · E와 B 독립 배율',W/2,17,'#c9deee');ln(x(s.probe),cy-amp-8,x(s.probe),cy+amp+8,'#a9bad1');txt('측정점 '+s.probe+' m',x(s.probe),cy+amp+14);txt('파장 '+fmt(m.lambda)+' m · 공간축 0~6 m',W/2,H*.49)}\nfunction radiation(m){let cx=W*.29,cy=H*.29,R=Math.min(W*.20,H*.20);ln(cx,cy-R,cx,cy+R,'#a6b9ca',3);let y=cy-18*Math.sin(2*PI*t);dot(cx,y,8,'#ff7f87');dot(cx,cy+18*Math.sin(2*PI*t),8,'#6caff7');for(let j=1;j\u003c=3;j++){let r=R*j/3;g.beginPath();g.arc(cx,cy,r,0,2*PI);g.strokeStyle='#497a9e';g.globalAlpha=.5;g.stroke();g.globalAlpha=1}let dx=Math.sin(m.alpha),dy=-Math.cos(m.alpha),px=cx+R*dx,py=cy+R*dy;ln(cx,cy,px,py,'#ffd27b',2);dot(px,py,5,'#ffd27b');txt('진동하는 전기 쌍극자',cx,18);let gx=W*.73,gy=cy,r=Math.min(W*.19,H*.19);g.beginPath();for(let j=0;j\u003c=360;j++){let a=j*PI/180,d=r*Math.sin(a)**2,x=gx+d*Math.sin(a),y=gy-d*Math.cos(a);j?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle='#70dfc4';g.lineWidth=2.5;g.stroke();ln(gx,gy-r,gx,gy+r,'#94aac0');dot(gx+r*Math.sin(m.alpha)**3,gy-r*Math.sin(m.alpha)**2*Math.cos(m.alpha),4,'#ffd27b');txt('각도별 복사 세기 ∝ sin²θ',gx,18);txt('축 방향 0 · 수직 방향 최대',gx,gy+r+19);txt('관측 거리 '+fmt(m.R)+' m ('+s.dist+'λ) · 복사 영역 개념도',W/2,H*.49)}\nfunction signal(m){let l=52,r=W-20,top=H*.61,b=H-32,mid=(top+b)/2,amp=(b-top)/2,X=u=>l+(r-l)*u;for(let v of [-1,0,1]){ln(l,mid-v*amp,r,mid-v*amp,'#304961');txt(v,l-5,mid-v*amp+4,'#b0c6d8',10,'right')}for(let [color,f] of [['#6acbff',v=>v],['#ffc577',v=>v],['#6fe4b7',v=>v*v]]){g.beginPath();for(let j=0;j\u003c=180;j++){let u=j/180,v=m.E0?f(Math.sin(2*PI*u)):0,y=mid-v*amp;j?g.lineTo(X(u),y):g.moveTo(X(u),y)}g.strokeStyle=color;g.lineWidth=color==='#6acbff'?3:1.7;g.setLineDash(color==='#ffc577'?[5,4]:[]);g.stroke();g.setLineDash([])}let phase=((m.phase/(2*PI))%1+1)%1;ln(X(phase),top,X(phase),b,'#f4d68a');for(let j=0;j\u003c=4;j++)txt(j*90+'°',X(j/4),b+16);txt('정규화 E(파랑), B(주황 점선), 에너지 흐름(초록)',W/2,top-8,'#c5d8e8',11);txt('관측점 위상 · 실제 크기는 측정값',W/2,H-6)}\nfunction draw(){let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#152d42');gr.addColorStop(1,'#081321');g.fillStyle=gr;g.fillRect(0,0,W,H);let m=model(s,t);if(mode===0)capacitor(m);else{if(mode===1)wave(m);else radiation(m);signal(m)}}\nfunction summary(p){let m=model(p,t);return mode===0?'I_d '+fmt(m.id*1e6)+' μA · B '+fmt(m.B*1e9)+' nT':'E₀ '+fmt(m.E0)+' V/m · 평균 S '+fmt(m.avg)+' W/m²'}\nfunction update(){let m=model(s,t),rows=mode===0?[['정전 용량',fmt(m.cap*1e12)+' pF'],['전하량',fmt(m.Q*1e9)+' nC'],['전기장',fmt(m.E)+' V/m'],['판 사이 전압',fmt(m.V)+' V'],['도선 전류',fmt(m.I*1e6)+' μA'],['전체 변위 전류',fmt(m.I*1e6)+' μA'],['경로 안 변위 전류',fmt(m.id*1e6)+' μA'],['접선 자기장',fmt(m.B*1e9)+' nT']]:[['진동수',s.f+' MHz'],['파장',fmt(m.lambda)+' m'],['전기장 진폭',fmt(m.E0)+' V/m'],['자기장 진폭',fmt(m.B0*1e9)+' nT'],['순간 전기장',fmt(m.E)+' V/m'],['순간 자기장',fmt(m.B*1e9)+' nT'],['순간 에너지 흐름 크기',fmt(m.S)+' W/m²'],['평균 에너지 흐름 크기',fmt(m.avg)+' W/m²']];$('metrics').innerHTML=rows.map(([n,v])=>'\u003cdiv class=\"metric\">'+n+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('hint').textContent=mode===0?'충전 시간 '+fmt(t)+' ms / 1 ms · 경로가 판을 벗어나면 포함 변위 전류는 일정하고 B는 1/r로 감소합니다.':mode===1?'파동 진행 방향을 반전하고 두 장의 위상 및 에너지 전달 방향을 확인하세요.': '관측 각도와 거리를 바꾸어 복사 세기의 방향성과 거리 의존성을 확인하세요.';draw()}\nfunction slider(k,n,min,max,step){let el=document.createElement('label');el.innerHTML=n+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];update()};$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){slider('a','판 반지름 (cm)',3,15,1);slider('gap','판 간격 (mm)',.5,3,.5);slider('I','도선 전류 (μA)',-10,10,1);slider('r','측정 경로 r (cm)',.5,20,.5)}else{slider('f','진동수 (MHz)',50,500,10);if(mode===1){slider('E','전기장 진폭 (V/m)',0,100,5);slider('probe','관측점 (m)',0,6,.1);slider('dir','진행 방향 (±1)',-1,1,2)}else{slider('p','쌍극자 모멘트 진폭 (nC·m)',.1,2,.1);slider('dist','관측 거리 (파장 배수)',5,20,1);slider('angle','쌍극자 축과 관측 방향 각 (°)',0,180,5)}}slider('speed','관찰 재생 속도 (배)',.25,2,.25);$('formula').textContent=['I_d=ε₀ dΦ_E/dt · Bθ=μ₀ I_d(r)/(2πr)','λ=c/f · E=cB · S=E×B/μ₀ · ⟨S⟩=E₀²/(2μ₀c)','E₀=μ₀ω²p₀|sinθ|/(4πr) · ⟨S⟩∝sin²θ/r²'][mode];$('assumption').textContent=['진공 원형 평행판, 일정 전도 전류, 균일 전기장 및 무시한 가장자리 효과. 준정적 근사. 1 ms 후 관찰 종료. 그래프는 축대칭 틈 내부·외부의 원형 경로 자기장입니다.','진공 단색 평면파. 전기장과 자기장 벡터는 독립 확대했으며, 시간은 주기 단위로 느리게 재생합니다. S는 크기이며 진행 방향은 별도 화살표입니다.','작은 전기 쌍극자의 원거리 복사 근사(r≥5λ), 자유 공간. 근접장과 실제 안테나 전류·손실은 제외. 그림의 파면과 전하 진동은 정성 표현이며, 실제 복사장 진폭과 평균 에너지 흐름은 원거리 해석식으로 계산합니다.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(mode===0&&t>=1)t=0;run=true;last=0};$('pause').onclick=()=>{run=false;last=0};$('step').onclick=()=>{run=false;t=mode===0?Math.min(1,t+.05):(t+.125)%100;update()};$('reset').onclick=()=>{s=base();t=0;run=false;saved=[null,null];build()};['sa','sb'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={...s};update()});function frame(now){if(run){if(last){t+=Math.min(.05,(now-last)/1000)*s.speed*.25;if(mode===0&&t>=1){t=1;run=false}else if(mode!==0)t%=100}last=now;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden){run=false;last=0}});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e5eef8;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:10px}article,aside{background:#111e2c;border:1px solid #344c63;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(340px,58dvh,650px);background:#081321;border-radius:8px}button,select{font:inherit;color:#e5eef8;background:#1d3248;border:1px solid #49637d;border-radius:7px;padding:8px;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}label{display:block;min-width:0;font-size:13px}output{float:right;color:#7de8d0}input{width:100%;display:block;accent-color:#64dec4}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.metric{background:#0b2735;border:1px solid #305367;border-radius:8px;padding:8px;font-size:12px;min-width:0}.metric b{display:block;font-size:19px;color:#82e4fa;overflow-wrap:anywhere}p{margin:7px 0;line-height:1.5;color:#bfd2e3}.note{font-size:12px}aside{max-height:calc(100dvh - 24px);overflow:auto}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(340px,51dvh,460px)}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>전자기파와 에너지\u003c/h2>\u003ccanvas id=\"cv\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"sa\">조건 A\u003c/button>\u003cbutton id=\"sb\">조건 B\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assumption\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const mode=1,$=x=>document.getElementById(x),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI,C=299792458,MU=4*PI*1e-7,EPS=1/(MU*C*C);\nconst base=()=>({a:10,gap:1,I:5,r:5,f:150,E:40,probe:2,dir:1,p:1,dist:8,angle:90,speed:1});\nlet s=base(),t=0,run=false,last=0,W=800,H=440,saved=[null,null];\nconst fmt=(v,n=3)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.001||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString();\nfunction model(p,u){if(mode===0){let a=p.a/100,r=p.r/100,I=p.I*1e-6,A=PI*a*a,cap=EPS*A/(p.gap/1000),Q=I*u*.001,E=Q/(EPS*A),id=I*Math.min(1,r*r/(a*a)),B=MU*id/(2*PI*r);return{cap,Q,E,V:E*p.gap/1000,id,B,I,a,r,flux:E*A,rate:I/(EPS*A)}}let f=p.f*1e6,w=2*PI*f,lambda=C/f,R=p.dist*lambda,alpha=p.angle*PI/180,E0=mode===1?p.E:MU*w*w*p.p*1e-9*Math.abs(Math.sin(alpha))/(4*PI*R),phase=2*PI*(u-(mode===1?p.dir*p.probe/lambda:p.dist)),E=E0*Math.sin(phase),B=E/C,S=E*E/(MU*C);return{lambda,R,E0,B0:E0/C,E,B,S,avg:E0*E0/(2*MU*C),phase,alpha,f}}\nfunction ln(x,y,X,Y,c='#405e76',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=12,align='center'){g.font=size+'px system-ui';g.textAlign=align;g.fillStyle=c;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=30){if(Math.hypot(dx,dy)\u003c1e-15||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.2);ln(X,Y,X-7*Math.cos(a-.5),Y-7*Math.sin(a-.5),c,2.2);ln(X,Y,X-7*Math.cos(a+.5),Y-7*Math.sin(a+.5),c,2.2)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction dot(x,y,r,c){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=c;g.fill()}\nfunction capacitor(m){let x=W*.28,y=H*.29,rx=Math.min(W*.17,H*.18),gap=28+s.gap*3;for(let i of [-1,1]){let yy=y+i*gap/2;g.beginPath();g.ellipse(x,yy,rx,13,0,0,2*PI);g.fillStyle='#7895ab';g.fill();g.strokeStyle='#c6d9e5';g.stroke();for(let j=-3;j\u003c=3;j++)if(m.Q)txt(i===-1?(m.Q>0?'+':'−'):(m.Q>0?'−':'+'),x+j*rx/4,yy+4,'#fff',13)}\nln(x,y-gap/2-13,x,30,'#a9bdcc',4);ln(x,y+gap/2+13,x,y+gap/2+44,'#a9bdcc',4);if(m.I){arr(x,32,0,m.I,'#ffc77a',20);for(let j=-3;j\u003c=3;j++)arr(x+j*rx/4,y-gap*.24,0,m.E,'#6acbfa',gap*.49)}txt('도선 전류 I',x,18,'#f5c48c');txt('진공 틈: 전하 통과 없음',x,y+gap/2+62,'#b9d2e5');\nlet cx=W*.73,cy=y,rad=Math.min(W*.18,H*.20),a=rad*s.a/20,r=rad*s.r/20;dot(cx,cy,a,'#344e65');g.beginPath();g.arc(cx,cy,r,0,2*PI);g.strokeStyle='#f4ca7e';g.setLineDash([4,4]);g.lineWidth=2;g.stroke();g.setLineDash([]);if(m.I){for(let j=0;j\u003c8;j++){let q=j*PI/4;arr(cx+r*Math.cos(q),cy+r*Math.sin(q),Math.sin(q)*Math.sign(m.I),-Math.cos(q)*Math.sign(m.I),'#70e3c2',18)}}txt('판을 위에서 본 단면',cx,18);txt('점선 r · 초록 Bθ',cx,cy+rad+20,'#98e9d5');txt('판 반지름 '+s.a+' cm · 경로 '+s.r+' cm',W/2,H*.49);\nlet l=55,right=W-15,top=H*.62,b=H-31,mid=(top+b)/2,lim=.12,X=r=>l+(right-l)*r/20,Y=B=>mid-B/lim*(b-top)/2;for(let j=-2;j\u003c=2;j++){let v=lim*j/2;ln(l,Y(v),right,Y(v),'#2b455e');txt(fmt(v),l-6,Y(v)+4,'#b1c6da',10,'right')}for(let j=0;j\u003c=4;j++)txt(j*5,X(j*5),b+15);for(let [p,col] of [[saved[0],'#f8c27b'],[saved[1],'#df9cc8'],[s,'#69dfc6']]){if(!p)continue;g.beginPath();for(let j=0;j\u003c=200;j++){let r=Math.max(.001,j*.1),v=model({...p,r},t).B*1e9;j?g.lineTo(X(r),Y(v)):g.moveTo(X(r),Y(v))}g.strokeStyle=col;g.lineWidth=2;g.stroke()}dot(X(s.r),Y(m.B*1e9),4,'#ffd17c');txt('Bθ (nT) · 고정축',l,top-8,'#bdd3e4',11,'left');txt('경로 반지름 (cm) · r=0에서 B=0',W/2,H-6)}\nfunction wave(m){let l=37,r=W-20,cy=H*.28,span=r-l,amp=Math.min(62,H*.16),x=d=>l+span*d/6;ln(l,cy,r,cy,'#6a879f');for(let [color,proj] of [['#6acbff',1],['#ffc577',0]]){g.beginPath();for(let j=0;j\u003c=300;j++){let d=6*j/300,v=Math.sin(2*PI*(t-s.dir*d/m.lambda)),q=x(d),yy=cy-v*amp*(proj?1:.38);q+=proj?0:v*amp*.50*s.dir;j?g.lineTo(q,yy):g.moveTo(q,yy)}g.strokeStyle=color;g.lineWidth=2.5;g.stroke()}for(let j=0;j\u003c=12;j++){let d=j*.5,v=Math.sin(2*PI*(t-s.dir*d/m.lambda));if(Math.abs(v)>.02){arr(x(d),cy,0,-v,'#6acbff',Math.abs(v)*amp);arr(x(d),cy,s.dir*v,-v*.76,'#ffc577',Math.abs(v)*amp*.63)}}arr(s.dir>0?r-40:l+40,cy+amp+18,s.dir,0,'#6fe4b7',35);txt('E ⟂ B ⟂ 진행 방향 · E와 B 독립 배율',W/2,17,'#c9deee');ln(x(s.probe),cy-amp-8,x(s.probe),cy+amp+8,'#a9bad1');txt('측정점 '+s.probe+' m',x(s.probe),cy+amp+14);txt('파장 '+fmt(m.lambda)+' m · 공간축 0~6 m',W/2,H*.49)}\nfunction radiation(m){let cx=W*.29,cy=H*.29,R=Math.min(W*.20,H*.20);ln(cx,cy-R,cx,cy+R,'#a6b9ca',3);let y=cy-18*Math.sin(2*PI*t);dot(cx,y,8,'#ff7f87');dot(cx,cy+18*Math.sin(2*PI*t),8,'#6caff7');for(let j=1;j\u003c=3;j++){let r=R*j/3;g.beginPath();g.arc(cx,cy,r,0,2*PI);g.strokeStyle='#497a9e';g.globalAlpha=.5;g.stroke();g.globalAlpha=1}let dx=Math.sin(m.alpha),dy=-Math.cos(m.alpha),px=cx+R*dx,py=cy+R*dy;ln(cx,cy,px,py,'#ffd27b',2);dot(px,py,5,'#ffd27b');txt('진동하는 전기 쌍극자',cx,18);let gx=W*.73,gy=cy,r=Math.min(W*.19,H*.19);g.beginPath();for(let j=0;j\u003c=360;j++){let a=j*PI/180,d=r*Math.sin(a)**2,x=gx+d*Math.sin(a),y=gy-d*Math.cos(a);j?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle='#70dfc4';g.lineWidth=2.5;g.stroke();ln(gx,gy-r,gx,gy+r,'#94aac0');dot(gx+r*Math.sin(m.alpha)**3,gy-r*Math.sin(m.alpha)**2*Math.cos(m.alpha),4,'#ffd27b');txt('각도별 복사 세기 ∝ sin²θ',gx,18);txt('축 방향 0 · 수직 방향 최대',gx,gy+r+19);txt('관측 거리 '+fmt(m.R)+' m ('+s.dist+'λ) · 복사 영역 개념도',W/2,H*.49)}\nfunction signal(m){let l=52,r=W-20,top=H*.61,b=H-32,mid=(top+b)/2,amp=(b-top)/2,X=u=>l+(r-l)*u;for(let v of [-1,0,1]){ln(l,mid-v*amp,r,mid-v*amp,'#304961');txt(v,l-5,mid-v*amp+4,'#b0c6d8',10,'right')}for(let [color,f] of [['#6acbff',v=>v],['#ffc577',v=>v],['#6fe4b7',v=>v*v]]){g.beginPath();for(let j=0;j\u003c=180;j++){let u=j/180,v=m.E0?f(Math.sin(2*PI*u)):0,y=mid-v*amp;j?g.lineTo(X(u),y):g.moveTo(X(u),y)}g.strokeStyle=color;g.lineWidth=color==='#6acbff'?3:1.7;g.setLineDash(color==='#ffc577'?[5,4]:[]);g.stroke();g.setLineDash([])}let phase=((m.phase/(2*PI))%1+1)%1;ln(X(phase),top,X(phase),b,'#f4d68a');for(let j=0;j\u003c=4;j++)txt(j*90+'°',X(j/4),b+16);txt('정규화 E(파랑), B(주황 점선), 에너지 흐름(초록)',W/2,top-8,'#c5d8e8',11);txt('관측점 위상 · 실제 크기는 측정값',W/2,H-6)}\nfunction draw(){let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#152d42');gr.addColorStop(1,'#081321');g.fillStyle=gr;g.fillRect(0,0,W,H);let m=model(s,t);if(mode===0)capacitor(m);else{if(mode===1)wave(m);else radiation(m);signal(m)}}\nfunction summary(p){let m=model(p,t);return mode===0?'I_d '+fmt(m.id*1e6)+' μA · B '+fmt(m.B*1e9)+' nT':'E₀ '+fmt(m.E0)+' V/m · 평균 S '+fmt(m.avg)+' W/m²'}\nfunction update(){let m=model(s,t),rows=mode===0?[['정전 용량',fmt(m.cap*1e12)+' pF'],['전하량',fmt(m.Q*1e9)+' nC'],['전기장',fmt(m.E)+' V/m'],['판 사이 전압',fmt(m.V)+' V'],['도선 전류',fmt(m.I*1e6)+' μA'],['전체 변위 전류',fmt(m.I*1e6)+' μA'],['경로 안 변위 전류',fmt(m.id*1e6)+' μA'],['접선 자기장',fmt(m.B*1e9)+' nT']]:[['진동수',s.f+' MHz'],['파장',fmt(m.lambda)+' m'],['전기장 진폭',fmt(m.E0)+' V/m'],['자기장 진폭',fmt(m.B0*1e9)+' nT'],['순간 전기장',fmt(m.E)+' V/m'],['순간 자기장',fmt(m.B*1e9)+' nT'],['순간 에너지 흐름 크기',fmt(m.S)+' W/m²'],['평균 에너지 흐름 크기',fmt(m.avg)+' W/m²']];$('metrics').innerHTML=rows.map(([n,v])=>'\u003cdiv class=\"metric\">'+n+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('hint').textContent=mode===0?'충전 시간 '+fmt(t)+' ms / 1 ms · 경로가 판을 벗어나면 포함 변위 전류는 일정하고 B는 1/r로 감소합니다.':mode===1?'파동 진행 방향을 반전하고 두 장의 위상 및 에너지 전달 방향을 확인하세요.': '관측 각도와 거리를 바꾸어 복사 세기의 방향성과 거리 의존성을 확인하세요.';draw()}\nfunction slider(k,n,min,max,step){let el=document.createElement('label');el.innerHTML=n+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];update()};$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){slider('a','판 반지름 (cm)',3,15,1);slider('gap','판 간격 (mm)',.5,3,.5);slider('I','도선 전류 (μA)',-10,10,1);slider('r','측정 경로 r (cm)',.5,20,.5)}else{slider('f','진동수 (MHz)',50,500,10);if(mode===1){slider('E','전기장 진폭 (V/m)',0,100,5);slider('probe','관측점 (m)',0,6,.1);slider('dir','진행 방향 (±1)',-1,1,2)}else{slider('p','쌍극자 모멘트 진폭 (nC·m)',.1,2,.1);slider('dist','관측 거리 (파장 배수)',5,20,1);slider('angle','쌍극자 축과 관측 방향 각 (°)',0,180,5)}}slider('speed','관찰 재생 속도 (배)',.25,2,.25);$('formula').textContent=['I_d=ε₀ dΦ_E/dt · Bθ=μ₀ I_d(r)/(2πr)','λ=c/f · E=cB · S=E×B/μ₀ · ⟨S⟩=E₀²/(2μ₀c)','E₀=μ₀ω²p₀|sinθ|/(4πr) · ⟨S⟩∝sin²θ/r²'][mode];$('assumption').textContent=['진공 원형 평행판, 일정 전도 전류, 균일 전기장 및 무시한 가장자리 효과. 준정적 근사. 1 ms 후 관찰 종료. 그래프는 축대칭 틈 내부·외부의 원형 경로 자기장입니다.','진공 단색 평면파. 전기장과 자기장 벡터는 독립 확대했으며, 시간은 주기 단위로 느리게 재생합니다. S는 크기이며 진행 방향은 별도 화살표입니다.','작은 전기 쌍극자의 원거리 복사 근사(r≥5λ), 자유 공간. 근접장과 실제 안테나 전류·손실은 제외. 그림의 파면과 전하 진동은 정성 표현이며, 실제 복사장 진폭과 평균 에너지 흐름은 원거리 해석식으로 계산합니다.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(mode===0&&t>=1)t=0;run=true;last=0};$('pause').onclick=()=>{run=false;last=0};$('step').onclick=()=>{run=false;t=mode===0?Math.min(1,t+.05):(t+.125)%100;update()};$('reset').onclick=()=>{s=base();t=0;run=false;saved=[null,null];build()};['sa','sb'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={...s};update()});function frame(now){if(run){if(last){t+=Math.min(.05,(now-last)/1000)*s.speed*.25;if(mode===0&&t>=1){t=1;run=false}else if(mode!==0)t%=100}last=now;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden){run=false;last=0}});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e5eef8;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:10px}article,aside{background:#111e2c;border:1px solid #344c63;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(340px,58dvh,650px);background:#081321;border-radius:8px}button,select{font:inherit;color:#e5eef8;background:#1d3248;border:1px solid #49637d;border-radius:7px;padding:8px;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}label{display:block;min-width:0;font-size:13px}output{float:right;color:#7de8d0}input{width:100%;display:block;accent-color:#64dec4}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.metric{background:#0b2735;border:1px solid #305367;border-radius:8px;padding:8px;font-size:12px;min-width:0}.metric b{display:block;font-size:19px;color:#82e4fa;overflow-wrap:anywhere}p{margin:7px 0;line-height:1.5;color:#bfd2e3}.note{font-size:12px}aside{max-height:calc(100dvh - 24px);overflow:auto}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(340px,51dvh,460px)}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>진동 전하와 복사\u003c/h2>\u003ccanvas id=\"cv\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"sa\">조건 A\u003c/button>\u003cbutton id=\"sb\">조건 B\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assumption\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const mode=2,$=x=>document.getElementById(x),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI,C=299792458,MU=4*PI*1e-7,EPS=1/(MU*C*C);\nconst base=()=>({a:10,gap:1,I:5,r:5,f:150,E:40,probe:2,dir:1,p:1,dist:8,angle:90,speed:1});\nlet s=base(),t=0,run=false,last=0,W=800,H=440,saved=[null,null];\nconst fmt=(v,n=3)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.001||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString();\nfunction model(p,u){if(mode===0){let a=p.a/100,r=p.r/100,I=p.I*1e-6,A=PI*a*a,cap=EPS*A/(p.gap/1000),Q=I*u*.001,E=Q/(EPS*A),id=I*Math.min(1,r*r/(a*a)),B=MU*id/(2*PI*r);return{cap,Q,E,V:E*p.gap/1000,id,B,I,a,r,flux:E*A,rate:I/(EPS*A)}}let f=p.f*1e6,w=2*PI*f,lambda=C/f,R=p.dist*lambda,alpha=p.angle*PI/180,E0=mode===1?p.E:MU*w*w*p.p*1e-9*(p.angle===0||p.angle===180?0:Math.abs(Math.sin(alpha)))/(4*PI*R),phase=2*PI*(u-(mode===1?p.dir*p.probe/lambda:p.dist)),E=E0*Math.sin(phase),B=E/C,S=E*E/(MU*C);return{lambda,R,E0,B0:E0/C,E,B,S,avg:E0*E0/(2*MU*C),phase,alpha,f}}\nfunction ln(x,y,X,Y,c='#405e76',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=12,align='center'){g.font=size+'px system-ui';g.textAlign=align;g.fillStyle=c;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=30){if(Math.hypot(dx,dy)\u003c1e-15||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.2);ln(X,Y,X-7*Math.cos(a-.5),Y-7*Math.sin(a-.5),c,2.2);ln(X,Y,X-7*Math.cos(a+.5),Y-7*Math.sin(a+.5),c,2.2)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction dot(x,y,r,c){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=c;g.fill()}\nfunction capacitor(m){let x=W*.28,y=H*.29,rx=Math.min(W*.17,H*.18),gap=28+s.gap*3;for(let i of [-1,1]){let yy=y+i*gap/2;g.beginPath();g.ellipse(x,yy,rx,13,0,0,2*PI);g.fillStyle='#7895ab';g.fill();g.strokeStyle='#c6d9e5';g.stroke();for(let j=-3;j\u003c=3;j++)if(m.Q)txt(i===-1?(m.Q>0?'+':'−'):(m.Q>0?'−':'+'),x+j*rx/4,yy+4,'#fff',13)}\nln(x,y-gap/2-13,x,30,'#a9bdcc',4);ln(x,y+gap/2+13,x,y+gap/2+44,'#a9bdcc',4);if(m.I){arr(x,32,0,m.I,'#ffc77a',20);for(let j=-3;j\u003c=3;j++)arr(x+j*rx/4,y-gap*.24,0,m.E,'#6acbfa',gap*.49)}txt('도선 전류 I',x,18,'#f5c48c');txt('진공 틈: 전하 통과 없음',x,y+gap/2+62,'#b9d2e5');\nlet cx=W*.73,cy=y,rad=Math.min(W*.18,H*.20),a=rad*s.a/20,r=rad*s.r/20;dot(cx,cy,a,'#344e65');g.beginPath();g.arc(cx,cy,r,0,2*PI);g.strokeStyle='#f4ca7e';g.setLineDash([4,4]);g.lineWidth=2;g.stroke();g.setLineDash([]);if(m.I){for(let j=0;j\u003c8;j++){let q=j*PI/4;arr(cx+r*Math.cos(q),cy+r*Math.sin(q),Math.sin(q)*Math.sign(m.I),-Math.cos(q)*Math.sign(m.I),'#70e3c2',18)}}txt('판을 위에서 본 단면',cx,18);txt('점선 r · 초록 Bθ',cx,cy+rad+20,'#98e9d5');txt('판 반지름 '+s.a+' cm · 경로 '+s.r+' cm',W/2,H*.49);\nlet l=55,right=W-15,top=H*.62,b=H-31,mid=(top+b)/2,lim=.12,X=r=>l+(right-l)*r/20,Y=B=>mid-B/lim*(b-top)/2;for(let j=-2;j\u003c=2;j++){let v=lim*j/2;ln(l,Y(v),right,Y(v),'#2b455e');txt(fmt(v),l-6,Y(v)+4,'#b1c6da',10,'right')}for(let j=0;j\u003c=4;j++)txt(j*5,X(j*5),b+15);for(let [p,col] of [[saved[0],'#f8c27b'],[saved[1],'#df9cc8'],[s,'#69dfc6']]){if(!p)continue;g.beginPath();for(let j=0;j\u003c=200;j++){let r=Math.max(.001,j*.1),v=model({...p,r},t).B*1e9;j?g.lineTo(X(r),Y(v)):g.moveTo(X(r),Y(v))}g.strokeStyle=col;g.lineWidth=2;g.stroke()}dot(X(s.r),Y(m.B*1e9),4,'#ffd17c');txt('Bθ (nT) · 고정축',l,top-8,'#bdd3e4',11,'left');txt('경로 반지름 (cm) · r=0에서 B=0',W/2,H-6)}\nfunction wave(m){let l=37,r=W-20,cy=H*.28,span=r-l,amp=Math.min(62,H*.16),x=d=>l+span*d/6;ln(l,cy,r,cy,'#6a879f');for(let [color,proj] of [['#6acbff',1],['#ffc577',0]]){g.beginPath();for(let j=0;j\u003c=300;j++){let d=6*j/300,v=Math.sin(2*PI*(t-s.dir*d/m.lambda)),q=x(d),yy=cy-v*amp*(proj?1:.38);q+=proj?0:v*amp*.50*s.dir;j?g.lineTo(q,yy):g.moveTo(q,yy)}g.strokeStyle=color;g.lineWidth=2.5;g.stroke()}for(let j=0;j\u003c=12;j++){let d=j*.5,v=Math.sin(2*PI*(t-s.dir*d/m.lambda));if(Math.abs(v)>.02){arr(x(d),cy,0,-v,'#6acbff',Math.abs(v)*amp);arr(x(d),cy,s.dir*v,-v*.76,'#ffc577',Math.abs(v)*amp*.63)}}arr(s.dir>0?r-40:l+40,cy+amp+18,s.dir,0,'#6fe4b7',35);txt('E ⟂ B ⟂ 진행 방향 · E와 B 독립 배율',W/2,17,'#c9deee');ln(x(s.probe),cy-amp-8,x(s.probe),cy+amp+8,'#a9bad1');txt('측정점 '+s.probe+' m',x(s.probe),cy+amp+14);txt('파장 '+fmt(m.lambda)+' m · 공간축 0~6 m',W/2,H*.49)}\nfunction radiation(m){let cx=W*.29,cy=H*.29,R=Math.min(W*.20,H*.20);ln(cx,cy-R,cx,cy+R,'#a6b9ca',3);let y=cy-18*Math.sin(2*PI*t);dot(cx,y,8,'#ff7f87');dot(cx,cy+18*Math.sin(2*PI*t),8,'#6caff7');for(let j=1;j\u003c=3;j++){let r=R*j/3;g.beginPath();g.arc(cx,cy,r,0,2*PI);g.strokeStyle='#497a9e';g.globalAlpha=.5;g.stroke();g.globalAlpha=1}let dx=Math.sin(m.alpha),dy=-Math.cos(m.alpha),px=cx+R*dx,py=cy+R*dy;ln(cx,cy,px,py,'#ffd27b',2);dot(px,py,5,'#ffd27b');txt('진동하는 전기 쌍극자',cx,18);let gx=W*.73,gy=cy,r=Math.min(W*.19,H*.19);g.beginPath();for(let j=0;j\u003c=360;j++){let a=j*PI/180,d=r*Math.sin(a)**2,x=gx+d*Math.sin(a),y=gy-d*Math.cos(a);j?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle='#70dfc4';g.lineWidth=2.5;g.stroke();ln(gx,gy-r,gx,gy+r,'#94aac0');dot(gx+r*Math.sin(m.alpha)**3,gy-r*Math.sin(m.alpha)**2*Math.cos(m.alpha),4,'#ffd27b');txt('각도별 복사 세기 ∝ sin²θ',gx,18);txt('축 방향 0 · 수직 방향 최대',gx,gy+r+19);txt('관측 거리 '+fmt(m.R)+' m ('+s.dist+'λ) · 복사 영역 개념도',W/2,H*.49)}\nfunction signal(m){let l=52,r=W-20,top=H*.61,b=H-32,mid=(top+b)/2,amp=(b-top)/2,X=u=>l+(r-l)*u;for(let v of [-1,0,1]){ln(l,mid-v*amp,r,mid-v*amp,'#304961');txt(v,l-5,mid-v*amp+4,'#b0c6d8',10,'right')}for(let [color,f] of [['#6acbff',v=>v],['#ffc577',v=>v],['#6fe4b7',v=>v*v]]){g.beginPath();for(let j=0;j\u003c=180;j++){let u=j/180,v=m.E0?f(Math.sin(2*PI*u)):0,y=mid-v*amp;j?g.lineTo(X(u),y):g.moveTo(X(u),y)}g.strokeStyle=color;g.lineWidth=color==='#6acbff'?3:1.7;g.setLineDash(color==='#ffc577'?[5,4]:[]);g.stroke();g.setLineDash([])}let phase=((m.phase/(2*PI))%1+1)%1;ln(X(phase),top,X(phase),b,'#f4d68a');for(let j=0;j\u003c=4;j++)txt(j*90+'°',X(j/4),b+16);txt('정규화 E(파랑), B(주황 점선), 에너지 흐름(초록)',W/2,top-8,'#c5d8e8',11);txt('관측점 위상 · 실제 크기는 측정값',W/2,H-6)}\nfunction draw(){let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#152d42');gr.addColorStop(1,'#081321');g.fillStyle=gr;g.fillRect(0,0,W,H);let m=model(s,t);if(mode===0)capacitor(m);else{if(mode===1)wave(m);else radiation(m);signal(m)}}\nfunction summary(p){let m=model(p,t);return mode===0?'I_d '+fmt(m.id*1e6)+' μA · B '+fmt(m.B*1e9)+' nT':'E₀ '+fmt(m.E0)+' V/m · 평균 S '+fmt(m.avg)+' W/m²'}\nfunction update(){let m=model(s,t),rows=mode===0?[['정전 용량',fmt(m.cap*1e12)+' pF'],['전하량',fmt(m.Q*1e9)+' nC'],['전기장',fmt(m.E)+' V/m'],['판 사이 전압',fmt(m.V)+' V'],['도선 전류',fmt(m.I*1e6)+' μA'],['전체 변위 전류',fmt(m.I*1e6)+' μA'],['경로 안 변위 전류',fmt(m.id*1e6)+' μA'],['접선 자기장',fmt(m.B*1e9)+' nT']]:[['진동수',s.f+' MHz'],['파장',fmt(m.lambda)+' m'],['전기장 진폭',fmt(m.E0)+' V/m'],['자기장 진폭',fmt(m.B0*1e9)+' nT'],['순간 전기장',fmt(m.E)+' V/m'],['순간 자기장',fmt(m.B*1e9)+' nT'],['순간 에너지 흐름 크기',fmt(m.S)+' W/m²'],['평균 에너지 흐름 크기',fmt(m.avg)+' W/m²']];$('metrics').innerHTML=rows.map(([n,v])=>'\u003cdiv class=\"metric\">'+n+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('hint').textContent=mode===0?'충전 시간 '+fmt(t)+' ms / 1 ms · 경로가 판을 벗어나면 포함 변위 전류는 일정하고 B는 1/r로 감소합니다.':mode===1?'파동 진행 방향을 반전하고 두 장의 위상 및 에너지 전달 방향을 확인하세요.': '관측 각도와 거리를 바꾸어 복사 세기의 방향성과 거리 의존성을 확인하세요.';draw()}\nfunction slider(k,n,min,max,step){let el=document.createElement('label');el.innerHTML=n+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];update()};$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){slider('a','판 반지름 (cm)',3,15,1);slider('gap','판 간격 (mm)',.5,3,.5);slider('I','도선 전류 (μA)',-10,10,1);slider('r','측정 경로 r (cm)',.5,20,.5)}else{slider('f','진동수 (MHz)',50,500,10);if(mode===1){slider('E','전기장 진폭 (V/m)',0,100,5);slider('probe','관측점 (m)',0,6,.1);slider('dir','진행 방향 (±1)',-1,1,2)}else{slider('p','쌍극자 모멘트 진폭 (nC·m)',.1,2,.1);slider('dist','관측 거리 (파장 배수)',5,20,1);slider('angle','쌍극자 축과 관측 방향 각 (°)',0,180,5)}}slider('speed','관찰 재생 속도 (배)',.25,2,.25);$('formula').textContent=['I_d=ε₀ dΦ_E/dt · Bθ=μ₀ I_d(r)/(2πr)','λ=c/f · E=cB · S=E×B/μ₀ · ⟨S⟩=E₀²/(2μ₀c)','E₀=μ₀ω²p₀|sinθ|/(4πr) · ⟨S⟩∝sin²θ/r²'][mode];$('assumption').textContent=['진공 원형 평행판, 일정 전도 전류, 균일 전기장 및 무시한 가장자리 효과. 준정적 근사. 1 ms 후 관찰 종료. 그래프는 축대칭 틈 내부·외부의 원형 경로 자기장입니다.','진공 단색 평면파. 전기장과 자기장 벡터는 독립 확대했으며, 시간은 주기 단위로 느리게 재생합니다. S는 크기이며 진행 방향은 별도 화살표입니다.','작은 전기 쌍극자의 원거리 복사 근사(r≥5λ), 자유 공간. 근접장과 실제 안테나 전류·손실은 제외. 그림의 파면과 전하 진동은 정성 표현이며, 실제 복사장 진폭과 평균 에너지 흐름은 원거리 해석식으로 계산합니다.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(mode===0&&t>=1)t=0;run=true;last=0};$('pause').onclick=()=>{run=false;last=0};$('step').onclick=()=>{run=false;t=mode===0?Math.min(1,t+.05):(t+.125)%100;update()};$('reset').onclick=()=>{s=base();t=0;run=false;saved=[null,null];build()};['sa','sb'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={...s};update()});function frame(now){if(run){if(last){t+=Math.min(.05,(now-last)/1000)*s.speed*.25;if(mode===0&&t>=1){t=1;run=false}else if(mode!==0)t%=100}last=now;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden){run=false;last=0}});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003cmeta charset=\"utf-8\">\u003cstyle>body{background:#081321;color:#e5eef8;font:16px/1.7 system-ui;margin:20px auto;padding:0 16px;max-width:960px}h2{color:#80e6cf}p{color:#c6d9e9}table{border-collapse:collapse;width:100%}td,th{border:1px solid #466077;padding:9px;text-align:left}\u003c/style>\u003ch2>맥스웰 방정식: 네 가지 법칙\u003c/h2>\u003ctable>\u003ctr>\u003cth>법칙\u003c/th>\u003cth>적분형\u003c/th>\u003cth>의미\u003c/th>\u003c/tr>\u003ctr>\u003ctd>전기 가우스\u003c/td>\u003ctd>∯E·dA=Q안/ε₀\u003c/td>\u003ctd>전하와 닫힌 면의 전기 선속\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자기 가우스\u003c/td>\u003ctd>∯B·dA=0\u003c/td>\u003ctd>닫힌 면의 순 자기 선속은 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>패러데이\u003c/td>\u003ctd>∮E·dl=−dΦB/dt\u003c/td>\u003ctd>변하는 자기장이 순환 전기장을 만듦\u003c/td>\u003c/tr>\u003ctr>\u003ctd>암페어·맥스웰\u003c/td>\u003ctd>∮B·dl=μ₀(I안+ε₀dΦE/dt)\u003c/td>\u003ctd>전류와 변하는 전기장이 자기장 순환과 연결\u003c/td>\u003c/tr>\u003c/table>\u003ch2>축전기의 변위 전류\u003c/h2>\u003cp>도선의 전도 전류와 축전기 틈의 전체 변위 전류는 이상적인 충전 과정에서 같습니다. 이는 진공 틈을 전하가 직접 통과한다는 뜻이 아닙니다. 원형 판 반지름 a, 경로 r에 대해 I_d(r)=I·min(1,r²/a²)이며 Bθ=μ₀I_d(r)/(2πr)입니다.\u003c/p>\u003ch2>전자기파\u003c/h2>\u003cp>진공 평면파에서 E와 B는 서로 수직이며 같은 위상입니다. c=1/√(μ₀ε₀), E₀=cB₀, λ=c/f. 에너지 흐름 벡터 S=E×B/μ₀이고 평균 크기는 E₀²/(2μ₀c)입니다. 자기장과 전기장의 평균 에너지 밀도는 같습니다.\u003c/p>\u003ch2>진동 전하와 복사\u003c/h2>\u003cp>시간에 따라 변화하는 전기 쌍극자는 전자기파를 복사합니다. 작은 쌍극자의 원거리 복사에서 축 방향은 복사 세기가 0이고 수직 방향은 최대입니다. 같은 각도에서 복사 세기는 거리의 제곱에 반비례합니다. 가까운 곳의 장은 이 식만으로 표현할 수 없습니다.\u003c/p>\u003ch2>탐구 순서\u003c/h2>\u003cp>기초: 네 법칙의 방향과 선속 비교 → 정량: 구면과 원형 경로의 계산 → 심화: 변위 전류와 복사·에너지 전달. 모든 실험은 지정된 이상화 조건에 따른 계산값이며 실측값이 아닙니다.\u003c/p>\u003c/html>"];const names=["네 법칙 시각화","네 법칙 정량 탐구","축전기와 변위 전류","전자기파와 에너지","진동 전하와 복사","개념 설명"];const nav=document.getElementById('tabs'),frame=document.getElementById('lab');function select(i){[...nav.children].forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));frame.title=names[i];frame.srcdoc=pages[i]}names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.setAttribute('role','tab');b.onclick=()=>select(i);nav.append(b)});select(0);</script></body></html>
