ax(45,.15*sc);g.fillStyle=s.pole>0?'#397bc0':'#d95b62';g.fillRect(mag-mw/2,cy-17,mw/2,34);g.fillStyle=s.pole>0?'#d95b62':'#397bc0';g.fillRect(mag,cy-17,mw/2,34);txt(s.pole>0?'S':'N',mag-mw/4,cy+5,'white',12);txt(s.pole>0?'N':'S',mag+mw/4,cy+5,'white',12);arr(mag,cy-35,s.vm,0,'#ffc475',36);arr(co,cy+50,s.vc,0,'#ffc475',36);arr(mag,cy-60,m.F,0,'#69e5a9',35);if(m.I)arr(co,cy,m.I,0,'#6dc9ff',40);txt('초록: 자석에 작용하는 유도 반작용 · 파랑: 유도장',W/2,17,'#c1d7e9',11);txt('상대 위치 '+fmt(m.x)+' m · 상대 속도 '+fmt(m.rel)+' m/s',W/2,H*.45)}\nelse if(mode===1){let left=65,right=W-28,top=35,bot=H*.43,scale=(right-left)/1.6,x=left+m.x*scale;for(let y=top+17;y\u003cbot;y+=34)for(let xx=left+15;xx\u003cright;xx+=42)if(s.B)txt(s.B>0?'⊙':'⊗',xx,y,'#4c83ac',16);ln(left,top,right,top,'#d1a472',5);ln(left,bot,right,bot,'#d1a472',5);ln(left,top,left,bot,'#d1a472',4);g.fillStyle='#0b1828';g.fillRect(left-12,(top+bot)/2-17,24,34);txt(s.closed?'R':'개방',left,(top+bot)/2+4,'#f5c582',11);ln(x,top,x,bot,'#e5ba87',10);if(t\u003cend(s))arr(x,top-14,s.v,0,'#ffca79',37);arr(x,cy,0,m.I,'#ff91b0',38);arr(x,cy,m.F,0,'#67e4ac',40);txt('막대 ℓ · 레일 · 저항 R',W/2,17);txt('주황 v · 분홍 I · 초록 F (반작용)',W/2,H*.48,'#bad0e3',12)}\nelse if(mode===2){let cx=W*.3,rx=W*.7,w=Math.min(W*.22,140);coil(cx,cy,w,65,18);coil(rx,cy,w,65,18);ln(cx-w/2,cy+48,cx+w/2,cy+48,'#d59b6c',2);ln(rx-w/2,cy+48,rx+w/2,cy+48,'#d59b6c',2);if(m.primary)arr(cx,cy,m.primary,0,'#79c8ff',40);if(m.I)arr(rx,cy,m.I,0,'#78ebbf',40);txt('1차 코일',cx,cy-55);txt('2차 코일',rx,cy-55);txt('I₁='+fmt(m.primary)+' A',cx,cy+70);txt('I₂='+fmt(m.I)+' A',rx,cy+70);txt('같은 양의 코일 법선 → · 역결합 선택 가능',W/2,17,'#a9c9de',12)}\nelse{let x=W*.15,r=W*.85,y=H*.16,b=H*.41;ln(x,y,r,y,'#a8bacd',3);ln(r,y,r,b,'#a8bacd',3);ln(r,b,x,b,'#a8bacd',3);ln(x,b,x,y,'#a8bacd',3);g.fillStyle='#10243a';g.fillRect(x-18,cy-24,36,48);txt(m.source?'전원':'단락',x,cy+5,'#ffca79',11);coil(W*.43,y,Math.min(W*.25,170),32,12);g.fillStyle='#a67440';g.fillRect(W*.65-28,b-11,56,22);txt('R',W*.65,b+4,'white');if(m.I)arr(W*.48,b,-1,0,'#ffca79',45);txt(m.source?'전원 연결 · 전류 증가':'전원 분리 후 RL 폐회로 · 전류 감소',W/2,17);txt('인덕터 L · 전류 연속 · 자체 유도',W/2,H*.47,'#c2d5e7',12)}}\nfunction graph(m){let left=55,right=W-48,top=H*.55,bottom=H-33,mid=(top+bottom)/2,range=[2,1.2,3,24][mode],T=end(s),domain=[2,2,6,13][mode],X=t=>left+(t/domain)*(right-left),Y=v=>mid-v/range*(bottom-top)/2,values=p=>[p.emf,p.I];for(let i=-2;i\u003c=2;i++){let v=i*range/2;ln(left,Y(v),right,Y(v),'#2d455d');txt(fmt(v),left-5,Y(v)+4,'#ff99ae',10,'right');txt(fmt(v),right+5,Y(v)+4,'#63e1d0',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(domain*j/4),X(domain*j/4),bottom+15,'#a7bed4',11);txt('ε (V)',left,top-8,'#ff99ae',11,'left');txt('I (A)',right,top-8,'#63e1d0',11,'right');txt('t (s)',W/2,H-7,'#bdd4e6',11);for(let k=0;k\u003c2;k++){g.beginPath();for(let j=0;j\u003c=250;j++){let u=T*j/250,v=values(calc(s,u))[k];j?g.lineTo(X(u),Y(v)):g.moveTo(X(u),Y(v))}g.strokeStyle=['#ff99ae','#63e1d0'][k];g.lineWidth=2.3;g.stroke()}ln(X(t),top,X(t),bottom,'#ffd47d',1);let vals=values(m);dot(X(t),Y(vals[0]),4,'#ff99ae');dot(X(t),Y(vals[1]),4,'#63e1d0');}\nfunction draw(){let bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#142a3f');bg.addColorStop(1,'#081321');g.fillStyle=bg;g.fillRect(0,0,W,H);let m=calc(s,t);scene(m);graph(m)}\nfunction summary(p){let m=calc(p.p,p.t);return 'ε '+fmt(m.emf)+' V / I '+fmt(m.I)+' A @ '+fmt(p.t)+' s'}\nfunction update(){let m=calc(s,t),rows=mode===0?[['한 회 선속 Φ',fmt(m.phi*1000)+' mWb'],['쇄교 자속 NΦ',fmt(m.lambda)+' Wb·회'],['유도 기전력',fmt(m.emf)+' V'],['유도 전류',fmt(m.I)+' A'],['상대 속도',fmt(m.rel)+' m/s'],['자석의 반작용',fmt(m.F)+' N']]:mode===1?[['선속 Φ',fmt(m.phi)+' Wb'],['기전력',fmt(m.emf)+' V'],['전류',fmt(m.I)+' A'],['막대의 자기력',fmt(m.F)+' N'],['저항의 소비 전력',fmt(m.P)+' W']]:mode===2?[['1차 전류',fmt(m.primary)+' A'],['쇄교 자속',fmt(m.lambda)+' Wb·회'],['2차 기전력',fmt(m.emf)+' V'],['2차 전류',fmt(m.I)+' A']]:[['전류',fmt(m.I)+' A'],['자체 유도 기전력',fmt(m.emf)+' V'],['시정수 L/R',fmt(m.tau)+' s'],['저장 에너지',fmt(m.U)+' J'],['저항 소비 전력',fmt(m.Pr)+' W']];$('metrics').innerHTML=rows.map(([k,v])=>'\u003cdiv class=\"metric\">'+k+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('hint').textContent=['자석과 코일을 같은 속도로 움직이면 상대 위치가 일정합니다. 유도 기전력은 0입니다.','막대 운동에 반대하는 자기력과 저항의 전력 소비를 비교하세요.','1차 전류가 증가할 때와 감소할 때 2차 기전력의 부호를 비교하세요.','전원 연결 시 전류가 점차 증가하며, 전원을 분리한 폐회로에서 저장 에너지가 저항으로 전달됩니다.'][mode]+'  t='+fmt(t)+' s';draw()}\nfunction slider(k,label,min,max,step){let el=document.createElement('label');el.innerHTML=label+' \u003coutput>\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';let e=el.querySelector('input'),o=el.querySelector('output');o.textContent=s[k];e.oninput=()=>{s[k]=+e.value;o.textContent=s[k];t=0;running=false;update()};$('controls').append(el)}\nfunction choose(k,label,opts){let el=document.createElement('label');el.textContent=label;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;t=0;running=false;update()};el.append(e);$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){slider('vm','자석 속도 (m/s)',-.2,.2,.05);slider('vc','코일 속도 (m/s)',-.2,.2,.05);slider('N','감은 수',50,300,50);slider('peak','최대 1회 선속 (mWb)',.2,2,.1);slider('R','저항 (Ω)',2,20,1);choose('pole','자석 방향',[[1,'S | N'],[-1,'N | S']]);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===1){slider('B','자기장 (T)',-1,1,.1);slider('v','막대 속도 (m/s)',-.1,.4,.05);slider('l','레일 간격 (m)',.1,1,.1);slider('R','저항 (Ω)',1,20,1);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===2){slider('M','상호 인덕턴스 (H)',.05,.5,.05);slider('I','최대 1차 전류 (A)',0,3,.1);slider('T','변화 시간 (s)',.5,3,.5);slider('R','2차 저항 (Ω)',1,20,1);choose('pole','결합 부호',[[1,'같은 법선'],[-1,'반대 결합']]);choose('closed','2차 회로',[[1,'닫힘'],[0,'열림']])}else{slider('L','인덕턴스 (H)',.2,2,.1);slider('R','저항 (Ω)',1,10,.5);slider('V','전압 (V)',2,24,1);slider('off','전원 분리 시각 (s)',.5,3,.5)}$('formula').textContent=['ε=−d(NΦ)/dt · F반작용 v상대 = −εI','ε=Bℓv (시계 방향 +) · Fₓ=−IBℓ · P=εI','ε₂=−M dI₁/dt (결합 부호 포함)','L dI/dt+RI=V · εL=−L dI/dt · U=½LI²'][mode];$('assume').textContent=['축상 선속의 가우스 근사. 자석·코일을 외부에서 일정 속도로 이동시키며 저항만 있는 회로의 반작용을 표시합니다. 정지 화면은 선택 시각의 순간값입니다.','균일한 z방향 자기장(부호로 방향 선택), 마찰 없는 레일, 저항성 회로. +전류는 막대에서 아래 방향. 막대와 레일 간격은 개념 배율.','1차 전류를 외부 전원으로 선형 제어하는 이상 모델. 2차 자체 인덕턴스와 1차에 대한 반작용은 무시합니다.','직류 전원 분리 시 전원을 우회하여 RL 폐회로를 유지합니다. 이상적 인덕터·저항, 스위치 순간 전류 연속.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(t>=end(s))t=0;running=true;last=0};$('pause').onclick=()=>running=false;$('step').onclick=()=>{running=false;t=Math.min(end(s),t+end(s)/80);update()};$('reset').onclick=()=>{s=def();t=0;running=false;saved=[null,null];build()};['a','b'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={p:{...s},t};update()});function frame(now){if(running){if(last)t=Math.min(end(s),t+Math.min(.05,(now-last)/1000)*end(s)/7);last=now;if(t>=end(s))running=false;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden)running=false});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>운동 기전력\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e6f0fa;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(260px,1fr);gap:10px}article,aside{background:#111d2b;border:1px solid #344d65;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(340px,60dvh,650px);background:#081322;border-radius:8px}button,select{background:#20354b;color:#e5f0fc;border:1px solid #4d6983;border-radius:7px;padding:8px 11px;font:inherit;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}label{display:block;min-width:0;font-size:13px}output{color:#7fe5cf;float:right}input{display:block;width:100%;accent-color:#62debf}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metric{background:#0c2735;border:1px solid #305367;border-radius:8px;padding:8px;min-width:0}.metric b{display:block;font-size:19px;color:#83e8fa;overflow-wrap:anywhere}.note,p{line-height:1.5;color:#bed0e1;margin:7px 0}.note{font-size:12px}aside{overflow:auto;max-height:calc(100dvh - 24px)}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(310px,48dvh,430px)}} \u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>운동 기전력\u003c/h2>\u003ccanvas id=\"cv\" aria-label=\"운동 기전력 장면과 그래프\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"a\">조건 A 저장\u003c/button>\u003cbutton id=\"b\">조건 B 저장\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assume\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';\nconst mode=1,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI;\nconst def=()=>mode===0?{vm:.2,vc:0,N:200,peak:1,R:8,closed:1,pole:1}:mode===1?{B:.5,v:.2,l:.5,R:5,closed:1}:mode===2?{M:.2,I:2,T:2,R:10,closed:1,pole:1}: {L:1,R:4,V:12,off:2};\nlet s=def(),t=0,running=false,last=0,W=800,H=440,saved=[null,null];\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=x=>!Number.isFinite(x)?'—':Math.abs(x)>0&&Math.abs(x)\u003c.001?x.toExponential(2):Number(x.toFixed(3)).toString();\nfunction end(p){return mode===0?2:mode===1?2:mode===2?2*p.T: p.off+5*p.L/p.R}\nfunction calc(p,t){let T=end(p),u=clamp(t,0,T),active=u\u003cT;\n if(mode===0){let x=-.22+(p.vm-p.vc)*u,soft=.09,phi=p.pole*p.peak*.001*Math.exp(-x*x/(2*soft*soft)),lambda=p.N*phi,emf=active?lambda*x*(p.vm-p.vc)/(soft*soft):0,I=p.closed?emf/p.R:0;return{x,phi,lambda,emf,I,F:(p.vm-p.vc)&&p.closed?-emf*I/(p.vm-p.vc):0,rel:p.vm-p.vc}}\n if(mode===1){let x=.25+p.v*u,B=p.B,phi=-B*p.l*x,emf=active?B*p.l*p.v:0,I=p.closed?emf/p.R:0,F=-I*p.l*B;return{x,phi,emf,I,F,P:emf*I}}\n if(mode===2){let primary=u\u003cp.T?p.I*u/p.T:p.I*Math.max(0,2-u/p.T),slope=active?(u\u003cp.T?1:-1)*p.I/p.T:0,lambda=p.pole*p.M*primary,emf=-p.pole*p.M*slope,I=p.closed?emf/p.R:0;return{primary,slope,lambda,emf,I}}\n let tau=p.L/p.R,atOff=p.V/p.R*(-Math.expm1(-p.off/tau)),on=u\u003cp.off,I=on?p.V/p.R*(-Math.expm1(-u/tau)):atOff*Math.exp(-(u-p.off)/tau),source=on?p.V:0,emf=p.R*I-source;return{I,emf,tau,source,U:.5*p.L*I*I,Pr:I*I*p.R}\n}\nfunction ln(x,y,X,Y,c='#37516a',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#d8e8f7',size=13,align='center'){g.fillStyle=c;g.font=size+'px system-ui';g.textAlign=align;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=35){if(Math.hypot(dx,dy)\u003c1e-15)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.5);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.5);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.5)}\nfunction dot(x,y,r,c){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=c;g.fill()}\nfunction coil(cx,cy,w,h,N){g.fillStyle='#263d51';g.fillRect(cx-w/2,cy-h/2,w,h);for(let i=0;i\u003cMath.min(N,24);i++){let x=cx-w/2+w*(i+.5)/Math.min(N,24);g.beginPath();g.ellipse(x,cy,5,h*.67,0,0,2*PI);g.strokeStyle='#db9b5d';g.lineWidth=2;g.stroke()}}\nfunction scene(m){let cy=H*.27;if(mode===0){let sc=Math.min((W-100)/1.5,H*.55/.45),cx=W/2,mag=cx+(-.22+s.vm*t)*sc,co=cx+s.vc*t*sc;coil(co,cy,Math.max(35,.18*sc),60,s.N);let mw=Math.max(45,.15*sc);g.fillStyle=s.pole>0?'#397bc0':'#d95b62';g.fillRect(mag-mw/2,cy-17,mw/2,34);g.fillStyle=s.pole>0?'#d95b62':'#397bc0';g.fillRect(mag,cy-17,mw/2,34);txt(s.pole>0?'S':'N',mag-mw/4,cy+5,'white',12);txt(s.pole>0?'N':'S',mag+mw/4,cy+5,'white',12);arr(mag,cy-35,s.vm,0,'#ffc475',36);arr(co,cy+50,s.vc,0,'#ffc475',36);arr(mag,cy-60,m.F,0,'#69e5a9',35);if(m.I)arr(co,cy,m.I,0,'#6dc9ff',40);txt('초록: 자석에 작용하는 유도 반작용 · 파랑: 유도장',W/2,17,'#c1d7e9',11);txt('상대 위치 '+fmt(m.x)+' m · 상대 속도 '+fmt(m.rel)+' m/s',W/2,H*.45)}\nelse if(mode===1){let left=65,right=W-28,top=35,bot=H*.43,scale=(right-left)/1.6,x=left+m.x*scale;for(let y=top+17;y\u003cbot;y+=34)for(let xx=left+15;xx\u003cright;xx+=42)if(s.B)txt(s.B>0?'⊙':'⊗',xx,y,'#4c83ac',16);ln(left,top,right,top,'#d1a472',5);ln(left,bot,right,bot,'#d1a472',5);ln(left,top,left,bot,'#d1a472',4);g.fillStyle='#0b1828';g.fillRect(left-12,(top+bot)/2-17,24,34);txt(s.closed?'R':'개방',left,(top+bot)/2+4,'#f5c582',11);ln(x,top,x,bot,'#e5ba87',10);if(t\u003cend(s))arr(x,top-14,s.v,0,'#ffca79',37);arr(x,cy,0,m.I,'#ff91b0',38);arr(x,cy,m.F,0,'#67e4ac',40);txt('막대 ℓ · 레일 · 저항 R',W/2,17);txt('주황 v · 분홍 I · 초록 F (반작용)',W/2,H*.48,'#bad0e3',12)}\nelse if(mode===2){let cx=W*.3,rx=W*.7,w=Math.min(W*.22,140);coil(cx,cy,w,65,18);coil(rx,cy,w,65,18);ln(cx-w/2,cy+48,cx+w/2,cy+48,'#d59b6c',2);ln(rx-w/2,cy+48,rx+w/2,cy+48,'#d59b6c',2);if(m.primary)arr(cx,cy,m.primary,0,'#79c8ff',40);if(m.I)arr(rx,cy,m.I,0,'#78ebbf',40);txt('1차 코일',cx,cy-55);txt('2차 코일',rx,cy-55);txt('I₁='+fmt(m.primary)+' A',cx,cy+70);txt('I₂='+fmt(m.I)+' A',rx,cy+70);txt('같은 양의 코일 법선 → · 역결합 선택 가능',W/2,17,'#a9c9de',12)}\nelse{let x=W*.15,r=W*.85,y=H*.16,b=H*.41;ln(x,y,r,y,'#a8bacd',3);ln(r,y,r,b,'#a8bacd',3);ln(r,b,x,b,'#a8bacd',3);ln(x,b,x,y,'#a8bacd',3);g.fillStyle='#10243a';g.fillRect(x-18,cy-24,36,48);txt(m.source?'전원':'단락',x,cy+5,'#ffca79',11);coil(W*.43,y,Math.min(W*.25,170),32,12);g.fillStyle='#a67440';g.fillRect(W*.65-28,b-11,56,22);txt('R',W*.65,b+4,'white');if(m.I)arr(W*.48,b,-1,0,'#ffca79',45);txt(m.source?'전원 연결 · 전류 증가':'전원 분리 후 RL 폐회로 · 전류 감소',W/2,17);txt('인덕터 L · 전류 연속 · 자체 유도',W/2,H*.47,'#c2d5e7',12)}}\nfunction graph(m){let left=55,right=W-48,top=H*.55,bottom=H-33,mid=(top+bottom)/2,range=[2,1.2,3,24][mode],T=end(s),domain=[2,2,6,13][mode],X=t=>left+(t/domain)*(right-left),Y=v=>mid-v/range*(bottom-top)/2,values=p=>[p.emf,p.I];for(let i=-2;i\u003c=2;i++){let v=i*range/2;ln(left,Y(v),right,Y(v),'#2d455d');txt(fmt(v),left-5,Y(v)+4,'#ff99ae',10,'right');txt(fmt(v),right+5,Y(v)+4,'#63e1d0',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(domain*j/4),X(domain*j/4),bottom+15,'#a7bed4',11);txt('ε (V)',left,top-8,'#ff99ae',11,'left');txt('I (A)',right,top-8,'#63e1d0',11,'right');txt('t (s)',W/2,H-7,'#bdd4e6',11);for(let k=0;k\u003c2;k++){g.beginPath();for(let j=0;j\u003c=250;j++){let u=T*j/250,v=values(calc(s,u))[k];j?g.lineTo(X(u),Y(v)):g.moveTo(X(u),Y(v))}g.strokeStyle=['#ff99ae','#63e1d0'][k];g.lineWidth=2.3;g.stroke()}ln(X(t),top,X(t),bottom,'#ffd47d',1);let vals=values(m);dot(X(t),Y(vals[0]),4,'#ff99ae');dot(X(t),Y(vals[1]),4,'#63e1d0');}\nfunction draw(){let bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#142a3f');bg.addColorStop(1,'#081321');g.fillStyle=bg;g.fillRect(0,0,W,H);let m=calc(s,t);scene(m);graph(m)}\nfunction summary(p){let m=calc(p.p,p.t);return 'ε '+fmt(m.emf)+' V / I '+fmt(m.I)+' A @ '+fmt(p.t)+' s'}\nfunction update(){let m=calc(s,t),rows=mode===0?[['한 회 선속 Φ',fmt(m.phi*1000)+' mWb'],['쇄교 자속 NΦ',fmt(m.lambda)+' Wb·회'],['유도 기전력',fmt(m.emf)+' V'],['유도 전류',fmt(m.I)+' A'],['상대 속도',fmt(m.rel)+' m/s'],['자석의 반작용',fmt(m.F)+' N']]:mode===1?[['선속 Φ',fmt(m.phi)+' Wb'],['기전력',fmt(m.emf)+' V'],['전류',fmt(m.I)+' A'],['막대의 자기력',fmt(m.F)+' N'],['저항의 소비 전력',fmt(m.P)+' W']]:mode===2?[['1차 전류',fmt(m.primary)+' A'],['쇄교 자속',fmt(m.lambda)+' Wb·회'],['2차 기전력',fmt(m.emf)+' V'],['2차 전류',fmt(m.I)+' A']]:[['전류',fmt(m.I)+' A'],['자체 유도 기전력',fmt(m.emf)+' V'],['시정수 L/R',fmt(m.tau)+' s'],['저장 에너지',fmt(m.U)+' J'],['저항 소비 전력',fmt(m.Pr)+' W']];$('metrics').innerHTML=rows.map(([k,v])=>'\u003cdiv class=\"metric\">'+k+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('hint').textContent=['자석과 코일을 같은 속도로 움직이면 상대 위치가 일정합니다. 유도 기전력은 0입니다.','막대 운동에 반대하는 자기력과 저항의 전력 소비를 비교하세요.','1차 전류가 증가할 때와 감소할 때 2차 기전력의 부호를 비교하세요.','전원 연결 시 전류가 점차 증가하며, 전원을 분리한 폐회로에서 저장 에너지가 저항으로 전달됩니다.'][mode]+'  t='+fmt(t)+' s';draw()}\nfunction slider(k,label,min,max,step){let el=document.createElement('label');el.innerHTML=label+' \u003coutput>\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';let e=el.querySelector('input'),o=el.querySelector('output');o.textContent=s[k];e.oninput=()=>{s[k]=+e.value;o.textContent=s[k];t=0;running=false;update()};$('controls').append(el)}\nfunction choose(k,label,opts){let el=document.createElement('label');el.textContent=label;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;t=0;running=false;update()};el.append(e);$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){slider('vm','자석 속도 (m/s)',-.2,.2,.05);slider('vc','코일 속도 (m/s)',-.2,.2,.05);slider('N','감은 수',50,300,50);slider('peak','최대 1회 선속 (mWb)',.2,2,.1);slider('R','저항 (Ω)',2,20,1);choose('pole','자석 방향',[[1,'S | N'],[-1,'N | S']]);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===1){slider('B','자기장 (T)',-1,1,.1);slider('v','막대 속도 (m/s)',-.1,.4,.05);slider('l','레일 간격 (m)',.1,1,.1);slider('R','저항 (Ω)',1,20,1);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===2){slider('M','상호 인덕턴스 (H)',.05,.5,.05);slider('I','최대 1차 전류 (A)',0,3,.1);slider('T','변화 시간 (s)',.5,3,.5);slider('R','2차 저항 (Ω)',1,20,1);choose('pole','결합 부호',[[1,'같은 법선'],[-1,'반대 결합']]);choose('closed','2차 회로',[[1,'닫힘'],[0,'열림']])}else{slider('L','인덕턴스 (H)',.2,2,.1);slider('R','저항 (Ω)',1,10,.5);slider('V','전압 (V)',2,24,1);slider('off','전원 분리 시각 (s)',.5,3,.5)}$('formula').textContent=['ε=−d(NΦ)/dt · F반작용 v상대 = −εI','ε=Bℓv (시계 방향 +) · Fₓ=−IBℓ · P=εI','ε₂=−M dI₁/dt (결합 부호 포함)','L dI/dt+RI=V · εL=−L dI/dt · U=½LI²'][mode];$('assume').textContent=['축상 선속의 가우스 근사. 자석·코일을 외부에서 일정 속도로 이동시키며 저항만 있는 회로의 반작용을 표시합니다. 정지 화면은 선택 시각의 순간값입니다.','균일한 z방향 자기장(부호로 방향 선택), 마찰 없는 레일, 저항성 회로. +전류는 막대에서 아래 방향. 막대와 레일 간격은 개념 배율.','1차 전류를 외부 전원으로 선형 제어하는 이상 모델. 2차 자체 인덕턴스와 1차에 대한 반작용은 무시합니다.','직류 전원 분리 시 전원을 우회하여 RL 폐회로를 유지합니다. 이상적 인덕터·저항, 스위치 순간 전류 연속.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(t>=end(s))t=0;running=true;last=0};$('pause').onclick=()=>running=false;$('step').onclick=()=>{running=false;t=Math.min(end(s),t+end(s)/80);update()};$('reset').onclick=()=>{s=def();t=0;running=false;saved=[null,null];build()};['a','b'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={p:{...s},t};update()});function frame(now){if(running){if(last)t=Math.min(end(s),t+Math.min(.05,(now-last)/1000)*end(s)/7);last=now;if(t>=end(s))running=false;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden)running=false});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>상호 유도\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e6f0fa;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(260px,1fr);gap:10px}article,aside{background:#111d2b;border:1px solid #344d65;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(340px,60dvh,650px);background:#081322;border-radius:8px}button,select{background:#20354b;color:#e5f0fc;border:1px solid #4d6983;border-radius:7px;padding:8px 11px;font:inherit;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}label{display:block;min-width:0;font-size:13px}output{color:#7fe5cf;float:right}input{display:block;width:100%;accent-color:#62debf}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metric{background:#0c2735;border:1px solid #305367;border-radius:8px;padding:8px;min-width:0}.metric b{display:block;font-size:19px;color:#83e8fa;overflow-wrap:anywhere}.note,p{line-height:1.5;color:#bed0e1;margin:7px 0}.note{font-size:12px}aside{overflow:auto;max-height:calc(100dvh - 24px)}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(310px,48dvh,430px)}} \u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>상호 유도\u003c/h2>\u003ccanvas id=\"cv\" aria-label=\"상호 유도 장면과 그래프\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"a\">조건 A 저장\u003c/button>\u003cbutton id=\"b\">조건 B 저장\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assume\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';\nconst mode=2,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI;\nconst def=()=>mode===0?{vm:.2,vc:0,N:200,peak:1,R:8,closed:1,pole:1}:mode===1?{B:.5,v:.2,l:.5,R:5,closed:1}:mode===2?{M:.2,I:2,T:2,R:10,closed:1,pole:1}: {L:1,R:4,V:12,off:2};\nlet s=def(),t=0,running=false,last=0,W=800,H=440,saved=[null,null];\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=x=>!Number.isFinite(x)?'—':Math.abs(x)>0&&Math.abs(x)\u003c.001?x.toExponential(2):Number(x.toFixed(3)).toString();\nfunction end(p){return mode===0?2:mode===1?2:mode===2?2*p.T: p.off+5*p.L/p.R}\nfunction calc(p,t){let T=end(p),u=clamp(t,0,T),active=u\u003cT;\n if(mode===0){let x=-.22+(p.vm-p.vc)*u,soft=.09,phi=p.pole*p.peak*.001*Math.exp(-x*x/(2*soft*soft)),lambda=p.N*phi,emf=active?lambda*x*(p.vm-p.vc)/(soft*soft):0,I=p.closed?emf/p.R:0;return{x,phi,lambda,emf,I,F:(p.vm-p.vc)&&p.closed?-emf*I/(p.vm-p.vc):0,rel:p.vm-p.vc}}\n if(mode===1){let x=.25+p.v*u,B=p.B,phi=-B*p.l*x,emf=active?B*p.l*p.v:0,I=p.closed?emf/p.R:0,F=-I*p.l*B;return{x,phi,emf,I,F,P:emf*I}}\n if(mode===2){let primary=u\u003cp.T?p.I*u/p.T:p.I*Math.max(0,2-u/p.T),slope=active?(u\u003cp.T?1:-1)*p.I/p.T:0,lambda=p.pole*p.M*primary,emf=-p.pole*p.M*slope,I=p.closed?emf/p.R:0;return{primary,slope,lambda,emf,I}}\n let tau=p.L/p.R,atOff=p.V/p.R*(-Math.expm1(-p.off/tau)),on=u\u003cp.off,I=on?p.V/p.R*(-Math.expm1(-u/tau)):atOff*Math.exp(-(u-p.off)/tau),source=on?p.V:0,emf=p.R*I-source;return{I,emf,tau,source,U:.5*p.L*I*I,Pr:I*I*p.R}\n}\nfunction ln(x,y,X,Y,c='#37516a',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#d8e8f7',size=13,align='center'){g.fillStyle=c;g.font=size+'px system-ui';g.textAlign=align;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=35){if(Math.hypot(dx,dy)\u003c1e-15)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.5);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.5);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.5)}\nfunction dot(x,y,r,c){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=c;g.fill()}\nfunction coil(cx,cy,w,h,N){g.fillStyle='#263d51';g.fillRect(cx-w/2,cy-h/2,w,h);for(let i=0;i\u003cMath.min(N,24);i++){let x=cx-w/2+w*(i+.5)/Math.min(N,24);g.beginPath();g.ellipse(x,cy,5,h*.67,0,0,2*PI);g.strokeStyle='#db9b5d';g.lineWidth=2;g.stroke()}}\nfunction scene(m){let cy=H*.27;if(mode===0){let sc=Math.min((W-100)/1.5,H*.55/.45),cx=W/2,mag=cx+(-.22+s.vm*t)*sc,co=cx+s.vc*t*sc;coil(co,cy,Math.max(35,.18*sc),60,s.N);let mw=Math.max(45,.15*sc);g.fillStyle=s.pole>0?'#397bc0':'#d95b62';g.fillRect(mag-mw/2,cy-17,mw/2,34);g.fillStyle=s.pole>0?'#d95b62':'#397bc0';g.fillRect(mag,cy-17,mw/2,34);txt(s.pole>0?'S':'N',mag-mw/4,cy+5,'white',12);txt(s.pole>0?'N':'S',mag+mw/4,cy+5,'white',12);arr(mag,cy-35,s.vm,0,'#ffc475',36);arr(co,cy+50,s.vc,0,'#ffc475',36);arr(mag,cy-60,m.F,0,'#69e5a9',35);if(m.I)arr(co,cy,m.I,0,'#6dc9ff',40);txt('초록: 자석에 작용하는 유도 반작용 · 파랑: 유도장',W/2,17,'#c1d7e9',11);txt('상대 위치 '+fmt(m.x)+' m · 상대 속도 '+fmt(m.rel)+' m/s',W/2,H*.45)}\nelse if(mode===1){let left=65,right=W-28,top=35,bot=H*.43,scale=(right-left)/1.6,x=left+m.x*scale;for(let y=top+17;y\u003cbot;y+=34)for(let xx=left+15;xx\u003cright;xx+=42)if(s.B)txt(s.B>0?'⊙':'⊗',xx,y,'#4c83ac',16);ln(left,top,right,top,'#d1a472',5);ln(left,bot,right,bot,'#d1a472',5);ln(left,top,left,bot,'#d1a472',4);g.fillStyle='#0b1828';g.fillRect(left-12,(top+bot)/2-17,24,34);txt(s.closed?'R':'개방',left,(top+bot)/2+4,'#f5c582',11);ln(x,top,x,bot,'#e5ba87',10);if(t\u003cend(s))arr(x,top-14,s.v,0,'#ffca79',37);arr(x,cy,0,m.I,'#ff91b0',38);arr(x,cy,m.F,0,'#67e4ac',40);txt('막대 ℓ · 레일 · 저항 R',W/2,17);txt('주황 v · 분홍 I · 초록 F (반작용)',W/2,H*.48,'#bad0e3',12)}\nelse if(mode===2){let cx=W*.3,rx=W*.7,w=Math.min(W*.22,140);coil(cx,cy,w,65,18);coil(rx,cy,w,65,18);ln(cx-w/2,cy+48,cx+w/2,cy+48,'#d59b6c',2);ln(rx-w/2,cy+48,rx+w/2,cy+48,'#d59b6c',2);if(m.primary)arr(cx,cy,m.primary,0,'#79c8ff',40);if(m.I)arr(rx,cy,m.I,0,'#78ebbf',40);txt('1차 코일',cx,cy-55);txt('2차 코일',rx,cy-55);txt('I₁='+fmt(m.primary)+' A',cx,cy+70);txt('I₂='+fmt(m.I)+' A',rx,cy+70);txt('같은 양의 코일 법선 → · 역결합 선택 가능',W/2,17,'#a9c9de',12)}\nelse{let x=W*.15,r=W*.85,y=H*.16,b=H*.41;ln(x,y,r,y,'#a8bacd',3);ln(r,y,r,b,'#a8bacd',3);ln(r,b,x,b,'#a8bacd',3);ln(x,b,x,y,'#a8bacd',3);g.fillStyle='#10243a';g.fillRect(x-18,cy-24,36,48);txt(m.source?'전원':'단락',x,cy+5,'#ffca79',11);coil(W*.43,y,Math.min(W*.25,170),32,12);g.fillStyle='#a67440';g.fillRect(W*.65-28,b-11,56,22);txt('R',W*.65,b+4,'white');if(m.I)arr(W*.48,b,-1,0,'#ffca79',45);txt(m.source?'전원 연결 · 전류 증가':'전원 분리 후 RL 폐회로 · 전류 감소',W/2,17);txt('인덕터 L · 전류 연속 · 자체 유도',W/2,H*.47,'#c2d5e7',12)}}\nfunction graph(m){let left=55,right=W-48,top=H*.55,bottom=H-33,mid=(top+bottom)/2,range=[2,1.2,3,24][mode],T=end(s),domain=[2,2,6,13][mode],X=t=>left+(t/domain)*(right-left),Y=v=>mid-v/range*(bottom-top)/2,values=p=>[p.emf,p.I];for(let i=-2;i\u003c=2;i++){let v=i*range/2;ln(left,Y(v),right,Y(v),'#2d455d');txt(fmt(v),left-5,Y(v)+4,'#ff99ae',10,'right');txt(fmt(v),right+5,Y(v)+4,'#63e1d0',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(domain*j/4),X(domain*j/4),bottom+15,'#a7bed4',11);txt('ε (V)',left,top-8,'#ff99ae',11,'left');txt('I (A)',right,top-8,'#63e1d0',11,'right');txt('t (s)',W/2,H-7,'#bdd4e6',11);for(let k=0;k\u003c2;k++){g.beginPath();for(let j=0;j\u003c=250;j++){let u=T*j/250,v=values(calc(s,u))[k];j?g.lineTo(X(u),Y(v)):g.moveTo(X(u),Y(v))}g.strokeStyle=['#ff99ae','#63e1d0'][k];g.lineWidth=2.3;g.stroke()}ln(X(t),top,X(t),bottom,'#ffd47d',1);let vals=values(m);dot(X(t),Y(vals[0]),4,'#ff99ae');dot(X(t),Y(vals[1]),4,'#63e1d0');}\nfunction draw(){let bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#142a3f');bg.addColorStop(1,'#081321');g.fillStyle=bg;g.fillRect(0,0,W,H);let m=calc(s,t);scene(m);graph(m)}\nfunction summary(p){let m=calc(p.p,p.t);return 'ε '+fmt(m.emf)+' V / I '+fmt(m.I)+' A @ '+fmt(p.t)+' s'}\nfunction update(){let m=calc(s,t),rows=mode===0?[['한 회 선속 Φ',fmt(m.phi*1000)+' mWb'],['쇄교 자속 NΦ',fmt(m.lambda)+' Wb·회'],['유도 기전력',fmt(m.emf)+' V'],['유도 전류',fmt(m.I)+' A'],['상대 속도',fmt(m.rel)+' m/s'],['자석의 반작용',fmt(m.F)+' N']]:mode===1?[['선속 Φ',fmt(m.phi)+' Wb'],['기전력',fmt(m.emf)+' V'],['전류',fmt(m.I)+' A'],['막대의 자기력',fmt(m.F)+' N'],['저항의 소비 전력',fmt(m.P)+' W']]:mode===2?[['1차 전류',fmt(m.primary)+' A'],['쇄교 자속',fmt(m.lambda)+' Wb·회'],['2차 기전력',fmt(m.emf)+' V'],['2차 전류',fmt(m.I)+' A']]:[['전류',fmt(m.I)+' A'],['자체 유도 기전력',fmt(m.emf)+' V'],['시정수 L/R',fmt(m.tau)+' s'],['저장 에너지',fmt(m.U)+' J'],['저항 소비 전력',fmt(m.Pr)+' W']];$('metrics').innerHTML=rows.map(([k,v])=>'\u003cdiv class=\"metric\">'+k+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('hint').textContent=['자석과 코일을 같은 속도로 움직이면 상대 위치가 일정합니다. 유도 기전력은 0입니다.','막대 운동에 반대하는 자기력과 저항의 전력 소비를 비교하세요.','1차 전류가 증가할 때와 감소할 때 2차 기전력의 부호를 비교하세요.','전원 연결 시 전류가 점차 증가하며, 전원을 분리한 폐회로에서 저장 에너지가 저항으로 전달됩니다.'][mode]+'  t='+fmt(t)+' s';draw()}\nfunction slider(k,label,min,max,step){let el=document.createElement('label');el.innerHTML=label+' \u003coutput>\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';let e=el.querySelector('input'),o=el.querySelector('output');o.textContent=s[k];e.oninput=()=>{s[k]=+e.value;o.textContent=s[k];t=0;running=false;update()};$('controls').append(el)}\nfunction choose(k,label,opts){let el=document.createElement('label');el.textContent=label;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;t=0;running=false;update()};el.append(e);$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){slider('vm','자석 속도 (m/s)',-.2,.2,.05);slider('vc','코일 속도 (m/s)',-.2,.2,.05);slider('N','감은 수',50,300,50);slider('peak','최대 1회 선속 (mWb)',.2,2,.1);slider('R','저항 (Ω)',2,20,1);choose('pole','자석 방향',[[1,'S | N'],[-1,'N | S']]);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===1){slider('B','자기장 (T)',-1,1,.1);slider('v','막대 속도 (m/s)',-.1,.4,.05);slider('l','레일 간격 (m)',.1,1,.1);slider('R','저항 (Ω)',1,20,1);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===2){slider('M','상호 인덕턴스 (H)',.05,.5,.05);slider('I','최대 1차 전류 (A)',0,3,.1);slider('T','변화 시간 (s)',.5,3,.5);slider('R','2차 저항 (Ω)',1,20,1);choose('pole','결합 부호',[[1,'같은 법선'],[-1,'반대 결합']]);choose('closed','2차 회로',[[1,'닫힘'],[0,'열림']])}else{slider('L','인덕턴스 (H)',.2,2,.1);slider('R','저항 (Ω)',1,10,.5);slider('V','전압 (V)',2,24,1);slider('off','전원 분리 시각 (s)',.5,3,.5)}$('formula').textContent=['ε=−d(NΦ)/dt · F반작용 v상대 = −εI','ε=Bℓv (시계 방향 +) · Fₓ=−IBℓ · P=εI','ε₂=−M dI₁/dt (결합 부호 포함)','L dI/dt+RI=V · εL=−L dI/dt · U=½LI²'][mode];$('assume').textContent=['축상 선속의 가우스 근사. 자석·코일을 외부에서 일정 속도로 이동시키며 저항만 있는 회로의 반작용을 표시합니다. 정지 화면은 선택 시각의 순간값입니다.','균일한 z방향 자기장(부호로 방향 선택), 마찰 없는 레일, 저항성 회로. +전류는 막대에서 아래 방향. 막대와 레일 간격은 개념 배율.','1차 전류를 외부 전원으로 선형 제어하는 이상 모델. 2차 자체 인덕턴스와 1차에 대한 반작용은 무시합니다.','직류 전원 분리 시 전원을 우회하여 RL 폐회로를 유지합니다. 이상적 인덕터·저항, 스위치 순간 전류 연속.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(t>=end(s))t=0;running=true;last=0};$('pause').onclick=()=>running=false;$('step').onclick=()=>{running=false;t=Math.min(end(s),t+end(s)/80);update()};$('reset').onclick=()=>{s=def();t=0;running=false;saved=[null,null];build()};['a','b'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={p:{...s},t};update()});function frame(now){if(running){if(last)t=Math.min(end(s),t+Math.min(.05,(now-last)/1000)*end(s)/7);last=now;if(t>=end(s))running=false;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden)running=false});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>자체 유도·RL 회로\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e17;color:#e6f0fa;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(260px,1fr);gap:10px}article,aside{background:#111d2b;border:1px solid #344d65;border-radius:12px;padding:12px;min-width:0}h2{font-size:18px;margin:0 0 8px}canvas{display:block;width:100%;height:clamp(340px,60dvh,650px);background:#081322;border-radius:8px}button,select{background:#20354b;color:#e5f0fc;border:1px solid #4d6983;border-radius:7px;padding:8px 11px;font:inherit;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}label{display:block;min-width:0;font-size:13px}output{color:#7fe5cf;float:right}input{display:block;width:100%;accent-color:#62debf}select{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.metric{background:#0c2735;border:1px solid #305367;border-radius:8px;padding:8px;min-width:0}.metric b{display:block;font-size:19px;color:#83e8fa;overflow-wrap:anywhere}.note,p{line-height:1.5;color:#bed0e1;margin:7px 0}.note{font-size:12px}aside{overflow:auto;max-height:calc(100dvh - 24px)}@media(max-width:760px){main{grid-template-columns:1fr}aside{max-height:none}canvas{height:clamp(310px,48dvh,430px)}} \u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle>\u003ch2>자체 유도·RL 회로\u003c/h2>\u003ccanvas id=\"cv\" aria-label=\"자체 유도·RL 회로 장면과 그래프\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ 시작 / 재개\u003c/button>\u003cbutton id=\"pause\">Ⅱ 정지\u003c/button>\u003cbutton id=\"step\">한 단계\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003cbutton id=\"a\">조건 A 저장\u003c/button>\u003cbutton id=\"b\">조건 B 저장\u003c/button>\u003c/div>\u003cp id=\"hint\">\u003c/p>\u003c/article>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv id=\"metrics\" class=\"metrics\">\u003c/div>\u003cp id=\"compare\" class=\"note\">\u003c/p>\u003cp id=\"formula\">\u003c/p>\u003cp id=\"assume\" class=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';\nconst mode=3,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI;\nconst def=()=>mode===0?{vm:.2,vc:0,N:200,peak:1,R:8,closed:1,pole:1}:mode===1?{B:.5,v:.2,l:.5,R:5,closed:1}:mode===2?{M:.2,I:2,T:2,R:10,closed:1,pole:1}: {L:1,R:4,V:12,off:2};\nlet s=def(),t=0,running=false,last=0,W=800,H=440,saved=[null,null];\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=x=>!Number.isFinite(x)?'—':Math.abs(x)>0&&Math.abs(x)\u003c.001?x.toExponential(2):Number(x.toFixed(3)).toString();\nfunction end(p){return mode===0?2:mode===1?2:mode===2?2*p.T: p.off+5*p.L/p.R}\nfunction calc(p,t){let T=end(p),u=clamp(t,0,T),active=u\u003cT;\n if(mode===0){let x=-.22+(p.vm-p.vc)*u,soft=.09,phi=p.pole*p.peak*.001*Math.exp(-x*x/(2*soft*soft)),lambda=p.N*phi,emf=active?lambda*x*(p.vm-p.vc)/(soft*soft):0,I=p.closed?emf/p.R:0;return{x,phi,lambda,emf,I,F:(p.vm-p.vc)&&p.closed?-emf*I/(p.vm-p.vc):0,rel:p.vm-p.vc}}\n if(mode===1){let x=.25+p.v*u,B=p.B,phi=-B*p.l*x,emf=active?B*p.l*p.v:0,I=p.closed?emf/p.R:0,F=-I*p.l*B;return{x,phi,emf,I,F,P:emf*I}}\n if(mode===2){let primary=u\u003cp.T?p.I*u/p.T:p.I*Math.max(0,2-u/p.T),slope=active?(u\u003cp.T?1:-1)*p.I/p.T:0,lambda=p.pole*p.M*primary,emf=-p.pole*p.M*slope,I=p.closed?emf/p.R:0;return{primary,slope,lambda,emf,I}}\n let tau=p.L/p.R,atOff=p.V/p.R*(-Math.expm1(-p.off/tau)),on=u\u003cp.off,I=on?p.V/p.R*(-Math.expm1(-u/tau)):atOff*Math.exp(-(u-p.off)/tau),source=on?p.V:0,emf=p.R*I-source;return{I,emf,tau,source,U:.5*p.L*I*I,Pr:I*I*p.R}\n}\nfunction ln(x,y,X,Y,c='#37516a',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#d8e8f7',size=13,align='center'){g.fillStyle=c;g.font=size+'px system-ui';g.textAlign=align;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=35){if(Math.hypot(dx,dy)\u003c1e-15)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.5);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.5);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.5)}\nfunction dot(x,y,r,c){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=c;g.fill()}\nfunction coil(cx,cy,w,h,N){g.fillStyle='#263d51';g.fillRect(cx-w/2,cy-h/2,w,h);for(let i=0;i\u003cMath.min(N,24);i++){let x=cx-w/2+w*(i+.5)/Math.min(N,24);g.beginPath();g.ellipse(x,cy,5,h*.67,0,0,2*PI);g.strokeStyle='#db9b5d';g.lineWidth=2;g.stroke()}}\nfunction scene(m){let cy=H*.27;if(mode===0){let sc=Math.min((W-100)/1.5,H*.55/.45),cx=W/2,mag=cx+(-.22+s.vm*t)*sc,co=cx+s.vc*t*sc;coil(co,cy,Math.max(35,.18*sc),60,s.N);let mw=Math.max(45,.15*sc);g.fillStyle=s.pole>0?'#397bc0':'#d95b62';g.fillRect(mag-mw/2,cy-17,mw/2,34);g.fillStyle=s.pole>0?'#d95b62':'#397bc0';g.fillRect(mag,cy-17,mw/2,34);txt(s.pole>0?'S':'N',mag-mw/4,cy+5,'white',12);txt(s.pole>0?'N':'S',mag+mw/4,cy+5,'white',12);arr(mag,cy-35,s.vm,0,'#ffc475',36);arr(co,cy+50,s.vc,0,'#ffc475',36);arr(mag,cy-60,m.F,0,'#69e5a9',35);if(m.I)arr(co,cy,m.I,0,'#6dc9ff',40);txt('초록: 자석에 작용하는 유도 반작용 · 파랑: 유도장',W/2,17,'#c1d7e9',11);txt('상대 위치 '+fmt(m.x)+' m · 상대 속도 '+fmt(m.rel)+' m/s',W/2,H*.45)}\nelse if(mode===1){let left=65,right=W-28,top=35,bot=H*.43,scale=(right-left)/1.6,x=left+m.x*scale;for(let y=top+17;y\u003cbot;y+=34)for(let xx=left+15;xx\u003cright;xx+=42)if(s.B)txt(s.B>0?'⊙':'⊗',xx,y,'#4c83ac',16);ln(left,top,right,top,'#d1a472',5);ln(left,bot,right,bot,'#d1a472',5);ln(left,top,left,bot,'#d1a472',4);g.fillStyle='#0b1828';g.fillRect(left-12,(top+bot)/2-17,24,34);txt(s.closed?'R':'개방',left,(top+bot)/2+4,'#f5c582',11);ln(x,top,x,bot,'#e5ba87',10);if(t\u003cend(s))arr(x,top-14,s.v,0,'#ffca79',37);arr(x,cy,0,m.I,'#ff91b0',38);arr(x,cy,m.F,0,'#67e4ac',40);txt('막대 ℓ · 레일 · 저항 R',W/2,17);txt('주황 v · 분홍 I · 초록 F (반작용)',W/2,H*.48,'#bad0e3',12)}\nelse if(mode===2){let cx=W*.3,rx=W*.7,w=Math.min(W*.22,140);coil(cx,cy,w,65,18);coil(rx,cy,w,65,18);ln(cx-w/2,cy+48,cx+w/2,cy+48,'#d59b6c',2);ln(rx-w/2,cy+48,rx+w/2,cy+48,'#d59b6c',2);if(m.primary)arr(cx,cy,m.primary,0,'#79c8ff',40);if(m.I)arr(rx,cy,m.I,0,'#78ebbf',40);txt('1차 코일',cx,cy-55);txt('2차 코일',rx,cy-55);txt('I₁='+fmt(m.primary)+' A',cx,cy+70);txt('I₂='+fmt(m.I)+' A',rx,cy+70);txt('같은 양의 코일 법선 → · 역결합 선택 가능',W/2,17,'#a9c9de',12)}\nelse{let x=W*.15,r=W*.85,y=H*.16,b=H*.41;ln(x,y,r,y,'#a8bacd',3);ln(r,y,r,b,'#a8bacd',3);ln(r,b,x,b,'#a8bacd',3);ln(x,b,x,y,'#a8bacd',3);g.fillStyle='#10243a';g.fillRect(x-18,cy-24,36,48);txt(m.source?'전원':'단락',x,cy+5,'#ffca79',11);coil(W*.43,y,Math.min(W*.25,170),32,12);g.fillStyle='#a67440';g.fillRect(W*.65-28,b-11,56,22);txt('R',W*.65,b+4,'white');if(m.I)arr(W*.48,b,-1,0,'#ffca79',45);txt(m.source?'전원 연결 · 전류 증가':'전원 분리 후 RL 폐회로 · 전류 감소',W/2,17);txt('인덕터 L · 전류 연속 · 자체 유도',W/2,H*.47,'#c2d5e7',12)}}\nfunction graph(m){let left=55,right=W-48,top=H*.55,bottom=H-33,mid=(top+bottom)/2,range=[2,1.2,3,24][mode],T=end(s),domain=[2,2,6,13][mode],X=t=>left+(t/domain)*(right-left),Y=v=>mid-v/range*(bottom-top)/2,values=p=>[p.emf,p.I];for(let i=-2;i\u003c=2;i++){let v=i*range/2;ln(left,Y(v),right,Y(v),'#2d455d');txt(fmt(v),left-5,Y(v)+4,'#ff99ae',10,'right');txt(fmt(v),right+5,Y(v)+4,'#63e1d0',10,'left')}for(let j=0;j\u003c=4;j++)txt(fmt(domain*j/4),X(domain*j/4),bottom+15,'#a7bed4',11);txt('ε (V)',left,top-8,'#ff99ae',11,'left');txt('I (A)',right,top-8,'#63e1d0',11,'right');txt('t (s)',W/2,H-7,'#bdd4e6',11);for(let k=0;k\u003c2;k++){g.beginPath();for(let j=0;j\u003c=250;j++){let u=T*j/250,v=values(calc(s,u))[k];j?g.lineTo(X(u),Y(v)):g.moveTo(X(u),Y(v))}g.strokeStyle=['#ff99ae','#63e1d0'][k];g.lineWidth=2.3;g.stroke()}ln(X(t),top,X(t),bottom,'#ffd47d',1);let vals=values(m);dot(X(t),Y(vals[0]),4,'#ff99ae');dot(X(t),Y(vals[1]),4,'#63e1d0');}\nfunction draw(){let bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#142a3f');bg.addColorStop(1,'#081321');g.fillStyle=bg;g.fillRect(0,0,W,H);let m=calc(s,t);scene(m);graph(m)}\nfunction summary(p){let m=calc(p.p,p.t);return 'ε '+fmt(m.emf)+' V / I '+fmt(m.I)+' A @ '+fmt(p.t)+' s'}\nfunction update(){let m=calc(s,t),rows=mode===0?[['한 회 선속 Φ',fmt(m.phi*1000)+' mWb'],['쇄교 자속 NΦ',fmt(m.lambda)+' Wb·회'],['유도 기전력',fmt(m.emf)+' V'],['유도 전류',fmt(m.I)+' A'],['상대 속도',fmt(m.rel)+' m/s'],['자석의 반작용',fmt(m.F)+' N']]:mode===1?[['선속 Φ',fmt(m.phi)+' Wb'],['기전력',fmt(m.emf)+' V'],['전류',fmt(m.I)+' A'],['막대의 자기력',fmt(m.F)+' N'],['저항의 소비 전력',fmt(m.P)+' W']]:mode===2?[['1차 전류',fmt(m.primary)+' A'],['쇄교 자속',fmt(m.lambda)+' Wb·회'],['2차 기전력',fmt(m.emf)+' V'],['2차 전류',fmt(m.I)+' A']]:[['전류',fmt(m.I)+' A'],['자체 유도 기전력',fmt(m.emf)+' V'],['시정수 L/R',fmt(m.tau)+' s'],['저장 에너지',fmt(m.U)+' J'],['저항 소비 전력',fmt(m.Pr)+' W']];$('metrics').innerHTML=rows.map(([k,v])=>'\u003cdiv class=\"metric\">'+k+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('hint').textContent=['자석과 코일을 같은 속도로 움직이면 상대 위치가 일정합니다. 유도 기전력은 0입니다.','막대 운동에 반대하는 자기력과 저항의 전력 소비를 비교하세요.','1차 전류가 증가할 때와 감소할 때 2차 기전력의 부호를 비교하세요.','전원 연결 시 전류가 점차 증가하며, 전원을 분리한 폐회로에서 저장 에너지가 저항으로 전달됩니다.'][mode]+'  t='+fmt(t)+' s';draw()}\nfunction slider(k,label,min,max,step){let el=document.createElement('label');el.innerHTML=label+' \u003coutput>\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';let e=el.querySelector('input'),o=el.querySelector('output');o.textContent=s[k];e.oninput=()=>{s[k]=+e.value;o.textContent=s[k];t=0;running=false;update()};$('controls').append(el)}\nfunction choose(k,label,opts){let el=document.createElement('label');el.textContent=label;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;t=0;running=false;update()};el.append(e);$('controls').append(el)}\nfunction build(){$('controls').innerHTML='';if(mode===0){slider('vm','자석 속도 (m/s)',-.2,.2,.05);slider('vc','코일 속도 (m/s)',-.2,.2,.05);slider('N','감은 수',50,300,50);slider('peak','최대 1회 선속 (mWb)',.2,2,.1);slider('R','저항 (Ω)',2,20,1);choose('pole','자석 방향',[[1,'S | N'],[-1,'N | S']]);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===1){slider('B','자기장 (T)',-1,1,.1);slider('v','막대 속도 (m/s)',-.1,.4,.05);slider('l','레일 간격 (m)',.1,1,.1);slider('R','저항 (Ω)',1,20,1);choose('closed','회로',[[1,'닫힘'],[0,'열림']])}else if(mode===2){slider('M','상호 인덕턴스 (H)',.05,.5,.05);slider('I','최대 1차 전류 (A)',0,3,.1);slider('T','변화 시간 (s)',.5,3,.5);slider('R','2차 저항 (Ω)',1,20,1);choose('pole','결합 부호',[[1,'같은 법선'],[-1,'반대 결합']]);choose('closed','2차 회로',[[1,'닫힘'],[0,'열림']])}else{slider('L','인덕턴스 (H)',.2,2,.1);slider('R','저항 (Ω)',1,10,.5);slider('V','전압 (V)',2,24,1);slider('off','전원 분리 시각 (s)',.5,3,.5)}$('formula').textContent=['ε=−d(NΦ)/dt · F반작용 v상대 = −εI','ε=Bℓv (시계 방향 +) · Fₓ=−IBℓ · P=εI','ε₂=−M dI₁/dt (결합 부호 포함)','L dI/dt+RI=V · εL=−L dI/dt · U=½LI²'][mode];$('assume').textContent=['축상 선속의 가우스 근사. 자석·코일을 외부에서 일정 속도로 이동시키며 저항만 있는 회로의 반작용을 표시합니다. 정지 화면은 선택 시각의 순간값입니다.','균일한 z방향 자기장(부호로 방향 선택), 마찰 없는 레일, 저항성 회로. +전류는 막대에서 아래 방향. 막대와 레일 간격은 개념 배율.','1차 전류를 외부 전원으로 선형 제어하는 이상 모델. 2차 자체 인덕턴스와 1차에 대한 반작용은 무시합니다.','직류 전원 분리 시 전원을 우회하여 RL 폐회로를 유지합니다. 이상적 인덕터·저항, 스위치 순간 전류 연속.'][mode];update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('play').onclick=()=>{if(t>=end(s))t=0;running=true;last=0};$('pause').onclick=()=>running=false;$('step').onclick=()=>{running=false;t=Math.min(end(s),t+end(s)/80);update()};$('reset').onclick=()=>{s=def();t=0;running=false;saved=[null,null];build()};['a','b'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={p:{...s},t};update()});function frame(now){if(running){if(last)t=Math.min(end(s),t+Math.min(.05,(now-last)/1000)*end(s)/7);last=now;if(t>=end(s))running=false;update()}requestAnimationFrame(frame)}document.addEventListener('visibilitychange',()=>{if(document.hidden)running=false});new ResizeObserver(resize).observe(cv);build();resize();requestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>"];const names=["자석·코일 기본 실험","패러데이 법칙·변수","상대운동·렌츠 법칙","운동 기전력","상호 유도","자체 유도·RL"];const tabs=document.getElementById('tabs'),frame=document.getElementById('lab');function select(i){[...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));frame.title=names[i];frame.srcdoc=pages[i]}names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.setAttribute('role','tab');b.onclick=()=>select(i);tabs.append(b)});select(0);</script></body></html>
