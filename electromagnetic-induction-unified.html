<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전자기 유도 통합실험실 | WiseWhisper</title><style>*{box-sizing:border-box}body{margin:0;background:#080d15;color:#e4edf8;font:15px system-ui}header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 15px;background:#101c2c;border-bottom:1px solid #33465b}h1{font-size:clamp(19px,2vw,26px);margin:0}header small{color:#a3b8cd}nav{display:flex;gap:5px;flex-wrap:wrap;padding:7px 12px}button{font:inherit;color:#e4edf8;background:#1b2d40;border:1px solid #40596f;border-radius:7px;padding:8px 12px;cursor:pointer}button[aria-selected=true]{background:#176458;border-color:#5de4ca}iframe{display:block;border:0;width:100%;flex:1;min-height:440px;background:#080d15}body{display:flex;flex-direction:column;min-height:100dvh;height:100dvh}footer{text-align:center;font-size:11px;color:#91a6ba;padding:3px}@media(max-width:760px){header{display:block;padding:8px}nav{padding:5px}button{padding:7px 9px;font-size:13px}iframe{min-height:420px}}</style></head><body><header><h1>전자기 유도 통합실험실</h1><small>패러데이 · 렌츠 · 운동 기전력 · 상호 및 자체 유도</small></header><nav id="tabs" role="tablist"></nav><iframe id="lab" title="전자기 유도 실험"></iframe><footer>© WiseWhisper · 온라인 과학실험실</footer><script>const pages=["\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"theme-color\" content=\"#080e19\">\n\u003cmeta name=\"description\" content=\"WiseWhisper 전자기 유도 통합 실험실: 코일 내부 자석 통과, 패러데이 법칙, 렌츠 법칙, 자속·기전력·전류 그래프\">\n\u003ctitle>전자기 유도 · 자석과 코일 | WiseWhisper\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;--bg:#060c15;--panel:#101e30;--panel2:#0b1726;--line:#293e56;--txt:#edf6ff;--muted:#abc1d6;--blue:#54c5ff;--pink:#ff728e;--gold:#ffc765;--green:#67e2ae;--focus:#ffffff}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 14% -15%,#17344f 0,#080f1b 45%,#050910 100%);color:var(--txt);font-family:system-ui,-apple-system,\"Noto Sans KR\",\"Malgun Gothic\",sans-serif}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\n.app{max-width:1680px;margin:0 auto;padding:12px 16px 24px}.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#83d7fb;font-weight:800}.hero h1{font-size:clamp(22px,2.5vw,32px);margin:2px 0 4px;letter-spacing:-.03em}.hero p{font-size:13px;color:var(--muted);margin:0}.law{border:1px solid #345776;border-radius:11px;background:#12233a;padding:10px 13px;font-size:15px;font-weight:750;white-space:nowrap}\n.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;margin:0 0 8px;scrollbar-width:thin;border-bottom:1px solid var(--line)}.tabs button{border:1px solid #344a63;background:#162539;border-radius:9px;color:#c8d9ed;font-weight:750;font-size:13px;white-space:nowrap;min-height:39px;padding:9px 13px}.tabs button[aria-selected=true]{background:#135a86;border-color:#70c4ef;color:#fff}\n.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px;background:#101d2e;border:1px solid var(--line);border-radius:12px;margin-bottom:9px}.btn{min-height:36px;padding:7px 11px;border:1px solid #405a75;background:#20354d;border-radius:8px;color:var(--txt);font-weight:750;font-size:13px}.btn:hover{background:#294c6d}.btn.primary{background:#106b9b;border-color:#49afd9}.btn.selected{background:#114a3c;border-color:#56bb91}.inline{display:flex;align-items:center;gap:6px;font-size:12px;color:#d9e9f7;font-weight:750}.inline select{max-width:145px;background:#101f32;color:white;border:1px solid #405a75;padding:7px 6px;border-radius:7px}.inline input[type=range]{width:100px;accent-color:#64cafa}.inline input[type=checkbox]{accent-color:#5ad6ad;width:18px;height:18px}.grow{flex:1}.tiny{font-size:11px;color:#9eb8cc}\n.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 0}.metric{border:1px solid #2d435c;background:#102035;border-radius:10px;padding:9px 12px}.metric small{font-size:11px;color:#aac1d7;display:block}.metric strong{display:block;font-size:clamp(15px,1.5vw,20px);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}.metric:nth-child(1) strong{color:#fff}.metric:nth-child(2) strong{color:var(--blue)}.metric:nth-child(3) strong{color:var(--pink)}.metric:nth-child(4) strong{color:var(--gold)}\n[hidden]{display:none!important}.panel{margin-top:0}.work{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(260px,1fr);gap:10px}.card{background:linear-gradient(180deg,#101e30,#0a1523);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.card h2{font-size:17px;margin:0 0 6px}.lead{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 8px}.scene{display:block;width:100%;height:clamp(370px,54vh,690px);border:1px solid #254762;background:#081523;border-radius:10px;touch-action:none;cursor:grab}.scene.dragging{cursor:grabbing}.side{display:flex;flex-direction:column;gap:9px}.info{padding:11px 12px;border-radius:10px;background:#15293e;border:1px solid #2b4c66;font-size:13px;line-height:1.55}.info b{color:var(--green)}.bar{margin:9px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tag{font-size:12px;color:#83d7ff;padding:5px 8px;border-radius:99px;background:#102b41;border:1px solid #2f6384;font-weight:700}.field{margin-bottom:12px}.field label{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#d8e7f6;font-size:13px;font-weight:700;margin-bottom:4px}.field output{color:#8bddff;font-variant-numeric:tabular-nums}.field input[type=range]{width:100%;accent-color:var(--blue)}.field p{font-size:11px;line-height:1.5;color:#9eb6cb;margin:4px 0 0}.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:#bad0e1}.swatch{display:inline-block;width:13px;height:4px;border-radius:8px;margin-right:4px;vertical-align:middle}.meter{width:100%;height:115px;position:relative;border-radius:11px;background:#0a1727;border:1px solid #31506b;display:flex;flex-direction:column;align-items:center;justify-content:center}.meter svg{width:min(100%,235px);height:105px}.meter .caption{position:absolute;top:7px;left:9px;font-size:11px;color:#9fc4db}\n.graph{display:block;width:100%;height:clamp(430px,62vh,720px);background:#071423;border:1px solid #274563;border-radius:10px}.graphside .info{margin-top:10px}.scenario{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.scenario button{padding:10px 8px;min-height:48px}.lesson{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lesson article{padding:16px;border:1px solid #2d4660;background:#101f32;border-radius:13px}.lesson h2{font-size:18px;margin:0 0 10px;color:#9bdafd}.lesson p,.lesson li{font-size:14px;line-height:1.8;color:#d3e0ee}.lesson ul,.lesson ol{padding-left:19px}.formula{padding:12px;background:#091728;border-left:3px solid #56bdec;border-radius:6px;color:#e7f8ff;font-size:16px;overflow-wrap:anywhere}.lesson details{margin:9px 0;padding:9px 12px;border:1px solid #304960;border-radius:8px}.lesson summary{cursor:pointer;color:#e6f4ff;font-weight:700}.footer{font-size:11px;color:#8dabc3;margin-top:12px;line-height:1.6}\n@media(max-width:900px){.work{grid-template-columns:1fr}.scene{height:clamp(350px,48vh,560px)}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.side>*{min-width:0}.lesson{grid-template-columns:1fr}}@media(max-width:550px){.app{padding:10px 9px 20px}.hero h1{font-size:22px}.law{display:none}.tabs button{padding:8px 9px;font-size:12px}.toolbar{gap:5px}.btn{padding:7px 8px;font-size:12px}.metrics{gap:5px}.metric{padding:8px 6px}.metric strong{font-size:14px}.scene{height:365px}.side{display:flex}.lesson article{padding:12px}.scenario{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\u003cdiv class=\"app\">\n\u003cheader class=\"hero\">\u003cdiv>\u003cdiv class=\"eyebrow\">WISEWHISPER · INTERACTIVE PHYSICS LAB\u003c/div>\u003ch1>🧲 전자기 유도 통합 가상실험실\u003c/h1>\u003cp>자석이 코일 \u003cb>속을 통과\u003c/b>하면서 자속 · 유도 기전력 · 전류가 어떻게 바뀌는지 탐구합니다.\u003c/p>\u003c/div>\u003cdiv class=\"law\">패러데이 법칙: ε = −d(NΦ)/dt &nbsp; · &nbsp; I = ε/R\u003c/div>\u003c/header>\n\u003cnav class=\"tabs\" role=\"tablist\" aria-label=\"실험 탭\">\n\u003cbutton data-tab=\"basic\" role=\"tab\" aria-selected=\"true\">① 기본 실험\u003c/button>\n\u003cbutton data-tab=\"variables\" role=\"tab\" aria-selected=\"false\">② 변수 실험\u003c/button>\n\u003cbutton data-tab=\"graphs\" role=\"tab\" aria-selected=\"false\">③ 그래프 분석\u003c/button>\n\u003cbutton data-tab=\"lenz\" role=\"tab\" aria-selected=\"false\">④ 렌츠 법칙\u003c/button>\n\u003cbutton data-tab=\"extra\" role=\"tab\" aria-selected=\"false\">⑤ 확장 실험\u003c/button>\n\u003cbutton data-tab=\"learn\" role=\"tab\" aria-selected=\"false\">⑥ 개념·탐구\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"toolbar\" id=\"toolbar\">\n\u003cbutton id=\"play\" class=\"btn primary\">▶ 재생\u003c/button>\n\u003cbutton id=\"pause\" class=\"btn\">⏸ 정지\u003c/button>\n\u003cbutton id=\"reset\" class=\"btn\">↺ 초기화\u003c/button>\n\u003cbutton id=\"reverse\" class=\"btn\">⇄ 방향 반전\u003c/button>\n\u003clabel class=\"inline\">방식 \u003cselect id=\"mode\">\u003coption value=\"auto\">한 번 통과\u003c/option>\u003coption value=\"repeat\">자동 왕복\u003c/option>\u003coption value=\"manual\">직접 드래그\u003c/option>\u003c/select>\u003c/label>\n\u003clabel class=\"inline\">속력 \u003cinput id=\"speed\" type=\"range\" min=\"5\" max=\"60\" step=\"5\" value=\"20\">\u003coutput id=\"speedOut\">20 cm/s\u003c/output>\u003c/label>\n\u003clabel class=\"inline\">자석 극 \u003cselect id=\"pole\">\u003coption value=\"1\">S | N →\u003c/option>\u003coption value=\"-1\">← N | S\u003c/option>\u003c/select>\u003c/label>\n\u003clabel class=\"inline\">\u003cinput id=\"closed\" type=\"checkbox\" checked> 회로 닫기\u003c/label>\n\u003c/div>\n\u003cdiv class=\"metrics\" id=\"readouts\" role=\"status\" aria-live=\"off\">\n\u003cdiv class=\"metric\">\u003csmall>자석 위치 / 속도\u003c/small>\u003cstrong id=\"position\">−36.0 cm\u003c/strong>\u003csmall id=\"velocity\">0.0 cm/s\u003c/small>\u003c/div>\n\u003cdiv class=\"metric\">\u003csmall>총 자속 연결 NΦ\u003c/small>\u003cstrong id=\"flux\">0.00 mWb\u003c/strong>\u003csmall id=\"singleFlux\">한 회 선속 Φ\u003c/small>\u003c/div>\n\u003cdiv class=\"metric\">\u003csmall>유도 기전력 ε\u003c/small>\u003cstrong id=\"emf\">0.0 mV\u003c/strong>\u003csmall>개방 회로에서도 존재\u003c/small>\u003c/div>\n\u003cdiv class=\"metric\">\u003csmall>유도 전류 I\u003c/small>\u003cstrong id=\"current\">0.00 mA\u003c/strong>\u003csmall id=\"currentDir\">회로 닫힘 · 정지\u003c/small>\u003c/div>\n\u003c/div>\n\u003csection class=\"panel\" id=\"panel-basic\" role=\"tabpanel\">\n\u003cdiv class=\"work\">\n\u003cdiv class=\"card\">\u003ch2>코일 내부 관통 실험\u003c/h2>\u003cp class=\"lead\">자석은 코일 뒤로 숨지 않고 원통 내부를 통과합니다. 앞쪽·뒤쪽 코일 권선을 따로 그려 입체적인 통과 과정을 보여 줍니다.\u003c/p>\u003ccanvas class=\"scene\" id=\"sceneBasic\" aria-label=\"막대자석이 코일 원통 내부를 왼쪽에서 오른쪽으로 관통하는 실험 장면\">\u003c/canvas>\u003cdiv class=\"bar\">\u003cspan class=\"tag\" id=\"stage\">코일 왼쪽 · 접근 전\u003c/span>\u003cspan class=\"tag\" id=\"motion\">정지\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"side\">\n\u003cdiv class=\"card\">\u003ch2>실시간 관찰\u003c/h2>\u003cp class=\"lead\">자석의 위치와 운동 방향에 따른 결과입니다.\u003c/p>\u003cdiv class=\"info\" id=\"statusBasic\">자석이 정지해 있습니다.\u003c/div>\u003cp class=\"lead\" style=\"margin-top:10px\">검류계 (바늘은 유도 전류만 표시)\u003c/p>\u003cdiv class=\"meter\" id=\"meterBasic\">\u003cspan class=\"caption\">I = ε / R\u003c/span>\u003csvg viewBox=\"0 0 220 102\">\u003cpath d=\"M30 83 A80 80 0 0 1 190 83\" fill=\"none\" stroke=\"#567d9a\" stroke-width=\"3\"/>\u003cpath d=\"M45 85V79M175 85V79\" stroke=\"#9cb4c9\" stroke-width=\"2\"/>\u003ctext x=\"20\" y=\"92\" fill=\"#ff829c\" font-size=\"13\">−\u003c/text>\u003ctext x=\"198\" y=\"92\" fill=\"#6fe4b1\" font-size=\"13\">+\u003c/text>\u003ctext x=\"108\" y=\"13\" fill=\"#cddff0\" font-size=\"12\">0\u003c/text>\u003cg id=\"needle\" transform=\"rotate(0 110 87)\">\u003cpath d=\"M110 87 L110 19\" stroke=\"#ff8090\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003c/g>\u003ccircle cx=\"110\" cy=\"87\" r=\"7\" fill=\"#85b8d8\"/>\u003c/svg>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>관찰 포인트\u003c/h2>\u003cdiv class=\"info\">① 왼쪽에서 접근하며 기전력의 부호 관찰\u003cbr>② 중심 통과에서 기전력 약 0 확인\u003cbr>③ 오른쪽으로 이탈하며 부호 반전 확인\u003c/div>\u003cp class=\"lead\" style=\"margin-top:10px\">직접 끌기 모드에서 자석을 드래그한 뒤 손을 떼면 속도가 0으로 돌아옵니다.\u003c/p>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"panel-variables\" role=\"tabpanel\" hidden>\n\u003cdiv class=\"work\">\u003cdiv class=\"card\">\u003ch2>조건을 바꾸면서 코일을 통과시키기\u003c/h2>\u003cp class=\"lead\">한 번에 하나의 변수만 조절하고 나머지는 일정하게 유지해 유도 기전력과 전류의 변화를 비교하세요.\u003c/p>\u003ccanvas class=\"scene\" id=\"sceneVariables\">\u003c/canvas>\u003cdiv class=\"bar\">\u003cspan class=\"tag\" id=\"variableStage\">변수 실험\u003c/span>\u003cbutton class=\"btn\" id=\"defaultVars\">변수 기본값\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"side\">\u003cdiv class=\"card\">\u003ch2>실험 변수\u003c/h2>\n\u003cdiv class=\"field\">\u003clabel for=\"turns\">코일 감은 수 N \u003coutput id=\"turnsOut\">200회\u003c/output>\u003c/label>\u003cinput id=\"turns\" type=\"range\" min=\"50\" max=\"500\" step=\"10\" value=\"200\">\u003cp>N이 증가하면 같은 선속 변화에서 기전력도 증가합니다.\u003c/p>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"strength\">자석 세기 \u003coutput id=\"strengthOut\">1.0배\u003c/output>\u003c/label>\u003cinput id=\"strength\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\">\u003cp>자석 세기를 높이면 자기 선속 변화량이 커집니다.\u003c/p>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"radius\">코일 반지름 \u003coutput id=\"radiusOut\">50 mm\u003c/output>\u003c/label>\u003cinput id=\"radius\" type=\"range\" min=\"30\" max=\"80\" step=\"1\" value=\"50\">\u003cp>유효 면적과 자속 분포 모양이 함께 변하는 근사 모형입니다.\u003c/p>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"resistance\">회로 저항 R \u003coutput id=\"resistanceOut\">8 Ω\u003c/output>\u003c/label>\u003cinput id=\"resistance\" type=\"range\" min=\"1\" max=\"30\" step=\"1\" value=\"8\">\u003cp>같은 기전력에서 R이 커지면 전류가 작아집니다.\u003c/p>\u003c/div>\n\u003c/div>\u003cdiv class=\"info\">상단의 속력·자석 극·회로 개폐 조건은 모든 탭에 공통 적용됩니다.\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" id=\"panel-graphs\" role=\"tabpanel\" hidden>\n\u003cdiv class=\"work\">\u003cdiv class=\"card\">\u003ch2>세 물리량의 시간 그래프\u003c/h2>\u003cp class=\"lead\">세로축은 선택한 측정 범위에서 고정합니다. 범위를 넘으면 그래프가 잘릴 수 있으므로 넓은 범위로 전환하세요. 가로축은 최근 12초이며, 자속 연결 → 기전력 → 전류의 관계를 비교합니다.\u003c/p>\u003clabel class=\"inline\">그래프 세로축 \u003cselect id=\"fixedScale\">\u003coption value=\"0\">기본 ±100 mWb / 500 mV / 100 mA\u003c/option>\u003coption value=\"1\">넓게 ±650 mWb / 6000 mV / 6000 mA\u003c/option>\u003coption value=\"2\">정밀 ±20 mWb / 100 mV / 20 mA\u003c/option>\u003c/select>\u003c/label>\u003ccanvas class=\"graph\" id=\"timeGraph\" aria-label=\"시간에 따른 자속 연결, 기전력, 전류의 개별 그래프\">\u003c/canvas>\u003cdiv class=\"legend\" style=\"margin-top:8px\">\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--blue)\">\u003c/i>NΦ (mWb)\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--pink)\">\u003c/i>ε (mV)\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--gold)\">\u003c/i>I (mA)\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"side graphside\">\u003cdiv class=\"card\">\u003ch2>그래프 분석\u003c/h2>\u003cdiv class=\"info\">유도 기전력의 부호는 \u003cb>자속 연결 그래프의 기울기와 반대\u003c/b>입니다. 회로를 열어도 자속 연결과 기전력은 그대로 계산되지만 전류는 0이 됩니다.\u003c/div>\u003cbutton id=\"clearHistory\" class=\"btn\" style=\"margin-top:9px\">그래프 기록 초기화\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003ch2>그래프 탐구\u003c/h2>\u003cp class=\"lead\">① 자속 연결이 가장 클 때 기전력은?\u003cbr>② 기전력이 +에서 −로 바뀌는 위치는?\u003cbr>③ 회로 저항을 2배로 하면 전류 곡선은?\u003cbr>④ 자석을 멈추면 그래프는?\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" id=\"panel-lenz\" role=\"tabpanel\" hidden>\n\u003cdiv class=\"work\">\u003cdiv class=\"card\">\u003ch2>렌츠 법칙 — 전류 방향과 코일 극성\u003c/h2>\u003cp class=\"lead\">왼쪽에서 코일을 바라볼 때의 시계·반시계 방향을 기준으로 표시합니다. 움직이는 자석의 자기 선속 변화를 방해하도록 코일의 유도 자기장이 나타납니다.\u003c/p>\u003ccanvas class=\"scene\" id=\"sceneLenz\">\u003c/canvas>\u003cdiv class=\"bar\">\u003cspan class=\"tag\" id=\"lenzState\">코일의 극성\u003c/span>\u003cspan class=\"tag\" id=\"fieldState\">유도 자기장 없음\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"side\">\u003cdiv class=\"card\">\u003ch2>현재 상황 분석\u003c/h2>\u003cdiv id=\"lenzExplain\" class=\"info\">자석을 움직여 유도 전류를 관찰하세요.\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003ch2>방향 판정 기준\u003c/h2>\u003cp class=\"lead\">코일의 왼쪽을 바라보는 것이 아니라, \u003cb>왼쪽에서 오른쪽으로 코일을 바라보는\u003c/b> 관찰자 기준입니다.\u003c/p>\u003cdiv class=\"info\">시계 방향 전류 → 코일 자기장 오른쪽(+x)\u003cbr>반시계 방향 전류 → 코일 자기장 왼쪽(−x)\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003ch2>자주 혼동하는 상황\u003c/h2>\u003cp class=\"lead\">자석이 코일 반대편으로 이동해도 자석의 N·S극이 뒤집히는 것은 아닙니다. 코일이 만드는 자기장의 방향은 \u003cb>자속 변화율\u003c/b>에 따라 결정됩니다.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" id=\"panel-extra\" role=\"tabpanel\" hidden>\n\u003cdiv class=\"work\">\u003cdiv class=\"card\">\u003ch2>추가 상황 실험\u003c/h2>\u003cp class=\"lead\">실험 조건 버튼을 누르고 자석이 코일 속을 통과할 때의 물리량과 전류 방향을 비교해 보세요.\u003c/p>\u003ccanvas class=\"scene\" id=\"sceneExtra\">\u003c/canvas>\u003cdiv class=\"bar\">\u003cspan class=\"tag\" id=\"scenarioName\">기본 조건\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"side\">\u003cdiv class=\"card\">\u003ch2>탐구 시나리오\u003c/h2>\u003cdiv class=\"scenario\">\n\u003cbutton class=\"btn\" data-case=\"north\">① N·S극 반전\u003c/button>\u003cbutton class=\"btn\" data-case=\"fast\">② 속력 2배\u003c/button>\n\u003cbutton class=\"btn\" data-case=\"turns\">③ 감은 수 2배\u003c/button>\u003cbutton class=\"btn\" data-case=\"open\">④ 회로 열기\u003c/button>\n\u003cbutton class=\"btn\" data-case=\"resistance\">⑤ 저항 2배\u003c/button>\u003cbutton class=\"btn\" data-case=\"reset\">⑥ 기본 조건\u003c/button>\n\u003c/div>\u003c/div>\u003cdiv class=\"info\" id=\"scenarioExplain\">시나리오를 선택하면 변화되는 물리량과 예상 결과가 표시됩니다.\u003c/div>\u003cdiv class=\"card\">\u003ch2>실험 설계 원칙\u003c/h2>\u003cp class=\"lead\">각 버튼은 기본 조건에서 한 변수만 바꾼 상태로 시작합니다. 관찰할 물리량과 바뀌지 않아야 할 물리량을 구분하세요.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" id=\"panel-learn\" role=\"tabpanel\" hidden>\n\u003cdiv class=\"lesson\">\n\u003carticle>\u003ch2>① 자기 선속과 유도 기전력\u003c/h2>\u003cp>코일을 통과하는 자기장이 시간에 따라 변하면 기전력이 유도됩니다. 유도 기전력의 크기는 코일의 감은 수와 자기 선속의 시간 변화율에 비례합니다.\u003c/p>\u003cdiv class=\"formula\">Φ = ∫ B · dA &nbsp;&nbsp; / &nbsp;&nbsp; ε = −N dΦ/dt\u003c/div>\u003cp>− 부호는 유도 전류의 방향이 선속 변화를 방해한다는 렌츠 법칙을 나타냅니다.\u003c/p>\u003c/article>\n\u003carticle>\u003ch2>② 코일 속을 통과하는 자석\u003c/h2>\u003cp>자석을 코일 내부로 밀어 넣으면 자속 연결이 증가하고, 코일 중심을 지나 반대편으로 이동하면 감소합니다. 자화 방향을 바꾸면 자속·기전력의 부호가 함께 반전됩니다.\u003c/p>\u003cdiv class=\"formula\">코일 왼쪽 → 코일 내부 → 코일 오른쪽\u003cbr>접근 → 중심 통과 → 이탈\u003c/div>\u003cp>대칭적인 근사 모형에서 코일 중심의 자속 연결은 극값이고, 일정 속력이라면 해당 순간 ε ≈ 0입니다.\u003c/p>\u003c/article>\n\u003carticle>\u003ch2>③ 회로 저항과 전류\u003c/h2>\u003cp>유도 기전력은 회로가 열려 있어도 존재할 수 있지만, 전류는 닫힌 회로에서 흐릅니다. 저항이 커지면 같은 기전력에서 전류는 작아집니다.\u003c/p>\u003cdiv class=\"formula\">I = ε / R &nbsp; (회로가 닫혔을 때)\u003c/div>\u003cp>본 시뮬레이션은 순수 저항 회로를 가정하며 자체 인덕턴스와 과도응답은 생략합니다.\u003c/p>\u003c/article>\n\u003carticle>\u003ch2>④ 근사 모형과 한계\u003c/h2>\u003cp>실험에서 두 버전의 계산식을 통일하기 위해 유한 길이 솔레노이드의 부드러운 축대칭 선속 연결 근사 함수를 사용합니다. 위치에 따른 선속은 중심에서 극값을 갖고 양 끝으로 갈수록 작아집니다.\u003c/p>\u003cdiv class=\"formula\">Λ(x) = N B₀ πr² · S(x)\u003cbr>ε = −v · dΛ/dx\u003c/div>\u003cp>여기서 Λ=NΦ, S(x)는 코일 길이와 반지름에 의해 결정되는 대칭 함수입니다. 실제 자석의 자기장 분포, 자성체 및 코일 저항 이외의 회로 특성은 정밀하게 모사하지 않습니다.\u003c/p>\u003c/article>\n\u003carticle>\u003ch2>⑤ 형성평가\u003c/h2>\u003cdetails>\u003csummary>문제 1. 자석을 코일 중앙에서 정지시키면 유도 전류는?\u003c/summary>\u003cp>정지하면 자속 연결의 시간 변화율이 0이므로 유도 기전력과 전류 모두 0입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>문제 2. 감은 수를 두 배로 하면 기전력은?\u003c/summary>\u003cp>자석 운동과 자기장 조건이 같을 때 유도 기전력은 두 배입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>문제 3. 회로를 열면 기전력도 없어지는가?\u003c/summary>\u003cp>아닙니다. 자속이 변하면 기전력은 생기지만 전류는 흐르지 않습니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>문제 4. 자석이 반대편으로 빠져나가면 자화 방향이 바뀌는가?\u003c/summary>\u003cp>아닙니다. 자석의 N·S 방향은 그대로이며, 선속 변화율의 부호가 바뀌어 유도 기전력 방향이 반전됩니다.\u003c/p>\u003c/details>\u003c/article>\n\u003carticle>\u003ch2>⑥ 수업 탐구 순서\u003c/h2>\u003col>\u003cli>기본 실험에서 자석의 코일 내부 통과와 기전력 변화를 확인합니다.\u003c/li>\u003cli>변수 실험에서 감은 수, 속력, 자기장 세기를 한 가지씩 바꿉니다.\u003c/li>\u003cli>그래프 분석에서 선속의 기울기와 기전력의 부호를 비교합니다.\u003c/li>\u003cli>렌츠 법칙 탭에서 유도 전류 방향을 설명합니다.\u003c/li>\u003cli>확장 실험에서 회로 개방과 저항 변화의 영향을 확인합니다.\u003c/li>\u003c/ol>\u003c/article>\n\u003c/div>\u003c/section>\n\u003cp class=\"footer\">교육용 근사 시뮬레이션 · 실험 장면의 코일은 내부 공간이 보이도록 뒷면 권선 → 자석 → 앞면 권선 순서로 그렸습니다. 감은 수는 물리 계산에 사용하지만 실제로 그리는 권선 수는 가독성을 위한 표현입니다.\u003c/p>\n\u003c/div>\n\u003cscript>\n(function(){\n'use strict';\nconst $=id=>document.getElementById(id);\nconst TAU=2*Math.PI,L=.18,B0=.03,HALF=.42;\nconst state={tab:'basic',x:-.36,v:0,dir:1,running:false,mode:'auto',pole:1,closed:true,speed:.20,N:200,strength:1,radius:.05,R:8,t:0,last:0,lastSample:-1,history:[],dragging:false,dragTime:0,dragId:null,showField:true,scenario:'기본 조건'};\nconst drawCanvases={basic:'sceneBasic',variables:'sceneVariables',lenz:'sceneLenz',extra:'sceneExtra'};\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst f=(v,d=1)=>(v>=0?'+':'−')+Math.abs(v).toFixed(d);\nfunction shape(x){\n const soft=Math.sqrt(state.radius*state.radius+.045*.045);\n const a=x+L/2,b=x-L/2;\n return .5*(a/Math.sqrt(a*a+soft*soft)-b/Math.sqrt(b*b+soft*soft));\n}\nfunction slope(x){\n const sq=state.radius*state.radius+.045*.045,a=x+L/2,b=x-L/2;\n return .5*(sq/Math.pow(a*a+sq,1.5)-sq/Math.pow(b*b+sq,1.5));\n}\nfunction measure(){\n const factor=state.pole*state.N*B0*state.strength*Math.PI*state.radius*state.radius;\n const flux=factor*shape(state.x),emf=-state.v*factor*slope(state.x);\n const current=state.closed?emf/state.R:0;\n return {flux,emf,current,Bind:Math.abs(current)\u003c1e-10?0:Math.sign(current)};\n}\nfunction display(){\n const m=measure();\n $('position').textContent=f(state.x*100,1)+' cm';\n $('velocity').textContent='v = '+f(state.v*100,1)+' cm/s';\n $('flux').textContent=f(m.flux*1000,2)+' mWb';$('singleFlux').textContent='한 회 Φ = '+f(m.flux/state.N*1000,3)+' mWb';\n $('emf').textContent=f(m.emf*1000,2)+' mV';\n $('current').textContent=f(m.current*1000,2)+' mA';\n $('currentDir').textContent=!state.closed?'회로 개방 · I = 0':m.Bind>0?'왼쪽에서 시계 방향':m.Bind\u003c0?'왼쪽에서 반시계 방향':'전류 0';\n $('speedOut').textContent=Math.round(state.speed*100)+' cm/s';\n const where=state.x\u003c-.13?'코일 왼쪽':state.x>.13?'코일 오른쪽':'코일 내부';\n const movement=Math.abs(state.v)\u003c.0001?'정지':state.v>0?'오른쪽 이동 →':'← 왼쪽 이동';\n for(const id of ['stage','variableStage'])$(id).textContent=where+' · '+f(state.x*100,1)+' cm';\n $('motion').textContent=movement;\n const trend=-m.emf;\n let basic;\n if(Math.abs(state.v)\u003c.0001)basic='자석이 정지하여 자기 선속이 변하지 않습니다. 유도 기전력 ε=0, 전류 I=0.';\n else if(Math.abs(m.emf)\u003c.00005)basic='코일 중심의 대칭적인 위치에서 자속이 극값을 이루어 순간 유도 기전력이 거의 0입니다.';\n else basic=where+'에서 '+movement+'. 자속 연결이 '+(trend>0?'증가':'감소')+'하여 유도 기전력이 '+(m.emf>0?'+':'−')+' 부호를 갖습니다.';\n if(!state.closed)basic+=' 회로가 열려 있어 전류는 흐르지 않습니다.';\n $('statusBasic').textContent=basic;\n $('lenzState').textContent=m.Bind>0?'왼쪽 면 S극 / 오른쪽 면 N극':m.Bind\u003c0?'왼쪽 면 N극 / 오른쪽 면 S극':'코일 유도 자극 없음';\n $('fieldState').textContent=m.Bind>0?'유도 자기장 → +x':m.Bind\u003c0?'유도 자기장 ← −x':'유도 자기장 0';\n $('lenzExplain').textContent=(m.Bind===0?(!state.closed?'회로가 열려 전류에 의한 자기장이 생기지 않습니다. 자속 변화가 있으면 기전력은 여전히 발생합니다.':'순간 유도 전류가 0이므로 코일에 유도 자기장이 생기지 않습니다.'):('자석에 의한 선속 변화에 반대하도록 코일의 자기장이 '+(m.Bind>0?'오른쪽(+x)':'왼쪽(−x)')+'을 향합니다. 왼쪽에서 코일을 바라보면 '+(m.Bind>0?'시계':'반시계')+' 방향 전류이며 코일의 왼쪽 면은 '+(m.Bind>0?'S':'N')+'극입니다.'));\n const needle=$('needle');needle.setAttribute('transform','rotate('+clamp(m.current*1000*10,-65,65)+' 110 87)');\n return m;\n}\nfunction makeCanvas(c){\n const d=Math.min(window.devicePixelRatio||1,2),rect=c.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height);\n const iw=Math.round(w*d),ih=Math.round(h*d);if(c.width!==iw||c.height!==ih){c.width=iw;c.height=ih}\n const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return {ctx,w,h};\n}\nfunction drawScene(c){\n const {ctx:g,w,h}=makeCanvas(c);\n const cy=h*.50,area=Math.max(130,w-190),scale=area/(HALF*2),cx=w/2,px=x=>cx+x*scale;\n const ax=px(state.x),mw=clamp(.15*scale,80,190),mh=clamp(.09*scale,66,110);\n const cr=clamp(state.radius*scale*1.5,72,136),cw=clamp(L*scale,140,260),coilLeft=cx-cw/2,coilRight=cx+cw/2,turns=w\u003c500?7:11;\n const xs=Array.from({length:turns},(_,i)=>coilLeft+cw*i/(turns-1));\n const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0e2740');bg.addColorStop(1,'#071320');g.fillStyle=bg;g.fillRect(0,0,w,h);\n g.save();g.strokeStyle='#213c54';g.lineWidth=1;for(let y=20;y\u003ch;y+=45){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}g.restore();\n g.save();g.strokeStyle='#3b5e7a';g.lineWidth=2;const axisY=cy+cr+42;g.beginPath();g.moveTo(18,axisY);g.lineTo(w-18,axisY);g.stroke();\n g.fillStyle='#92afc7';g.font='12px system-ui';g.textAlign='center';g.textBaseline='middle';\n for(let cm=-40;cm\u003c=40;cm+=20){const x=px(cm/100);g.beginPath();g.moveTo(x,axisY-5);g.lineTo(x,axisY+5);g.stroke();g.fillText((cm>0?'+':'')+cm+'cm',x,axisY+20)}\n g.setLineDash([4,6]);g.strokeStyle='#5e8eb5';g.beginPath();g.moveTo(cx,25);g.lineTo(cx,axisY-16);g.stroke();g.setLineDash([]);g.restore();\n // Coil cavity behind the magnet; rear windings are drawn first.\n g.fillStyle='rgba(85,160,221,.12)';g.fillRect(coilLeft,cy-cr,cw,2*cr);\n for(let i=0;i\u003cxs.length;i++){g.beginPath();g.ellipse(xs[i],cy,clamp(cr*.19,10,17),cr,0,Math.PI,2*Math.PI);g.lineWidth=5;g.strokeStyle='#ab782e';g.stroke()}\n // Optional indicative field arrows; these are schematic, not computed field lines.\n if(state.showField){const sg=state.pole;g.save();g.strokeStyle=sg>0?'#fa7483':'#63a9f7';g.fillStyle=g.strokeStyle;g.lineWidth=1.6;g.globalAlpha=.45;for(let k of [-1,1]){const fy=cy+k*(cr+27),x1=ax-60*sg,x2=ax+60*sg;g.beginPath();g.moveTo(x1,fy);g.lineTo(x2,fy);g.stroke();g.beginPath();g.moveTo(x2,fy);g.lineTo(x2-sg*9,fy-6);g.lineTo(x2-sg*9,fy+6);g.closePath();g.fill()}g.restore()}\n // Magnet inside the hollow core.\n g.save();g.shadowColor='#0009';g.shadowBlur=16;g.shadowOffsetY=5;\n const left=state.pole===1?'#297dd0':'#e34855',right=state.pole===1?'#e34855':'#297dd0';\n g.fillStyle=left;g.beginPath();g.roundRect(ax-mw/2,cy-mh/2,mw/2,mh,[8,0,0,8]);g.fill();\n g.fillStyle=right;g.beginPath();g.roundRect(ax,cy-mh/2,mw/2,mh,[0,8,8,0]);g.fill();g.shadowColor='transparent';\n g.strokeStyle='#ffffffa8';g.lineWidth=1.7;g.beginPath();g.roundRect(ax-mw/2,cy-mh/2,mw,mh,8);g.stroke();\n g.fillStyle='white';g.font='bold '+clamp(mh*.38,20,30)+'px system-ui';g.textAlign='center';g.textBaseline='middle';\n g.fillText(state.pole===1?'S':'N',ax-mw/4,cy);g.fillText(state.pole===1?'N':'S',ax+mw/4,cy);g.restore();\n // Near, front halves MUST cover the magnet to show actual inside passage.\n for(const x of xs){g.beginPath();g.ellipse(x,cy,clamp(cr*.19,10,17),cr,0,0,Math.PI);g.lineWidth=7;g.strokeStyle='#c0883e';g.stroke();\n g.beginPath();g.ellipse(x-1,cy-1,clamp(cr*.19,10,17),cr-1,0,0,Math.PI);g.lineWidth=2.6;g.strokeStyle='#ffd57e';g.stroke()}\n // Labels and movement overlay.\n g.textAlign='center';g.textBaseline='alphabetic';g.font='bold '+(w\u003c500?13:16)+'px system-ui';g.fillStyle='#c2e7fd';g.fillText('코일 속 자석 통로',cx,clamp(cy-cr-31,22,h-50));\n g.font='bold '+(w\u003c500?12:15)+'px system-ui';g.fillStyle='#67e6b5';const motion=Math.abs(state.v)\u003c.001?'■ 정지':state.v>0?'이동 방향  →':'←  이동 방향';\n g.fillText(motion,clamp(ax,65,w-65),clamp(cy-cr-12,34,h-38));\n g.fillStyle='#a8c7df';g.font='12px system-ui';g.fillText('자석 중심 '+f(state.x*100,1)+' cm',clamp(ax,82,w-82),cy+cr+22);\n g.textAlign='left';g.fillText('← 왼쪽',14,24);g.textAlign='right';g.fillText('오른쪽 →',w-14,24);\n if(state.tab==='lenz'){const m=measure();g.font='bold 14px system-ui';g.textAlign='center';g.fillStyle='#68e8b5';g.fillText(m.Bind>0?'유도 자기장 →':m.Bind\u003c0?'← 유도 자기장':'유도 자기장 0',cx,axisY+49)}\n}\nfunction drawGraph(c){\n const {ctx:g,w,h}=makeCanvas(c);g.fillStyle='#071523';g.fillRect(0,0,w,h);\n const vals=[{k:'flux',name:'총 자속 연결 NΦ',unit:'mWb',c:'#54c5ff',mult:1000},{k:'emf',name:'유도 기전력 ε',unit:'mV',c:'#ff728e',mult:1000},{k:'current',name:'유도 전류 I',unit:'mA',c:'#ffc765',mult:1000}];\n const left=66,right=20,top=22,padBottom=32,gap=23;\n const panelHeight=(h-top-padBottom-gap*2)/3;\n for(let j=0;j\u003c3;j++){const item=vals[j],y=top+j*(panelHeight+gap),bottom=y+panelHeight;\n  const rect={l:left,r:w-right,t:y+20,b:bottom-11};const scale=[[100,500,100],[650,6000,6000],[20,100,20]][+$('fixedScale').value][j];\n  const mid=(rect.t+rect.b)/2,amp=Math.max(10,(rect.b-rect.t)*.5);\n  g.font='bold 13px system-ui';g.fillStyle=item.c;g.textAlign='left';g.fillText(item.name+' ('+item.unit+')',left,y+12);\n  g.textAlign='right';g.fillStyle='#a9c1d5';g.font='11px system-ui';\n  g.fillText('+'+scale.toFixed(scale\u003c1?2:scale\u003c10?1:0),left-5,rect.t+7);\n  g.fillText('0',left-5,mid+4);g.fillText('−'+scale.toFixed(scale\u003c1?2:scale\u003c10?1:0),left-5,rect.b);\n  g.strokeStyle='#36506a';g.lineWidth=1;for(const yy of [rect.t,mid,rect.b]){g.beginPath();g.moveTo(left,yy);g.lineTo(w-right,yy);g.stroke()}\n  const tmax=Math.max(12,state.t),tmin=tmax-12;\n  g.strokeStyle=item.c;g.lineWidth=2.8;g.lineJoin='round';g.beginPath();let started=false;\n  for(const p of state.history){if(p.t\u003ctmin)continue;const xx=left+(p.t-tmin)/12*(w-left-right),yy=mid-clamp(p[item.k]*item.mult/scale,-1,1)*amp;\n    if(!started){g.moveTo(xx,yy);started=true}else g.lineTo(xx,yy)}\n  if(started)g.stroke();\n  if(j===2){g.font='11px system-ui';g.fillStyle='#abc7db';g.textAlign='left';g.fillText(tmin.toFixed(1)+' s',left,bottom+11);g.textAlign='right';g.fillText(tmax.toFixed(1)+' s',w-right,bottom+11)}\n }\n}\nfunction render(){\n const m=display();\n if(state.tab==='graphs')drawGraph($('timeGraph'));\n else if(drawCanvases[state.tab])drawScene($(drawCanvases[state.tab]));\n}\nfunction record(force=false){\n if(!force&&state.t-state.lastSample\u003c.04)return;\n const m=measure();state.lastSample=state.t;state.history.push({t:state.t,flux:m.flux,emf:m.emf,current:m.current});\n while(state.history.length>0&&state.history[0].t\u003cstate.t-12.2)state.history.shift();\n}\nfunction step(now){\n let dt=0;if(state.last)dt=clamp((now-state.last)/1000,0,.055);state.last=now;\n if(state.running&&state.mode!=='manual'&&!state.dragging){\n  let dx=state.speed*dt;while(dx>1e-10){const boundary=state.dir>0?HALF:-HALF,remaining=Math.abs(boundary-state.x),advance=Math.min(dx,remaining);\n   state.x+=advance*state.dir;dx-=advance;if(remaining\u003c=advance+1e-10){if(state.mode==='repeat')state.dir*=-1;else{state.running=false;updatePlay();break}}if(advance\u003c=1e-12)break}\n  state.v=state.running?state.dir*state.speed:0;state.t+=dt;record(!state.running);\n }else if(state.dragging){state.t+=dt;if(performance.now()-state.dragTime>140){state.v=0}record()}\n else{if(state.v!==0){state.v=0;state.t+=.001;record(true)}}\n render();requestAnimationFrame(step);\n}\nfunction resetVars(){\n state.N=200;state.strength=1;state.radius=.05;state.R=8;state.speed=.2;state.pole=1;state.closed=true;\n $('turns').value='200';$('strength').value='1';$('radius').value='50';$('resistance').value='8';$('speed').value='20';$('pole').value='1';$('closed').checked=true;outputs();\n}\nfunction outputs(){for(const k of ['turns','strength','radius','resistance'])$(k+'Out').textContent=k==='turns'?state.N+'회':k==='strength'?state.strength.toFixed(1)+'배':k==='radius'?Math.round(state.radius*1000)+' mm':state.R+' Ω'}\nfunction resetMotion(){state.running=false;state.x=-.36;state.v=0;state.dir=1;state.t=0;state.history=[];state.lastSample=-1;state.last=0;updatePlay();record(true)}\nfunction updatePlay(){$('play').textContent=state.running?'❚❚ 재생 중':'▶ 재생';$('mode').value=state.mode}\nfunction setTab(tab){\n state.tab=tab;\n document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));\n for(const p of document.querySelectorAll('.panel'))p.hidden=p.id!=='panel-'+tab;\n // 실험 장면과 그래프가 항상 측정값보다 위에 나타나도록 현재 탭의 실험 카드 아래로 이동.\n const readings=$('readouts');\n if(tab!=='learn'){\n  const host=$('panel-'+tab).querySelector('.card');\n  if(host)host.appendChild(readings);\n  readings.hidden=false;\n }else{\n  readings.hidden=true;\n }\n requestAnimationFrame(render);\n}\nfunction coords(c){\n const w=c.getBoundingClientRect().width;return {cx:w/2,scale:Math.max(130,w-190)/(.84)};\n}\nfunction pointerX(c,event){const r=c.getBoundingClientRect(),q=coords(c);return clamp((event.clientX-r.left-q.cx)/q.scale,-HALF,HALF)}\nfunction connectDrag(c){\n c.addEventListener('pointerdown',e=>{if(state.mode!=='manual')return;\n  const q=coords(c),r=c.getBoundingClientRect(),px=q.cx+state.x*q.scale;\n  if(Math.abs(e.clientX-r.left-px)>Math.max(48,Math.min(90,q.scale*.1)))return;\n  state.dragging=true;state.dragId=e.pointerId;state.dragTime=performance.now();state.v=0;state.running=false;updatePlay();\n  c.setPointerCapture(e.pointerId);c.classList.add('dragging');e.preventDefault()});\n c.addEventListener('pointermove',e=>{if(!state.dragging||state.dragId!==e.pointerId)return;\n  const now=performance.now(),newX=pointerX(c,e),dt=Math.max(.016,(now-state.dragTime)/1000);\n  state.v=clamp((newX-state.x)/dt,-1.5,1.5);state.x=newX;state.dragTime=now;record(true);e.preventDefault()});\n const end=e=>{if(!state.dragging||state.dragId!==e.pointerId)return;state.dragging=false;state.dragId=null;state.v=0;c.classList.remove('dragging');record(true)};\n c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('lostpointercapture',end);\n}\n$('play').onclick=()=>{if(state.mode==='manual'){state.mode='auto';$('mode').value='auto'}if(!state.running&&state.mode==='auto'&&((state.dir>0&&state.x>=HALF-1e-9)||(state.dir\u003c0&&state.x\u003c=-HALF+1e-9))){state.x=state.dir>0?-HALF:HALF;state.t=0;state.history=[];state.lastSample=-1}state.running=!state.running;updatePlay()};\n$('pause').onclick=()=>{state.running=false;state.v=0;updatePlay();record(true);render()};\n$('reset').onclick=()=>{resetVars();resetMotion();render()};\n$('reverse').onclick=()=>{state.dir*=-1;state.v=state.running?state.dir*state.speed:0;record(true);render()};\n$('mode').onchange=e=>{state.mode=e.target.value;state.running=false;state.v=0;updatePlay();render()};\n$('speed').oninput=e=>{state.speed=Number(e.target.value)/100;render()};\n$('pole').onchange=e=>{state.pole=Number(e.target.value);record(true);render()};\n$('closed').onchange=e=>{state.closed=e.target.checked;record(true);render()};\n$('turns').oninput=e=>{state.N=Number(e.target.value);outputs();record(true);render()};\n$('strength').oninput=e=>{state.strength=Number(e.target.value);outputs();record(true);render()};\n$('radius').oninput=e=>{state.radius=Number(e.target.value)/1000;outputs();record(true);render()};\n$('resistance').oninput=e=>{state.R=Number(e.target.value);outputs();record(true);render()};\n$('defaultVars').onclick=()=>{resetVars();record(true);render()};\n$('clearHistory').onclick=()=>{state.history=[];state.lastSample=-1;record(true);render()};\nconst scenarios={\n north:['N·S극 반전','자석의 자화 방향만 반대로 바꾸면 같은 운동에서 자속·기전력·전류의 부호가 반전됩니다.'],\n fast:['속력 2배','동일 위치에서 선속 연결은 같지만 시간에 따른 변화율이 약 두 배가 되므로 기전력이 약 두 배입니다.'],\n turns:['감은 수 2배','같은 운동·자석·반지름에서 총 자속 연결과 유도 기전력, 전류는 두 배입니다.'],\n open:['회로 열기','자석이 움직여도 유도 기전력은 발생하지만 유도 전류는 0입니다.'],\n resistance:['저항 2배','유도 기전력은 같고 유도 전류만 절반으로 줄어듭니다.'],\n reset:['기본 조건','속력, 극성, 감은 수, 반지름, 저항, 회로 상태를 기본값으로 복구합니다.']\n};\ndocument.querySelectorAll('[data-case]').forEach(btn=>btn.onclick=()=>{\n resetVars();const k=btn.dataset.case;\n if(k==='north')state.pole=-1;\n if(k==='fast')state.speed=.4;\n if(k==='turns')state.N=400;\n if(k==='open')state.closed=false;\n if(k==='resistance')state.R=16;\n $('pole').value=String(state.pole);$('speed').value=String(Math.round(state.speed*100));$('closed').checked=state.closed;\n $('turns').value=String(state.N);$('resistance').value=String(state.R);outputs();\n resetMotion();state.scenario=scenarios[k][0];$('scenarioName').textContent=state.scenario;$('scenarioExplain').textContent=scenarios[k][1];\n state.mode='auto';state.running=true;updatePlay();render();\n});\ndocument.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>setTab(btn.dataset.tab));\nObject.values(drawCanvases).forEach(id=>connectDrag($(id)));\nwindow.addEventListener('resize',render);\nif('ResizeObserver'in window){new ResizeObserver(()=>render()).observe(document.querySelector('.app'))}\n$('fixedScale').onchange=render;resetVars();resetMotion();setTab('basic');requestAnimationFrame(step);\n})();\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>38 전자기 유도 | 물리 공식 40\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#0b1220;--panel:#152238;--ink:#edf3ff;--muted:#b0c1d9;--blue:#6dcfff;--orange:#ffbe76;--green:#83ead2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:24px}header{margin-bottom:20px}.tag{color:var(--green);font-weight:700;letter-spacing:.1em}h1{font-size:clamp(25px,4vw,38px);margin:6px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.muted,small{color:var(--muted)}.formula{font-size:clamp(22px,4vw,32px);color:var(--blue)}.grid{display:grid;grid-template-columns:1.12fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid #2b3e58;border-radius:18px;padding:20px;min-width:0}.wide{grid-column:1/-1}.controls{display:grid;gap:12px}.control label{display:block;font-weight:600}.pair{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:12px}input,select,button{font:inherit}input[type=range]{width:100%;height:44px;accent-color:var(--blue)}input[type=number],select{width:100%;min-height:44px;background:#0b1729;color:var(--ink);border:1px solid #536b87;border-radius:9px;padding:6px 10px}button{min-height:44px;padding:7px 14px;color:var(--ink);background:#263d59;border:1px solid #58718f;border-radius:9px}button.primary{background:#0d637e}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{padding:10px;background:#0b1729;border-radius:10px}.metric strong{display:block;font-size:21px;overflow-wrap:anywhere}.metric span{font-size:14px;color:var(--muted)}canvas{width:100%;display:block}#scene{height:300px}canvas.graph{height:230px}.equation{background:#0b1729;border-radius:10px;padding:14px;overflow-wrap:anywhere}.status{color:var(--green);min-height:30px}details{border-top:1px solid #3c506a;padding:12px 0}summary{cursor:pointer;font-weight:600;min-height:44px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #3c506a;text-align:left;overflow-wrap:anywhere}.tablewrap{overflow:auto}.preset{font-size:14px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ffbe76;outline-offset:3px}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.panel{padding:15px}.results{gap:5px}.metric{padding:8px}.metric strong{font-size:18px}#scene{height:275px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cheader>\u003cdiv class=\"tag\">PHYSICS LAB · 38 / 40\u003c/div>\u003ch1>전자기 유도 실험실\u003c/h1>\u003cdiv class=\"formula\">ℰ = −N dΦ\u003csub>B\u003c/sub>/dt\u003c/div>\u003cp>무엇을 바꾸면 자기 선속과 유도 기전력, 전류 방향이 어떻게 달라질까요?\u003c/p>\u003cp class=\"muted\">예측 → 조작 → 관찰 → 설명 · 한 바퀴의 선속 Φ\u003csub>B\u003c/sub> = BA cosθ\u003c/p>\u003c/header>\u003cdiv class=\"grid\">\n\u003csection class=\"panel\">\u003ch2>코일과 자기장\u003c/h2>\u003ccanvas id=\"scene\" aria-label=\"코일 법선과 자기장 사이 각도 및 유도 전류 방향\">\u003c/canvas>\u003cdiv id=\"direction\" class=\"status\">\u003c/div>\u003cdiv class=\"results\">\u003cdiv class=\"metric\">\u003cspan>한 바퀴 선속 Φ\u003c/span>\u003cstrong id=\"flux\">\u003c/strong>\u003cspan>Wb\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>유도 기전력 ℰ\u003c/span>\u003cstrong id=\"emf\">\u003c/strong>\u003cspan>V\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>유도 전류 I\u003c/span>\u003cstrong id=\"current\">\u003c/strong>\u003cspan>A\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"buttons\">\u003cbutton id=\"play\" class=\"primary\">시작\u003c/button>\u003cbutton id=\"restart\">다시 재생\u003c/button>\u003cbutton id=\"reset\">전체 초기화\u003c/button>\u003clabel>재생 속도 \u003cselect id=\"speed\">\u003coption value=\"0.5\">0.5×\u003c/option>\u003coption value=\"1\" selected>1×\u003c/option>\u003coption value=\"2\">2×\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel for=\"scrub\">실험 시각 \u003cstrong id=\"clock\">0.00 s\u003c/strong>\u003c/label>\u003cinput id=\"scrub\" type=\"range\" min=\"0\" max=\"10\" step=\"0.01\" value=\"0\">\u003cp class=\"muted\" id=\"runstate\">시간 정지 · 시작하면 설정한 변화가 진행됩니다.\u003c/p>\u003csmall>일시정지는 화면 재생을 멈추며, 해당 실험 시각의 순간값을 유지합니다. 시각을 끌면 해당 순간을 관찰합니다.\u003c/small>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>변화 조건\u003c/h2>\u003clabel for=\"mode\">한 번에 바꿀 변수\u003c/label>\u003cselect id=\"mode\">\u003coption value=\"B\">자기장 B를 일정한 비율로 변화\u003c/option>\u003coption value=\"A\">코일 면적 A를 일정한 비율로 변화\u003c/option>\u003coption value=\"rot\">코일을 일정한 각속도로 회전\u003c/option>\u003c/select>\u003cp class=\"muted\">조건 변경 시 시각은 0 s로 돌아가고 재생이 멈춥니다. 저장한 A·B 조건은 유지됩니다.\u003c/p>\u003cdiv id=\"controls\" class=\"controls\">\u003c/div>\u003cdiv class=\"buttons\">\u003cbutton class=\"preset\" id=\"constant\">선속 일정\u003c/button>\u003cbutton class=\"preset\" id=\"reverse\">변화 방향 반전\u003c/button>\u003cbutton class=\"preset\" id=\"doubleN\">감은 수 2배\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"panel wide\">\u003ch2>공식과 현재 값\u003c/h2>\u003cdiv class=\"equation\" id=\"calc\">\u003c/div>\u003cp id=\"values\" class=\"muted\">\u003c/p>\u003cdetails>\u003csummary>기호·부호·렌츠 법칙\u003c/summary>\u003cp>Φ는 한 바퀴를 통과하는 자기 선속(Wb), N은 감은 수, θ는 자기장과 코일의 양의 법선 n 사이 각도, ℰ는 코일 전체 유도 기전력(V)입니다. Φ 전체 합은 NΦ입니다.\u003c/p>\u003cp>양의 전류는 \u003cb>+n 쪽에서 코일을 바라볼 때 반시계 방향\u003c/b>입니다. 양의 전류는 +n 방향 자기장을 만듭니다. ℰ의 음수 부호는 유도 자기장이 외부 선속의 \u003cb>변화\u003c/b>를 방해함을 뜻합니다. 외부 자기장 자체를 항상 반대로 만드는 것은 아닙니다.\u003c/p>\u003cp>저항 R인 닫힌 회로에서 I = ℰ/R로 계산합니다. 회전 모드에서는 코일과 함께 움직이는 +n을 기준으로 부호를 정의합니다.\u003c/p>\u003c/details>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>시간 그래프 · 한 바퀴 선속\u003c/h2>\u003ccanvas id=\"phiGraph\" class=\"graph\" aria-label=\"시간에 따른 자기 선속 그래프\">\u003c/canvas>\u003cp class=\"muted\">실선: 설정한 전체 실험 과정 · 점: 현재 시각\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>시간 그래프 · 유도 기전력\u003c/h2>\u003ccanvas id=\"emfGraph\" class=\"graph\" aria-label=\"시간에 따른 유도 기전력 그래프\">\u003c/canvas>\u003cp class=\"muted\">종료 시 변화가 멈춰 기전력이 0 V가 됩니다. 선속 곡선의 기울기와 비교하세요.\u003c/p>\u003c/section>\n\u003csection class=\"panel wide\">\u003ch2>조건 A·B 비교\u003c/h2>\u003cdiv class=\"buttons\">\u003cbutton id=\"saveA\">현재 상태 → A 저장\u003c/button>\u003cbutton id=\"saveB\">현재 상태 → B 저장\u003c/button>\u003cbutton id=\"clear\">비교 지우기\u003c/button>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>조건\u003c/th>\u003cth>실험 설정\u003c/th>\u003cth>시각 (s)\u003c/th>\u003cth>Φ (Wb)\u003c/th>\u003cth>ℰ (V)\u003c/th>\u003cth>I (A)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"compare\">\u003ctr>\u003ctd colspan=\"6\">같은 시각에서 조건을 저장하면 변수의 영향을 비교하기 쉽습니다.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">값은 저장한 순간의 스냅샷입니다. 각 조건의 변화 범위·기간·N·R을 함께 표시합니다.\u003c/p>\u003c/section>\n\u003csection class=\"panel wide\">\u003ch2>예측하고 설명하기\u003c/h2>\u003cdetails>\u003csummary>기본 · 자기장이 세면 전류가 항상 흐를까요?\u003c/summary>\u003cp>‘선속 일정’을 누른 뒤 재생하세요. B = 0.5 T, A = 0.1 m², θ = 0°일 때 선속과 기전력을 예측하세요.\u003c/p>\u003cdetails>\u003csummary>해설 보기\u003c/summary>\u003cp>Φ = 0.05 Wb이지만 dΦ/dt = 0이므로 ℰ = 0 V, I = 0 A입니다. 자기장의 존재와 선속의 변화는 다릅니다.\u003c/p>\u003c/details>\u003c/details>\u003cdetails>\u003csummary>응용 · 감은 수와 변화 시간을 바꾸면?\u003c/summary>\u003cp>B를 0 T에서 1 T까지 10 s 동안 바꾸세요. N = 100, A = 0.1 m², θ = 0°에서 A를 저장하고 N을 두 배로 바꿔 같은 시각에 B를 저장하세요. 이어 기간을 5 s로 줄이면 어떻게 될까요?\u003c/p>\u003cdetails>\u003csummary>해설 보기\u003c/summary>\u003cp>처음 ℰ = −1 V입니다. N을 두 배로 하면 −2 V입니다. 같은 선속 변화를 절반의 시간에 만들면 |dΦ/dt|가 두 배가 되므로 기전력 크기도 두 배입니다. R이 같으면 전류 크기도 두 배입니다.\u003c/p>\u003c/details>\u003c/details>\u003cdetails>\u003csummary>도전 · 선속이 0인 순간, 기전력도 0일까요?\u003c/summary>\u003cp>회전 모드에서 B = 0.5 T, A = 0.1 m², N = 100, θ₀ = 0°, 각속도 = 90°/s로 설정하세요. 1 s와 2 s에서 선속과 기전력을 비교하고 전류 방향을 설명하세요.\u003c/p>\u003cdetails>\u003csummary>해설 보기\u003c/summary>\u003cp>회전 중 ℰ = NBAω sinθ입니다(ω 단위는 rad/s). 1 s에는 θ = 90°, Φ = 0이지만 ℰ ≈ +7.854 V로 최대입니다. 2 s에는 θ = 180°, Φ = −0.05 Wb이지만 순간 기울기는 0이므로 ℰ = 0입니다. 선속의 값과 변화율은 다릅니다.\u003c/p>\u003c/details>\u003c/details>\u003cdetails>\u003csummary>오개념 확인 · 유도 자기장은 늘 외부 자기장에 반대?\u003c/summary>\u003cp>B가 양수인 상태에서 감소하도록 설정하면 ℰ가 양수가 됩니다. 유도 자기장은 +n 방향으로 생겨 줄어드는 양의 선속을 보충합니다. 증가하는 경우에는 반대로 작용합니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>적용 조건과 모형의 한계\u003c/summary>\u003cp>균일한 외부 자기장, 평면 코일, 모든 감은 고리의 동일한 선속을 가정합니다. 회전 각속도와 면적·자기장의 변화율은 실험 구간에서 일정합니다. 선속은 Φ = ∫B·dA의 균일장 특수형입니다.\u003c/p>\u003cp>코일의 자체 유도, 상호 유도, 전기용량, 접촉 저항과 복잡한 기계 운동은 무시합니다. 총 저항 R만 고려한 준정적 모형이며 급격한 시작·종료의 실제 과도 전류를 재현하지 않습니다. 외부 장치가 변화 조건을 유지하고 유도 전류에 따른 반작용을 감당한다고 가정합니다.\u003c/p>\u003cp>회전 코일의 정면 그림은 언제나 +n 쪽에서 본 개념도입니다. 원의 크기·전류 화살표는 실제 크기·속도가 아니며, 자기장 기호는 B cosθ의 부호를 표시합니다. 면적 변화의 실제 도선 운동과 발전기의 상세 구조는 생략합니다. 저항에서 소비되는 에너지는 외부 변화 장치의 일에서 공급됩니다.\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003cfooter>\u003cp class=\"muted\">물리 공식 40 · 단일 파일 / 외부 연결 없이 실행 · 고등학교 탐구용\u003c/p>\u003c/footer>\u003c/main>\n\u003cscript>\n'use strict';const $=id=>document.getElementById(id);const defaults={mode:'B',B0:0,B1:1,A0:.1,A1:.2,theta:0,omega:90,N:100,R:10,T:10};let p={...defaults},t=0,playing=false,last=null,saved={};\nconst fields={B0:['자기장 시작 B₀ (T)',-1,1,.01],B1:['자기장 끝 B₁ (T)',-1,1,.01],A0:['코일 면적 시작 A₀ (m²)',.01,.5,.01],A1:['코일 면적 끝 A₁ (m²)',.01,.5,.01],theta:['시작 각도 θ₀ (°)',-180,180,1],omega:['각속도 (°/s)',-180,180,1],N:['감은 수 N (회)',1,500,1],R:['회로 총저항 R (Ω)',1,100,1],T:['변화 기간 (s)',2,20,.5]};\nfunction model(c,time){const u=Math.max(0,Math.min(time,c.T));const active=time>=0&&time\u003cc.T;let B=c.B0,A=c.A0,theta=c.theta*Math.PI/180,dB=0,dA=0,w=0;if(c.mode==='B'){B=c.B0+(c.B1-c.B0)*u/c.T;dB=active?(c.B1-c.B0)/c.T:0}if(c.mode==='A'){A=c.A0+(c.A1-c.A0)*u/c.T;dA=active?(c.A1-c.A0)/c.T:0}if(c.mode==='rot'){theta+=c.omega*Math.PI/180*u;w=active?c.omega*Math.PI/180:0}const phi=B*A*Math.cos(theta),rate=dB*A*Math.cos(theta)+B*dA*Math.cos(theta)-B*A*Math.sin(theta)*w;const emf=-c.N*rate;return{B,A,theta,dB,dA,w,phi,rate,emf,I:emf/c.R}}\nconst fmt=(v,d=4)=>Math.abs(v)\u003c1e-10?'0':Number(v.toFixed(d)).toString();\nfunction buildControls(){const list=['B0',...(p.mode==='B'?['B1']:[]),'A0',...(p.mode==='A'?['A1']:[]),'theta',...(p.mode==='rot'?['omega']:[]),'N','R','T'];$('controls').innerHTML=list.map(k=>{const [label,min,max,step]=fields[k];return `\u003cdiv class=\"control\">\u003clabel for=\"${k}n\">${label}\u003c/label>\u003cdiv class=\"pair\">\u003cinput aria-label=\"${label} 슬라이더 조절\" id=\"${k}r\" type=\"range\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${p[k]}\">\u003cinput id=\"${k}n\" type=\"number\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${p[k]}\">\u003c/div>\u003c/div>`}).join('');for(const k of list){for(const suffix of ['r','n'])$(k+suffix).addEventListener('input',e=>{let v=e.target.valueAsNumber;if(!Number.isFinite(v))return;const [,min,max,step]=fields[k];v=Math.max(min,Math.min(max,v));if(k==='N')v=Math.round(v);p[k]=v;$(k+(suffix==='r'?'n':'r')).value=v;stopChange();});$(k+'n').addEventListener('change',()=>{$(k+'n').value=p[k]})}}\nfunction stopChange(){playing=false;t=0;last=null;$('scrub').max=p.T;render()}\nfunction surface(id){const el=$(id),width=el.clientWidth,height=el.clientHeight,dpr=window.devicePixelRatio||1;if(el.width!==Math.round(width*dpr)||el.height!==Math.round(height*dpr)){el.width=Math.round(width*dpr);el.height=Math.round(height*dpr)}const ctx=el.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);ctx.font='13px system-ui';ctx.lineWidth=2;return{ctx,width,height}}\nfunction arrow(c,x,y,X,Y,color){c.strokeStyle=c.fillStyle=color;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();const a=Math.atan2(Y-y,X-x);c.beginPath();c.moveTo(X,Y);c.lineTo(X-10*Math.cos(a-.45),Y-10*Math.sin(a-.45));c.lineTo(X-10*Math.cos(a+.45),Y-10*Math.sin(a+.45));c.closePath();c.fill()}\nfunction scene(s){const{ctx:c,width:W,height:H}=surface('scene'),x=W/2,y=107,r=Math.min(W*.27,74);c.textAlign='center';c.fillStyle='#b0c1d9';c.fillText('정면 · +n 쪽에서 바라본 코일',x,20);c.strokeStyle='#ffbe76';c.lineWidth=5;c.beginPath();c.arc(x,y,r,0,2*Math.PI);c.stroke();const normal=s.B*Math.cos(s.theta);c.font='21px system-ui';c.fillStyle='#6dcfff';for(const [dx,dy]of[[-.4,-.35],[.4,-.35],[-.4,.35],[.4,.35]])c.fillText(Math.abs(normal)\u003c1e-9?'·':normal>0?'⊙':'⊗',x+dx*r,y+dy*r);c.font='13px system-ui';c.fillStyle='#b0c1d9';c.fillText(Math.abs(normal)\u003c1e-9?'수직 성분 0':normal>0?'⊙ 외부 장의 수직 성분: 나옴':'⊗ 외부 장의 수직 성분: 들어감',x,202);if(Math.abs(s.I)>1e-8){const sign=s.I>0?-1:1;c.strokeStyle='#83ead2';c.lineWidth=3;c.beginPath();c.arc(x,y,r+13,-.5,-.5+sign*1.8,sign\u003c0);c.stroke();const a=-.5+sign*1.8;arrow(c,x+(r+13)*Math.cos(a-sign*.14),y+(r+13)*Math.sin(a-sign*.14),x+(r+13)*Math.cos(a),y+(r+13)*Math.sin(a),'#83ead2')}\nconst ox=W*.24,oy=H-33,len=Math.min(28,W*.1);arrow(c,ox,oy,ox+len,oy,'#6dcfff');arrow(c,ox,oy,ox+len*Math.cos(s.theta),oy-len*Math.sin(s.theta),'#ffbe76');c.fillStyle='#6dcfff';c.textAlign='left';c.fillText('+B 축',ox+len+5,oy+5);c.fillStyle='#ffbe76';c.textAlign='right';c.fillText('n',ox-9,oy);c.textAlign='center';c.fillStyle='#edf3ff';c.fillText(`측면: θ = ${fmt(s.theta*180/Math.PI,1)}°`,W*.62,H-4)}\nfunction graph(id,key,title){const{ctx:c,width:W,height:H}=surface(id),l=62,r=15,top=29,bottom=43,ww=W-l-r,hh=H-top-bottom;const pts=Array.from({length:300},(_,i)=>({t:p.T*i/300,v:model(p,p.T*i/300)[key]}));pts.push({t:p.T,v:model(p,p.T-1e-8)[key]},{t:p.T,v:model(p,p.T)[key]});let m=key==='phi'?.5:800;const X=v=>l+v/p.T*ww,Y=v=>top+hh/2-v/m*hh/2;c.lineWidth=1;c.strokeStyle='#49617e';c.strokeRect(l,top,ww,hh);c.fillStyle='#b0c1d9';c.font='12px system-ui';for(let i=0;i\u003c3;i++){const v=-m+i*m;c.textAlign='right';c.fillText(fmt(v,2),l-6,Y(v)+4);c.beginPath();c.moveTo(l,Y(v));c.lineTo(W-r,Y(v));c.stroke()}for(let i=0;i\u003c4;i++){const v=p.T*i/3;c.textAlign=i===0?'left':i===3?'right':'center';c.fillText(fmt(v,1),X(v),H-24)}c.textAlign='left';c.fillText(title,4,15);c.textAlign='center';c.fillText('시간 t (s)',l+ww/2,H-5);c.strokeStyle=key==='phi'?'#6dcfff':'#ffbe76';c.lineWidth=2.5;c.beginPath();pts.forEach((a,i)=>{const px=X(a.t),py=Y(a.v);if(i===0)c.moveTo(px,py);else c.lineTo(px,py)});c.stroke();const now=model(p,t)[key];c.strokeStyle='#83ead2';c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();c.moveTo(X(t),top);c.lineTo(X(t),top+hh);c.stroke();c.setLineDash([]);c.fillStyle='#83ead2';c.beginPath();c.arc(X(t),Y(now),5,0,Math.PI*2);c.fill()}\nfunction render(){const s=model(p,t);$('flux').textContent=fmt(s.phi);$('emf').textContent=fmt(s.emf);$('current').textContent=fmt(s.I);$('clock').textContent=t.toFixed(2)+' s';$('scrub').value=t;$('play').textContent=playing?'일시정지':t>=p.T?'처음부터 시작':'시작 / 이어 재생';$('runstate').textContent=t>=p.T?'변화 종료 · 조건이 고정되어 ℰ = 0 V':playing?'재생 중 · 실제 경과 시간에 따른 변화':'시간 정지 · 이 시각의 순간값을 표시';$('direction').textContent=Math.abs(s.I)\u003c1e-9?'유도 전류 없음 · 순간 선속 변화율 0':s.I>0?'I > 0 · 반시계 방향 · 유도 자기장 +n':'I \u003c 0 · 시계 방향 · 유도 자기장 −n';$('calc').innerHTML=`Φ = BA cosθ = ${fmt(s.B)} × ${fmt(s.A)} × cos(${fmt(s.theta*180/Math.PI,2)}°) = \u003cb>${fmt(s.phi)} Wb\u003c/b>\u003cbr>ℰ = −N dΦ/dt = −${p.N} × (${fmt(s.rate,6)}) = \u003cb>${fmt(s.emf)} V\u003c/b>\u003cbr>I = ℰ/R = ${fmt(s.emf)} / ${p.R} = \u003cb>${fmt(s.I)} A\u003c/b>`;$('values').textContent=`변화율: dB/dt = ${fmt(s.dB)} T/s · dA/dt = ${fmt(s.dA)} m²/s · dθ/dt = ${fmt(s.w)} rad/s · 일반식: dΦ/dt = A cosθ·dB/dt + B cosθ·dA/dt − BA sinθ·dθ/dt`;scene(s);graph('phiGraph','phi','선속 Φ (Wb)');graph('emfGraph','emf','기전력 ℰ (V)')}\nfunction settings(c){return `${c.mode==='B'?`B ${c.B0}→${c.B1} T; A ${c.A0} m²`:c.mode==='A'?`A ${c.A0}→${c.A1} m²; B ${c.B0} T`:`회전 ${c.omega} °/s; B ${c.B0} T; A ${c.A0} m²`}; θ₀ ${c.theta}°; N ${c.N}; R ${c.R} Ω; 기간 ${c.T} s`}\nfunction comparison(){const keys=Object.keys(saved);$('compare').innerHTML=keys.length?keys.map(k=>{const v=saved[k];return `\u003ctr>\u003cth>${k}\u003c/th>\u003ctd>${settings(v.p)}\u003c/td>\u003ctd>${fmt(v.t,2)}\u003c/td>\u003ctd>${fmt(v.s.phi)}\u003c/td>\u003ctd>${fmt(v.s.emf)}\u003c/td>\u003ctd>${fmt(v.s.I)}\u003c/td>\u003c/tr>`}).join(''):'\u003ctr>\u003ctd colspan=\"6\">같은 시각에서 조건을 저장하면 변수의 영향을 비교하기 쉽습니다.\u003c/td>\u003c/tr>'}\n$('mode').onchange=()=>{p.mode=$('mode').value;buildControls();stopChange()};$('play').onclick=()=>{if(t>=p.T)t=0;playing=!playing;last=null;render()};$('restart').onclick=()=>{t=0;playing=true;last=null;render()};$('reset').onclick=()=>{p={...defaults};saved={};$('mode').value=p.mode;$('speed').value='1';buildControls();comparison();stopChange()};$('scrub').oninput=()=>{playing=false;last=null;t=Number($('scrub').value);render()};$('constant').onclick=()=>{p={...p,mode:'B',B0:.5,B1:.5,A0:.1,theta:0};$('mode').value=p.mode;buildControls();stopChange()};$('reverse').onclick=()=>{if(p.mode==='B')[p.B0,p.B1]=[p.B1,p.B0];else if(p.mode==='A')[p.A0,p.A1]=[p.A1,p.A0];else p.omega=-p.omega;buildControls();stopChange()};$('doubleN').onclick=()=>{p.N=Math.min(500,p.N*2);buildControls();stopChange()};for(const k of ['A','B'])$('save'+k).onclick=()=>{saved[k]={p:{...p},t,s:model(p,t)};comparison()};$('clear').onclick=()=>{saved={};comparison()};\ndocument.addEventListener('visibilitychange',()=>{last=null;if(document.hidden){playing=false;render()}});window.addEventListener('resize',render);function frame(now){if(playing){if(last!==null)t=Math.min(p.T,t+(now-last)/1000*Number($('speed').value));if(t>=p.T)playing=false;render()}last=now;requestAnimationFrame(frame)}buildControls();render();requestAnimationFrame(frame);window.lab={model,get state(){return{p:{...p},t,playing,saved}}};\n\u003c/script>\u003cstyle>\n/* Independent fixed teaching tabs; original experiment logic is unchanged. */\nhtml,body{background:#080d15!important;color-scheme:dark}\nbody.wlab-ready{margin:0;overflow-x:hidden}\n.wlab-root{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:8px 14px 12px!important;min-width:0!important;box-sizing:border-box}\nbody.wlab-ready .wrap{max-width:none!important;padding:8px 14px!important}\nbody.wlab-ready header{padding:8px 14px!important;margin:0 0 6px!important;min-height:0!important;background:#0e1725!important}\nbody.wlab-ready header h1{font-size:clamp(19px,2.2vw,28px)!important;line-height:1.2;margin:3px 0!important}\nbody.wlab-ready header p,body.wlab-ready header .tag,body.wlab-ready header .eyebrow,body.wlab-ready header .hint{font-size:12px!important;mar
