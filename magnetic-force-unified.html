<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자기력 통합실험실 | WiseWhisper</title><style>*{box-sizing:border-box}body{margin:0;background:#080d15;color:#e4edf8;font:15px system-ui}header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid #33465b;background:#101c2c}h1{margin:0;font-size:clamp(19px,2vw,26px)}header small{color:#9eb3c7}nav{display:flex;flex-wrap:wrap;gap:5px;padding:7px 12px}button{background:#1a2a3e;color:#e6f1ff;border:1px solid #40566e;border-radius:7px;padding:8px 12px;font:inherit}button[aria-selected=true]{background:#176458;border-color:#5de4ca}iframe{display:block;border:0;width:100%;height:calc(100dvh - 111px);min-height:440px;background:#080d15}footer{font-size:11px;color:#91a6ba;text-align:center;padding:3px}@media(max-width:760px){header{display:block;padding:8px}nav{padding:5px}button{padding:7px 9px;font-size:13px}iframe{height:calc(100dvh - 146px);min-height:440px}}</style></head><body><header><h1>자기력 통합실험실</h1><small>자기력 · 입자 운동 · 평행 전류</small></header><nav id="tabs" role="tablist"></nav><iframe id="lab" title="선택된 자기력 실험"></iframe><footer>© WiseWhisper · 온라인 과학실험실</footer><script>const pages=["\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>36｜전하의 자기력 실험실\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#0b1222;--panel:#141f34;--line:#304361;--text:#ecf3ff;--muted:#b3c3dd;--mint:#5ee5ba;--yellow:#ffd278;--pink:#ff8eb0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans KR',sans-serif;line-height:1.65}main{max-width:1180px;margin:auto;padding:22px}header{margin-bottom:20px}h1{font-size:clamp(25px,4vw,38px);margin:6px 0}h2{font-size:20px;margin:0 0 12px}.tag{color:var(--mint);font-weight:700}.formula{font-size:25px;font-weight:700;color:var(--yellow)}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.wide{grid-column:1/-1}p{margin:8px 0}.note,small{color:var(--muted);font-size:14px}canvas{width:100%;display:block;background:#0a1527;border-radius:12px}label{display:block;font-weight:600;margin:10px 0 3px}.ctrl{display:grid;grid-template-columns:1fr 95px;gap:12px;align-items:center}input[type=range]{width:100%;min-height:40px;accent-color:var(--mint)}input[type=number],select{width:100%;background:#0a1527;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;min-height:44px}button{background:#233952;color:var(--text);border:1px solid #496080;border-radius:10px;padding:10px 14px;min-height:44px;font-size:15px;cursor:pointer}button.primary{background:#176554;border-color:var(--mint)}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:10px;border-radius:10px;background:#0a1527}.stat strong{display:block;font-size:21px;color:var(--mint)}.calc{overflow-wrap:anywhere;background:#0a1527;border-radius:10px;padding:14px;margin-top:12px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600;min-height:36px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}.scroll{overflow:auto}textarea{width:100%;min-height:65px;border-radius:8px;background:#0a1527;color:white;padding:10px;border:1px solid var(--line)}@media(max-width:760px){main{padding:12px}.grid{display:block}.card{padding:14px}.stats{gap:7px}.stat strong{font-size:18px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cheader>\u003cspan class=\"tag\">물리 공식 40 · 인터랙티브 실험실 36\u003c/span>\u003ch1>전하의 자기력\u003c/h1>\u003cdiv class=\"formula\">F = |q|vB sinθ　 ·　 F⃗ = q(v⃗ × B⃗)\u003c/div>\u003cp>전하의 부호와 속도·자기장·각도를 바꾸면 힘과 궤적은 어떻게 달라질까요?\u003c/p>\u003c/header>\u003cdiv class=\"grid\">\u003csection class=\"card\">\u003ch2>① 예측 → 조작 → 관찰\u003c/h2>\u003cp class=\"note\">자기장은 z축 방향. 위에서 본 궤적과 옆에서 본 궤적은 같은 입자입니다.\u003c/p>\u003ccanvas id=\"scene\" width=\"720\" height=\"600\" aria-label=\"xy 평면과 xz 평면에 투영한 입자의 궤적\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton class=\"primary\" id=\"play\">시작\u003c/button>\u003cbutton id=\"pause\">일시정지\u003c/button>\u003cbutton id=\"restart\">다시 시작\u003c/button>\u003cbutton id=\"reset\">전체 초기화\u003c/button>\u003c/div>\u003clabel for=\"rate\">재생 속도\u003c/label>\u003cselect id=\"rate\">\u003coption value=\"0.5\">0.5배\u003c/option>\u003coption value=\"1\" selected>1배\u003c/option>\u003coption value=\"2\">2배\u003c/option>\u003c/select>\u003cp id=\"clock\" class=\"note\">\u003c/p>\u003cp class=\"note\">화살표: \u003cspan style=\"color:var(--mint)\">v 속도\u003c/span> · \u003cspan style=\"color:var(--pink)\">F 자기력\u003c/span>. 각각 방향을 보여주도록 길이를 정규화했습니다. z방향 성분은 옆면에서 확인합니다.\u003c/p>\u003c/section>\u003csection class=\"card\">\u003ch2>② 조건과 실시간 계산\u003c/h2>\u003cdiv id=\"controls\">\u003c/div>\u003clabel for=\"dir\">자기장 방향\u003c/label>\u003cselect id=\"dir\">\u003coption value=\"1\">+z (위쪽 · 화면 밖 ⊙)\u003c/option>\u003coption value=\"-1\">−z (아래쪽 · 화면 안 ⊗)\u003c/option>\u003c/select>\u003cp class=\"note\">조건을 바꾸면 t = 0으로 돌아가고 재생이 멈춥니다. θ는 초기 속도와 실제 자기장 방향 사이의 각입니다.\u003c/p>\u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\u003cdiv class=\"calc\" id=\"calc\">\u003c/div>\u003cp id=\"direction\">\u003c/p>\u003cdetails>\u003csummary>기호와 단위\u003c/summary>\u003cp>q: 전하(C), v: 속력(m/s), B: 자기장 크기(T), θ: 속도와 자기장 사이 각, m: 질량(kg). 1 nC = 10⁻⁹ C. 질량 입력 1은 10⁻¹⁵ kg, 속력 입력 1은 10⁴ m/s입니다.\u003c/p>\u003c/details>\u003c/section>\u003csection class=\"card\">\u003ch2>③ 각도와 힘의 관계\u003c/h2>\u003ccanvas id=\"graph\" width=\"720\" height=\"360\" aria-label=\"각도 세타와 자기력 크기의 관계 그래프\">\u003c/canvas>\u003cp class=\"note\">관계 그래프: θ만 0°~180°로 변화. 현재 q, v, B는 고정. 노란 점은 현재 조건입니다.\u003c/p>\u003cdiv class=\"buttons\">\u003cbutton id=\"saveA\">조건 A 저장\u003c/button>\u003cbutton id=\"saveB\">조건 B 저장\u003c/button>\u003cbutton id=\"clear\">비교 지우기\u003c/button>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>조건 A\u003c/th>\u003cth>조건 B\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"compare\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2>④ 설명하며 탐구하기\u003c/h2>\u003clabel for=\"predict\">예측 기록\u003c/label>\u003ctextarea id=\"predict\" placeholder=\"예: 음전하로 바꾸면 힘의 크기는 같고 회전 방향은 반대일 것이다.\">\u003c/textarea>\u003cdetails>\u003csummary>기본｜각도를 0°, 90°, 180°로 바꾸면?\u003c/summary>\u003cp>sin0° = sin180° = 0이므로 자기력이 0입니다. 90°에서는 최대 F = |q|vB. 180°는 반평행이며 여전히 힘이 없습니다. q, v 또는 B가 0인 경우에도 힘은 0입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>응용｜전하 부호와 자기장 방향을 각각 뒤집으면?\u003c/summary>\u003cp>각각을 뒤집으면 자기력 방향과 회전 방향이 반대가 됩니다. 둘 다 뒤집으면 초기 xy 속도가 동일한 이 실험에서 xy 궤적은 다시 같습니다. θ는 실제 자기장과 이루는 각으로 정의하므로 B방향 변경 시 z방향 초기 속도도 바뀝니다. 완전히 같은 3차원 초기 속도를 유지하려면 θ도 180°−θ로 바꿔 비교하세요.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>도전｜힘이 있는데 속력이 변하지 않는 이유는?\u003c/summary>\u003cp>자기력은 매 순간 속도에 수직입니다. 순간 일률 F⃗·v⃗ = 0이므로 운동 에너지가 일정합니다. 0°&lt;θ&lt;180°에서 평행 성분 v∥는 일정하고 수직 성분은 회전하여 나선 운동을 만듭니다. θ = 90°이면 원운동입니다. r = mv sinθ/(|q|B), T = 2πm/(|q|B). v∥ = v cosθ는 실제 자기장 방향을 기준으로 한 부호 있는 성분입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>오개념｜자기력이 속력을 높인다?\u003c/summary>\u003cp>재생 중 운동 에너지와 속력을 확인하세요. 힘은 진행 방향을 바꾸지만 자기력만으로 속력은 바꾸지 않습니다. 또 전하가 정지해 있으면 자기장 안에서도 자기력은 0입니다.\u003c/p>\u003c/details>\u003cdetails open>\u003csummary>적용 조건과 모형의 한계\u003c/summary>\u003cp>균일하고 시간에 따라 변하지 않는 자기장, 전기장·중력·충돌 없음, 고전적 비상대론적 입자 모형입니다. 복사와 양자 효과는 무시합니다. 이 실험은 비교가 쉬운 가상 전하·질량을 사용하며 특정 실제 입자를 뜻하지 않습니다.\u003c/p>\u003cp>궤적은 운동방정식의 해석해로 계산합니다. 각 조건에 맞춰 두 투영의 공간 축척을 조절하므로 서로 다른 조건의 화면상 원 크기를 직접 비교하지 말고 r 수치를 확인하세요. 양쪽 화면은 같은 공간 축척이며 실제 시간은 μs 단위로 느리게 재생합니다. 조건 A·B는 같은 SI 기준의 수치 비교입니다.\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003c/main>\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id), defs=[['q','전하 q (nC)',-5,5,.1,1],['v','속력 v (×10⁴ m/s)',0,5,.1,1],['B','자기장 크기 B (T)',0,2,.05,.5],['theta','각도 θ (°)',0,180,1,90],['m','질량 m (×10⁻¹⁵ kg)',.1,5,.1,1]];\nlet values=Object.fromEntries(defs.map(d=>[d[0],d[5]])),time=0,running=false,last=null,saved={A:null,B:null};\nfor(const [id,label,min,max,step,val] of defs){const box=document.createElement('div');box.innerHTML=`\u003clabel for=\"${id}n\">${label}\u003c/label>\u003cdiv class=\"ctrl\">\u003cinput type=\"range\" id=\"${id}s\" aria-label=\"${label}\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${val}\">\u003cinput type=\"number\" id=\"${id}n\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${val}\">\u003c/div>`;$('controls').append(box);for(const suffix of ['s','n'])$(id+suffix).addEventListener('input',e=>{if(e.target.value===''||!Number.isFinite(e.target.valueAsNumber))return;values[id]=Math.max(min,Math.min(max,e.target.valueAsNumber));$(id+'s').value=$(id+'n').value=values[id];restart();});}\nfunction model(a=values,dir=+$('dir').value){const q=a.q*1e-9,v=a.v*1e4,B=a.B,m=a.m*1e-15,th=a.theta*Math.PI/180,vp=(a.theta===0||a.theta===180)?0:v*Math.sin(th),vz=dir*v*Math.cos(th),w=q*B*dir/m,F=Math.abs(q)*vp*B,K=.5*m*v*v,T=w?2*Math.PI/Math.abs(w):null,r=(w&&vp)?Math.abs(vp/w):null,horizon=w&&vp?2*T:20e-6;return {q,v,B,m,th,vp,vz,w,F,K,T,r,horizon,dir};}\nfunction state(p,t){let x,y,vx,vy;if(!p.w){x=p.vp*t;y=0;vx=p.vp;vy=0;}else{const u=p.w*t;x=p.vp*Math.sin(u)/p.w;y=-2*p.vp*Math.sin(u/2)**2/p.w;vx=p.vp*Math.cos(u);vy=-p.vp*Math.sin(u);}return{x,y,z:p.vz*t,vx,vy,vz:p.vz,Fx:p.q*p.B*p.dir*vy,Fy:-p.q*p.B*p.dir*vx};}\nconst fmt=x=>x===null?'—':x===0?'0':Math.abs(x)>=.01&&Math.abs(x)\u003c10000?Number(x.toPrecision(4)).toString():x.toExponential(3);\nfunction arrow(c,x,y,dx,dy,color,label){const norm=Math.hypot(dx,dy);if(norm\u003c1e-30)return;dx=dx/norm*48;dy=dy/norm*48;c.strokeStyle=color;c.fillStyle=color;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();const a=Math.atan2(dy,dx);c.beginPath();c.moveTo(x+dx,y+dy);c.lineTo(x+dx-10*Math.cos(a-.45),y+dy-10*Math.sin(a-.45));c.lineTo(x+dx-10*Math.cos(a+.45),y+dy-10*Math.sin(a+.45));c.fill();c.fillText(label,x+dx+7,y+dy);}\nfunction drawScene(p){\n const canvas=$('scene'),W=Math.max(1,Math.round(canvas.clientWidth)),H=Math.max(1,Math.round(canvas.clientHeight));if(W\u003c100||H\u003c100)return;\n const dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);}\n const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);c.fillStyle='#04080f';c.fillRect(0,0,W,H);\n const pts=Array.from({length:361},(_,i)=>state(p,p.horizon*i/360)),current=state(p,time),horizontal=W>=650,gap=8;\n const pw=horizontal?(W-gap)/2:W,ph=horizontal?H:(H-gap)/2;\n const bounds=k=>{const v=pts.map(s=>s[k]);return [Math.min(0,...v),Math.max(0,...v)]},xb=bounds('x'),yb=bounds('y'),zb=bounds('z');\n const xspan=xb[1]-xb[0],yspan=Math.max(yb[1]-yb[0],zb[1]-zb[0]),span=Math.max(xspan,yspan),reserve=Math.min(55,pw*.12,ph*.13);\n const plotW=Math.max(30,pw-2*reserve-16),plotH=Math.max(30,ph-2*reserve-46);\n const scale=span>0?Math.min(plotW/Math.max(xspan,span*.000001),plotH/Math.max(yspan,span*.000001)):Math.min(plotW,plotH)/.06;\n const target=55/scale,base=10**Math.floor(Math.log10(target)),step=([1,2,5,10].find(n=>n*base>=target)||10)*base;\n for(let i=0;i\u003c2;i++){\n  const side=i===1,b=side?zb:yb,left=horizontal?i*(pw+gap):0,top=horizontal?0:i*(ph+gap),cx=left+pw/2,cy=top+ph/2+3;\n  const ox=cx-(xb[0]+xb[1])*scale/2,oy=cy+(b[0]+b[1])*scale/2,x0=left+13,x1=left+pw-13,y0=top+36,y1=top+ph-26;\n  c.fillStyle='#08121e';c.fillRect(left+1,top+1,pw-2,ph-2);c.strokeStyle='#344458';c.lineWidth=1;c.strokeRect(left+1.5,top+1.5,pw-3,ph-3);\n  c.font='bold 15px system-ui';c.fillStyle='#e5f1ff';c.fillText(side?'옆면 · xz 평면':'윗면 · xy 평면',left+12,top+21);\n  if(!side){c.fillStyle='#ffd278';c.textAlign='right';c.fillText(p.dir===1?'B ⊙':'B ⊗',left+pw-12,top+21);c.textAlign='left';}\n  c.save();c.beginPath();c.rect(x0,y0,x1-x0,y1-y0);c.clip();\n  const delta=step*scale;\n  c.strokeStyle='#1d3043';c.lineWidth=1;c.beginPath();\n  for(let x=ox+Math.ceil((x0-ox)/delta)*delta;x\u003c=x1;x+=delta){c.moveTo(x,y0);c.lineTo(x,y1)}\n  for(let y=oy+Math.ceil((y0-oy)/delta)*delta;y\u003c=y1;y+=delta){c.moveTo(x0,y);c.lineTo(x1,y)}c.stroke();\n  c.strokeStyle='#56728d';c.lineWidth=1.3;c.beginPath();c.moveTo(x0,oy);c.lineTo(x1,oy);c.moveTo(ox,y0);c.lineTo(ox,y1);c.stroke();\n  c.font='13px system-ui';c.fillStyle='#a9c5dd';c.fillText('+x →',x1-42,Math.max(y0+15,Math.min(y1-4,oy-6)));c.fillText(side?'+z ↑':'+y ↑',Math.max(x0+3,Math.min(x1-37,ox+6)),y0+15);\n  const project=s=>[ox+s.x*scale,oy-(side?s.z:s.y)*scale];\n  const trace=(arr,color,width,dashed)=>{c.setLineDash(dashed?[6,5]:[]);c.strokeStyle=color;c.lineWidth=width;c.beginPath();arr.forEach((s,j)=>{const[x,y]=project(s);j?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.setLineDash([]);};\n  trace(pts,'#7791ac',1.7,true);trace(Array.from({length:241},(_,j)=>state(p,time*j/240)),'#5ee5ba',3,false);\n  const [x,y]=project(current);c.fillStyle='#ffdc7b';c.beginPath();c.arc(x,y,7,0,2*Math.PI);c.fill();c.font='bold 15px system-ui';\n  arrow(c,x,y,current.vx,side?-current.vz:-current.vy,'#5ee5ba','v');arrow(c,x,y,current.Fx,side?0:-current.Fy,'#ff8eb0','F');c.restore();\n  c.font='12px system-ui';c.fillStyle='#a9c5dd';c.fillText('눈금 간격 '+fmt(step)+' m'+(side&&p.F?' · Fy는 옆면에서 보이지 않음':''),left+12,top+ph-9);\n }\n}\nfunction drawGraph(p){const c=$('graph').getContext('2d');c.clearRect(0,0,720,360);const max=Math.abs(p.q)*p.v*p.B*1e6,ymax=500;c.font='15px system-ui';c.fillStyle='#b3c3dd';c.fillText('F (μN)',12,22);c.fillText('θ (°)',650,343);for(let i=0;i\u003c=4;i++){const y=290-i*60;c.stroke ocument.createElement(tag);n.className=cls;return n};\nconst nav=el('nav','wlab-nav');nav.setAttribute('aria-label','학습 화면 선택');nav.setAttribute('role','tablist');\nconst deck=el('div','wlab-deck'),sim=el('div','wlab-pane wlab-sim'),graph=el('div','wlab-pane wlab-graph'),learn=el('div','wlab-pane wlab-concept');\nconst tabs=[['실험하기',sim],...(graphs.length?[['그래프·비교',graph]]:[]),['개념 설명',learn]];\nconst wrap=(n)=>{if(n.matches('canvas,svg,details')){const card=el('section','wlab-card');card.append(n);return card}return n};\nroot.classList.add('wlab-root');document.body.classList.add('wlab-ready');\nroot.append(nav,deck);\nscene.classList.add('wlab-scene');if(c.wide)scene.classList.add('wlab-wide');\nsim.append(scene);\nif(control){control.classList.add('wlab-control');sim.append(control);}\nlet read=result;\nif(extracted.length){read=read||el('section','wlab-card');if(!result){const h=el('h2','');h.textContent='실시간 결과';read.append(h)}extracted.forEach(n=>read.append(n));}\nif(read){read.classList.add('wlab-result');sim.append(read)}\nif(extra.length){scene.classList.add('wlab-composite');for(const n of extra){n.classList.add('wlab-extra');scene.append(n)}}\nfor(const n of graphs)graph.append(wrap(n));\nfor(const n of concepts)learn.append(wrap(n));\nfor(const n of old){if(!n.contains(scene)&&!n.contains(control)&&!n.contains(read))n.classList.add('wlab-original')}\nfor(const f of [...root.querySelectorAll(':scope>footer'),...document.querySelectorAll('body>footer')])learn.append(f);\nconst buttons=[];\nfunction show(i){tabs.forEach((t,j)=>{const on=i===j;t[1].classList.toggle('wlab-active',on);t[1].inert=!on;t[1].setAttribute('aria-hidden',String(!on));buttons[j].setAttribute('aria-selected',String(on));buttons[j].tabIndex=on?0:-1;});requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')));}\ntabs.forEach((t,i)=>{const b=el('button','');b.type='button';b.id='wlab-tab-'+i;b.textContent=t[0];b.setAttribute('role','tab');b.setAttribute('aria-controls','wlab-panel-'+i);t[1].id='wlab-panel-'+i;t[1].setAttribute('role','tabpanel');t[1].setAttribute('aria-labelledby',b.id);b.addEventListener('click',()=>show(i));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;show(j);buttons[j].focus()});buttons.push(b);nav.append(b);deck.append(t[1]);});\nconst back=el('a','');back.href='index.html';back.textContent='← 실험 목록';nav.append(back);\nshow(0);\n})({\"root\":\"main\",\"scene\":\".grid>section:nth-child(1)\",\"control\":\".grid>section:nth-child(2)\",\"extract\":[\"#stats\",\"#calc\",\"#direction\"],\"graph\":[\".grid>section:nth-child(3)\"],\"concept\":[\".grid>section:nth-child(4)\"],\"old\":[\".grid\"]});\u003c/script>\u003cstyle>\n/* Lab 36: use the actual available canvas area, not a scaled portrait bitmap. */\nbody.wlab-ready header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 12px!important;margin:0!important}\nbody.wlab-ready header .tag{display:none}\nbody.wlab-ready header h1{font-size:24px!important;margin:0!important}\nbody.wlab-ready header .formula{margin-left:auto;font-size:17px!important}\nbody.wlab-ready header p{width:100%;margin:0!important}\n.wlab-nav{padding:5px 0!important}\n.wlab-sim{grid-template-columns:minmax(0,1fr) minmax(285px,315px)!important;gap:9px!important;align-items:start}\n.wlab-scene{display:flex;flex-direction:column;gap:5px;padding:9px!important}\n.wlab-scene>h2{margin:0!important;font-size:15px!important}\n.wlab-scene>p.note{margin:0!important;font-size:12px!important}\n.wlab-scene>p.note:last-child{color:#b3c3dd}\n.wlab-scene #scene{height:clamp(350px,calc(100dvh - 210px),850px)!important;object-fit:fill!important;background:#04080f!important}\n.wlab-side36{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:7px;min-width:0;max-height:calc(100dvh - 111px);overflow:auto;scrollbar-width:thin}\n.wlab-side36 .wlab-control,.wlab-side36 .wlab-result{max-height:none!important;overflow:visible!important;padding:9px!important}\n.wlab-side36 .wlab-control>h2,.wlab-side36 .wlab-result>h2{font-size:15px!important;margin-bottom:3px!important}\n.wlab-side36 .wlab-control label{margin:4px 0 0!important;line-height:1.25!important}\n.wlab-side36 .ctrl{grid-template-columns:minmax(0,1fr) 66px!important;gap:7px!important}\n.wlab-side36 .ctrl input[type=range]{height:24px!important;min-height:24px!important;margin:0}\n.wlab-side36 .ctrl input[type=number]{min-height:28px!important;padding:2px 5px!important}\n.wlab-side36 .wlab-control select{min-height:32px!important}\n.wlab-side36 .wlab-control>p.note{font-size:11px!important;margin:4px 0!important}\n.wlab-side36 .wlab-control details{padding:2px 0!important}\n.wlab-side36 .wlab-control summary,.wlab-side36 .wlab-result summary{min-height:0;font-size:12px;line-height:1.4;cursor:pointer}\n.wlab-side36 .wlab-result #stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important}\n.wlab-side36 .wlab-result .stat{padding:5px!important;font-size:11px!important}\n.wlab-side36 .wlab-result .stat strong{font-size:15px!important}\n.wlab-side36 .wlab-result #direction{font-size:12px!important}\n.wlab-side36 .wlab-result details{padding:4px 0!important}\n.wlab-transport36{display:flex;align-items:center;gap:7px;flex-wrap:wrap}\n.wlab-transport36 .buttons{margin:0!important}\n.wlab-transport36 label{margin:0!important;font-size:12px;white-space:nowrap}\n.wlab-transport36 select{width:auto!important;min-height:34px!important;padding:4px 8px!important;font-size:13px}\n.wlab-transport36 #clock{margin:0!important;font-size:12px!important}\n.wlab-graph #graph{width:100%!important;height:auto!important;max-height:calc(100dvh - 220px);object-fit:contain}\n@media(max-width:949px){\n body.wlab-ready header h1{font-size:20px!important}body.wlab-ready header .formula{margin-left:0!important}\n .wlab-sim{grid-template-columns:1fr!important}\n .wlab-side36{grid-column:1;grid-row:auto;max-height:none;overflow:visible}\n .wlab-scene #scene{height:clamp(300px,49dvh,520px)!important}\n .wlab-graph #graph{max-height:none}\n}\n@media(min-width:950px) and (max-height:650px){.wlab-scene #scene{height:clamp(280px,calc(100dvh - 190px),460px)!important}}\n\u003c/style>\u003cscript>(()=>{const sim=document.querySelector('.wlab-sim'),scene=sim?.querySelector('.wlab-scene'),control=sim?.querySelector('.wlab-control'),result=sim?.querySelector('.wlab-result');if(!scene||!control||!result)return;const side=document.createElement('div');side.className='wlab-side36';side.append(control,result);sim.append(side);const bar=document.createElement('div');bar.className='wlab-transport36';bar.append(scene.querySelector('.buttons'),scene.querySelector('label[for=\"rate\"]'),document.getElementById('rate'),document.getElementById('clock'));scene.querySelector('#scene').after(bar);const calc=document.getElementById('calc'),details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='공식 대입 · 벡터 성분 더 보기';details.append(summary,calc);result.append(details);document.querySelector('.wlab-control h2').textContent='실험 조건';document.querySelector('.wlab-scene h2').textContent='입자 운동 · 두 투영에서 동시 관찰';new ResizeObserver(()=>drawScene(model())).observe(document.getElementById('scene'));window.addEventListener('resize',()=>drawScene(model()));drawScene(model());})();\u003c/script>\u003c/body>\u003c/html>\n","\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>36｜전하의 자기력 실험실\u003c/title>\u003cstyle>\n:root{color-scheme:dark;--bg:#0b1222;--panel:#141f34;--line:#304361;--text:#ecf3ff;--muted:#b3c3dd;--mint:#5ee5ba;--yellow:#ffd278;--pink:#ff8eb0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans KR',sans-serif;line-height:1.65}main{max-width:1180px;margin:auto;padding:22px}header{margin-bottom:20px}h1{font-size:clamp(25px,4vw,38px);margin:6px 0}h2{font-size:20px;margin:0 0 12px}.tag{color:var(--mint);font-weight:700}.formula{font-size:25px;font-weight:700;color:var(--yellow)}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.wide{grid-column:1/-1}p{margin:8px 0}.note,small{color:var(--muted);font-size:14px}canvas{width:100%;display:block;background:#0a1527;border-radius:12px}label{display:block;font-weight:600;margin:10px 0 3px}.ctrl{display:grid;grid-template-columns:1fr 95px;gap:12px;align-items:center}input[type=range]{width:100%;min-height:40px;accent-color:var(--mint)}input[type=number],select{width:100%;background:#0a1527;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;min-height:44px}button{background:#233952;color:var(--text);border:1px solid #496080;border-radius:10px;padding:10px 14px;min-height:44px;font-size:15px;cursor:pointer}button.primary{background:#176554;border-color:var(--mint)}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:10px;border-radius:10px;background:#0a1527}.stat strong{display:block;font-size:21px;color:var(--mint)}.calc{overflow-wrap:anywhere;background:#0a1527;border-radius:10px;padding:14px;margin-top:12px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600;min-height:36px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}.scroll{overflow:auto}textarea{width:100%;min-height:65px;border-radius:8px;background:#0a1527;color:white;padding:10px;border:1px solid var(--line)}@media(max-width:760px){main{padding:12px}.grid{display:block}.card{padding:14px}.stats{gap:7px}.stat strong{font-size:18px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cheader>\u003cspan class=\"tag\">물리 공식 40 · 인터랙티브 실험실 36\u003c/span>\u003ch1>전하의 자기력\u003c/h1>\u003cdiv class=\"formula\">F = |q|vB sinθ　 ·　 F⃗ = q(v⃗ × B⃗)\u003c/div>\u003cp>전하의 부호와 속도·자기장·각도를 바꾸면 힘과 궤적은 어떻게 달라질까요?\u003c/p>\u003c/header>\u003cdiv class=\"grid\">\u003csection class=\"card\">\u003ch2>① 예측 → 조작 → 관찰\u003c/h2>\u003cp class=\"note\">자기장은 z축 방향. 위에서 본 궤적과 옆에서 본 궤적은 같은 입자입니다.\u003c/p>\u003ccanvas id=\"scene\" width=\"720\" height=\"600\" aria-label=\"xy 평면과 xz 평면에 투영한 입자의 궤적\">\u003c/canvas>\u003cdiv class=\"buttons\">\u003cbutton class=\"primary\" id=\"play\">시작\u003c/button>\u003cbutton id=\"pause\">일시정지\u003c/button>\u003cbutton id=\"restart\">다시 시작\u003c/button>\u003cbutton id=\"reset\">전체 초기화\u003c/button>\u003c/div>\u003clabel for=\"rate\">재생 속도\u003c/label>\u003cselect id=\"rate\">\u003coption value=\"0.5\">0.5배\u003c/option>\u003coption value=\"1\" selected>1배\u003c/option>\u003coption value=\"2\">2배\u003c/option>\u003c/select>\u003cp id=\"clock\" class=\"note\">\u003c/p>\u003cp class=\"note\">화살표: \u003cspan style=\"color:var(--mint)\">v 속도\u003c/span> · \u003cspan style=\"color:var(--pink)\">F 자기력\u003c/span>. 각각 방향을 보여주도록 길이를 정규화했습니다. z방향 성분은 옆면에서 확인합니다.\u003c/p>\u003c/section>\u003csection class=\"card\">\u003ch2>② 조건과 실시간 계산\u003c/h2>\u003cdiv id=\"controls\">\u003c/div>\u003clabel for=\"dir\">자기장 방향\u003c/label>\u003cselect id=\"dir\">\u003coption value=\"1\">+z (위쪽 · 화면 밖 ⊙)\u003c/option>\u003coption value=\"-1\">−z (아래쪽 · 화면 안 ⊗)\u003c/option>\u003c/select>\u003cp class=\"note\">조건을 바꾸면 t = 0으로 돌아가고 재생이 멈춥니다. θ는 초기 속도와 실제 자기장 방향 사이의 각입니다.\u003c/p>\u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\u003cdiv class=\"calc\" id=\"calc\">\u003c/div>\u003cp id=\"direction\">\u003c/p>\u003cdetails>\u003csummary>기호와 단위\u003c/summary>\u003cp>q: 전하(C), v: 속력(m/s), B: 자기장 크기(T), θ: 속도와 자기장 사이 각, m: 질량(kg). 1 nC = 10⁻⁹ C. 질량 입력 1은 10⁻¹⁵ kg, 속력 입력 1은 10⁴ m/s입니다.\u003c/p>\u003c/details>\u003c/section>\u003csection class=\"card\">\u003ch2>③ 각도와 힘의 관계\u003c/h2>\u003ccanvas id=\"graph\" width=\"720\" height=\"360\" aria-label=\"각도 세타와 자기력 크기의 관계 그래프\">\u003c/canvas>\u003cp class=\"note\">관계 그래프: θ만 0°~180°로 변화. 현재 q, v, B는 고정. 노란 점은 현재 조건입니다.\u003c/p>\u003cdiv class=\"buttons\">\u003cbutton id=\"saveA\">조건 A 저장\u003c/button>\u003cbutton id=\"saveB\">조건 B 저장\u003c/button>\u003cbutton id=\"clear\">비교 지우기\u003c/button>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>조건 A\u003c/th>\u003cth>조건 B\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"compare\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2>④ 설명하며 탐구하기\u003c/h2>\u003clabel for=\"predict\">예측 기록\u003c/label>\u003ctextarea id=\"predict\" placeholder=\"예: 음전하로 바꾸면 힘의 크기는 같고 회전 방향은 반대일 것이다.\">\u003c/textarea>\u003cdetails>\u003csummary>기본｜각도를 0°, 90°, 180°로 바꾸면?\u003c/summary>\u003cp>sin0° = sin180° = 0이므로 자기력이 0입니다. 90°에서는 최대 F = |q|vB. 180°는 반평행이며 여전히 힘이 없습니다. q, v 또는 B가 0인 경우에도 힘은 0입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>응용｜전하 부호와 자기장 방향을 각각 뒤집으면?\u003c/summary>\u003cp>각각을 뒤집으면 자기력 방향과 회전 방향이 반대가 됩니다. 둘 다 뒤집으면 초기 xy 속도가 동일한 이 실험에서 xy 궤적은 다시 같습니다. θ는 실제 자기장과 이루는 각으로 정의하므로 B방향 변경 시 z방향 초기 속도도 바뀝니다. 완전히 같은 3차원 초기 속도를 유지하려면 θ도 180°−θ로 바꿔 비교하세요.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>도전｜힘이 있는데 속력이 변하지 않는 이유는?\u003c/summary>\u003cp>자기력은 매 순간 속도에 수직입니다. 순간 일률 F⃗·v⃗ = 0이므로 운동 에너지가 일정합니다. 0°&lt;θ&lt;180°에서 평행 성분 v∥는 일정하고 수직 성분은 회전하여 나선 운동을 만듭니다. θ = 90°이면 원운동입니다. r = mv sinθ/(|q|B), T = 2πm/(|q|B). v∥ = v cosθ는 실제 자기장 방향을 기준으로 한 부호 있는 성분입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>오개념｜자기력이 속력을 높인다?\u003c/summary>\u003cp>재생 중 운동 에너지와 속력을 확인하세요. 힘은 진행 방향을 바꾸지만 자기력만으로 속력은 바꾸지 않습니다. 또 전하가 정지해 있으면 자기장 안에서도 자기력은 0입니다.\u003c/p>\u003c/details>\u003cdetails open>\u003csummary>적용 조건과 모형의 한계\u003c/summary>\u003cp>균일하고 시간에 따라 변하지 않는 자기장, 전기장·중력·충돌 없음, 고전적 비상대론적 입자 모형입니다. 복사와 양자 효과는 무시합니다. 이 실험은 비교가 쉬운 가상 전하·질량을 사용하며 특정 실제 입자를 뜻하지 않습니다.\u003c/p>\u003cp>궤적은 운동방정식의 해석해로 계산합니다. 각 조건에 맞춰 두 투영의 공간 축척을 조절하므로 서로 다른 조건의 화면상 원 크기를 직접 비교하지 말고 r 수치를 확인하세요. 양쪽 화면은 같은 공간 축척이며 실제 시간은 μs 단위로 느리게 재생합니다. 조건 A·B는 같은 SI 기준의 수치 비교입니다.\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003c/main>\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id), defs=[['q','전하 q (nC)',-5,5,.1,1],['v','속력 v (×10⁴ m/s)',0,5,.1,1],['B','자기장 크기 B (T)',0,2,.05,.5],['theta','각도 θ (°)',0,180,1,45],['m','질량 m (×10⁻¹⁵ kg)',.1,5,.1,1]];\nlet values=Object.fromEntries(defs.map(d=>[d[0],d[5]])),time=0,running=false,last=null,saved={A:null,B:null};\nfor(const [id,label,min,max,step,val] of defs){const box=document.createElement('div');box.innerHTML=`\u003clabel for=\"${id}n\">${label}\u003c/label>\u003cdiv class=\"ctrl\">\u003cinput type=\"range\" id=\"${id}s\" aria-label=\"${label}\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${val}\">\u003cinput type=\"number\" id=\"${id}n\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${val}\">\u003c/div>`;$('controls').append(box);for(const suffix of ['s','n'])$(id+suffix).addEventListener('input',e=>{if(e.target.value===''||!Number.isFinite(e.target.valueAsNumber))return;values[id]=Math.max(min,Math.min(max,e.target.valueAsNumber));$(id+'s').value=$(id+'n').value=values[id];restart();});}\nfunction model(a=values,dir=+$('dir').value){const q=a.q*1e-9,v=a.v*1e4,B=a.B,m=a.m*1e-15,th=a.theta*Math.PI/180,vp=(a.theta===0||a.theta===180)?0:v*Math.sin(th),vz=dir*v*Math.cos(th),w=q*B*dir/m,F=Math.abs(q)*vp*B,K=.5*m*v*v,T=w?2*Math.PI/Math.abs(w):null,r=(w&&vp)?Math.abs(vp/w):null,horizon=w&&vp?2*T:20e-6;return {q,v,B,m,th,vp,vz,w,F,K,T,r,horizon,dir};}\nfunction state(p,t){let x,y,vx,vy;if(!p.w){x=p.vp*t;y=0;vx=p.vp;vy=0;}else{const u=p.w*t;x=p.vp*Math.sin(u)/p.w;y=-2*p.vp*Math.sin(u/2)**2/p.w;vx=p.vp*Math.cos(u);vy=-p.vp*Math.sin(u);}return{x,y,z:p.vz*t,vx,vy,vz:p.vz,Fx:p.q*p.B*p.dir*vy,Fy:-p.q*p.B*p.dir*vx};}\nconst fmt=x=>x===null?'—':x===0?'0':Math.abs(x)>=.01&&Math.abs(x)\u003c10000?Number(x.toPrecision(4)).toString():x.toExponential(3);\nfunction arrow(c,x,y,dx,dy,color,label){const norm=Math.hypot(dx,dy);if(norm\u003c1e-30)return;dx=dx/norm*48;dy=dy/norm*48;c.strokeStyle=color;c.fillStyle=color;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();const a=Math.atan2(dy,dx);c.beginPath();c.moveTo(x+dx,y+dy);c.lineTo(x+dx-10*Math.cos(a-.45),y+dy-10*Math.sin(a-.45));c.lineTo(x+dx-10*Math.cos(a+.45),y+dy-10*Math.sin(a+.45));c.fill();c.fillText(label,x+dx+7,y+dy);}\nfunction drawScene(p){\n const canvas=$('scene'),W=Math.max(1,Math.round(canvas.clientWidth)),H=Math.max(1,Math.round(canvas.clientHeight));if(W\u003c100||H\u003c100)return;\n const dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);}\n const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);c.fillStyle='#04080f';c.fillRect(0,0,W,H);\n const pts=Array.from({length:361},(_,i)=>state(p,p.horizon*i/360)),current=state(p,time),horizontal=W>=650,gap=8;\n const pw=horizontal?(W-gap)/2:W,ph=horizontal?H:(H-gap)/2;\n const bounds=k=>{const v=pts.map(s=>s[k]);return [Math.min(0,...v),Math.max(0,...v)]},xb=bounds('x'),yb=bounds('y'),zb=bounds('z');\n const xspan=xb[1]-xb[0],yspan=Math.max(yb[1]-yb[0],zb[1]-zb[0]),span=Math.max(xspan,yspan),reserve=Math.min(55,pw*.12,ph*.13);\n const plotW=Math.max(30,pw-2*reserve-16),plotH=Math.max(30,ph-2*reserve-46);\n const scale=span>0?Math.min(plotW/Math.max(xspan,span*.000001),plotH/Math.max(yspan,span*.000001)):Math.min(plotW,plotH)/.06;\n const target=55/scale,base=10**Math.floor(Math.log10(target)),step=([1,2,5,10].find(n=>n*base>=target)||10)*base;\n for(let i=0;i\u003c2;i++){\n  const side=i===1,b=side?zb:yb,left=horizontal?i*(pw+gap):0,top=horizontal?0:i*(ph+gap),cx=left+pw/2,cy=top+ph/2+3;\n  const ox=cx-(xb[0]+xb[1])*scale/2,oy=cy+(b[0]+b[1])*scale/2,x0=left+13,x1=left+pw-13,y0=top+36,y1=top+ph-26;\n  c.fillStyle='#08121e';c.fillRect(left+1,top+1,pw-2,ph-2);c.strokeStyle='#344458';c.lineWidth=1;c.strokeRect(left+1.5,top+1.5,pw-3,ph-3);\n  c.font='bold 15px system-ui';c.fillStyle='#e5f1ff';c.fillText(side?'옆면 · xz 평면':'윗면 · xy 평면',left+12,top+21);\n  if(!side){c.fillStyle='#ffd278';c.textAlign='right';c.fillText(p.dir===1?'B ⊙':'B ⊗',left+pw-12,top+21);c.textAlign='left';}\n  c.save();c.beginPath();c.rect(x0,y0,x1-x0,y1-y0);c.clip();\n  const delta=step*scale;\n  c.strokeStyle='#1d3043';c.lineWidth=1;c.beginPath();\n  for(let x=ox+Math.ceil((x0-ox)/delta)*delta;x\u003c=x1;x+=delta){c.moveTo(x,y0);c.lineTo(x,y1)}\n  for(let y=oy+Math.ceil((y0-oy)/delta)*delta;y\u003c=y1;y+=delta){c.moveTo(x0,y);c.lineTo(x1,y)}c.stroke();\n  c.strokeStyle='#56728d';c.lineWidth=1.3;c.beginPath();c.moveTo(x0,oy);c.lineTo(x1,oy);c.moveTo(ox,y0);c.lineTo(ox,y1);c.stroke();\n  c.font='13px system-ui';c.fillStyle='#a9c5dd';c.fillText('+x →',x1-42,Math.max(y0+15,Math.min(y1-4,oy-6)));c.fillText(side?'+z ↑':'+y ↑',Math.max(x0+3,Math.min(x1-37,ox+6)),y0+15);\n  const project=s=>[ox+s.x*scale,oy-(side?s.z:s.y)*scale];\n  const trace=(arr,color,width,dashed)=>{c.setLineDash(dashed?[6,5]:[]);c.strokeStyle=color;c.lineWidth=width;c.beginPath();arr.forEach((s,j)=>{const[x,y]=project(s);j?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.setLineDash([]);};\n  trace(pts,'#7791ac',1.7,true);trace(Array.from({length:241},(_,j)=>state(p,time*j/240)),'#5ee5ba',3,false);\n  const [x,y]=project(current);c.fillStyle='#ffdc7b';c.beginPath();c.arc(x,y,7,0,2*Math.PI);c.fill();c.font='bold 15px system-ui';\n  arrow(c,x,y,current.vx,side?-current.vz:-current.vy,'#5ee5ba','v');arrow(c,x,y,current.Fx,side?0:-current.Fy,'#ff8eb0','F');c.restore();\n  c.font='12px system-ui';c.fillStyle='#a9c5dd';c.fillText('눈금 간격 '+fmt(step)+' m'+(side&&p.F?' · Fy는 옆면에서 보이지 않음':''),left+12,top+ph-9);\n }\n}\nfunction drawGraph(p){const c=$('graph').getContext('2d');c.clearRect(0,0,720,360);const max=Math.abs(p.q)*p.v*p.B*1e6,ymax=500;c.font='15px system-ui';c.fillStyle='#b3c3dd';c.fillText('F (μN)',12,22);c.fillText('θ (°)',650,343);for(let i=0;i\u003c=4;i++){const y=290-i*60;c.strokeStyle='#304361';c.beginPath();c.moveTo(70,y);c.lineTo(660,y);c.stroke();c.fillText(fmt(ymax*i/4),8,y+5);}for(let i=0;i\u003c=4;i++)c.fillText(i*45,65+i*147.5,318);c.strokeStyle='#5ee5ba';c.lineWidth=3;c.beginPath();for(let a=0;a\u003c=180;a++){const x=70+a/180*590,y=290-max*Math.sin(a*Math.PI/180)/ymax*240;a?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();c.fillStyle='#ffd278';c.beginPath();c.arc(70+values.theta/180*590,290-p.F*1e6/ymax*240,6,0,Math.PI*2);c.fill();if(!max)c.fillText('자기력 = 0 (세로축 0~500 μN)',260,55);}\nfunction update(){const p=model(),s=state(p,time);$('stats').innerHTML=[['자기력 크기',fmt(p.F*1e6)+' μN'],['속력',fmt(p.v)+' m/s'],['운동 에너지',fmt(p.K)+' J'],['회전 반지름',p.r===null?'회전 없음':fmt(p.r)+' m']].map(([a,b])=>`\u003cdiv class=\"stat\">${a}\u003cstrong>${b}\u003c/strong>\u003c/div>`).join('');$('calc').innerHTML=`F = |q|vB sinθ\u003cbr>= |${fmt(p.q)}| × ${fmt(p.v)} × ${p.B} × sin${values.theta}°\u003cbr>= \u003cb>${fmt(p.F)} N\u003c/b>\u003cbr>F⃗ = (${fmt(s.Fx)}, ${fmt(s.Fy)}, 0) N\u003cbr>v∥ = ${fmt(p.v*Math.cos(p.th))} m/s (자기장 방향 기준)\u003cbr>T = ${p.T&&p.vp?fmt(p.T*1e6)+' μs':'회전 없음'} · F⃗·v⃗ = 0 W`;$('direction').textContent=p.F===0?'힘 = 0: 정지 또는 직선 운동.':`윗면 회전: ${p.w>0?'시계':'반시계'} 방향. 자기력은 매 순간 속도에 수직입니다.`;$('clock').textContent=`t = ${fmt(time*1e6)} μs / ${fmt(p.horizon*1e6)} μs · ${running?'재생 중':time>=p.horizon?'재생 완료':'정지'} · 측정 시작 t = 0`;$('play').textContent=time>=p.horizon?'다시 재생':'시작 / 계속';drawScene(p);drawGraph(p);}\nfunction restart(){time=0;running=false;last=null;update();}\n$('dir').onchange=restart;$('play').onclick=()=>{if(time>=model().horizon)time=0;running=true;last=null;update()};$('pause').onclick=()=>{running=false;last=null;update()};$('restart').onclick=restart;$('reset').onclick=()=>{values=Object.fromEntries(defs.map(d=>[d[0],d[5]]));defs.forEach(d=>{$(d[0]+'s').value=$(d[0]+'n').value=d[5]});$('dir').value='1';$('rate').value='1';$('predict').value='';saved={A:null,B:null};compare();restart()};\nfunction compare(){const rows=[['q (nC)',a=>a.q],['v (m/s)',a=>fmt(a.v*1e4)],['B (T)',a=>a.B],['자기장 방향',a=>a.dir===1?'+z':'−z'],['θ (°)',a=>a.theta],['m (kg)',a=>fmt(a.m*1e-15)],['F (N)',a=>fmt(model(a,a.dir).F)],['r (m)',a=>fmt(model(a,a.dir).r)],['K (J)',a=>fmt(model(a,a.dir).K)]];$('compare').innerHTML=rows.map(([label,f])=>`\u003ctr>\u003cth>${label}\u003c/th>\u003ctd>${saved.A?f(saved.A):'미저장'}\u003c/td>\u003ctd>${saved.B?f(saved.B):'미저장'}\u003c/td>\u003c/tr>`).join('');}for(const key of ['A','B'])$('save'+key).onclick=()=>{saved[key]={...values,dir:+$('dir').value};compare()};$('clear').onclick=()=>{saved={A:null,B:null};compare()};document.addEventListener('visibilitychange',()=>{last=null});function frame(now){if(running&&!document.hidden){const p=model();if(last!==null)time=Math.min(p.horizon,time+Math.min((now-last)/1000,.05)*p.horizon/12*+$('rate').value);last=now;if(time>=p.horizon)running=false;update();}else last=null;requestAnimationFrame(frame)}compare();update();requestAnimationFrame(frame);\n\u003c/script>\u003cstyle>\n/* Independent fixed teaching tabs; original experiment logic is unchanged. */\nhtml,body{background:#080d15!important;color-scheme:dark}\nbody.wlab-ready{margin:0;overflow-x:hidden}\n.wlab-root{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:8px 14px 12px!important;min-width:0!important;box-sizing:border-box}\nbody.wlab-ready .wrap{max-width:none!important;padding:8px 14px!important}\nbody.wlab-ready header{padding:8px 14px!important;margin:0 0 6px!important;min-height:0!important;background:#0e1725!important}\nbody.wlab-ready header h1{font-size:clamp(19px,2.2vw,28px)!important;line-height:1.2;margin:3px 0!important}\nbody.wlab-ready header p,body.wlab-ready header .tag,body.wlab-ready ;--bg:#0c1424;--card:#162238;--text:#edf3ff;--muted:#a9bdd5;--b:#65c9ff;--i:#ffcf72;--f:#a1efb3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:22px}h1{font-size:clamp(24px,4vw,36px);margin:5px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.tag{color:var(--b);font-weight:bold}.formula{font-size:26px;font-weight:bold}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.card{background:var(--card);border:1px solid #2d405b;border-radius:18px;padding:20px;margin-top:16px;min-width:0}svg{width:100%;height:auto;display:block;background:#101c2e;border-radius:12px}svg text{font-family:system-ui,sans-serif;fill:var(--text)}.control{margin:12px 0 20px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}input[type=range]{width:100%;height:36px;accent-color:var(--b)}input[type=number]{width:98px}input,select,button,textarea{font:inherit;color:var(--text);background:#0f1b30;border:1px solid #526783;border-radius:9px;padding:8px;min-height:44px}button{cursor:pointer}button:hover{background:#29405b}button.primary{background:#23668e}label{font-weight:600}select{max-width:100%}.values{display:grid;grid-template-columns:1fr 1fr;gap:10px}.value{background:#0e1c2e;border-radius:12px;padding:12px}.value strong{display:block;color:var(--f);font-size:24px}.notice{border-left:3px solid var(--f);padding-left:12px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}td,th{padding:10px;border-bottom:1px solid #42516b;text-align:left}details{border-top:1px solid #3b4c67;padding:12px 0}summary{cursor:pointer;min-height:36px}textarea{width:100%;resize:vertical}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:14px}.legend b:nth-child(1){color:var(--b)}.legend b:nth-child(2){color:var(--i)}.legend b:nth-child(3){color:var(--f)}@media(max-width:760px){main{padding:12px}.grid{grid-template-columns:1fr}.card{padding:16px}.formula{font-size:23px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003cheader>\u003cspan class=\"tag\">물리 공식 40 · INTERACTIVE LAB 37\u003c/span>\u003ch1>도선의 자기력\u003c/h1>\u003cdiv class=\"formula\">F = B I L sinθ\u003c/div>\u003cp class=\"muted\">자기장·전류·도선 길이·각도를 바꾸면 힘의 크기와 방향은 어떻게 달라질까요?\u003c/p>\u003c/header>\n\u003cdiv class=\"grid\">\u003csection class=\"card\">\u003ch2>① 자기장 속 도선 · 위에서 본 모습\u003c/h2>\u003csvg id=\"scene\" viewBox=\"0 0 560 370\" role=\"img\" aria-label=\"자기장, 전류 방향과 화면 수직 방향의 자기력\">\u003c/svg>\u003cdiv class=\"legend\">\u003cb>→ 자기장 B\u003c/b>\u003cb>→ 관습적 전류 I\u003c/b>\u003cb>⊙ / ⊗ 자기력 F\u003c/b>\u003c/div>\u003cp id=\"direction\" class=\"notice\" aria-live=\"polite\">\u003c/p>\u003csmall>⊙ 화면 밖(관찰자 쪽, +z) · ⊗ 화면 안(−z). 도선은 고정되어 있고 힘을 측정합니다. 도선 길이와 힘 기호 크기는 보기 좋게 축척을 바꿨습니다.\u003c/small>\u003c/section>\n\u003csection class=\"card\">\u003ch2>② 조건 조절\u003c/h2>\u003cdiv id=\"controls\">\u003c/div>\u003cdiv class=\"row\">\u003clabel for=\"bs\">자기장 방향\u003c/label>\u003cselect id=\"bs\">\u003coption value=\"1\">오른쪽 (+x)\u003c/option>\u003coption value=\"-1\">왼쪽 (−x)\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003clabel for=\"is\">전류 방향\u003c/label>\u003cselect id=\"is\">\u003coption value=\"1\">기준 방향\u003c/option>\u003coption value=\"-1\">기준 방향의 반대\u003c/option>\u003c/select>\u003c/div>\u003cp class=\"muted\">α는 기준 도선 방향과 +x축 사이 각도입니다. θ는 실제 전류와 자기장 사이 각도이며 방향 반전을 반영해 자동 계산합니다.\u003c/p>\u003cbutton id=\"reset\">전체 초기화\u003c/button>\u003c/section>\u003c/div>\n\u003csection class=\"card\">\u003ch2>③ 실시간 측정과 대입\u003c/h2>\u003cdiv class=\"values\">\u003cdiv class=\"value\">자기력의 크기 |F|\u003cstrong id=\"force\">\u003c/strong>\u003c/div>\u003cdiv class=\"value\">부호를 포함한 F\u003csub>z\u003c/sub>\u003cstrong id=\"fz\">\u003c/strong>\u003c/div>\u003cdiv class=\"value\">실제 사이각 θ\u003cstrong id=\"theta\">\u003c/strong>\u003c/div>\u003cdiv class=\"value\">자기장에 수직인 길이 L sinθ\u003cstrong id=\"perp\">\u003c/strong>\u003c/div>\u003c/div>\u003cp id=\"substitution\">\u003c/p>\u003cdetails>\u003csummary>기호와 방향 계산\u003c/summary>\u003cp>B: 자기장 크기(T), I: 전류 크기(A), L: 균일한 자기장 안의 직선 도선 길이(m), θ: 전류와 자기장 사이각(0°~180°), F: 힘 크기(N).\u003c/p>\u003cp>벡터식은 F⃗ = I L⃗ × B⃗ 입니다. L⃗는 관습적 전류 방향입니다. 이 장면에서 B⃗ = (s\u003csub>B\u003c/sub>B, 0, 0), L⃗ = s\u003csub>I\u003c/sub>L(cosα, sinα, 0)이므로 F\u003csub>z\u003c/sub> = −s\u003csub>I\u003c/sub>s\u003csub>B\u003c/sub>BIL sinα입니다. 오른손 네 손가락을 전류에서 자기장 쪽으로 굽힐 때 엄지가 힘 방향입니다.\u003c/p>\u003c/details>\u003c/section>\n\u003csection class=\"card\">\u003cdiv class=\"row\">\u003ch2>④ 변수 관계 그래프\u003c/h2>\u003cselect id=\"axis\" aria-label=\"그래프 가로축\">\u003coption value=\"angle\">사이각 θ (°)\u003c/option>\u003coption value=\"B\">자기장 B (T)\u003c/option>\u003coption value=\"I\">전류 I (A)\u003c/option>\u003coption value=\"L\">도선 길이 L (m)\u003c/option>\u003c/select>\u003c/div>\u003cp id=\"fixed\" class=\"muted\">\u003c/p>\u003csvg id=\"graph\" viewBox=\"0 0 720 340\" role=\"img\" aria-label=\"자기력 크기와 선택 변수의 관계 그래프\">\u003c/svg>\u003cp class=\"muted\">실선: 변수 관계 · ●: 현재 상태 · A/B: 저장한 조건. 시간 변화 그래프가 아닙니다. 저장점은 각 조건 자체의 좌표이며, 현재 곡선과 고정 조건이 다를 수 있습니다.\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003ch2>⑤ 조건 A·B 비교\u003c/h2>\u003cdiv class=\"row\">\u003cdiv>\u003cbutton id=\"saveA\" class=\"primary\">현재 조건 → A 저장\u003c/button> \u003cbutton id=\"saveB\" class=\"primary\">현재 조건 → B 저장\u003c/button>\u003c/div>\u003cbutton id=\"clear\">비교 지우기\u003c/button>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>조건\u003c/th>\u003cth>B / I / L\u003c/th>\u003cth>α / θ\u003c/th>\u003cth>방향 B / I\u003c/th>\u003cth>|F| / Fz (N)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"comparison\">\u003c/tbody>\u003c/table>\u003c/div>\u003cp id=\"ratio\">\u003c/p>\u003csmall>저장한 조건은 파일을 닫으면 사라집니다. 초기화는 모든 입력과 비교 기록을 처음으로 되돌립니다.\u003c/small>\u003c/section>\n\u003csection class=\"card\">\u003ch2>⑥ 예측 → 조작 → 관찰 → 설명\u003c/h2>\u003clabel for=\"prediction\">먼저 예측해 보세요: 전류만 2배이면 힘은?\u003c/label>\u003ctextarea id=\"prediction\" placeholder=\"예측과 근거를 적고 조작 후 관찰 결과를 비교하세요.\" rows=\"2\">\u003c/textarea>\u003cdetails>\u003csummary>기본 탐구 · 전류를 2 A에서 4 A로 바꾸면?\u003c/summary>\u003cp>B=0.50 T, L=0.40 m, θ=90°에서 F는 0.40 N → 0.80 N입니다. 다른 조건이 일정할 때 전류와 힘은 정비례합니다. A·B에 각각 저장해 비교하세요.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>응용 탐구 · θ=30°, 90°, 150°의 힘은?\u003c/summary>\u003cp>sin30°=sin150°=0.5이고 sin90°=1입니다. 따라서 30°와 150°에서 힘 크기가 같고 90°에서 최대입니다. 각도와 힘은 정비례하지 않습니다. θ=0° 또는 180°에서는 힘이 0입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>도전 탐구 · 한 방향과 두 방향을 반전하면?\u003c/summary>\u003cp>α=90°에서 전류만 반전하거나 자기장만 반전하면 힘의 방향이 반대가 됩니다. 둘을 모두 반전하면 원래 힘 방향으로 돌아옵니다. 크기는 그대로입니다. θ가 90°가 아닐 때 한 방향 반전으로 θ는 180°−θ가 되지만 사인값은 같습니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>오개념 확인 · 자기력은 자기장 방향으로 작용할까?\u003c/summary>\u003cp>자기력은 전류 방향과 자기장 방향 모두에 수직입니다. 이 장면의 자기장과 전류는 화면 평면에 있으므로 힘은 화면 안 또는 밖으로 향합니다. α=0°로 조절하면 전류가 흘러도 자기력은 0임을 확인할 수 있습니다. 전자의 이동 방향은 관습적 전류와 반대입니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>적용 조건과 모형의 한계\u003c/summary>\u003cp>균일한 외부 자기장 속 직선 도선의 힘을 다룹니다. L은 자기장 영역 안에 있는 길이입니다. 전류와 외부 자기장은 일정하며 도선의 자체 자기장, 회로의 나머지 부분, 가열·변형을 계산하지 않습니다. 도선은 지지대로 고정되어 있어 운동을 표시하지 않으며 자기력은 지지력과 평형을 이룹니다. 비균일한 자기장이나 굽은 도선은 작은 구간마다 dF⃗ = I dℓ⃗ × B⃗를 합해야 합니다.\u003c/p>\u003c/details>\u003c/section>\n\u003c/main>\u003cscript>\n'use strict';\nconst defaults={B:0.5,I:2,L:0.4,angle:90,bs:1,is:1};let state={...defaults},saved={A:null,B:null};\nconst specs={B:['자기장 크기 B','T',0,2,0.01],I:['전류 크기 I','A',0,5,0.1],L:['자기장 안 도선 길이 L','m',0,1,0.01],angle:['기준 방향 각도 α','°',0,180,1]};\nconst $=id=>document.getElementById(id);const fmt=(v,n=3)=>(Math.abs(v)\u003c1e-10?0:v).toFixed(n);\nfunction calculate(s){let a=s.angle*Math.PI/180;let sin=Math.abs(Math.sin(a));if(sin\u003c1e-12)sin=0;const sign=s.bs*s.is;return{F:s.B*s.I*s.L*sin,Fz:-sign*s.B*s.I*s.L*sin,theta:Math.acos(Math.max(-1,Math.min(1,sign*Math.cos(a))))*180/Math.PI,perp:s.L*sin};}\nfunction line(x1,y1,x2,y2,color,width=3,marker=false){return `\u003cline x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${color}\" stroke-width=\"${width}\" ${marker?'marker-end=\"url(#'+(color==='#65c9ff'?'mb':'mi')+')\"':''}/>`;}\nfunction scene(){const c=calculate(state),a=state.angle*Math.PI/180,len=60+state.L*155,dx=Math.cos(a)*len,dy=-Math.sin(a)*len;let out='\u003cdefs>\u003cmarker id=\"mb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath d=\"M0 0 L10 5 L0 10\" fill=\"#65c9ff\"/>\u003c/marker>\u003cmarker id=\"mi\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath d=\"M0 0 L10 5 L0 10\" fill=\"#ffcf72\"/>\u003c/marker>\u003c/defs>';\nfor(let y=65;y\u003c=305;y+=60)for(let x=35;x\u003c=495;x+=115)out+=line(state.bs>0?x:x+70,y,state.bs>0?x+70:x,y,'#65c9ff',state.B===0?0:1+state.B,true);\nout+='\u003ctext x=\"20\" y=\"27\" font-size=\"16\">B：'+(state.B===0?'0 T (자기장 없음)':(state.bs>0?'오른쪽 →':'왼쪽 ←'))+'\u003c/text>';\nout+=line(280-dx/2,180-dy/2,280+dx/2,180+dy/2,'#51667e',14);out+=line(280-dx/2,180-dy/2,280+dx/2,180+dy/2,'#ffcf72',5);\nif(state.I>0&&state.L>0)out+=line(280-state.is*dx*.32,180-state.is*dy*.32,280+state.is*dx*.32,180+state.is*dy*.32,'#ffcf72',4,true);\nout+='\u003ctext x=\"20\" y=\"348\" font-size=\"16\">+x → · +y ↑ · 기준 각도 α='+state.angle+'°\u003c/text>';\nout+='\u003crect x=\"405\" y=\"113\" width=\"135\" height=\"125\" rx=\"15\" fill=\"#0c1728\" stroke=\"#6ca67f\"/>\u003ctext x=\"418\" y=\"140\" font-size=\"15\">자기력 F\u003c/text>\u003ctext x=\"470\" y=\"198\" text-anchor=\"middle\" style=\"fill:#a1efb3\" font-size=\"48\">'+(c.F===0?'0':c.Fz>0?'⊙':'⊗')+'\u003c/text>\u003ctext x=\"470\" y=\"225\" text-anchor=\"middle\" font-size=\"13\">'+(c.F===0?'방향 없음':c.Fz>0?'화면 밖 +z':'화면 안 −z')+'\u003c/text>';$('scene').innerHTML=out;\n$('direction').textContent=c.F===0?'자기력 0 N · 방향이 정의되지 않습니다.':`자기력 ${fmt(c.F)} N · ${c.Fz>0?'화면 밖(+z)':'화면 안(−z)'} 방향`;\n}\nfunction graph(){const key=$('axis').value,c=calculate(state),max=specs[key][3],ymax=Math.max(0.1,...[state,...Object.values(saved).filter(Boolean)].map(s=>calculate(s).F));let top=key==='angle'?state.B*state.I*state.L:calculate({...state,[key]:max}).F;const ymax2=Math.max(ymax,top)*1.15;let out='';for(let i=0;i\u003c=4;i++){let y=275-i*55;out+=`\u003cline x1=\"75\" x2=\"680\" y1=\"${y}\" y2=\"${y}\" stroke=\"#314359\"/>\u003ctext x=\"65\" y=\"${y+5}\" text-anchor=\"end\" font-size=\"13\">${fmt(ymax2*i/4,2)}\u003c/text>`;let x=75+i*605/4;out+=`\u003ctext x=\"${x}\" y=\"298\" text-anchor=\"middle\" font-size=\"14\">${fmt(max*i/4,key==='angle'?0:2)}\u003c/text>`;}out+='\u003cpath d=\"M75 45 V275 H680\" fill=\"none\" stroke=\"#cad8ea\"/>\u003ctext x=\"12\" y=\"23\" font-size=\"16\">|F| (N)\u003c/text>';let d='';for(let j=0;j\u003c=180;j++){let x=max*j/180;let f=key==='angle'?state.B*state.I*state.L*Math.sin(x*Math.PI/180):calculate({...state,[key]:x}).F;d+=(j?'L':'M')+(75+605*x/max)+','+(275-f/ymax2*220);}out+=`\u003cpath d=\"${d}\" fill=\"none\" stroke=\"#65c9ff\" stroke-width=\"3\"/>`;\nfor(const [name,s]of [['현재',state],...Object.entries(saved).filter(e=>e[1])]){const cc=calculate(s),x=key==='angle'?cc.theta:s[key],px=75+x/max*605,py=275-cc.F/ymax2*220;out+=`\u003ccircle cx=\"${px}\" cy=\"${py}\" r=\"${name==='현재'?6:9}\" fill=\"${name==='현재'?'#ffcf72':name==='A'?'#a1efb3':'#d3afff'}\"/>\u003ctext x=\"${Math.min(650,Math.max(95,px))}\" y=\"${Math.max(35,py-14)}\" text-anchor=\"middle\" font-size=\"14\">${name}\u003c/text>`;}out+=`\u003ctext x=\"377\" y=\"330\" text-anchor=\"middle\" font-size=\"17\">${key==='angle'?'실제 사이각 θ (°)':specs[key][0]+' ('+specs[key][1]+')'}\u003c/text>`;$('graph').innerHTML=out;\n$('fixed').textContent='변화: '+(key==='angle'?'실제 사이각 θ':specs[key][0])+' · 고정: '+['B','I','L'].filter(k=>k!==key).map(k=>k+'='+fmt(state[k],2)+' '+specs[k][1]).join(', ')+(key==='angle'?'':', θ='+fmt(c.theta,1)+'°');}\nfunction comparison(){const rows=[['현재',state],...Object.entries(saved)];$('comparison').innerHTML=rows.map(([name,s])=>{if(!s)return `\u003ctr>\u003cth>${name}\u003c/th>\u003ctd colspan=\"4\">아직 저장하지 않았습니다.\u003c/td>\u003c/tr>`;let c=calculate(s);return `\u003ctr>\u003cth>${name}\u003c/th>\u003ctd>${fmt(s.B,2)} T / ${fmt(s.I,1)} A / ${fmt(s.L,2)} m\u003c/td>\u003ctd>${s.angle}° / ${fmt(c.theta,1)}°\u003c/td>\u003ctd>${s.bs>0?'→':'←'} / ${s.is>0?'기준':'반대'}\u003c/td>\u003ctd>${fmt(c.F)} / ${fmt(c.Fz)}\u003c/td>\u003c/tr>`;}).join('');$('ratio').textContent=saved.A&&saved.B?(calculate(saved.A).F===0?'A의 힘이 0이므로 B/A 배율은 정의되지 않습니다.':`크기 비율 |F_B| / |F_A| = ${fmt(calculate(saved.B).F/calculate(saved.A).F,2)}배`):'두 조건을 저장하여 크기와 방향을 비교하세요.';}\nfunction render(){const c=calculate(state);$('force').textContent=fmt(c.F)+' N';$('fz').textContent=fmt(c.Fz)+' N';$('theta').textContent=fmt(c.theta,1)+'°';$('perp').textContent=fmt(c.perp)+' m';$('substitution').textContent=`F = BIL sinθ = ${fmt(state.B,2)} × ${fmt(state.I,1)} × ${fmt(state.L,2)} × sin(${fmt(c.theta,1)}°) = ${fmt(c.F)} N`;scene();graph();comparison();}\nfor(const [k,[label,unit,min,max,step]] of Object.entries(specs)){const el=document.createElement('div');el.className='control';el.innerHTML=`\u003cdiv class=\"row\">\u003clabel for=\"${k}n\">${label} (${unit})\u003c/label>\u003cinput id=\"${k}n\" type=\"number\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${state[k]}\" aria-label=\"${label} 숫자 입력\">\u003c/div>\u003cinput id=\"${k}r\" type=\"range\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${state[k]}\" aria-label=\"${label} 슬라이더\">`;$('controls').append(el);for(const suffix of ['n','r'])$(k+suffix).addEventListener('input',e=>{if(e.target.value==='')return;let v=Number(e.target.value);if(!Number.isFinite(v))return;state[k]=Math.max(min,Math.min(max,Math.round(v/step)*step));$(k+'r').value=state[k];if(suffix==='r')$(k+'n').value=state[k];render();});$(k+'n').ad show(j);buttons[j].focus()});buttons.push(b);nav.append(b);deck.append(t[1]);});\nconst back=el('a','');back.href='index.html';back.textContent='← 실험 목록';nav.append(back);\nshow(0);\n})({\"root\":\"main\",\"scene\":\".grid>section:nth-child(1)\",\"control\":\".grid>section:nth-child(2)\",\"result\":\"main>section:nth-of-type(1)\",\"graph\":[\"main>section:nth-of-type(2)\",\"main>section:nth-of-type(3)\"],\"concept\":[\"main>section:nth-of-type(4)\"],\"old\":[\".grid\"]});\u003c/script>\u003c/body>\u003c/html>\n","\u003c!doctype html>\u003chtml lang=\"ko\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>*{box-sizing:border-box}body{margin:0;padding:10px;background:#080e18;color:#e5edf8;font:15px system-ui}h2{font-size:19px;margin:0 0 9px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:10px}section,aside{background:#121f30;border:1px solid #304963;border-radius:10px;padding:12px;min-width:0}canvas{width:100%;height:clamp(220px,37vh,420px);display:block;border-radius:8px;background:#080f1b}label{display:flex;justify-content:space-between;font-size:14px}input{width:100%;accent-color:#63e1cb;margin:3px 0 11px}button{background:#20354b;color:#e5edf8;border:1px solid #4d6680;padding:8px 10px;border-radius:7px;font:inherit}strong{color:#6cdecf;font-size:25px}p{line-height:1.5;color:#b6cce0}#graph{height:clamp(150px,25vh,220px)}#compare{font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}canvas{height:320px}}\u003c/style>\u003cmain>\u003csection>\u003ch2>두 평행 도선의 자기력\u003c/h2>\u003ccanvas id=\"scene\" aria-label=\"두 도선의 전류 방향과 서로 받는 힘\">\u003c/canvas>\u003cp>주황: 전류 · 초록: 도선에 작용하는 힘 · 파랑: 자기장 방향의 개념 표현. 도선은 고정되어 있고 힘만 표시합니다.\u003c/p>\u003ch2>거리와 힘의 관계 · 고정축\u003c/h2>\u003ccanvas id=\"graph\" aria-label=\"거리와 단위 길이당 자기력 그래프\">\u003c/canvas>\u003c/section>\u003caside>\u003ch2>실험 조작\u003c/h2>\u003clabel>전류 I₁ (A)\u003coutput id=\"v1\">\u003c/output>\u003c/label>\u003cinput id=\"i1\" type=\"range\" min=\"-6\" max=\"6\" step=\".5\" value=\"3\">\u003clabel>전류 I₂ (A)\u003coutput id=\"v2\">\u003c/output>\u003c/label>\u003cinput id=\"i2\" type=\"range\" min=\"-6\" max=\"6\" step=\".5\" value=\"3\">\u003clabel>도선 사이 거리 (m)\u003coutput id=\"vd\">\u003c/output>\u003c/label>\u003cinput id=\"d\" type=\"range\" min=\".02\" max=\".30\" step=\".01\" value=\".10\">\u003cp>단위 길이당 힘\u003c/p>\u003cstrong id=\"force\">\u003c/strong>\u003cp id=\"direction\">\u003c/p>\u003cp>F/ℓ = μ₀|I₁I₂|/(2πd)\u003c/p>\u003cbutton id=\"reverse\">I₂ 반전\u003c/button> \u003cbutton id=\"reset\">초기화\u003c/button>\u003cp>\u003cbutton id=\"a\">조건 A 저장\u003c/button> \u003cbutton id=\"b\">조건 B 저장\u003c/button>\u003c/p>\u003cp id=\"compare\">\u003c/p>\u003cp>같은 방향의 전류는 인력, 반대 방향의 전류는 척력. 두 도선의 힘 크기는 같습니다. 긴 직선 도선 근사이며 μ₀≈4π×10⁻⁷ T·m/A입니다.\u003c/p>\u003cdetails>\u003csummary>거리만 2배라면?\u003c/summary>단위 길이당 힘이 절반이 됩니다.\u003c/details>\u003c/aside>\u003c/main>\u003cscript>\n'use strict';const $=id=>document.getElementById(id),read=()=>({a:+$('i1').value,b:+$('i2').value,d:+$('d').value}),force=p=>2e-7*Math.abs(p.a*p.b)/p.d*1e6;let saved=[null,null];\nfunction setup(id){const c=$(id),r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.fillStyle='#081321';g.fillRect(0,0,r.width,r.height);return[g,r.width,r.height]}\nfunction line(g,x,y,X,Y,col,w=1){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}\nfunction arrow(g,x,y,dx,dy,col,len){let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);line(g,x,y,X,Y,col,3);line(g,X,Y,X-9*Math.cos(a-.45),Y-9*Math.sin(a-.45),col,3);line(g,X,Y,X-9*Math.cos(a+.45),Y-9*Math.sin(a+.45),col,3)}\nfunction txt(g,t,x,y,col='#dbe8f7',size=14,align='center'){g.fillStyle=col;g.font=size+'px system-ui';g.textAlign=align;g.fillText(t,x,y)}\nfunction render(){let p=read(),sg=Math.sign(p.a*p.b);$('v1').textContent=p.a.toFixed(1);$('v2').textContent=p.b.toFixed(1);$('vd').textContent=p.d.toFixed(2);$('force').textContent=force(p).toFixed(2)+' μN/m';$('direction').textContent=sg>0?'인력: 서로 가까워지는 방향':sg\u003c0?'척력: 서로 멀어지는 방향':'자기력 없음';$('compare').textContent=saved.map((v,i)=>['A','B'][i]+': '+(v?force(v).toFixed(2)+' μN/m (d='+v.d+' m)':'미저장')).join(' | ');let [g,w,h]=setup('scene'),gap=Math.min(w*.67, w*(.28+1.3*p.d)),cy=h*.5,xs=[w/2-gap/2,w/2+gap/2];for(let [i,x] of xs.entries()){let I=i?p.b:p.a;let gr=g.createLinearGradient(x-10,0,x+10,0);gr.addColorStop(0,'#87502c');gr.addColorStop(.48,'#f5c59a');gr.addColorStop(1,'#92512b');g.fillStyle=gr;g.fillRect(x-10,45,20,h-100);if(I){arrow(g,x,cy,0,-Math.sign(I),'#ffc576',58);for(let y of [cy-75,cy,cy+75]){g.beginPath();g.ellipse(x,y,34,11,0,0,2*Math.PI);g.strokeStyle='#3c79ab';g.lineWidth=1.5;g.stroke();arrow(g,x,y+11,-Math.sign(I),0,'#629fc8',12)}}txt(g,'I'+(i?'₂':'₁')+' = '+I+' A',x,25);if(sg)arrow(g,x,cy+29,sg*(i?-1:1),0,'#5ce9a8',Math.min(45,gap*.35));}line(g,xs[0],h-32,xs[1],h-32,'#9bb4c8');txt(g,'d = '+p.d.toFixed(2)+' m',w/2,h-12);txt(g,sg>0?'인력':sg\u003c0?'척력':'힘 없음',w/2,cy-22,'#6feab5',16);\nlet [j,W,H]=setup('graph'),l=54,r=W-15,t=22,b=H-38,X=x=>l+(x-.02)/.28*(r-l),Y=y=>b-y/360*(b-t);for(let k=0;k\u003c=4;k++){line(j,l,Y(k*90),r,Y(k*90),'#2b4359');txt(j,k*90,l-5,Y(k*90)+4,'#a9c4d9',11,'right');let x=.02+.07*k;txt(j,x.toFixed(2),X(x),b+15,'#a9c4d9',11)}line(j,l,t,l,b,'#a9c4d9');line(j,l,b,r,b,'#a9c4d9');txt(j,'μN/m',l,13,'#a9c4d9',11);txt(j,'거리 (m)',W/2,H-6,'#a9c4d9',11);for(let [q,col] of [[saved[0],'#fbc36a'],[saved[1],'#f093d0'],[p,'#64e5cd']]){if(!q)continue;j.beginPath();for(let i=0;i\u003c=180;i++){let d=.02+.28*i/180,x=X(d),y=Y(force({...q,d}));i?j.lineTo(x,y):j.moveTo(x,y)}j.strokeStyle=col;j.lineWidth=2;j.stroke();j.fillStyle=col;j.beginPath();j.arc(X(q.d),Y(force(q)),4,0,2*Math.PI);j.fill()}}\nfor(let id of ['i1','i2','d'])$(id).oninput=render;$('reverse').onclick=()=>{$('i2').value=-read().b;render()};$('reset').onclick=()=>{$('i1').value=3;$('i2').value=3;$('d').value=.1;saved=[null,null];render()};$('a').onclick=()=>{saved[0]=read();render()};$('b').onclick=()=>{saved[1]=read();render()};window.addEventListener('resize',render);render();\n\u003c/script>\u003c/html>","\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>5번 실험실 · 자기장과 자기력\u003c/title>\n\u003cstyle>\n:root{font-family:system-ui,-apple-system,\"Noto Sans KR\",sans-serif;color:#e9f3ff;background:#091523}*{box-sizing:border-box}body{margin:0}header{padding:23px max(18px,calc((100vw - 1240px)/2));background:linear-gradient(125deg,#12315b,#12253e 65%,#113b42);border-bottom:1px solid #335676}h1{margin:0;font-size:clamp(23px,4vw,36px)}header p{margin:8px 0 0;color:#bad4ea}.shell{max-width:1240px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px}.panel{background:#13253a;border:1px solid #35516d;border-radius:16px;padding:18px}.panel h2{margin:0 0 12px;font-size:19px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,.actions button{background:#223d5c;border:1px solid #4f7292;color:#eaf5ff;border-radius:9px;padding:10px 13px;font-size:15px;cursor:pointer}.tabs button[aria-selected=true],.actions button.primary{background:#087bba;border-color:#3cbfff;color:white}.tabs button:focus-visible,.actions button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f6cc5b;outline-offset:2px}.control{margin:15px 0}.control label{display:flex;justify-content:space-between;gap:12px;font-weight:600}.control output{color:#7fe6f7;white-space:nowrap}.control input[type=range]{width:100%;accent-color:#43c9e3;margin:10px 0 0}.choice{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.choice select{font:inherit;background:#203954;color:#fff;border:1px solid #6685a1;border-radius:8px;padding:9px;width:100%}.fieldnote{font-size:13px;line-height:1.5;color:#b9d0e4;margin:12px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.stage{min-width:0}.canvasbox{position:relative;background:#081625;border-radius:12px;overflow:hidden;border:1px solid #42617e}.canvasbox canvas{width:100%;height:auto;display:block;touch-action:none}.legend{display:flex;gap:16px;flex-wrap:wrap;color:#d3e7fa;font-size:13px;margin:11px 0}.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px}.readings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.reading{background:#0c1e31;padding:11px;border-radius:10px;min-width:0}.reading span{display:block;color:#acc9e1;font-size:12px}.reading strong{font-size:clamp(14px,2.2vw,21px);overflow-wrap:anywhere}.explain{background:#102d39;border-left:4px solid #48d8ce;padding:12px;line-height:1.65;border-radius:6px}.prediction{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}.prediction select,.prediction button{background:#203954;border:1px solid #6685a1;color:#fff;border-radius:7px;padding:8px;font:inherit}.prediction button{cursor:pointer}.prediction #guessResult{flex-basis:100%;color:#ffdf88}.chart{width:100%;max-width:100%;height:160px;border-radius:10px;background:#0c1e31;margin-top:12px}details{line-height:1.7;margin-top:15px}summary{cursor:pointer;color:#a8e9fd;font-weight:700}.lesson{grid-column:1/-1}.lesson ol{padding-left:23px;line-height:1.7}.hidden{display:none!important}@media(max-width:810px){.shell{grid-template-columns:1fr}.lesson{grid-column:auto}}@media(max-width:480px){.shell{padding:10px;gap:10px}.panel{padding:13px}.readings{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>05 · 자기장과 자기력 실험실\u003c/h1>\u003cp>자기장 방향과 전하·전류의 방향을 바꾸고 힘의 방향을 예측해 보세요.\u003c/p>\u003c/header>\n\u003cmain class=\"shell\">\u003csection class=\"panel\" aria-label=\"조작판\">\u003cdiv class=\"tabs\" role=\"tablist\">\u003cbutton id=\"particleTab\" role=\"tab\" aria-selected=\"true\" aria-controls=\"particleControls\">움직이는 전하\u003c/button>\u003cbutton id=\"wireTab\" role=\"tab\" aria-selected=\"false\" aria-controls=\"wireControls\">전류가 흐르는 도선\u003c/button>\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"b\">자기장 세기 B \u003coutput id=\"bOut\">\u003c/output>\u003c/label>\u003cinput id=\"b\" type=\"range\" min=\"0\" max=\"2\" step=\"0.05\" value=\"0.8\">\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"bdir\">자기장 방향\u003c/label>\u003cdiv class=\"choice\">\u003cselect id=\"bdir\" aria-label=\"자기장 방향\">\u003coption value=\"-1\">종이 안쪽 ⊗ (−z)\u003c/option>\u003coption value=\"1\">종이 바깥쪽 ⊙ (+z)\u003c/option>\u003c/select>\u003cspan class=\"fieldnote\">⊗ 꼬리 / ⊙ 화살촉\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv id=\"particleControls\" role=\"tabpanel\" aria-labelledby=\"particleTab\">\u003cdiv class=\"control\">\u003clabel for=\"charge\">전하 q\u003c/label>\u003cselect id=\"charge\">\u003coption value=\"1\">양전하 +1 C\u003c/option>\u003coption value=\"-1\">음전하 −1 C\u003c/option>\u003coption value=\"0\">중성 0 C\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"mass\">입자 질량 m \u003coutput id=\"massOut\">\u003c/output>\u003c/label>\u003cinput id=\"mass\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"speed\">속력 v \u003coutput id=\"speedOut\">\u003c/output>\u003c/label>\u003cinput id=\"speed\" type=\"range\" min=\"0\" max=\"6\" step=\"0.1\" value=\"3\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"theta\">v와 B의 각 θ \u003coutput id=\"thetaOut\">\u003c/output>\u003c/label>\u003cinput id=\"theta\" type=\"range\" min=\"0\" max=\"90\" step=\"1\" value=\"90\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"heading\">화면 위 속도 방향 \u003coutput id=\"headingOut\">\u003c/output>\u003c/label>\u003cinput id=\"heading\" type=\"range\" min=\"0\" max=\"360\" step=\"5\" value=\"0\">\u003c/div>\u003c/div>\n\u003cdiv id=\"wireControls\" role=\"tabpanel\" aria-labelledby=\"wireTab\" class=\"hidden\">\u003cdiv class=\"control\">\u003clabel for=\"current\">전류 방향\u003c/label>\u003cselect id=\"current\">\u003coption value=\"1\">양의 방향 (화살표)\u003c/option>\u003coption value=\"-1\">반대 방향 (화살표 역전)\u003c/option>\u003coption value=\"0\">전류 0 A\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"amps\">전류 I \u003coutput id=\"ampsOut\">\u003c/output>\u003c/label>\u003cinput id=\"amps\" type=\"range\" min=\"0\" max=\"5\" step=\"0.1\" value=\"2\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"length\">자기장 안 도선 길이 ℓ \u003coutput id=\"lengthOut\">\u003c/output>\u003c/label>\u003cinput id=\"length\" type=\"range\" min=\"0.5\" max=\"4\" step=\"0.1\" value=\"2\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"wireTheta\">도선과 B의 각 θ \u003coutput id=\"wireThetaOut\">\u003c/output>\u003c/label>\u003cinput id=\"wireTheta\" type=\"range\" min=\"0\" max=\"90\" step=\"1\" value=\"90\">\u003c/div>\u003cdiv class=\"control\">\u003clabel for=\"wireHeading\">화면 위 도선 방향 \u003coutput id=\"wireHeadingOut\">\u003c/output>\u003c/label>\u003cinput id=\"wireHeading\" type=\"range\" min=\"0\" max=\"360\" step=\"5\" value=\"0\">\u003c/div>\u003c/div>\n\u003cp class=\"fieldnote\">단위는 관계를 살피기 위한 모형값입니다. 입자 질량 1 kg, 전하 1 C는 실제 전자·양성자 값을 뜻하지 않습니다.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"start\" class=\"primary\">▶ 시작\u003c/button>\u003cbutton id=\"pause\">Ⅱ 일시정지\u003c/button>\u003cbutton id=\"reset\">↺ 초기화\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"panel stage\">\u003ch2 id=\"stageTitle\">입자 궤적 · 화면으로 본 투영\u003c/h2>\u003cdiv class=\"canvasbox\">\u003ccanvas id=\"scene\" width=\"800\" height=\"490\" aria-label=\"입자 또는 도선과 자기력의 시뮬레이션\">\u003c/canvas>\u003c/div>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"sw\" style=\"background:#ffdd66\">\u003c/i>입자/도선\u003c/span>\u003cspan>\u003ci class=\"sw\" style=\"background:#3de4ad\">\u003c/i>속도/전류\u003c/span>\u003cspan>\u003ci class=\"sw\" style=\"background:#fb7185\">\u003c/i>자기력\u003c/span>\u003cspan>\u003ci class=\"sw\" style=\"background:#7796fa\">\u003c/i>지난 궤적\u003c/span>\u003c/div>\u003cdiv class=\"readings\">\u003cdiv class=\"reading\">\u003cspan>자기력 크기\u003c/span>\u003cstrong id=\"fRead\">\u003c/strong>\u003c/div>\u003cdiv class=\"reading\">\u003cspan id=\"secondLabel\">원운동 반지름\u003c/span>\u003cstrong id=\"rRead\">\u003c/strong>\u003c/div>\u003cdiv class=\"reading\">\u003cspan id=\"thirdLabel\">운동 상태\u003c/span>\u003cstrong id=\"stateRead\">\u003c/strong>\u003c/div>\u003cdiv class=\"reading\">\u003cspan id=\"periodLabel\">회전 주기\u003c/span>\u003cstrong id=\"periodRead\">\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"explain\" id=\"explain\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"prediction\">\u003clabel for=\"guess\">실행 전 빨간 힘 화살표 방향을 예측하세요: \u003c/label>\u003cselect id=\"guess\">\u003coption value=\"\">방향 선택\u003c/option>\u003coption value=\"right\">오른쪽 →\u003c/option>\u003coption value=\"upRight\">오른쪽 위 ↗\u003c/option>\u003coption value=\"up\">위쪽 ↑\u003c/option>\u003coption value=\"upLeft\">왼쪽 위 ↖\u003c/option>\u003coption value=\"left\">왼쪽 ←\u003c/option>\u003coption value=\"downLeft\">왼쪽 아래 ↙\u003c/option>\u003coption value=\"down\">아래쪽 ↓\u003c/option>\u003coption value=\"downRight\">오른쪽 아래 ↘\u003c/option>\u003coption value=\"none\">힘 없음 (0 N)\u003c/option>\u003c/select>\u003cbutton id=\"checkGuess\">예측 확인\u003c/button>\u003cspan id=\"guessResult\" role=\"status\">\u003c/span>\u003c/div>\u003ccanvas id=\"graph\" class=\"chart\" width=\"720\" height=\"170\" aria-label=\"각도에 따른 자기력 그래프\">\u003c/canvas>\u003cdetails>\u003csummary>공식과 방향을 함께 보기\u003c/summary>\u003cp>전하: \u003cb>F⃗ = q(v⃗ × B⃗)\u003c/b>, 크기 \u003cb>|F| = |q|vB sin θ\u003c/b>. 수직으로 입사할 때 \u003cb>r = mv/(|q|B)\u003c/b>. 비스듬히 입사하면 실제 궤적은 자기장 방향을 축으로 하는 나선이고, 화면에는 원 모양의 투영이 보입니다. 투영 반지름은 \u003cb>mv sin θ/(|q|B)\u003c/b>입니다. 회전 주기 \u003cb>T = 2πm/(|q|B)\u003c/b>입니다.\u003c/p>\u003cp>도선: \u003cb>F⃗ = I(ℓ⃗ × B⃗)\u003c/b>, 크기 \u003cb>|F| = IℓB sin θ\u003c/b>. ℓ⃗ 은 전류 방향입니다. 화면의 화살표는 오른쪽·위쪽을 각각 +x·+y로 나타냅니다.\u003c/p>\u003cp>자기력은 속도와 직각이므로 이 이상화된 모형에서는 입자 속력 자체를 바꾸지 않습니다. θ=0°이면 힘이 0이며, 입자는 화면 깊이 방향으로 직진합니다.\u003c/p>\u003c/details>\u003c/section>\n\u003csection class=\"panel lesson\">\u003ch2>수업 활동 · 예측 → 조작 → 설명 (15분)\u003c/h2>\u003col>\u003cli>양전하를 오른쪽으로 보내고 자기장을 종이 안쪽으로 놓으세요. 힘이 어느 방향인지 먼저 예상한 뒤 빨간 화살표를 확인하세요.\u003c/li>\u003cli>전하 부호와 자기장 방향을 각각 한 번씩 바꾸세요. 힘과 궤적은 어떻게 달라지나요?\u003c/li>\u003cli>θ를 90°에서 0°로 낮춰 힘 그래프와 궤적을 비교하세요. 속력 v를 바꾸면 힘과 화면상 반지름은 각각 어떻게 변하나요?\u003c/li>\u003cli>도선 모드에서 전류를 뒤집고 자기장도 뒤집으세요. 힘이 다시 같은 방향을 향하는 까닭을 벡터곱으로 설명하세요.\u003c/li>\u003c/ol>\u003c/section>\u003c/main>\n\u003cscript>\n(()=>{'use strict';const $=id=>document.getElementById(id),ids=['b','bdir','charge','mass','speed','theta','heading','current','amps','length','wireTheta','wireHeading'];let mode='particle',running=false,time=0,last=0,trace=[],raf=0;const scene=$('scene'),ctx=scene.getContext('2d'),graph=$('graph').getContext('2d');function val(id){return +$(id).value}function fmt(v,n=2){return Number(v).toFixed(n)}function read(){const B=val('b'),bs=val('bdir'),q=val('charge'),m=val('mass'),v=val('speed'),a=val('theta')*Math.PI/180,h=val('heading')*Math.PI/180,I=val('amps')*Math.abs(val('current')),L=val('length'),wa=val('wireTheta')*Math.PI/180,wh=val('wireHeading')*Math.PI/180;return {B,bs,q,m,v,a,h,I,L,wa,wh,s:Math.sin(a),ws:Math.sin(wa),vp:v*Math.sin(a),vz:bs*v*Math.cos(a),F:Math.abs(q)*v*B*Math.sin(a),FW:I*L*B*Math.sin(wa)}}\nfunction display(){const p=read();for(const [id,out,unit] of [['b','bOut',' T'],['mass','massOut',' kg'],['speed','speedOut',' m/s'],['theta','thetaOut','°'],['heading','headingOut','°'],['amps','ampsOut',' A'],['length','lengthOut',' m'],['wireTheta','wireThetaOut','°'],['wireHeading','wireHeadingOut','°']])$(out).textContent=val(id).toFixed(['theta','heading','wireTheta','wireHeading'].includes(id)?0:1)+unit;\nconst part=mode==='particle',f=part?p.F:p.FW; $('stageTitle').textContent=part?'입자 궤적 · 화면으로 본 투영':'도선과 자기력 · 방향 비교';$('fRead').textContent=fmt(f)+' N';$('secondLabel').textContent=part?'화면상 궤적 반지름':'단위 길이당 힘';$('thirdLabel').textContent=part?'운동 상태':'전류 세기';const radius=p.q&&p.B&&p.vp>1e-9?p.m*p.vp/(Math.abs(p.q)*p.B):null;$('rRead').textContent=part?(radius===null?'—':fmt(radius)+' m'):(fmt(p.I*p.B*p.ws)+' N/m');$('stateRead').textContent=part?(p.v===0?'정지':!p.q||!p.B||p.s\u003c1e-9?'직진':Math.abs(p.vz)>1e-8?'나선 운동':'원운동'):(fmt(p.I)+' A');$('periodLabel').textContent=part?'회전 주기 T':'도선 각도';$('periodRead').textContent=part?(p.q&&p.B&&p.vp>1e-9?fmt(2*Math.PI*p.m/(Math.abs(p.q)*p.B))+' s':'—'):(fmt(p.wa*180/Math.PI,0)+'°');\nlet msg;if(part){if(!p.v)msg='속력이 0이므로 자기력은 0 N이고 입자는 정지합니다.';else if(!p.q||!p.B)msg='전하 또는 자기장이 0이면 자기력은 0 N입니다. 입자는 직진합니다.';else if(p.s\u003c1e-9)msg='v ∥ B: 자기력 0 N. 입자는 종이 앞뒤 방향으로 곧게 움직이므로 화면상 위치는 그대로입니다.';else msg=`|F| = |q|vB sin θ = ${fmt(p.F)} N. ${Math.abs(p.vz)>1e-8?'실제로는 나선 운동이고 화면에는 원의 투영이 보입니다.':'속도에 수직인 힘이 방향만 바꿔 원운동합니다.'}`}else msg=p.I&&p.B&&p.ws>1e-9?`|F| = IℓB sin θ = ${fmt(p.FW)} N. 초록 화살표가 전류, 빨간 화살표가 자기력 방향입니다.`:'전류, 자기장 또는 도선의 수직 성분이 0이어서 자기력이 0 N입니다.';const labels={right:'오른쪽',upRight:'오른쪽 위',up:'위쪽',upLeft:'왼쪽 위',left:'왼쪽',downLeft:'왼쪽 아래',down:'아래쪽',downRight:'오른쪽 아래',none:'없음'};msg+=' 현재 화면상 자기력 방향: '+labels[direction(part?p.h-p.q*p.bs*p.B/p.m*time:undefined)]+'.';$('explain').textContent=msg; draw(p,radius);plot(p)}\nfunction arrow(x,y,dx,dy,color,label){let d=Math.hypot(dx,dy);if(d\u003c1e-8)return;ctx.save();ctx.strokeStyle=ctx.fillStyle=color;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.stroke();let ang=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx-13*Math.cos(ang-.5),y+dy-13*Math.sin(ang-.5));ctx.lineTo(x+dx-13*Math.cos(ang+.5),y+dy-13*Math.sin(ang+.5));ctx.fill();ctx.font='bold 17px system-ui';ctx.fillText(label,x+dx+8,y+dy-6);ctx.restore()}\nfunction state(p){const omega=-p.q*p.bs*p.B/p.m;const phase=p.h+omega*time;const vx=p.vp*Math.cos(phase),vy=p.vp*Math.sin(phase);if(Math.abs(omega)\u003c1e-9)return {x:p.vp*Math.cos(p.h)*time,y:p.vp*Math.sin(p.h)*time,vx,vy};return {x:p.vp/omega*(Math.sin(phase)-Math.sin(p.h)),y:-p.vp/omega*(Math.cos(phase)-Math.cos(p.h)),vx,vy}}\nfunction draw(p,r){const w=scene.width,h=scene.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#081625';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#19324b';ctx.lineWidth=1;for(let x=20;x\u003cw;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=20;y\u003ch;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#6486aa';ctx.font='19px system-ui';for(let y=52;y\u003ch;y+=105)for(let x=48;x\u003cw;x+=110)ctx.fillText(p.bs\u003c0?'⊗':'⊙',x,y);ctx.fillStyle='#aec6dd';ctx.font='15px system-ui';ctx.fillText('B '+(p.bs\u003c0?'종이 안쪽 ⊗':'종이 바깥쪽 ⊙')+'   '+fmt(p.B,1)+' T',20,29);\nif(mode==='particle'){const px=68,ox=145,oy=h/2,st=state(p),x=ox+st.x*px,y=oy-st.y*px;ctx.strokeStyle='#7796fa';ctx.lineWidth=3;ctx.beginPath();let first=true;for(let point of trace){const tx=ox+point.x*px,ty=oy-point.y*px;if(first){ctx.moveTo(tx,ty);first=false}else ctx.lineTo(tx,ty)}ctx.stroke();ctx.fillStyle='#ffdd66';ctx.beginPath();ctx.arc(x,y,11,0,2*Math.PI);ctx.fill();ctx.fillStyle='#192739';ctx.font='bold 14px system-ui';ctx.fillText(p.q>0?'+':p.q\u003c0?'−':'0',x-5,y+5);if(Math.hypot(st.vx,st.vy)>1e-8){const vd=48/Math.hypot(st.vx,st.vy);arrow(x,y,st.vx*vd,-st.vy*vd,'#3de4ad','v⊥')}const fx=p.q*p.bs*p.B*st.vy,fy=-p.q*p.bs*p.B*st.vx,fd=Math.hypot(fx,fy);if(fd>1e-8)arrow(x,y,65*fx/fd,-65*fy/fd,'#fb7185','F');if(p.a\u003cMath.PI/2-.001&&p.v>0){ctx.fillStyle='#d9c9fa';ctx.font='14px system-ui';ctx.fillText((p.vz\u003c0?'종이 안쪽':'종이 바깥쪽')+' 속도 '+fmt(Math.abs(p.vz))+' m/s',20,h-20)}if(x\u003c0||x>w||y\u003c0||y>h){ctx.fillStyle='#ffe29c';ctx.font='bold 17px system-ui';ctx.fillText('입자가 화면을 벗어났습니다 · 초기화 또는 조건을 변경하세요',100,h-23)}if(r!==null&&r*px>0&&r*px\u003c110){ctx.fillStyle='#bdc9fa';ctx.font='13px system-ui';ctx.fillText('화면 눈금: 1 m = 68 px',w-190,h-20)}}else{const ox=w/2,oy=h/2,unit={x:Math.cos(p.wh),y:-Math.sin(p.wh)},sign=Math.sign(val('current')),span=155*p.ws;ctx.lineWidth=17;ctx.lineCap='round';ctx.strokeStyle='#ffdd66';ctx.beginPath();ctx.moveTo(ox-unit.x*span/2,oy-unit.y*span/2);ctx.lineTo(ox+unit.x*span/2,oy+unit.y*span/2);ctx.stroke();if(span\u003c1){ctx.fillStyle='#ffdd66';ctx.beginPath();ctx.arc(ox,oy,8,0,7);ctx.fill()}if(sign&&span>1)arrow(ox-unit.x*37*sign,oy-unit.y*37*sign,unit.x*75*sign,unit.y*75*sign,'#3de4ad','I');let fx=sign*p.bs*Math.sin(p.wh),fy=sign*p.bs*Math.cos(p.wh);let fmag=Math.hypot(fx,fy);if(p.FW>1e-9&&fmag)arrow(ox,oy,fx*100/fmag,fy*100/fmag,'#fb7185','F');ctx.font='15px system-ui';ctx.fillStyle='#d6e7fa';ctx.fillText('길이 ℓ = '+fmt(p.L,1)+' m · 화면 위 방향은 수직 성분의 투영',20,h-20)} }\nfunction plot(p){const w=graph.canvas.width,h=graph.canvas.height;graph.clearRect(0,0,w,h);graph.fillStyle='#0c1e31';graph.fillRect(0,0,w,h);const l=58,b=h-30,t=20,right=w-22,max=mode==='particle'?Math.abs(p.q)*p.v*p.B:p.I*p.L*p.B,angle=mode==='particle'?p.a:p.wa;graph.strokeStyle='#66849e';graph.lineWidth=1.5;graph.beginPath();graph.moveTo(l,t);graph.lineTo(l,b);graph.lineTo(right,b);graph.stroke();graph.fillStyle='#c6dcf0';graph.font='13px system-ui';graph.fillText('|F| (N)',8,18);graph.fillText('0°',l-5,h-10);graph.fillText('90°',right-24,h-10);graph.fillText('θ',right+4,h-10);graph.fillText(fmt(max)+' N',l+5,t+3);graph.strokeStyle='#44e2c2';graph.lineWidth=3;graph.beginPath();for(let i=0;i\u003c=90;i++){const x=l+(right-l)*i/90,y=b-(max>0?(b-t-8)*Math.sin(i*Math.PI/180):0);i?graph.lineTo(x,y):graph.moveTo(x,y)}graph.stroke();const x=l+(right-l)*angle/(Math.PI/2),y=b-(max>0?(b-t-8)*Math.sin(angle):0);graph.fillStyle='#ffdd66';graph.beginPath();graph.arc(x,y,6,0,7);graph.fill()}\nfunction clearMotion(){time=0;trace=[];last=0;$('guessResult').textContent='';display()}function direction(phase){const p=read();let fx,fy;if(mode==='particle'){if(p.F\u003c1e-9)return 'none';fx=p.q*p.bs*Math.sin(phase??p.h);fy=-p.q*p.bs*Math.cos(phase??p.h)}else{if(p.FW\u003c1e-9)return 'none';const sign=Math.sign(val('current'));fx=sign*p.bs*Math.sin(p.wh);fy=-sign*p.bs*Math.cos(p.wh)}const keys=['right','upRight','up','upLeft','left','downLeft','down','downRight'];return keys[((Math.round(Math.atan2(fy,fx)/(Math.PI/4))%8)+8)%8]}$('checkGuess').addEventListener('click',()=>{const d=direction(),a=$('guess').value;$('guessResult').textContent=!a?'먼저 방향을 선택하세요.':a===d?'정답입니다! 힘의 방향과 부호를 설명해 보세요.':'다시 생각해 보세요. 전하 또는 전류의 부호와 자기장 방향을 확인하세요.'});\nfor(let id of ids){$(id).addEventListener('input',clearMotion);$(id).addEventListener('change',clearMotion)}for(let [tab,m] of [['particleTab','particle'],['wireTab','wire']])$(tab).addEventListener('click',()=>{mode=m;$('particleTab').setAttribute('aria-selected',String(m==='particle'));$('wireTab').setAttribute('aria-selected',String(m==='wire'));$('particleControls').classList.toggle('hidden',m!=='particle');$('wireControls').classList.toggle('hidden',m!=='wire');clearMotion()});$('start').addEventListener('click',()=>{if(!running){running=true;last=0;raf=requestAnimationFrame(tick)}});$('pause').addEventListener('click',()=>{running=false;last=0;cancelAnimationFrame(raf);raf=0});$('reset').addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);raf=0;clearMotion()});function tick(ts){if(!running)return;if(last){time+=Math.min((ts-last)/1000,.05);if(mode==='particle'){trace.push(state(read()));if(trace.length>1600)trace.shift()}}last=ts;display();raf=requestAnimationFrame(tick)}display();})();\n\u003c/script>\u003cstyle>\n/* Independent fixed teaching tabs; original experiment logic is unchanged. */\nhtml,body{background:#080d15!important;color-scheme:dark}\nbody.wlab-ready{margin:0;overflow-x:hidden}\n.wlab-root{display:block!important;width:100%!important;max-width:none!important;margin:0!impor
