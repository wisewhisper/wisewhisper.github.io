<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전기력·전기장·전위 통합 실험실</title><style>
:root{color-scheme:dark;--bg:#070c15;--panel:#101b2b;--line:#293b52;--ink:#e9f2ff;--muted:#a7bad0;--cyan:#66e6f4;--amber:#ffc76b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px}h1{font-size:clamp(17px,2vw,25px);margin:0}h2{font-size:18px;margin:0 0 8px}button,input,select{font:inherit}button,select{background:#20324a;color:var(--ink);border:1px solid #41566f;border-radius:8px;padding:8px 11px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--cyan)}button[aria-selected=true],button.on{background:#10566c;border-color:#68d9e7}button:disabled{opacity:.45;cursor:not-allowed}nav{display:flex;gap:5px;padding:0 12px 8px;overflow:auto;scrollbar-width:thin}nav button{white-space:nowrap}main{display:grid;grid-template-columns:minmax(225px,25%) minmax(0,1fr);gap:9px;padding:0 12px;min-height:0}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;min-width:0}.controls{overflow:auto;max-height:calc(100dvh - 130px)}.stage{display:flex;flex-direction:column;gap:8px;min-height:0}.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.row>*{min-width:0}.field{margin:7px 0}.field label{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted)}.field output{color:var(--cyan);font-weight:700}.field input{width:100%;accent-color:var(--cyan);height:20px}.scene{position:relative;background:#081525;border:1px solid var(--line);border-radius:9px;min-height:230px;height:clamp(250px,calc(100dvh - 260px),650px);overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:5px}.meter{padding:6px 8px;background:#16273b;border-radius:8px;min-width:0}.meter small{display:block;color:var(--muted)}.meter b{display:block;color:var(--cyan);font-size:clamp(13px,1.4vw,19px);overflow-wrap:anywhere}.note{color:var(--muted);font-size:12px;margin:0}.status{color:#ffe0a1;min-height:1.5em;font-size:13px}.textpanel{max-width:1000px;line-height:1.8}.textpanel h3{color:var(--cyan);margin-bottom:3px}.textpanel p{margin-top:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left}footer{font-size:11px;color:#9aafc6;text-align:center;padding:7px}a{color:inherit} [hidden]{display:none!important}.check{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}.check input{accent-color:var(--cyan)}@media(max-width:680px){header{padding:8px}main{display:flex;flex-direction:column;padding:0 7px}.controls{max-height:none;order:2}.stage{order:1}.scene{height:clamp(245px,42dvh,400px)}.meters{grid-template-columns:repeat(2,minmax(0,1fr))}nav{padding:0 7px 6px}.panel{padding:9px}.field{margin:5px 0}}
</style></head><body><header><h1>⚡ 전기력·전기장·전위 통합 실험실</h1><button id="full">⛶ 전체화면</button></header><nav id="tabs" role="tablist" aria-label="실험 선택"></nav><main><aside class="panel controls" id="controls"></aside><section class="panel stage" id="stage"><h2 id="heading"></h2><div id="scene" class="scene"><canvas id="canvas" aria-label="전기력과 전기장 시뮬레이션"></canvas></div><div id="meters" class="meters"></div><div class="status" id="status" aria-live="polite"></div><p class="note" id="hint"></p><div id="details" hidden></div></section></main><footer>© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer>
<script>
'use strict';
const K=8.9875517923e9, X=1.2,Y=.72,CORE=.018, $=id=>document.getElementById(id), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), fmt=(x,n=3)=>!Number.isFinite(x)?'—':Math.abs(x)>=10000||(Math.abs(x)<.01&&x!==0)?x.toExponential(2):Number(x.toFixed(n)).toString();
const modes=[['force','쿨롱 힘'],['map','전기장·전위'],['terrain','전위 지형'],['motion','하전 입자 운동'],['induction','정전기 유도'],['graphs','그래프·비교'],['concept','개념 설명']];
let ended=false,mode='force', lastExperiment='force',running=false,t=0,last=0,drag=null,dirty=true,notice='',saved={A:null,B:null},graphType='force',axisMax=1,axisLock=false;
const defaults=()=>({q1:2,q2:-3,r:.5,m1:.1,m2:.1,free:false,charges:[{x:-.25,y:0,q:2},{x:.25,y:0,q:-2}],probe:{x:0,y:0},selected:0,test:1,add:'probe',map:true,lines:true,arrows:false,contours:true,E:2000,qt:-2,m:10,vx:0.12,vy:0,angle:90,rod:1,phase:0});
let s=defaults(),p1,p2,p,trail=[];const c=$('canvas'),g=c.getContext('2d');let w=1,h=1,dpr=1,S=1,ox=0,oy=0;
function field(x,y,charges=s.charges){let ex=0,ey=0,V=0,near=false;for(const a of charges){if(!a.q)continue;const dx=x-a.x,dy=y-a.y,r=Math.hypot(dx,dy);if(r<CORE)near=true;const z=Math.max(CORE,r),k=K*a.q*1e-9;V+=k/z;ex+=k*dx/z**3;ey+=k*dy/z**3}return {ex,ey,V,E:Math.hypot(ex,ey),near}}
function force(q1,q2,r){return K*q1*q2*1e-12/r**2}
function resetMotion(){running=false;ended=false;t=0;p1={x:-s.r/2,v:0};p2={x:s.r/2,v:0};p={x:-.48,y:0,vx:s.vx,vy:s.vy};trail=[{x:p.x,y:p.y}];notice='준비 · 시작을 눌러 관찰하세요.';dirty=true}
resetMotion();
function setMode(m){if(m===mode)return;running=false;const previous=mode;mode=m;if(['force','motion','map'].includes(m)&&previous!==m){resetMotion();ended=false;if(m==='map'){p={x:s.probe.x,y:s.probe.y,vx:0,vy:0};trail=[];}}if(!['graphs','concept'].includes(m))lastExperiment=m;else if(m==='graphs')graphType=lastExperiment==='force'?'force':lastExperiment==='motion'?'motion':'map';notice='';build();dirty=true}
for(const [id,label] of modes){const b=document.createElement('button');b.textContent=label;b.dataset.mode=id;b.setAttribute('role','tab');b.onclick=()=>setMode(id);$('tabs').append(b)}
$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(a=>a[0]===mode),n=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;setMode(modes[n][0]);$('tabs').children[n].focus()});
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
function slider(id,label,min,max,step,unit){return '<div class="field"><label for="'+id+'">'+label+'<output id="'+id+'out">'+fmt(s[id])+' '+unit+'</output></label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>'}
function btn(id,label){return '<button id="'+id+'">'+label+'</button>'}
function check(id,label){return '<label class="check"><input type="checkbox" id="'+id+'" '+(s[id]?'checked':'')+'>'+label+'</label>'}
function select(id,opts,val){return '<select id="'+id+'">'+opts.map(a=>'<option value="'+a[0]+'" '+(String(a[0])===String(val)?'selected':'')+'>'+a[1]+'</option>').join('')+'</select>'}
function bind(id,f,event='click'){const e=$(id);if(e)e.addEventListener(event,f)}
function preset(type){running=false;t=0;ended=false;trail=[];const sets={dipole:[{x:-.25,y:0,q:2},{x:.25,y:0,q:-2}],same:[{x:-.25,y:0,q:2},{x:.25,y:0,q:2}],single:[{x:0,y:0,q:2}]};s.charges=sets[type];s.probe=type==='single'?{x:.25,y:0}:{x:0,y:0};s.selected=0;s.add='probe';notice='전하 배치를 바꿨습니다.';build();dirty=true}
function snapshot(){return JSON.parse(JSON.stringify({s,mode:lastExperiment}))}
function save(k){saved[k]=snapshot();notice='조건 '+k+' 저장 완료';refresh();dirty=true}
function build(){for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1}const cc=$('controls'),detail=$('details');let v='<h2>실험 조건</h2>';detail.hidden=true;$('scene').hidden=false;$('meters').hidden=false;cc.hidden=false;
if(mode==='force'){v+=slider('q1','전하 q₁',-10,10,.1,'μC')+slider('q2','전하 q₂',-10,10,.1,'μC')+slider('r','중심 사이 거리',.12,1,.01,'m')+slider('m1','물체 1 질량',.02,.5,.01,'kg')+slider('m2','물체 2 질량',.02,.5,.01,'kg')+'<div class="row">'+check('free','자유 운동 모드')+'</div><div class="row">'+btn('flip','q₂ 부호 반전')+btn('double','거리 ×2')+'</div><p class="note">고정 모드: 거리 직접 조절. 자유 모드: 정지한 두 물체를 동시에 놓습니다.</p>'}
if(mode==='map'||mode==='terrain'){v+='<div class="row">'+btn('dipole','+ / −')+btn('same','+ / +')+btn('single','점전하')+'</div><p class="note">배치 선택 · 전하를 직접 드래그하거나 탐침을 이동하세요.</p><div class="row">'+select('add',[['probe','탐침 이동'],['pos','양전하 추가'],['neg','음전하 추가']],s.add)+btn('remove','선택 삭제')+'</div><div class="field"><label for="charge">선택 전하<output id="chargeout">'+fmt(s.charges[s.selected]?.q??0)+' nC</output></label><input id="charge" type="range" min="-5" max="5" step=".1" value="'+(s.charges[s.selected]?.q??0)+'" '+(!s.charges.length?'disabled':'')+'></div><div class="row">'+select('test',[['1','시험 전하 +1 nC'],['-1','시험 전하 −1 nC']],s.test)+'</div><div class="row">'+check('map','전위 지도')+check('contours','등전위선')+check('lines','전기장선')+check('arrows','벡터')+'</div><p class="note">최대 8개 전하. 지형 탭에서는 지도 탭의 배치가 유지됩니다.</p>'}
if(mode==='motion'){v+=slider('E','균일 전기장',0,10000,100,'N/C')+slider('qt','시험 전하',-5,5,.1,'μC')+slider('m','질량',1,30,1,'g')+slider('vx','초기 x 속도',-.3,.3,.01,'m/s')+slider('vy','초기 y 속도',-.3,.3,.01,'m/s')+slider('angle','전기장 각도',0,360,15,'°')+'<div class="row">'+btn('electron','음전하 편향')+btn('positive','양전하 편향')+btn('rest','정지 출발')+'</div><p class="note">교실 관찰용 가상 입자입니다. 실제 전자는 훨씬 작은 질량을 갖습니다.</p>'}
if(mode==='induction'){v+='<div class="row">'+select('rod',[['1','양전하 막대'],['-1','음전하 막대']],s.rod)+'</div><p class="note">중성 도체에 대전된 막대를 접근시켜 접지 순서를 바꾸어 보세요.</p><div class="row">'+btn('approach','① 막대 접근')+btn('ground','② 접지')+btn('detach','③ 접지 제거')+btn('away','④ 막대 제거')+'</div><p class="note">도체의 전자 이동을 나타낸 정성적 모형입니다. 기호 개수는 실제 전하량이 아닙니다.</p>'}
if(mode==='graphs'){v+='<div class="row">'+select('graphType',[['force','F–r / 1/r²'],['map','V(x) / E(x)'],['motion','변위 / 속도']],graphType)+'</div><div class="row">'+btn('lock',axisLock?'축 고정 해제':'축 고정')+btn('axisReset','축 재설정')+'</div><p class="note">A·B에 저장한 동일 종류 실험의 조건을 함께 표시합니다. 범위를 초과한 값은 잘릴 수 있습니다.</p>'}
if(mode!=='concept'){if(mode==='force'||mode==='motion')v+='<div class="row">'+btn('play','▶ 시작')+btn('restart','↺ 처음부터')+'</div>';if(mode==='map')v+='<div class="row">'+btn('play','▶ 시험전하 운동')+btn('restart','↺ 입자 초기화')+'</div>';v+='<hr style="border:0;border-top:1px solid #293b52"><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('clearAB','비교 지우기')+btn('reset','전체 초기화')+'</div>'}
if(mode==='concept'){cc.hidden=true;$('scene').hidden=true;$('meters').hidden=true;detail.hidden=false;v='';detail.className='textpanel';detail.innerHTML='<h3>1. 쿨롱 법칙</h3><p>F = k|q₁q₂|/r². 같은 부호는 척력, 다른 부호는 인력. 두 힘의 크기는 같고 방향은 반대이다. 거리 2배 → 힘 1/4. 점전하·진공 모형.</p><h3>2. 전기장과 전기력</h3><p>E = F/q₀, F⃗ = qE⃗. 전기장은 원천 전하가 만든 벡터장이다. 음전하가 받는 힘은 전기장 반대 방향. 여러 전하의 장은 벡터 합으로 계산한다.</p><h3>3. 전위와 위치에너지</h3><p>V = kQ/r, U = qV, W전기력 = q(V출발 − V도착). 전위는 스칼라이므로 부호를 포함하여 더한다. 같은 양전하의 중앙에서는 E=0, V≠0. 서로 다른 같은 크기 전하의 중앙에서는 V=0, E≠0. 등전위선과 전기장선은 수직이다.</p><h3>4. 균일한 전기장 속 운동</h3><p>a⃗=qE⃗/m, r⃗=r⃗₀+v⃗₀t+½a⃗t². 초기 속도가 전기장과 수직이면 포물선 운동을 할 수 있다. 전위 지형의 높이는 V이지 실제 공간 높이가 아니며 음전하의 U는 지형과 반대이다.</p><h3>5. 정전기 유도</h3><p>중성 도체에 대전된 막대를 가까이 하면 자유전자가 재배치된다. 접지한 뒤 접지를 먼저 끊고 막대를 제거하면 도체에 막대와 반대 부호의 순전하가 남는다. 막대를 먼저 제거하면 접지된 도체는 다시 중성이 된다. 양전하 기호는 전자 부족을 의미한다.</p><h3>탐구 질문</h3><p>① 거리 2배일 때 힘은? ② 전기장이 0인 곳에서 전위도 0인가? ③ 양·음 시험 전하의 궤적은? ④ 접지 제거 순서가 결과를 바꾸는 이유는?</p><p class="note">공통 가정: 정전기적 점전하, 진공, 가장자리 효과 무시. 점전하 중심 반경 1.8 cm는 측정 제외 영역이며, 자유 운동은 충돌 또는 경계에서 종료한다. 전기장선과 화살표는 표현용 배율이다.</p>'}
cc.innerHTML=v;for(const id of ['q1','q2','r','m1','m2','E','qt','m','vx','vy','angle'])bind(id,e=>{s[id]=+e.target.value;$(id+'out').textContent=fmt(s[id])+' '+({q1:'μC',q2:'μC',r:'m',m1:'kg',m2:'kg',E:'N/C',qt:'μC',m:'g',vx:'m/s',vy:'m/s',angle:'°'}[id]);resetMotion();refresh()},'input');
for(const id of ['free','map','contours','lines','arrows'])bind(id,e=>{s[id]=e.target.checked;if(id==='free')resetMotion();dirty=true;refresh()},'change');
for(const id of ['add','test','rod'])bind(id,e=>{s[id]=id==='add'?e.target.value:+e.target.value;if(id==='rod')s.phase=0;if(id==='test'){running=false;t=0;trail=[];p={x:s.probe.x,y:s.probe.y,vx:0,vy:0}}dirty=true;refresh()},'change');
for(const id of ['dipole','same','single'])bind(id,()=>preset(id));
bind('charge',e=>{if(!s.charges[s.selected])return;s.charges[s.selected].q=+e.target.value;$('chargeout').textContent=fmt(+e.target.value)+' nC';running=false;trail=[];dirty=true;refresh()},'input');
bind('remove',()=>{s.charges.splice(s.selected,1);s.selected=clamp(s.selected,0,Math.max(0,s.charges.length-1));running=false;trail=[];build();dirty=true});
bind('flip',()=>{s.q2=-s.q2;resetMotion();build()});bind('double',()=>{if(s.r*2>1){notice='거리 2배는 표시 범위를 초과합니다.';refresh();return}s.r*=2;resetMotion();build()});
for(const [id,q] of [['electron',-2],['positive',2],['rest',2]])bind(id,()=>{s.qt=q;s.vx=id==='rest'?0:.12;s.vy=0;s.angle=90;resetMotion();build()});
for(const [id,phase] of [['approach',1],['ground',2],['detach',3],['away',4]])bind(id,()=>{if(id==='approach'){s.phase=1}else if(id==='ground'&&s.phase===1)s.phase=2;else if(id==='detach'&&s.phase===2)s.phase=3;else if(id==='away'&&(s.phase===1||s.phase===2||s.phase===3))s.phase=s.phase===3?4:5;else{notice='먼저 앞 단계의 조작을 진행하세요.';refresh();return}notice='정전기 유도 단계 '+s.phase;dirty=true;refresh()});
bind('play',()=>{if(running){running=false;notice='일시정지';refresh();return}if(mode==='force'&&!s.free){s.free=true;resetMotion();build()}if(mode==='map'&&(!trail.length||t===0)){p={x:s.probe.x,y:s.probe.y,vx:0,vy:0};trail=[{x:p.x,y:p.y}];t=0}if(ended){if(mode==='map'){p={x:s.probe.x,y:s.probe.y,vx:0,vy:0};trail=[{x:p.x,y:p.y}];t=0}else resetMotion();ended=false}running=true;notice='운동 중';refresh()});
bind('restart',()=>{resetMotion();ended=false;if(mode==='map'){p={x:s.probe.x,y:s.probe.y,vx:0,vy:0};trail=[]}refresh()});bind('reset',()=>{s=defaults();saved={A:null,B:null};axisMax=1;axes={force:[1,1],map:[1,1],motion:[1,1]};axisLock=false;ended=false;resetMotion();trail=[];build()});bind('saveA',()=>save('A'));bind('saveB',()=>save('B'));bind('clearAB',()=>{saved={A:null,B:null};notice='비교 기록 삭제';dirty=true;refresh()});bind('graphType',e=>{graphType=e.target.value;axisMax=1;axes[graphType]=[1,1];axisLock=false;build();dirty=true},'change');bind('lock',()=>{axisLock=!axisLock;build()});bind('axisReset',()=>{axisMax=1;axes[graphType]=[1,1];axisLock=false;build();dirty=true});refresh();resize()}

let axes={force:[1,1],map:[1,1],motion:[1,1]};function drawGraphs(){g.fillStyle='#081525';g.fillRect(0,0,w,h);const names=[{s,color:'#65e5f0'},...['A','B'].filter(k=>saved[k]&&(graphType==='force'?saved[k].mode==='force':graphType==='motion'?saved[k].mode==='motion':['map','terrain'].includes(saved[k].mode))).map(k=>({s:saved[k].s,color:k==='A'?'#ffc16b':'#eaa3ff',dash:k==='A'?[6,4]:[2,4]}))];const vertical=w<520,ww=vertical?w:w/2,hh=vertical?h/2:h;let specs;if(graphType==='force')specs=[['거리 r (m) – |F| (N)',.12,1,a=>r=>Math.abs(force(a.q1,a.q2,r))],['1/r² (m⁻²) – |F| (N)',0,1/.12**2,a=>v=>K*Math.abs(a.q1*a.q2)*1e-12*v]];else if(graphType==='map')specs=[['x (m) – 전위 V (V)',-.6,.6,a=>x=>{let f=field(x,a.probe.y,a.charges);return f.near?NaN:f.V}],['x (m) – 전기장 Ex (N/C)',-.6,.6,a=>x=>{let f=field(x,a.probe.y,a.charges);return f.near?NaN:f.ex}]];else specs=[['t (s) – y 변위 (m)',0,5,a=>t=>a.vy*t+.5*a.qt*1e-6*a.E/(a.m*.001)*Math.sin(a.angle*Math.PI/180)*t*t],['t (s) – vy (m/s)',0,5,a=>t=>a.vy+a.qt*1e-6*a.E/(a.m*.001)*Math.sin(a.angle*Math.PI/180)*t]];for(let i=0;i<2;i++){axisMax=axes[graphType][i];const [title,min,max,fn]=specs[i];plot(vertical?0:i*ww,vertical?i*hh:0,ww,hh,title,min,max,names.map(z=>({...z,f:fn(z.s)})));axes[graphType][i]=axisMax}txt('현재 · A · B (저장 조건)',w/2,h-7,'#b1c6d8',10)}
function finish(msg){running=false;ended=true;notice=msg;refresh()}
function advance(dt){if(!running)return;const n=Math.max(1,Math.ceil(dt/.002)),d=dt/n;for(let j=0;j<n&&running;j++){if(mode==='force'){const r=p2.x-p1.x,F=force(s.q1,s.q2,r);p1.v-=F/s.m1*d;p2.v+=F/s.m2*d;const x1=p1.x+p1.v*d,x2=p2.x+p2.v*d;if(x2-x1<.09||x1<-.56||x2>.56){finish('접촉 또는 관찰 경계 도달 · 운동 종료');break}p1.x=x1;p2.x=x2}else if(mode==='motion'){const a=accel();p.x+=p.vx*d+.5*a.x*d*d;p.y+=p.vy*d+.5*a.y*d*d;p.vx+=a.x*d;p.vy+=a.y*d;if(Math.abs(p.x)>.57||Math.abs(p.y)>.30){p.x=clamp(p.x,-.57,.57);p.y=clamp(p.y,-.30,.30);finish('관찰 경계 도달 · 운동 종료')}}else if(mode==='map'){const f=field(p.x,p.y);if(f.near){finish('전하의 측정 제외 영역 도달');break}p.vx+=f.ex*s.test*.001*d;p.vy+=f.ey*s.test*.001*d;p.x+=p.vx*d;p.y+=p.vy*d;if(Math.abs(p.x)>.59||Math.abs(p.y)>.35){p.x=clamp(p.x,-.59,.59);p.y=clamp(p.y,-.35,.35);finish('관찰 경계 도달 · 운동 종료')}}t+=d;if(t>20)finish('20초 관찰 완료');}if(mode!=='force'){trail.push({x:p.x,y:p.y});if(trail.length>1500)trail.shift()}dirty=true}
function render(now){const dt=last?Math.min(.035,(now-last)/1000):0;last=now;if(running&&!document.hidden)advance(dt);if(dirty&&mode!=='concept'&&w>1){if(mode==='force')drawForce();else if(mode==='map')drawMap();else if(mode==='terrain')drawTerrain();else if(mode==='motion')drawMotion();else if(mode==='induction')drawInduction();else drawGraphs();refresh();dirty=false}requestAnimationFrame(render)}
function point(e){const r=c.getBoundingClientRect();return world(e.clientX-r.left,e.clientY-r.top)}c.addEventListener('pointerdown',e=>{if(mode!=='force'&&mode!=='map')return;const a=point(e);if(mode==='force'){running=false;ended=false;drag='distance';s.r=clamp(Math.abs(a.x)*2,.12,1);resetMotion();build()}else{running=false;ended=false;const i=s.charges.findIndex(z=>Math.hypot(z.x-a.x,z.y-a.y)<Math.max(.028,20/S));if(i>=0){s.selected=i;drag='charge';build()}else if(s.add!=='probe'){if(s.charges.length>=8){notice='최대 8개까지 배치할 수 있습니다.';refresh();return}s.charges.push({x:clamp(a.x,-.55,.55),y:clamp(a.y,-.30,.30),q:s.add==='pos'?2:-2});s.selected=s.charges.length-1;s.add='probe';drag='charge';build()}else{drag='probe';s.probe={x:clamp(a.x,-.59,.59),y:clamp(a.y,-.35,.35)}}trail=[];t=0;dirty=true}c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag)return;const a=point(e);if(drag==='distance'){s.r=clamp(Math.round(Math.abs(a.x)*200)/100,.12,1);p1.x=-s.r/2;p2.x=s.r/2;const r=$('r');if(r){r.value=s.r;$('rout').textContent=fmt(s.r)+' m'}}else if(drag==='charge'){s.charges[s.selected].x=clamp(a.x,-.55,.55);s.charges[s.selected].y=clamp(a.y,-.30,.30)}else{s.probe={x:clamp(a.x,-.59,.59),y:clamp(a.y,-.35,.35)}}dirty=true});for(const e of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(e,()=>drag=null);
build();requestAnimationFrame(render);
</script></body></html>
