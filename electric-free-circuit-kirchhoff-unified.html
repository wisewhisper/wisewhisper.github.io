let mode='build',parts=[],wires=[],serial=0,wireSerial=0,selected=null,selWire=null,pending=null,drag=null,active=false,paused=false,carrier='current',notice='두 단자를 차례로 누르면 도선이 연결됩니다.',last=0,phase=0,sol=null,history=[],saved={A:null,B:null},presetName='직렬',editor='wire',dirty=true;
function endpoints(p){return p.type==='junction'?[p.id+':a']:[p.id+':a',p.id+':b']}
function edgesOf(parts,wires){const out=[];for(const p of parts){if(p.type==='junction'||p.type==='switch'&&!p.value)continue;const [a,b]=endpoints(p);let R=p.type==='battery'?RB:p.type==='ammeter'?RA:p.type==='voltmeter'?RV:p.type==='switch'?RS:p.value;out.push({id:p.id,a,b,R,E:p.type==='battery'?p.value:0,type:p.type,label:p.label})}for(const w of wires)out.push({id:w.id,a:w.a,b:w.b,R:RW,E:0,type:'wire',label:w.label});return out}
function gauss(A,b){const n=b.length;for(let k=0;k<n;k++){let pivot=k;for(let i=k+1;i<n;i++)if(Math.abs(A[i][k])>Math.abs(A[pivot][k]))pivot=i;if(Math.abs(A[pivot][k])<1e-14)throw Error('회로 계산 행렬 오류');[A[k],A[pivot]]=[A[pivot],A[k]];[b[k],b[pivot]]=[b[pivot],b[k]];const d=A[k][k];for(let j=k;j<n;j++)A[k][j]/=d;b[k]/=d;for(let i=0;i<n;i++)if(i!==k){const f=A[i][k];if(!f)continue;for(let j=k;j<n;j++)A[i][j]-=f*A[k][j];b[i]-=f*b[k]}}return b}
function solve(parts,wires){
 const nodes=parts.flatMap(endpoints),edges=edgesOf(parts,wires),adj=new Map(nodes.map(n=>[n,[]]));
 for(const e of edges){adj.get(e.a).push(e);adj.get(e.b).push(e)}
 const pot={},component={},visited=new Set();let ci=0;
 for(const root of nodes){if(visited.has(root))continue;const ns=[root];visited.add(root);for(let i=0;i<ns.length;i++)for(const e of adj.get(ns[i])){const n=e.a===ns[i]?e.b:e.a;if(!visited.has(n)){visited.add(n);ns.push(n)}}for(const n of ns)component[n]=ci;ci++;pot[root]=0;const unknown=ns.slice(1),index=new Map(unknown.map((n,i)=>[n,i])),A=unknown.map(()=>unknown.map(()=>0)),b=unknown.map(()=>0);for(const e of edges){if(!ns.includes(e.a))continue;const i=index.get(e.a),j=index.get(e.b),G=1/e.R;if(i!==undefined){A[i][i]+=G;b[i]+=G*e.E;if(j!==undefined)A[i][j]-=G}if(j!==undefined){A[j][j]+=G;b[j]-=G*e.E;if(i!==undefined)A[j][i]-=G}}const x=gauss(A,b);unknown.forEach((n,i)=>pot[n]=x[i])}
 const currents={},balance=Object.fromEntries(nodes.map(n=>[n,0])),result={};let supply=0,loss=0,maxSource=0;
 for(const e of edges){const V=pot[e.a]-pot[e.b],I=(V-e.E)/e.R;currents[e.id]=I;balance[e.a]+=I;balance[e.b]-=I;result[e.id]={V,I,P:I*I*e.R};loss+=I*I*e.R;if(e.type==='battery'){supply-=e.E*I;maxSource=Math.max(maxSource,Math.abs(I))}}

 // Fundamental loops from a spanning forest; every non-tree edge gives an independent loop.
 const parent=new Map(nodes.map(n=>[n,n])),tree=new Map(nodes.map(n=>[n,[]])),loops=[];function find(n){while(parent.get(n)!==n)n=parent.get(n);return n}
 for(const e of edges){const a=find(e.a),b=find(e.b);if(a!==b){parent.set(a,b);tree.get(e.a).push({e,to:e.b});tree.get(e.b).push({e,to:e.a});continue}

function newPart(type,x,y,angle=0,value){const t=TYPES[type],id='p'+(++serial),n=parts.filter(p=>p.type===type).length+1;const p={id,type,label:t[1]+serial,x,y,angle,value:value??t[2]};parts.push(p);return p}
function addWire(a,b){if(a===b||wires.some(w=>w.a===a&&w.b===b||w.a===b&&w.b===a))return false;wires.push({id:'w'+(++wireSerial),label:'도선'+wireSerial,a,b});return true}

function stopForEdit(msg){if(!msg||!msg.startsWith('예시 회로'))presetName='custom';active=false;paused=false;pending=null;notice=msg||'회로 변경 · 전원 투입을 누르세요.';recalc();dirty=true}

 if(name==='series'){const r2=newPart('resistor',760,300,90,12);w(r1,'b',r2,'a');w(r2,'b',b,'b')}

  wires=wires.filter(z=>!(z.a===a.id+':b'&&z.b===r1.id+':a'));r1.x=540;r1.y=235;r1.angle=90;const r2=newPart('resistor',750,235,90,12),j1=newPart('junction',540,80),j2=newPart('junction',540,420);w(a,'b',j1,'a');w(j1,'a',r1,'a');w(j1,'a',r2,'a');w(r1,'b',j2,'a');w(r2,'b',j2,'a');w(j2,'a',b,'b')
 }else if(name==='mixed'){const r2=newPart('resistor',550,260,90,12),r3=newPart('resistor',760,260,90,18),j1=newPart('junction',760,80),j2=newPart('junction',550,420);w(r1,'b',j1,'a');w(j1,'a',r2,'a');w(j1,'a',r3,'a');w(r2,'b',j2,'a');w(r3,'b',j2,'a');w(j2,'a',b,'b')}
 else if(name==='meter'){const v=newPart('voltmeter',680,220);w(r1,'b',b,'b');w(r1,'a',v,'a');w(r1,'b',v,'b')}
 else if(name==='bridge'){r1.x=570;r1.y=170;r1.angle=90;wires=wires.filter(z=>!(z.a===a.id+':b'&&z.b===r1.id+':a'));const r2=newPart('resistor',570,340,90,12),r3=newPart('resistor',780,170,90,9),r4=newPart('resistor',780,340,90,18),r5=newPart('resistor',675,255,0,10),j1=newPart('junction',675,65),j2=newPart('junction',675,435),j3=newPart('junction',570,255),j4=newPart('junction',780,255);w(a,'b',j1,'a');w(j1,'a',r1,'a');w(j1,'a',r3,'a');w(r1,'b',j3,'a');w(r3,'b',j4,'a');w(j3,'a',r2,'a');w(j4,'a',r4,'a');w(j3,'a',r5,'a');w(j4,'a',r5,'b');w(r2,'b',j2,'a');w(r4,'b',j2,'a');w(j2,'a',b,'b')}

}
const presets=[['series','직렬'],['parallel','병렬'],['mixed','혼합'],['meter','계측기'],['bridge','브리지'],['empty','빈 작업대']];
function labelOf(p){return p?TYPES[p.type][0]+' '+p.label:''}
function btn(id,txt){return '<button id="'+id+'">'+txt+'</button>'}

 if(mode==='build'){h+='<div class="group"><h2>예시 회로</h2><div class="row">'+presets.map(([a,b])=>'<button data-preset="'+a+'">'+b+'</button>').join('')+'</div></div><div class="group"><h2>부품 추가</h2><div class="palette">'+Object.entries(TYPES).map(([k,t])=>'<button data-add="'+k+'">'+({battery:'🔋',resistor:'▰',variable:'↗',bulb:'💡',switch:'⏻',ammeter:'Ⓐ',voltmeter:'Ⓥ',junction:'●'}[k])+' '+t[0]+'</button>').join('')+'</div><p class="note">부품 몸체를 드래그해 이동 · 단자 2개를 차례로 눌러 도선 연결 · 도선을 눌러 선택.</p></div><div class="group"><h2>선택 및 편집</h2><div class="row">'+btn('wireMode','단자 연결')+btn('moveMode','부품 이동')+btn('cancel','연결 취소')+'</div><div class="field"><label for="pick">부품 선택</label><select id="pick"><option value="">선택 없음</option>'+parts.map(z=>'<option value="'+z.id+'" '+(z.id===selected?'selected':'')+'>'+labelOf(z)+'</option>').join('')+'</select></div>';

 if(mode==='kcl'||mode==='kvl')h+='<div class="group"><h2>비교 회로</h2><div class="row">'+presets.filter(z=>z[0]!=='empty').map(([a,b])=>'<button data-preset="'+a+'">'+b+'</button>').join('')+'</div><p class="note">제작 탭의 현재 회로가 유지됩니다. 전원 투입 후 실제 계산값을 확인하세요.</p></div>';
 h+='<div class="group"><h2>흐름 표시</h2><div class="row">'+btn('current','관습적 전류')+btn('electron','전자 이동')+'</div></div>';
 if(mode==='measure')h+='<div class="group"><h2>조건 비교</h2><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('record','측정 기록')+btn('clear','기록 지우기')+'</div><p class="note">전원 투입된 회로의 계산 측정값을 저장합니다.</p></div>';
 $('side').innerHTML=h;const on=(id,fn)=>{if($(id))$(id).onclick=fn};on('power',()=>{if(active){active=false;paused=false;notice='전원 차단'}else if(!parts.some(p=>p.type==='battery'))notice='전지를 먼저 추가하세요.';else{recalc();if(sol?.overload)notice='과전류 보호: 예상 '+fmt(sol.maxSource)+' A · 전원 투입 거부';else if(sol){active=true;paused=false;notice=sol.maxSource<1e-5?'전원 투입 · 전류 경로가 개방되어 있거나 전압차 없음':'전원 투입 · 회로 해석 완료'}}dirty=true;buildSide()});on('pause',()=>{if(active){paused=!paused;notice=paused?'애니메이션만 정지 · 계산값 유지':'흐름 재개';buildSide();dirty=true}});on('reset',()=>{history=[];saved={A:null,B:null};preset('series')});
 $('side').querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));$('side').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(parts.length>=22){notice='부품은 최대 22개입니다.';dirty=true;return}const i=parts.length, p=newPart(b.dataset.add,190+(i%5)*130,150+Math.floor(i/5)%3*100);selected=p.id;selWire=null;stopForEdit('부품 추가 · 원하는 위치로 이동하세요.');buildSide()});

function showDetail(){let h='';if(mode==='concept'){h='<h3>1. 자유 회로 제작</h3><p>부품을 추가하고 몸체를 드래그한 뒤 두 단자를 차례로 선택하면 도선이 연결된다. 회로의 외형이 아니라 실제 단자 연결이 전류 경로를 결정한다. 교차한 도선은 자동으로 접속되지 않는다.</p><h3>2. 키르히호프의 전류 법칙 (KCL)</h3><p>정상 상태에서 접점에 들어오는 전류의 합과 나가는 전류의 합은 같다. 전하 보존 법칙의 결과이다. ΣI = 0. 전류의 부호는 기준 방향에 따라 결정된다.</p><h3>3. 키르히호프의 전압 법칙 (KVL)</h3><p>하나의 닫힌 경로를 따라 전위 변화를 더하면 0이다. 정상 직류 회로에서 ΣΔV = 0. 전지 내부저항 및 도선 저항의 전압강하도 포함된다.</p><h3>4. 계측과 실제 회로의 차이</h3><p>전류계는 직렬, 전압계는 병렬 연결한다. 이 모형은 전지 내부저항 0.05 Ω, 도선 한 개 0.005 Ω, 전류계 0.01 Ω, 닫힌 스위치 0.01 Ω, 전압계 1 MΩ을 사용한다. 전구는 일정 저항 근사이며 밝기는 소비전력에 따른 상대적 표현이다. 전원 전류가 5 A를 초과하면 가상 보호 동작으로 차단한다. 실제 전지나 상용 전원에서 단락을 시도하지 않는다.</p><h3>5. 탐구 과제</h3><p>① 병렬 가지의 저항을 바꾸고 KCL 검증. ② 혼합 회로에서 각 경로의 전압 변화 확인. ③ 균형 브리지와 불균형 브리지의 가운데 전류 비교. ④ 전압계와 전류계를 올바르게 연결해 측정. ⑤ 전구 두 개의 밝기를 직렬·병렬에서 비교.</p>'}
