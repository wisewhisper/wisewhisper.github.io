k;font-size:clamp(13px,1.3vw,18px);color:var(--cyan);overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted);margin:2px 0}.status{color:#ffda9b;min-height:1.4em}.group{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.detail{max-width:1000px;line-height:1.7}.detail h3{color:var(--cyan);margin:12px 0 3px}.detail p{margin:0 0 9px}.tablewrap{overflow:auto;max-height:175px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}footer{font-size:11px;color:#9eb4c9;text-align:center;padding:7px}a{color:inherit}[hidden]{display:none!important}@media(max-width:680px){main{display:flex;flex-direction:column;padding:0 6px}.stage{order:0}.controls{order:1;max-height:none}.scene{height:clamp(200px,30dvh,270px)}.scene.solo{height:clamp(250px,40dvh,420px)}.scope{height:230px}.scope.solo{height:330px}.meters{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:8px}header{padding:8px}nav{padding:0 6px 6px}}
</style></head><body><header><h1>⚡ 트랜지스터 스위치·증폭 통합 실험실</h1><button id="full">⛶ 전체화면</button></header><nav id="tabs" role="tablist" aria-label="실험 선택"></nav><main><aside id="controls" class="panel controls"></aside><section class="panel stage"><h2 id="heading"></h2><div id="scene" class="scene"><canvas id="circuit" aria-label="NPN 트랜지스터 구조와 회로"></canvas></div><div id="scope" class="scope"><canvas id="graph" aria-label="입력 출력 신호 및 특성 그래프"></canvas></div><div id="meters" class="meters"></div><div id="status" class="status" aria-live="polite"></div><p id="hint" class="note"></p><div id="detail" class="detail" hidden></div></section></main><footer>© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,n=3)=>!Number.isFinite(x)?'—':Math.abs(x)>0&&Math.abs(x)<.001?x.toExponential(2):Number(x.toFixed(n)).toLocaleString('ko-KR');
const VBE=.7,VSAT=.2,VF=2,LED_RD=20;
const modes=[['structure','NPN 구조·전류'],['switch','LED 스위치'],['amp','신호 증폭'],['sensor','빛 센서 활용'],['graphs','그래프·측정'],['concept','개념 설명']];
const defaults=()=>({vin:2,rb:33,beta:100,vcc:5,rc:330,bias:1.65,amplitude:.15,arb:22,avcc:9,arc:1000,freq:100,light:50,sensorMode:'dark',carrier:'current',speed:1,graphType:'switch'});
function bjt(vin,RB,beta,VCC,RC,led=false){const ib=Math.max(0,(vin-VBE)/RB),rd=led?LED_RD:0,vf=led?VF:0,limit=Math.max(0,(VCC-vf-VSAT)/(RC+rd)),ic=Math.min(beta*ib,limit),ie=ib+ic,vled=led?(ic>0?vf+rd*ic:0):0, // Off LED voltage is undetermined in ideal piecewise model; use explicit high resistance leakage approximation below.
 vce=VCC-ic*(RC+rd)-(led&&ic>0?vf:0),state=ib===0?'cutoff':beta*ib>=limit?'sat':'active';
return{vin,ib,ic,ie,vce,limit,state,vled,pr:ic*ic*RC,pt:vce*ic+VBE*ib,pcc:VCC*ic,pbase:vin*ib,pled:vled*ic}}
function swModel(a,v=a.vin){return bjt(v,a.rb*1000,a.beta,a.vcc,a.rc,true)}
function ampModel(a,phase){const vin=a.bias+a.amplitude*Math.sin(phase*2*Math.PI);return bjt(vin,a.arb*1000,a.beta,a.avcc,a.arc,false)}
function sensorModel(a){const ldr=1000+99000*Math.exp(-a.light/17),fixed=10000,upper=a.sensorMode==='dark'?fixed:ldr,lower=a.sensorMode==='dark'?ldr:fixed,Vth=5*lower/(upper+lower),Rth=upper*lower/(upper+lower),d=bjt(Vth,Rth,a.beta,5,330,true);return {...d,ldr,Vth,Rth,base:Vth-d.ib*Rth,upper,lower}}
function ampStats(a){let voMin=Infinity,voMax=-Infinity,clipped=0;for(let i=0;i<360;i++){const d=ampModel(a,i/360);voMin=Math.min(voMin,d.vce);voMax=Math.max(voMax,d.vce);if(d.state!=='active')clipped++}return{pp:voMax-voMin,gain:a.amplitude>0?(voMax-voMin)/(2*a.amplitude):NaN,linear:clipped===0,clipped:clipped/360}}
let s=defaults(),mode='structure',running=false,phase=0,travel={ib:0,ic:0,ie:0},last=0,dirty=true,notice='조건을 조절하고 전류의 변화를 관찰하세요.',saved={A:null,B:null},records=[];
function resetPhase(msg='조건 변경 · 즉시 반영'){phase=0;travel={ib:0,ic:0,ie:0};running=false;notice=msg;dirty=true}
function kind(){return mode==='graphs'?s.graphType:mode==='structure'?'switch':mode}
function current(){const k=kind();return k==='amp'?ampModel(s,phase):k==='sensor'?sensorModel(s):swModel(s)}
function changeMode(m){if(mode===m)return;if(['switch','amp','sensor'].includes(mode))s.graphType=mode;mode=m;resetPhase();build()}
for(const [id,label] of modes){const b=document.createElement('button');b.dataset.mode=id;b.textContent=label;b.setAttribute('role','tab');b.onclick=()=>changeMode(id);$('tabs').append(b)}$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(z=>z[0]===mode),j=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;changeMode(modes[j][0]);$('tabs').children[j].focus()});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
const fields={vin:['베이스 입력 전압',0,5,.05,'V'],rb:['베이스 저항 RB',1,100,1,'kΩ'],beta:['전류 이득 β',20,200,10,''],vcc:['컬렉터 전원 VCC',3,12,.5,'V'],rc:['LED 직렬 저항',220,1000,10,'Ω'],bias:['직류 바이어스',0,5,.05,'V'],amplitude:['입력 신호 진폭',0,2,.05,'V'],arb:['베이스 저항 RB',10,100,1,'kΩ'],avcc:['컬렉터 전원 VCC',3,12,.5,'V'],arc:['컬렉터 저항 RC',100,3000,100,'Ω'],freq:['입력 주파수',10,1000,10,'Hz'],light:['가상 조도',0,100,1,'%'],speed:['관찰 배속',.25,3,.25,'×']};
function slider(id){const [name,min,max,step,unit]=fields[id];return '<div class="field"><label for="'+id+'">'+name+'<output id="'+id+'out">'+fmt(s[id])+' '+unit+'</output></label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>'}
function btn(id,label){return '<button id="'+id+'">'+label+'</button>'}function select(id,opts,val){return '<select id="'+id+'" aria-label="'+id+'">'+opts.map(([k,v])=>'<option value="'+k+'" '+(k===val?'selected':'')+'>'+v+'</option>').join('')+'</select>'}function bind(id,fn,event='click'){if($(id))$(id).addEventListener(event,fn)}
function build(){for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}const cc=$('controls'),dd=$('detail');cc.hidden=mode==='concept';$('scene').hidden=['graphs','concept'].includes(mode);$('scene').classList.toggle('solo',mode==='structure'||mode==='sensor');$('scope').hidden=['structure','sensor','concept'].includes(mode);$('scope').classList.toggle('solo',mode==='graphs');$('meters').hidden=mode==='concept';dd.hidden=!['concept','graphs'].includes(mode);let h='<h2>실험 조건</h2>',k=kind();
if(mode==='graphs')h+=select('graphType',[['switch','스위치 특성'],['amp','증폭 파형'],['sensor','조도 특성']],s.graphType);
if(mode!=='concept'){if(k==='switch'){h+=slider('vin')+slider('rb')+slider('beta')+slider('vcc')+slider('rc')+'<div class="row">'+btn('cutoff','차단')+btn('active','활성')+btn('sat','포화 시도')+'</div>'}
if(k==='amp'){h+=slider('bias')+slider('amplitude')+slider('arb')+slider('beta')+slider('avcc')+slider('arc')+slider('freq')+'<div class="row">'+btn('normal','정상 증폭')+btn('clip','클리핑')+'</div><p class="note">입력은 DC 바이어스 + 교류. 실제 주파수 대신 느린 위상으로 표시.</p>'}
if(k==='sensor'){h+=slider('light')+slider('beta')+select('sensorMode',[['dark','어두우면 점등'],['bright','밝으면 점등']],s.sensorMode)+'<p class="note">5 V 분압 회로와 광저항 모형. 조도는 상대값이며 실제 lux가 아닙니다.</p>'}
h+='<div class="group">'+select('carrier',[['current','관습적 전류'],['electron','전자 이동']],s.carrier)+slider('speed')+'<div class="row">'+btn('play','▶ 시작')+btn('restart','↺ 처음부터')+'</div></div><div class="group"><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('record','측정 기록')+btn('clear','기록 삭제')+btn('reset','전체 초기화')+'</div></div>'}cc.innerHTML=h;
if(mode==='concept')dd.innerHTML='<h3>1. NPN 트랜지스터의 구조</h3><p>이미터 E는 전자를 주입하고, 얇은 베이스 B에서 일부 전자가 재결합하며, 대부분의 전자가 컬렉터 C로 이동한다. 정상 활성 영역에서 관습적 전류는 C와 B로 들어와 E로 나온다. 전류의 크기는 IE=IC+IB이다. 전자의 이동 방향은 반대이다. 반도체 내부에는 정공의 이동도 포함된다.</p><h3>2. 차단·활성·포화</h3><p>차단: 베이스 전류가 거의 없고 컬렉터 전류가 거의 0이다. 활성: IC≈βIB. 포화: 외부 전원과 저항이 허용하는 컬렉터 전류에 도달하여 βIB 관계가 더 이상 성립하지 않는다. 이 모형은 VBE≈0.7 V, VCE(sat)≈0.2 V를 사용한다.</p><h3>3. 공통 이미터 증폭</h3><p>Vout=VCC−IC RC. 활성 영역에서 입력 전압 증가 → IB 증가 → IC 증가 → 출력 전압 감소. 따라서 출력은 입력에 대해 반전된다. 입력 전류에 대한 전류 이득은 β이고, 베이스 직렬 저항 앞의 입력 전압에 대한 전압 이득은 약 −βRC/RB이다. 차단·포화에 닿으면 파형이 잘린다. 실제 증폭기의 바이어스 안정화 회로와 주파수 응답은 생략했다.</p><h3>4. LED와 센서 활용</h3><p>스위치 회로에서는 베이스 전류로 컬렉터 전류를 제어하여 LED를 켜거나 끈다. LED 에너지는 컬렉터 전원에서 주로 공급된다. 광저항은 조도가 커지면 저항이 감소하며, 분압기의 위치를 바꾸면 어두울 때 또는 밝을 때 켜지는 회로를 구성할 수 있다. 베이스 전류에 의한 분압기 부하도 반영하였다.</p><h3>5. 모형의 한계</h3><p>저주파 준정적 구간선형 모형이다. 실제 트랜지스터의 지수형 특성, 온도, 역방향 항복, 저장 시간, 접합 용량과 주파수 응답은 생략한다. LED는 순방향 강하 2 V와 동저항 20 Ω으로 근사하며 소등 상태의 전압 분배는 정하지 않는다. 실제 LED와 트랜지스터에는 정격과 발열 제한이 있다.</p><h3>탐구 질문</h3><p>① β를 키우면 언제나 IC가 증가하는가? ② 왜 출력 파형이 반전되는가? ③ 바이어스와 진폭을 바꾸면 클리핑은 어떻게 변하는가? ④ LED의 에너지는 어디서 오는가? ⑤ 광저항의 위치를 바꾸면 점등 조건은?</p>';
for(const id of Object.keys(fields))bind(id,e=>{s[id]=+e.target.value;$(id+'out').textContent=fmt(s[id])+' '+fields[id][4];dirty=true;notice='조건 변경 · 즉시 반영';refresh()},'input');
for(const id of ['carrier','sensorMode','graphType'])bind(id,e=>{s[id]=e.target.value;dirty=true;if(id==='graphType'){resetPhase();build()}else refresh()},'change');
bind('cutoff',()=>{s.vin=0;dirty=true;build()});bind('active',()=>{const z=swModel(s);s.vin=clamp(VBE+.5*z.limit*s.rb*1000/s.beta,0,5);dirty=true;build()});bind('sat',()=>{s.vin=5;const z=swModel(s);notice=z.state==='sat'?'포화 상태':'현재 저항·β 조건에서는 5 V로도 포화에 도달하지 않습니다.';dirty=true;build()});
bind('normal',()=>{Object.assign(s,{bias:1.65,amplitude:.15,arb:22,beta:100,avcc:9,arc:1000});resetPhase('활성 영역 정상 증폭');build()});bind('clip',()=>{Object.assign(s,{bias:1.65,amplitude:1.3,arb:22,beta:100,avcc:9,arc:1000});resetPhase('차단·포화 클리핑 비교');build()});bind('play',()=>{running=!running;notice=running?'느린 관찰 재생 중':'일시정지 · 현재 상태 유지';dirty=true;refresh()});bind('restart',()=>{resetPhase('처음 위상으로 초기화');refresh()});
for(const key of ['A','B'])bind('save'+key,()=>{saved[key]={kind:k,a:{...s}};notice='조건 '+key+' 저장';dirty=true;refresh()});bind('record',()=>{const d=current();records.push({kind:k,region:d.state,ib:d.ib,ic:d.ic,ie:d.ie,vce:d.vce,vin:d.vin});if(records.length>30)records.shift();notice='가상 측정 기록';dirty=true;refresh()});bind('clear',()=>{records=[];saved={A:null,B:null};notice='기록 삭제';dirty=true;refresh()});bind('reset',()=>{s=defaults();records=[];saved={A:null,B:null};resetPhase('전체 초기화');build()});refresh();resize()}
const names={cutoff:'차단',active:'활성',sat:'포화'};
function refresh(){const k=kind(),d=current();let a=[['동작 영역',names[d.state]],['베이스 전류 IB',fmt(d.ib*1e6)+' μA'],['컬렉터 전류 IC',fmt(d.ic*1000)+' mA'],['이미터 전류 IE',fmt(d.ie*1000)+' mA'],['VCE',d.state==='cutoff'&&k!=='amp'?'— (부하 소등)':fmt(d.vce)+' V']],hint='IE = IC + IB. 활성 영역에서만 IC ≈ βIB. 전하 이동의 속도와 개수는 관찰용 모형입니다.';
if(k==='amp'){const z=ampStats(s);a.push(['출력 진폭 (p-p)',fmt(z.pp)+' V'],['전압 이득 |Av| (p-p)',fmt(z.gain)],['파형',z.linear?'반전·선형':'클리핑']);hint='입력 신호는 베이스 직렬저항 앞의 전압, 출력은 컬렉터 전압입니다. 활성 영역의 이론 전압 이득 −βRC/RB = '+fmt(-s.beta*s.arc/(s.arb*1000))+'; 입력 '+s.freq+' Hz는 느린 위상으로 표시합니다.'}else if(k==='sensor'){a.push(['광저항',fmt(d.ldr/1000)+' kΩ'],['분압 출력',fmt(d.base)+' V'],['LED',d.ic>0?'점등':'소등']);hint='광저항과 고정저항의 테브난 등가회로로 베이스 부하 효과를 계산합니다. LED 밝기는 컬렉터 전류에 따른 표현입니다.'}else{a.push(['LED 전류 한계',fmt(d.limit*1000)+' mA'],['LED 전력',fmt(d.pled*1000)+' mW'],['컬렉터 전원 공급',fmt(d.pcc*1000)+' mW']);hint+=' LED 전압강하 2 V + 동저항 20 Ω 모형. 소등 시 컬렉터 전압은 이상 LED 모형에서 정해지지 않아 표시하지 않습니다.'}

const c=$('circuit'),g=c.getContext('2d'),cg=$('graph'),gg=cg.getContext('2d');let w=1,h=1,gw=1,gh=1,dpr=1,S=1,ox=0,oy=0;
