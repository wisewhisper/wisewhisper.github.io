function selectTab(i,focus=false){stop();tab=i;const n=LAB.tabs.length;document.querySelectorAll('#tabs button').forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;if(i===j){if(focus)b.focus();b.scrollIntoView({block:'nearest',inline:'nearest'})}});$('experiment').hidden=i===n;$('learn').hidden=i!==n;$(i===n?'learn':'experiment').setAttribute('aria-labelledby','tab_'+i);if(i===n)return;const t=LAB.tabs[i];$('title').textContent=t.name;$('principle').textContent=t.principle;$('observe').textContent=t.observe;$('assume').textContent=t.assume;$('question').textContent='탐구 질문 · '+t.question;$('info').textContent='표시된 수치는 이상적 모형의 계산값입니다. 광선 재생 속도는 교육용이며 실제 빛의 속력이 아닙니다.';controls();refresh();resize()}
function boot(){document.title=LAB.name+' · 빛과 광학';$('labname').textContent=LAB.name;const learn=$('learn');const h=document.createElement('h2');h.textContent='개념 설명 · '+LAB.name;learn.append(h);for(const t of LAB.tabs){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),q=document.createElement('p'),r=document.createElement('p');h.textContent=t.name;p.textContent=t.principle;q.textContent=t.observe;r.textContent='가정 및 한계: '+t.assume;a.append(h);a.append(p);a.append(q);a.append(r);learn.append(a)}const note=document.createElement('p');note.textContent=LAB.detail;learn.append(note);[...LAB.tabs.map(t=>t.name),'개념 설명'].forEach((name,i)=>{const b=document.createElement('button');b.id='tab_'+i;b.textContent=name;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-controls',i===LAB.tabs.length?'learn':'experiment');b.onclick=()=>selectTab(i);b.onkeydown=e=>{const n=LAB.tabs.length+1;if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectTab(e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:n-1))%n,true)}};$('tabs').append(b)});$('play').onclick=()=>{if(tab===LAB.tabs.length)return;if(progress[tab]===1)progress[tab]=0;running=true;last=null;refresh();draw()};$('pause').onclick=()=>{stop();refresh()};$('reset').onclick=()=>{stop();progress[tab]=0;states[tab]=Object.fromEntries(LAB.tabs[tab].controls.map(k=>[k.key,k.value]));progress[tab]=1;controls();refresh();draw()};if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(cv);else window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=null);progress.fill(1);selectTab(0);requestAnimationFrame(frame)}
let lastUI=0;function frame(now){if(running&&tab!==LAB.tabs.length){const dt=last===null?0:Math.min(.05,Math.max(0,(now-last)/1000));last=now;progress[tab]=Math.min(1,progress[tab]+dt/4);if(progress[tab]===1)stop();draw();if(!running||now-lastUI>120){refresh();lastUI=now}}requestAnimationFrame(frame)}
