function stackR(layers,ns,angle,w){const sn=Math.sin(angle*Math.PI/180);const cs=n=>Math.sqrt(1-(sn/n)**2);let sum=0;for(const pol of [0,1]){const Y=n=>pol===0?n*cs(n):n/cs(n);let ar=1,ai=0,br=0,bi=0,cr=0,ci=0,dr=1,di=0;for(const [n,t] of layers){const delta=2*Math.PI*n*t*cs(n)/w,C=Math.cos(delta),S=Math.sin(delta),y=Y(n);let aa=ar*C-bi*y*S,ab=ai*C+br*y*S,ba=br*C-ai*S/y,bb=bi*C+ar*S/y,ca=cr*C-di*y*S,cb=ci*C+dr*y*S,da=dr*C-ci*S/y,db=di*C+cr*S/y;[ar,ai,br,bi,cr,ci,dr,di]=[aa,ab,ba,bb,ca,cb,da,db]}const y0=Y(1),ys=Y(ns),ur=ar+br*ys,ui=ai+bi*ys,vr=cr+dr*ys,vi=ci+di*ys;sum+=((y0*ur-vr)**2+(y0*ui-vi)**2)/((y0*ur+vr)**2+(y0*ui+vi)**2)}return Math.max(0,Math.min(1,sum/2))}

const colorCache=new Map();let colorSignature='';function rgb(i,s,t=s.t,a=s.angle,gain=1){const sig=i+JSON.stringify(s);if(sig!==colorSignature){colorCache.clear();colorSignature=sig}t=Number.isFinite(t)?Math.round(t/5)*5:t;a=Math.round(a);const key=[t,a,gain].join(':');if(colorCache.has(key))return colorCache.get(key);let x=[0,0,0],sum=[0,0,0];for(let w=400;w<=700;w+=10){const r=spectralRGB(w),R=reflectance(i,s,w,t,a);for(let k=0;k<3;k++){x[k]+=R*r[k];sum[k]+=r[k]}}const col='rgb('+x.map((v,k)=>Math.round(255*Math.sqrt(clamp(gain*v/sum[k],0,1)))).join(',')+')';colorCache.set(key,col);return col}

function structure(s,p){let ls=layers(4,s),h=Math.min(17,204/ls.length),y=65;for(let j=0;j<ls.length;j++){let [n,t]=ls[j];rect(40,y+j*h,380,h,j%2?'#2c607b':'#9ac8e5','#a1cde5');}rect(40,y+ls.length*h,380,35,'#293b52');txt(230,49,'고굴절률·저굴절률 교대 적층 '+s.N+'쌍',WHITE,13,'center');let co=rgb(4,s,undefined,undefined,1.6);rect(102,310,256,34,co,'#7998ab');txt(230,356,'반사색 · 이상적 1차원 브래그 적층',MUTED,12,'center');let col=light(s.w);ray([[100,38],[160,65],[220,38]],p,col,2);for(let j=1;j<Math.min(5,ls.length);j++){c.globalAlpha=.6;line([160,65],[160+j*8,65+j*h],col,1.2);line([160+j*8,65+j*h],[220+j*16,38],col,1.2)}c.globalAlpha=1}
function drawFilm(i,s,p){panels(['반사 위상과 광학 경로','비눗방울 · 반사색','물 위 기름막 · 반사색','코팅 전후 반사 비교','다층 구조색'][i],'파장에 따른 반사율',()=>{if(i===0)filmDiagram(i,s,p);else if(i===1)bubble(s,p);else if(i===2)oil(s,p);else if(i===3)coated(s,p);else structure(s,p)},()=>{const ymax=+s.view/100;plot(w=>reflectance(i,s,w)*100,400,700,0,ymax*100,'진공 파장 (nm)','반사율 (%)',MINT,[{x:s.w,y:reflectance(i,s,s.w)*100,color:GOLD}]);if(i===3){let y=bare(1.52,s.angle,s.w)*100;if(y<=ymax*100){let yy=52+258*(1-y/(ymax*100));line([47,yy],[440,yy],GOLD,1,[5,4]);txt(436,yy-12,'무코팅 '+fmt(y,2)+'%',GOLD,11,'right')}}txt(230,367,'중심 두께 기준 · 고정 축 · 계산 반사율',MUTED,12,'center')})}
const common=[angle,wave,pol];
const LAB={name:'얇은 막과 구조색 통합 실험실',tabs:[
{name:'얇은 막 원리',controls:[thick(300),index(1.33),Q('sub','기판','air',[['air','공기'],['water','물'],['glass','유리']]),...common],principle:'두 경계에서 반사된 파동의 위상차와 광학 경로차가 반사율을 결정한다.',observe:'기판과 두께를 바꾸며 위상 반전과 반사율을 비교한다.',assume:'무흡수 균일 평면막, s·p 평균 반사율.',question:'양쪽 경계에서 모두 위상이 반전되면 상대 반전은?'},
{name:'비눗방울',controls:[thick(300),index(1.33),variation,...common],principle:'공기-막-공기의 두 경계에서 반사된 빛이 간섭한다.',observe:'막 두께와 변화폭을 조절하여 색 띠를 비교한다.',assume:'구면의 국소 평면막 근사, 색 밝기 강조.',question:'막 두께가 0에 가까워지면 반사율은?'},
{name:'기름막',controls:[thick(250),index(1.46),variation,...common],principle:'공기-기름-물의 광학 경로 차와 경계 반사 위상이 색을 만든다.',observe:'두께 분포 및 입사각에 따른 색 변화를 비교한다.',assume:'무흡수 평면층, 가상 두께 분포.',question:'같은 두께라도 관찰각에 따라 색이 달라지는 까닭은?'},
{name:'무반사 코팅',controls:[thick(110),index(1.23),...common],principle:'정상 입사에서 n≈√n기판, nt=λ/4이면 반사를 상쇄한다.',observe:'무코팅 유리와 코팅 유리의 반사율을 비교한다.',assume:'단일 무흡수 코팅, 유리 n=1.52.',question:'모든 파장에서 반사가 사라질까?'},
{name:'다층 구조색',controls:[R('N','층 쌍 수',1,12,1,5),R('high','고굴절률',1.8,2.6,.05,2.1),R('low','저굴절률',1.2,1.7,.05,1.45),R('design','설계 중심 파장',400,700,5,550,'nm'),R('scale','층 두께 배율',.6,1.4,.05,1),...common],principle:'여러 계면에서 반사된 빛이 특정 파장대에서 보강 간섭한다.',observe:'적층 수와 설계 파장, 입사각을 바꾸어 반사 대역을 비교한다.',assume:'나비·새 깃털 등을 단순화한 1차원 무흡수 브래그 적층. 실제 생체 구조는 더 복잡하다.',question:'층 쌍을 늘리면 중심 반사율은 어떻게 변할까?'}
],draw:drawFilm,metrics:(i,s)=>{const r=reflectance(i,s,s.w),ns=substrate(i,s);if(i===4)return [['선택 파장 반사율',fmt(r*100,3)+'%'],['고굴절층 두께',fmt(s.design/(4*s.high)*s.scale,2)+' nm'],['저굴절층 두께',fmt(s.design/(4*s.low)*s.scale,2)+' nm'],['전체 층 수',2*s.N+'개']];const th=Math.asin(Math.sin(rad(s.angle))/s.n),b=bare(ns,s.angle,s.w);return [['선택 파장 반사율',fmt(r*100,3)+'%'],['투과율 (무흡수)',fmt((1-r)*100,3)+'%'],['막 내부 각',fmt(deg(th),2)+'°'],['광학 경로차',fmt(2*s.n*s.t*Math.cos(th),2)+' nm'],...(i===3?[['무코팅 반사율',fmt(b*100,3)+'%'],['정상 입사 λ/4 두께',fmt(s.w/(4*s.n),2)+' nm']]:[['기판 굴절률',fmt(ns,2)]])]},
detail:'전달행렬로 각 층의 다중 반사 및 s·p 성분을 계산한다. 정상 입사에서 반사 위상은 낮은 굴절률에서 높은 굴절률로 반사될 때 π만큼 변한다. 사입사에서 p 성분의 반사 위상은 브루스터각도 고려해야 하므로 첫 탭의 위상 표시는 정상 입사 기준이다. 그래프는 균일한 중심 두께에 대한 값이다. 비눗방울·기름막의 색은 대표 파장 RGB 합산으로 근사하며 가시성을 위해 밝기를 강조하였다. 실제 조명 스펙트럼과 인간의 색 지각을 정밀하게 재현하지 않는다.'};
</script><script id="optics-engine">let W=980,H=460,tab=0,running=false,last=null;const states=LAB.tabs.map(t=>Object.fromEntries(t.controls.map(k=>[k.key,k.value]))),progress=LAB.tabs.map(()=>0);
function draw(){if(tab===LAB.tabs.length)return;c.clearRect(0,0,W,H);LAB.draw(tab,states[tab],progress[tab])}
function resize(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*d);cv.height=Math.round(H*d);c.setTransform(d,0,0,d,0,0);draw()}
function stop(){running=false;last=null}
function controls(){const root=$('controls');root.replaceChildren();const t=LAB.tabs[tab],s=states[tab];for(const k of t.controls){const row=document.createElement('div');row.className='control';const l=document.createElement('label');l.htmlFor='ctl_'+k.key;l.textContent=k.label;row.append(l);const el=document.createElement(k.options?'select':'input');el.id='ctl_'+k.key;if(k.options){for(const [v,t] of k.options){const o=document.createElement('option');o.value=v;o.textContent=t;el.append(o)}}else{el.type='range';el.min=k.min;el.max=k.max;el.step=k.step;const out=document.createElement('output');out.id='out_'+k.key;l.append(out)}el.value=s[k.key];row.append(el);root.append(row);el.addEventListener(k.options?'change':'input',()=>{s[k.key]=k.options?el.value:+el.value;stop();progress[tab]=1;refresh();draw()})}}
function refresh(){if(tab===LAB.tabs.length)return;const t=LAB.tabs[tab],s=states[tab],p=progress[tab];for(const k of t.controls){const e=$('out_'+k.key);if(e)e.textContent=s[k.key]+(k.unit?' '+k.unit:'')}const data=LAB.metrics(tab,s,p);$('metrics').replaceChildren();for(const [k,v] of data){const b=document.createElement('div');b.className='metric';const small=document.createElement('small'),strong=document.createElement('strong');small.textContent=k;strong.textContent=v;b.append(small);b.append(strong);$('metrics').append(b)}$('status').textContent=running?'진행 중 '+Math.round(p*100)+'%':p===1?'완료 · 결과 유지':p>0?'일시정지':'준비';$('play').textContent=p===1?'▶ 다시 실행':p>0?'▶ 계속':'▶ 시작';$('pause').disabled=!running}
function selectTab(i,focus=false){stop();tab=i;const n=LAB.tabs.length;document.querySelectorAll('#tabs button').forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1;if(i===j&&focus)b.focus()});$('experiment').hidden=i===n;$('learn').hidden=i!==n;$(i===n?'learn':'experiment').setAttribute('aria-labelledby','tab_'+i);if(i===n)return;const t=LAB.tabs[i];$('title').textContent=t.name;$('principle').textContent=t.principle;$('observe').textContent=t.observe;$('assume').textContent=t.assume;$('question').textContent='탐구 질문 · '+t.question;$('info').textContent='표시된 수치는 이상적 모형의 계산값입니다. 광선 재생 속도는 교육용이며 실제 빛의 속력이 아닙니다.';controls();refresh();resize()}
function boot(){document.title=LAB.name+' · 빛과 광학';$('labname').textContent=LAB.name;const learn=$('learn');const h=document.createElement('h2');h.textContent='개념 설명 · '+LAB.name;learn.append(h);for(const t of LAB.tabs){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),q=document.createElement('p'),r=document.createElement('p');h.textContent=t.name;p.textContent=t.principle;q.textContent=t.observe;r.textContent='가정 및 한계: '+t.assume;a.append(h);a.append(p);a.append(q);a.append(r);learn.append(a)}const note=document.createElement('p');note.textContent=LAB.detail;learn.append(note);[...LAB.tabs.map(t=>t.name),'개념 설명'].forEach((name,i)=>{const b=document.createElement('button');b.id='tab_'+i;b.textContent=name;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-controls',i===LAB.tabs.length?'learn':'experiment');b.onclick=()=>selectTab(i);b.onkeydown=e=>{const n=LAB.tabs.length+1;if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectTab(e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:n-1))%n,true)}};$('tabs').append(b)});$('play').onclick=()=>{if(tab===LAB.tabs.length)return;if(progress[tab]===1)progress[tab]=0;running=true;last=null;refresh();draw()};$('pause').onclick=()=>{stop();refresh()};$('reset').onclick=()=>{stop();progress[tab]=0;states[tab]=Object.fromEntries(LAB.tabs[tab].controls.map(k=>[k.key,k.value]));progress[tab]=1;controls();refresh();draw()};if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(cv);else window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=null);progress.fill(1);selectTab(0);requestAnimationFrame(frame)}
let lastUI=0;function frame(now){if(running&&tab!==LAB.tabs.length){const dt=last===null?0:Math.min(.05,Math.max(0,(now-last)/1000));last=now;progress[tab]=Math.min(1,progress[tab]+dt/4);if(progress[tab]===1)stop();draw();if(!running||now-lastUI>120){refresh();lastUI=now}}requestAnimationFrame(frame)}
boot();$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});};</script><footer style="text-align:center;font-size:11px;color:#b7c9dc;padding:6px">© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer></body></html>
