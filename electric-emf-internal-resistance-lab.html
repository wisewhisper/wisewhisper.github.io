<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기전력과 전지의 내부저항 실험실</title><style>
:root{color-scheme:dark;--bg:#080e17;--panel:#111d2c;--line:#304359;--ink:#eaf3ff;--muted:#adc2d6;--cyan:#72e7df;--amber:#ffd28c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px}h1{font-size:clamp(17px,2vw,25px);margin:0}h2{font-size:17px;margin:0 0 6px}nav,.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}nav{padding:0 12px 7px;overflow-x:auto;flex-wrap:nowrap}nav button{white-space:nowrap}button,select{font:inherit;color:var(--ink);background:#22344b;border:1px solid #405873;border-radius:7px;padding:7px 10px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan)}button[aria-selected=true],button.on{background:#10566a;border-color:#6ce4e0}button:disabled{opacity:.45;cursor:default}main{display:grid;grid-template-columns:minmax(230px,25%) minmax(0,1fr);gap:9px;padding:0 10px}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}.controls{max-height:calc(100dvh - 128px);overflow:auto}.stage{display:flex;flex-direction:column;gap:6px}.scene{height:clamp(260px,calc(100dvh - 280px),680px);background:#071422;border:1px solid var(--line);border-radius:8px;overflow:hidden}canvas{width:100%;height:100%;display:block}.field{margin:7px 0}.field label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.field output{color:var(--cyan);font-weight:700}input[type=range]{width:100%;accent-color:var(--cyan);height:19px}.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:5px}.meter{min-width:0;padding:6px 8px;background:#172a3c;border-radius:7px}.meter small{display:block;color:var(--muted)}.meter b{display:block;font-size:clamp(13px,1.3vw,18px);color:var(--cyan);overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted);margin:2px 0}.status{color:#ffda9b;min-height:1.4em}.formula{color:#deecf8;font-size:13px}.group{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.detail{max-width:1000px;line-height:1.8}.detail h3{color:var(--cyan);margin:12px 0 3px}.detail p{margin:0 0 10px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}.scroll{max-height:200px;overflow:auto}footer{font-size:11px;color:#9eb4c9;text-align:center;padding:7px}a{color:inherit}[hidden]{display:none!important}@media(max-width:680px){main{display:flex;flex-direction:column;padding:0 6px}.stage{order:0}.controls{order:1;max-height:none}.scene{height:clamp(275px,42dvh,400px)}.meters{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:8px}header{padding:8px}nav{padding:0 6px 6px}}
</style></head><body><header><h1>⚡ 기전력과 전지의 내부저항 실험실</h1><button id="full">⛶ 전체화면</button></header><nav id="tabs" role="tablist" aria-label="실험 선택"></nav><main><aside id="controls" class="panel controls"></aside><section class="panel stage"><h2 id="heading"></h2><div id="scene" class="scene"><canvas id="canvas" aria-label="전지와 부하 회로"></canvas></div><div id="meters" class="meters"></div><div id="formula" class="formula"></div><div id="status" class="status" aria-live="polite"></div><p id="hint" class="note"></p><div id="detail" class="detail" hidden></div></section></main><footer>© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,n=3)=>!Number.isFinite(x)?'—':Math.abs(x)>0&&Math.abs(x)<.001?x.toExponential(2):Number(x.toFixed(n)).toLocaleString('ko-KR');
const modes=[['single','기전력·단자 전압'],['pack','전지 직렬·병렬'],['maximum','최대 전력·효율'],['iv','V–I 그래프'],['compare','측정·비교'],['concept','개념 설명']];
const defaults=()=>({E:3,r:1,R:5,ns:2,np:2,connection:'load',packMode:'mixed',carrier:'current',duration:20,speed:1});
let s=defaults(),mode='single',lastExperiment='single',running=false,ended=false,elapsed=0,phase=0,last=0,dirty=true,notice='준비 · 회로 조건을 선택하세요.',saved={A:null,B:null},records=[],xmax=5,ymax=8;
function batteryModel(E,r,R,connection='load'){const open=connection==='open',short=connection==='short',load=short?0:R,I=open?0:E/(r+load),V=open?E:I*load,source=E*I,heat=I*I*r,P=V*I,eta=open?NaN:P/source;return {E,r,R:load,I,V,source,heat,P,eta,open,short}}
function bankModel(a){const ns=a.packMode==='parallel'?1:a.ns,np=a.packMode==='series'?1:a.np,E=a.E*ns,r=a.r*ns/np;const d=batteryModel(E,r,a.R,a.connection);return {...d,ns,np,cellI:d.I/np,cellHeat:(d.I/np)**2*a.r}}
function model(a,type){return type==='pack'?bankModel(a):batteryModel(a.E,a.r,a.R,type==='maximum'?'load':a.connection)}
function resetRun(msg='조건 변경 · 시작을 누르세요.'){running=false;ended=false;elapsed=0;phase=0;notice=msg;dirty=true}
function changeMode(m){if(m===mode)return;mode=m;if(['single','pack','maximum'].includes(m))lastExperiment=m;resetRun('준비 · 조건을 조절하여 비교하세요.');build()}
for(const [id,label] of modes){const b=document.createElement('button');b.textContent=label;b.dataset.mode=id;b.setAttribute('role','tab');b.onclick=()=>changeMode(id);$('tabs').append(b)}
$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(z=>z[0]===mode),n=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;changeMode(modes[n][0]);$('tabs').children[n].focus()});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
const units={E:'V',r:'Ω',R:'Ω',ns:'개',np:'줄',duration:'s',speed:'×'};
function slider(id,label,min,max,step){return '<div class="field"><label for="'+id+'">'+label+'<output id="'+id+'out">'+fmt(s[id])+' '+units[id]+'</output></label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>'}
function btn(id,label){return '<button id="'+id+'">'+label+'</button>'}
function select(id,arr,val){return '<select id="'+id+'" aria-label="'+id+'">'+arr.map(([k,v])=>'<option value="'+k+'" '+(String(k)===String(val)?'selected':'')+'>'+v+'</option>').join('')+'</select>'}
function bind(id,f,event='click'){const a=$(id);if(a)a.addEventListener(event,f)}
function config(type){let h=slider('E','전지 1개의 기전력',.5,6,.1)+slider('r','전지 1개의 내부저항',.2,5,.1)+slider('R','외부 부하 저항',0,40,.1);
if(type==='pack')h+='<div class="row">'+select('packMode',[['series','직렬 연결'],['parallel','병렬 연결'],['mixed','직렬·병렬 혼합']],s.packMode)+'</div>'+(s.packMode!=='parallel'?slider('ns','한 줄의 직렬 전지',1,4,1):'')+(s.packMode!=='series'?slider('np','병렬 연결 줄 수',1,4,1):'')+'<p class="note">동일한 전지, 같은 극성, 균등한 가지 조건을 가정합니다.</p>';
if(type!=='maximum')h+='<div class="row">'+select('connection',[['load','부하 연결'],['open','개방 회로'],['short','가상 단락']],s.connection)+'</div>';
return h}
function snapshot(){return{type:lastExperiment,s:{...s}}}
function graphData(){return [{...snapshot(),color:'#71e7dc'},...['A','B'].filter(k=>saved[k]).map(k=>({...saved[k],color:k==='A'?'#ffd18b':'#d6a6ff',dash:k==='A'?[7,4]:[2,4]}))]}
function build(){for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}const cc=$('controls'),dd=$('detail');cc.hidden=mode==='concept';$('scene').hidden=['concept','compare'].includes(mode);$('meters').hidden=mode==='concept';dd.hidden=!['concept','compare'].includes(mode);let h='<h2>실험 조건</h2>';
if(['single','pack','maximum'].includes(mode)){h+=config(mode);if(mode==='single')h+='<div class="row">'+btn('open','개방')+btn('short','가상 단락')+btn('load','부하 연결')+'</div>';if(mode==='maximum')h+='<div class="row">'+btn('match','R = r')+btn('double','R = 2r')+btn('large','R = 5r')+'</div><p class="note">최대 출력과 최대 효율은 서로 다른 조건입니다.</p>';else h+='<div class="row">'+select('carrier',[['current','관습적 전류'],['electron','전자 이동 (외부 금속 도선)']],s.carrier)+'</div>'+slider('duration','측정 시간',1,60,1)+slider('speed','관찰 배속',.25,4,.25)+'<div class="row">'+btn('play','▶ 시작')+btn('restart','↺ 처음부터')+'</div>'}
if(mode==='iv')h+='<div class="row">'+select('ivType',[['single','단일 전지'],['pack','전지 묶음']],lastExperiment==='pack'?'pack':'single')+'</div>'+config(lastExperiment==='pack'?'pack':'single')+'<div class="row">'+btn('measure','측정점 기록')+btn('fit','축 범위 맞춤')+btn('axisDefault','기본 축')+'</div><p class="note">전압·전류 축은 자동으로 변하지 않습니다. 범위 밖이면 축 범위 맞춤을 선택하세요.</p>';
if(mode==='compare')h+='<p class="note">실험에서 저장한 조건과 측정점을 비교합니다. 에너지는 각 조건의 경과 시간에 따라 계산합니다.</p>'+btn('clearRecords','측정점 지우기');
if(mode!=='concept')h+='<div class="group"><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('clear','비교 지우기')+btn('reset','전체 초기화')+'</div></div>';cc.innerHTML=h;
if(mode==='concept')dd.innerHTML='<h3>1. 기전력과 단자 전압</h3><p>기전력 ε은 전지가 단위 전하에 공급하는 에너지(J/C)이다. 내부저항 r을 갖는 전지가 부하 R에 전류를 공급할 때 I=ε/(R+r), V=ε−Ir=IR이다. 이상적인 전지(r=0)는 단자 전압이 일정하지만 실제 전지 모형에서는 전류가 클수록 전압이 떨어진다.</p><h3>2. 개방과 단락</h3><p>개방: I=0, V=ε. 단락(이론): R=0, I=ε/r, V=0. 단락 시 전지 내부에 큰 열이 발생하므로 실제 전지에서 절대 시도하지 않는다. 이 실험의 단락은 수식으로 계산한 가상 정상 상태이다.</p><h3>3. 동일 전지의 연결</h3><p>직렬 n개: ε합=nε, r합=nr. 병렬 m개: ε합=ε, r합=r/m. 직렬 n개로 구성한 줄 m개를 병렬 연결하면 ε합=nε, r합=nr/m. 각 병렬 줄의 전류는 전체 전류의 1/m이다. 실제로 서로 다른 전지나 충전 상태의 전지를 병렬 연결하면 위험할 수 있다.</p><h3>4. 최대 전력 전달</h3><p>P부하=ε²R/(R+r)². R=r에서 P최대=ε²/(4r), 효율 50%. 효율 η=P부하/(εI)=R/(R+r). R≫r이면 효율은 높아지지만 부하 전력은 감소한다. 개방에서는 공급 전력이 0이므로 효율을 정의하지 않는다.</p><h3>5. V–I 그래프</h3><p>V=ε−rI. y절편은 기전력, 기울기는 −r, x절편은 이론 단락 전류 ε/r이다. 동일 전지의 부하를 변화시키며 측정점을 기록해 보자.</p><h3>6. 모형의 한계</h3><p>기전력과 내부저항이 시간·온도·충전 상태와 무관하다고 가정한다. 전지는 방전 방향만 다루고 용량 소모나 실제 화학 반응은 생략한다. 이상적 도선, 이상적 계기, 일정 저항의 부하를 사용한다. 애니메이션의 전하 이동은 실제 이동 속도와 무관한 시각 모형이다.</p>';
for(const id of Object.keys(units))bind(id,e=>{s[id]=+e.target.value;$(id+'out').textContent=fmt(s[id])+' '+units[id];if(id!=='speed')resetRun();refresh()},'input');
for(const id of ['packMode','connection','carrier'])bind(id,e=>{s[id]=e.target.value;resetRun();build()},'change');
for(const k of ['open','short','load'])bind(k,()=>{s.connection=k;resetRun(k==='short'?'가상 단락 · 실제 전지에서는 시도하지 마세요.':'조건 변경');build()});
for(const [k,m] of [['match',1],['double',2],['large',5]])bind(k,()=>{s.R=clamp(s.r*m,0,40);resetRun();build()});
bind('play',()=>{if(running){running=false;notice='일시정지 · 측정값 유지'}else{if(ended){elapsed=0;phase=0;ended=false}running=true;notice=s.connection==='short'?'가상 단락 해석 중 · 실제 실험 금지':'실험 진행 중'}dirty=true;refresh()});
bind('restart',()=>{resetRun('처음 상태로 돌아갔습니다.');refresh()});
for(const k of ['A','B'])bind('save'+k,()=>{saved[k]={...snapshot(),t:elapsed};notice='조건 '+k+' 저장';dirty=true;refresh()});bind('clear',()=>{saved={A:null,B:null};notice='비교 기록 삭제';dirty=true;refresh()});bind('clearRecords',()=>{records=[];notice='측정점 삭제';dirty=true;refresh()});
bind('ivType',e=>{lastExperiment=e.target.value;resetRun();build()},'change');
bind('measure',()=>{const z=snapshot(),d=model(z.s,z.type);records.push({...z,I:d.I,V:d.V});if(records.length>30)records.shift();notice='가상 측정점 '+records.length+'개 기록';dirty=true;refresh()});
bind('fit',()=>{const ds=graphData().map(z=>model(z.s,z.type));xmax=Math.max(1,...ds.map(d=>d.E/d.r))*1.1;ymax=Math.max(1,...ds.map(d=>d.E))*1.1;notice='축 범위 설정 · 이후 고정';dirty=true;refresh()});bind('axisDefault',()=>{xmax=5;ymax=8;notice='기본 축으로 복귀';dirty=true;refresh()});
bind('reset',()=>{s=defaults();saved={A:null,B:null};records=[];xmax=5;ymax=8;resetRun('전체 초기화 완료');build()});refresh();resize()}
function refresh(){const type=['iv','compare'].includes(mode)?lastExperiment:mode,d=model(s,type);$('heading').textContent=modes.find(z=>z[0]===mode)[1];let a=[],f='',hint='';
if(['single','pack','maximum','iv'].includes(mode)){a=[['기전력 ε',fmt(d.E)+' V'],['내부저항 r',fmt(d.r)+' Ω'],['전류 I',fmt(d.I)+' A'],['단자 전압 V',fmt(d.V)+' V'],['부하 전력',fmt(d.P)+' W'],['내부 발열',fmt(d.heat)+' W']];f='V = ε − Ir · P공급 = P부하 + P내부';if(mode==='pack'){a.push(['전지 수',d.ns*d.np+'개'],['한 줄 전류',fmt(d.cellI)+' A']);hint='같은 전지의 균등한 전류 분배를 가정합니다. 표시된 합성 내부저항과 기전력을 확인하세요.'}else if(mode==='maximum'){a.push(['효율',Number.isFinite(d.eta)?fmt(d.eta*100,1)+' %':'—'],['최대 부하 전력',fmt(d.E*d.E/(4*d.r))+' W']);hint='R/r=1에서 부하 전력 최대, 효율 50%. 가로축은 부하 저항 / 내부저항입니다.'}else if(mode==='iv'){a.push(['기울기',fmt(-d.r)+' V/A'],['측정점',records.length+'개']);hint='고정축 · 현재(민트), A(노랑), B(보라). 기록된 점은 현재와 같은 전지 조건만 강조합니다.';if(d.E/d.r>xmax||d.E>ymax)hint+=' 절편이 축 범위를 벗어났습니다. 축 범위 맞춤을 사용하세요.'}else{a.push(['누적 부하 에너지',fmt(d.P*elapsed)+' J'],['측정 시간',fmt(elapsed,1)+' s']);hint='이상적인 전지의 단자 전압은 항상 ε입니다. 실제 전지 모형에서는 내부저항에 의해 전압이 떨어집니다.'}}
if(mode==='pack')hint+=' 측정 시간 '+fmt(elapsed,1)+' s.';
if(['single','pack','iv'].includes(mode)&&d.short)hint+=' ⚠ 단락은 가상 계산만 수행합니다.';
if(mode==='compare'){a=[['A 조건',saved.A?'저장됨':'—'],['B 조건',saved.B?'저장됨':'—'],['기록',records.length+'개']];const rows=['A','B'].filter(k=>saved[k]).map(k=>{const z=saved[k],d=model(z.s,z.type);return [k,fmt(d.E),fmt(d.r),fmt(d.I),fmt(d.V),fmt(d.P),fmt(d.heat),Number.isFinite(d.eta)?fmt(d.eta*100,1):'—',fmt(d.P*z.t)]});$('detail').innerHTML='<h3>A·B 조건 비교</h3>'+table(['조건','ε(V)','r(Ω)','I(A)','V(V)','부하(W)','발열(W)','효율(%)','에너지(J)'],rows)+'<h3>V–I 측정 기록</h3>'+table(['번호','전지 ε(V)','r(Ω)','I(A)','V(V)'],records.map((z,i)=>{const d=model(z.s,z.type);return[i+1,fmt(d.E),fmt(d.r),fmt(z.I),fmt(z.V)]}))}
$('meters').innerHTML=a.map(z=>'<div class="meter"><small>'+z[0]+'</small><b>'+z[1]+'</b></div>').join('');$('formula').textContent=f;$('status').textContent=mode==='concept'?'':notice;$('hint').textContent=hint;if($('play'))$('play').textContent=running?'Ⅱ 일시정지':ended?'▶ 다시 시작':'▶ 시작 / 재개'}
function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
const c=$('canvas'),g=c.getContext('2d');let w=1,h=1,dpr=1,S=1,ox=0,oy=0;
function resize(){const b=c.getBoundingClientRect();if(!b.width||!b.height)return;w=b.width;h=b.height;dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);S=Math.min(w/800,h/420);ox=(w-800*S)/2;oy=(h-420*S)/2;dirty=true}new ResizeObserver(resize).observe($('scene'));
function txt(t,x,y,col='#d9eaf8',size=16,align='center'){g.fillStyle=col;g.font='600 '+size+'px system-ui';g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y)}
function line(p,col='#8eafc1',width=3){g.strokeStyle=col;g.lineWidth=width;g.lineJoin='round';g.lineCap='round';g.beginPath();p.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.stroke()}
function rect(x,y,W,H,r,fill,stroke='#6c899e'){g.fillStyle=fill;g.strokeStyle=stroke;g.lineWidth=1.5;g.beginPath();g.roundRect(x,y,W,H,r);g.fill();g.stroke()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function background(){g.fillStyle='#081624';g.fillRect(0,0,800,420);for(let i=0;i<800;i+=40)line([[i,0],[i,420]],'#172b3e',1);for(let i=0;i<420;i+=40)line([[0,i],[800,i]],'#172b3e',1)}
function cell(x,y,W=80,H=40){const gr=g.createLinearGradient(x,y-H/2,x,y+H/2);gr.addColorStop(0,'#c4d8e3');gr.addColorStop(.4,'#63899d');gr.addColorStop(1,'#294b62');rect(x-W/2,y-H/2,W,H,7,gr);rect(x+W/2,y-H/4,5,H/2,2,'#b4cbd5');txt('−',x-W/2+12,y,'#122b3c',14);txt('+',x+W/2-12,y,'#142e40',14)}
function resistor(x,y,vertical=false){g.save();g.translate(x,y);if(vertical)g.rotate(Math.PI/2);const gr=g.createLinearGradient(0,-15,0,15);gr.addColorStop(0,'#e9c59c');gr.addColorStop(.45,'#ad784c');gr.addColorStop(1,'#60412e');rect(-45,-15,90,30,8,gr,'#e7bc8a');for(const j of [-20,0,20])line([[j,-13],[j,13]],'#74513b',4);g.restore()}
function flow(p,I){if(Math.abs(I)<1e-10||(!running&&elapsed===0))return;let total=0;const L=[];for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);L.push(d);total+=d}const sign=s.carrier==='current'?1:-1,step=35,off=((phase*sign*24*Math.min(12,Math.abs(I)))%step+step)%step;for(let d=off;d<total;d+=step){let z=d;for(let i=0;i<L.length;i++){if(z<=L[i]){const a=p[i],b=p[i+1],u=z/L[i];circle(a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,4,'#70f2d0');break}z-=L[i]}}}
function bar(x,y,W,H,a,b,label){rect(x,y,W,H,6,'#1b3144');if(a+b>0){const z=(W-4)*a/(a+b);g.fillStyle='#70e5d8';g.fillRect(x+2,y+2,z,H-4);g.fillStyle='#f6ae65';g.fillRect(x+2+z,y+2,W-4-z,H-4)}txt(label,x+W/2,y-13,'#d3e7f5',14)}
function drawCircuit(){background();const d=model(s,mode),bank=mode==='pack';const top=75,bot=290,left=86,right=685;
rect(118,35,454,220,12,'#102436','#506b80');txt(bank?'전지 묶음 내부':'실제 전지 내부 등가 모형',345,52,'#aacce0',16);
const ns=bank?d.ns:1,np=bank?d.np:1,dy=np===1?0:125/(np-1),x0=155,x1=520;
const rows=[];for(let j=0;j<np;j++){const y=np===1?145:82+j*dy;rows.push(y);line([[x0,y],[x1,y]],'#91aebf',2);const gap=ns===1?0:210/(ns-1);for(let i=0;i<ns;i++){const x=ns===1?260:190+i*gap;cell(x,y,ns>2?49:72,30)}g.save();g.translate(485,y);g.scale(.62,.62);resistor(0,0);g.restore();if(np===1)txt('r',485,y+32,'#ffd18b',13)}
line([[x0,rows[0]],[x0,rows.at(-1)],[x0,bot],[left,bot]],'#a6c2d0',3);line([[x1,rows.at(-1)],[x1,rows[0]],[x1,top],[right,top]],'#a6c2d0',3);for(let j=0;j<np;j++){circle(x0,rows[j],3,'#bcd3df');circle(x1,rows[j],3,'#bcd3df');flow([[x0,rows[j]],[x1,rows[j]]],d.I/np)}
txt('−',left,bot-22,'#b7d4e5',21);txt('+',right,top-20,'#ffd18b',21);if(d.open){line([[right,top],[right,140]]);line([[right,190],[right,bot],[left,bot]]);circle(right,140,5,'#b7d4e5');circle(right,190,5,'#b7d4e5');line([[right,190],[right-30,151]],'#ffd18b',4);txt('개방',right,222,'#ffd18b',17)}else if(d.short){const p=[[right,top],[right,bot],[left,bot]];line(p,'#ef936c',4);flow(p,d.I);txt('가상 단락',right-8,183,'#ffb58a',17,'right')}else{const p=[[right,top],[right,137]],q=[[right,227],[right,bot],[left,bot]];line(p);line(q);resistor(right,182,true);flow(p,d.I);flow(q,d.I);txt('R='+fmt(d.R)+' Ω',right-29,182,'#e7c89e',16,'right')}
flow([[x1,rows[0]],[x1,top],[right,top]],d.I);flow([[left,bot],[x0,bot],[x0,rows.at(-1)]],d.I);txt('ε='+fmt(d.E)+' V  ·  r='+fmt(d.r)+' Ω',345,237,'#d7effa',17);txt('단자 전압 '+fmt(d.V)+' V',390,285,'#79efe1',19);bar(145,346,510,21,d.P,d.heat,'공급 전력 '+fmt(d.source)+' W = 부하 '+fmt(d.P)+' W + 내부 발열 '+fmt(d.heat)+' W');txt('민트: 부하 전력     주황: 내부 발열',400,389,'#c2d9e8',14)}
function axes(L,T,R,B,xM,yM,xLabel,yLabel){for(let i=0;i<=5;i++){const x=L+(R-L)*i/5,y=B-(B-T)*i/5;line([[x,T],[x,B]],'#284055',1);line([[L,y],[R,y]],'#284055',1);txt(fmt(xM*i/5,2),x,B+15,'#aac2d4',11);txt(fmt(yM*i/5,2),L-7,y,'#aac2d4',11,'right')}line([[L,T],[L,B],[R,B]],'#8fadc0',1.5);txt(xLabel,(L+R)/2,B+34,'#d7eaf6',13);txt(yLabel,L,T-14,'#d7eaf6',13,'left')}
function drawMaximum(){g.fillStyle='#081624';g.fillRect(0,0,w,h);const L=50,T=40,R=w-20,B=h-55,X=x=>L+(R-L)*x/10,Y=y=>B-(B-T)*y;axes(L,T,R,B,10,1,'R/r','정규화 전력 · 효율');g.save();g.beginPath();g.rect(L,T,R-L,B-T);g.clip();const p=[],q=[];for(let i=0;i<=300;i++){const x=10*i/300;p.push([X(x),Y(4*x/(1+x)**2)]);q.push([X(x),Y(x/(1+x))])}line(p,'#70e5d8',3);line(q,'#ffba70',3);line([[X(1),T],[X(1),B]],'#a6b7c7',1);const d=model(s,'maximum'),u=d.R/d.r;if(u<=10){line([[X(u),T],[X(u),B]],'#fff1bd',1);circle(X(u),Y(4*u/(1+u)**2),5,'#70e5d8');circle(X(u),Y(u/(1+u)),5,'#ffba70')}g.restore();txt('P/P최대',R-8,T+14,'#70e5d8',13,'right');txt('효율 η',R-8,T+32,'#ffba70',13,'right');txt('R=r',X(1),T-14,'#ffda9b',12);if(u>10)txt('현재 R/r = '+fmt(u)+' (범위 밖)',(L+R)/2,B-12,'#ffd18b',12)}
function drawIV(){g.fillStyle='#081624';g.fillRect(0,0,w,h);const L=54,T=36,R=w-24,B=h-55,X=x=>L+x/xmax*(R-L),Y=y=>B-y/ymax*(B-T);axes(L,T,R,B,xmax,ymax,'전류 I (A)','단자 전압 V (V)');g.save();g.beginPath();g.rect(L,T,R-L,B-T);g.clip();for(const z of graphData()){const d=model(z.s,z.type),end=Math.min(xmax,d.E/d.r);g.setLineDash(z.dash||[]);line([[X(0),Y(d.E)],[X(end),Y(d.E-d.r*end)]],z.color,2.6);g.setLineDash([]);circle(X(d.I),Y(d.V),5,z.color)}const d=model(s,lastExperiment);for(const z of records){const a=model(z.s,z.type),same=Math.abs(a.E-d.E)<1e-8&&Math.abs(a.r-d.r)<1e-8;circle(X(z.I),Y(z.V),4,same?'#f7f6ff':'#647b8e')}g.restore()}
function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(running&&!document.hidden){elapsed=Math.min(s.duration,elapsed+dt*s.speed);phase+=dt*s.speed;if(elapsed>=s.duration){running=false;ended=true;notice='측정 완료 · 결과를 저장하거나 다시 시작하세요.'}dirty=true}if(dirty){if(!['concept','compare'].includes(mode)&&w>1){g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#081624';g.fillRect(0,0,w,h);if(mode==='maximum')drawMaximum();else if(mode==='iv')drawIV();else{g.setTransform(dpr*S,0,0,dpr*S,dpr*ox,dpr*oy);drawCircuit()}}refresh();dirty=false}requestAnimationFrame(frame)}
build();requestAnimationFrame(frame);
</script></body></html>
