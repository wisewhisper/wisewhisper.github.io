style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cheader>\n    \u003cdiv class=\"brand\">\u003cdiv class=\"brand-mark\" aria-hidden=\"true\">◉\u003c/div>\u003cdiv>\u003ch1>NFC · RFID 기초 및 가상 읽기·기록\u003c/h1>\u003csmall>과학탐구실험 · 교과서 22~23쪽 탐구 연결\u003c/small>\u003c/div>\u003c/div>\n    \u003cnav class=\"top-controls\" aria-label=\"화면 탭\">\u003cbutton class=\"topbtn active\" data-tab=\"lab\" aria-pressed=\"true\">🔬 실험하기\u003c/button>\u003cbutton class=\"topbtn\" data-tab=\"concept\" aria-pressed=\"false\">📘 개념·비교\u003c/button>\u003cbutton class=\"topbtn\" id=\"resetBtn\" title=\"현재 실험 조건 초기화\">↺ 초기화\u003c/button>\u003c/nav>\n  \u003c/header>\n  \u003csection id=\"lab\" class=\"tab-panel active\">\n    \u003cdiv class=\"lab-intro\">\u003cdiv>\u003cstrong>가까이 대면 왜 배터리 없는 태그가 반응할까?\u003c/strong>\u003cp>거리·각도·출력을 조절하고 NFC 태그의 기록·읽기를 모의 실험해 보세요.\u003c/p>\u003c/div>\u003cdiv class=\"modes\" aria-label=\"통신 방식 선택\">\u003cbutton class=\"mode active\" data-mode=\"nfc\" aria-pressed=\"true\">NFC \u003cspan>13.56 MHz\u003c/span>\u003c/button>\u003cbutton class=\"mode\" data-mode=\"lf\" aria-pressed=\"false\">RFID · LF \u003cspan>125 kHz\u003c/span>\u003c/button>\u003cbutton class=\"mode uhf\" data-mode=\"uhf\" aria-pressed=\"false\">RFID · UHF \u003cspan>920 MHz\u003c/span>\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"lab-layout\">\n      \u003cdiv class=\"left-col\">\n        \u003csection class=\"stage\" aria-label=\"자기장 또는 전파 전달 개념 시각화\">\u003cdiv class=\"stage-head\">\u003cdiv>\u003cspan class=\"scene-title\" id=\"sceneTitle\">13.56 MHz 자기장 → 태그 코일\u003c/span>\u003cspan class=\"scene-info\" id=\"sceneInfo\">서로 마주한 코일 사이에 변하는 자기선속이 형성됩니다.\u003c/span>\u003c/div>\u003cspan class=\"scene-badge\" id=\"sceneBadge\">자기 유도 결합\u003c/span>\u003c/div>\u003ccanvas id=\"scene\" aria-label=\"거리와 각도에 따른 자기장 및 태그 반응 그림\">\u003c/canvas>\u003cdiv class=\"model-note\">물리 원리를 위한 단순화된 모식도 · 길이/자기장 비축척\u003c/div>\u003cdiv class=\"drag-note\">⇆ 태그를 잡고 이동\u003c/div>\u003c/section>\n        \u003csection class=\"bottom-panel\" aria-label=\"실시간 측정 모형 결과\">\n          \u003cdiv class=\"metric\">\u003clabel id=\"m1Label\">상대 결합 세기\u003c/label>\u003cstrong class=\"sig\" id=\"m1\">—\u003c/strong>\u003csmall>기존 정규화 신호 모형 · 전력 실측값 아님\u003c/small>\u003c/div>\n          \u003cdiv class=\"metric\">\u003clabel id=\"m2Label\">유도기전력 지표\u003c/label>\u003cstrong id=\"m2\">—\u003c/strong>\u003csmall id=\"m2Note\">변하는 자기선속에 의해 생성\u003c/small>\u003c/div>\n          \u003cdiv class=\"metric\">\u003clabel>태그 인식 판정\u003c/label>\u003cstrong id=\"m3\">—\u003c/strong>\u003csmall id=\"m3Note\">모형의 가상 판정 기준 적용\u003c/small>\u003c/div>\n          \u003cdiv class=\"plot-wrap\">\u003cdiv class=\"plot-top\">\u003cspan id=\"graphTitle\">자기선속·유도 전압 · 시간\u003c/span>\u003cspan>느린 개념 시각화\u003c/span>\u003c/div>\u003ccanvas id=\"wave\" aria-label=\"유도 전압 또는 수신 신호의 시간 변화 그래프\">\u003c/canvas>\u003c/div>\n        \u003c/section>\n      \u003c/div>\n      \u003caside class=\"right-col\">\n        \u003cdiv class=\"section-label\">01 · 실험 조건 조절\u003c/div>\n        \u003cdiv class=\"control\">\u003cdiv class=\"control-head\">\u003clabel for=\"dist\">리더기 ↔ 태그 거리\u003c/label>\u003coutput id=\"distVal\" for=\"dist\">2.0 cm\u003c/output>\u003c/div>\u003cinput id=\"dist\" type=\"range\" min=\"0\" max=\"12\" step=\"0.1\" value=\"2\" />\u003cdiv class=\"range-hints\">\u003cspan>가까움\u003c/span>\u003cspan id=\"distMax\">12 cm\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"control\">\u003cdiv class=\"control-head\">\u003clabel for=\"angle\">태그 코일 기울기\u003c/label>\u003coutput id=\"angleVal\" for=\"angle\">0°\u003c/output>\u003c/div>\u003cinput id=\"angle\" type=\"range\" min=\"0\" max=\"90\" step=\"1\" value=\"0\" />\u003cdiv class=\"range-hints\">\u003cspan>0° · 평행\u003c/span>\u003cspan>90° · 수직\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"control\">\u003cdiv class=\"control-head\">\u003clabel for=\"power\">리더기 출력 (상대)\u003c/label>\u003coutput id=\"powerVal\" for=\"power\">100%\u003c/output>\u003c/div>\u003cinput id=\"power\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"100\" />\u003cdiv class=\"range-hints\">\u003cspan>꺼짐\u003c/span>\u003cspan>최대\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"divider\">\u003c/div>\n        \u003cdiv class=\"section-label\">02 · 태그 기록 / 읽기 \u003cspan id=\"simNote\" style=\"color:#b3cfe0;font-size:10px;font-weight:600\">가상 NFC 태그\u003c/span>\u003c/div>\n        \u003cdiv class=\"tag-box\">\u003cdiv class=\"tag-title\">\u003cspan id=\"tagPanelTitle\">태그에 저장할 정보\u003c/span>\u003cspan class=\"subtag\" id=\"tagHint\">실제 스마트폰 NFC 연결 아님\u003c/span>\u003c/div>\n          \u003cselect id=\"payload\" aria-label=\"태그에 기록할 정보\">\u003coption value=\"text\">📝 텍스트 · 과학탐구 모둠\u003c/option>\u003coption value=\"url\">🔗 URL · 탐구 안내 페이지\u003c/option>\u003coption value=\"contact\">👤 연락처 · 탐구 담당\u003c/option>\u003c/select>\n          \u003cp class=\"stored\" id=\"stored\">저장된 데이터: (비어 있음)\u003c/p>\u003cdiv class=\"actrow\">\u003cbutton class=\"act\" id=\"writeBtn\">✎ 태그 기록\u003c/button>\u003cbutton class=\"act primary\" id=\"readBtn\">⌁ 태그 읽기\u003c/button>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">태그를 가까이 하고 ‘태그 기록’ 또는 ‘태그 읽기’를 눌러보세요.\u003c/div>\n        \u003cdiv class=\"qa\">\u003ch3>💡 생각해 볼 문제\u003c/h3>\u003cp id=\"prompt\">① 거리를 2 cm에서 6 cm로 늘리면 결합 세기는 어떻게 달라질까요?\u003c/p>\u003cp id=\"prompt2\">② 태그를 90° 기울이면 왜 인식이 어려워질까요?\u003c/p>\u003c/div>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/section>\n  \u003csection id=\"concept\" class=\"tab-panel\">\n    \u003cdiv class=\"concept-wrap\">\n      \u003cdiv class=\"concept-heading\">\u003ch2>📘 NFC 탐구의 핵심 원리와 RFID 비교\u003c/h2>\u003cp>교과서의 ‘NFC 태그에 정보 기록 → 다른 기기로 읽기 → 생활 속 활용 구상’ 흐름에 맞춘 개념 정리입니다.\u003c/p>\u003c/div>\n      \u003cdiv class=\"concept-grid\">\n        \u003carticle class=\"concept-card\">\u003ch3>1. 배터리가 없는 태그가 어떻게 켜질까?\u003c/h3>\u003cdiv class=\"pictogram\">\u003cdiv class=\"pictobox\">📱 스마트폰\u003cbr/>\u003csmall>교류 전류·코일\u003c/small>\u003c/div>\u003cdiv class=\"arrow\">⇢\u003c/div>\u003cdiv class=\"pictobox\">◎ NFC 태그\u003cbr/>\u003csmall>코일·정류·칩\u003c/small>\u003c/div>\u003c/div>\u003cp>스마트폰의 NFC 리더기가 \u003cb>13.56 MHz 교류 자기장\u003c/b>을 만듭니다. 가까이 있는 태그 코일을 통과하는 \u003cb>자기선속이 시간에 따라 변하면 유도기전력\u003c/b>이 생깁니다. 태그 회로는 이 에너지를 정류·저장하여 작은 칩을 작동시킵니다.\u003c/p>\u003cp>태그는 저장 정보를 전송할 때 대개 \u003cb>부하 변조(load modulation)\u003c/b>로 리더기가 감지하는 신호를 변화시킵니다. 단순히 태그에서 전파를 새로 강하게 송신하는 그림과는 다릅니다.\u003c/p>\u003c/article>\n        \u003carticle class=\"concept-card\">\u003ch3>2. 패러데이 법칙과 실험 변수\u003c/h3>\u003cdiv class=\"formula\">ε = −N × dΦ\u003csub>B\u003c/sub> / dt\u003c/div>\u003cp>ε: 유도기전력(V), N: 코일 감은 수, Φ\u003csub>B\u003c/sub>: 자기선속(Wb). 마이너스 부호는 유도 효과가 자기선속의 변화를 방해하는 방향임을 뜻합니다(렌츠 법칙).\u003c/p>\u003cdiv class=\"formula\">Φ\u003csub>B\u003c/sub> = BA cos θ \u003cspan style=\"font-size:12px\">(균일한 자기장일 때)\u003c/span>\u003c/div>\u003cp>이 실험에서는 NFC 송신 주파수와 태그 코일 구조를 고정하므로 자기장 결합 지표와 유도전압 지표가 같은 비율로 변합니다.\u003c/p>\u003cp>태그를 멀리하면 코일에 도달하는 자기장이 약해지고, 코일 면의 법선과 자기장 방향 사이 각도 θ가 커지면 통과 자기선속이 작아집니다.\u003c/p>\u003cp class=\"formula-desc\">화면은 실제 회로의 임피던스·공진·안테나 구조를 계산하지 않습니다. 결과의 %와 성공/실패는 학습용 상대 지표이며 실측값이나 보편적 인식 거리 보장이 아닙니다.\u003c/p>\u003c/article>\n      \u003c/div>\n      \u003carticle class=\"concept-card\">\u003ch3>3. NFC 탐구: 기록 → 읽기 → 활용\u003c/h3>\u003cdiv class=\"steps\">\u003cdiv class=\"step\">\u003cb>① 태그 정보 선택\u003c/b>\u003cspan>텍스트, URL, 연락처 중 하나를 선택합니다.\u003c/span>\u003c/div>\u003cdiv class=\"step\">\u003cb>② 가까이 대고 기록\u003c/b>\u003cspan>코일 결합이 충분할 때 태그 메모리에 정보를 썼다고 가정합니다.\u003c/span>\u003c/div>\u003cdiv class=\"step\">\u003cb>③ 다른 기기로 읽기\u003c/b>\u003cspan>기록된 데이터를 읽고 공유되는 내용을 확인합니다.\u003c/span>\u003c/div>\u003cdiv class=\"step\">\u003cb>④ 생활 속 활용 설계\u003c/b>\u003cspan>안내판·와이파이 연결·교실 출결 등 활용을 구상하고 필요한 인증을 토론합니다.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"foot\">※ 이 파일의 기록/읽기는 가상 실험입니다. 실제 NFC 태그를 쓰거나 스마트폰 NFC 하드웨어에 접근하지 않습니다. 출결 확인에는 태그 인식만으로 신원을 확정할 수 없으므로 로그인·시간·중복 방지 등의 검증이 필요합니다.\u003c/p>\u003c/article>\n      \u003carticle class=\"concept-card\">\u003ch3>4. NFC와 RFID는 어떻게 다를까?\u003c/h3>\u003cdiv class=\"compare\">\u003ctable>\u003cthead>\u003ctr>\u003cth>비교\u003c/th>\u003cth>NFC\u003c/th>\u003cth>RFID · LF\u003c/th>\u003cth>RFID · UHF\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>관계\u003c/td>\u003ctd>\u003cspan class=\"highlight\">RFID의 한 종류\u003c/span>\u003c/td>\u003ctd>RFID의 한 종류\u003c/td>\u003ctd>RFID의 한 종류\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대표 주파수\u003c/td>\u003ctd>13.56 MHz (HF)\u003c/td>\u003ctd>125–134 kHz\u003c/td>\u003ctd>약 860–930 MHz (지역·규격별 차이)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주요 전달 원리\u003c/td>\u003ctd>근거리 자기 유도 결합\u003c/td>\u003ctd>근거리 자기 유도 결합\u003c/td>\u003ctd>전파 전달 및 후방산란(backscatter)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대략적 거리\u003c/td>\u003ctd>일반적으로 수 cm\u003c/td>\u003ctd>주로 수 cm~수십 cm\u003c/td>\u003ctd>설비·환경에 따라 수 m 이상도 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>용도\u003c/td>\u003ctd>스마트폰 태그, 결제, 교통\u003c/td>\u003ctd>동물 식별, 출입 통제\u003c/td>\u003ctd>물류 재고, 자산·상품 추적\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp style=\"font-size:12px;color:#a8cee1\">NFC의 특징은 스마트폰 등에서 사용할 수 있도록 통신 방식·데이터 형식과 상호운용성을 규정하고, 태그 읽기/쓰기나 카드 에뮬레이션 같은 다양한 모드를 지원한다는 점입니다.\u003c/p>\u003cp style=\"font-size:12px;color:#a8cee1\">주의: RFID가 항상 멀리서 작동하는 것은 아닙니다. 특히 HF RFID 중에는 NFC와 같은 13.56 MHz를 쓰는 기술도 있습니다. 주파수와 안테나·프로토콜에 따라 실제 성능이 달라집니다.\u003c/p>\u003c/article>\n      \u003cdiv class=\"concept-grid\">\u003carticle class=\"concept-card\">\u003ch3>5. 실험 예상·관찰·해석\u003c/h3>\u003cp>\u003cb>거리:\u003c/b> 같은 방향에서는 가까울수록 자기 결합이 강해지는 경향을 확인합니다.\u003c/p>\u003cp>\u003cb>각도:\u003c/b> 자기장에 수직인 코일 면이 선속을 크게 받습니다. 여기서 0°는 코일 면끼리 평행한 상태를 뜻합니다.\u003c/p>\u003cp>\u003cb>출력:\u003c/b> 자기장을 만드는 리더기의 출력이 약해지면 유도되는 에너지 또한 줄어듭니다.\u003c/p>\u003cp>\u003cb>주파수/방식:\u003c/b> NFC·LF 모드와 UHF 모드는 에너지 결합 방식이 달라 서로의 %를 직접 비교하면 안 됩니다.\u003c/p>\u003c/article>\u003carticle class=\"concept-card\">\u003ch3>6. 수업에서 짚을 오개념\u003c/h3>\u003cp>❌ NFC는 RFID와 전혀 다른 방식이다. → ✅ \u003cb>NFC는 HF RFID 기반의 표준화된 근거리 통신 방식\u003c/b>입니다.\u003c/p>\u003cp>❌ 스마트폰 자기장이 태그에 정보를 직접 새긴다. → ✅ 자기장은 작동 에너지를 제공하고, 칩·통신 규약·메모리가 데이터 기록에 관여합니다.\u003c/p>\u003cp>❌ 태그의 배터리가 방전되면 못 읽는다. → ✅ \u003cb>수동형 태그는 배터리 없이\u003c/b> 리더기에서 에너지를 받습니다.\u003c/p>\u003cp>❌ UHF RFID도 NFC와 똑같은 코일 유도 방식이다. → ✅ 원거리 UHF RFID에는 전파와 후방산란을 주로 설명해야 합니다.\u003c/p>\u003c/article>\u003c/div>\n      \u003cdiv class=\"notice\">\u003cb>실험 모델의 범위\u003c/b> · NFC/LF 모드에서 자기장 거리 감쇠는 동축 원형 코일의 축상 자기장 형태 B(z) ∝ [1+(z/a)²]\u003csup>−3/2\u003c/sup>를 사용한 교육용 근사입니다. 실제 안테나는 형태와 공진 조건이 다양합니다. UHF 모드는 다른 거리 감쇠 모형과 가상 응답 지표를 쓰며 자기선속·유도기전력 계산을 적용하지 않습니다. 속도가 느리게 그려진 파동은 관찰용 애니메이션으로 실제 MHz 주기를 나타내지 않습니다.\u003c/div>\n      \u003cdiv class=\"sources\">\u003cb>개념 근거\u003c/b> · \u003ca href=\"https://nfc-forum.org/learn/nfc-technology/\" target=\"_blank\" rel=\"noopener noreferrer\">NFC Forum — NFC Technology\u003c/a> · \u003ca href=\"https://www.st.com/en/applications/connectivity/nfc-rfid.html\" target=\"_blank\" rel=\"noopener noreferrer\">STMicroelectronics — NFC/RFID\u003c/a> · \u003ca href=\"https://support.gs1.org/support/solutions/articles/43000734278-what-is-the-difference-between-low-high-and-ultra-high-frequencies-\" target=\"_blank\" rel=\"noopener noreferrer\">GS1 — LF/HF/UHF 분류\u003c/a> (자료 열람은 인터넷 연결 시 가능, 실험은 완전 오프라인 실행)\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\u003cscript>\n(() => {\n'use strict';\nconst $ = id => document.getElementById(id);\nconst scene=$('scene'),ctx=scene.getContext('2d'),wave=$('wave'),wctx=wave.getContext('2d');\nconst cfg={nfc:{name:'NFC',max:12,unit:'cm',def:2,f:'13.56 MHz',ax:3,th:.20},lf:{name:'RFID LF',max:40,unit:'cm',def:8,f:'125 kHz',ax:10,th:.20},uhf:{name:'RFID UHF',max:10,unit:'m',def:2,f:'920 MHz',ax:3.2,th:.23}};\nlet mode='nfc',distance=2,angle=0,power=100,payload='text',memory=null,feedback='',lastRead=null;\nlet animOn=true,tPrev=0,time=0,tagHit=null,drag=false,graphArray=[];\nconst values={text:'과학탐구 모둠 · 전자기 유도 관찰',url:'https://example.org/nfc-study (예시 주소)',contact:'과학탐구 담당 · 교실 안내용 연락처'};\nconst clamp=(n,a,b)=>Math.max(a,Math.min(b,n));\nfunction signal(){let fac=power/100,ori=Math.abs(Math.cos(angle*Math.PI/180)); if(mode==='uhf'){let d=distance;return clamp(fac*(.25+.75*ori)/(1+(d/cfg.uhf.ax)**2),0,1)} return clamp(fac*ori/Math.pow(1+(distance/cfg[mode].ax)**2,1.5),0,1)}\nfunction readOK(){return signal()>=cfg[mode].th}\nfunction formattedDist(){return distance.toFixed(1)+' '+cfg[mode].unit}\nfunction statusText(){return readOK()?'인식 가능':'인식 불가'}\nfunction notify(msg,warn=false){$('feedback').textContent=msg;$('feedback').classList.toggle('warn',warn)}\nfunction renderValues(){const s=signal(),ok=readOK();$('distVal').textContent=formattedDist();$('angleVal').textContent=angle+'°';$('powerVal').textContent=power+'%';$('m1').textContent=Math.round(s*100)+'%';$('m2').textContent=Math.round(s*100)+'%';$('m3').textContent=statusText();$('m3').className=ok?'ok':'fail';$('m3Note').textContent=ok?'모형 기준을 넘었습니다':'거리·각도·출력을 조절하세요';$('stored').textContent=mode==='nfc'?'저장된 데이터: '+(memory===null?'(비어 있음)':memory):mode==='lf'?'태그 ID: LF-125-001 (가상 식별자)':'태그 ID: UHF-920-001 (가상 식별자)'}\nfunction adaptMode(){let c=cfg[mode];distance=c.def;angle=0;power=100;graphArray=[];$('dist').max=c.max;$('dist').step='0.1';$('dist').value=distance;$('angle').value=0;$('power').value=100;$('distMax').textContent=c.max+' '+c.unit;document.querySelectorAll('[data-mode]').forEach(btn=>{let yes=btn.dataset.mode===mode;btn.classList.toggle('active',yes);btn.setAttribute('aria-pressed',yes)});\nconst isUhf=mode==='uhf';$('sceneTitle').textContent=isUhf?'920 MHz 전파 → 태그의 반사 신호':`${c.f} 교류 자기장 → 태그 코일`;$('sceneInfo').textContent=isUhf?'UHF RFID는 원거리 전파와 후방산란으로 정보를 주고받습니다.':'코일을 통과하는 자기선속 변화가 태그에 에너지를 제공합니다.';$('sceneBadge').textContent=isUhf?'전파·후방산란':'자기 유도 결합';$('m1Label').textContent=isUhf?'가상 수신 지표':'상대 결합 세기';$('m2Label').textContent=isUhf?'반사 신호 지표':'유도기전력 지표';$('m2Note').textContent=isUhf?'기존 인식 모형의 정규화 지표':'변화하는 자기선속의 유도 효과';$('graphTitle').textContent=isUhf?'입사파·반사파 · 시간':'자기선속·유도 전압 · 시간';$('simNote').textContent=isUhf?'가상 UHF 태그':mode==='lf'?'가상 LF 태그':'가상 NFC 태그';$('tagPanelTitle').textContent=mode==='nfc'?'태그에 저장할 정보':'태그 식별 정보 읽기';$('payload').hidden=mode!=='nfc';$('writeBtn').hidden=mode!=='nfc';$('readBtn').textContent=mode==='nfc'?'⌁ 태그 읽기':'⌁ ID 읽기';$('prompt').textContent=mode==='nfc'?'① 거리를 2 cm에서 6 cm로 늘리면 결합 세기는 어떻게 달라질까요?':mode==='lf'?'① 저주파 RFID의 에너지 전달 원리는 NFC와 비슷할까요?':'① UHF는 왜 수 m 거리에서도 태그를 식별할 수 있을까요?';$('prompt2').textContent=isUhf?'② 이 모드에 패러데이 코일 유도 계산을 그대로 적용해도 될까요?':'② 코일을 90° 기울이면 왜 유도 효과가 약해질까요?';notify(mode==='nfc'?'조건을 조절하고 태그에 기록한 뒤 다른 기기처럼 읽어보세요.':isUhf?'UHF 모드는 NFC와 다른 원리인 전파·후방산란 모형입니다.':'LF RFID 역시 가까운 코일 사이의 자기 유도 결합을 이용합니다.');renderValues()}\nfunction switchTab(tab){document.querySelectorAll('.tab-panel').forEach(x=>x.classList.toggle('active',x.id===tab));document.querySelectorAll('[data-tab]').forEach(x=>{let active=x.dataset.tab===tab;x.classList.toggle('active',active);x.setAttribute('aria-pressed',active)});if(tab==='lab'){requestAnimationFrame(()=>{resizes();drawScene();drawGraph()})}}\nfor(const btn of document.querySelectorAll('[data-tab]')) btn.addEventListener('click',()=>switchTab(btn.dataset.tab));\nfor(const btn of document.querySelectorAll('[data-mode]')) btn.addEventListener('click',()=>{mode=btn.dataset.mode;adaptMode();});\n$('resetBtn').addEventListener('click',()=>{memory=null;payload='text';$('payload').value='text';mode='nfc';time=0;adaptMode();notify('모든 조건과 가상 태그 데이터를 초기화했습니다.')});\n$('dist').addEventListener('input',e=>{distance=Number(e.target.value);renderValues()});$('angle').addEventListener('input',e=>{angle=Number(e.target.value);renderValues()});$('power').addEventListener('input',e=>{power=Number(e.target.value);renderValues()});$('payload').addEventListener('change',e=>{payload=e.target.value;notify('내용을 선택했습니다. 실제 저장 내용은 ‘태그 기록’을 눌러야 바뀝니다.')});\n$('writeBtn').addEventListener('click',()=>{if(mode!=='nfc')return;if(!readOK()){notify('기록 실패: 결합이 약합니다. 태그를 가깝게 하고 각도·출력을 조절하세요.',true);return}memory=values[payload];renderValues();notify('기록 성공! 가상 태그에 '+memory+'을(를) 저장했습니다.')});\n$('readBtn').addEventListener('click',()=>{if(!readOK()){notify('읽기 실패: 현재 조건에서는 태그를 인식하지 못합니다.',true);return}if(mode==='nfc'){notify(memory===null?'태그는 인식했지만 저장된 정보가 없습니다. 먼저 기록해 보세요.':'읽기 성공! 저장된 내용: '+memory)}else notify('식별 성공! '+(mode==='lf'?'LF-125-001':'UHF-920-001')+' (가상 ID)')});\nfunction fit(canvas,context){let rect=canvas.getBoundingClientRect();if(rect.width\u003c=0||rect.height\u003c=0)return null;const dpr=Math.min(window.devicePixelRatio||1,2);let w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}context.setTransform(dpr,0,0,dpr,0,0);return {w:rect.width,h:rect.height}}\nfunction resizes(){fit(scene,ctx);fit(wave,wctx)}\nfunction rr(c,x,y,w,h,r,fill,stroke=null,line=1){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.lineWidth=line;c.strokeStyle=stroke;c.stroke()}}\nfunction text(c,str,x,y,color,size=12,weight='600',align='center'){c.fillStyle=color;c.font=`${weight} ${size}px system-ui,-apple-system,'Malgun Gothic',sans-serif`;c.textAlign=align;c.fillText(str,x,y)}\nfunction beam(c,pts,color,width,alpha=1){c.save();c.globalAlpha=alpha;c.beginPath();c.moveTo(...pts[0]);for(let i=1;i\u003cpts.length;i++)c.lineTo(...pts[i]);c.lineWidth=width;c.strokeStyle=color;c.lineCap='round';c.stroke();c.restore()}\nfunction drawScene(){const D=fit(scene,ctx);if(!D)return;const {w,h}=D;ctx.clearRect(0,0,w,h);\n// Render in a fixed educational coordinate system, preserving broad margins and labels.\nconst mob=w\u003c600;ctx.save();ctx.scale(w/(mob?640:950),h/460);let c=ctx,s=signal(),isUHF=mode==='uhf';const xL=mob?145:242,yC=247;\nlet xR=(mob?343:440)+distance/cfg[mode].max*(mob?190:355);tagHit={x:xR,y:yC,r:80,w,h};const phase=time*1.8;\n// Soft halo for active reader\nconst g=c.createRadialGradient(xL,yC,10,xL,yC,220);g.addColorStop(0,isUHF?'#ffbf722a':'#55efd028');g.addColorStop(1,'#00a5a500');c.fillStyle=g;c.beginPath();c.arc(xL,yC,230,0,Math.PI*2);c.fill();\n// Axis and range ruler\nc.setLineDash([5,6]);c.strokeStyle='#3f6484';c.lineWidth=1;c.beginPath();c.moveTo(xL+42,yC+144);c.lineTo(xR-23,yC+144);c.stroke();c.setLineDash([]);\ntext(c,'거리 '+formattedDist(),(xL+xR)/2+5,yC+163,'#b2d6ee',15,'800');\n// Field lines / radio waves, schematic only\nif(!isUHF){for(let i=0;i\u003c7;i++){let mag=(i-3);const A=(43+Math.abs(mag)*16);let dy=mag*8;for(const side of [-1,1]){c.beginPath();c.moveTo(xL+32,yC+dy);c.bezierCurveTo(xL+90,yC+side*A,xR-66,yC+side*A,xR-26,yC+dy*.4);c.lineWidth=i===3?3.4:1.7;c.globalAlpha=(.17+.64*s)*(.72+.28*Math.sin(phase+i*0.6));c.strokeStyle=i===3?'#8effde':'#49c3e1';c.stroke();c.globalAlpha=1;}}\n for(let j=0;j\u003c5;j++){let shift=((time*.12+j/5)%1);let bx=xL+37+(xR-xL-68)*shift;c.beginPath();c.fillStyle=`rgba(130,255,218,${.13+.75*s})`;c.shadowColor='#65ffda';c.shadowBlur=10;c.arc(bx,yC+Math.sin(shift*Math.PI)*17*Math.sin(j*1.7),2.6+1.2*s,0,Math.PI*2);c.fill();c.shadowBlur=0;}\n}else{for(let i=0;i\u003c5;i++){let xx=xL+65+((time*.25+i/5)%1)*(xR-xL+60);let spread=20+xx/11;c.strokeStyle='#ffb86e';c.lineWidth=2.2;c.globalAlpha=.20+.65*s;c.beginPath();c.arc(xx,yC,spread,-.46*Math.PI,.46*Math.PI);c.stroke();c.globalAlpha=1}\n c.setLineDash([6,8]);c.strokeStyle='#ffd184';c.globalAlpha=.5*s;c.beginPath();c.moveTo(xR-30,yC-24);c.quadraticCurveTo((xL+xR)/2,yC-100,xL+40,yC-35);c.stroke();c.globalAlpha=1;c.setLineDash([])}\n// Phone / RFID reader.\nconst c1=isUHF?'#9f7445':'#4fcbbd';rr(c,xL-53,yC-114,108,228,22,'#193349','#6495a3',3);rr(c,xL-42,yC-103,86,205,15,'#0b1e30','#27526b',1.5);rr(c,xL-14,yC-97,28,4,2,'#5c859e');\nif(!isUHF){for(let i=0;i\u003c4;i++){c.beginPath();c.ellipse(xL,yC,23+i*7,57+i*9,0,0,Math.PI*2);c.strokeStyle=`rgba(87,236,199,${.8 awake&&rx>=1e-10,lambda,pol,threshold:1e-10}}\nconst fmt=(v,n=2)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.01||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString();\nfunction ln(x,y,X,Y,c='#425f78',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=13,align='center'){g.font=size+'px system-ui';g.textAlign=align;g.fillStyle=c;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=35){if(Math.hypot(dx,dy)\u003c1e-12||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.3);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.3);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.3)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction coil(x,y,r,flat,col){for(let j=0;j\u003c5;j++){g.beginPath();g.ellipse(x,y,(r-j*4)*flat,r-j*4,0,0,2*PI);g.strokeStyle=col;g.lineWidth=2.6;g.stroke()}}\nfunction scene(m){let y=H*.28,x1=W*.22,x2=W*.65,rx=Math.min(W*.12,H*.16),U=isU(s),d=U?s.uhfd:s.d,max=U?10:12;x2=W*.50+W*.27*d/max;let flat=Math.max(.035,Math.abs(Math.cos(s.angle*PI/180)));rect(x1-rx-9,y-rx-18,2*rx+18,2*rx+36,'#1e384e');if(!U){coil(x1,y,rx,1,'#e3a465');coil(x2,y,rx*.8,flat,'#d5a4ef');for(let j=-2;j\u003c=2;j++){g.beginPath();g.moveTo(x1+rx,y+j*10);g.bezierCurveTo(x1+rx+30,y+j*28,x2-rx-30,y+j*28,x2-rx*.8*flat,y+j*9);g.strokeStyle='#64c8f3';g.globalAlpha=Math.min(.9,.25+m.B*1e5);g.lineWidth=1.6;g.stroke();g.globalAlpha=1}rect(x2-8,y-6,16,12,'#78e4bc');txt('정류·칩',x2,y+rx+18,'#9ae3d1',11);txt('코일 유도 결합 · 법선 각도 θ',W/2,18,'#c5dbea',12)}\n else{ln(x1-rx,y,x1+rx,y,'#e5ac69',6);ln(x2-rx*.8*flat,y-rx*.8*Math.sin(s.angle*PI/180),x2+rx*.8*flat,y+rx*.8*Math.sin(s.angle*PI/180),'#d5a4ef',6);rect(x2-9,y-7,18,14,'#78e4bc');if(!s.active)arr(x1+rx+10,y-30,1,0,'#6ecaff',Math.max(5,x2-x1-2*rx-20));if(m.awake)arr(x2-rx,y+30,-1,0,'#f5c17e',Math.max(5,x2-x1-2*rx-20));if(s.active){rect(x2-15,y+20,30,15,'#6ba88b');txt('BAT',x2,y+31,'white',10)}txt(s.active?'능동 태그 자체 송신 → 리더 수신':'수동 태그: 입사 전파 → 변조 후방산란',W/2,18,'#c5dbea',12)}\n if(tab===3&&s.metal){let mx=x2+rx*.84+8+s.space*.6;rect(mx,y-rx,9,2*rx,'#9ca9b4');txt('금속',mx,y-rx-9,'#d5e0ea',11)}txt('리더',x1,y+rx+31,'#edc28c',12);txt(U&&s.active?'능동 태그':'수동 태그',x2,y+rx+33,'#dcb6f5',12);txt('거리 '+fmt(d,1)+(U?' m':' cm')+' · 각도 '+s.angle+'° · 장면은 개념 배율',W/2,H*.54,'#b6cde0',12)}\nfunction graph(){let U=isU(s),l=58,r=W-15,top=H*.65,b=H-30,min=U?1:0,max=U?10:12,lo=-12,hi=0,X=d=>l+(r-l)*(d-min)/(max-min),Y=P=>b-(Math.log10(Math.max(1e-12,P))-lo)/(hi-lo)*(b-top);for(let j=0;j\u003c=4;j++){let ex=lo+j*3,yy=Y(10**ex);ln(l,yy,r,yy,'#30485f');txt('10^'+ex,l-5,yy+3,'#abc3d7',10,'right')}for(let j=0;j\u003c=4;j++){let d=min+(max-min)*j/4;txt(fmt(d,1),X(d),b+15,'#b3c9dc',10)}\n let power=m=>U?m.rx:m.dc;\n for(let [p,col] of [[saved[0],'#f6bd78'],[saved[1],'#e5a0c8'],[s,'#6ae2ce']]){if(!p||isU(p)!==U)continue;g.save();g.beginPath();g.rect(l,top,r-l,b-top);g.clip();g.beginPath();for(let j=0;j\u003c=120;j++){let d=min+(max-min)*j/120,m=model({...p,[U?'uhfd':'d']:d}),yy=Y(power(m));j?g.lineTo(X(d),yy):g.moveTo(X(d),yy)}g.strokeStyle=col;g.lineWidth=2.2;g.stroke();g.restore()}let m=model(s);ln(X(U?s.uhfd:s.d),top,X(U?s.uhfd:s.d),b,'#f6dd97');let y=Y(m.threshold);ln(l,y,r,y,'#ee9ca7',1);txt(U?'리더 수신 전력 (W)':'태그 정류 전력 (W)',l,top-8,'#d1e2ef',11,'left');txt('거리 ('+(U?'m':'cm')+') · 로그축 · 청록 현재 / 노랑 A / 분홍 B',W/2,H-6,'#b1c8dc',11)}\nfunction draw(){let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#152b40');gr.addColorStop(1,'#081321');g.fillStyle=gr;g.fillRect(0,0,W,H);scene(model(s));graph()}\nfunction summary(p){let m=model(p);return isU(p)?'수신 '+fmt(m.rx*1e9)+' nW':'정류 '+fmt(m.dc*1000)+' mW'}\nfunction update(){let m=model(s),U=isU(s),rows=U?[['태그 입사 전력',fmt(m.forward*1000)+' mW'],['편파 정합 계수',fmt(m.pol,3)],['리더 수신 전력',fmt(m.rx*1e9)+' nW'],['태그 전원',s.active?'자체 배터리':m.awake?'입사 전력 충분':'입사 전력 부족'],['모형 인식',m.ok?'가능':'불가'],['파장',fmt(m.lambda,3)+' m']]:[['자기장 실효값',fmt(m.B*1e6,3)+' μT'],['한 회 선속 실효값',fmt(m.phi*1e9,3)+' nWb'],['유도 전압 실효값',fmt(m.V,3)+' V'],['최대 가용 교류 전력',fmt(m.P*1000,3)+' mW'],['정류 전력 근사',fmt(m.dc*1000,3)+' mW'],['반사 임피던스 지표',fmt(m.refl,4)+' Ω'],['가상 전원 판정',m.ok?'기준 충족':'기준 미달']];if(tab===3)rows.push(['금속 영향 진폭 계수',fmt(factor(s),3)]);$('metrics').innerHTML=rows.map(([n,v])=>'\u003cdiv class=\"metric\">'+n+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('formula').textContent=U?'P태그 = EIRP·G태그·(λ/4πd)²·cos²θ · 수동형은 왕복 경로 손실':'B = μ₀NIa²/[2(a²+d²)^(3/2)] · ε = 2πfN태그AB|cosθ| · P가용=ε²/(4R)';$('assume').textContent=(U?'920 MHz 예시, 자유공간 원거리·편파 정합, 태그 이득 1.5, 리더 수신 이득 2. 수동 태그는 입사 전력의 10%를 변조 산란하는 단순 모형이며 10 μW 기동·0.1 nW 수신 기준은 가상값. 능동 태그는 자체 비콘을 송신하며 질의 응답 모델이 아닙니다.':'원형 송신 코일 축상 자기장, 작은 수신 코일·균일장 근사. NFC 13.56 MHz 또는 LF 125 kHz 예시. 리더 전류 일정, 수신 코일의 등가 저항과 정합을 가정. 정류 효율은 고정 근사. 0.1 mW는 가상 전원 기준이며 실제 읽기 성공을 보장하지 않습니다. 반사 임피던스는 공진 저항성 부하의 지표입니다.')+(tab===3?' 금속 영향은 사용자가 지정한 가상 감쇠와 간격 회복 계수로 표현합니다. 실제 금속의 재질·두께·안테나 재조정·반사는 계산하지 않습니다.':'');$('hint').textContent=tab===1?'거리를 늘리거나 코일을 90° 기울여 자기장·선속·유도 전압·정류 전력을 각각 비교하세요.':tab===2?'수동 태그는 전원과 응답 링크가 모두 필요합니다. 능동 비콘의 자체 전원 및 수신 신호를 비교하세요.':'금속 없는 조건과 금속 가까이의 조건을 A·B로 저장하고 간격을 바꾸어 상대 변화를 탐구하세요.';draw()}\nfunction slider(k,n,min,max,step){let el=document.createElement('label');el.innerHTML=n+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];update()};$('controls').append(el)}\nfunction choice(k,n,opts){let el=document.createElement('label');el.textContent=n;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;if(k==='tech')saved=[null,null];build()};el.append(e);$('controls').append(el)}\nfunction build(){$('title').textContent=['','NFC·LF 유도 전원 ,area=PI*(lf?.012:.008)**2,B=MU*p.N*p.I*r*r/(2*(r*r+d*d)**1.5)*metal,phi=B*area*a,V=2*PI*f*n*phi,P=V*V/(4*p.R),dc=p.eta*P,M=p.I? n*phi/p.I:MU*p.N*r*r*n*area*a*metal/(2*(r*r+d*d)**1.5),refl=(2*PI*f*M)**2/p.R;return{B,phi,V,P,dc,M,refl,f,threshold:1e-4,ok:dc>=1e-4}}\n let f=920e6,lambda=C/f,loss=(lambda/(4*PI*p.uhfd))**2,pol=a*a,forward=p.eirp*1e-3*1.5*loss*pol*metal*metal,back=forward*.1*1.5*2*loss*pol*metal*metal,beacon=p.tx*1e-3*1.5*2*loss*pol*metal*metal,rx=p.active?beacon:back,awake=p.active||forward>=1e-5;return{forward,back,beacon,rx,awake,ok:!!awake&&rx>=1e-10,lambda,pol,threshold:1e-10}}\nconst fmt=(v,n=2)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.01||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString();\nfunction ln(x,y,X,Y,c='#425f78',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=13,align='center'){g.font=size+'px system-ui';g.textAlign=align;g.fillStyle=c;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=35){if(Math.hypot(dx,dy)\u003c1e-12||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.3);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.3);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.3)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction coil(x,y,r,flat,col){for(let j=0;j\u003c5;j++){g.beginPath();g.ellipse(x,y,(r-j*4)*flat,r-j*4,0,0,2*PI);g.strokeStyle=col;g.lineWidth=2.6;g.stroke()}}\nfunction scene(m){let y=H*.28,x1=W*.22,x2=W*.65,rx=Math.min(W*.12,H*.16),U=isU(s),d=U?s.uhfd:s.d,max=U?10:12;x2=W*.50+W*.27*d/max;let flat=Math.max(.035,Math.abs(Math.cos(s.angle*PI/180)));rect(x1-rx-9,y-rx-18,2*rx+18,2*rx+36,'#1e384e');if(!U){coil(x1,y,rx,1,'#e3a465');coil(x2,y,rx*.8,flat,'#d5a4ef');for(let j=-2;j\u003c=2;j++){g.beginPath();g.moveTo(x1+rx,y+j*10);g.bezierCurveTo(x1+rx+30,y+j*28,x2-rx-30,y+j*28,x2-rx*.8*flat,y+j*9);g.strokeStyle='#64c8f3';g.globalAlpha=Math.min(.9,.25+m.B*1e5);g.lineWidth=1.6;g.stroke();g.globalAlpha=1}rect(x2-8,y-6,16,12,'#78e4bc');txt('정류·칩',x2,y+rx+18,'#9ae3d1',11);txt('코일 유도 결합 · 법선 각도 θ',W/2,18,'#c5dbea',12)}\n else{ln(x1-rx,y,x1+rx,y,'#e5ac69',6);ln(x2-rx*.8*flat,y-rx*.8*Math.sin(s.angle*PI/180),x2+rx*.8*flat,y+rx*.8*Math.sin(s.angle*PI/180),'#d5a4ef',6);rect(x2-9,y-7,18,14,'#78e4bc');if(!s.active)arr(x1+rx+10,y-30,1,0,'#6ecaff',Math.max(5,x2-x1-2*rx-20));if(m.awake)arr(x2-rx,y+30,-1,0,'#f5c17e',Math.max(5,x2-x1-2*rx-20));if(s.active){rect(x2-15,y+20,30,15,'#6ba88b');txt('BAT',x2,y+31,'white',10)}txt(s.active?'능동 태그 자체 송신 → 리더 수신':'수동 태그: 입사 전파 → 변조 후방산란',W/2,18,'#c5dbea',12)}\n if(tab===3&&s.metal){let mx=x2+rx*.84+8+s.space*.6;rect(mx,y-rx,9,2*rx,'#9ca9b4');txt('금속',mx,y-rx-9,'#d5e0ea',11)}txt('리더',x1,y+rx+31,'#edc28c',12);txt(U&&s.active?'능동 태그':'수동 태그',x2,y+rx+33,'#dcb6f5',12);txt('거리 '+fmt(d,1)+(U?' m':' cm')+' · 각도 '+s.angle+'° · 장면은 개념 배율',W/2,H*.54,'#b6cde0',12)}\nfunction graph(){let U=isU(s),l=58,r=W-15,top=H*.65,b=H-30,min=U?1:0,max=U?10:12,lo=-12,hi=0,X=d=>l+(r-l)*(d-min)/(max-min),Y=P=>b-(Math.log10(Math.max(1e-12,P))-lo)/(hi-lo)*(b-top);for(let j=0;j\u003c=4;j++){let ex=lo+j*3,yy=Y(10**ex);ln(l,yy,r,yy,'#30485f');txt('10^'+ex,l-5,yy+3,'#abc3d7',10,'right')}for(let j=0;j\u003c=4;j++){let d=min+(max-min)*j/4;txt(fmt(d,1),X(d),b+15,'#b3c9dc',10)}\n let power=m=>U?m.rx:m.dc;\n for(let [p,col] of [[saved[0],'#f6bd78'],[saved[1],'#e5a0c8'],[s,'#6ae2ce']]){if(!p||isU(p)!==U)continue;g.save();g.beginPath();g.rect(l,top,r-l,b-top);g.clip();g.beginPath();for(let j=0;j\u003c=120;j++){let d=min+(max-min)*j/120,m=model({...p,[U?'uhfd':'d']:d}),yy=Y(power(m));j?g.lineTo(X(d),yy):g.moveTo(X(d),yy)}g.strokeStyle=col;g.lineWidth=2.2;g.stroke();g.restore()}let m=model(s);ln(X(U?s.uhfd:s.d),top,X(U?s.uhfd:s.d),b,'#f6dd97');let y=Y(m.threshold);ln(l,y,r,y,'#ee9ca7',1);txt(U?'리더 수신 전력 (W)':'태그 정류 전력 (W)',l,top-8,'#d1e2ef',11,'left');txt('거리 ('+(U?'m':'cm')+') · 로그축 · 청록 현재 / 노랑 A / 분홍 B',W/2,H-6,'#b1c8dc',11)}\nfunction draw( x),cv=$('cv'),g=cv.getContext('2d'),PI=Math.PI,MU=4*PI*1e-7,C=299792458;\nconst base=()=>({tech:0,d:2,angle:0,I:.2,N:5,R:30,eta:.5,uhfd:2,eirp:500,active:0,tx:1,metal:0,space:0,loss:.2});\nlet s=base(),W=800,H=440,saved=[null,null];\nconst isU=p=>tab===2||(tab===3&&p.tech===2);\nfunction factor(p){return p.metal? p.loss+(1-p.loss)*(1-Math.exp(-p.space/8)):1}\nfunction model(p){let a=Math.abs(Math.cos(p.angle*PI/180));if(a\u003c1e-12)a=0;let metal=tab===3?factor(p):1;\n if(!isU(p)){let lf=p.tech===1,f=lf?125e3:13.56e6,r=lf?.05:.025,d=p.d/100,n=lf?40:4,area=PI*(lf?.012:.008)**2,B=MU*p.N*p.I*r*r/(2*(r*r+d*d)**1.5)*metal,phi=B*area*a,V=2*PI*f*n*phi,P=V*V/(4*p.R),dc=p.eta*P,M=p.I? n*phi/p.I:MU*p.N*r*r*n*area*a*metal/(2*(r*r+d*d)**1.5),refl=(2*PI*f*M)**2/p.R;return{B,phi,V,P,dc,M,refl,f,threshold:1e-4,ok:dc>=1e-4}}\n let f=920e6,lambda=C/f,loss=(lambda/(4*PI*p.uhfd))**2,pol=a*a,forward=p.eirp*1e-3*1.5*loss*pol*metal*metal,back=forward*.1*1.5*2*loss*pol*metal*metal,beacon=p.tx*1e-3*1.5*2*loss*pol*metal*metal,rx=p.active?beacon:back,awake=p.active||forward>=1e-5;return{forward,back,beacon,rx,awake,ok:!!awake&&rx>=1e-10,lambda,pol,threshold:1e-10}}\nconst fmt=(v,n=2)=>!Number.isFinite(v)?'—':v!==0&&(Math.abs(v)\u003c.01||Math.abs(v)>=1e5)?v.toExponential(2):Number(v.toFixed(n)).toString();\nfunction ln(x,y,X,Y,c='#425f78',w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}\nfunction txt(v,x,y,c='#dceaf8',size=13,align='center'){g.font=size+'px system-ui';g.textAlign=align;g.fillStyle=c;g.fillText(v,x,y)}\nfunction arr(x,y,dx,dy,c,len=35){if(Math.hypot(dx,dy)\u003c1e-12||len\u003c=0)return;let a=Math.atan2(dy,dx),X=x+len*Math.cos(a),Y=y+len*Math.sin(a);ln(x,y,X,Y,c,2.3);ln(X,Y,X-8*Math.cos(a-.5),Y-8*Math.sin(a-.5),c,2.3);ln(X,Y,X-8*Math.cos(a+.5),Y-8*Math.sin(a+.5),c,2.3)}\nfunction rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}\nfunction coil(x,y,r,flat,col){for(let j=0;j\u003c5;j++){g.beginPath();g.ellipse(x,y,(r-j*4)*flat,r-j*4,0,0,2*PI);g.strokeStyle=col;g.lineWidth=2.6;g.stroke()}}\nfunction scene(m){let y=H*.28,x1=W*.22,x2=W*.65,rx=Math.min(W*.12,H*.16),U=isU(s),d=U?s.uhfd:s.d,max=U?10:12;x2=W*.50+W*.27*d/max;let flat=Math.max(.035,Math.abs(Math.cos(s.angle*PI/180)));rect(x1-rx-9,y-rx-18,2*rx+18,2*rx+36,'#1e384e');if(!U){coil(x1,y,rx,1,'#e3a465');coil(x2,y,rx*.8,flat,'#d5a4ef');for(let j=-2;j\u003c=2;j++){g.beginPath();g.moveTo(x1+rx,y+j*10);g.bezierCurveTo(x1+rx+30,y+j*28,x2-rx-30,y+j*28,x2-rx*.8*flat,y+j*9);g.strokeStyle='#64c8f3';g.globalAlpha=Math.min(.9,.25+m.B*1e5);g.lineWidth=1.6;g.stroke();g.globalAlpha=1}rect(x2-8,y-6,16,12,'#78e4bc');txt('정류·칩',x2,y+rx+18,'#9ae3d1',11);txt('코일 유도 결합 · 법선 각도 θ',W/2,18,'#c5dbea',12)}\n else{ln(x1-rx,y,x1+rx,y,'#e5ac69',6);ln(x2-rx*.8*flat,y-rx*.8*Math.sin(s.angle*PI/180),x2+rx*.8*flat,y+rx*.8*Math.sin(s.angle*PI/180),'#d5a4ef',6);rect(x2-9,y-7,18,14,'#78e4bc');if(!s.active)arr(x1+rx+10,y-30,1,0,'#6ecaff',Math.max(5,x2-x1-2*rx-20));if(m.awake)arr(x2-rx,y+30,-1,0,'#f5c17e',Math.max(5,x2-x1-2*rx-20));if(s.active){rect(x2-15,y+20,30,15,'#6ba88b');txt('BAT',x2,y+31,'white',10)}txt(s.active?'능동 태그 자체 송신 → 리더 수신':'수동 태그: 입사 전파 → 변조 후방산란',W/2,18,'#c5dbea',12)}\n if(tab===3&&s.metal){let mx=x2+rx*.84+8+s.space*.6;rect(mx,y-rx,9,2*rx,'#9ca9b4');txt('금속',mx,y-rx-9,'#d5e0ea',11)}txt('리더',x1,y+rx+31,'#edc28c',12);txt(U&&s.active?'능동 태그':'수동 태그',x2,y+rx+33,'#dcb6f5',12);txt('거리 '+fmt(d,1)+(U?' m':' cm')+' · 각도 '+s.angle+'° · 장면은 개념 배율',W/2,H*.54,'#b6cde0',12)}\nfunction graph(){let U=isU(s),l=58,r=W-15,top=H*.65,b=H-30,min=U?1:0,max=U?10:12,lo=-12,hi=0,X=d=>l+(r-l)*(d-min)/(max-min),Y=P=>b-(Math.log10(Math.max(1e-12,P))-lo)/(hi-lo)*(b-top);for(let j=0;j\u003c=4;j++){let ex=lo+j*3,yy=Y(10**ex);ln(l,yy,r,yy,'#30485f');txt('10^'+ex,l-5,yy+3,'#abc3d7',10,'right')}for(let j=0;j\u003c=4;j++){let d=min+(max-min)*j/4;txt(fmt(d,1),X(d),b+15,'#b3c9dc',10)}\n let power=m=>U?m.rx:m.dc;\n for(let [p,col] of [[saved[0],'#f6bd78'],[saved[1],'#e5a0c8'],[s,'#6ae2ce']]){if(!p||isU(p)!==U)continue;g.save();g.beginPath();g.rect(l,top,r-l,b-top);g.clip();g.beginPath();for(let j=0;j\u003c=120;j++){let d=min+(max-min)*j/120,m=model({...p,[U?'uhfd':'d']:d}),yy=Y(power(m));j?g.lineTo(X(d),yy):g.moveTo(X(d),yy)}g.strokeStyle=col;g.lineWidth=2.2;g.stroke();g.restore()}let m=model(s);ln(X(U?s.uhfd:s.d),top,X(U?s.uhfd:s.d),b,'#f6dd97');let y=Y(m.threshold);ln(l,y,r,y,'#ee9ca7',1);txt(U?'리더 수신 전력 (W)':'태그 정류 전력 (W)',l,top-8,'#d1e2ef',11,'left');txt('거리 ('+(U?'m':'cm')+') · 로그축 · 청록 현재 / 노랑 A / 분홍 B',W/2,H-6,'#b1c8dc',11)}\nfunction draw(){let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#152b40');gr.addColorStop(1,'#081321');g.fillStyle=gr;g.fillRect(0,0,W,H);scene(model(s));graph()}\nfunction summary(p){let m=model(p);return isU(p)?'수신 '+fmt(m.rx*1e9)+' nW':'정류 '+fmt(m.dc*1000)+' mW'}\nfunction update(){let m=model(s),U=isU(s),rows=U?[['태그 입사 전력',fmt(m.forward*1000)+' mW'],['편파 정합 계수',fmt(m.pol,3)],['리더 수신 전력',fmt(m.rx*1e9)+' nW'],['태그 전원',s.active?'자체 배터리':m.awake?'입사 전력 충분':'입사 전력 부족'],['모형 인식',m.ok?'가능':'불가'],['파장',fmt(m.lambda,3)+' m']]:[['자기장 실효값',fmt(m.B*1e6,3)+' μT'],['한 회 선속 실효값',fmt(m.phi*1e9,3)+' nWb'],['유도 전압 실효값',fmt(m.V,3)+' V'],['최대 가용 교류 전력',fmt(m.P*1000,3)+' mW'],['정류 전력 근사',fmt(m.dc*1000,3)+' mW'],['반사 임피던스 지표',fmt(m.refl,4)+' Ω'],['가상 전원 판정',m.ok?'기준 충족':'기준 미달']];if(tab===3)rows.push(['금속 영향 진폭 계수',fmt(factor(s),3)]);$('metrics').innerHTML=rows.map(([n,v])=>'\u003cdiv class=\"metric\">'+n+'\u003cb>'+v+'\u003c/b>\u003c/div>').join('');$('compare').textContent=saved.map((p,i)=>['A','B'][i]+': '+(p?summary(p):'미저장')).join(' | ');$('formula').textContent=U?'P태그 = EIRP·G태그·(λ/4πd)²·cos²θ · 수동형은 왕복 경로 손실':'B = μ₀NIa²/[2(a²+d²)^(3/2)] · ε = 2πfN태그AB|cosθ| · P가용=ε²/(4R)';$('assume').textContent=(U?'920 MHz 예시, 자유공간 원거리·편파 정합, 태그 이득 1.5, 리더 수신 이득 2. 수동 태그는 입사 전력의 10%를 변조 산란하는 단순 모형이며 10 μW 기동·0.1 nW 수신 기준은 가상값. 능동 태그는 자체 비콘을 송신하며 질의 응답 모델이 아닙니다.':'원형 송신 코일 축상 자기장, 작은 수신 코일·균일장 근사. NFC 13.56 MHz 또는 LF 125 kHz 예시. 리더 전류 일정, 수신 코일의 등가 저항과 정합을 가정. 정류 효율은 고정 근사. 0.1 mW는 가상 전원 기준이며 실제 읽기 성공을 보장하지 않습니다. 반사 임피던스는 공진 저항성 부하의 지표입니다.')+(tab===3?' 금속 영향은 사용자가 지정한 가상 감쇠와 간격 회복 계수로 표현합니다. 실제 금속의 재질·두께·안테나 재조정·반사는 계산하지 않습니다.':'');$('hint').textContent=tab===1?'거리를 늘리거나 코일을 90° 기울여 자기장·선속·유도 전압·정류 전력을 각각 비교하세요.':tab===2?'수동 태그는 전원과 응답 링크가 모두 필요합니다. 능동 비콘의 자체 전원 및 수신 신호를 비교하세요.':'금속 없는 조건과 금속 가까이의 조건을 A·B로 저장하고 간격을 바꾸어 상대 변화를 탐구하세요.';draw()}\nfunction slider(k,n,min,max,step){let el=document.createElement('label');el.innerHTML=n+' \u003coutput>'+s[k]+'\u003c/output>\u003cinput type=\"range\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" value=\"'+s[k]+'\">';el.querySelector('input').oninput=e=>{s[k]=+e.target.value;el.querySelector('output').textContent=s[k];update()};$('controls').append(el)}\nfunction choice(k,n,opts){let el=document.createElement('label');el.textContent=n;let e=document.createElement('select');opts.forEach(([v,n])=>e.add(new Option(n,v)));e.value=s[k];e.onchange=()=>{s[k]=+e.value;if(k==='tech')saved=[null,null];build()};el.append(e);$('controls').append(el)}\nfunction build(){$('title').textContent=['','NFC·LF 유도 전원','수동형·능동형 UHF','금속과 안테나 방향'][tab];$('controls').innerHTML='';if(tab===1)choice('tech','방식',[[0,'NFC 13.56 MHz'],[1,'LF 125 kHz']]);if(tab===3)choice('tech','방식',[[0,'NFC'],[1,'LF'],[2,'UHF']]);if(isU(s)){choice('active','태그 전원',[[0,'수동형'],[1,'능동 비콘']]);slider('uhfd','거리 (m)',1,10,.1);slider('eirp','리더 EIRP (mW)',10,1000,10);if(s.active)slider('tx','비콘 송신 전력 (mW)',.1,10,.1)}else{slider('d','거리 (cm)',0,12,.1);slider('I','송신 실효 전류 (A)',.05,.5,.05);slider('N','송신 코일 감은 수',1,10,1);slider('R','수신 등가 저항 (Ω)',10,100,5);slider('eta','정류 효율 (비율)',.1,.9,.05)}slider('angle',isU(s)?'편파 각도 (°)':'법선 각도 (°)',0,90,5);if(tab===3){choice('metal','금속 근접',[[0,'없음'],[1,'있음']]);slider('space','금속과 간격 (mm)',0,30,1);slider('loss','가상 근접 진폭 계수',.05,1,.05)}update()}\nfunction resize(){let r=cv.getBoundingClientRect();if(!r.width||!r.height)return;W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw()}\n$('reset').onclick=()=>{s=base();saved=[null,null];build()};['sa','sb'].forEach((id,i)=>$(id).onclick=()=>{saved[i]={...s};update()});new ResizeObserver(resize).observe(cv);build();resize();\n\u003c/script>\u003c/body>\u003c/html>","\u003c!doctype html>\u003chtml lang=\"ko\">\u003cmeta charset=\"utf-8\">\u003cstyle>body{background:#081321;color:#e5eef8;font:16px/1.7 system-ui;margin:20px auto;padding:0 16px;max-width:920px}h2{color:#78e6cf}table{border-collapse:collapse;width:100%}td,th{border:1px solid #496078;padding:9px;text-align:left}p{color:#c5d8e8}\u003c/style>\u003ch2>NFC와 RFID의 관계\u003c/h2>\u003cp>NFC는 13.56 MHz HF RFID 기술에 기반한 근거리 통신 방식입니다. RFID에는 LF, HF, UHF 등 다양한 방식이 있습니다. 주파수만으로 실제 통신 거리가 결정되지는 않습니다.\u003c/p>\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>NFC·LF 수동형\u003c/th>\u003cth>UHF 수동형\u003c/th>\u003cth>능동형 비콘\u003c/th>\u003c/tr>\u003ctr>\u003ctd>에너지\u003c/td>\u003ctd>유도 결합 후 정류\u003c/td>\u003ctd>입사 전파 수확\u003c/td>\u003ctd>배터리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>응답\u003c/td>\u003ctd>부하 변조\u003c/td>\u003ctd>변조 후방산란\u003c/td>\u003ctd>자체 전파 송신\u003c/td>\u003c/tr>\u003c/table>\u003ch2>자기장·전압·전력은 서로 다릅니다\u003c/h2>\u003cp>같은 코일에서 자기장 실효값과 선속 실효값에 비례하여 유도 전압이 변합니다. 고정 저항의 가용 전력은 전압의 제곱에 비례합니다. 코일 법선과 자기장의 각도가 90°이면 이상적 균일장에서 선속이 0입니다. UHF에서는 선형 편파의 불일치로 수신 전력이 cos²θ에 비례하는 이상 모델을 사용합니다.\u003c/p>\u003ch2>금속의 영향\u003c/h2>\u003cp>근거리 코일 근처 금속에는 맴돌이 전류가 생기고 공진 조건이 달라질 수 있습니다. UHF에서는 반사, 차폐 및 안테나 임피던스 변화가 발생할 수 있습니다. 금속용 태그나 페라이트 등으로 개선하는 경우가 있지만 반드시 성능이 감소하거나 회복되는 것은 아닙니다. 실험의 금속 감쇠는 가상 조건입니다.\u003c/p>\u003ch2>학생 탐구\u003c/h2>\u003cp>① NFC 거리·각도를 바꾸고 전압과 전력의 변화율을 비교하세요. ② 수동 UHF의 전원 조건과 응답 수신 조건을 구분하세요. ③ 능동 태그가 배터리를 사용하더라도 리더의 수신 전력은 거리에 따라 감소하는지 확인하세요. ④ 금속 영향 실험에서 A/B를 비교하세요. ⑤ 기초 탭의 가상 태그에 텍스트를 기록하고 읽으세요.\u003c/p>\u003cp>모든 읽기·기록과 판정은 교육용 가상 실험입니다. 실제 기기, 개인정보, NFC 하드웨어에는 접근하지 않습니다.\u003c/p>\u003c/html>"];const names=["기초·태그 읽기 및 기록","NFC·LF 유도 전원","수동형·능동형 UHF","금속과 안테나 방향","개념 설명"];c
