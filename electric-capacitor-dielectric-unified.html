'use strict';
const $=id=>document.getElementById(id),EPS=8.8541878128e-12,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,n=3)=>!Number.isFinite(x)?'—':x!==0&&Math.abs(x)<.001?x.toExponential(2):Number(x.toFixed(n)).toLocaleString('ko-KR');

let s=defaults(),ref={...s},cmpRef={...s},cmpVoltage=s.voltage,mode='plates',dirty=true,notice='극판 간격과 면적을 조절하세요.',saved={A:null,B:null},records=[],graphX='gap',graphY='C',graphMax=null,auto=null,paused=false,last=0,drag=null;
function change(id,v,fromDrag=false){if(id==='voltage'&&!s.connected)return;if(id==='voltage'){s.voltage=v;ref={...s};notice='전압 변경 · 에너지 기준을 재설정했습니다.'}else{s[id]=v;notice='조건 변경 · 실시간 계산'}if(!fromDrag){auto=null;paused=false;}dirty=true;sync()}
function setConnection(on){if(s.connected===on)return;const d=model(s);s.heldQ=d.Q;s.connected=on;ref={...s};auto=null;notice=on?'전지 연결 · 전압 일정. 재연결 과도현상은 생략합니다.':'전지 분리 · 현재 전하량 보존';dirty=true;build()}

for(const [id,label] of modes){const b=document.createElement('button');b.textContent=label;b.dataset.mode=id;b.setAttribute('role','tab');b.onclick=()=>switchMode(id);$('tabs').append(b)}$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(z=>z[0]===mode),j=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;switchMode(modes[j][0]);$('tabs').children[j].focus()});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};

function btn(id,label){return '<button id="'+id+'">'+label+'</button>'}function select(id,opts,val){return '<select id="'+id+'">'+opts.map(([k,v])=>'<option value="'+k+'" '+(k===val?'selected':'')+'>'+v+'</option>').join('')+'</select>'}

function build(){for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}const cc=$('controls'),dd=$('detail');cc.hidden=mode==='concept';$('scene').hidden=mode==='concept';$('meters').hidden=mode==='concept';dd.hidden=!['concept','graphs'].includes(mode);let h='<h2>실험 조건</h2>';
if(mode!=='concept'){h+=slider('area')+slider('gap')+slider('k')+slider('f')+slider('voltage');if(mode!=='compare')h+='<div class="row">'+btn('connect','전지 연결')+btn('disconnect','전지 분리')+'</div>';else h+='<div class="row">'+btn('cmp','공통 기준 설정')+'</div><p class="note">현재 형상과 설정 전압으로 두 축전기를 동일하게 충전한 후 오른쪽만 분리합니다.</p>';if(mode==='energy')h+='<div class="row">'+btn('base','현재 상태를 일의 기준으로')+'</div><p class="note">전지의 연결 상태와 전압을 유지한 채 형상을 변화시키는 준정적 과정.</p>';if(['plates','dielectric','compare'].includes(mode))h+='<div class="row">'+btn('play',paused?'▶ 재개':auto?'Ⅱ 일시정지':'▶ 자동 탐구')+btn('restart','↺ 탐구 초기화')+'</div><p class="note">자동 탐구: '+(mode==='plates'?'간격 1→8 mm':'유전체 0→100%')+' · 수동 조작도 가능합니다.</p>';if(mode==='graphs')h+='<div class="row">'+select('graphX',[['gap','간격 d'],['area','면적 A'],['f','삽입 비율'],['k','유전율 κ']],graphX)+select('graphY',[['C','전기용량 C'],['Q','전하량 Q'],['V','전압 V'],['E','전기장 E'],['U','에너지 U']],graphY)+btn('fit','축 범위 맞춤')+'</div><p class="note">가로축은 입력 전체 범위, 세로축은 처음 표시된 조건에 맞춰 고정됩니다. 범위를 넘으면 축 범위 맞춤을 누르세요.</p>';h+='<div class="group"><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('record','측정 기록')+btn('clear','기록 삭제')+btn('reset','전체 초기화')+'</div></div>'}cc.innerHTML=h;
if(mode==='concept')dd.innerHTML='<h3>1. 평행판 축전기</h3><p>전기용량 C=Q/V. 진공에서 C=ε₀A/d. 면적이 넓을수록, 간격이 작을수록 전기용량이 커진다.</p><h3>2. 유전체 삽입</h3><p>유전체가 극판 사이 간격 전체를 채우고 면적의 f만큼 삽입되면 공기 부분과 유전체 부분이 병렬인 모형이다. C=ε₀A[1+(κ−1)f]/d. 가장자리 효과를 무시하면 두 부분의 E=V/d는 같지만 자유전하 면밀도 D는 유전체 부분에서 κ배이다. 유전체의 결합전하는 양극판 가까이 음, 음극판 가까이 양으로 분극된다. 유전체가 극판 간격 일부만 채우는 직렬 모형과 다르다.</p><h3>3. 전지 연결 vs 분리</h3><p>연결: V 일정, Q=CV, U=½CV². 분리: Q 일정, V=Q/C, U=Q²/(2C). 예를 들어 간격이 두 배가 되면 연결 상태에서 C,Q,E,U가 절반이 된다. 분리 상태에서는 C가 절반, V와 U가 두 배가 되고 E와 Q는 일정하다(면적·유전체 조건 고정).</p><h3>4. 에너지와 외부의 일</h3><p>준정적 변화에서 ΔU=W전지+W외부. 정전압이면 W전지=VΔQ, 분리 상태에서는 W전지=0. W외부는 극판을 움직이거나 유전체를 이동시키는 외력이 한 일이다. 양수는 외부가 축전기에 에너지를 공급한 경우이다. 유전체가 끌려 들어갈 때 외력의 일은 음수가 될 수 있다. 전지 재연결 시 발생하는 저항 손실과 과도현상은 다루지 않는다.</p><h3>5. 탐구 질문</h3><p>① 간격을 두 배로 늘릴 때 연결·분리 상태의 전기장은? ② 유전체를 삽입하면 전하량과 에너지는 어떻게 달라질까? ③ 축전기의 에너지가 증가할 때 전지가 공급한 에너지와 항상 같을까?</p><p class="note">이상적인 평행판, 선형 유전체, 전기적 평형 모형. 도형의 간격과 전하 기호 개수는 관찰을 위한 확대·표현용이다.</p>';
for(const id of Object.keys(fields))bind(id,e=>{if(id==='voltage'&&mode==='compare'){cmpVoltage=+e.target.value;notice='공통 기준 설정을 누르면 비교 전압에 반영됩니다.';sync();dirty=true}else change(id,+e.target.value)},'input');bind('connect',()=>setConnection(true));bind('disconnect',()=>setConnection(false));bind('base',()=>{ref={...s};notice='일의 기준 상태 저장';dirty=true});bind('cmp',()=>{cmpRef={...s,voltage:cmpVoltage,connected:true};notice='동일 조건에서 충전 후 오른쪽 전지 분리';dirty=true});bind('play',()=>{if(auto){paused=!paused}else{const id=mode==='plates'?'gap':'f';s[id]=fields[id][1];auto={id,start:fields[id][1],end:fields[id][2],t:0};paused=false}notice=paused?'일시정지':'자동 탐구 진행 중';sync();dirty=true});bind('restart',()=>{auto=null;paused=false;s.gap=2;s.f=0;notice='탐구 초기화 · 전지 분리 시 전하량 유지';build();dirty=true});
for(const k of ['A','B'])bind('save'+k,()=>{saved[k]={...(mode==='compare'?compareStates()[k==='A'?0:1]:s)};notice=mode==='compare'?'조건 '+k+' 저장 ('+(k==='A'?'연결':'분리')+')':'조건 '+k+' 저장';dirty=true});bind('record',()=>{records.push(...(mode==='compare'?compareStates().map(a=>({...a})):[{...s}]));while(records.length>30)records.shift();notice='측정 기록 '+records.length+'개';dirty=true});bind('clear',()=>{records=[];saved={A:null,B:null};notice='기록 삭제';dirty=true});bind('reset',()=>{s=defaults();ref={...s};cmpRef={...s};cmpVoltage=s.voltage;saved={A:null,B:null};records=[];graphMax=null;auto=null;paused=false;notice='전체 초기화';build();dirty=true});bind('fit',()=>{graphMax=null;dirty=true});for(const id of ['graphX','graphY'])bind(id,e=>{if(id==='graphX'){graphX=e.target.value;graphMax=null;}else graphY=e.target.value;graphMax=null;dirty=true},'change');sync();resize()}
function sync(){for(const id of Object.keys(fields)){if($(id)){const v=id==='voltage'&&mode==='compare'?cmpVoltage:s[id];$(id).value=v;$(id+'out').textContent=display(id,v)}}if($('connect'))$('connect').classList.toggle('on',s.connected);if($('disconnect'))$('disconnect').classList.toggle('on',!s.connected);if($('play'))$('play').textContent=auto?(paused?'▶ 재개':'Ⅱ 일시정지'):'▶ 자동 탐구'}
const c=$('canvas'),g=c.getContext('2d');let w=1,h=1,dpr=1,S=1,ox=0,oy=0,hit=null;

function txt(t,x,y,col='#d7e9f7',size=16,align='center'){g.fillStyle=col;g.font='600 '+size+'px system-ui';g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y)}
function line(p,col='#a4bfce',width=2){g.strokeStyle=col;g.lineWidth=width;g.lineCap='round';g.lineJoin='round';g.beginPath();p.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.stroke()}

function background(){g.fillStyle='#081624';g.fillRect(0,0,900,440);for(let x=0;x<900;x+=40)line([[x,0],[x,440]],'#15283a',1);for(let y=0;y<440;y+=40)line([[0,y],[900,y]],'#15283a',1)}
function plate(x,y,L,positive){const dep=38,dy=24,th=12;const gr=g.createLinearGradient(0,y-dy,0,y+th);gr.addColorStop(0,positive?'#eeb5a1':'#b3d9f0');gr.addColorStop(.7,positive?'#92565a':'#477c9d');poly([[x,y],[x+L,y],[x+L+dep,y-dy],[x+dep,y-dy]],gr);poly([[x,y],[x+L,y],[x+L,y+th],[x,y+th]],positive?'#a95f61':'#4d83a5');poly([[x+L,y],[x+L+dep,y-dy],[x+L+dep,y-dy+th],[x+L,y+th]],positive?'#75424e':'#315e7d')}
function drawCap(a,cx,cy,scale=1,tag='',interactive=false){const d=model(a),L=180+200*Math.sqrt(a.area/400),gap=45+a.gap*17,top=cy-gap/2,bot=cy+gap/2,x=cx-L/2-19,dep=38,dy=24;g.save();g.translate(cx,cy);g.scale(scale,scale);g.translate(-cx,-cy);
plate(x,bot,L,false);
if(a.f>0){const l=L*a.f,start=x+L-l;poly([[start,top+12],[x+L,top+12],[x+L,bot],[start,bot]],'rgba(72,169,154,.34)','#78e2c6');poly([[x+L,top+12],[x+L+dep,top+12-dy],[x+L+dep,bot-dy],[x+L,bot]],'rgba(65,144,143,.45)','#70c6be');if(d.E>0&&a.k>1){const n=Math.max(1,Math.round(a.f*8));for(let i=0;i<n;i++){const px=start+(i+.5)*l/n;txt('−',px,top+26,'#9fd4ff',15);txt('+',px,bot-11,'#ffb4a0',15);if(mode==='dielectric'){const yy=(top+bot)/2;line([[px,yy-7],[px,yy+7]],'#a8c9cc',2);txt('−',px,yy-12,'#9fd4ff',12);txt('+',px,yy+12,'#ffb4a0',12)}}}txt('κ = '+fmt(a.k),x+L+dep+42,(top+bot)/2,'#7ce2c8',14)}
if(d.E>0){const n=9;for(let i=0;i<n;i++){const px=x+(i+.5)*L/n;arrow(px,top+20,Math.max(5,gap-42),'rgba(169,222,245,.7)')}}
plate(x,top,L,true);

const bx=x-75;line([[x+12,top-7],[bx,top-7],[bx,cy-35]],'#9bb7c9',3);line([[x+12,bot+8],[bx,bot+8],[bx,cy+35]],'#9bb7c9',3);if(a.connected){poly([[bx-22,cy-35],[bx+22,cy-35],[bx+22,cy+35],[bx-22,cy+35]],'#45657b','#a1c4d5');txt('+',bx,cy-20,'#ffd18b',18);txt('−',bx,cy+20,'#c0deed',18);txt(fmt(a.voltage)+' V',bx,cy,'#e2f1fb',13)}else{line([[bx,cy-35],[bx+18,cy-7]],'#ffd18b',3);line([[bx,cy+8],[bx,cy+35]],'#9bb7c9',3);txt('분리',bx-20,cy,'#ffd18b',13,'right')}

function compareStates(){const a={...s,voltage:cmpRef.voltage,connected:true},b={...a,connected:false,heldQ:model(cmpRef).Q};return [a,b]}

function drawGraph(){g.fillStyle='#081624';g.fillRect(0,0,w,h);const [label,xmin,xmax]=fields[graphX],[yl,fac]=yspec[graphY];const sets=[{a:s,color:'#72e7df'},...['A','B'].filter(k=>saved[k]).map(k=>({a:saved[k],color:k==='A'?'#ffd18b':'#cba6f7',dash:k==='A'?[7,4]:[2,4]}))];const val=(a,x)=>model({...a,[graphX]:x})[graphY]*fac;let max=0;for(const z of sets)for(let i=0;i<=100;i++)max=Math.max(max,val(z.a,xmin+(xmax-xmin)*i/100));if(graphMax===null)graphMax=Math.max(.001,max*1.12);max=graphMax;const L=58,R=w-18,T=27,B=h-33,X=x=>L+(x-xmin)/(xmax-xmin)*(R-L),Y=y=>B-y/max*(B-T);txt(yl+' — '+label,w/2,12,'#e0eef7',13);for(let i=0;i<=4;i++){const x=xmin+(xmax-xmin)*i/4,y=max*i/4;line([[X(x),T],[X(x),B]],'#2a4357',1);line([[L,Y(y)],[R,Y(y)]],'#2a4357',1);txt(fmt(graphX==='f'?x*100:x,1),X(x),B+12,'#a9c4d8',11);txt(fmt(y,2),L-5,Y(y),'#a9c4d8',10,'right')}g.save();g.beginPath();g.rect(L,T,R-L,B-T);g.clip();for(const z of sets){g.setLineDash(z.dash||[]);line(Array.from({length:121},(_,i)=>{const x=xmin+(xmax-xmin)*i/120;return [X(x),Y(val(z.a,x))]}),z.color,2.5);g.setLineDash([]);g.fillStyle=z.color;g.beginPath();g.arc(X(z.a[graphX]),Y(val(z.a,z.a[graphX])),5,0,Math.PI*2);g.fill()}g.restore();txt('현재 / A / B · '+fields[graphX][4],w/2,h-8,'#b6cde0',11)}
function refresh(){const d=model(s);let a=[['전기용량',fmt(d.C*1e12)+' pF'],['전하량 |Q|',fmt(d.Q*1e9)+' nC'],['전압',fmt(d.V)+' V'],['전기장',fmt(d.E/1000)+' kV/m'],['저장 에너지',fmt(d.U*1e9)+' nJ']];let hint='양극판에서 음극판 방향의 전기장 · 도형과 전하 기호는 표시용 확대입니다.';if(mode==='dielectric'){a.push(['유전체 결합전하 밀도',a.f>0?fmt(d.polar*1e6)+' μC/m²':'삽입 안 됨'],['공기부 자유전하 밀도',a.f<1?fmt(d.Dair*1e6)+' μC/m²':'공기부 없음'],['유전체부 자유전하 밀도',a.f>0?fmt(d.Ddie*1e6)+' μC/m²':'삽입 안 됨']);hint='유전체가 간격 전체를 채우는 면적 부분 삽입 모형. 공기와 유전체의 전기장은 같고 자유전하 밀도는 다릅니다.'}if(mode==='compare'){const [x,y]=compareStates().map(model);a=[['연결 / 분리 C',fmt(x.C*1e12)+' / '+fmt(y.C*1e12)+' pF'],['연결 / 분리 Q',fmt(x.Q*1e9)+' / '+fmt(y.Q*1e9)+' nC'],['연결 / 분리 V',fmt(x.V)+' / '+fmt(y.V)+' V'],['연결 / 분리 E',fmt(x.E/1000)+' / '+fmt(y.E/1000)+' kV/m'],['연결 / 분리 U',fmt(x.U*1e9)+' / '+fmt(y.U*1e9)+' nJ']];hint='두 축전기의 현재 형상은 같으며 오른쪽의 전하량은 공통 기준 설정 당시의 값으로 보존됩니다.'}if(mode==='energy'){const z=work(ref,s);a.push(['외력이 한 일',fmt(z.Wext*1e9)+' nJ']);hint='전압 또는 전지 연결 상태 변경 시 기준을 다시 설정합니다. 기계적 변화만 비교하는 준정적 에너지 수지.'}if(mode==='graphs'){hint='민트 현재, 노랑 A, 보라 B. 점은 각 조건의 현재 입력값입니다.';$('detail').innerHTML='<h3>측정 기록 ('+records.length+')</h3><div class="tablewrap"><table><thead><tr><th>조건</th><th>연결</th><th>d (mm)</th><th>A (cm²)</th><th>κ / f</th><th>C (pF)</th><th>Q (nC)</th><th>V (V)</th><th>E (kV/m)</th><th>U (nJ)</th></tr></thead><tbody>'+[...['A','B'].filter(k=>saved[k]).map(k=>[k,saved[k]]),...records.map((z,i)=>[i+1,z])].map(([k,z])=>{const d=model(z);return '<tr>'+[k,z.connected?'연결':'분리',fmt(z.gap),fmt(z.area),fmt(z.k)+' / '+fmt(z.f*100)+'%',fmt(d.C*1e12),fmt(d.Q*1e9),fmt(d.V),fmt(d.E/1000),fmt(d.U*1e9)].map(v=>'<td>'+v+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
$('heading').textContent=modes.find(z=>z[0]===mode)[1];$('meters').innerHTML=a.map(z=>'<div class="meter"><small>'+z[0]+'</small><b>'+z[1]+'</b></div>').join('');$('status').textContent=mode==='concept'?'':notice;$('hint').textContent=mode==='concept'?'':hint}
function pointer(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/S,y:(e.clientY-r.top-oy)/S}}
c.addEventListener('pointerdown',e=>{if(!['plates','dielectric'].includes(mode)||!hit)return;const p=pointer(e);if(Math.abs(p.x-hit.gx)<38&&p.y>hit.top-20&&p.y<hit.bot+20)drag={id:'gap',y:p.y,v:s.gap};else if(Math.abs(p.y-(hit.bot+24))<25&&p.x>hit.x-15&&p.x<hit.x+hit.L+15)drag={id:'f'};else return;auto=null;paused=false;c.setPointerCapture(e.pointerId);if(drag.id==='f')change('f',clamp(Math.round((hit.x+hit.L-p.x)/hit.L*20)/20,0,1),true)});
