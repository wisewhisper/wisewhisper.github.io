</style></head><body><header><h1>⚡ RC 회로 충전·방전 통합 실험실</h1><button id="full">⛶ 전체화면</button></header><nav id="tabs" role="tablist" aria-label="실험 선택"></nav><main><aside id="controls" class="panel controls"></aside><section class="panel stage"><h2 id="heading"></h2><div id="scene" class="scene"><canvas id="canvas" aria-label="RC 회로와 전압 전류 그래프"></canvas></div><div id="meters" class="meters"></div><div id="status" class="status" aria-live="polite"></div><p id="hint" class="note"></p><div id="detail" class="detail" hidden></div></section></main><footer>© 2026 WiseWhisper 온라인 과학실험실 · 제작: 최성규 (WiseWhisper) · 교육·비영리 이용 허용 · 저작권 표시 삭제·무단 공개 재배포·상업적 이용 금지 · <a href="https://wisewhisper.github.io/">원본 사이트</a></footer><script>
'use strict';
const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=(x,n=3)=>!Number.isFinite(x)?'—':Math.abs(x)<.000001?'0':Math.abs(x)<.001?x.toExponential(2):Number(x.toFixed(n)).toLocaleString('ko-KR');
const modes=[['circuit','충전·방전 회로'],['tau','시정수 비교'],['energy','에너지 분석'],['graphs','그래프·측정'],['concept','개념 설명']];
const defaults=()=>({R:10,C:220,V:9,speed:1,carrier:'current',R2:20,C2:220,compareType:'charge',xmode:'seconds',metric:'V'});
function segment(R,C,E,v0,t){const tau=R*C,d=v0-E,a=Math.exp(-Math.max(0,t)/tau),v=E+d*a,I=(E-v)/R,Q=C*v,U=.5*C*v*v,U0=.5*C*v0*v0,W=E*C*(v-v0),H=.5*C*d*d*(-Math.expm1(-2*Math.max(0,t)/tau));return{tau,v,I,Q,U,U0,W,H}}
function values(a,E,v0,t){return segment(a.R*1000,a.C*1e-6,E,v0,t)}
let s=defaults(),mode='circuit',connection='charge',running=false,ended=false,elapsed=0,segT=0,vc=0,v0=0,phase=0,last=0,sourceWork=0,heat=0,startU=0,notice='준비 · 시작을 눌러 충전하세요.',dirty=true,history=[],records=[],saved={A:null,B:null},axis=60,axisLocked=true,traceStep=.05;

function sample(force=false){if(!force&&history.length&&elapsed-history.at(-1).t<Math.min(traceStep,s.R*s.C*.001/30))return;const d=present();history.push({t:elapsed,V:vc,I:d.I*1000,Q:d.Q*1e6,U:d.U*1000,W:sourceWork*1000,H:heat*1000});if(history.length>6000)history.splice(1,1)}
function reset(initial=0,msg='준비 · 시작을 누르세요.'){running=false;ended=false;elapsed=segT=phase=sourceWork=heat=0;vc=v0=initial;startU=.5*s.C*1e-6*initial*initial;history=[];notice=msg;sample(true);dirty=true}
function switchConnection(k){if(k===connection)return;sample(true);connection=k;v0=vc;segT=0;ended=false;sample(true);notice=k==='open'?'개방 · 전하량과 전압 유지':k==='charge'?'충전 경로 연결 · 기존 축전기 전압 유지':'방전 경로 연결 · 기존 축전기 전압 유지';dirty=true;sync();refresh()}
function advance(dt){if(!running)return;if(connection==='open'){elapsed+=dt;segT+=dt;sample();return}const tau=s.R*s.C*.001,rem=Math.max(0,5*tau-segT),step=Math.min(dt,rem),a=values(s,target(),v0,segT),b=values(s,target(),v0,segT+step);vc=b.v;sourceWork+=b.W-a.W;heat+=b.H-a.H;segT+=step;elapsed+=step;phase+=((a.I+b.I)/2)*step*1000*48*(s.carrier==='electron'?-1:1);sample();if(segT>=5*tau-1e-10){running=false;ended=true;notice='5τ 관찰 종료 · 완전한 평형은 아니며 잔여 차이는 약 0.674%입니다.';sample(true)}}
function changeMode(m){if(running)sample(true);mode=m;running=false;notice=m==='tau'?'두 회로의 저항 또는 전기용량을 바꾸어 비교하세요.':'현재 회로 상태를 유지합니다.';build();dirty=true}
for(const [id,label] of modes){const b=document.createElement('button');b.dataset.mode=id;b.textContent=label;b.setAttribute('role','tab');b.onclick=()=>changeMode(id);$('tabs').append(b)}$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=modes.findIndex(z=>z[0]===mode),j=(i+(e.key==='ArrowRight'?1:-1)+modes.length)%modes.length;changeMode(modes[j][0]);$('tabs').children[j].focus()});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
const fields={R:['저항 R',1,30,1,'kΩ'],C:['전기용량 C',20,1000,20,'μF'],V:['전지 전압',1,12,.5,'V'],speed:['관찰 배속',.25,5,.25,'×'],R2:['비교 회로 저항',1,30,1,'kΩ'],C2:['비교 회로 용량',20,1000,20,'μF']};
function slider(id){const [label,min,max,step,unit]=fields[id];return '<div class="field"><label for="'+id+'">'+label+'<output id="'+id+'out">'+fmt(s[id])+' '+unit+'</output></label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[id]+'"></div>'}
function btn(id,label){return '<button id="'+id+'">'+label+'</button>'}function select(id,opts,val){return '<select id="'+id+'" aria-label="'+id+'">'+opts.map(([k,v])=>'<option value="'+k+'" '+(k===val?'selected':'')+'>'+v+'</option>').join('')+'</select>'}

function build(){for(const b of $('tabs').children){const on=b.dataset.mode===mode;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1}const cc=$('controls'),dd=$('detail');cc.hidden=mode==='concept';$('scene').hidden=mode==='concept';$('meters').hidden=mode==='concept';dd.hidden=!['concept','graphs'].includes(mode);let h='<h2>실험 조건</h2>';
if(mode!=='concept'){h+=slider('R')+slider('C')+slider('V');if(mode==='tau'){h+=slider('R2')+slider('C2')+select('compareType',[['charge','충전 비교'],['discharge','방전 비교']],s.compareType)+select('xmode',[['seconds','실제 시간 (s)'],['normalized','정규화 시간 t/τ']],s.xmode)+'<p class="note">동일 초기 전압 조건의 이론 곡선입니다.</p>'}else{h+='<div class="row">'+btn('charge','충전')+btn('discharge','방전')+btn('open','개방')+'</div>'+select('carrier',[['current','관습적 전류'],['electron','전자 이동']],s.carrier)+slider('speed')+'<div class="row">'+btn('play','▶ 시작')+btn('restart','↺ 초기 상태')+btn('fullCharge','완충 상태 준비')+'</div><p class="note">충전·방전·개방 전환은 현재 전압을 유지합니다. R, C, 전지 전압 변경은 새 실험을 시작합니다.</p>';if(mode==='graphs')h+=select('metric',[['V','전압 V (V)'],['I','전류 I (mA)'],['Q','전하량 Q (μC)'],['U','저장 에너지 U (mJ)']],s.metric)+'<div class="row">'+btn('fit','시간축 맞춤')+btn('wide','시간축 150 s')+btn('lock','축 고정 해제')+'</div>'}
h+='<div class="group"><div class="row">'+btn('saveA','A 저장')+btn('saveB','B 저장')+btn('record','측정 기록')+btn('clear','기록 삭제')+btn('reset','전체 초기화')+'</div></div>'}cc.innerHTML=h;
if(mode==='concept')dd.innerHTML='<h3>1. RC 회로의 시정수</h3><p>τ=RC. Ω×F=s. 1 kΩ×1 μF=0.001 s. 저항 또는 전기용량이 커지면 충전·방전이 느려진다.</p><h3>2. 충전과 방전</h3><p>전지 전압을 ε, 초기 축전기 전압을 V₀라 하면 충전 시 Vc=ε+(V₀−ε)e<sup>−t/τ</sup>, I=(ε−Vc)/R이다. 방전 시 Vc=V₀e<sup>−t/τ</sup>, I=−Vc/R이다. 양의 전류 방향은 충전 시의 관습적 전류 방향으로 정한다. 전자는 금속 도선에서 관습적 전류와 반대로 이동하며 축전기의 절연층을 통과하지 않는다.</p><h3>3. 시정수의 의미</h3><p>처음 전압이 0인 충전에서 1τ가 지나면 최종 전압의 63.2%, 방전에서는 초기 전압의 36.8%가 남는다. 5τ에서 차이는 약 0.674%로 감소하지만 완전히 0이 되는 것은 아니다.</p><h3>4. 에너지 보존</h3><p>축전기 U=½CVc², 전지가 한 일 W=εΔQ, 저항의 줄열 H=∫I²Rdt. U−U₀=W−H이다. 처음 비어 있는 축전기를 일정 전압으로 충분히 충전하면 전지의 공급 에너지 중 절반이 축전기에 저장되고 절반이 저항에서 열로 전달된다. 방전에서는 저장 에너지가 저항의 열로 전환된다.</p><h3>5. 탐구 질문</h3><p>① R 또는 C를 두 배로 하면 시정수는? ② 충전 도중 방전으로 전환하면 전압과 전류는 연속인가? ③ 전기용량이 커지면 같은 전압에서 저장 에너지는? ④ 5τ는 완전 충전인가?</p><p class="note">이상적인 전지·도선·축전기와 일정 저항, 순간 전환 스위치 모형. 누설과 내부저항은 무시한다. 자동 관찰은 구간별 5τ까지이며 개방에서는 전압이 유지된다.</p>';
for(const id of Object.keys(fields))bind(id,e=>{s[id]=+e.target.value;$(id+'out').textContent=fmt(s[id])+' '+fields[id][4];if(['R','C','V'].includes(id)){connection='charge';reset(0,'새 조건 · 초기 전압 0 V');}dirty=true;refresh()},'input');
for(const k of ['charge','discharge','open'])bind(k,()=>switchConnection(k));for(const id of ['carrier','compareType','xmode','metric'])bind(id,e=>{if(id==='carrier'&&s[id]!==e.target.value)phase=-phase;s[id]=e.target.value;dirty=true;refresh()},'change');
bind('play',()=>{if(running){running=false;sample(true);notice='일시정지 · 측정값 유지'}else if(ended){v0=vc;segT=0;ended=false;running=true;notice='현재 전압부터 추가 5τ 관찰'}else{running=true;notice='실험 진행 중'}dirty=true;sync()});bind('restart',()=>{connection='charge';reset(0);sync()});bind('fullCharge',()=>{connection='discharge';reset(s.V,'가상 완충 상태 준비 · 방전 시작 가능');sync()});
bind('fit',()=>{axis=Math.max(1,elapsed*1.1,5*s.R*s.C*.001,...Object.values(saved).filter(Boolean).map(z=>(z.history.at(-1)?.t||0)*1.1));axisLocked=true;dirty=true;sync()});bind('wide',()=>{axis=150;axisLocked=true;dirty=true;sync()});bind('lock',()=>{axisLocked=!axisLocked;dirty=true;sync()});
for(const k of ['A','B'])bind('save'+k,()=>{sample(true);saved[k]={s:{...s},history:history.map(z=>({...z}))};notice='조건 '+k+' 저장';dirty=true});bind('record',()=>{sample(true);records.push({...history.at(-1),R:s.R,C:s.C,type:connection});if(records.length>40)records.shift();notice='측정값 기록';dirty=true});bind('clear',()=>{records=[];saved={A:null,B:null};notice='기록 삭제';dirty=true});bind('reset',()=>{s=defaults();connection='charge';axis=60;axisLocked=true;records=[];saved={A:null,B:null};reset(0,'전체 초기화 완료');build()});sync();refresh();resize()}
function sync(){for(const k of ['charge','discharge','open'])if($(k))$(k).classList.toggle('on',k===connection);if($('play'))$('play').textContent=running?'Ⅱ 일시정지':ended?'▶ 추가 관찰':'▶ 시작 / 재개';if($('lock'))$('lock').textContent=axisLocked?'축 고정 해제':'축 고정'}
const c=$('canvas'),g=c.getContext('2d');let w=1,h=1,dpr=1,S=1,ox=0,oy=0;
function resize(){const r=c.getBoundingClientRect();if(!r.width||!r.height)return;w=r.width;h=r.height;dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);S=Math.min(w/900,h/440);ox=(w-900*S)/2;oy=(h-440*S)/2;dirty=true}new ResizeObserver(resize).observe($('scene'));
function txt(t,x,y,col='#d7e9f7',size=15,align='center'){g.fillStyle=col;g.font='600 '+size+'px system-ui';g.textAlign=align;g.textBaseline='middle';g.fillText(t,x,y)}
function line(p,col='#9bb7cb',width=3){g.strokeStyle=col;g.lineWidth=width;g.lineCap='round';g.lineJoin='round';g.beginPath();p.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.stroke()}
function rect(x,y,W,H,r,fill,stroke='#6b8da3'){g.fillStyle=fill;g.strokeStyle=stroke;g.lineWidth=1.4;g.beginPath();g.roundRect(x,y,W,H,r);g.fill();g.stroke()}
function dot(x,y,r=4,col='#74e8d5'){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function background(){g.fillStyle='#081624';g.fillRect(0,0,900,440);for(let x=0;x<900;x+=40)line([[x,0],[x,440]],'#15283a',1);for(let y=0;y<440;y+=40)line([[0,y],[900,y]],'#15283a',1)}
function flow(p,I){if(Math.abs(I)<.0000005||connection==='open')return;const spacing=38,alpha=clamp(Math.abs(I)*1000/.08,0,1),offset=((phase%spacing)+spacing)%spacing;let traveled=0;for(let j=1;j<p.length;j++){const a=p[j-1],b=p[j],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(!L)continue;let start=((offset-traveled)%spacing+spacing)%spacing;for(let x=start;x<L;x+=spacing)dot(a[0]+(b[0]-a[0])*x/L,a[1]+(b[1]-a[1])*x/L,3.5,'rgba(104,244,209,'+alpha+')');traveled+=L}}
function resistor(x,y){const gr=g.createLinearGradient(0,y-18,0,y+18);gr.addColorStop(0,'#e8bf94');gr.addColorStop(.5,'#a67447');gr.addColorStop(1,'#67432d');rect(x-65,y-18,130,36,8,gr,'#f6cc9b');txt(fmt(s.R)+' kΩ',x,y,'#fff2dc',17)}
function drawCircuit(){background();const d=present(),top=78,bot=345,capX=714,swX=250;
const batteryX=95;line([[batteryX,135],[batteryX,top],[swX-35,top]]);line([[batteryX,265],[batteryX,bot],[capX,bot],[capX,242]]);const gr=g.createLinearGradient(55,0,135,0);gr.addColorStop(0,'#36546a');gr.addColorStop(.5,'#b4cad6');gr.addColorStop(1,'#36546a');rect(57,135,76,130,10,gr);txt('+',batteryX,151,'#352a24',20);txt(fmt(s.V)+' V',batteryX,200,'#142735',22);txt('−',batteryX,247,'#223344',20);txt('전지',batteryX,286);
line([[swX+30,top],[430,top]]);line([[560,top],[capX,top],[capX,198]]);resistor(495,top);dot(swX+30,top,5,'#c7dde8');dot(swX-35,top,5,'#c7dde8');line([[swX-35,top+75],[swX-35,bot]],'#8ba9bf',3);dot(swX-35,top+75,5,'#c7dde8');
line([[swX+30,top],connection==='charge'?[swX-35,top]:connection==='discharge'?[swX-35,top+75]:[swX-23,top+29]],'#ffd28b',5);txt('전환 스위치',swX,43,'#ffd28b',15);txt('충전',swX-35,top-19,'#c9dce9',12);txt('방전',swX-35,top+96,'#c9dce9',12);
const charge=clamp(vc/12,0,1),plateGrad=g.createLinearGradient(650,0,780,0);plateGrad.addColorStop(0,'#708ca0');plateGrad.addColorStop(.5,'#d7e6ef');plateGrad.addColorStop(1,'#708ca0');rect(capX-68,188,136,15,5,plateGrad);rect(capX-68,237,136,15,5,plateGrad);if(vc>1e-5){const n=Math.max(1,Math.round(12*charge));for(let i=0;i<n;i++){let x=capX-59+(i+.5)*118/n;txt('+',x,196,'#8c2c2f',15);txt('−',x,245,'#205f9a',15);line([[x,207],[x,232]],'#74b7d6',1);line([[x-3,228],[x,232],[x+3,228]],'#74b7d6',1)}}txt('축전기 '+s.C+' μF',capX,278,'#c3deef',17);txt('Vc = '+fmt(vc)+' V',capX,306,'#75e7df',20);

if(connection==='discharge'){flow([[swX-35,bot],[swX-35,top+75],[swX+30,top],[430,top]],d.I);flow([[560,top],[capX,top],[capX,188]],d.I);flow([[capX,252],[capX,bot],[swX-35,bot]],d.I)}

function plot(box,title,xmax,ymin,ymax,sets,markers=[]){const [x,y,W,H]=box,L=x+53,R=x+W-13,T=y+25,B=y+H-30,X=v=>L+v/xmax*(R-L),Y=v=>B-(v-ymin)/(ymax-ymin)*(B-T);txt(title,x+W/2,y+10,'#dcebf7',12);for(let i=0;i<=4;i++){const xx=xmax*i/4,yy=ymin+(ymax-ymin)*i/4;line([[X(xx),T],[X(xx),B]],'#2c4357',1);line([[L,Y(yy)],[R,Y(yy)]],'#2c4357',1);txt(fmt(xx,2),X(xx),B+12,'#adc6d8',10);txt(fmt(yy,2),L-5,Y(yy),'#adc6d8',10,'right')}g.save();g.beginPath();g.rect(L,T,R-L,B-T);g.clip();for(const m of markers){line([[X(m),T],[X(m),B]],'#8b7656',1)}for(const z of sets){g.setLineDash(z.dash||[]);line(z.pts.map(p=>[X(p[0]),Y(p[1])]),z.color,2.5);g.setLineDash([])}g.restore()}
function graphTime(){if(!axisLocked)axis=Math.max(axis,elapsed*1.1);return axis}
function curves(metric){return [{history,color:'#72e7df'},...['A','B'].filter(k=>saved[k]).map(k=>({...saved[k],color:k==='A'?'#ffd18b':'#c9a4fa',dash:k==='A'?[7,4]:[2,4]}))].map(z=>({color:z.color,dash:z.dash,pts:z.history.map(p=>[p.t,p[metric]])}))}
function drawGraphs(){g.fillStyle='#081624';g.fillRect(0,0,w,h);const xmax=graphTime(),spec={V:['축전기 전압 (V)',0,12],I:['부호 있는 전류 (mA)',-12,12],Q:['전하량 (μC)',0,12000],U:['저장 에너지 (mJ)',0,72]},[label,min,max]=spec[s.metric],vert=w<650;plot([0,0,w,h*.60],label+' — 시간 (s)',xmax,min,max,curves(s.metric));plot([0,h*.60,w,h*.40],'전류 I (mA) — 시간 (s)',xmax,-12,12,curves('I'))}
function drawTau(){g.fillStyle='#081624';g.fillRect(0,0,w,h);const tau1=s.R*s.C*.001,tau2=s.R2*s.C2*.001,xmax=s.xmode==='seconds'?5*Math.max(tau1,tau2):5,charge=s.compareType==='charge';const mk=(a,color)=>({color,pts:Array.from({length:201},(_,i)=>{const x=xmax*i/200,t=s.xmode==='seconds'?x:x*a.R*a.C*.001,d=values(a,charge?s.V:0,charge?0:s.V,t);return[x,d.v]})});plot([0,0,w,h*.82],'전압 Vc (V) — '+(s.xmode==='seconds'?'시간 (s)':'t/τ'),xmax,0,12,[mk(s,'#72e7df'),mk({...s,R:s.R2,C:s.C2},'#ffd18b')],s.xmode==='seconds'?[tau1,tau2]:[1]);txt('민트 τ₁ = '+fmt(tau1)+' s · 노랑 τ₂ = '+fmt(tau2)+' s',w/2,h*.91,'#dcebf7',14)}
function drawEnergy(){background();const d=present(),arr=[['초기 저장 에너지',startU*1000,'#9bbce2'],['전지가 공급한 에너지',sourceWork*1000,'#ffd18b'],['현재 저장 에너지',d.U*1000,'#72e7df'],['저항에서 발생한 줄열',heat*1000,'#f3a27f']],max=Math.max(1,...arr.map(z=>z[1]));txt('U₀ + W전지 = U + Q줄열',450,30,'#deedf7',22);arr.forEach(([l,v,col],i)=>{const y=85+i*78;txt(l,35,y,'#c5dcee',17,'left');rect(35,y+19,650,25,5,'#1a3248');if(v>0){g.fillStyle=col;g.fillRect(37,y+21,646*v/max,21)}txt(fmt(v)+' mJ',710,y+31,col,18,'left')});txt('에너지 수지 오차 '+fmt((startU+sourceWork-d.U-heat)*1000,8)+' mJ',450,416,'#b5d8e7',16)}
function refresh(){const d=present();let a=[['시정수 τ',fmt(d.tau)+' s'],['축전기 전압',fmt(vc)+' V'],['전류 (충전 +)',fmt(d.I*1000)+' mA'],['전하량',fmt(d.Q*1e6)+' μC'],['저장 에너지',fmt(d.U*1000)+' mJ'],['전체 경과 시간',fmt(elapsed)+' s']];let hint='민트 점: '+(s.carrier==='current'?'관습적 전류':'전자 이동')+' · 전류가 감소하면 이동도 느려집니다. 5τ에서 자동 정지.';if(mode==='tau'){a=[['회로 A 시정수',fmt(s.R*s.C*.001)+' s'],['회로 B 시정수',fmt(s.R2*s.C2*.001)+' s'],['1τ 후 충전', '63.2%'],['1τ 후 방전','36.8%']];hint='실제 시간 축에서는 시정수 차이를, t/τ 축에서는 곡선의 일치 여부를 확인하세요.'}if(mode==='energy'){a.push(['전지 공급',fmt(sourceWork*1000)+' mJ'],['저항 줄열',fmt(heat*1000)+' mJ']);hint='충전·방전·개방을 연속 전환해도 누적 에너지 수지가 유지됩니다.'}if(mode==='graphs'){hint='민트: 현재, 노랑: A, 보라: B. 전류의 부호가 방향을 나타냅니다. 세로축은 입력 전체 범위에 맞춰 고정합니다.';$('detail').innerHTML='<div class="tablewrap"><table><thead><tr><th>시각 (s)</th><th>상태</th><th>R (kΩ)</th><th>C (μF)</th><th>Vc (V)</th><th>I (mA)</th><th>Q (μC)</th></tr></thead><tbody>'+records.map(z=>'<tr>'+[fmt(z.t),{charge:'충전',discharge:'방전',open:'개방'}[z.type],z.R,z.C,fmt(z.V),fmt(z.I),fmt(z.Q)].map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
$('heading').textContent=modes.find(z=>z[0]===mode)[1];$('meters').innerHTML=a.map(z=>'<div class="meter"><small>'+z[0]+'</small><b>'+z[1]+'</b></div>').join('');$('status').textContent=mode==='concept'?'':notice;$('hint').textContent=mode==='concept'?'':hint;sync()}
function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(running&&!document.hidden){advance(dt*s.speed);dirty=true}if(dirty&&mode!=='concept'&&w>1){g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#081624';g.fillRect(0,0,w,h);if(mode==='graphs')drawGraphs();else if(mode==='tau')drawTau();else{g.setTransform(dpr*S,0,0,dpr*S,dpr*ox,dpr*oy);if(mode==='energy')drawEnergy();else drawCircuit()}refresh();dirty=false}requestAnimationFrame(frame)}reset();build();requestAnimationFrame(frame);
